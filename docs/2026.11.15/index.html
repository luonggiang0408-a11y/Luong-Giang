*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}

.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}

.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}

.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}

.fb.bad{background:var(--bad-bg)}

.vi{color:var(--muted);font-size:14px}

.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}

.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}

.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}

.spres .tr{margin:0;font-style:italic}

.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}

@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

"a": "go back to work", "vi": "Hầu hết nhân viên sẽ đi làm trở lại vào thứ Hai khi kỳ nghỉ Tết kết thúc, dù vài người xin thêm một ngày để hồi sức.", "why": "go back to work after holiday.", "new": [{"w": "recover", "vi": "hồi phục"}, {"w": "extra", "vi": "thêm"}]}, {"type": "mc", "ctx": "Tech news", "tw": "so", "s": "The new smartphone is ___ expensive that only a small number of customers can afford to buy it in its first month.", "o": ["so", "too", "very"], "a": "so", "vi": "Điện thoại mới đắt đến nỗi chỉ một số ít khách có thể mua trong tháng đầu.", "why": "so + adj + that; too + adj + to.", "new": [{"w": "afford", "vi": "đủ khả năng mua"}, {"w": "customers", "vi": "khách hàng"}]}, {"type": "mc", "ctx": "Public speaking", "tw": "even when", "s": "She always feels confident speaking in public, ___ the audience is large and some of the people are famous.", "o": ["even when", "so that", "as if"], "a": "even when", "vi": "Cô luôn tự tin khi nói trước đám đông, ngay cả khi khán giả đông và có người nổi tiếng.", "why": "even when: ngay cả khi (bất chấp).", "new": [{"w": "confident", "vi": "tự tin"}, {"w": "audience", "vi": "khán giả"}]}, {"type": "mc", "ctx": "Road safety", "tw": "so that", "s": "Engineers have installed extra cameras along the highway ___ drivers can be warned quickly when an accident happens.", "o": ["so that", "even though", "as if"], "a": "so that", "vi": "Kỹ sư đã lắp thêm camera dọc đường cao tốc để tài xế được cảnh báo nhanh khi có tai nạn.", "why": "so that: chỉ mục đích.", "new": [{"w": "installed", "vi": "lắp đặt"}, {"w": "warned", "vi": "được cảnh báo"}]}, {"type": "mc", "ctx": "Cooking tips", "s": "The chef explained that every ___ must be tightly closed before cooking, because an open shell usually means the shellfish is no longer fresh.", "o": ["mussel", "squid", "salmon"], "a": "mussel", "tw": "mussel", "ipa": "/ˈmʌs.əl/", "vi": "Đầu bếp giải thích rằng mỗi con vẹm phải khép chặt vỏ trước khi nấu, vì vỏ mở thường có nghĩa là hải sản khô  slow down in busy streets because pedestrians sometimes ___ the kerb without warning, leaving very little time to brake.", "o": ["step off", "stay on", "lean against"], "a": "step off", "tw": "step off", "ipa": "/step ɒf/", "vi": "Người đi xe đạp phải đi chậm ở phố đông vì người đi bộ đôi khi bước xuống khỏi lề đường mà không báo trước, để lại rất ít thời gian phanh.", "why": "step off the kerb: bước xuống lòng đường.", "new": [{"w": "kerb", "vi": "lề đường"}, {"w": "brake", "vi": "phanh"}]}, {"type": "mc", "ctx": "After a crash", "s": "The paramedics said both drivers had only ___ and did not need to go to hospital, even though the cars were badly dented.", "o": ["a minor injury", "a major operation", "a heavy fine"], "a": "a minor injury", "tw": "a minor injury", "ipa": "/ə ˈmaɪnə ˈɪndʒəri/", "vi": "Nhân viên cứu thương nói cả hai tài xế chỉ bị thương nhẹ và không cần vào bệnh viện, dù hai chiếc xe bị móp nặng.", "why": "have a minor injury: bị thương nhẹ.", "new": [{"w": "paramedic", "vi": "nhân viên cứu thương"}, {"w": "dented", "vi": "bị móp"}]}, {"type": "mc", "ctx": "Storm warning", "s": "Engineers warn that if another storm hits the coast this winter, the old wooden pier is likely to ___ and may have to be demolished.", "o": ["be badly damaged", "be carefully measured", "be warmly welcomed"], "a": "be badly damaged", "tw": "be badly damaged", "ipa": "/ˈdæmɪdʒ/", "vi": "Các kỹ sư cảnh báo nếu một cơn bão nữa đổ bộ vào bờ biển mùa đông này, cầu tàu gỗ cũ có khả năng bị hư hại nặng và có thể phải phá dỡ.", "why": "be likely to be badly damaged: có khả năng bị hư hại nặng.", "new": [{"w": "pier", "vi": "cầu tàu"}, {"w": "demolish", "vi": "phá dỡ"}]}, {"type": "mc", "ctx": "School fees", "s": "In many countries, parents who ___ their children to private schools have to pay high fees every term, even though state education is free.", "o": ["send", "introduce", "invite"], "a": "send", "tw": "send someone to school", "ipa": "/send/", "vi": "Ở nhiều nước, cha mẹ cho con học trường tư phải đóng học phí cao mỗi học kỳ, dù giáo dục công lập miễn phí.", "why": "send + người + to + trường: cho ai theo học.", "new": [{"w": "fees", "vi": "học phí"}, {"w": "term", "vi": "học kỳ"}]}, {"type": "mc", "ctx": "Study or work", "s": "Anna wants to ___ as soon as she turns sixteen, although her teachers warn that finding a good job without qualifications will be difficult.", "o": ["leave school", "start school", "enjoy school"], "a": "leave school", "tw": "leave school", "ipa": "/liːv skuːl/", "vi": "Anna muốn nghỉ học ngay khi mười sáu tuổi, dù các giáo viên cảnh báo rằng tìm việc tốt khi không có bằng cấp sẽ khó.", "why": "leave school = rời trường (thường để đi làm).", "new": [{"w": "qualifications", "vi": "bằng cấp, chứng chỉ"}, {"w": "warn", "vi": "cảnh báo"}]}, {"type": "mc", "ctx": "Higher education", "s": "Only about half of the students in this region ___ university, mostly because the nearest campus is more than a hundred kilometres away.", "o": ["go on to", "run out of", "look up to"], "a": "go on to", "tw": "go on to", "ipa": "/ɡəʊ ɒn tuː/", "vi": "Chỉ khoảng một nửa số học sinh ở vùng này học tiếp lên đại học, chủ yếu vì khuôn viên gần nhất cách hơn một trăm cây số.", "why": "go on to university: học tiếp lên đại học.", "new": [{"w": "region", "vi": "vùng, khu vực"}, {"w": "campus", "vi": "khuôn viên trường"}]}, {"type": "mc", "ctx": "Vocational study", "s": "Unlike a university degree, ___ usually focuses on vocational courses such as plumbing, hairdressing or cooking, and takes only one or two years.", "o": ["further education", "primary education", "physical education"], "a": "further education", "tw": "further education", "ipa": "/ˌfɜːðər ˌedjuˈkeɪʃn/", "vi": "Khác với bằng đại học, giáo dục tiếp tục thường tập trung vào các khóa học nghề như sửa ống nước, làm tóc hay nấu ăn và chỉ mất một hai năm.", "why": "further education thường là các khóa nghề ngắn hạn.", "new": [{"w": "vocational", "vi": "thuộc về dạy nghề"}, {"w": "plumbing", "vi": "nghề sửa ống nước"}]}, {"type": "mc", "ctx": "Boarding school", "s": "The headmaster said the boys had decided to ___ and sneak out of the dormitory after midnight, even though they knew the consequences.", "o": ["break the rules", "pay the bills", "make the beds"], "a": "break the rules", "tw": "break the rules", "ipa": "/breɪk ðə ruːlz/", "vi": "Hiệu trưởng nói các cậu bé đã quyết định vi phạm nội quy và lẻn ra khỏi ký túc xá sau nửa đêm, dù biết hậu quả.", "why": "break the rules + sneak out: vi phạm quy định.", "new": [{"w": "dormitory", "vi": "ký túc xá"}, {"w": "consequence", "vi": "hậu quả"}]}, {"type": "mc", "ctx": "Workplace", "s": "Employees who share confidential information with outsiders are likely to ___ their mistake, and some have even lost their jobs.", "o": ["be punished for", "be rewarded for", "be thanked for"], "a": "be punished for", "tw": "be punished for", "ipa": "/ˈpʌnɪʃt/", "vi": "Nhân viên chia sẻ thông tin mật cho người ngoài có khả năng bị phạt vì lỗi của họ, và một số người thậm chí mất việc.", "why": "be likely to be punished for: có khả năng bị phạt vì.", "new": [{"w": "confidential", "vi": "bảo mật"}, {"w": "outsider", "vi": "người ngoài"}]}, {"type": "mc", "ctx": "Group trip", "s": "While most of the group went to see the waterfall, Anna decided to ___ at the hotel because her ankle was still painful.", "o": ["stay behind", "turn around", "show off"], "a": "stay behind", "tw": "stay behind", "ipa": "/ˌsteɪ bɪˈhaɪnd/", "vi": "Trong khi phần lớn nhóm đi xem thác nước, Anna quyết định ở lại khách sạn vì mắt cá chân vẫn còn đau.", "why": "stay behind at + nơi: ở lại.", "new": [{"w": "waterfall", "vi": "thác nước"}, {"w": "ankle", "vi": "mắt cá chân"}]}, {"type": "mc", "ctx": "Dress code", "s": "Pupils who come to school without their uniform are likely to ___ for ignoring the dress code, even if the reason is not serious.", "o": ["get into trouble", "get a reward", "get some sleep"], "a": "get into trouble", "tw": "get i  until dinner until the whole house shook. What does “slammed the door shut” mean?", "say": "Dad was exhausted after a double shift at the hospital. He walked in, slammed the door shut and warned everyone not to disturb him until dinner until the whole house shook.", "o": ["đóng sầm cửa", "khẽ khép cửa lại", "khóa cửa bằng chìa"], "a": "đóng sầm cửa", "tw": "slam the door shut", "vi": "Bố kiệt sức sau ca trực kép ở bệnh viện. Ông bước vào, đóng sầm cửa và cảnh báo mọi người đừng làm phiền cho đến bữa tối.", "why": "slam = đóng mạnh, ồn ào, thường do giận hoặc mệt.", "new": [{"w": "double shift", "vi": "hai ca làm liên tiếp"}, {"w": "exhausted", "vi": "kiệt sức"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The lion slowly raised one huge paw and struck the ground. Its sharp claws left deep marks in the soft sand, which warned the cubs to stay back. What does “paw” mean?", "say": "The lion slowly raised one huge paw and struck the ground. Its sharp claws left deep marks in the soft sand, which warned the cubs to stay back.", "o": ["móng vuốt (chân động vật)", "cái đuôi", "cái bờm"], "a": "móng vuốt (chân động vật)", "tw": "paw", "vi": "Con sư tử từ từ giơ một bàn chân khổng lồ và đập xuống đất. Móng sắc để lại vết sâu trên cát mềm, cảnh báo đàn con tránh xa.", "why": "paw đi cùng claws (vuốt) và chỉ chân của thú.", "new": [{"w": "claw", "vi": "vuốt"}, {"w": "cub", "vi": "con non"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The boy noticed a round wooden box hanging from a tree. It was a beehive, where thousands of bees lived together and stored honey for the winter throughout the long, warm summer. What does “beehive” mean?", "say": "The boy noticed a round wooden box hanging from a tree. It was a beehive, where thousands of bees lived together and stored honey for the winter throughout the long, warm summer.", "o": ["tổ ong", "chuồng chim", "hang kiến"], "a": "tổ ong", "tw": "beehive", "vi": "Cậu bé để ý thấy một chiếc hộp g n cho khách", "từ chối khách", "phục vụ khách hàng"], "a": "phục vụ khách hàng", "vi": "Trước khi quản lý kịp phục vụ một khách, điện thoại reo hai lần và có hàng giao đến. Kết quả là hàng đợi dài thêm và vài người bỏ đi mà không mua gì.", "why": "as a result: do đó.", "new": [{"w": "queue", "vi": "hàng đợi"}, {"w": "delivery", "vi": "hàng được giao"}]}, {"ctx": "Short reading", "tw": "be served", "type": "mc", "noblank": true, "s": "“Are you being served?” asked the clerk politely. “Yes, thanks,” the woman said. “That gentleman over there is just wrapping my gift in paper, and then I'm done and ready to leave.” What does “Are you being served?” mean?", "say": "“Are you being served?” asked the clerk politely. “Yes, thanks,” the woman said. “That gentleman over there is just wrapping my gift in paper, and then I'm done and ready to leave.”", "o": ["Bạn muốn ăn gì?", "Bạn đã có ai phục vụ chưa?", "Bạn có thẻ giảm giá không?"], "a": "Bạn đã có ai phục vụ chưa?", "vi": "“Bạn đã có ai phục vụ chưa?” nhân viên hỏi. “Rồi, cảm ơn,” người phụ nữ nói. “Quý ông kia đang gói quà cho tôi, rồi tôi xong.”", "why": "Are you being served? câu hỏi quen thuộc trong cửa hàng.", "new": [{"w": "wrap", "vi": "gói"}, {"w": "gentleman", "vi": "quý ông"}]}, {"ctx": "Short reading", "tw": "need any help", "ipa": "/niːd ˈen.i help/", "type": "mc", "noblank": true, "s": "A volunteer stood at the airport entrance asking tourists, “Do you need any help?” Many visitors were grateful because the signs were confusing and the terminal was extremely crowded. What does “Do you need any help?” mean?", "say": "A volunteer stood at the airport entrance asking tourists, “Do you need any help?” Many visitors were grateful because the signs were confusing and the terminal was extremely crowded.", "o": ["Bạn có hành lý không?", "Bạn đi đâu vậy?", "Bạn có cần giúp gì không?"], "a": "Bạn có cần giúp gì không?", "vi": "Một tình nguyện viên đứng ở lối vào sân bay hỏi du khách, “Bạn có cần giúp gì không?” Nhiều k re only had two. Frustrated shoppers kept checking their watches, and some simply put the clothes back and left. What does “changing room” mean?", "say": "There was a long queue outside the changing room because the store only had two. Frustrated shoppers kept checking their watches, and some simply put the clothes back and left.", "o": ["quầy thanh toán", "phòng thử đồ", "phòng kho"], "a": "phòng thử đồ", "vi": "Có hàng dài trước phòng thử đồ vì cửa hàng chỉ có hai phòng. Những người mua bực bội liên tục xem đồng hồ, và vài người chỉ trả quần áo lại rồi bỏ đi.", "why": "Manh mối: queue, only two.", "new": [{"w": "frustrated", "vi": "bực bội"}, {"w": "queue", "vi": "hàng đợi"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "the changing rooms are over there", "vi": "Tom cầm một chiếc áo khoác lên và hỏi nhân viên chỗ nào có thể xem nó mặc lên người ra sao. Cô mỉm cười và nói: “Phòng thử đồ ở đằng kia, cạnh các kệ giày.”", "why": "Câu chỉ đường trong cửa hàng: The changing rooms are over there.", "new": [{"w": "shelves", "vi": "các kệ, giá"}, {"w": "assistant", "vi": "nhân viên bán hàng"}], "s": "Tom picked up a jacket and asked an assistant where he could see how it looked on him. She smiled and said, “The changing rooms are over there, next to the shoe shelves.” What does “the changing rooms are over there” mean?", "say": "Tom picked up a jacket and asked an assistant where he could see how it looked on him. She smiled and said, “The changing rooms are over there, next to the shoe shelves.”", "o": ["Phòng thử đồ ở đằng kia", "Quầy thanh toán ở tầng trên", "Cửa hàng sắp đóng cửa"], "a": "Phòng thử đồ ở đằng kia"}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "try on clothes", "ipa": "/traɪ ɑːn kloʊðz/", "vi": "Anna lo lắng về buổi phỏng vấn xin việc nên cô dành một tiếng ở trung tâm thương mại để thử quần áo trước khi chọn bộ vest lịch sự. Mặc nhiều bộ khác nhau giúp cô quyết định bộ nào trông chuyên nghiệp nhất.", "why": "try on clothes + before buying/choosing.", "new": [{"w": "smart suit", "vi": "bộ vest lịch sự"}, {"w": "professional", "vi": "chuyên nghiệp"}], "s": "Anna was nervous about her job interview, so she spent an hour at the mall to try on clothes before choosing a smart suit. Wearing different outfits helped her decide which one looked most professional. What does “try on clothes” mean?", "say": "Anna was nervous about her job interview, so she spent an hour at the mall to try on clothes before choosing a smart suit. Wearing different outfits helped her decide which one looked most professional.", "o": ["Mặc thử quần áo", "Giặt quần áo", "Gấp quần áo vào tủ"], "a": "Mặc thử quần áo"}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "try it on", "vi": "Chiếc áo khoác rẻ nhưng Linh không chắc tay áo có quá dài không. “Sao chị không mặc thử?” nhân viên gợi ý, “Đó là cách duy nhất để chắc chắn.”", "why": "Why don’t you try it on? = gợi ý thử đồ.", "new": [{"w": "unsure", "vi": "không chắc chắn"}, {"w": "suggest", "vi": "gợi ý"}], "s": "The jacket was cheap, but Linh was unsure whether the sleeves were too long. “Why don’t you try it on?” the assistant suggested, “That is the only way to be sure.” What does “try it on” mean?", "say": "The jacket was cheap, but Linh was unsure whether the sleeves were too long. “Why don’t you try it on?” the assistant suggested, “That is the only way to be sure.”", "o": ["Mặc thử nó", "Mua nó ngay", "Giặt nó trước"], "a": "Mặc thử nó"}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "try a bigger size", "ipa": "/traɪ ə ˈbɪɡ.ə(r) saɪz/", "vi": "Chiếc quần jeans chật đến khó chịu và Anna khó ngồi xuống. Nhân viên khuyên cô thử cỡ lớn hơn vì vải không co giãn nhiều.", "why": "advise sb to do sth: khuyên ai làm gì.", "new": [{"w": "fabric", "vi": "vải"}, {"w": "stretch", "vi": "co giãn"}], "s": "The jeans felt uncomfortably tight, and Anna could hardly sit down. The shop assistant kindly advised her to try a bigger size because the fabric of those jeans does not stretch much. What does “try a bigger size” mean?", "say": "The jeans felt uncomfortably tight, and Anna could hardly sit down. The shop assistant kindly advised her to try a bigger size because the fabric of those jeans does not stretch much.", "o": ["Thử cỡ lớn hơn", "Mua màu khác", "Trả lại cửa hàng"], "a": "Thử cỡ lớn hơn"}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "a size 12", "ipa": "/ə saɪz twelv/", "vi": "Nhãn trên chiếc váy ghi “size 12” nên Linh tự tin nó sẽ vừa. Tuy nhiên, sau khi mặc thử, cô thấy cỡ 12 của hãng này nhỏ hơn cô nghĩ.", "why": "a size + số = cỡ số mấy.", "new": [{"w": "label", "vi": "nhãn mác"}, {"w": "confident", "vi": "tự tin"}], "s": "The label on the dress said “size 12”, so Linh felt confident it would fit her. However, after she tried it on, she found that a size 12 from this brand was smaller than she expected. What does “a size 12” mean?", "say": "The label on the dress said “size 12”, so Linh felt confident it would fit her. However, after she tried it on, she found that a size 12 from this brand was smaller than she expected.", "o": ["Cỡ 12", "Giá 12 đô", "Mười hai chiếc váy"], "a": "Cỡ 12"}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "a bigger size", "ipa": "/ə ˈbɪɡ.ə(r) saɪz/", "vi": "Áo khoác của Anna chật ở nách và cô không cài khuy đúng được. Nhân viên đề nghị mang cỡ lớn hơn, để cô có thêm chỗ cử động.", "why": "bigger size = cỡ to hơn.", "new": [{"w": "button", "vi": "cài khuy"}, {"w": "room", "vi": "khoảng trống, chỗ"}], "s": "Anna’s coat felt tight under the arms, and she could not button it properly. The assistant offered to bring a bigger size, which would give her more room to move. What does “a bigger size” mean?", "say": "Anna’s coat felt tight under the arms, and she could not button it properly. The assistant offered to bring a bigger size, which would give her more room to move.", "o": ["Cỡ lớn hơn", "Màu đậm hơn", "Giá rẻ hơn"], "a": "Cỡ lớn hơn"}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "have something in a size 12", "ipa": "/hæv ... ɪn ə saɪz twelv/", "vi": "Tom thích chiếc áo sơ mi nhưng nó quá nhỏ với anh. “Chị có cái này cỡ 12 không?” anh hỏi, và nhân viên đi kiểm tra trong kho.", "why": "Do you have this in a size...? = câu hỏi hỏi cỡ khác.", "new": [{"w": "stockroom", "vi": "kho hàng"}, {"w": "check", "vi": "kiểm tra"}], "s": "Tom loved the shirt, but it was too small for him. “Do you have this in a size 12?” he asked, and the assistant went to check the stockroom. What does “have this in a size 12” mean?", "say": "Tom loved the shirt, but it was too small for him. “Do you have this in a size 12?” he asked, and the assistant went to check the stockroom.", "o": ["Có món đồ này cỡ 12 không", "Món đồ này giá 12 đô không", "Cô ấy có mặc cỡ 12 không"], "a": "Có món đồ này cỡ 12 không"}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "have something in size/colour", "ipa": "/hæv ... ɪn/", "vi": "Nhân viên nhìn chiếc áo Anna đang cầm rồi lắc đầu. “Xin lỗi, chúng tôi không có màu xanh dương, nhưng có màu xám, xanh lá và trắng.”", "why": "have it in + màu = có sẵn màu đó.", "new": [{"w": "shake her head", "vi": "lắc đầu"}, {"w": "hold", "vi": "cầm"}], "s": "The shop assistant looked at the shirt Anna was holding and shook her head. “Sorry, we don’t have it in blue, but we do have it in grey, green and white.” What does “have it in blue” mean?", "say": "The shop assistant looked at the shirt Anna was holding and shook her head. “Sorry, we don’t have it in blue, but we do have it in grey, green and white.”", "o": ["Có món đồ đó màu xanh dương", "Mặc món đồ đó màu xanh dương", "Nhuộm món đồ đó thành màu xanh"], "a": "Có món đồ đó màu xanh dương"}, {"type": "mc", "noblank": true, "ctx": "Short reading", "tw": "likely", "ipa": "/ˈlaɪ.kli/", "vi": "Các chuyên gia nói nhiều khả năng sẽ có đường hầm mới vì cây cầu cũ quá nhỏ so với lượng xe. Tuy nhiên, chưa có gì được qu y should cross the road until the traffic lights turn green.", "o": ["bước xuống khỏi", "leo lên", "chạy vòng quanh"], "a": "bước xuống khỏi", "tw": "step off", "ipa": "/step ɒf/", "vi": "Hướng dẫn viên bảo chúng tôi lần lượt bước xuống khỏi xe buýt và đợi trên vỉa hè. Không ai được băng qua đường cho đến khi đèn giao thông chuyển xanh.", "why": "step off the bus rồi wait on the pavement: xuống xe.", "new": [{"w": "one by one", "vi": "từng người một"}, {"w": "cross", "vi": "băng qua"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "After falling off his skateboard, Ben had a minor injury: just a small cut on his elbow. The doctor told him it was nothing serious and put on a plaster. What does “a minor injury” mean?", "say": "After falling off his skateboard, Ben had a minor injury: just a small cut on his elbow. The doctor told him it was nothing serious and put on a plaster.", "o": ["thương tích nhẹ", "bệnh nặng", "tai nạn chết người"], "a": "thương tích nhẹ", "tw": "a minor injury", "ipa": "/ə ˈmaɪnə ˈɪndʒəri/", "vi": "Sau khi ngã khỏi ván trượt, Ben bị thương nhẹ: chỉ là một vết cắt nhỏ ở khuỷu tay. Bác sĩ nói không có gì nghiêm trọng và dán băng cho cậu.", "why": "minor = nhẹ, không nghiêm trọng.", "new": [{"w": "elbow", "vi": "khuỷu tay"}, {"w": "plaster", "vi": "miếng băng dán"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "A fire swept through the library last night. Firefighters say the roof and most of the books were badly damaged, and the building will remain closed for months. What does “were badly damaged” mean?", "say": "A fire swept through the library last night. Firefighters say the roof and most of the books were badly damaged, and the building will remain closed for months.", "o": ["bị hư hại nặng", "được sửa chữa tốt", "bị bán đi nhanh chóng"], "a": "bị hư hại nặng", "tw": "be badly damaged", "ipa": "/ˈdæmɪdʒ/", "vi": "Một đám cháy quét qua thư viện tối qua. Lính cứu hỏa cho biết mái nhà và phần lớn sách bị hư hại nặng, và tòa nhà sẽ đóng cửa nhiều tháng.", "why": "Sau cháy, tòa nhà đóng cửa nhiều tháng: hư hại nặng.", "new": [{"w": "sweep through", "vi": "lan nhanh qua"}, {"w": "remain", "vi": "vẫn, còn"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Tom's parents decided to send him to school in the city when he was eleven. The village had only a small primary school, and they wanted him to have more opportunities. What does “send him to school” mean?", "say": "Tom's parents decided to send him to school in the city when he was eleven. The village had only a small primary school, and they wanted him to have more opportunities.", "o": ["cho cậu ấy đi học", "bắt cậu ấy làm việc", "đưa cậu ấy đi du lịch"], "a": "cho cậu ấy đi học", "tw": "send someone to school", "ipa": "/send/", "vi": "Cha mẹ Tom quyết định cho cậu đi học ở thành phố khi cậu mười một tuổi. Ngôi làng chỉ có một trường tiểu học nhỏ và họ muốn cậu có nhiều cơ hội hơn.", "why": "send sb to school: cho ai đi học (ở đâu).", "new": [{"w": "opportunity", "vi": "cơ hội"}, {"w": "primary school", "vi": "trường tiểu học"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Many students in this small town leave school at eighteen with only basic qualifications. Those who do not continue studying often find that employers prefer candidates with more training. What does “leave school” mean?", "say": "Many students in this small town leave school at eighteen with only basic qualifications. Those who do not continue studying often find that employers prefer candidates with more training.", "o": ["nghỉ học, rời trường", "bắt đầu năm học mới", "làm giáo viên"], "a": "nghỉ học, rời trường", "tw": "leave school", "ipa": "/liːv skuːl/", "vi": "Nhiều học sinh rời trường ở tuổi mười tám chỉ với bằng cấp cơ bản. Những ai không học tiếp thường thấy nhà tuyển dụng ưa chuộng ứng viên được đào tạo nhiều hơn.", "why": "leave school gần với 'finish/stop studying'.", "new": [{"w": "candidate", "vi": "ứng viên"}, {"w": "employer", "vi": "nhà tuyển dụng"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Tom did well in his exams and later went on to become a very famous architect. His old teacher says she always knew he would do something special. What does “went on to” mean?", "say": "Tom did well in his exams and later went on to become a very famous architect. His old teacher says she always knew he would do something special.", "o": ["tiếp tục sau đó (trở thành/học lên)", "dừng lại không làm nữa", "chuyển đi nơi khác"], "a": "tiếp tục sau đó (trở thành/học lên)", "tw": "go on to", "ipa": "/ɡəʊ ɒn tuː/", "vi": "Tom thi tốt và sau đó tiếp tục trở thành một kiến trúc sư nổi tiếng. Cô giáo cũ nói cô luôn biết cậu sẽ làm nên điều đặc biệt.", "why": "went on to + V/N: sau đó tiếp tục làm/trở thành.", "new": [{"w": "architect", "vi": "kiến trúc sư"}, {"w": "special", "vi": "đặc biệt"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "After leaving secondary school, Mia enrolled in a one-year course at a local college. Her parents are pleased because further education will help her gain skills for a stable job. What does “further education” mean?", "say": "After leaving secondary school, Mia enrolled in a one-year course at a local college. Her parents are pleased because further education will help her gain skills for a stable job.", "o": ["giáo dục tiếp tục sau phổ thông", "giáo dục mầm non", "giáo dục tại nhà"], "a": "giáo dục tiếp tục sau phổ thông", "tw": "further education", "ipa": "/ˌfɜːðər ˌedjuˈkeɪʃn/", "vi": "Sau khi rời trường trung học, Mia đăng ký một khóa một năm ở trường cao đẳng địa phương. Cha mẹ cô hài lòng vì việc học thêm sẽ giúp cô có kỹ năng cho một công việc ổn định.", "why": "Sau phổ thông + college + khóa ngắn.", "new": [{"w": "enrol", "vi": "đăng ký học"}, {"w": "stable", "vi": "ổn định"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The coach was furious because two players had broken the rules by arriving late to every training session. As a result, they were not allowed to play in the final match. What does “broken the rules” mean?", "say": "The coach was furious because two players had broken the rules by arriving late to every training session. As a result, they were not allowed to play in the final match.", "o": ["vi phạm nội quy", "ghi bàn", "thay đổi chiến thuật"], "a": "vi phạm nội quy", "tw": "break the rules", "ipa": "/breɪk ðə ruːlz/", "vi": "Huấn luyện viên rất tức giận vì hai cầu thủ đã vi phạm nội quy khi đến muộn mọi buổi tập. Kết quả là họ không được chơi ở trận chung kết.", "why": "As a result + bị cấm thi đấu: vi phạm quy định.", "new": [{"w": "furious", "vi": "rất tức giận"}, {"w": "training session", "vi": "buổi tập"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Mr Brown told the class that nobody would be punished for telling the truth. However, anyone who lied about the broken window would have to clean the whole classroom. What does “be punished for” mean?", "say": "Mr Brown told the class that nobody would be punished for telling the truth. However, anyone who lied about the broken window would have to clean the whole classroom.", "o": ["bị phạt vì", "được thưởng vì", "được cảm ơn vì"], "a": "bị phạt vì", "tw": "be punished for", "ipa": "/ˈpʌnɪʃt/", "vi": "Thầy Brown nói với lớp rằng sẽ không ai bị phạt vì nói thật. Tuy nhiên, ai nói dối về cửa sổ bị vỡ sẽ phải dọn cả lớp.", "why": "Nói dối thì phải dọn lớp: hình phạt.", "new": [{"w": "lie", "vi": "nói dối"}, {"w": "whole", "vi": "toàn bộ"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "When the bell rang, everyone rushed out except Linh, who stayed behind to finish her drawing. The art teacher smiled and said she could use the room for another ten minutes. What does “stayed behind” mean?", "say": "When the bell rang, everyone rushed out except Linh, who stayed behind to finish her drawing. The art teacher smiled and said she could use the room for another ten minutes.", "o": ["ở lại sau khi người khác đã về", "chạy ra ngoài trước", "ngồi phía sau lớp"], "a": "ở lại sau khi người khác đã về", "tw": "stay behind", "ipa": "/ˌsteɪ bɪˈhaɪnd/", "vi": "Khi chuông reo, mọi người ùa ra ngoài trừ Linh, người ở lại để hoàn thành bức vẽ. Cô giáo mỹ thuật mỉm cười và nói em có thể dùng phòng thêm mười phút.", "why": "everyone rushed out except Linh: Linh ở lại.", "new": [{"w": "rush out", "vi": "ùa ra"}, {"w": "drawing", "vi": "bức vẽ"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Anna stayed silent when her teacher asked who had thrown the paper. She did not want to get into trouble for something that her best friend had done. What does “get into trouble” mean?", "say": "Anna stayed silent when her teacher asked who had thrown the paper. She did not want to get into trouble for something that her best friend had done.", "o": ["bị khiển trách, gặp rắc rối", "được khen ngợi", "được cho nghỉ học"], "a": "bị khiển trách, gặp rắc rối", "tw": "get into trouble for", "ipa": "/ɡet ˈɪntə ˈtrʌbl/", "vi": "Anna giữ im lặng khi giáo viên hỏi ai đã ném giấy. Cô không muốn bị khiển trách vì việc mà bạn thân đã làm.", "why": "get into trouble for sth: bị rắc rối vì.", "new": [{"w": "stay silent", "vi": "giữ im lặng"}, {"w": "throw", "vi": "ném"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The apartment is reasonably quiet, although you can sometimes hear the traffic from the main road. For the price, most tenants say it is a good place to live. What does “reasonably” mean?", "say": "The apartment is reasonably quiet, although you can sometimes hear the traffic from the main road. For the price, most tenants say it is a good place to live.", "o": ["khá, tương đối", "cực kỳ", "hoàn toàn không"], "a": "khá, tương đối", "tw": "reasonably", "ipa": "/ˈriːznəbli/", "vi": "Căn hộ khá yên tĩnh, dù đôi khi bạn nghe thấy tiếng xe cộ từ đường chính. Với mức giá này, phần lớn người thuê nói đây là nơi sống tốt.", "why": "reasonably + adj: ở mức khá, chấp nhận được.", "new": [{"w": "tenant", "vi": "người thuê nhà"}, {"w": "traffic", "vi": "xe cộ, giao thông"}]}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Silly mistake", "s": "Describe a time when someone you know did something silly because they were angry or curious. What happened and how did it end?", "vi": "Hãy mô tả một lần ai đó bạn biết làm điều dại dột vì giận hoặc tò mò. Chuyện gì đã xảy ra và kết thúc thế nào?", "words": ["run all the way home", "slam the door shut", "paw", "beehive", "stick your hand into", "buzz off", "don't bother me", "sting", "swing", "smash", "lose your temper", "hot temper", "get someone into trouble"], "why": "Kể theo trình tự: bối cảnh, hành động dại dột, hậu quả, cảm xúc và bài học. Dùng thì quá khứ và vài câu trích lời.", "sample": "Last summer my cousin Tom found a beehive in our garden. I warned him, “Never stick your hand into it,” but he grabbed a stick to swing at it and smash it. The bees came out to sting him, so he had to run all the way home. He tried to slam the door shut, but our dog’s paw was in the way. Tom has a hot temper, and when I laughed he shouted, “Buzz off! Don't bother me!” You should never lose your temper like that, and I did not want to get someone into trouble, so I stayed quiet."}, {"type": "sp", "ctx": "Memorable trip", "s": "Describe a memorable holiday or trip. Where did you go, who did you meet and what unexpected things happened?", "vi": "Hãy mô tả một kỳ nghỉ hoặc chuyến đi đáng nhớ. Bạn đi đâu, gặp ai và có điều bất ngờ nào xảy ra?", "words": ["run into", "shiny", "digestive", "sneak into", "wise", "wisdom", "tragedy", "That always works", "buckle up", "get wild", "have two days left", "a drop of coffee"], "why": "Kể theo thứ tự: nơi đi, người gặp, sự kiện bất ngờ, kết thúc. Dùng thì quá khứ và thêm một lời khuyên cuối bài.", "sample": "I always feel sad when we only have two days left on holiday, so we buckle up and drive along the coast. There we often run into a wise fisherman who shares his wisdom about the sea and tells a sad tragedy about a lost boat. Once, we tried to sneak into a shiny new hotel to use its pool, but the guards stopped us. At night the beach party can get wild, so I eat a digestive biscuit with a drop of coffee. When I feel nervous, I breathe slowly. That always works."}, {"type": "sp", "ctx": "Fashion and money", "s": "Describe the way you usually dress for work or study. Explain whether fashion and money influence what you choose to wear.", "vi": "Hãy mô tả cách bạn thường ăn mặc khi đi làm hoặc đi học. Giải thích thời trang và tiền bạc có ảnh hưởng đến lựa chọn trang phục của bạn không.", "words": ["earn a reasonable amount of money", "a potload of money", "be in fashion", "look fashionable", "designer labels", "dress in black", "dress casually", "wear fashionable clothes", "wear two jackets at the same time", "never buy clothes just because", "hardly ever wear", "I've got on"], "why": "Mở bài nói về thu nhập, rồi kể phong cách thường ngày (mặc đồ màu gì, ăn mặc thoải mái hay không), thái độ với đồ hiệu và mốt, thêm một kỷ niệm và mô tả bộ đồ đang mặc.", "sample": "I don't earn a reasonable amount of money yet, and I'm certainly not making a potload of money, so I never buy clothes just because they are cheap. Black jackets will always be in fashion, and I like to dress in black when I want to look fashionable. At work I dress casually. Some friends wear fashionable clothes from designer labels, but I hardly ever wear anything expensive. Once I even had to wear two jackets at the same time because it was freezing. Today I've got on a grey sweater."}, {"type": "sp", "ctx": "Shopping for clothes", "s": "Describe a time when you went shopping for clothes. What happened in the store, and how did the shop assistant help you?", "vi": "Hãy kể về một lần bạn đi mua quần áo. Chuyện gì xảy ra ở cửa hàng, và nhân viên bán hàng đã giúp bạn thế nào?", "words": ["shop for clothes", "go shopping for clothes", "shop assistant", "serve a customer", "be served", "need any help", "look for something", "look for a bigger size", "changing room"], "why": "Kể theo trình tự: lý do đi mua sắm, nhân viên hỏi han, bạn tìm món đồ gì, thử đồ ở phòng thử, vấn đề về cỡ và kết quả cuối cùng.", "sample": "Last weekend I decided to go shopping for clothes because I had nothing to wear to a wedding. I like to shop for clothes in the morning, when the stores are quiet. A shop assistant asked, “Do you need any help?” I said I wanted to look for something simple and blue. She had to serve a customer first, so I waited to be served. Then I tried a dress, but it was too tight, so I asked her to look for a bigger size. In the changing room it fitted well, so I bought it."}, {"type": "sp", "ctx": "Clothes shopping", "s": "Describe a time you went to a clothes shop and had trouble finding the right size or colour. What happened?", "vi": "Hãy mô tả một lần bạn đến cửa hàng quần áo và gặp khó khăn tìm đúng cỡ hoặc màu. Chuyện gì đã xảy ra?", "words": ["the changing rooms are over there", "try on clothes", "try it on", "try a bigger size", "a bigger size", "a size 12", "have it in a size 12", "have it in blue"], "why": "Kể theo trình tự: bạn vào cửa hàng, hỏi nhân viên, thử đồ, thấy chật, thử cỡ lớn hơn, hỏi màu/cỡ khác và kết quả.", "sample": "Last winter I went into a department store to buy a coat. I told the assistant that I normally wear a size 12, and she asked whether I wanted to try on clothes first. She said the changing rooms are over there, so I took a grey coat and decided to try it on. It was too tight, so I went back and asked her to try a bigger size. She brought a bigger size, but it was far too long. Then I asked whether they could have it in a size 12 and have it in blue, because I preferred that colour. Sadly, they could not."}, {"type": "sp", "ctx": "Sales and bargains", "s": "Talk about a time you bought something that did not work. What did you do, and do you ever bargain when you shop?", "vi": "Hãy kể về lần bạn mua món đồ bị hỏng. Bạn đã làm gì, và bạn có bao giờ mặc cả khi mua sắm không?", "words": ["likely", "be likely to", "be on special offer", "refund", "get a refund", "agree a lower price", "haggle", "haggle over the price", "take it back"], "why": "Kể món đồ đang khuyến mãi bạn mua, lỗi gặp phải, việc mang trả và xin hoàn tiền, rồi so sánh với việc mặc cả ở chợ.", "sample": "I usually buy electronics when they happen to be on special offer, so last month I bought a blender at thirty per cent off. When I got home, I found a crack in the jug, so I decided to take it back to the shop. I thought a complaint would be likely to start an argument, but the manager was polite. I wanted to get a refund, and he said a refund was likely, as long as I had my receipt. In markets, I haggle over the price and try to agree a lower price, but in shops that is not normal."}, {"type": "sp", "ctx": "Cooking at home", "s": "Describe a dish that you often cook at home. You should say what it is, which ingredients you use, and why your family likes it.", "vi": "Hãy mô tả một món bạn thường nấu ở nhà. Bạn nên nói đó là món gì, bạn dùng nguyên liệu nào và vì sao gia đình thích.", "words": ["basil", "onion", "garlic", "ginger", "lemongrass", "turmeric", "broth mix", "chilli sauce", "fish sauce", "ketchup", "salt", "shallot", "soy sauce", "spice"], "why": "Nêu tên món, kể các bước (phi hành tỏi, thêm gia vị, nêm nếm), rồi nói khẩu vị mỗi người trong nhà và lý do họ thích.", "sample": "I often cook a simple chicken soup at home. First, I fry some onion, garlic and shallot in oil until the kitchen smells wonderful. Then I add ginger, lemongrass and a little turmeric, which gives the soup a bright yellow color. Instead of making stock, I use broth mix to save time. I season it with fish sauce and soy sauce, and a pinch of salt. At the end I tear some basil on top. My family likes it with chilli sauce, but my little brother prefers ketchup, and he says any spice makes it too hot."}, {"type": "sp", "ctx": "Memorable meal", "s": "Describe a meal you ate that had a strong or unusual taste. You should say where you ate it, what it tasted like, and why you remember it.", "vi": "Hãy mô tả một bữa ăn có vị mạnh hoặc lạ. Bạn nên nói ăn ở đâu, vị thế nào và vì sao bạn nhớ.", "words": ["vinegar", "bitter", "bland", "salty", "spicy", "sour", "black pepper", "go back to work", "so tired that", "even when", "so that"], "why": "Kể địa điểm, mô tả các vị khác nhau (mặn, chua, cay, đắng), cảm xúc của bạn, rồi kết bằng điều bạn làm sau bữa ăn.", "sample": "Last year I tried a dish at a street stall that I still remember. The soup was salty at first, then sour because of the vinegar, and finally spicy, with a lot of black pepper. It was not bland at all. Some people dislike the bitter herbs inside, but I enjoyed them. I was so tired that I almost fell asleep at the table. I usually eat slowly even when I am hungry, so that I can enjoy every taste. After lunch I had to go back to work, but I felt happy."}, {"type": "sp", "ctx": "Seafood and accident", "s": "Describe a time when you ate seafood in a busy street and saw a small accident nearby. Say where you were, what happened and how you felt.", "vi": "Hãy kể về một lần bạn ăn hải sản trên một con phố đông và chứng kiến một tai nạn nhỏ gần đó. Nói bạn ở đâu, chuyện gì xảy ra và bạn cảm thấy thế nào.", "words": ["mussel", "scallop", "parking space", "side road", "step off", "a minor injury", "be badly damaged", "reasonably"], "why": "Mở đầu bằng địa điểm và món hải sản, kể việc tìm chỗ đỗ xe, rồi tai nạn (ai bị thương nhẹ, xe/đồ bị hư hại) và kết bằng cảm nhận.", "sample": "Last summer my family had lunch at a small seafood restaurant on a quiet side road near the harbour. We were reasonably hungry, but first we had to drive around for ten minutes to find a parking space. I ordered a mussel stew and a grilled scallop, which tasted fresh and sweet. As we left, a boy tried to step off the pavement without looking, and a cyclist crashed into the wall. The bike looked likely to be badly damaged, although the boy only suffered a minor injury on his knee. Honestly, it was a memorable day."}, {"type": "sp", "ctx": "School and rules", "s": "Talk about your school days. Do students in your country usually continue studying after secondary school, and what happens to those who break the school rules?", "vi": "Hãy nói về thời đi học của bạn. Học sinh ở nước bạn thường có học tiếp sau trung học không, và điều gì xảy ra với những em vi phạm nội quy?", "words": ["send children to school", "leave school", "go on to", "further education", "break the rules", "be punished for", "stay behind", "get into trouble"], "why": "Nói về việc cha mẹ cho con đi học, ai rời trường sớm, ai học lên đại học hoặc học nghề, rồi kể kỷ niệm bị phạt hoặc phải ở lại sau giờ học.", "sample": "In my country most parents send children to school at the age of six, and many of them leave school at eighteen. Some students go on to university, while others choose further education, such as a practical course at a college. At my school, pupils who break the rules, for example by cheating, can be punished for it by staying after class. I remember one time I had to stay behind because I forgot my homework. I didn't get into trouble, but my teacher was disappointed. I think discipline is important."}]}]};

    const av=[bands.f,bands.l,bands.g,bands.p].filter(x=>x!==null);
    const overall=half(av.reduce((a,b)=>a+b,0)/av.length);
    return {text,n,dur:Math.round(dur),wpm,used,missing:(q.words||[]).filter(w=>!used.includes(w)),conn,fill,rep,ttr:Math.round(ttr*100),adv,cats,errs:errs.slice(0,4),pm:pm===null?null:Math.round(pm*100),lowSegs:lowSegs.slice(0,3),bands,overall};
  }
  function adviceF(r){
    const a=[r.dur?`Bạn nói khoảng ${r.n} từ trong ${r.dur}s${r.wpm?` (≈ ${r.wpm} từ/phút)`:''}.`:`Bài gõ có khoảng ${r.n} từ (không đo được tốc độ nói).`];
    a.push(r.conn.length?`Từ nối đã dùng: ${r.conn.slice(0,5).join(', ')}.`:'Chưa thấy từ nối rõ ràng; thử dùng because, however, for example, as a result để ý tưởng liền mạch.');
    if(r.fill+r.rep>1)a.push(`Có ${r.fill} từ đệm và ${r.rep} lần lặp từ; hãy ngừng lặng ngắn thay vì “um/uh”.`);
    if(r.n<45)a.push('Câu trả lời còn ngắn; hướng tới 60–90 từ (30–45 giây) với 1 ý chính + 1 ví dụ.');
    return a.join(' ');
  }
  function adviceL(r){
    const a=[`Dùng ${r.used.length}/${r.used.length+r.missing.length} từ gợi ý${r.used.length?': '+r.used.join(', '):''}.`];
    if(r.missing.length)a.push(`Chưa dùng: ${r.missing.slice(0,5).join(', ')}.`);
    a.push(`Độ đa dạng từ ${r.ttr}%, từ dài/học thuật ${r.adv}.`);
    return a.join(' ');
  }
  function adviceG(r){
    const a=[r.cats.length?`Cấu trúc đa dạng: ${r.cats.join(', ')}.`:'Gần như chỉ dùng câu đơn; thử thêm mệnh đề quan hệ (which/who), câu điều kiện hoặc although/whereas.'];
    if(r.errs.length)a.push('Cần xem lại: '+r.errs.map(e=>`“${e.s}” (${e.w})`).join('; ')+'.');
    else a.push('Không phát hiện lỗi ngữ pháp phổ biến bằng quy tắc tự động.');
    return a.join(' ');
  }
  function adviceP(r){
    if(r.pm===null&&!r.dur)return 'Bài gõ nên chưa chấm được phát âm; hãy ghi âm để được chấm.';
    if(r.pm===null)return 'Trình duyệt này không có nhận dạng giọng nói nên chưa chấm được phát âm. Hãy mở bằng Chrome/Edge/Safari.';
    const a=[`Máy nhận ra lời bạn với độ chắc chắn ≈ ${r.pm}%.`];
    if(r.lowSegs.length)a.push('Đoạn nghe chưa rõ: “'+r.lowSegs.join('”, “')+'” — nghe lại phát âm mẫu và đọc chậm, rõ trọng âm.');
    else a.push('Phát âm được nhận ra rõ.');
    return a.join(' ');
  }
  function spCard(q){
    const st=state[q.id];
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const used=st&&st.r?st.r.used:[];
    const chips=(q.words||[]).map(w=>`<span class="chip${used.includes(w)?' used':''}">${esc(w)}<button type="button" class="say" data-word="${esc(w)}" aria-label="Phát âm ${esc(w)}" style="padding:0 4px;border:0;background:none">${icon}</button></span>`).join('');
    const busy=R&&R.id===q.id;
    let res='';
    if(st&&st.r){
      const r=st.r,b=r.bands;
      const bandBox=(name,v,adv)=>`<div class="band"><b>${name}</b><span class="n">${v===null?'—':fmt(v)}</span><p>${esc(adv)}</p></div>`;
      res=`<div class="spres" role="status">${urls[q.id]?`<audio controls src="${urls[q.id]}"></audio>`:''}<p class="tr">“${esc(r.text)}”</p>`+
        `<p class="overall">Điểm ước tính (thang IELTS 1–8)<span class="n">${fmt(r.overall)}</span></p><div class="bands">`+
        bandBox('Độ trôi chảy và mạch lạc (Fluency &amp; Coherence)',b.f,adviceF(r))+
        bandBox('Vốn từ vựng (Lexical Resource)',b.l,adviceL(r))+
        bandBox('Độ đa dạng và chính xác ngữ pháp (Grammatical Range &amp; Accuracy)',b.g,adviceG(r))+
        bandBox('Phát âm (Pronunciation)',b.p,adviceP(r))+`</div>`+
        `<p class="disc">Điểm do trình duyệt ước tính từ văn bản nhận dạng được (tốc độ, từ nối, từ vựng, cấu trúc, độ rõ giọng), chỉ để tham khảo, không thay thế giám khảo/giáo viên. Bản ghi âm chỉ nằm trên máy bạn, không được gửi đi.</p>`+
        `<button type="button" class="ghost retry" data-retry="${q.id}">Ghi âm lại</button></div>`;
    }
    const sample=q.sample?`<details class="sample"><summary>Xem bài nói mẫu (B2)</summary><p>${esc(q.sample)}</p></details>`:'';
    return `<article class="q sp" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div>`+
      `<p class="sent">${esc(q.s)}</p><p class="vi">${esc(q.vi)}</p>`+
      `<div class="spwords"><b>Từ nên dùng:</b> ${chips}</div>`+
      `<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu hỏi ${q.n}">${icon}Nghe câu hỏi</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button></div>`+
      `<div class="rec"><button type="button" class="recbtn" data-rec="${q.id}" ${busy?'disabled':''}>● Ghi âm</button><button type="button" class="recbtn stop" data-recstop="${q.id}" ${busy?'':'disabled'}>■ Dừng &amp; chấm điểm</button><span class="rectime" id="rt-${q.id}">${busy?'':'Nói 30–60 giây, cố dùng ≥ 3 từ gợi ý'}</span><span class="recmsg" id="rm-${q.id}"></span></div>`+
      `<details class="manual"><summary>Không ghi âm được? Gõ lại lời bạn nói để chấm</summary><textarea id="mt-${q.id}" placeholder="Gõ nội dung bạn đã nói…"></textarea><button type="button" class="ghost" data-manual="${q.id}">Chấm bài gõ (không chấm phát âm)</button></details>`+
      res+sample+`</article>`;
  }
  function recMsg(id,m){const e=$('rm-'+id);if(e)e.textContent=m||'';}
  async function startRec(id){
    if(R)return;
    stopAudio();
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
    catch(e){recMsg(id,'Không truy cập được micro. Hãy cho phép micro cho trang này hoặc dùng ô gõ bên dưới.');return;}
    const chunks=[];let mr=null;
    try{mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};mr.start();}catch(e){mr=null;}
    const segs=[];let rec=null;
    R={id,stream,mr,chunks,segs,t0:Date.now(),active:true,rec:null,timer:null};
    if(SRC){
      rec=new SRC();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=ev=>{
        let interim='';
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const r=ev.results[i];
          if(r.isFinal)segs.push({t:r[0].transcript.trim(),c:r[0].confidence});else interim+=r[0].transcript;
        }
        recMsg(id,interim?'… '+interim:'');
      };
      rec.onerror=()=>{};
      rec.onend=()=>{if(R&&R.active&&R.rec===rec){try{rec.start();}catch(e){}}};
      R.rec=rec;try{rec.start();}catch(e){}
    }else recMsg(id,'Trình duyệt không hỗ trợ nhận dạng giọng nói: bài sẽ được ghi âm nhưng cần gõ lại lời nói để chấm.');
    const tick=()=>{const e=$('rt-'+id);if(e&&R)e.textContent='● '+Math.round((Date.now()-R.t0)/1000)+' giây';};
    R.timer=setInterval(tick,500);tick();
    const b1=document.querySelector(`[data-rec="${id}"]`),b2=document.querySelector(`[data-recstop="${id}"]`);
    if(b1)b1.disabled=true;if(b2)b2.disabled=false;
  }
  function stopRec(id){
    if(!R||R.id!==id)return;
    const cur=R;cur.active=false;clearInterval(cur.timer);
    const dur=(Date.now()-cur.t0)/1000;
    recMsg(id,'Đang chấm điểm…');
    try{cur.rec&&cur.rec.stop();}catch(e){}
    const finish=()=>{
      cur.stream.getTracks().forEach(t=>t.stop());
      if(cur.chunks.length){urls[id]&&URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(new Blob(cur.chunks,{type:(cur.mr&&cur.mr.mimeType)||'audio/webm'}));}
      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
