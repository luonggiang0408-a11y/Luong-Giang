  }
}

*{box-sizing:border-box}

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}

.fb.bad{background:var(--bad-bg)}

.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

dn’t have much experience, but he ___ to impress the panel with his clear answers and calm attitude.", "o": ["managed", "refused", "pretended"], "a": "managed", "vi": "Anh không có nhiều kinh nghiệm, nhưng anh đã gây ấn tượng với hội đồng bằng câu trả lời rõ ràng và thái độ bình tĩnh.", "why": "manage to + V = làm được việc khó; I managed to finish on time. Khác can: nhấn mạnh sự cố gắng và đã thành công.", "tw": "managed", "new": [{"w": "panel", "vi": "hội đồng phỏng vấn"}, {"w": "attitude", "vi": "thái độ"}]}, {"type": "mc", "ctx": "Museum visit", "s": "Since our daughter has always been fascinated by dinosaurs, she is deeply ___ in every exhibition that explains how they lived.", "o": ["interested", "bored", "tired"], "a": "interested", "vi": "Vì con gái chúng tôi luôn mê khủng long, con rất quan tâm đến mọi triển lãm giải thích cách chúng sống.", "why": "be interested in + N/V-ing = quan tâm đến; I’m interested in learning… Đừng nhầm interested (người cảm thấy) với interesting (vật gây hứng thú).", "tw": "interested", "new": [{"w": "fascinated", "vi": "bị mê hoặc"}, {"w": "exhibition", "vi": "triển lãm"}]}, {"type": "mc", "ctx": "Negotiation", "s": "After hearing that the supplier would deliver on Mondays only, the shop owner said, “___,” and agreed to the new arrangement.", "o": ["That sounds reasonable to me", "That is completely impossible", "I don’t care about it"], "a": "That sounds reasonable to me", "vi": "Sau khi nghe nhà cung cấp chỉ giao hàng vào thứ Hai, chủ cửa hàng nói, “Tôi thấy hợp lý,” và đồng ý cách sắp xếp mới.", "why": "That sounds reasonable (to me) = nghe hợp lý với tôi; dùng để đồng ý lịch sự khi nghe đề xuất. Reasonable = hợp lý, phải chăng.", "tw": "That sounds reasonable to me", "new": [{"w": "supplier", "vi": "nhà cung cấp"}, {"w": "arrangement", "vi": "sự sắp xếp"}]}, {"type": "mc", "ctx": "Climate report", "s": "Cutting emissions now is expensive; ___, however, it will save billions by reducing storm damage and health costs.", "o": ["in the long term", "in the short term", "in the past"], "a": "in the long term", "vi": "Cắt giảm khí thải bây giờ thì tốn kém; tuy nhiên về lâu dài nó sẽ tiết kiệm hàng tỷ nhờ giảm thiệt hại bão và chi phí y tế.", "why": "in the long term = xét về lâu dài (opp: in the short term); in the long term, regular exercise improves health.", "tw": "in the long term", "new": [{"w": "emissions", "vi": "khí thải"}, {"w": "billions", "vi": "hàng tỷ"}]}, {"type": "mc", "ctx": "Student life", "s": "Although she wanted to volunteer abroad, she said, “I don’t have ___ courage to travel alone yet,” and decided to start closer to home.", "o": ["enough", "many", "every"], "a": "enough", "vi": "Dù muốn đi tình nguyện ở nước ngoài, cô nói, “Tớ chưa đủ can đảm đi một mình,” và quyết định bắt đầu gần nhà hơn.", "why": "I don’t have enough + N + to + V = không đủ (thời gian/tiền/sức) để làm gì; enough đứng trước danh từ.", "tw": "enough", "new": [{"w": "volunteer", "vi": "tình nguyện"}, {"w": "courage", "vi": "can đảm"}]}, {"type": "mc", "ctx": "Football team", "s": "The coach decided to rest his star player, saying, “Muscles ___ time to recover, and one more match could make the injury worse.”", "o": ["need", "avoid", "forget"], "a": "need", "vi": "Huấn luyện viên quyết định cho cầu thủ ngôi sao nghỉ, nói, “Cơ bắp cần thời gian hồi phục, và thêm một trận có thể làm chấn thương tệ hơn.”", "why": "need time to recover = cần thời gian để hồi phục (sức khỏe, thể thao); recover from an illness / an injury.", "tw": "need", "new": [{"w": "star player", "vi": "cầu thủ ngôi sao"}, {"w": "injury", "vi": "chấn thương"}]}, {"type": "mc", "ctx": "City planning", "s": "Closing the main road will cause traffic jams ___, although it should make the centre safer and cleaner afterwards.", "o": ["in the short term", "in the long term", "in the past"], "a": "in the short term", "vi": "Đóng đường chính sẽ gây kẹt xe trong ngắn hạn, dù sau đó sẽ làm trung tâm an toàn và sạch hơn.", "why": "in the short term = trong thời gian ngắn trước mắt (opp: in the long term); in the short term, overtime may raise output.", "tw": "in the short term", "new": [{"w": "traffic jams", "vi": "kẹt xe"}, {"w": "afterwards", "vi": "sau đó"}]}, {"type": "mc", "ctx": "Chat", "s": "Life is unpredictable; ___, so there is no point worrying too much about one bad month.", "o": ["sometimes you’re up, sometimes you’re down", "every day is exactly the same", "money solves every problem"], "a": "sometimes you’re up, sometimes you’re down", "vi": "Cuộc sống khó đoán; có lúc thăng, có lúc trầm, nên chẳng cần lo quá về một tháng tệ.", "why": "Sometimes you’re up, sometimes you’re down = cuộc sống có lúc thuận lợi, có lúc khó khăn; dùng để an ủi, chấp nhận thăng trầm.", "tw": "sometimes you’re up, sometimes you’re down", "new": [{"w": "unpredictable", "vi": "khó đoán"}, {"w": "no point", "vi": "vô ích"}]}, {"type": "mc", "ctx": "Business deal", "s": "Once the final invoice was paid and both sides signed the paper, the director shook hands and said, “Good, ___.”", "o": ["we’re settled", "we’re late", "we’re lost"], "a": "we’re settled", "vi": "Khi hóa đơn cuối được thanh toán và hai bên ký giấy, giám đốc bắt tay và nói, “Tốt, vậy là xong.”", "why": "We’re settled = đã xong xuôi, không còn nợ nhau (sau khi trả tiền/giải quyết); settle a bill = thanh toán hóa đơn.", "tw": "we’re settled", "new": [{"w": "invoice", "vi": "hóa đơn"}, {"w": "shook hands", "vi": "bắt tay"}], "ipa": "/ˈset̬.əl/"}, {"type": "mc", "ctx": "Thunderstorm", "s": "When the thunder shook the windows, Grandma hugged the children and said gently, “___; it’s only noise, and we are safe inside.”", "o": ["Don’t be afraid", "Don’t be late", "Don’t be rude"], "a": "Don’t be afraid", "vi": "Khi sấm làm rung cửa sổ, bà ôm các cháu và nhẹ nhàng nói, “Đừng sợ; chỉ là tiếng ồn thôi, trong nhà chúng ta an toàn.”", "why": "Don’t be afraid. = đừng sợ (trấn an); thường kèm lời hứa giúp đỡ: Don’t be afraid to ask. Be afraid of sth = sợ cái gì.", "tw": "Don’t be afraid", "new": [{"w": "thunder", "vi": "sấm"}, {"w": "gently", "vi": "nhẹ nhàng"}]}, {"type": "mc", "ctx": "Siblings", "s": "“Give me a ___!” she shouted at her brother, who kept knocking on her door every five minutes to ask silly questions.", "o": ["break", "chance", "hand"], "a": "break", "vi": "“Tha cho chị đi!” cô hét với em trai, người cứ gõ cửa phòng cô mỗi năm phút để hỏi những câu ngớ ngẩn.", "why": "Give me a break! = thôi đi / đừng làm khó tôi (khó chịu hoặc không tin); rất khẩu ngữ, dùng với bạn bè.", "tw": "break", "new": [{"w": "knocking", "vi": "gõ"}, {"w": "silly", "vi": "ngớ ngẩn"}]}, {"type": "mc", "ctx": "Friends", "s": "“Here you ___—this is the book you asked for,” said Lan, handing it to her classmate across the desk.", "o": ["go", "come", "stay"], "a": "go", "vi": "“Đây nhé, cuốn sách cậu cần,” Lan nói, đưa cho bạn cùng lớp qua bàn.", "why": "Here you go = đây nhé (khi đưa đồ, tiền, món ăn cho ai); lịch sự, thân mật. Gần với Here you are.", "tw": "go", "new": [{"w": "handing", "vi": "đưa"}, {"w": "classmate", "vi": "bạn cùng lớp"}]}, {"type": "mc", "ctx": "Pharmacy", "s": "The pharmacist put the medicine in a paper bag, slid it across the counter and said, “___. Take two tablets after dinner.”", "o": ["There you go", "There you stay", "There you wait"], "a": "There you go", "vi": "Dược sĩ cho thuốc vào túi giấy, đẩy qua quầy và nói, “Đây nhé. Uống hai viên sau bữa tối.”", "why": "There you go. = xong rồi đấy / đây (khi đưa đồ hoặc xác nhận đã hoàn thành việc nhờ); thân mật.", "tw": "There you go", "new": [{"w": "tablets", "vi": "viên thuốc"}, {"w": "slid", "vi": "đẩy trượt"}]}, {"type": "mc", "ctx": "At the mechanic", "s": "Once the mechanic finished repairing the brakes, Mr Lee asked, “___?” and prepared to pay by card.", "o": ["How much do I owe you", "How far is it", "How long have you worked"], "a": "How much do I owe you", "vi": "Khi thợ máy sửa phanh xong, ông Lee hỏi, “Tôi nợ anh bao nhiêu?” và chuẩn bị trả bằng thẻ.", "why": "How much do I owe you? = tôi nợ/phải trả bạn bao nhiêu (khi chia tiền, thanh toán); trả lời: You owe me …", "tw": "How much do I owe you", "new": [{"w": "mechanic", "vi": "thợ máy"}, {"w": "brakes", "vi": "phanh"}]}, {"type": "mc", "ctx": "Print shop", "s": "I’d like to print fifty copies in colour, double-sided. ___? I need to know before I decide on the paper quality.", "o": ["How much will it be", "How old are you", "How was the weather"], "a": "How much will it be", "vi": "Tôi muốn in năm mươi bản màu, hai mặt. Hết bao nhiêu? Tôi cần biết trước khi chọn chất lượng giấy.", "why": "How much will it be? = hết bao nhiêu tiền (hỏi tổng giá khi mua hàng/dịch vụ); thường thêm altogether = tính tất cả.", "tw": "How much will it be", "new": [{"w": "copies", "vi": "bản sao"}, {"w": "double-sided", "vi": "hai mặt"}]}, {"type": "mc", "ctx": "Art gallery", "s": "The paintings ___ the artist’s childhood in a small fishing village, with sad colours and quiet scenes of empty boats.", "o": ["reflect", "hide", "borrow"], "a": "reflect", "vi": "Các bức tranh phản ánh tuổi thơ của họa sĩ ở làng chài nhỏ, với màu buồn và cảnh yên lặng của những con thuyền trống.", "why": "reflect sth = phản ánh/thể hiện; the results reflect students’ abilities; reflect on = suy ngẫm. Hay gặp: reflect the situation / reflect changes.", "tw": "reflect", "new": [{"w": "fishing village", "vi": "làng chài"}, {"w": "scenes", "vi": "cảnh"}], "ipa": "/rɪˈflekt/"}, {"type": "mc", "ctx": "Campus", "s": "Although the queue was long, the barista made the coffee ___ quick, so most students still arrived on time for the lecture.", "o": ["real", "real quickly", "very"], "a": "real", "vi": "Dù hàng dài, người pha chế làm cà phê rất nhanh, nên đa số sinh viên vẫn kịp giờ bài giảng.", "why": "real quick = thật nhanh/một chút thôi (khẩu ngữ Mỹ); Can I ask you something real quick? Dùng để xin phép ngắt lời lịch sự.", "tw": "real", "new": [{"w": "queue", "vi": "hàng người"}, {"w": "barista", "vi": "người pha cà phê"}]}, {"type": "mc", "ctx": "Advisor meeting", "s": "“Stocks might ___ higher returns than bonds over twenty years, yet their value can fall sharply in a single month,” the advisor said.", "o": ["pay", "wash", "hide"], "a": "pay", "vi": "“Cổ phiếu có thể mang lại lợi nhuận cao hơn trái phiếu trong hai mươi năm, nhưng giá trị có thể giảm mạnh trong một tháng,” cố vấn nói.", "why": "pay (higher) returns = mang lại lợi nhuận (cao); investment returns = lợi nhuận đầu tư; higher return thường đi kèm higher risk.", "tw": "pay", "new": [{"w": "bonds", "vi": "trái phiếu"}, {"w": "advisor", "vi": "cố vấn"}], "ipa": "/peɪ ˈhaɪ.ər rɪˈtɜːnz/"}, {"type": "mc", "ctx": "Traffic", "s": "The officer explained that drivers who park illegally must ___ a small fine, although repeated offences can lead to a much heavier penalty.", "o": ["pay", "charge", "win"], "a": "pay", "vi": "Cảnh sát giải thích rằng tài xế đỗ xe trái phép phải nộp phạt nhỏ, dù tái phạm có thể dẫn đến hình phạt nặng hơn nhiều.", "why": "pay a fine = nộp phạt; pay a small fine / a heavy fine; a fine for sth. Dùng với withdraw early, parking, late return.", "tw": "pay", "new": [{"w": "offences", "vi": "hành vi vi phạm"}, {"w": "penalty", "vi": "hình phạt"}], "ipa": "/peɪ ə smɔːl faɪn/"}, {"type": "mc", "ctx": "Investment seminar", "s": "Investors who ___ not to withdraw their money early are rewarded with higher returns, since the bank can plan its own lending more safely.", "o": ["agree", "refuse", "forget"], "a": "agree", "vi": "Nhà đầu tư đồng ý không rút tiền sớm được thưởng lợi nhuận cao hơn, vì ngân hàng có thể lên kế hoạch cho vay an toàn hơn.", "why": "agree not to + V = đồng ý/cam kết không làm gì; with a CD you agree not to withdraw money for a fixed period.", "tw": "agree", "new": [{"w": "rewarded", "vi": "được thưởng"}, {"w": "lending", "vi": "việc cho vay"}], "ipa": "/əˈɡriː nɒt tə wɪðˈdrɔː/"}, {"type": "mc", "ctx": "Pension plan", "s": "The pension scheme uses money from workers’ monthly contributions and ___ it in safe assets, so retired people receive a steady payment.", "o": ["invests", "spends", "loses"], "a": "invests", "vi": "Quỹ hưu trí dùng tiền đóng góp hằng tháng của người lao động và đầu tư vào tài sản an toàn, để người đã nghỉ hưu nhận khoản trả đều.", "why": "invest money from + nguồn = đầu tư tiền có từ …; invest in sth = đầu tư vào. A fund invests money from investors in financial products.", "tw": "invests", "new": [{"w": "contributions", "vi": "khoản đóng góp"}, {"w": "assets", "vi": "tài sản"}], "ipa": "/ɪnˈvest ˈmʌn.i frəm/"}, {"type": "mc", "ctx": "Financial seminar", "s": "Experts recommend that you do not ___ all your money in a single company, because if it fails, you may lose everything at once.", "o": ["place", "cut", "stop"], "a": "place", "vi": "Chuyên gia khuyên bạn không nên đặt tất cả tiền vào một công ty duy nhất, vì nếu nó thất bại bạn có thể mất tất cả cùng lúc.", "why": "place money in + nơi chốn = gửi/để tiền vào (tài khoản, quỹ); place + O + in/on. Dùng trang trọng hơn put.", "tw": "place", "new": [{"w": "recommend", "vi": "khuyên"}, {"w": "fails", "vi": "thất bại"}], "ipa": "/pleɪs ˈmʌn.i ɪn/"}, {"type": "mc", "ctx": "Policy debate", "s": "Critics say the scheme should ___ savings up to a higher amount, since many families keep more than the current limit in one account.", "o": ["guarantee", "predict", "cancel"], "a": "guarantee", "vi": "Người phê bình nói chương trình nên bảo đảm tiền tiết kiệm đến mức cao hơn, vì nhiều gia đình giữ nhiều hơn giới hạn hiện tại trong một tài khoản.", "why": "guarantee sth up to + số tiền = bảo đảm đến mức nào; the government guarantees savings up to a limit.", "tw": "guarantee", "new": [{"w": "critics", "vi": "người phê bình"}, {"w": "current", "vi": "hiện tại"}], "ipa": "/ˌɡær.ənˈtiː ˈseɪ.vɪŋz ʌp tuː/"}, {"type": "mc", "ctx": "Teen complaint", "s": "“I’m bored,” said Hoa on the phone. “___ much to do here on Sundays, and my friends all live on the other side of the city.”", "o": ["There isn’t", "There aren’t", "It isn’t"], "a": "There isn’t", "vi": "“Tớ chán quá,” Hoa nói qua điện thoại. “Chủ nhật ở đây không có nhiều thứ để làm, mà bạn tớ đều ở phía bên kia thành phố.”", "why": "There isn’t much to do (in + nơi) = ít hoạt động giải trí; thường nói về nơi nhỏ, vắng: in the village, at night.", "tw": "There isn’t", "new": [{"w": "bored", "vi": "chán"}, {"w": "side", "vi": "phía"}], "ipa": "/ðeər ˈɪz.ənt mʌtʃ tə duː/"}, {"type": "mc", "ctx": "Interview", "s": "___ from speaking three languages, she has also lived abroad for five years, which makes her an ideal candidate for the job.", "o": ["Apart", "Except", "Because"], "a": "Apart", "vi": "Ngoài việc nói ba thứ tiếng, cô còn sống ở nước ngoài năm năm, khiến cô là ứng viên lý tưởng cho công việc.", "why": "apart from + N/V-ing = ngoài ra / ngoại trừ; Apart from going to the market, there isn't much to do.", "tw": "Apart", "new": [{"w": "abroad", "vi": "ở nước ngoài"}, {"w": "ideal", "vi": "lý tưởng"}], "ipa": "/əˈpɑːt frəm/"}, {"type": "mc", "ctx": "Mountain trip", "s": "The summit looked close, yet it was still two hours ___ on foot, and the clouds were getting darker behind the ridge.", "o": ["away", "ahead", "apart"], "a": "away", "vi": "Đỉnh núi trông gần, nhưng vẫn còn cách hai giờ đi bộ, và mây phía sau dải núi đang tối dần.", "why": "[khoảng cách] + away = cách đây/đó bao xa; The nearest town is eight miles away. Cấu trúc: far away, two kilometres away.", "tw": "away", "new": [{"w": "summit", "vi": "đỉnh núi"}, {"w": "ridge", "vi": "dải núi"}], "ipa": "/əˈweɪ/"}, {"type": "mc", "ctx": "Rescue story", "s": "After three days without food or water, the lost hikers felt the situation was ___, until they heard a helicopter above the forest.", "o": ["hopeless", "comfortable", "exciting"], "a": "hopeless", "vi": "Sau ba ngày không đồ ăn, nước uống, những người đi bộ lạc đường cảm thấy tình hình vô vọng, cho đến khi họ nghe trực thăng trên rừng.", "why": "hopeless = tệ/vô dụng (khẩu ngữ) hoặc vô vọng; be hopeless at sth = rất kém ở việc gì; hopeless situation.", "tw": "hopeless", "new": [{"w": "helicopter", "vi": "trực thăng"}, {"w": "lost", "vi": "bị lạc"}], "ipa": "/ˈhəʊp.ləs/"}, {"type": "mc", "ctx": "Job market", "s": "“Honestly, ___ many chances like this,” the recruiter said. “If you want the position, you should apply before Friday.”", "o": ["you don’t get", "you can’t make", "you never keep"], "a": "you don’t get", "vi": "“Thật lòng mà nói, không có nhiều cơ hội như thế này đâu,” nhà tuyển dụng nói. “Nếu muốn vị trí này, bạn nên nộp đơn trước thứ Sáu.”", "why": "you don’t get many + N (đếm được, số nhiều) = ít khi có nhiều …; You don't get many shops in small villages.", "tw": "you don’t get", "new": [{"w": "recruiter", "vi": "nhà tuyển dụng"}, {"w": "apply", "vi": "nộp đơn"}], "ipa": "/ju dəʊnt ɡet ˈmen.i/"}, {"type": "mc", "ctx": "Landscape", "s": "Compared with a mountain, a ___ is lower and easier to climb, so even young children can walk to the top in under an hour.", "o": ["hill", "river", "island"], "a": "hill", "vi": "So với núi, đồi thấp hơn và dễ leo hơn, nên ngay cả trẻ nhỏ cũng có thể đi lên đỉnh trong chưa đến một giờ.", "why": "hill = đồi (thấp hơn núi: mountain); a green hill, climb a hill, on a hillside. Đối với núi dùng mountain.", "tw": "hill", "new": [{"w": "compared with", "vi": "so với"}, {"w": "under", "vi": "dưới"}], "ipa": "/hɪl/"}, {"type": "mc", "ctx": "Farming", "s": "Because the soil is rich and the climate is mild, this ___ has produced excellent grapes for more than two hundred years.", "o": ["valley", "desert", "harbour"], "a": "valley", "vi": "Vì đất màu mỡ và khí hậu ôn hòa, thung lũng này đã sản xuất nho tuyệt hảo hơn hai trăm năm.", "why": "valley = thung lũng, vùng đất thấp giữa các đồi/núi, thường có sông; in a valley, a fertile valley.", "tw": "valley", "new": [{"w": "soil", "vi": "đất"}, {"w": "mild", "vi": "ôn hòa"}], "ipa": "/ˈvæl.i/"}, {"type": "mc", "ctx": "Sports club", "s": "Heavy rain had turned the football ___ into a swamp, so the referee cancelled the match and sent both teams home.", "o": ["field", "kitchen", "corridor"], "a": "field", "vi": "Mưa lớn biến sân bóng thành đầm lầy, nên trọng tài hủy trận và cho cả hai đội về nhà.", "why": "field = cánh đồng/bãi đất (trồng trọt, chăn thả, thể thao); work in the fields, a football field. Số nhiều: fields.", "tw": "field", "new": [{"w": "swamp", "vi": "đầm lầy"}, {"w": "referee", "vi": "trọng tài"}], "ipa": "/fiːld/"}, {"type": "mc", "ctx": "Estate agent", "s": "The agent described the property as a spacious ___ with a large kitchen, two barns and enough land for a few horses.", "o": ["farmhouse", "skyscraper", "apartment"], "a": "farmhouse", "vi": "Nhân viên môi giới mô tả bất động sản là một nhà trang trại rộng với bếp lớn, hai kho thóc và đủ đất cho vài con ngựa.", "why": "farmhouse = ngôi nhà chính trong trang trại; live in a farmhouse, a stone farmhouse. Gồm farm + house.", "tw": "farmhouse", "new": [{"w": "barns", "vi": "kho thóc"}, {"w": "spacious", "vi": "rộng rãi"}], "ipa": "/ˈfɑːm.haʊs/"}, {"type": "mc", "ctx": "Farm school", "s": "Modern farms rely on a powerful ___ instead of manual labour, so a single worker can prepare a large field in one afternoon.", "o": ["tractor", "bicycle", "trolley"], "a": "tractor", "vi": "Các nông trại hiện đại dựa vào máy kéo mạnh thay vì lao động tay, nên một công nhân có thể chuẩn bị cánh đồng lớn trong một buổi chiều.", "why": "tractor = máy kéo (xe nông nghiệp lớn); drive a tractor, plough the field with a tractor.", "tw": "tractor", "new": [{"w": "rely on", "vi": "dựa vào"}, {"w": "manual labour", "vi": "lao động tay chân"}], "ipa": "/ˈtræk.tər/"}, {"type": "mc", "ctx": "Home repair", "s": "After the storm knocked down part of the garden ___, we spent the whole weekend replacing the broken boards with new ones.", "o": ["fence", "bridge", "ceiling"], "a": "fence", "vi": "Sau khi bão làm đổ một phần hàng rào vườn, chúng tôi dành cả cuối tuần thay các tấm ván hỏng bằng ván mới.", "why": "fence = hàng rào (gỗ, kim loại) quanh đất/vườn; build a fence, climb over a fence, wooden fence.", "tw": "fence", "new": [{"w": "knocked down", "vi": "làm đổ"}, {"w": "boards", "vi": "tấm ván"}], "ipa": "/fens/"}, {"type": "mc", "ctx": "Garden", "s": "The old iron ___ squeaked loudly whenever someone pushed it, so the family always knew exactly when a visitor had arrived.", "o": ["gate", "window", "stair"], "a": "gate", "vi": "Cổng sắt cũ kêu cót két mỗi khi ai đẩy, nên gia đình luôn biết chính xác khi nào có khách đến.", "why": "gate = cổng (vườn, nhà, sân bay); close the gate, boarding gate. Please close the gate when you leave.", "tw": "gate", "new": [{"w": "squeaked", "vi": "kêu cót két"}, {"w": "iron", "vi": "sắt"}], "ipa": "/ɡeɪt/"}, {"type": "mc", "ctx": "Hiking map", "s": "The map shows a ___ across the hill, but heavy rain has made it so muddy that only experienced hikers should attempt it.", "o": ["footpath", "motorway", "runway"], "a": "footpath", "vi": "Bản đồ chỉ một lối đi bộ qua ngọn đồi, nhưng mưa lớn khiến nó lầy đến mức chỉ người đi bộ có kinh nghiệm mới nên thử.", "why": "footpath = đường mòn/lối đi dành cho người đi bộ (ngoài đồng, ven đường); follow a footpath. Không dành cho xe.", "tw": "footpath", "new": [{"w": "attempt", "vi": "thử"}, {"w": "experienced", "vi": "có kinh nghiệm"}], "ipa": "/ˈfʊt.pɑːθ/"}, {"type": "mc", "ctx": "Garden work", "s": "He used a long saw to cut the dead ___ from the apple tree, so that new, healthy ones could grow in spring.", "o": ["branches", "roots", "leaves"], "a": "branches", "vi": "Anh dùng cưa dài cắt các cành khô khỏi cây táo, để những cành mới khỏe mạnh có thể mọc vào mùa xuân.", "why": "branch = cành cây; also chi nhánh (ngân hàng/công ty); a tree branch, break a branch. Ở đây: cành cây.", "tw": "branches", "new": [{"w": "saw", "vi": "cưa"}, {"w": "dead", "vi": "chết, khô"}], "ipa": "/brɑːntʃ/"}, {"type": "mc", "ctx": "Biology", "s": "In the sunlight, green ___ absorb carbon dioxide and produce food for the plant, which is why trees are so important for the air.", "o": ["leaves", "fruits", "stones"], "a": "leaves", "vi": "Dưới ánh nắng, lá xanh hấp thụ khí CO2 và tạo thức ăn cho cây, đó là lý do cây rất quan trọng với không khí.", "why": "leaves = lá cây (số nhiều của leaf); leaves turn yellow / fall in autumn. Đừng nhầm với động từ leaves (rời đi).", "tw": "leaves", "new": [{"w": "absorb", "vi": "hấp thụ"}, {"w": "carbon dioxide", "vi": "khí CO2"}], "ipa": "/liːvz/"}, {"type": "mc", "ctx": "Plant shop", "s": "Before putting the flower in a bigger pot, gently loosen its ___ with your fingers so that they can spread into the fresh soil.", "o": ["roots", "petals", "seeds"], "a": "roots", "vi": "Trước khi cho hoa vào chậu lớn hơn, hãy nhẹ nhàng nới rễ bằng ngón tay để chúng lan vào đất mới.", "why": "roots = rễ cây; tree roots grow under the ground; take root = bén rễ; the roots of a problem (nguồn gốc).", "tw": "roots", "new": [{"w": "loosen", "vi": "nới lỏng"}, {"w": "spread", "vi": "lan ra"}], "ipa": "/ruːts/"}, {"type": "mc", "ctx": "Earthquake lesson", "s": "During an earthquake, you should drop to the ___ and cover your head, because falling objects are more dangerous than the shaking itself.", "o": ["ground", "roof", "wall"], "a": "ground", "vi": "Khi động đất, bạn nên nằm xuống mặt đất và che đầu, vì vật rơi nguy hiểm hơn chính sự rung lắc.", "why": "ground = mặt đất; sit on the ground, under the ground, the ground floor. Nghĩa bóng: lý do (grounds).", "tw": "ground", "new": [{"w": "objects", "vi": "vật thể"}, {"w": "shaking", "vi": "sự rung lắc"}], "ipa": "/ɡraʊnd/"}, {"type": "mc", "ctx": "Garden chores", "s": "Although the weather was hot, Dad finally cut the long ___ in the front yard, since the neighbours had started to complain.", "o": ["grass", "sand", "snow"], "a": "grass", "vi": "Dù trời nóng, bố cuối cùng cũng cắt đám cỏ dài ở sân trước, vì hàng xóm bắt đầu phàn nàn.", "why": "grass = cỏ (không đếm được); cut / mow the grass, green grass, wet grass. Không nói a grass.", "tw": "grass", "new": [{"w": "yard", "vi": "sân"}, {"w": "complain", "vi": "phàn nàn"}], "ipa": "/ɡrɑːs/"}, {"type": "mc", "ctx": "Holiday", "s": "While we were away for two weeks, our neighbour kindly watered every ___ in the flat, so none of them died in the summer heat.", "o": ["plant", "chair", "picture"], "a": "plant", "vi": "Trong hai tuần chúng tôi đi vắng, hàng xóm tử tế tưới mọi cây trong căn hộ, nên không cây nào chết vì nóng mùa hè.", "why": "plant = cây/thực vật (danh từ); grow plants, water the plants. Còn là động từ (trồng) và nhà máy (power plant).", "tw": "plant", "new": [{"w": "watered", "vi": "tưới"}, {"w": "kindly", "vi": "tử tế"}], "ipa": "/plɑːnt/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Health news", "s": "A new study found that children who eat cereal with milk before school concentrate better in class. However, some brands contain far too much sugar. What does \"cereal\" mean?", "o": ["Ngũ cốc ăn sáng", "Bánh mì nướng", "Sữa chua trái cây"], "a": "Ngũ cốc ăn sáng", "vi": "Một nghiên cứu mới cho thấy trẻ ăn ngũ cốc với sữa trước giờ học tập trung tốt hơn trong lớp. Tuy nhiên, một số nhãn hiệu chứa quá nhiều đường. \"cereal\" có nghĩa là gì?", "why": "cereal = ngũ cốc ăn sáng (với sữa); danh từ không đếm được, hay gặp: a bowl of cereal, breakfast cereal.", "noblank": true, "say": "A new study found that children who eat cereal with milk before school concentrate better in class. However, some brands contain far too much sugar.", "tw": "cereal", "new": [{"w": "concentrate", "vi": "tập trung"}, {"w": "contain", "vi": "chứa"}], "ipa": "/ˈsɪr.i.əl/"}, {"type": "mc", "ctx": "Tech trends", "s": "The price of electric scooters soared in spring, yet by autumn it had dropped sharply. As the old saying goes, what goes up must come down. What does \"what goes up must come down\" mean?", "o": ["Cái gì tăng lên rồi cũng sẽ giảm xuống", "Càng lên cao càng nguy hiểm", "Thử thách nào cũng có phần thưởng"], "a": "Cái gì tăng lên rồi cũng sẽ giảm xuống", "vi": "Giá xe tay ga điện tăng vọt vào mùa xuân, nhưng đến mùa thu đã giảm mạnh. Như câu tục ngữ nói, cái gì đi lên thì cũng phải đi xuống. \"what goes up must come down\" có nghĩa là gì?", "why": "What goes up must come down = tục ngữ: giá cả, thành công… tăng mạnh rồi cũng sẽ giảm, không kéo dài mãi.", "noblank": true, "say": "The price of electric scooters soared in spring, yet by autumn it had dropped sharply. As the old saying goes, what goes up must come down.", "tw": "what goes up must come down", "new": [{"w": "soared", "vi": "tăng vọt"}, {"w": "sharply", "vi": "mạnh, đột ngột"}]}, {"type": "mc", "ctx": "Travel blog", "s": "The small coastal town attracts thousands of hikers every summer. Its clear water and quiet trails make it a perfect escape from busy cities. What does \"attract\" mean?", "o": ["Thu hút, khiến nhiều người muốn đến", "Làm phiền, gây khó chịu", "Cấm không cho vào"], "a": "Thu hút, khiến nhiều người muốn đến", "vi": "Thị trấn ven biển nhỏ thu hút hàng nghìn người đi bộ đường dài mỗi mùa hè. Nước trong và những con đường yên tĩnh biến nó thành nơi trốn khỏi thành phố ồn ào. \"attract\" có nghĩa là gì?", "why": "attract + người/vật = thu hút; collocation: attract tourists / investors / attention. Chia: attracts, attracted, attracting.", "noblank": true, "say": "The small coastal town attracts thousands of hikers every summer. Its clear water and quiet trails make it a perfect escape from busy cities.", "tw": "attract", "new": [{"w": "trails", "vi": "đường mòn"}, {"w": "escape", "vi": "nơi thoát khỏi"}], "ipa": "/əˈtrækt/"}, {"type": "mc", "ctx": "Press release", "s": "The charity organised a free concert to draw attention to the shortage of nurses. Reporters from three television channels attended the event. What does \"draw attention to\" mean?", "o": ["Thu hút sự chú ý", "Che giấu thông tin", "Vẽ một bức tranh"], "a": "Thu hút sự e between A and B for sth.", "noblank": true, "say": "Local bakeries are in a daily struggle against big chains. They fight for every customer by offering fresh bread at lower prices.", "tw": "struggle", "new": [{"w": "chains", "vi": "chuỗi cửa hàng"}, {"w": "fresh", "vi": "tươi"}], "ipa": "/ˈstrʌɡ.əl/"}, {"type": "mc", "ctx": "Economics text", "s": "There is strong competition, or struggle, between the two companies. Each one cuts prices to win a larger share of the market. What does \"struggle\" mean?", "o": ["Sự cạnh tranh, tranh đấu", "Sự đồng ý chung", "Sự chuẩn bị trước"], "a": "Sự cạnh tranh, tranh đấu", "vi": "Có sự cạnh tranh, hay tranh đấu, mạnh giữa hai công ty. Mỗi bên giảm giá để giành thị phần lớn hơn. \"struggle\" có nghĩa là gì?", "why": "struggle for sth / struggle between A and B = sự tranh đấu; gần nghĩa competition nhưng nhấn mạnh sự vất vả.", "noblank": true, "say": "There is strong competition, or struggle, between the two companies. Each one cuts prices to win a larger share of the market.", "tw": "struggle", "new": [{"w": "cuts", "vi": "cắt giảm"}, {"w": "share", "vi": "thị phần"}], "ipa": "/ˈstrʌɡ.əl/"}, {"type": "mc", "ctx": "Health article", "s": "Many elderly patients struggle to climb stairs after surgery. Physiotherapists therefore design simple daily exercises to rebuild their strength. What does \"struggle to\" mean?", "o": ["Gặp khó khăn lớn để làm gì", "Từ chối làm gì", "Được phép làm gì"], "a": "Gặp khó khăn lớn để làm gì", "vi": "Nhiều bệnh nhân lớn tuổi khó khăn lắm mới leo được cầu thang sau phẫu thuật. Vì vậy các nhà vật lý trị liệu thiết kế bài tập hằng ngày đơn giản để lấy lại sức. \"struggle to\" có nghĩa là gì?", "why": "struggle to + V = gặp khó khăn/cố hết sức để làm gì; many people struggle to survive / to pay rent.", "noblank": true, "say": "Many elderly patients struggle to climb stairs after surgery. Physiotherapists therefore design simple daily exercises to rebuild their strength.", "tw": "struggle to", "new": [{"w" ery proud.", "tw": "manage to", "new": [{"w": "mud", "vi": "bùn"}, {"w": "guide", "vi": "người hướng dẫn"}]}, {"type": "mc", "ctx": "Travel forum", "s": "He said he was interested in visiting rural areas rather than big cities. He wanted to learn how ordinary families live. What does \"be interested in\" mean?", "o": ["Quan tâm, hứng thú", "Sợ hãi, lo lắng", "Từ chối tham gia"], "a": "Quan tâm, hứng thú", "vi": "Anh nói anh quan tâm đến thăm vùng nông thôn hơn là thành phố lớn. Anh muốn tìm hiểu các gia đình bình thường sống thế nào. \"be interested in\" có nghĩa là gì?", "why": "be interested in + N/V-ing = quan tâm đến; I’m interested in learning… Đừng nhầm interested (người cảm thấy) với interesting (vật gây hứng thú).", "noblank": true, "say": "He said he was interested in visiting rural areas rather than big cities. He wanted to learn how ordinary families live.", "tw": "be interested in", "new": [{"w": "rural", "vi": "nông thôn"}, {"w": "ordinary", "vi": "bình thường"}]}, {"type": "mc", "ctx": "Dialogue reading", "s": "“If we split the cost equally, each of us pays thirty dollars.” “That sounds reasonable to me,” Ben answered. “Let’s do it.” What does \"That sounds reasonable to me.\" mean?", "o": ["Tôi thấy điều đó hợp lý", "Tôi thấy điều đó quá đắt", "Tôi không nghe rõ bạn"], "a": "Tôi thấy điều đó hợp lý", "vi": "“Nếu chia đều chi phí, mỗi người trả ba mươi đô.” “Tôi thấy hợp lý,” Ben đáp. “Làm vậy đi.” \"That sounds reasonable to me.\" có nghĩa là gì?", "why": "That sounds reasonable (to me) = nghe hợp lý với tôi; dùng để đồng ý lịch sự khi nghe đề xuất. Reasonable = hợp lý, phải chăng.", "noblank": true, "say": "“If we split the cost equally, each of us pays thirty dollars.” “That sounds reasonable to me,” Ben answered. “Let’s do it.”", "tw": "That sounds reasonable to me.", "new": [{"w": "split", "vi": "chia"}, {"w": "equally", "vi": "đều nhau"}]}, {"type": "mc", "ctx": "Study advice", "s": "Learning ten new words a day feels slow, but in the long term i eed time to recover\" có nghĩa là gì?", "why": "need time to recover = cần thời gian để hồi phục (sức khỏe, thể thao); recover from an illness / an injury.", "noblank": true, "say": "After a serious illness, your body needs time to recover. Rest, good sleep and light food are more helpful than hard exercise.", "tw": "need time to recover", "new": [{"w": "serious", "vi": "nghiêm trọng"}, {"w": "light food", "vi": "đồ ăn nhẹ"}]}, {"type": "mc", "ctx": "Economics", "s": "In the short term, cutting prices attracts customers. Over many years, though, constant discounts can damage a brand’s image. What does \"in the short term\" mean?", "o": ["Trong ngắn hạn", "Trong cả đời", "Trong mọi trường hợp"], "a": "Trong ngắn hạn", "vi": "Trong ngắn hạn, giảm giá thu hút khách. Tuy nhiên qua nhiều năm, giảm giá liên tục có thể làm hại hình ảnh thương hiệu. \"in the short term\" có nghĩa là gì?", "why": "in the short term = trong thời gian ngắn trước mắt (opp: in the long term); in the short term, overtime may raise output.", "noblank": true, "say": "In the short term, cutting prices attracts customers. Over many years, though, constant discounts can damage a brand’s image.", "tw": "in the short term", "new": [{"w": "discounts", "vi": "giảm giá"}, {"w": "image", "vi": "hình ảnh"}]}, {"type": "mc", "ctx": "Life advice", "s": "“Don’t be upset about one failed exam,” said Tuan’s uncle. “Sometimes you’re up, sometimes you’re down. What matters is that you keep trying.” What does \"Sometimes you’re up, sometimes you’re down.\" mean?", "o": ["Có lúc thuận lợi, có lúc khó khăn", "Luôn luôn gặp may mắn", "Không bao giờ thất bại"], "a": "Có lúc thuận lợi, có lúc khó khăn", "vi": "“Đừng buồn vì một bài thi trượt,” chú của Tuấn nói. “Có lúc thăng, có lúc trầm. Quan trọng là con tiếp tục cố gắng.” \"Sometimes you’re up, sometimes you’re down.\" có nghĩa là gì?", "why": "Sometimes you’re up, sometimes you’re down = cuộc sống có lúc thuận lợi, có lúc khó khăn; dùng để an ủi, chấp nhận thăng trầm ut did not break.", "tw": "branch", "new": [{"w": "bent", "vi": "cong"}, {"w": "weight", "vi": "sức nặng"}], "ipa": "/brɑːntʃ/"}, {"type": "mc", "ctx": "Garden tips", "s": "The leaves of this tropical plant are very large. When it rains, they work like umbrellas for the small insects below. What does \"leaves\" mean?", "o": ["Những chiếc lá", "Những bông hoa", "Những chiếc rễ"], "a": "Những chiếc lá", "vi": "Lá của cây nhiệt đới này rất lớn. Khi trời mưa, chúng như những chiếc ô cho côn trùng nhỏ bên dưới. \"leaves\" có nghĩa là gì?", "why": "leaves = lá cây (số nhiều của leaf); leaves turn yellow / fall in autumn. Đừng nhầm với động từ leaves (rời đi).", "noblank": true, "say": "The leaves of this tropical plant are very large. When it rains, they work like umbrellas for the small insects below.", "tw": "leaves", "new": [{"w": "tropical", "vi": "nhiệt đới"}, {"w": "insects", "vi": "côn trùng"}], "ipa": "/liːvz/"}, {"type": "mc", "ctx": "Science text", "s": "The roots of the old banyan tree grow deep into the ground. They keep the tree stable even during violent storms. What does \"roots\" mean?", "o": ["Rễ cây", "Cành cây", "Quả trên cây"], "a": "Rễ cây", "vi": "Rễ của cây đa cổ thụ mọc sâu xuống đất. Chúng giữ cây vững ngay cả trong bão dữ. \"roots\" có nghĩa là gì?", "why": "roots = rễ cây; tree roots grow under the ground; take root = bén rễ; the roots of a problem (nguồn gốc).", "noblank": true, "say": "The roots of the old banyan tree grow deep into the ground. They keep the tree stable even during violent storms.", "tw": "roots", "new": [{"w": "stable", "vi": "vững vàng"}, {"w": "violent", "vi": "dữ dội"}], "ipa": "/ruːts/"}, {"type": "mc", "ctx": "Garden diary", "s": "Overnight, heavy rain soaked the ground. The next morning, small green shoots were already pushing through the wet soil. What does \"ground\" mean?", "o": ["Mặt đất", "Bầu trời", "Mái nhà"], "a": "Mặt đất", "vi": "Qua đêm, mưa lớn làm ướt mặt đất. Sáng hôm sau, những chồi xanh nhỏ đã nhú lên qua lớp đất ẩm. \"ground\" có nghĩa là gì?", "why": "ground = mặt đất; sit on the ground, under the ground, the ground floor. Nghĩa bóng: lý do (grounds).", "noblank": true, "say": "Overnight, heavy rain soaked the ground. The next morning, small green shoots were already pushing through the wet soil.", "tw": "ground", "new": [{"w": "shoots", "vi": "chồi"}, {"w": "soaked", "vi": "làm ướt đẫm"}], "ipa": "/ɡraʊnd/"}, {"type": "mc", "ctx": "Park rules", "s": "Please do not walk on the grass in the new park. The young plants are weak and need time to grow. What does \"grass\" mean?", "o": ["Cỏ", "Cát", "Đá sỏi"], "a": "Cỏ", "vi": "Xin đừng đi trên cỏ trong công viên mới. Cây non còn yếu và cần thời gian để lớn. \"grass\" có nghĩa là gì?", "why": "grass = cỏ (không đếm được); cut / mow the grass, green grass, wet grass. Không nói a grass.", "noblank": true, "say": "Please do not walk on the grass in the new park. The young plants are weak and need time to grow.", "tw": "grass", "new": [{"w": "weak", "vi": "yếu"}, {"w": "young", "vi": "non"}], "ipa": "/ɡrɑːs/"}, {"type": "mc", "ctx": "Biology class", "s": "Every plant needs light, water and air to grow. Without any of these, even the strongest plant slowly dies. What does \"plant\" mean?", "o": ["Cây, thực vật", "Động vật hoang dã", "Loại đất đặc biệt"], "a": "Cây, thực vật", "vi": "Mọi cây đều cần ánh sáng, nước và không khí để lớn. Thiếu bất kỳ thứ nào, ngay cả cây khỏe nhất cũng chết dần. \"plant\" có nghĩa là gì?", "why": "plant = cây/thực vật (danh từ); grow plants, water the plants. Còn là động từ (trồng) và nhà máy (power plant).", "noblank": true, "say": "Every plant needs light, water and air to grow. Without any of these, even the strongest plant slowly dies.", "tw": "plant", "new": [{"w": "strongest", "vi": "khỏe nhất"}, {"w": "slowly", "vi": "từ từ"}], "ipa": "/plɑːnt/"}]}]};
  const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  /* ---------- prepare ---------- */
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ALL=[];
  SECTIONS.forEach(sec=>sec.qs.forEach((q,i)=>{q.id=sec.id+'q'+(i+1);q.sec=sec.id;q.n=i+1;if(q.type==='mc')q.opts=shuffle(q.o);ALL.push(q);}));
  const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));

  const KEY=DATA.meta.storageKey||'drill-v1';
  let state={};
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
  const isRight=(q,v)=>q.type==='mc'?v===q.a:q.acc.some(x=>norm(x)===norm(v));

  const hintsOpen=new Set();
  let current=SECTIONS[0].id;
  const $=id=>document.getElementById(id);

  /* ---------- listening (browser speech synthesis) ---------- */
  const CAN_SPEAK=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
  let voice=null;
  /* Fallback voice: prefer natural / neural US English voices when the audio files cannot be played. */
  function pickVoice(){
    if(!CAN_SPEAK)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/aria|jenny|ava|andrew|guy|samantha|google us/i.test(v.name)?2:0)+(v.localService?0:1);
    voice=vs.sort((a,b)=>score(b)-score(a))[0]||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang))||null;
  }
  if(CAN_SPEAK){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
  let audio=null;
  let cur=null; /* what is playing now: {id, kind:'audio'|'tts', paused} */
  function updateControls(){
    document.querySelectorAll('[data-pause]').forEach(b=>{
      const active=!!cur&&cur.id===b.dataset.pause;
      b.disabled=!active;
      const paused=active&&cur.paused;
      b.querySelector('span').textContent=paused?'Tiếp tục':'Tạm dừng';
      b.querySelector('.i-pause').hidden=paused;
      b.querySelector('.i-play').hidden=!paused;
      b.classList.toggle('on',paused);
    });
  }
  function stopAudio(){
    if(audio){audio.onended=audio.onerror=audio.onplaying=null;audio.pause();audio=null;}
    if(CAN_SPEAK)speechSynthesis.cancel();
    cur=null;
    document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
    updateControls();
  }
  function togglePause(id){
    if(!cur||cur.id!==id)return;
    if(cur.kind==='audio'&&audio){
      if(audio.paused){audio.play();cur.paused=false;}else{audio.pause();cur.paused=true;}
    }else if(cur.kind==='tts'&&CAN_SPEAK){
      if(speechSynthesis.paused){speechSynthesis.resume();cur.paused=false;}else{speechSynthesis.pause();cur.paused=true;}
    }
    updateControls();
  }
  function speakFallback(id,done,slow,btn){
    if(!CAN_SPEAK){cur=null;updateControls();return;}
    const q=byId[id];
    const text=(q.listen?q.s.replace('___',q.a||'')+'':q.s.includes('___')?q.s.replace('___',done?q.a:'blank'):(done?q.s+' '+q.a:q.s)).replace(/\b(\d{1,2})\.(\d{2})\b/g,'$1:$2');
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang;}
    u.rate=slow?0.65:0.95;
    cur={id,kind:'tts',paused:false};
    u.onstart=()=>{btn&&btn.classList.add('on');updateControls();};
    u.onend=u.onerror=()=>{btn&&btn.classList.remove('on');if(cur&&cur.kind==='tts'&&cur.id===id)cur=null;updateControls();};
    speechSynthesis.speak(u);
    updateControls();
  }
  function speak(id,slow,btn){
    stopAudio();
    const done=!!state[id];
    const suffix=(slow?'s':'')+(done?(slow?'':'f'):'b');
    const a=new Audio('audio/'+id+'_'+suffix+'.mp3'+(DATA.meta.audioVersion?'?v='+DATA.meta.audioVersion:''));
    audio=a;
    cur={id,kind:'audio',paused:false};
    let failed=false;
    const fail=()=>{if(failed||audio!==a)return;failed=true;audio=null;speakFallback(id,done,slow,btn);};
    a.onplaying=()=>{btn&&btn.classList.add('on');updateControls();};
    a.onended=()=>{btn&&btn.classList.remove('on');if(audio===a){audio=null;cur=null;}updateControls();};
    a.onerror=fail;
    updateControls();
    const p=a.play();
    if(p&&p.catch)p.catch(fail);
  }

  /* ---------- single word pronunciation (audio/w_<slug>.mp3, browser voice as fallback) ---------- */
  const slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  function playWord(text,btn){
    stopAudio();
    const clean=String(text).replace(/\.\.\./g,' ').replace(/\s+/g,' ').trim();
    if(!clean)return;
    const a=new Audio('audio/w_'+slug(text)+'.mp3'+(DATA.meta.audioVersion?'?v='+DATA.meta.audioVersion:''));
    audio=a;cur={id:'w',kind:'audio',paused:false};
    let failed=false;
    const fail=()=>{
      if(failed||audio!==a)return;failed=true;audio=null;cur=null;
      if(!CAN_SPEAK)return;
      const u=new SpeechSynthesisUtterance(clean);
      u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang;}u.rate=0.9;
      speechSynthesis.speak(u);
    };
    a.onplaying=()=>{btn&&btn.classList.add('on');};
    a.onended=()=>{btn&&btn.classList.remove('on');if(audio===a){audio=null;cur=null;}};
    a.onerror=fail;
    const p=a.play();
    if(p&&p.catch)p.catch(fail);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=ALL.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(ALL);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=ALL.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
