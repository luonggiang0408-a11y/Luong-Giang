/* Layout: one narrow reading column, sticky section tabs, one question card at a time per row. */
:root{
  --bg:#F2F6F8; --surface:#FFFFFF; --ink:#12263A; --muted:#566879; --line:#D3DDE5;
  --primary:#0E5A78; --primary-ink:#FFFFFF; --hl:#E6F36E; --hl-ink:#12263A;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
    --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
    --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}

.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}

.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}

.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .tag{font-weight:700;margin-right:8px}
.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

ắt xe buýt.", "new": [{"w": "castle", "vi": "lâu đài"}], "tw": "get the bus"}, {"type": "mc", "ctx": "Metro repairs", "s": "Because the metro is closed for repairs, commuters are advised to ___ outside the station instead of driving, as parking is limited.", "o": ["get the bus", "lose the bus", "buy the bus"], "a": "get the bus", "vi": "Vì tàu điện đóng sửa chữa, người đi làm được khuyên bắt xe buýt ngoài nhà ga thay vì lái xe do chỗ đậu hạn chế.", "why": "commuters advised → bắt xe buýt.", "new": [{"w": "repairs", "vi": "sửa chữa"}], "tw": "get the bus"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "<b>Chọn nghĩa.<\/b> Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng.", "qs": [{"type": "mc", "ctx": "Traffic report", "s": "Between 7 and 9 a.m. and again around 5 p.m., the streets are packed with cars and buses. This is the busiest period of the day for commuters. What does \"rush hour\" mean?", "o": ["giờ cao điểm", "giờ ăn trưa", "giờ nghỉ giải lao"], "a": "giờ cao điểm", "vi": "Từ 7 đến 9 giờ sáng và lại khoảng 5 giờ chiều, đường phố chật kín ô tô và xe buýt. Đây là khoảng thời gian bận rộn nhất trong ngày với người đi làm.", "why": "busiest period + streets packed → giờ cao điểm.", "noblank": true, "say": "Between 7 and 9 a.m. and again around 5 p.m., the streets are packed with cars and buses. This is the busiest period of the day for commuters.", "new": [{"w": "packed", "vi": "chật kín"}, {"w": "commuters", "vi": "người đi làm hằng ngày"}], "tw": "rush hour", "ipa": "/ˈrʌʃ ˌaʊə/"}, {"type": "mc", "ctx": "City hall news", "s": "Officials introduced a fee for driving downtown during rush hour, hoping fewer people would travel at the busiest time. As a result, traffic fell by nearly ten percent. What does \"rush hour\" mean?", "o": ["giờ cao điểm", "giờ mở cửa", "giờ làm thêm"], "a": "giờ cao điểm", "vi": "Chính quyền áp dụng phí lái xe vào trung tâm trong giờ cao điểm, hy vọng ít người đi lại hơn vào lúc đông nhất. Kết quả là lượng xe giảm gần mười phần trăm.", "why": "busiest time → rush hour = giờ cao điểm.", "noblank": true, "say": "Officials introduced a fee for driving downtown during rush hour, hoping fewer people would travel at the busiest time. As a result, traffic fell by nearly ten percent.", "new": [{"w": "fee", "vi": "khoản phí"}], "tw": "rush hour", "ipa": "/ˈrʌʃ ˌaʊə/"}, {"type": "mc", "ctx": "Morning scene", "s": "Tom grabbed his keys and ran to the door without even saying goodbye. His boss was waiting and the meeting would start in five minutes. What does \"be in a hurry\" mean?", "o": ["vội vã", "thư giãn", "bối rối"], "a": "vội vã", "vi": "Tom chộp chìa khóa và chạy ra cửa mà không kịp chào. Sếp đang chờ và cuộc họp sẽ bắt đầu sau năm phút.", "why": "ran, five minutes → vội vã.", "noblank": true, "say": "Tom grabbed his keys and ran to the door without even saying goodbye. His boss was waiting and the meeting would start in five minutes.", "new": [{"w": "grabbed", "vi": "chộp lấy"}], "tw": "be in a hurry", "ipa": "/ɪn ə ˈhʌri/"}, {"type": "mc", "ctx": "Station announcement", "s": "The man pushed past the other passengers, checking his watch every few seconds. His flight was about to close and he had no time to spare. What does \"be in a hurry\" mean?", "o": ["vội vã", "chán nản", "tò mò"], "a": "vội vã", "vi": "Người đàn ông len qua các hành khách khác, liên tục xem đồng hồ. Chuyến bay sắp đóng cửa và anh không còn thời gian.", "why": "no time to spare → vội.", "noblank": true, "say": "The man pushed past the other passengers, checking his watch every few seconds. His flight was about to close and he had no time to spare.", "new": [{"w": "spare", "vi": "dư ra"}], "tw": "be in a hurry", "ipa": "/ɪn ə ˈhʌri/"}, {"type": "mc", "ctx": "Coach trip", "s": "Our coach should have reached the stadium at noon, but an accident blocked the motorway and vehicles barely moved for two hours. We got stuck in traffic jams. What does \"get stuck in traffic jams\" mean?", "o": ["bị kẹt xe", "bị mất xe", "bị phạt tốc độ"], "a": "bị kẹt xe", "vi": "Xe khách lẽ ra đến sân vận động lúc trưa, nhưng tai nạn chặn xa lộ và xe hầu như không nhúc nhích hai giờ. Chúng tôi bị kẹt xe.", "why": "vehicles barely moved → kẹt xe.", "noblank": true, "say": "Our coach should have reached the stadium at noon, but an accident blocked the motorway and vehicles barely moved for two hours. We got stuck in traffic jams.", "new": [{"w": "motorway", "vi": "xa lộ"}], "tw": "get stuck in traffic jams", "ipa": "/ɡet stʌk ɪn ˈtræfɪk dʒæmz/"}, {"type": "mc", "ctx": "Environment report", "s": "City residents lose many hours each year when they get stuck in traffic jams, which also increases pollution because engines keep running while cars stand still. What does \"get stuck in traffic jams\" mean?", "o": ["bị kẹt xe", "đi xe đạp", "đỗ xe sai chỗ"], "a": "bị kẹt xe", "vi": "Cư dân thành phố mất nhiều giờ mỗi năm khi bị kẹt xe, điều này cũng làm tăng ô nhiễm vì động cơ vẫn chạy khi xe đứng yên.", "why": "cars stand still → kẹt xe.", "noblank": true, "say": "City residents lose many hours each year when they get stuck in traffic jams, which also increases pollution because engines keep running while cars stand still.", "new": [{"w": "engines", "vi": "động cơ"}], "tw": "get stuck in traffic jams", "ipa": "/ɡet stʌk ɪn ˈtræfɪk dʒæmz/"}, {"type": "mc", "ctx": "Neighbourhood news", "s": "On Friday evenings the street outside the restaurant is full. Customers drive around for twenty minutes because there is nowhere to park. What does \"nowhere to park\" mean?", "o": ["không có chỗ đậu xe", "không có chỗ ngồi", "không có thức ăn"], "a": "không có chỗ đậu xe", "vi": "Tối thứ Sáu, con phố trước nhà hàng kín xe. Khách lái vòng quanh hai mươi phút vì không có chỗ đậu xe.", "why": "drive around 20 minutes → không chỗ đậu.", "noblank": true, "say": "On Friday evenings the street outside the restaurant is full. Customers drive around for twenty minutes because there is nowhere to park.", "new": [{"w": "drive around", "vi": "lái vòng quanh"}], "tw": "nowhere to park", "ipa": "/ˈnəʊweə tə pɑːk/"}, {"type": "mc", "ctx": "Student complaint", "s": "Many students now cycle to campus. They say the car park is always full by eight o'clock, so there is nowhere to park for latecomers. What does \"nowhere to park\" mean?", "o": ["không có chỗ đậu xe", "không có chỗ học", "không có đường đi"], "a": "không có chỗ đậu xe", "vi": "Nhiều sinh viên giờ đạp xe đến trường. Họ nói bãi xe luôn đầy trước tám giờ nên người đến muộn không có chỗ đậu.", "why": "car park full → không chỗ đậu.", "noblank": true, "say": "Many students now cycle to campus. They say the car park is always full by eight o'clock, so there is nowhere to park for latecomers.", "new": [{"w": "latecomers", "vi": "người đến muộn"}], "tw": "nowhere to park", "ipa": "/ˈnəʊweə tə pɑːk/"}, {"type": "mc", "ctx": "Housing ad", "s": "The flat is close to the metro and has a small balcony. It also includes a parking space behind the building, which is rare in this crowded district. What does \"parking space\" mean?", "o": ["chỗ đỗ xe", "phòng khách", "lối thoát hiểm"], "a": "chỗ đỗ xe", "vi": "Căn hộ gần tàu điện và có ban công nhỏ. Nó còn có chỗ đỗ xe phía sau tòa nhà, điều hiếm ở khu đông đúc này.", "why": "behind the building, rare → chỗ đỗ xe.", "noblank": true, "say": "The flat is close to the metro and has a small balcony. It also includes a parking space behind the building, which is rare in this crowded district.", "new": [{"w": "balcony", "vi": "ban công"}], "tw": "parking space", "ipa": "/ˈkɑː pɑːk/"}, {"type": "mc", "ctx": "Shop sign", "s": "Customers may use the free parking spaces in front of the shop for up to two hours. After that, a small charge applies. What does \"parking space\" mean?", "o": ["chỗ đỗ xe", "khu vui chơi", "quầy thu ngân"], "a": "chỗ đỗ xe", "vi": "Khách có thể dùng các chỗ đỗ xe miễn phí trước cửa hàng tối đa hai giờ. Sau đó sẽ tính một khoản phí nhỏ.", "why": "free ... two hours → chỗ đỗ xe.", "noblank": true, "say": "Customers may use the free parking spaces in front of the shop for up to two hours. After that, a small charge applies.", "new": [{"w": "charge", "vi": "phí"}], "tw": "parking space", "ipa": "/ˈkɑː pɑːk/"}, {"type": "mc", "ctx": "Work blog", "s": "Dealing with angry customers all day is a stressful experience. By the evening, many call-centre workers feel tired and tense. What does \"stressful\" mean?", "o": ["gây căng thẳng", "thú vị", "an toàn"], "a": "gây căng thẳng", "vi": "Đối phó với khách hàng giận dữ cả ngày là trải nghiệm căng thẳng. Đến tối, nhiều nhân viên tổng đài thấy mệt và căng.", "why": "tired and tense → stressful.", "noblank": true, "say": "Dealing with angry customers all day is a stressful experience. By the evening, many call-centre workers feel tired and tense.", "new": [{"w": "tense", "vi": "căng thẳng"}], "tw": "stressful", "ipa": "/ˈstresfl/"}, {"type": "mc", "ctx": "Student forum", "s": "Writing a thesis while working part-time is stressful. Several students admitted that they lost weight and could hardly relax. What does \"stressful\" mean?", "o": ["gây căng thẳng", "dễ dàng", "rẻ tiền"], "a": "gây căng thẳng", "vi": "Viết luận văn trong khi làm thêm thật căng thẳng. Vài sinh viên thừa nhận sụt cân và khó thư giãn.", "why": "hardly relax → stressful.", "noblank": true, "say": "Writing a thesis while working part-time is stressful. Several students admitted that they lost weight and could hardly relax.", "new": [{"w": "thesis", "vi": "luận văn"}], "tw": "stressful", "ipa": "/ˈstresfl/"}, {"type": "mc", "ctx": "Diary", "s": "Sara has worked twelve hours a day for a month. She can't sleep, she snaps at her friends, and her hands shake. What does \"stressed\" mean?", "o": ["cảm thấy căng thẳng", "cảm thấy hào hứng", "cảm thấy buồn ngủ"], "a": "cảm thấy căng thẳng", "vi": "Sara làm mười hai giờ mỗi ngày suốt một tháng. Cô không ngủ được, gắt gỏng với bạn và tay run.", "why": "can't sleep, snaps → căng thẳng.", "noblank": true, "say": "Sara has worked twelve hours a day for a month. She can't sleep, she snaps at her friends, and her hands shake.", "new": [{"w": "snaps at", "vi": "gắt gỏng với"}], "tw": "stressed", "ipa": "/strest/"}, {"type": "mc", "ctx": "Wellbeing talk", "s": "When people are stressed, their heart beats faster and they find it harder to make decisions. Taking a short walk can help. What does \"stressed\" mean?", "o": ["cảm thấy căng thẳng", "cảm thấy no", "cảm thấy lạnh"], "a": "cảm thấy căng thẳng", "vi": "Khi con người căng thẳng, tim đập nhanh hơn và khó ra quyết định hơn. Đi bộ ngắn có thể giúp ích.", "why": "heart faster, harder decisions → căng thẳng.", "noblank": true, "say": "When people are stressed, their heart beats faster and they find it harder to make decisions. Taking a short walk can help.", "new": [{"w": "decisions", "vi": "quyết định"}], "tw": "stressed", "ipa": "/strest/"}, {"type": "mc", "ctx": "Magazine", "s": "After a quiet day at the beach, visitors can enjoy the town's nightlife: live bands play in the square and restaurants stay open late. What does \"nightlife\" mean?", "o": ["cuộc sống về đêm", "thời tiết ban đêm", "giấc ngủ ban đêm"], "a": "cuộc sống về đêm", "vi": "Sau một ngày yên tĩnh ở bãi biển, du khách có thể tận hưởng cuộc sống về đêm: ban nhạc chơi ở quảng trường và nhà hàng mở khuya.", "why": "live bands, open late → nightlife.", "noblank": true, "say": "After a quiet day at the beach, visitors can enjoy the town's nightlife: live bands play in the square and restaurants stay open late.", "new": [{"w": "square", "vi": "quảng trường"}], "tw": "nightlife", "ipa": "/ˈnaɪtlaɪf/"}, {"type": "mc", "ctx": "Relocation", "s": "He turned down a job in the village because he wanted a place with more nightlife. He missed the clubs, late-night cinemas and busy streets. What does \"nightlife\" mean?", "o": ["cuộc sống về đêm", "cơ hội việc làm", "giá nhà ở"], "a": "cuộc sống về đêm", "vi": "Anh từ chối công việc ở làng vì muốn nơi có nhiều cuộc sống về đêm hơn. Anh     u.rate=slow?0.65:0.95;
    cur={id,kind:'tts',paused:false};
    u.onstart=()=>{btn&&btn.classList.add('on');updateControls();};
    u.onend=u.onerror=()=>{btn&&btn.classList.remove('on');if(cur&&cur.kind==='tts'&&cur.id===id)cur=null;updateControls();};
    speechSynthesis.speak(u);
    updateControls();
  }
  function speak(id,slow,btn){
    stopAudio();
    const done=!!state[id];
    const suffix=(slow?'s':'')+(done?(slow?'':'f'):'b');
    const a=new Audio('audio/'+id+'_'+suffix+'.mp3'+(DATA.meta.audioVersion?'?v='+DATA.meta.audioVersion:''));
    audio=a;
    cur={id,kind:'audio',paused:false};
    let failed=false;
    const fail=()=>{if(failed||audio!==a)return;failed=true;audio=null;speakFallback(id,done,slow,btn);};
    a.onplaying=()=>{btn&&btn.classList.add('on');updateControls();};
    a.onended=()=>{btn&&btn.classList.remove('on');if(audio===a){audio=null;cur=null;}updateControls();};
    a.onerror=fail;
    updateControls();
    const p=a.play();
    if(p&&p.catch)p.catch(fail);
  }

  /* ---------- single word pronunciation (audio/w_<slug>.mp3, browser voice as fallback) ---------- */
  const slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  function playWord(text,btn){
    stopAudio();
    const clean=String(text).replace(/\.\.\./g,' ').replace(/\s+/g,' ').trim();
    if(!clean)return;
    const a=new Audio('audio/w_'+slug(text)+'.mp3'+(DATA.meta.audioVersion?'?v='+DATA.meta.audioVersion:''));
    audio=a;cur={id:'w',kind:'audio',paused:false};
    let failed=false;
    const fail=()=>{
      if(failed||audio!==a)return;failed=true;audio=null;cur=null;
      if(!CAN_SPEAK)return;
      const u=new SpeechSynthesisUtterance(clean);
      u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang;}u.rate=0.9;
      speechSynthesis.speak(u);
    };
    a.onplaying=()=>{btn&&btn.classList.add('on');};
    a.onended=()=>{btn&&btn.classList.remove('on');if(audio===a){audio=null;cur=null;}};
    a.onerror=fail;
    const p=a.play();
    if(p&&p.catch)p.catch(fail);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=ALL.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(ALL);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=ALL.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
