    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .tag{font-weight:700;margin-right:8px}
.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}
.manual summary{cursor:pointer;color:var(--muted)}
.manual textarea{width:100%;min-height:90px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.band .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--primary)}
.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

nd rarely exercise.", "o": ["disease", "disaster", "diet"], "a": "disease", "vi": "Các bác sĩ cảnh báo bệnh tim đang trở nên phổ biến hơn, một phần vì mọi người ăn quá nhiều đồ ăn nhanh và ít vận động.", "why": "disease = bệnh cụ thể (heart disease, infectious disease); illness thiên về tình trạng ốm.", "tw": "disease", "ipa": "/dɪˈziːz/"}, {"type": "mc", "ctx": "School absence", "s": "Several pupils were absent because of ___, and the teacher asked their parents to send a note explaining how long they had been unwell.", "o": ["illness", "holiday", "homework"], "a": "illness", "vi": "Một số học sinh nghỉ học vì bệnh, và giáo viên nhờ phụ huynh gửi giấy báo nói các em đã ốm bao lâu.", "why": "illness = tình trạng bị bệnh (a long illness); disease = tên một bệnh cụ thể.", "tw": "illness", "new": [{"w": "absent", "vi": "vắng mặt"}], "ipa": "/ˈɪl.nəs/"}, {"type": "mc", "ctx": "Health news", "s": "Doctors usually ___ this kind of infection with antibiotics, but patients must finish the whole course even after they feel better.", "o": ["treat", "cause", "spread"], "a": "treat", "vi": "Bác sĩ thường điều trị kiểu nhiễm trùng này bằng kháng sinh, nhưng bệnh nhân phải dùng hết liệu trình dù đã thấy đỡ.", "why": "treat = điều trị (treat a patient/an illness); danh từ là treatment.", "tw": "treat", "new": [{"w": "antibiotics", "vi": "thuốc kháng sinh"}, {"w": "course", "vi": "liệu trình"}], "ipa": "/triːt/"}, {"type": "mc", "ctx": "Health news", "s": "Although the new ___ is expensive, it has helped thousands of people recover from the infection much faster than before.", "o": ["treatment", "symptom", "fever"], "a": "treatment", "vi": "Dù phương pháp điều trị mới đắt, nó đã giúp hàng nghìn người khỏi nhiễm trùng nhanh hơn trước nhiều.", "why": "treatment = sự/phương pháp điều trị (go into hospital for treatment).", "tw": "treatment", "ipa": "/ˈtriːt.mənt/"}, {"type": "mc", "ctx": "Doctor's talk", "s": "Hepatitis is a disease that affects the ___, so patients are usually advise : "It took me twenty minutes to find a ___ for my car near the cinema, so by the time I arrived, the film had already started.", "o": ["parking space", "playing field", "bus stop"], "a": "parking space", "vi": "Các khu chung cư mới trong thành phố phải có ít nhất một chỗ đỗ xe cho mỗi căn hộ, nếu không đường phố sẽ bị xe làm tắc.", "why": "parking space = chỗ đỗ xe (find a parking space).", "tw": "parking space", "new": [{"w": "apartment blocks", "vi": "khu chung cư"}], "ipa": "/ˈkɑː pɑːk/"}, {"type": "mc", "ctx": "Evening out", "s": "Students often prefer a ___ neighbourhood with cafés and bars, whereas older people usually look for somewhere quiet and peaceful.", "o": ["lively", "gloomy", "silent"], "a": "lively", "vi": "Sinh viên thường thích khu phố sôi động có quán cà phê và quán bar, trong khi người lớn tuổi thường tìm nơi yên tĩnh.", "why": "lively = sôi động (lively city/atmosphere); trái nghĩa: dull, quiet.", "tw": "lively", "new": [{"w": "gloomy", "vi": "u ám"}], "ipa": "/ˈlaɪvli/"}, {"type": "mc", "ctx": "Weather report", "s": "The lecture was so ___ that half of the audience started checking their phones, and several people left before the end.", "o": ["dull", "thrilling", "hilarious"], "a": "dull", "vi": "Bài giảng chán đến mức một nửa khán giả bắt đầu xem điện thoại và vài người rời đi trước khi kết thúc.", "why": "dull = buồn tẻ, nhạt nhẽo (dull weather/lecture); trái nghĩa với lively.", "tw": "dull", "new": [{"w": "audience", "vi": "khán giả"}], "ipa": "/dʌl/"}, {"type": "mc", "ctx": "Food market", "s": "Our local bakery is popular because its owner keeps experimenting with ___, such as green tea, chocolate with chilli and salted caramel.", "o": ["different flavours", "different seasons", "different passports"], "a": "different flavours", "vi": "Tiệm bánh địa phương nổi tiếng vì chủ tiệm liên tục thử nhiều hương vị khác nhau như trà xanh, sô-cô-la ớt và caramel muối.", "why": "different flavours = nhiều vị khác nhau; flavour (US: flavor) = hương vị.", "tw": "different flavours", "new": [{"w": "experimenting", "vi": "thử nghiệm"}], "ipa": "/ˈdɪfrənt ˈfleɪvəz/"}, {"type": "mc", "ctx": "Team meeting", "s": "During the meeting, nobody could ___ a practical solution to the delay, so the manager asked everyone to think about it overnight.", "o": ["come up with", "get away with", "put up with"], "a": "come up with", "vi": "Trong cuộc họp, không ai nghĩ ra giải pháp thiết thực cho sự chậm trễ nên quản lý yêu cầu mọi người suy nghĩ qua đêm.", "why": "come up with + ý tưởng/giải pháp/kế hoạch = nảy ra, nghĩ ra.", "tw": "come up with", "new": [{"w": "practical", "vi": "thiết thực"}]}, {"type": "mc", "ctx": "Travel brochure", "s": "The hotel is beautifully located ___, so guests can have breakfast on the terrace while watching the sunrise over the water.", "o": ["on the banks of the river", "on the roof of the bank", "on the top of the mountain"], "a": "on the banks of the river", "vi": "Khách sạn có vị trí đẹp bên bờ sông nên khách có thể ăn sáng ở sân thượng và ngắm bình minh trên mặt nước.", "why": "on the banks of the river = bên bờ sông (bank = bờ sông).", "tw": "on the banks of the river", "new": [{"w": "terrace", "vi": "sân hiên"}], "ipa": "/ɒn ðə bæŋks əv ðə ˈrɪv.ər/"}, {"type": "mc", "ctx": "Weekend walk", "s": "The path through the ___ is peaceful and shady, so many families choose it for a gentle walk after Sunday lunch.", "o": ["woods", "bridges", "deserts"], "a": "woods", "vi": "Con đường xuyên khu rừng nhỏ yên bình và có bóng mát nên nhiều gia đình chọn đi dạo nhẹ sau bữa trưa Chủ nhật.", "why": "woods = khu rừng nhỏ (số nhiều); forest thường rộng và lớn hơn.", "tw": "woods", "new": [{"w": "shady", "vi": "có bóng râm"}], "ipa": "/wʊdz/"}, {"type": "mc", "ctx": "Kitchen", "s": "For dessert, my aunt served warm apple pie with a spoonful of cream and a sweet ___ sauce that tasted slightly sour.", "o": ["blackberry", "broccoli", "garlic"], "a": "blackberry", "vi": "Tráng miệng, dì tôi dọn bánh táo nóng với một muỗng kem và nước sốt mâm xôi đen ngọt có vị hơi chua.", "why": "blackberry (số nhiều: blackberries) = quả mâm xôi đen.", "tw": "blackberry", "new": [{"w": "sour", "vi": "chua"}], "ipa": "/ˈblæk.bər.i/"}, {"type": "mc", "ctx": "Family chat", "s": "Farmers must understand ___ well, because the time for planting and harvesting depends on the weather at each part of the year.", "o": ["the seasons", "the sentences", "the souvenirs"], "a": "the seasons", "vi": "Nông dân phải hiểu rõ các mùa vì thời điểm gieo trồng và thu hoạch phụ thuộc vào thời tiết từng giai đoạn trong năm.", "why": "the seasons = các mùa trong năm (spring, summer, autumn, winter).", "tw": "the seasons", "new": [{"w": "harvesting", "vi": "thu hoạch"}], "ipa": "/ðə ˈsiː.zənz/"}, {"type": "mc", "ctx": "Choosing a home", "s": "As cities grow, planners must protect ___ such as parks and playgrounds, otherwise residents will have nowhere to exercise or meet.", "o": ["open spaces", "office spaces", "shopping malls"], "a": "open spaces", "vi": "Khi thành phố phát triển, các nhà quy hoạch phải bảo vệ không gian thoáng như công viên và sân chơi, nếu không cư dân sẽ không có chỗ tập thể dục hay gặp gỡ.", "why": "open spaces = những khu đất trống, thoáng (parks, fields).", "tw": "open spaces", "new": [{"w": "planners", "vi": "nhà quy hoạch"}, {"w": "residents", "vi": "cư dân"}], "ipa": "/ˌəʊ.pən ˈspeɪ.sɪz/"}, {"type": "mc", "ctx": "Farm visit", "s": "A slow ___ was blocking the narrow road, and the cars behind it could not pass until it turned into a field.", "o": ["tractor", "helicopter", "submarine"], "a": "tractor", "vi": "Một chiếc máy kéo chạy chậm chắn con đường hẹp và các xe phía sau không thể vượt cho đến khi nó rẽ vào cánh đồng.", "why": "tractor = máy kéo nông nghiệp.", "tw": "tractor", "ipa": "/ˈtræk.tər/"}, {"type": "mc", "ctx": "Mountain drive", "s": "Drivers should obey the ___ rule on mountain bends, because a car coming from the opposite direction may appear without warning.", "o": ["no overtaking", "no smoking", "no parking"], "a": "no overtaking", "vi": "Tài xế nên tuân thủ quy tắc cấm vượt ở các khúc cua trên núi vì có thể bất ngờ xuất hiện xe chạy ngược chiều.", "why": "no overtaking = cấm vượt (sign: no overtaking).", "tw": "no overtaking", "new": [{"w": "bends", "vi": "khúc cua"}], "ipa": "/ˌnəʊ ˌəʊvəˈteɪkɪŋ/"}, {"type": "mc", "ctx": "Driving lesson", "s": "You should only ___ another vehicle when the road ahead is clear and you can see far enough to return safely to your lane.", "o": ["overtake", "overload", "overcome"], "a": "overtake", "vi": "Bạn chỉ nên vượt xe khác khi đường phía trước thông thoáng và nhìn đủ xa để quay lại làn đường an toàn.", "why": "overtake + xe/người = vượt qua (quá khứ: overtook).", "tw": "overtake", "new": [{"w": "lane", "vi": "làn đường"}], "ipa": "/ˌəʊvəˈteɪk/"}, {"type": "mc", "ctx": "Town centre", "s": "The driver received a heavy fine for going well over the ___, and he was warned that he could lose his licence next time.", "o": ["speed limit", "time limit", "dress code"], "a": "speed limit", "vi": "Tài xế nhận khoản phạt nặng vì chạy vượt hẳn giới hạn tốc độ và bị cảnh báo lần sau có thể mất bằng lái.", "why": "speed limit = tốc độ tối đa cho phép; exceed the speed limit = chạy quá tốc độ.", "tw": "speed limit", "new": [{"w": "licence", "vi": "bằng lái"}], "ipa": "/ˈspiːd ˌlɪmɪt/"}, {"type": "mc", "ctx": "Holiday traffic", "s": "There was a long queue on the ___ because a lorry had broken down, and drivers were stuck for almost an hour.", "o": ["motorway", "footpath", "kitchen"], "a": "motorway", "vi": "Có hàng xe dài trên đường cao tốc vì một chiếc xe tải bị hỏng và các tài xế mắc kẹt gần một giờ.", "why": "motorway = đường cao tốc (Anh); Mỹ: highway/freeway.", "tw": "motorway", "new": [{"w": "broke down", "vi": "hỏng máy"}], "ipa": "/ˈməʊtəweɪ/"}, {"type": "mc", "ctx": "Shortcut", "s": "Heavy lorries are not allowed to use the ___ behind the school, because the surface is weak and children often cross there.", "o": ["side road", "fast lane", "swimming pool"], "a": "side road", "vi": "Xe tải nặng không được đi vào đường nhánh sau trường vì mặt đường yếu và trẻ em thường băng qua đó.", "why": "side road = đường nhỏ nối ra đường chính.", "tw": "side road", "ipa": "/ˈsaɪd rəʊd/"}, {"type": "mc", "ctx": "Foreign city", "s": "If you are afraid of ___ in a big city, download an offline map before you leave the hotel.", "o": ["getting lost", "getting married", "getting ready"], "a": "getting lost", "vi": "Nếu bạn sợ bị lạc trong thành phố lớn, hãy tải bản đồ ngoại tuyến trước khi rời khách sạn.", "why": "get lost = bị lạc đường; don't get lost = đừng đi lạc.", "tw": "getting lost", "ipa": "/ˌɡet ˈlɒst/"}, {"type": "mc", "ctx": "Evening plans", "s": "Sorry I'm late; I'm still ___ the station, but the traffic is terrible, so please start the meeting without me.", "o": ["on my way to", "in front of", "in love with"], "a": "on my way to", "vi": "Xin lỗi tôi đến muộn; tôi vẫn đang trên đường đến nhà ga nhưng kẹt xe kinh khủng nên cứ bắt đầu họp không cần tôi.", "why": "on my way to + nơi = trên đường đến nơi đó (không có 'the' sau 'way to' nếu là home: on my way home).", "tw": "on my way to", "ipa": "/ɒn maɪ weɪ tə/"}, {"type": "mc", "ctx": "Flight plan", "s": "The cheapest ticket to Europe requires passengers to ___ Dubai, which adds four hours to the journey but saves nearly a hundred dollars.", "o": ["go via", "go without", "go beyond"], "a": "go via", "vi": "Vé rẻ nhất đi châu Âu yêu cầu hành khách quá cảnh qua Dubai, thêm bốn giờ hành trình nhưng tiết kiệm gần một trăm đô la.", "why": "go via + nơi = đi qua nơi đó trên đường đến đích.", "tw": "go via", "new": [{"w": "journey", "vi": "hành trình"}], "ipa": "/ˈvaɪə/"}, {"type": "mc", "ctx": "Village road", "s": "The village is so small that it is easy to miss the ___ from the main road, especially at night when there are no streetlights.", "o": ["turning", "mountain", "wedding"], "a": "turning", "vi": "Ngôi làng nhỏ đến mức dễ bỏ lỡ chỗ rẽ từ đường chính, nhất là ban đêm khi không có đèn đường.", "why": "turning = chỗ rẽ; take the first/second turning = rẽ ở ngã rẽ thứ nhất/hai.", "tw": "turning", "ipa": "/ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Driving", "s": "If you ___ at the roundabout, you will end up on the motorway instead of in the town, and it can be difficult to turn back.", "o": ["take the wrong turning", "take the long exam", "take a deep breath"], "a": "take the wrong turning", "vi": "Nếu bạn rẽ nhầm đường ở vòng xuyến, bạn sẽ lên đường cao tốc thay vì vào thị trấn và có thể khó quay đầu.", "why": "take the wrong turning = rẽ nhầm (take the right turning = rẽ đúng).", "tw": "take the wrong turning", "new": [{"w": "roundabout", "vi": "vòng xuyến"}], "ipa": "/teɪk ðə rɒŋ ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Travel stories", "s": "If you keep missing deadlines, you may ___ without a job, even if you are talented and work extremely hard at other times.", "o": ["end up", "give up", "look up"], "a": "end up", "vi": "Nếu bạn cứ trễ hạn, rốt cuộc bạn có thể mất việc dù bạn có tài và rất chăm chỉ vào những lúc khác.", "why": "end up in/at + nơi = cuối cùng lại ở nơi đó (ngoài dự tính); ended up là quá khứ.", "tw": "end up", "new": [{"w": "deadlines", "vi": "hạn chót"}], "ipa": "/ˌend ˈʌp/"}, {"type": "mc", "ctx": "Old town", "s": "When the signs disappeared, we stopped in a village and ___ to the lake, because the satnav had no signal.", "o": ["asked a local the way", "asked a local a question", "asked a local the price"], "a": "asked a local the way", "vi": "Khi biển báo biến mất, chúng tôi dừng ở một ngôi làng và hỏi người địa phương đường đến hồ vì định vị không có sóng.", "why": "ask somebody the way (to somewhere) = hỏi đường ai đó.", "tw": "asked a local the way", "ipa": "/ɑːsk ðə weɪ/"}, {"type": "mc", "ctx": "Emergency", "s": "The receptionist smiled and ___ the conference room, explaining that it was on the second floor next to the lift.", "o": ["directed me to", "directed me at", "directed me for"], "a": "directed me to", "vi": "Nhân viên lễ tân mỉm cười chỉ tôi đến phòng hội nghị và giải thích nó nằm ở tầng hai cạnh thang máy.", "why": "direct somebody to + nơi = chỉ đường/hướng dẫn ai tới đâu.", "tw": "directed me to", "new": [{"w": "receptionist", "vi": "lễ tân"}], "ipa": "/dəˈrekt/"}, {"type": "mc", "ctx": "City driving", "s": "If you are driving to the beach, just ___ and you cannot miss it, because the roads are clearly marked all the way.", "o": ["follow the signs for", "follow the rules for", "follow the news for"], "a": "follow the signs for", "vi": "Nếu bạn lái xe ra biển, chỉ cần đi theo biển chỉ dẫn ra biển, bạn sẽ không thể lạc vì đường được đánh dấu rõ suốt chặng.", "why": "follow signs for + nơi = đi theo biển chỉ đường đến nơi đó.", "tw": "follow the signs for", "ipa": "/ˈfɒləʊ saɪnz fə/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Reading", "s": "The council is encouraging residents to engage in volunteer work, such as cleaning beaches or helping elderly neighbours. People who take part often say it gives them a stronger sense of purpose. What does \"engage in\" mean?", "o": ["tham gia vào một hoạt động", "từ chối một hoạt động vì quá bận", "phàn nàn về một hoạt động"], "a": "tham gia vào một hoạt động", "vi": "Hội đồng địa phương khuyến khích cư dân tham gia công việc tình nguyện, như dọn bãi biển hay giúp hàng xóm lớn tuổi. Những người tham gia thường nói họ có ý thức mục đích rõ hơn.", "why": "engage in + N/V-ing = tham gia vào một hoạt động; theo sau là danh từ hoặc V-ing.", "noblank": true, "say": "The council is encouraging residents to engage in volunteer work, such as cleaning beaches or helping elderly neighbours. People who take part often say it gives them a stronger sense of purpose.", "tw": "engage in", "new": [{"w": "council", "vi": "hội đồng địa phương"}, {"w": "sense of purpose", "vi": "cảm giác có mục đích sống"}]}, {"type": "mc", "ctx": "Reading", "s": "Our old refrigerator makes a loud noise at night and uses a lot of electricity. We are planning to replace it with a more efficient model next month. What does \"refrigerator\" mean?", "o": ["tủ lạnh", "một chiếc lò vi sóng dùng để hâm nóng", "một chiếc máy rửa bát hiện đại"], "a": "tủ lạnh", "vi": "Chiếc tủ lạnh cũ nhà chúng tôi kêu to vào ban đêm và tốn nhiều điện. Chúng tôi định thay bằng một mẫu tiết kiệm điện hơn vào tháng tới.", "why": "refrigerator = tủ lạnh (nói tắt: fridge).", "noblank": true, "say": "Our old refrigerator makes a loud noise at night and uses a lot of electricity. We are planning to replace it with a more efficient model next month.", "tw": "refrigerator", "new": [{"w": "efficient", "vi": "hiệu quả, tiết kiệm"}, {"w": "replace", "vi": "thay thế"}], "ipa": "/rɪˈfrɪdʒ.ə.reɪ.t̬ɚ/"}, {"type": "mc", "ctx": "Reading", "s": "Quinoa has become popular in Europe because it is rich in protein and suitable for people who cannot eat wheat. Many supermarkets now sell it next to the rice. What does \"quinoa\" mean?", "o": ["một loại hạt ngũ cốc giàu đạm", "một loại cá biển giàu dầu", "một loại gia vị cay"], "a": "một loại hạt ngũ cốc giàu đạm", "vi": "Hạt diêm mạch trở nên phổ biến ở châu Âu vì giàu đạm và phù hợp với người không ăn được lúa mì. Nhiều siêu thị hiện bán nó cạnh gạo.", "why": "quinoa (đọc là /ˈkiːnwɑː/ hoặc /kɪnˈwɑː/) = hạt diêm mạch, ngũ cốc giàu đạm.", "noblank": true, "say": "Quinoa has become popular in Europe because it is rich in protein and suitable for people who cannot eat wheat. Many supermarkets now sell it next to the rice.", "tw": "quinoa", "new": [{"w": "wheat", "vi": "lúa mì"}], "ipa": "/kɪnˈwɑː/"}, {"type": "mc", "ctx": "Reading", "s": "Minh does not have a high-paying job, but he earns a reasonable amount of money as a delivery driver. It covers his bills, and he even saves a little each month. What does \"earn a reasonable amount of money\" mean?", "o": ["kiếm được một khoản tiền khá ổn", "kiếm được rất nhiều tiền và sống xa hoa", "kiếm được rất ít, không đủ ăn"], "a": "kiếm được một khoản tiền khá ổn", "vi": "Minh không có công việc lương cao, nhưng anh kiếm được một khoản tiền khá ổn nhờ nghề tài xế giao hàng. Số tiền đó đủ trả hóa đơn và anh còn để dành được chút ít mỗi tháng.", "why": "earn a reasonable amount of money = kiếm được mức tiền khá, đủ sống nhưng không giàu.", "noblank": true, "say": "Minh does not have a high-paying job, but he earns a reasonable amount of money as a delivery driver. It covers his bills, and he even saves a little each month.", "tw": "earn a reasonable amount of money", "new": [{"w": "bills", "vi": "hóa đơn"}], "ipa": "/ˈriː.zən.ə.bəl/"}, {"type": "mc", "ctx": "Reading", "s": "Linh sat alone at lunch and barely touched her food. Her colleague noticed and said gently, \"What's the matter? You seem upset today.\" What does \"What's the matter?\" mean?", "o": ["Có chuyện gì vậy? (hỏi khi thấy ai đó buồn hoặc không khỏe)", "Bạn muốn ăn món gì?", "Bạn làm việc ở đâu?"], "a": "Có chuyện gì vậy? (hỏi khi thấy ai đó buồn hoặc không khỏe)", "vi": "Linh ngồi ăn trưa một mình và hầu như không đụng đến đồ ăn. Đồng nghiệp nhận ra và nhẹ nhàng nói: \"Có chuyện gì vậy? Hôm nay trông bạn buồn.\"", "why": "What's the matter? = hỏi thăm khi ai đó trông buồn, mệt hoặc có vấn đề.", "noblank": true, "say": "Linh sat alone at lunch and barely touched her food. Her colleague noticed and said gently, \"What's the matter? You seem upset today.\"", "tw": "What's the matter?", "new": [{"w": "barely", "vi": "hầu như không"}, {"w": "gently", "vi": "nhẹ nhàng"}]}, {"type": "mc", "ctx": "Reading", "s": "Because Nam had been coughing for a week, his mother bought some cough medicine and made him drink warm water with honey. By Sunday, his throat felt much better. What does \"cough medicine\" mean?", "o": ["thuốc ho", "thuốc nhỏ mắt", "thuốc đau dạ dày"], "a": "thuốc ho", "vi": "Vì Nam ho cả tuần, mẹ cậu mua thuốc ho và bắt cậu uống nước ấm pha mật ong. Đến Chủ nhật, cổ họng cậu đỡ hơn nhiều.", "why": "cough medicine = thuốc ho (cough = ho; medicine = thuốc).", "noblank": true, "say": "Because Nam had been coughing for a week, his mother bought some cough medicine and made him drink warm water with honey. By Sunday, his throat felt much better.", "tw": "cough medicine", "new": [{"w": "honey", "vi": "mật ong"}], "ipa": "/kɑːf/ /ˈmed.ɪ.sən/"}, {"type": "mc", "ctx": "Reading", "s": "Some people find it hard to swallow a large pill, so pharmacists often suggest drinking plenty of water or choosing a liquid medicine instead. What does \"pill\" mean?", "o": ["viên thuốc", "một loại nước uống có ga", "một chiếc gối nhỏ"], "a": "viên thuốc", "vi": "Một số người khó nuốt viên thuốc to nên dược sĩ thường khuyên uống nhiều nước hoặc chọn thuốc dạng nước. \"Pill\" nghĩa là gì?", "why": "pill = viên thuốc nhỏ để nuốt; take a pill = uống thuốc.", "noblank": true, "say": "Some people find it hard to swallow a large pill, so pharmacists often suggest drinking plenty of water or choosing a liquid medicine instead.", "tw": "pill", "new": [{"w": "liquid", "vi": "dạng lỏng"}], "ipa": "/pɪl/"}, {"type": "mc", "ctx": "Reading", "s": "Last winter I climbed the stairs too quickly and suddenly had a pain in my knee. The doctor said it was just tired muscles and told me to rest for a few days. What does \"have a pain in\" mean?", "o": ["bị đau ở một bộ phận cơ thể", "bị nhiễm trùng ở đầu gối", "có một vết sẹo ở đầu gối"], "a": "bị đau ở một bộ phận cơ thể", "vi": "Mùa đông năm ngoái tôi leo cầu thang quá nhanh và đột nhiên bị đau ở đầu gối. Bác sĩ nói chỉ là cơ bị mỏi và bảo tôi nghỉ vài ngày.", "why": "have a pain in + bộ phận cơ thể = bị đau ở chỗ đó (have a pain in my back/knee).", "noblank": true, "say": "Last winter I climbed the stairs too quickly and suddenly had a pain in my knee. The doctor said it was just tired muscles and told me to rest for a few days.", "tw": "have a pain in", "new": [{"w": "muscles", "vi": "cơ bắp"}]}, {"type": "mc", "ctx": "Reading", "s": "A cold usually disappears within a week, but a serious illness such as cancer may require months of treatment and regular check-ups. That is why early diagnosis is so important. What does \"serious illness\" mean?", "o": ["bệnh nghiêm trọng, nguy hiểm", "bệnh nhẹ tự khỏi sau vài ngày", "một kỳ nghỉ dài ngày để thư giãn"], "a": "bệnh nghiêm trọng, nguy hiểm", "vi": "Cảm lạnh thường biến mất trong một tuần, nhưng một bệnh nghiêm trọng như ung thư có thể cần nhiều tháng điều trị và kiểm tra định kỳ. Vì vậy phát hiện sớm rất quan trọng.", "why": "serious illness = bệnh nặng; serious (nghiêm trọng) + illness (bệnh).", "noblank": true, "say": "A cold usually disappears within a week, but a serious illness such as cancer may require months of treatment and regular check-ups. That is why early diagnosis is so important.", "tw": "serious illness", "new": [{"w": "check-ups", "vi": "kiểm tra sức khỏe"}, {"w": "diagnosis", "vi": "chẩn đoán"}], "ipa": "/ˈɪl.nəs/"}, {"type": "mc", "ctx": "Reading", "s": "The operation lasted four hours, and the patient was moved to a quiet room to rest afterwards. Nurses checked on him every thirty minutes during the night. What does \"operation\" mean?", "o": ["ca phẫu thuật", "một cuộc họp kéo dài bốn giờ", "một chuyến đi dài bốn giờ"], "a": "ca phẫu thuật", "vi": "Ca phẫu thuật kéo dài bốn giờ, sau đó bệnh nhân được chuyển sang phòng yên tĩnh để nghỉ. Y tá kiểm tra anh mỗi ba mươi phút suốt đêm.", "why": "operation = ca phẫu thuật (have an operation on my knee).", "noblank": true, "say": "The operation lasted four hours, and the patient was moved to a quiet room to rest afterwards. Nurses checked on him every thirty minutes during the night.", "tw": "operation", "new": [{"w": "patient", "vi": "bệnh nhân"}], "ipa": "/ˌɑː.pəˈreɪ.ʃən/"}, {"type": "mc", "ctx": "Reading", "s": "The famous surgeon carried out the heart operation so skilfully that the patient left hospital within a week. Her colleagues often ask her to teach younger doctors. What does \"surgeon\" mean?", "o": ["bác sĩ phẫu thuật", "người bán thuốc ở hiệu thuốc", "người lái xe cứu thương"], "a": "bác sĩ phẫu thuật", "vi": "Vị bác sĩ phẫu thuật nổi tiếng thực hiện ca mổ tim khéo léo đến mức bệnh nhân xuất viện trong vòng một tuần. Đồng nghiệp thường nhờ bà dạy các bác sĩ trẻ.", "why": "surgeon = bác sĩ phẫu thuật (người thực hiện operation).", "noblank": true, "say": "The famous surgeon carried out the heart operation so skilfully that the patient left hospital within a week. Her colleagues often ask her to teach younger doctors.", "tw": "surgeon", "new": [{"w": "skilfully", "vi": "khéo léo"}], "ipa": "/ˈsɝː.dʒən/"}, {"type": "mc", "ctx": "Reading", "s": "Doctors will only recommend surgery when medicine and rest are not enough. After the operation, patients usually need time and physiotherapy to recover fully. What does \"surgery\" mean?", "o": ["phẫu thuật", "việc đi du lịch để nghỉ ngơi", "chế độ ăn cho người bệnh"], "a": "phẫu thuật", "vi": "Bác sĩ chỉ đề nghị phẫu thuật khi thuốc và nghỉ ngơi không đủ. Sau ca mổ, bệnh nhân thường cần thời gian và vật lý trị liệu để hồi phục hoàn toàn.", "why": "have surgery = được phẫu thuật; surgery là danh từ (không đếm được).", "noblank": true, "say": "Doctors will only recommend surgery when medicine and rest are not enough. After the operation, patients usually need time and physiotherapy to recover fully.", "tw": "surgery", "new": [{"w": "physiotherapy", "vi": "vật lý trị liệu"}], "ipa": "/ˈsɝː.dʒər.i/"}, {"type": "mc", "ctx": "Reading", "s": "Scientists are developing a vaccine to protect children from a disease that has killed thousands in poor regions. Without clean water, the infection spreads very quickly. What does \"disease\" mean?", "o": ["bệnh", "một loại thực phẩm giàu dinh dưỡng", "một chương trình học cho trẻ em"], "a": "bệnh", "vi": "Các nhà khoa học đang phát triển vắc-xin bảo vệ trẻ em khỏi một căn bệnh đã giết hàng nghìn người ở vùng nghèo. Thiếu nước sạch, sự lây nhiễm lan rất nhanh.", "why": "disease = bệnh cụ thể (heart disease, infectious disease); illness thiên về tình trạng ốm.", "noblank": true, "say": "Scientists are developing a vaccine to protect children from a disease that has killed thousands in poor regions. Without clean water, the infection spreads very quickly.", "tw": "disease", "new": [{"w": "vaccine", "vi": "vắc-xin"}], "ipa": "/dɪˈziːz/"}, {"type": "mc", "ctx": "Reading", "s": "Her illness lasted nearly a month, and during that time she could neither work nor study. When she finally recovered, she felt grateful for her health. What does \"illness\" mean?", "o": ["tình trạng bị ốm, bệnh", "một kỳ nghỉ dài ở nước ngoài", "một dự án lớn ở trường"], "a": "tình trạng bị ốm, bệnh", "vi": "Cơn bệnh của cô kéo dài gần một tháng, lúc đó cô không thể làm việc hay học. Khi hồi phục, cô thấy biết ơn sức khỏe của mình.", "why": "illness = tình trạng bị bệnh (a long illness); disease = tên một bệnh cụ thể.", "noblank": true, "say": "Her illness lasted nearly a month, and during that time she could neither work nor study. When she finally recovered, she felt grateful for her health.", "tw": "illness", "new": [{"w": "grateful", "vi": "biết ơn"}], "ipa": "/ˈɪl.nəs/"}, {"type": "mc", "ctx": "Reading", "s": "The nurse treated the burn by cooling it with water and covering it with a clean bandage. She then advised the boy to see a doctor if the pain got worse. What does \"treat\" mean?", "o": ["điều trị, chữa trị", "làm cho vết bỏng nặng thêm", "chăm sóc, chữa vết bỏng"], "a": "điều trị, chữa trị", "vi": "Y tá chữa vết bỏng bằng cách làm mát bằng nước và băng bằng gạc sạch. Sau đó cô khuyên cậu bé đi khám nếu cơn đau nặng hơn.", "why": "treat = điều trị (treat a patient/an illness); danh từ là treatment.", "noblank": true, "say": "The nurse treated the burn by cooling it with water and covering it with a clean bandage. She then advised the boy to see a doctor if the pain got worse.", "tw": "treat", "new": [{"w": "burn", "vi": "vết bỏng"}, {"w": "bandage", "vi": "băng gạc"}], "ipa": "/triːt/"}, {"type": "mc", "ctx": "Reading", "s": "After the accident, she went into hospital for treatment and stayed for ten days. The doctors tried several different treatments before her condition started to improve. What does \"treatment\" mean?", "o": ["sự điều trị, phương pháp chữa bệnh", "sự chăm sóc y tế để chữa bệnh", "tiền thuê phòng bệnh viện"], "a": "sự điều trị, phương pháp chữa bệnh", "vi": "Sau tai nạn, cô nhập viện điều trị và ở đó mười ngày. Các bác sĩ thử nhiều phương pháp trước khi tình trạng của cô bắt đầu cải thiện.", "why": "treatment = sự/phương pháp điều trị (go into hospital for treatment).", "noblank": true, "say": "After the accident, she went into hospital for treatment and stayed for ten days. The doctors tried several different treatments before her condition started to improve.", "tw": "treatment", "new": [{"w": "condition", "vi": "tình trạng sức khỏe"}], "ipa": "/ˈtriːt.mənt/"}, {"type": "mc", "ctx": "Reading", "s": "Doctors found that his liver was swollen, so they asked him to stop drinking and eat a healthier diet. Regular check-ups would show whether the organ was recovering. What does \"liver\" mean?", "o": ["gan", "lá gan, cơ quan lọc máu", "lá phổi để thở"], "a": "gan", "vi": "Bác sĩ phát hiện gan của anh bị sưng nên yêu cầu anh ngưng uống rượu và ăn lành mạnh hơn. Kiểm tra định kỳ sẽ cho thấy cơ quan này có hồi phục không.", "why": "liver = gan (organ lọc độc tố trong cơ thể).", "noblank": true, "say": "Doctors found that his liver was swollen, so they asked him to stop drinking and eat a healthier diet. Regular check-ups would show whether the organ was recovering.", "tw": "liver", "new": [{"w": "swollen", "vi": "sưng"}], "ipa": "/ˈlɪv.ɚ/"}, {"type": "mc", "ctx": "Reading", "s": "The tailor suggested raising the collar slightly because it would frame my face better. He then pinned the cloth carefully around my neck before sewing. What does \"collar\" mean?", "o": ["cổ áo", "phần vải quanh cổ của áo", "phần vải ở ống tay áo"], "a": "cổ áo", "vi": "Thợ may đề nghị nâng cổ áo lên một chút vì như vậy khuôn mặt tôi sẽ nổi hơn. Sau đó ông ghim vải quanh cổ tôi cẩn thận trước khi may.", "why": "collar = cổ áo (phần vải quanh cổ của áo sơ mi).", "noblank": true, "say": "The tailor suggested raising the collar slightly because it would frame my face better. He then pinned the cloth carefully around my neck before sewing.", "tw": "collar", "new": [{"w": "tailor", "vi": "thợ may"}, {"w": "pinned", "vi": "ghim"}], "ipa": "/ˈkɑː.lɚ/"}, {"type": "mc", "ctx": "Reading", "s": "He spent a potload of money on his new car, although he already had two. His wife told him that the money could have paid for a small flat. What does \"a potload of money\" mean?", "o": ["rất nhiều tiền", "một khoản tiền rất ít", "một khoản tiền vừa đủ"], "a": "rất nhiều tiền", "vi": "Anh ấy tiêu cả đống tiền cho chiếc xe mới dù đã có hai chiếc. Vợ anh nói số tiền đó đủ mua một căn hộ nhỏ.", "why": "a potload of money = rất nhiều tiền (cách nói thân mật).", "noblank": true, "say": "He spent a potload of money on his new car, although he already had two. His wife told him that the money could have paid for a small flat.", "tw": "a potload of money", "ipa": "/ə ˈpɒt.ləʊd əv ˈmʌn.i/"}, {"type": "mc", "ctx": "Reading", "s": "Paris is famous for its fashion shows, where designers present their latest collections to journalists and buyers. Thousands of people follow these events online every year. What does \"fashion\" mean?", "o": ["thời trang", "các buổi trình diễn thời trang", "các cuộc thi nấu ăn"], "a": "thời trang", "vi": "Paris nổi tiếng với các buổi trình diễn thời trang, nơi nhà thiết kế giới thiệu bộ sưu tập mới nhất cho nhà báo và người mua. Hàng nghìn người theo dõi trực tuyến mỗi năm.", "why": "fashion = thời trang (be interested in fashion; fashion show).", "noblank": true, "say": "Paris is famous for its fashion shows, where designers present their latest collections to journalists and buyers. Thousands of people follow these events online every year.", "tw": "fashion", "new": [{"w": "collections", "vi": "bộ sưu tập"}], "ipa": "/ˈfæʃ.ən/"}, {"type": "mc", "ctx": "Reading", "s": "Long skirts are in fashion again this autumn, and shop windows are full of them. However, in a few months something different will probably become popular. What does \"be in fashion\" mean?", "o": ["đang thịnh hành", "đang phổ biến, được ưa chuộng", "đang giảm giá mạnh"], "a": "đang thịnh hành", "vi": "Váy dài lại thịnh hành vào mùa thu này, cửa kính các hiệu đầy váy dài. Tuy nhiên vài tháng nữa có lẽ thứ khác sẽ phổ biến.", "why": "be in fashion = đang là mốt; trái nghĩa: be out of fashion.", "noblank": true, "say": "Long skirts are in fashion again this autumn, and shop windows are full of them. However, in a few months something different will probably become popular.", "tw": "be in fashion", "ipa": "/biː ɪn ˈfæʃ.ən/"}, {"type": "mc", "ctx": "Reading", "s": "Fashionable clothes are not always expensive. If you search carefully in second-hand shops, you can often find stylish jackets and dresses at very low prices. What does \"fashionable clothes\" mean?", "o": ["quần áo thời trang", "quần áo hợp mốt, đang được ưa chuộng", "quần áo cũ đã bị sờn rách"], "a": "quần áo thời trang", "vi": "Quần áo thời trang không phải lúc nào cũng đắt. Nếu tìm kỹ ở cửa hàng đồ cũ, bạn thường thấy áo khoác và váy sành điệu với giá rất thấp.", "why": "fashionable clothes = quần áo hợp mốt; fashionable (adj) = thời thượng.", "noblank": true, "say": "Fashionable clothes are not always expensive. If you search carefully in second-hand shops, you can often find stylish jackets and dresses at very low prices.", "tw": "fashionable clothes", "new": [{"w": "second-hand", "vi": "đồ cũ"}, {"w": "stylish", "vi": "sành điệu"}], "ipa": "/ˈfæʃ.ən.ə.bəl kləʊðz~kloʊðz/"}, {"type": "mc", "ctx": "Reading", "s": "Many teenagers want to look fashionable at parties, so they ers arrive with fresh vegetables and shoppers bargain loudly for the best prices. By noon, however, the atmosphere calms down. What does \"lively\" mean?", "o": ["sôi động, náo nhiệt", "đông vui và đầy năng lượng", "vắng vẻ và im lặng"], "a": "sôi động, náo nhiệt", "vi": "Khu chợ trở nên náo nhiệt lúc bình minh, khi nông dân mang rau tươi đến và người mua mặc cả ồn ào để có giá tốt nhất. Tuy nhiên đến trưa bầu không khí lắng xuống.", "why": "lively = sôi động (lively city/atmosphere); trái nghĩa: dull, quiet.", "noblank": true, "say": "The market becomes lively at sunrise, when farmers arrive with fresh vegetables and shoppers bargain loudly for the best prices. By noon, however, the atmosphere calms down.", "tw": "lively", "new": [{"w": "bargain", "vi": "mặc cả"}], "ipa": "/ˈlaɪvli/"}, {"type": "mc", "ctx": "Reading", "s": "After a week of rain, the sky stayed grey and dull, and the town seemed empty. Even the shops closed early because nobody wanted to go out. What does \"dull\" mean?", "o": ["buồn tẻ, ảm đạm", "xám xịt, chán ngắt", "rực rỡ, sáng sủa"], "a": "buồn tẻ, ảm đạm", "vi": "Sau một tuần mưa, bầu trời vẫn xám xịt, ảm đạm và thị trấn như vắng bóng người. Cả các cửa hàng cũng đóng cửa sớm vì chẳng ai muốn ra ngoài.", "why": "dull = buồn tẻ, nhạt nhẽo (dull weather/lecture); trái nghĩa với lively.", "noblank": true, "say": "After a week of rain, the sky stayed grey and dull, and the town seemed empty. Even the shops closed early because nobody wanted to go out.", "tw": "dull", "ipa": "/dʌl/"}, {"type": "mc", "ctx": "Reading", "s": "The crisps come in several different flavours, including cheese, seaweed and barbecue chicken. My brother, who loves trying new things, bought one packet of each. What does \"different flavours\" mean?", "o": ["nhiều hương vị khác nhau", "nhiều vị khác nhau", "nhiều kích cỡ khác nhau"], "a": "nhiều hương vị khác nhau", "vi": "Khoai chiên có nhiều vị khác nhau, gồm phô mai, rong biển và gà nướng. Anh tôi, người thích thử cái mới, mua mỗi loại một gói.", "why": "different flavours = nhiều vị khác nhau; flavour (US: flavor) = hương vị.", "noblank": true, "say": "The crisps come in several different flavours, including cheese, seaweed and barbecue chicken. My brother, who loves trying new things, bought one packet of each.", "tw": "different flavours", "new": [{"w": "seaweed", "vi": "rong biển"}], "ipa": "/ˈdɪfrənt ˈfleɪvəz/"}, {"type": "mc", "ctx": "Reading", "s": "The students tried to come up with an original idea for the science fair. After two hours of discussion, they decided to build a small solar-powered fan. What does \"come up with\" mean?", "o": ["nảy ra, nghĩ ra", "nghĩ ra, nảy ra một ý tưởng", "trì hoãn một ý tưởng"], "a": "nảy ra, nghĩ ra", "vi": "Các sinh viên cố nghĩ ra ý tưởng độc đáo cho hội chợ khoa học. Sau hai giờ thảo luận, họ quyết định chế tạo một chiếc quạt nhỏ chạy bằng năng lượng mặt trời.", "why": "come up with + ý tưởng/giải pháp/kế hoạch = nảy ra, nghĩ ra.", "noblank": true, "say": "The students tried to come up with an original idea for the science fair. After two hours of discussion, they decided to build a small solar-powered fan.", "tw": "come up with", "new": [{"w": "solar-powered", "vi": "chạy bằng năng lượng mặt trời"}]}, {"type": "mc", "ctx": "Reading", "s": "Many ancient cities developed on the banks of the river because farmers needed fresh water and merchants could transport goods easily by boat. That is why so many capitals are built beside rivers. What does \"on the banks of the river\" mean?", "o": ["bên bờ sông", "ở hai bên bờ của dòng sông", "ở giữa sa mạc rộng lớn"], "a": "bên bờ sông", "vi": "Nhiều thành phố cổ phát triển bên bờ sông vì nông dân cần nước ngọt và thương nhân có thể vận chuyển hàng bằng thuyền dễ dàng. Đó là lý do nhiều thủ đô được xây cạnh sông.", "why": "on the banks of the river = bên bờ sông (bank = bờ sông).", "noblank": true, "say": "Many ancient cities developed on the banks of the river because farmers needed fresh water and nter are the four seasons in many countries. People in tropical areas, however, may only notice a rainy season and a dry season. What does \"the seasons\" mean?", "o": ["các mùa trong năm", "bốn mùa trong năm", "bốn hướng trên bản đồ"], "a": "các mùa trong năm", "vi": "Xuân, hạ, thu, đông là bốn mùa ở nhiều nước. Tuy nhiên người ở vùng nhiệt đới có thể chỉ nhận ra mùa mưa và mùa khô.", "why": "the seasons = các mùa trong năm (spring, summer, autumn, winter).", "noblank": true, "say": "Spring, summer, autumn and winter are the four seasons in many countries. People in tropical areas, however, may only notice a rainy season and a dry season.", "tw": "the seasons", "new": [{"w": "tropical", "vi": "nhiệt đới"}], "ipa": "/ðə ˈsiː.zənz/"}, {"type": "mc", "ctx": "Reading", "s": "Children who grow up near open spaces tend to be more active, according to a recent study. They run, climb and cycle more often than children in crowded apartment blocks. What does \"open spaces\" mean?", "o": ["không gian rộng, thoáng đãng", "những khu đất rộng thoáng như công viên", "những căn phòng nhỏ và kín"], "a": "không gian rộng, thoáng đãng", "vi": "Theo một nghiên cứu gần đây, trẻ lớn lên gần không gian thoáng thường năng động hơn. Chúng chạy, leo trèo và đạp xe nhiều hơn trẻ ở các khu chung cư đông đúc.", "why": "open spaces = những khu đất trống, thoáng (parks, fields).", "noblank": true, "say": "Children who grow up near open spaces tend to be more active, according to a recent study. They run, climb and cycle more often than children in crowded apartment blocks.", "tw": "open spaces", "new": [{"w": "tend to", "vi": "có xu hướng"}], "ipa": "/ˌəʊ.pən ˈspeɪ.sɪz/"}, {"type": "mc", "ctx": "Reading", "s": "Modern farms rely on large tractors that can plough, plant and harvest much faster than workers using hand tools. As a result, fewer people are needed in the fields. What does \"tractor\" mean?", "o": ["máy kéo", "xe nông nghiệp lớn dùng trên đồng ruộng", "máy bay nhỏ chở hàng"], "a": "máy kéo", "vi": "Các nông trại hiện đại dựa vào máy kéo lớn có thể cày, gieo và thu hoạch nhanh hơn nhiều so với người dùng dụng cụ cầm tay. Do đó cần ít người làm ngoài đồng hơn.", "why": "tractor = máy kéo nông nghiệp.", "noblank": true, "say": "Modern farms rely on large tractors that can plough, plant and harvest much faster than workers using hand tools. As a result, fewer people are needed in the fields.", "tw": "tractor", "new": [{"w": "rely on", "vi": "dựa vào"}], "ipa": "/ˈtræk.tər/"}, {"type": "mc", "ctx": "Reading", "s": "A police officer fined the driver because he ignored the no-overtaking sign and passed three cars at the top of the hill. Luckily, nobody was injured. What does \"no overtaking\" mean?", "o": ["cấm vượt", "biển báo cấm vượt xe khác", "biển báo cấm đỗ xe"], "a": "cấm vượt", "vi": "Một cảnh sát phạt tài xế vì anh phớt lờ biển cấm vượt và vượt ba xe ở đỉnh đồi. May mắn là không ai bị thương.", "why": "no overtaking = cấm vượt (sign: no overtaking).", "noblank": true, "say": "A police officer fined the driver because he ignored the no-overtaking sign and passed three cars at the top of the hill. Luckily, nobody was injured.", "tw": "no overtaking", "new": [{"w": "fined", "vi": "phạt tiền"}, {"w": "injured", "vi": "bị thương"}], "ipa": "/ˌnəʊ ˌəʊvəˈteɪkɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "Drivers are not allowed to overtake on a bridge or near a crossing. A careless attempt to pass a lorry can easily cause a serious accident. What does \"overtake\" mean?", "o": ["vượt (xe khác)", "đi vượt lên xe phía trước", "đi chậm lại phía sau"], "a": "vượt (xe khác)", "vi": "Tài xế không được vượt trên cầu hoặc gần chỗ giao cắt. Một lần cố vượt xe tải bất cẩn có thể dễ dàng gây tai nạn nghiêm trọng.", "why": "overtake + xe/người = vượt qua (quá khứ: overtook).", "noblank": true, "say": "Drivers are not allowed to overtake on a bridge or near a crossing. A careless attempt to pass a lorry can easily cause a serious accident.", "tw": "overtake", "new": [{"w": "crossing", "vi": "chỗ giao cắt"}], "ipa": "/ˌəʊvəˈteɪk/"}, {"type": "mc", "ctx": "Reading", "s": "Near schools, the speed limit is lowered to protect children, and cameras record any car travelling faster. As a result, accidents outside schools have fallen sharply. What does \"speed limit\" mean?", "o": ["giới hạn tốc độ", "mức tốc độ tối đa được phép", "giờ mở cửa của trường học"], "a": "giới hạn tốc độ", "vi": "Gần trường học, giới hạn tốc độ được hạ xuống để bảo vệ trẻ em và camera ghi lại xe nào chạy nhanh hơn. Kết quả là tai nạn trước cổng trường giảm mạnh.", "why": "speed limit = tốc độ tối đa cho phép; exceed the speed limit = chạy quá tốc độ.", "noblank": true, "say": "Near schools, the speed limit is lowered to protect children, and cameras record any car travelling faster. As a result, accidents outside schools have fallen sharply.", "tw": "speed limit", "new": [{"w": "sharply", "vi": "mạnh, đột ngột"}], "ipa": "/ˈspiːd ˌlɪmɪt/"}, {"type": "mc", "ctx": "Reading", "s": "Motorways are designed for fast, long-distance travel, so cyclists and pedestrians are not permitted on them. Service stations appear every few kilometres for fuel and rest. What does \"motorway\" mean?", "o": ["đường cao tốc", "đường lớn dành cho xe chạy nhanh đường dài", "đường nhỏ trong làng"], "a": "đường cao tốc", "vi": "Đường cao tốc được thiết kế cho di chuyển nhanh đường dài nên người đạp xe và đi bộ không được phép vào. Cứ vài cây số lại có trạm dừng để đổ xăng và nghỉ.", "why": "motorway = đường cao tốc (Anh); Mỹ: highway/freeway.", "noblank": true, "say": "Motorways are designed for fast, long-distance travel, so cyclists and pedestrians are not permitted on them. Service stations appear every few kilometres for fuel and rest.", "tw": "motorway", "new": [{"w": "permitted", "vi": "được phép"}], "ipa": "/ˈməʊtəweɪ/"}, {"type": "mc", "ctx": "Reading", "s": "The satnav told us to turn left into a side road, which turned out to be a shortcut. Within ten minutes we had left the traffic behind and reached the village. What does \"side road\" mean?", "o": ["đường nhánh, đường nhỏ", "con đường nhỏ nối với đường chính", "đường cao tốc nhiều làn"], "a": "đường nhánh, đường nhỏ", "vi": "Thiết bị định vị bảo chúng tôi rẽ trái vào một đường nhỏ, hóa ra là đường tắt. Trong mười phút chúng tôi bỏ lại dòng xe và đến làng.", "why": "side road = đường nhỏ nối ra đường chính.", "noblank": true, "say": "The satnav told us to turn left into a side road, which turned out to be a shortcut. Within ten minutes we had left the traffic behind and reached the village.", "tw": "side road", "new": [{"w": "satnav", "vi": "thiết bị định vị"}], "ipa": "/ˈsaɪd rəʊd/"}, {"type": "mc", "ctx": "Reading", "s": "The tourists got lost in the narrow streets of the old town because every alley looked the same. In the end a friendly shopkeeper led them back to the main square. What does \"get lost\" mean?", "o": ["bị lạc", "không biết mình đang ở đâu", "đến đúng nơi cần đến"], "a": "bị lạc", "vi": "Du khách bị lạc trong những con phố hẹp của khu phố cổ vì mọi hẻm trông giống nhau. Cuối cùng một chủ tiệm thân thiện dẫn họ về quảng trường chính.", "why": "get lost = bị lạc đường; don't get lost = đừng đi lạc.", "noblank": true, "say": "The tourists got lost in the narrow streets of the old town because every alley looked the same. In the end a friendly shopkeeper led them back to the main square.", "tw": "get lost", "new": [{"w": "alley", "vi": "con hẻm"}], "ipa": "/ˌɡet ˈlɒst/"}, {"type": "mc", "ctx": "Reading", "s": "On my way to the airport, I realised that I had left my passport at home. Luckily, my brother brought it to me by motorbike just before check-in closed. What does \"on my way to\" mean?", "o": ["trên đường tới (nơi nào)", "trên đường tới sân bay", "khi vừa rời sân bay"], "a": "trên đường tới (nơi nào)", "vi": "Trên đường tới sân bay, tôi nhận ra mình để quên hộ chiếu ở nhà. May là em trai tôi mang nó tới bằng xe máy ngay trước khi quầy làm thủ tục đóng.", "why": "on my way to + nơi = trên đường đến nơi đó (không có 'the' sau 'way to' nếu là home: on my way home).", "noblank": true, "say": "On my way to the airport, I realised that I had left my passport at home. Luckily, my brother brought it to me by motorbike just before check-in closed.", "tw": "on my way to", "new": [{"w": "check-in", "vi": "làm thủ tục lên máy bay"}], "ipa": "/ɒn maɪ weɪ tə/"}, {"type": "mc", "ctx": "Reading", "s": "To avoid the busy city centre, the bus goes via the ring road and then joins the coastal highway. This route is longer, but it is rarely congested. What does \"go via\" mean?", "o": ["đi qua (nơi nào)", "đi qua một tuyến trung gian", "dừng hẳn tại trạm cuối"], "a": "đi qua (nơi nào)", "vi": "Để tránh trung tâm thành phố đông đúc, xe buýt đi qua đường vành đai rồi nhập vào đường ven biển. Tuyến này dài hơn nhưng hiếm khi tắc.", "why": "go via + nơi = đi qua nơi đó trên đường đến đích.", "noblank": true, "say": "To avoid the busy city centre, the bus goes via the ring road and then joins the coastal highway. This route is longer, but it is rarely congested.", "tw": "go via", "new": [{"w": "ring road", "vi": "đường vành đai"}, {"w": "congested", "vi": "tắc nghẽn"}], "ipa": "/ˈvaɪə/"}, {"type": "mc", "ctx": "Reading", "s": "Go straight for about a kilometre, and then take the first turning on the right, just after the petrol station. The school is at the end of that road. What does \"turning\" mean?", "o": ["chỗ rẽ, ngã rẽ", "chỗ rẽ sang con đường khác", "chỗ đỗ xe miễn phí"], "a": "chỗ rẽ, ngã rẽ", "vi": "Hãy đi thẳng khoảng một cây số, rồi rẽ ở ngã rẽ đầu tiên bên phải, ngay sau trạm xăng. Trường nằm ở cuối con đường đó.", "why": "turning = chỗ rẽ; take the first/second turning = rẽ ở ngã rẽ thứ nhất/hai.", "noblank": true, "say": "Go straight for about a kilometre, and then take the first turning on the right, just after the petrol station. The school is at the end of that road.", "tw": "turning", "new": [{"w": "petrol station", "vi": "trạm xăng"}], "ipa": "/ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "Because it was dark and raining heavily, the taxi driver took the wrong turning and had to drive back for several kilometres. He apologised and reduced the fare. What does \"take the wrong turning\" mean?", "o": ["rẽ nhầm đường", "đi sai ngã rẽ", "đi đúng ngã rẽ"], "a": "rẽ nhầm đường", "vi": "Vì trời tối và mưa to, tài xế taxi rẽ nhầm đường và phải lái ngược lại vài cây số. Anh xin lỗi và giảm cước.", "why": "take the wrong turning = rẽ nhầm (take the right turning = rẽ đúng).", "noblank": true, "say": "Because it was dark and raining heavily, the taxi driver took the wrong turning and had to drive back for several kilometres. He apologised and reduced the fare.", "tw": "take the wrong turning", "new": [{"w": "fare", "vi": "tiền cước"}], "ipa": "/teɪk ðə rɒŋ ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "We planned to visit a museum, but we ended up at a street festival because the music was so inviting. It turned out to be the best part of the trip. What does \"end up\" mean?", "o": ["rốt cuộc lại ở (nơi không định đến)", "rốt cuộc lại ở một nơi ngoài dự định", "đến sớm hơn dự định"], "a": "rốt cuộc lại ở (nơi không định đến)", "vi": "Chúng tôi định đi bảo tàng nhưng rốt cuộc lại đến một lễ hội đường phố vì tiếng nhạc quá hấp dẫn. Hóa ra đó là phần tuyệt nhất của chuyến đi.", "why": "end up in/at + nơi = cuối cùng lại ở nơi đó (ngoài dự tính); ended up là quá khứ.", "noblank": true, "say": "We planned to visit a museum, but we ended up at a street festival because the music was so inviting. It turned out to be the best part of the trip.", "tw": "end up", "new": [{"w": "inviting", "vi": "hấp dẫn, lôi cuốn"}], "ipa": "/ˌend ˈʌp/"}, {"type": "mc", "ctx": "Reading", "s": "Tourists often ask local people the way because paper maps can be confusing. In small towns, residents usually enjoy giving long and friendly directions. What does \"ask somebody the way\" mean?", "o": ["hỏi đường ai đó", "hỏi người khác chỉ đường", "trả lời câu hỏi về thời tiết"], "a": "hỏi đường ai đó", "vi": "Du khách thường hỏi đường người địa phương vì bản đồ giấy có thể gây rối. Ở thị trấn nhỏ, cư dân thường thích chỉ đường dài dòng và thân thiện.", "why": "ask somebody the way (to somewhere) = hỏi đường ai đó.", "noblank": true, "say": "Tourists often ask local people the way because paper maps can be confusing. In small towns, residents usually enjoy giving long and friendly directions.", "tw": "ask somebody the way", "new": [{"w": "confusing", "vi": "gây rối"}], "ipa": "/ɑːsk ðə weɪ/"}, {"type": "mc", "ctx": "Reading", "s": "At the airport, a friendly worker directed the lost passengers to the correct gate with a map and a smile. They reached the plane with only minutes to spare. What does \"direct somebody to\" mean?", "o": ["chỉ đường cho ai tới đâu", "chỉ dẫn hành khách tới chỗ cần đến", "bán vé cho hành khách"], "a": "chỉ đường cho ai tới đâu", "vi": "Ở sân bay, một nhân viên thân thiện chỉ cho hành khách lạc đường đến đúng cổng bằng bản đồ và nụ cười. Họ lên máy bay chỉ còn vài phút.", "why": "direct somebody to + nơi = chỉ đường/hướng dẫn ai tới đâu.", "noblank": true, "say": "At the airport, a friendly worker directed the lost passengers to the correct gate with a map and a smile. They reached the plane with only minutes to spare.", "tw": "direct somebody to", "new": [{"w": "to spare", "vi": "còn dư"}], "ipa": "/dəˈrekt/"}, {"type": "mc", "ctx": "Reading", "s": "At the next roundabout, follow signs for the airport, and keep in the left lane. The terminal will appear on your right after about five minutes. What does \"follow signs for\" mean?", "o": ["đi theo biển chỉ dẫn tới (nơi nào)", "đi theo các biển báo đường", "đếm số biển quảng cáo"], "a": "đi theo biển chỉ dẫn tới (nơi nào)", "vi": "Ở vòng xuyến tiếp theo, hãy đi theo biển chỉ dẫn ra sân bay và giữ làn trái. Nhà ga sẽ hiện ra bên phải sau khoảng năm phút.", "why": "follow signs for + nơi = đi theo biển chỉ đường đến nơi đó.", "noblank": true, "say": "At the next roundabout, follow signs for the airport, and keep in the left lane. The terminal will appear on your right after about five minutes.", "tw": "follow signs for", "new": [{"w": "terminal", "vi": "nhà ga hàng không"}], "ipa": "/ˈfɒləʊ saɪnz fə/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Illness at home", "s": "Describe a time when you or someone in your family felt unwell. What was the problem, and how was it dealt with?", "vi": "Hãy mô tả một lần bạn hoặc người trong gia đình thấy không khỏe. Vấn đề là gì và đã được xử lý thế nào?", "words": ["What's the matter?", "cough medicine", "pill", "have a pain in", "illness", "treat", "treatment"], "why": "Kể theo thứ tự: ai bị ốm, triệu chứng (đau ở đâu, ho), cách mua thuốc và điều trị, kết quả. Dùng thì quá khứ.", "sample": "Last winter my younger brother came home from school looking pale, so I asked him, \"What's the matter?\" He said he had a pain in his throat and could not stop coughing. My mother bought some cough medicine, and the pharmacist also gave him a pill to bring down his fever. It was only a minor illness, so the doctor said no special treatment was necessary. We simply had to treat him with rest, warm drinks and plenty of sleep. After three days he was back at school, and honestly I felt relieved, because the house was far too quiet without his jokes."}, {"type": "sp", "ctx": "Health and hospitals", "s": "Do you think people look after their health well nowadays? Talk about serious diseases and the role of hospitals.", "vi": "Bạn có nghĩ ngày nay mọi người chăm sóc sức khỏe tốt không? Hãy nói về các bệnh nghiêm trọng và vai trò của bệnh viện.", "words": ["serious illness", "operation", "surgeon", "surgery", "disease", "liver"], "why": "Nêu quan điểm, ví dụ một bệnh (như bệnh gan), nói về mổ và bác sĩ, rồi đề xuất phòng bệnh hơn chữa bệnh.", "sample": "I think many people only start caring about their health when something goes wrong. For example, a serious illness such as liver disease can develop slowly for years because of alcohol or fatty food. When the problem is discovered late, a patient may need an operation, and then the surgeon becomes extremely important. A skilled surgeon can save a life, but surgery is also expensive and stressful for the whole family. In my opinion, governments should spend more money on prevention, because it is much cheaper to stop a disease than to cure it afterwards, and it also reduces suffering."}, {"type": "sp", "ctx": "Fashion and style", "s": "How important is fashion to you? Do you follow trends, and why or why not?", "vi": "Thời trang quan trọng với bạn đến mức nào? Bạn có chạy theo xu hướng không, vì sao?", "words": ["fashion", "be in fashion", "fashionable clothes", "look fashionable", "designer labels", "wear fashionable clothes", "never buy clothes just because", "collar"], "why": "Nêu quan điểm cá nhân, so sánh với bạn bè/người thân, đưa ví dụ cụ thể và kết luận bằng một ý ngắn.", "sample": "To be honest, fashion is not very important to me, although I do notice what is in fashion when I walk around my university. Many of my friends love fashionable clothes and spend a lot on designer labels, whereas I never buy clothes just because they are trendy. I think you can look fashionable without paying a fortune, as long as the colours match and details like the collar fit neatly. My younger sister likes to wear fashionable clothes every day, but I prefer comfort. In the end, I believe confidence matters more than any label."}, {"type": "sp", "ctx": "What you wear", "s": "Describe what you are wearing today, and what you usually wear to work or university.", "vi": "Hãy mô tả bạn đang mặc gì hôm nay và bạn thường mặc gì khi đi làm hoặc đi học.", "words": ["I've got on", "dress in", "dress casually", "casual clothes", "hardly ever wear", "wear something at the same time"], "why": "Mô tả trang phục hiện tại, rồi nói thói quen, một món ít mặc và lý do. Dùng từ chỉ tần suất.", "sample": "Today I've got on a plain grey T-shirt, dark jeans and comfortable trainers. My company has no strict dress code, so I normally dress in casual clothes, and I dress casually on most days unless I have a meeting with clients. I own a smart jacket, but I hardly ever wear it, because it feels too formal for the office. When the weather is cool, I like to wear a shirt and a sweater at the same time, because layers keep me warm and still look neat. Overall, I always choose comfort first."}, {"type": "sp", "ctx": "Shopping habits", "s": "Talk about your shopping habits. Do you enjoy shopping, and how much money do you spend?", "vi": "Hãy nói về thói quen mua sắm của bạn. Bạn có thích mua sắm không và chi bao nhiêu tiền?", "words": ["shop for clothes", "shop with a friend", "go shopping for clothes", "look for something", "shop assistant", "need any help", "be served", "serve a customer", "earn a reasonable amount of money", "engage in", "a potload of money"], "why": "Kể tần suất, đi với ai, một lần mua sắm cụ thể (nhân viên hỏi gì) và nói về chi tiêu so với thu nhập.", "sample": "I usually shop for clothes only a few times a year, and I like to shop with a friend because she gives me honest opinions. Last month we went to a big mall to go shopping for clothes, and I wanted to look for something formal. A shop assistant asked, \"Do you need any help?\" but I explained that I was already being served, because her colleague had to serve a customer first. I earn a reasonable amount of money, so I try not to engage in extreme spending. My cousin, however, spends a potload of money on shoes every month, which I find hard to understand."}, {"type": "sp", "ctx": "In a clothes shop", "s": "Imagine you are in a clothes shop and the shirt you like is too small. What would you say to the shop assistant?", "vi": "Hãy tưởng tượng bạn đang ở cửa hàng quần áo và chiếc áo bạn thích bị chật. Bạn sẽ nói gì với nhân viên?", "words": ["changing room", "the changing rooms are over there", "try on clothes", "try it on", "look for a bigger size", "try a bigger size", "a bigger size", "a size 12", "have this in a size 12", "have this in black"], "why": "Nói như đóng vai: mở lời lịch sự, hỏi cỡ và màu, hỏi phòng thử đồ, rồi nêu bạn sẽ làm gì nếu vẫn chưa vừa.", "sample": "I would say politely, \"Excuse me, I like this shirt, but it is too tight. Do you have this in a size 12? And do you have this in black as well?\" If not, I would look for a bigger size on the rack myself. The assistant would probably answer, \"The changing rooms are over there,\" so I would go to the changing room, because I never buy anything unless I try on clothes first. I would try it on in front of the mirror, and if it is still uncomfortable, I would try a bigger size. Honestly, a bigger size is better than a shirt that hurts."}, {"type": "sp", "ctx": "Countryside memories", "s": "Describe a place in the countryside that you liked as a child. What did you do there, and what did you eat?", "vi": "Hãy mô tả một nơi ở vùng quê mà bạn thích hồi nhỏ. Bạn đã làm gì và ăn gì ở đó?", "words": ["on the banks of the river", "woods", "blackberry", "the seasons", "open spaces", "tractor", "quinoa", "different flavours", "come up with", "refrigerator"], "why": "Giới thiệu nơi chốn, hoạt động theo mùa, món ăn kỷ niệm, rồi so sánh với hiện tại. Dùng thì quá khứ và used to.", "sample": "When I was a child, my grandparents lived in a village on the banks of the river, and I spent every summer there. We played in the woods, picked blackberry fruit and watched a neighbour drive his old tractor between the rice fields. I loved the open spaces and the way the seasons changed the colour of everything. My grandmother always managed to come up with a new dish from the garden, and she kept jam in the refrigerator in different flavours. Nowadays I eat healthy food such as quinoa, but nothing tastes as good as her jam."}, {"type": "sp", "ctx": "City or town", "s": "Would you prefer to live in a lively city or in a quiet town? Explain your choice.", "vi": "Bạn thích sống ở thành phố sôi động hay thị trấn yên tĩnh? Hãy giải thích lựa chọn của bạn.", "words": ["lively", "dull", "parking space"], "why": "So sánh ưu nhược điểm (giải trí, giao thông, chỗ đỗ xe), rồi nêu lựa chọn và lý do chính.", "sample": "I would prefer a lively city, mainly because I get bored easily. In a big city there are cafés, concerts and markets open late, so life never feels dull. However, I admit that there are disadvantages, such as noise and heavy traffic. For instance, it can take half an hour to find a parking space near the city centre, and that is really frustrating when you are in a hurry. A quiet town is cheaper and more relaxing, but for a young person like me, the energy of a big city is more important, and I can always visit the countryside at weekends."}, {"type": "sp", "ctx": "Road rules", "s": "Do you think road rules are strict enough in your country? Talk about speed limits and dangerous driving.", "vi": "Bạn có nghĩ luật giao thông ở nước bạn đủ nghiêm không? Hãy nói về giới hạn tốc độ và lái xe nguy hiểm.", "words": ["speed limit", "motorway", "side road", "overtake", "no overtaking"], "why": "Nêu quan điểm, ví dụ về cao tốc và đường nhỏ, nói về vượt xe nguy hiểm và đề xuất giải pháp (phạt, camera).", "sample": "In my opinion, the rules are fairly good, but many drivers simply ignore them. On the motorway, people often exceed the speed limit, and some even overtake on bends where there is a no overtaking sign. On a narrow side road, this behaviour is even more dangerous, because pedestrians and motorbikes share the same space. I think the government should install more cameras and punish drivers more heavily. Education also matters: if young people learn early that a few minutes saved on the road can cost a life, they may drive more carefully."}, {"type": "sp", "ctx": "Getting lost", "s": "Tell me about a time when you got lost while travelling. What happened, and how did you find the right way?", "vi": "Hãy kể về một lần bạn bị lạc khi đi du lịch. Chuyện gì xảy ra và bạn tìm đúng đường thế nào?", "words": ["get lost", "on my way to", "go via", "turning", "take the wrong turning", "end up", "ask someone the way", "direct someone to", "follow signs for"], "why": "Kể theo trình tự: đi đâu, sai ở đâu (rẽ nhầm), cảm xúc, ai chỉ đường, kết quả. Dùng thì quá khứ đơn và nối câu bằng so, then, finally.", "sample": "Last year I was on my way to a lake near Da Lat, and we decided to go via a small mountain road to avoid the traffic. Unfortunately, I took the wrong turning at a village, and we got lost because the phone had no signal. We ended up in a coffee farm instead of at the lake. I asked someone the way, and a friendly farmer directed us to the main road and told us to follow signs for the lake. In the end we arrived two hours late, but the delay gave us a nice story to tell."}]}]};
  const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  /* ---------- prepare ---------- */
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ALL=[];
