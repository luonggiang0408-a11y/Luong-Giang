ident", "s": "Doctors were amazed that the driver managed to ___ the crash, as the car had been completely destroyed.", "o": ["spread", "replace", "survive"], "a": "survive", "vi": "Các bác sĩ ngạc nhiên rằng tài xế đã sống sót sau vụ va chạm, vì chiếc xe đã bị phá hủy hoàn toàn.", "why": "survive = sống sót qua nguy hiểm hoặc tồn tại được trong hoàn cảnh khó (kinh doanh, mùa đông, tai nạn).", "new": [{"w": "amazed", "vi": "ngạc nhiên"}, {"w": "crash", "vi": "vụ va chạm"}], "tw": "survive", "ipa": "/sɚˈvaɪv/"}, {"type": "mc", "ctx": "Street musicians", "s": "Without a degree or any savings, young street musicians in big cities often ___ , playing for hours for a few coins.", "o": ["struggle to make a living", "earn a fortune", "pay a deposit"], "a": "struggle to make a living", "vi": "Không có bằng cấp hay tiền tiết kiệm, các nhạc sĩ đường phố trẻ ở thành phố lớn thường vất vả kiếm sống, chơi nhạc hàng giờ để lấy vài đồng xu.", "why": "struggle to make a living = chật vật kiếm đủ tiền để sống; make a living = kiếm sống.", "new": [{"w": "coins", "vi": "đồng xu"}, {"w": "savings", "vi": "tiền tiết kiệm"}], "tw": "struggle to make a living"}, {"type": "mc", "ctx": "Health survey", "s": "On average, a teenager in the country will ___ about two litres of sugary drinks every week, according to a recent health survey.", "o": ["collect", "consume", "invent"], "a": "consume", "vi": "Trung bình, một thiếu niên trong nước tiêu thụ khoảng hai lít đồ uống có đường mỗi tuần, theo một khảo sát sức khỏe gần đây.", "why": "consume = dùng/tiêu thụ (năng lượng, thức ăn, hàng hóa); danh từ là consumption, người tiêu dùng là consumer.", "new": [{"w": "sugary", "vi": "có đường"}, {"w": "survey", "vi": "khảo sát"}], "tw": "consume", "ipa": "/kənˈsuːm/"}, {"type": "mc", "ctx": "Food trends", "s": "Because of rising prices, the ___ of meat in many households has fallen, whereas the demand for beans and lentils has grown.", "o": ["production", "donation", "consumption"], "a": "consumption", , "vi": "đồ tạp hóa"}], "tw": "How much do I owe you?"}, {"type": "mc", "ctx": "Restaurant bill", "s": "The waiter put the last dessert on the table, and Ken took out his wallet. “___ for all of us?” he asked.", "o": ["How long will it be?", "How many will it be?", "How much will it be?"], "a": "How much will it be?", "vi": "Người phục vụ đặt món tráng miệng cuối cùng lên bàn và Ken lấy ví ra. “Cả bọn hết bao nhiêu tiền?” anh hỏi.", "why": "How much will it be? = hỏi tổng số tiền phải trả cho dịch vụ/hàng hóa; thường nói với thu ngân, thợ sửa.", "new": [{"w": "wallet", "vi": "ví tiền"}], "tw": "How much will it be?"}, {"type": "mc", "ctx": "City murals", "s": "The colourful murals on the walls ___ the history of the neighbourhood and the traditions of the people who live there.", "o": ["replace", "reflect", "refuse"], "a": "reflect", "vi": "Những bức tranh tường nhiều màu trên tường phản ánh lịch sử khu phố và truyền thống của những người sống ở đó.", "why": "reflect sth = phản ánh/cho thấy tình trạng thật; còn reflect on sth = suy ngẫm về điều gì.", "new": [{"w": "murals", "vi": "tranh tường"}, {"w": "traditions", "vi": "truyền thống"}], "tw": "reflect", "ipa": "/rɪˈflekt/"}, {"type": "mc", "ctx": "Job interview", "s": "Remember to ___ the top button of your shirt before the interview so that you look neat and professional.", "o": ["do up", "take off", "give up"], "a": "do up", "vi": "Nhớ cài cúc trên cùng của áo sơ mi trước buổi phỏng vấn để trông gọn gàng và chuyên nghiệp.", "why": "do up a zip/button = kéo khóa/cài cúc; trái nghĩa là undo; do up a coat/jacket = cài kín áo.", "new": [{"w": "neat", "vi": "gọn gàng"}], "tw": "do up"}, {"type": "mc", "ctx": "After a hike", "s": "After the long walk, the hikers sat down and began to ___ their coats because the sun was now warm.", "o": ["fold", "tie", "undo"], "a": "undo", "vi": "Sau chuyến đi bộ dài, những người leo núi ngồi xuống và bắt đầu cởi khóa áo khoác vì mặt trời đã ấm.", "why": "undo a zip/button = mở khóa k ay a small fine", "pay higher returns", "pay in advance"], "a": "pay a small fine", "vi": "Tài xế đậu xe trước cổng trường vài phút có thể chỉ phải nộp một khoản phạt nhỏ, nhưng người tái phạm có thể mất bằng lái.", "why": "pay a fine = nộp phạt; a small fine = khoản phạt nhỏ khi trả muộn, rút sớm hoặc vi phạm nhẹ.", "new": [{"w": "offenders", "vi": "người vi phạm"}, {"w": "licence", "vi": "bằng lái"}], "tw": "pay a small fine", "ipa": "/peɪ ə smɔːl faɪn/"}, {"type": "mc", "ctx": "Company bond", "s": "Investors who buy this bond must ___ their money before 2030, which gives the company a stable source of funds.", "o": ["refuse to deposit", "promise to borrow", "agree not to withdraw"], "a": "agree not to withdraw", "vi": "Nhà đầu tư mua trái phiếu này phải cam kết không rút tiền trước năm 2030, điều này giúp công ty có nguồn vốn ổn định.", "why": "agree not to withdraw sth = cam kết không rút tiền trong một thời hạn; agree + to + động từ.", "new": [{"w": "stable", "vi": "ổn định"}, {"w": "source of funds", "vi": "nguồn vốn"}], "tw": "agree not to withdraw", "ipa": "/əˈɡriː nɒt tə wɪðˈdrɔː/"}, {"type": "mc", "ctx": "Crowdfunding", "s": "Crowdfunding websites ___ thousands of supporters in new start-ups, so a young company can grow without a big bank loan.", "o": ["hide money from", "invest money from", "refuse money from"], "a": "invest money from", "vi": "Các trang gọi vốn cộng đồng đầu tư tiền từ hàng nghìn người ủng hộ vào các công ty khởi nghiệp, nên công ty trẻ có thể phát triển mà không cần khoản vay lớn.", "why": "invest money from sb in sth = dùng tiền của ai để đầu tư vào đâu; cụm đầy đủ: invest money from investors/members.", "new": [{"w": "start-ups", "vi": "công ty khởi nghiệp"}, {"w": "supporters", "vi": "người ủng hộ"}], "tw": "invest money from", "ipa": "/ɪnˈvest ˈmʌn.i frəm/"}, {"type": "mc", "ctx": "Bonus decision", "s": "After receiving his bonus, Peter decided to ___ a fixed deposit, so that the bank would pay him interest for the next two years.", "o": ["borrow money from", "take money out of", "place money in"], "a": "place money in", "vi": "Sau khi nhận tiền thưởng, Peter quyết định gửi tiền vào khoản tiền gửi có kỳ hạn, để ngân hàng trả lãi cho anh trong hai năm tới.", "why": "place money in sth = gửi tiền vào (tài khoản, quỹ); formal hơn put money in.", "new": [{"w": "bonus", "vi": "tiền thưởng"}], "tw": "place money in", "ipa": "/pleɪs ˈmʌn.i ɪn/"}, {"type": "mc", "ctx": "Central bank", "s": "To build public trust, the central bank has promised to ___ a certain limit, even if one of the commercial banks fails.", "o": ["withdraw savings from", "waste savings on", "guarantee savings up to"], "a": "guarantee savings up to", "vi": "Để xây dựng niềm tin của công chúng, ngân hàng trung ương hứa bảo đảm tiền tiết kiệm đến một mức nhất định, dù một ngân hàng thương mại thất bại.", "why": "guarantee savings up to + mức = bảo đảm hoàn trả tiền gửi tối đa đến mức đó nếu ngân hàng phá sản.", "new": [{"w": "trust", "vi": "niềm tin"}, {"w": "commercial", "vi": "thương mại"}], "tw": "guarantee savings up to", "ipa": "/ˌɡær.ənˈtiː ˈseɪ.vɪŋz ʌp tuː/"}, {"type": "mc", "ctx": "Desert trek", "s": "The ___ across the desert was long and tiring, but the travellers camped under the stars each night and shared stories around the fire.", "o": ["platform", "journey", "discount"], "a": "journey", "vi": "Hành trình băng qua sa mạc dài và mệt, nhưng những người lữ hành cắm trại dưới các vì sao mỗi đêm và kể chuyện quanh lửa.", "why": "journey = quãng đường đi từ nơi này đến nơi khác (thường dài, bằng xe/tàu); trip ngắn hơn, flight là chuyến bay.", "new": [{"w": "tiring", "vi": "mệt nhọc"}, {"w": "camped", "vi": "cắm trại"}], "tw": "journey", "ipa": "/ˈdʒɜː.ni/"}, {"type": "mc", "ctx": "Long haul", "s": "Because the ___ to Tokyo takes about eleven hours, many passengers watch films or sleep to pass the time.", "o": ["flight", "luggage", "passport"], "a": "flight", "vi": "Vì chuyến bay đến Tokyo mất khoảng mười một giờ, nhiều hành khách xem phim hoặc ngủ để giết thời gian.", "why": "flight = chuyến bay (a flight to Tokyo, a long flight); khác journey là hành trình nói chung.", "new": [{"w": "pass the time", "vi": "giết thời gian"}], "tw": "flight", "ipa": "/flaɪt/"}, {"type": "mc", "ctx": "Bus network", "s": "Buses ___ in the city centre during the day, which means you almost never wait long at a stop.", "o": ["run every ten minutes", "close at midnight", "arrive on Monday"], "a": "run every ten minutes", "vi": "Xe buýt chạy mỗi mười phút ở trung tâm thành phố vào ban ngày, nghĩa là bạn hầu như không phải chờ lâu ở trạm.", "why": "run every ten minutes = (xe, tàu) chạy cứ 10 phút một chuyến; run ở đây nghĩa là vận hành theo lịch.", "new": [{"w": "network", "vi": "mạng lưới"}], "tw": "run every ten minutes", "ipa": "/rʌn ˈev.ri ten ˈmɪn.ɪts/"}, {"type": "mc", "ctx": "Weekend travel", "s": "Because Anna planned to go to the coast in the morning and come back the same evening, she bought ___ which cost less than two separate tickets.", "o": ["a parking ticket", "a return ticket", "a season ticket"], "a": "a return ticket", "vi": "Vì Anna định ra biển buổi sáng và về lại buổi tối cùng ngày, cô mua vé khứ hồi, rẻ hơn hai vé riêng.", "why": "a return ticket = vé đi và về (Anh); Mỹ thường nói round-trip ticket; trái nghĩa single ticket.", "new": [{"w": "separate", "vi": "riêng lẻ"}], "tw": "a return ticket", "ipa": "/ə rɪˈtɜːn ˌtɪk.ɪt/"}, {"type": "mc", "ctx": "Football fans", "s": "Football fans who attend every home match often buy ___ , which is cheaper than purchasing a separate ticket for each game.", "o": ["a season ticket", "a return ticket", "a boarding pass"], "a": "a season ticket", "vi": "Người hâm mộ bóng đá đi xem mọi trận sân nhà thường mua vé cả mùa, rẻ hơn mua vé riêng cho từng trận.", "why": "a season ticket = vé dùng nhiều lần trong một thời gian dài (tháng/mùa), rẻ hơn mua lẻ; cũng dùng cho bóng đá.", "new": [{"w": "attend", "vi": "tham dự"}], "tw": "a season ticket", "ipa": "/ə ˈsiː.zən ˌtɪk.ɪt/"}, {"type": "mc", "ctx": "Restaurant review", "s": "The food was delicious and the prices were fair. ___ the service was a bit slow when the place was busy.", "o": ["My only free time is that", "my only real complaint is that", "My only real friend is that"], "a": "my only real complaint is that", "vi": "Đồ ăn ngon và giá hợp lý. Điều duy nhất tôi thực sự phàn nàn là phục vụ hơi chậm khi quán đông.", "why": "My only real complaint is that + mệnh đề = điều duy nhất tôi thật sự chê là...; dùng sau khi đã khen nhiều thứ.", "new": [{"w": "fair", "vi": "hợp lý"}], "tw": "my only real complaint is that", "ipa": "/maɪ ˈəʊn.li rɪəl kəmˈpleɪnt ɪz ðæt/"}, {"type": "mc", "ctx": "Rural bus stop", "s": "In the countryside, buses are so rare that travellers sometimes ___ the next bus, even in bad weather.", "o": ["wait half an hour for", "wait half an hour of", "wait half an hour at"], "a": "wait half an hour for", "vi": "Ở nông thôn, xe buýt hiếm đến mức du khách đôi khi phải đợi nửa giờ cho chuyến sau, kể cả khi thời tiết xấu.", "why": "wait + khoảng thời gian + for + danh từ = đợi bao lâu cho thứ gì: wait half an hour for the next bus.", "new": [{"w": "rare", "vi": "hiếm"}], "tw": "wait half an hour for", "ipa": "/weɪt hɑːf ən ˈaʊər fɔːr/"}, {"type": "mc", "ctx": "Call centre", "s": "Customers sometimes ___ forty minutes to speak to an adviser on the phone, which explains why satisfaction scores are low.", "o": ["wait at", "wait for", "wait of"], "a": "wait for", "vi": "Khách hàng đôi khi phải chờ bốn mươi phút để nói chuyện với nhân viên tư vấn qua điện thoại, điều giải thích vì sao điểm hài lòng thấp.", "why": "wait for + khoảng thời gian + to do sth = đợi bao lâu mới làm được việc gì; be waiting for + time.", "new": [{"w": "satisfaction", "vi": "sự hài lòng"}], "tw": "wait for", "ipa": "/weɪt fɔːr/"}, {"type": "mc", "ctx": "Delayed express", "s": "We were waiting on ___ three when the announcement said the express to Hue would be delayed by forty minutes.", "o": ["ticket", "timetable", "platform"], "a": "platform", "vi": "Chúng tôi đang đợi ở sân ga số ba thì có thông báo tàu nhanh đi Huế bị trễ bốn mươi phút.", "why": "platform = sân ga nơi hành khách lên xuống tàu (platform three); không phải phòng chờ hay quầy vé.", "new": [{"w": "announcement", "vi": "thông báo"}], "tw": "platform", "ipa": "/ˈplæt.fɔːm/"}, {"type": "mc", "ctx": "Fresh market", "s": "Our apartment is ___ the main market, so we can buy fresh vegetables every morning without using the car.", "o": ["a long way from", "round the corner from", "responsible for"], "a": "round the corner from", "vi": "Căn hộ của chúng tôi ở ngay gần chợ chính, nên mỗi sáng chúng tôi mua rau tươi mà không cần dùng xe.", "why": "(just) round the corner from + nơi = rất gần nơi đó, vài bước đi; round = around.", "new": [{"w": "fresh", "vi": "tươi"}], "tw": "round the corner from", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Exam season", "s": "The final exams are ___ , so Linh has decided to stop going out and revise every evening.", "o": ["just round the corner", "a long way behind", "already over"], "a": "just round the corner", "vi": "Kỳ thi cuối kỳ sắp đến, nên Linh quyết định thôi đi chơi và ôn bài mỗi tối.", "why": "be (just) round the corner = (thời điểm, sự kiện) sắp đến; còn nghĩa gần đây là về địa điểm.", "new": [{"w": "revise", "vi": "ôn tập"}], "tw": "just round the corner", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Printing documents", "s": "If you need to print documents, there’s a copy shop ___ , and it stays open until ten at night.", "o": ["on the ceiling", "under the weather", "round the corner"], "a": "round the corner", "vi": "Nếu bạn cần in tài liệu, có một tiệm photocopy ngay gần đây và mở cửa đến mười giờ đêm.", "why": "There's/There are + N + round the corner = có cái gì ở ngay gần đây; không nhắc đến thời gian.", "new": [{"w": "copy shop", "vi": "tiệm photocopy"}], "tw": "round the corner", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Post office", "s": "Because the post office has only one open counter, customers have to ___ for at least twenty minutes on Monday mornings.", "o": ["run out of time", "wait in a queue", "sit on a shelf"], "a": "wait in a queue", "vi": "Vì bưu điện chỉ mở một quầy, khách phải xếp hàng chờ ít nhất hai mươi phút vào sáng thứ Hai.", "why": "wait in a queue = xếp hàng chờ (Anh); Mỹ hay nói wait in line.", "new": [{"w": "counter", "vi": "quầy"}], "tw": "wait in a queue", "ipa": "/weɪt ɪn ə kjuː/"}, {"type": "mc", "ctx": "Housing market", "s": "Rents in the city centre have started to ___ quickly, which means young workers are looking for cheaper flats in the suburbs.", "o": ["go up", "go out", "go off"], "a": "go up", "vi": "Giá thuê nhà ở trung tâm bắt đầu tăng nhanh, nghĩa là người trẻ đi làm đang tìm căn hộ rẻ hơn ở ngoại ô.", "why": "go up = tăng lên (giá, chi phí, nhiệt độ, số lượng); trái nghĩa go down.", "new": [{"w": "suburbs", "vi": "vùng ngoại ô"}], "tw": "go up", "ipa": "/ɡəʊ ʌp/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Reading", "s": "Several large companies have opened offices in the town because low rents attract young graduates. As a result, local restaurants are busier than they were five years ago. What does \"attract\" mean?", "o": ["giữ chân ở lại", "thu hút, kéo (ai đó) đến", "đuổi đi, xua đi"], "a": "thu hút, kéo (ai đó) đến", "vi": "Nhiều công ty lớn đã mở văn phòng ở thị trấn vì giá thuê thấp thu hút các sinh viên mới tốt nghiệp. Kết quả là các nhà hàng địa phương đông khách hơn năm năm trước.", "why": "attract sb/sth = thu hút ai/cái gì đến hoặc làm họ chú ý; chủ ngữ thường là nơi chốn, sự kiện hay ưu đãi.", "noblank": true, "say": "Several large companies have opened offices in the town because low rents attract young graduates. As a result, local restaurants are busier than they were five years ago.", "new": [{"w": "graduates", "vi": "người mới tốt nghiệp"}, {"w": "rents", "vi": "tiền thuê"}], "tw": "attract", "ipa": "/əˈtrækt/"}, {"type": "mc", "ctx": "Reading", "s": "A bright red banner hung above the entrance, which drew attention to the new gallery even from across the street. Many passers-by stopped to look inside. What does \"draw attention to\" mean?", "o": ["làm cho mọi người chú ý đến", "xin phép vào trong", "chuyển sự chú ý đi chỗ khác"], "a": "làm cho mọi người chú ý đến", "vi": "Một biểu ngữ đỏ rực treo phía trên lối vào, khiến mọi người chú ý đến phòng trưng bày mới ngay cả từ bên kia đường. Nhiều người đi đường dừng lại nhìn vào trong.", "why": "draw attention to sth = làm cho người khác chú ý đến một vấn đề/vật; draw đứng một mình cũng có nghĩa thu hút.", "noblank": true, "say": "A bright red banner hung above the entrance, which drew attention to the new gallery even from across the street. Many passers-by stopped to look inside.", "new": [{"w": "banner", "vi": "biểu ngữ"}, {"w": "passers-by", "vi": "người qua đường"}, {"w": "gallery", "vi": "phòng trưng bày"}], "tw": "draw attention to", "ipa": "/drɑː/"}, {"type": "mc", "ctx": "Reading", "s": "The new sports drink is advertised as healthy and low in sugar, so it appeals to people who exercise regularly. Sales have doubled since the summer. What does \"appeal to\" mean?", "o": ["gây hại cho", "khiếu nại với", "hấp dẫn, hợp sở thích của"], "a": "hấp dẫn, hợp sở thích của", "vi": "Loại nước uống thể thao mới được quảng cáo là tốt cho sức khỏe và ít đường, nên nó hấp dẫn những người tập luyện đều đặn. Doanh số đã tăng gấp đôi từ mùa hè.", "why": "appeal to sb = hợp sở thích/nhu cầu của ai, làm họ thích; chủ ngữ là thứ được thích.", "noblank": true, "say": "The new sports drink is advertised as healthy and low in sugar, so it appeals to people who exercise regularly. Sales have doubled since the summer.", "new": [{"w": "advertised", "vi": "được quảng cáo"}, {"w": "sales", "vi": "doanh số"}], "tw": "appeal to", "ipa": "/əˈpiːl/"}, {"type": "mc", "ctx": "Reading", "s": "Online sellers often use professional photos and clean packaging because buyers cannot touch the goods. A good image can increase sales more than a long description, which shows the importance of visual appeal. What does \"visual appeal\" mean?", "o": ["sức hấp dẫn nhờ giá rẻ", "sức hấp dẫn nhờ mùi thơm", "sức hấp dẫn nhờ hình ảnh đẹp"], "a": "sức hấp dẫn nhờ hình ảnh đẹp", "vi": "Người bán online thường dùng ảnh chuyên nghiệp và bao bì gọn gàng vì người mua không thể chạm vào hàng. Một hình ảnh đẹp có thể tăng doanh số hơn một bài mô tả dài, cho thấy tầm quan trọng của sức hấp dẫn về hình ảnh.", "why": "visual appeal = sự hấp dẫn nhờ vẻ ngoài đẹp (màu sắc, trình bày, thiết kế); thường đi với have/add/give.", "noblank": true, "say": "Online sellers often use professional photos and clean packaging because buyers cannot touch the goods. A good image can increase sales more than a long description, which shows the importance of visual appeal.", "new": [{"w": "packaging", "vi": "bao bì"}, {"w": "goods", "vi": "hàng hóa"}], "tw": "visual appeal", "ipa": "/ˈvɪʒ.u.əl əˈpiːl/"}, {"type": "mc", "ctx": "Reading", "s": "Because rents have risen sharply, many families choose supermarkets that offer big discounts. Stores with strong price appeal are drawing more shoppers, whereas expensive shops are losing customers. What does \"price appeal\" mean?", "o": ["sức hấp dẫn nhờ vị trí", "sức hấp dẫn nhờ giá hời", "sức hấp dẫn nhờ thương hiệu"], "a": "sức hấp dẫn nhờ giá hời", "vi": "Vì giá thuê nhà tăng mạnh, nhiều gia đình chọn siêu thị giảm giá lớn. Những cửa hàng có sức hấp dẫn về giá lớn đang kéo thêm người mua, trong khi các cửa hàng đắt đỏ mất khách.", "why": "price appeal = sản phẩm thu hút vì giá hời, rẻ hơn đối thủ; đối lập với visual appeal.", "noblank": true, "say": "Because rents have risen sharply, many families choose supermarkets that offer big discounts. Stores with strong price appeal are drawing more shoppers, whereas expensive shops are losing customers.", "new": [{"w": "discounts", "vi": "giảm giá"}, {"w": "sharply", "vi": "mạnh, đột ngột"}], "tw": "price appeal", "ipa": "/praɪs əˈpiːl/"}, {"type": "mc", "ctx": "Reading", "s": "Two online stores are fighting for the same customers by offering free delivery and big discounts. Analysts describe the struggle as one of the toughest in the industry, because neither store wants to lose its share of the market. What does \"struggle\" mean?", "o": ["sự cạnh tranh gay gắt", "sự thỏa hiệp", "sự hợp tác chặt chẽ"], "a": "sự cạnh tranh gay gắt", "vi": "Hai cửa hàng online đang tranh giành cùng nhóm khách bằng cách miễn phí giao hàng và giảm giá lớn. Các nhà phân tích mô tả cuộc đấu tranh này là một trong những cuộc khó nhất trong ngành, vì không bên nào muốn mất thị phần.", "why": "struggle (n) = cuộc đấu tranh/cạnh tranh; a struggle between A and B for sth = hai bên tranh giành nhau thứ gì.", "noblank": true, "say": "Two online stores are fighting for the same customers by offering free delivery and big discounts. Analysts describe the struggle as one of the toughest in the industry, because neither store wants to lose its share of the market.", "new": [{"w": "analysts", "vi": "nhà phân tích"}, {"w": "share of the market", "vi": "thị phần"}], "tw": "struggle", "ipa": "/ˈstrʌɡ.əl/"}, {"type": "mc", "ctx": "Reading", "s": "After the flood, many villagers had nothing left but their determination. Their struggle to rebuild homes and schools lasted for two years, which shows how strong a community can be. What does \"struggle\" mean?", "o": ["sự trì hoãn", "thành công dễ dàng", "cuộc vật lộn vất vả"], "a": "cuộc vật lộn vất vả", "vi": "Sau trận lũ, nhiều dân làng không còn gì ngoài quyết tâm. Cuộc vật lộn xây lại nhà cửa và trường học của họ kéo dài hai năm, cho thấy một cộng đồng có thể mạnh mẽ đến mức nào.", "why": "struggle (n) = cuộc vật lộn khi gặp khó khăn lớn; thường đi với a struggle to do sth / a struggle for survival.", "noblank": tr rn and the trainers are helpful. My only real complaint is that it gets very crowded after work.” What does \"my only real complaint is that\" mean?", "o": ["điều duy nhất tôi thực sự phàn nàn là...", "điều duy nhất tôi thực sự thích là...", "điều tôi muốn hỏi thêm là..."], "a": "điều duy nhất tôi thực sự phàn nàn là...", "vi": "Trong bài đánh giá phòng tập mới, Sara viết: “Thiết bị hiện đại và huấn luyện viên nhiệt tình. Điều duy nhất tôi thực sự phàn nàn là sau giờ làm nó rất đông.”", "why": "My only real complaint is that + mệnh đề = điều duy nhất tôi thật sự chê là...; dùng sau khi đã khen nhiều thứ.", "noblank": true, "say": "In her review of the new gym, Sara wrote, “The equipment is modern and the trainers are helpful. My only real complaint is that it gets very crowded after work.”", "new": [{"w": "equipment", "vi": "thiết bị"}, {"w": "trainers", "vi": "huấn luyện viên"}], "tw": "my only real complaint is that", "ipa": "/maɪ ˈəʊn.li rɪəl kəmˈpleɪnt ɪz ðæt/"}, {"type": "mc", "ctx": "Reading", "s": "The last bus had just left when Ken arrived at the stop, so he had to wait half an hour for the next one. He used the time to answer emails. What does \"wait half an hour for the next one\" mean?", "o": ["bỏ đi sau nửa giờ", "đợi nửa giờ để có chuyến tiếp theo", "đợi cả ngày mới có xe"], "a": "đợi nửa giờ để có chuyến tiếp theo", "vi": "Chuyến xe buýt vừa rời đi khi Ken đến trạm, nên anh phải đợi nửa giờ cho chuyến sau. Anh tận dụng thời gian để trả lời email.", "why": "wait + khoảng thời gian + for + danh từ = đợi bao lâu cho thứ gì: wait half an hour for the next bus.", "noblank": true, "say": "The last bus had just left when Ken arrived at the stop, so he had to wait half an hour for the next one. He used the time to answer emails.", "new": [{"w": "used the time", "vi": "tận dụng thời gian"}], "tw": "wait half an hour for", "ipa": "/weɪt hɑːf ən ˈaʊər fɔːr/"}, {"type": "mc", "ctx": "Reading", "s": "Hoa has been waiting for two hours to renew her passport. The office is very busy today, and the staff say it may take another hour. What does \"wait for two hours to renew\" mean?", "o": ["mất hai giờ để đến văn phòng", "chờ hai giờ để gia hạn", "chờ hai giờ rồi bỏ về"], "a": "chờ hai giờ để gia hạn", "vi": "Hoa đã chờ hai giờ để gia hạn hộ chiếu. Hôm nay văn phòng rất đông, và nhân viên nói có thể mất thêm một giờ.", "why": "wait for + khoảng thời gian + to do sth = đợi bao lâu mới làm được việc gì; be waiting for + time.", "noblank": true, "say": "Hoa has been waiting for two hours to renew her passport. The office is very busy today, and the staff say it may take another hour.", "new": [{"w": "renew", "vi": "gia hạn"}], "tw": "wait for", "ipa": "/weɪt fɔːr/"}, {"type": "mc", "ctx": "Reading", "s": "The stationmaster announced that the 9:40 train to Da Nang would leave from platform five instead of platform two. Passengers hurried down the stairs, carrying heavy suitcases. What does \"platform\" mean?", "o": ["sân ga", "quầy bán vé", "phòng chờ"], "a": "sân ga", "vi": "Trưởng ga thông báo chuyến tàu 9:40 đi Đà Nẵng sẽ khởi hành từ sân ga số năm thay vì số hai. Hành khách vội xuống cầu thang, xách vali nặng.", "why": "platform = sân ga nơi hành khách lên xuống tàu (platform three); không phải phòng chờ hay quầy vé.", "noblank": true, "say": "The stationmaster announced that the 9:40 train to Da Nang would leave from platform five instead of platform two. Passengers hurried down the stairs, carrying heavy suitcases.", "new": [{"w": "stationmaster", "vi": "trưởng ga"}, {"w": "hurried", "vi": "vội vã"}], "tw": "platform", "ipa": "/ˈplæt.fɔːm/"}, {"type": "mc", "ctx": "Reading", "s": "My daughter’s primary school is just round the corner from our flat. We usually walk there together, and the trip takes less than five minutes. What does \"round the corner from\" mean?", "o": ["ở rất xa", "ở tầng trên", "ở rất gần"], "a": "ở rất gần", "vi": "Trường tiểu học của con gái tôi ở ngay gần căn hộ. Chúng tôi thường đi bộ cùng nhau và chỉ mất chưa đến năm phút.", "why": "(just) round the corner from + nơi = rất gần nơi đó, vài bước đi; round = around.", "noblank": true, "say": "My daughter’s primary school is just round the corner from our flat. We usually walk there together, and the trip takes less than five minutes.", "new": [{"w": "primary school", "vi": "trường tiểu học"}, {"w": "flat", "vi": "căn hộ"}], "tw": "round the corner from", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Reading", "s": "The summer holidays are just around the corner, and travel agents are receiving more calls every day. Many families are rushing to book flights before the prices go up. What does \"just around the corner\" mean?", "o": ["vừa kết thúc", "ở gần đây", "sắp đến"], "a": "sắp đến", "vi": "Kỳ nghỉ hè sắp đến, và các đại lý du lịch nhận nhiều cuộc gọi hơn mỗi ngày. Nhiều gia đình vội đặt vé máy bay trước khi giá tăng.", "why": "be (just) round the corner = (thời điểm, sự kiện) sắp đến; còn nghĩa gần đây là về địa điểm.", "noblank": true, "say": "The summer holidays are just around the corner, and travel agents are receiving more calls every day. Many families are rushing to book flights before the prices go up.", "new": [{"w": "travel agents", "vi": "đại lý du lịch"}, {"w": "rushing", "vi": "vội vã"}], "tw": "just round the corner", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Reading", "s": "A tourist asked a passer-by where he could buy water. “There’s a small supermarket round the corner,” the man said. “You will see it as soon as you turn left.” What does \"round the corner\" mean?", "o": ["sắp xảy ra", "quay đầu lại", "ở ngay gần đây"], "a": "ở ngay gần đây", "vi": "Một du khách hỏi người qua đường mua nước ở đâu. “Có một siêu thị nhỏ ngay gần đây,” người đàn ông nói. “Rẽ trái là bạn thấy ngay.”", "why": "There's/There are + N + round the corner = có cái gì ở ngay gần đây; không nhắc đến thời gian.", "noblank": true, "say": "A tourist asked a passer-by where he could buy water. “There’s a small supermarket round the corner,” the man said. “You will see it as soon as you turn left.”", "new": [{"w": "passer-by", "vi": "người qua đường"}], "tw": "round the corner", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Reading", "s": "Hundreds of fans waited in a queue outside the shop all night to buy the new phone. Some of them even brought folding chairs and blankets. What does \"wait in a queue\" mean?", "o": ["chen lấn", "cắm trại ngoài trời", "xếp hàng chờ"], "a": "xếp hàng chờ", "vi": "Hàng trăm người hâm mộ xếp hàng chờ ngoài cửa hàng cả đêm để mua điện thoại mới. Một số còn mang theo ghế xếp và chăn.", "why": "wait in a queue = xếp hàng chờ (Anh); Mỹ hay nói wait in line.", "noblank": true, "say": "Hundreds of fans waited in a queue outside the shop all night to buy the new phone. Some of them even brought folding chairs and blankets.", "new": [{"w": "folding", "vi": "gấp được"}, {"w": "blankets", "vi": "chăn"}], "tw": "wait in a queue", "ipa": "/weɪt ɪn ə kjuː/"}, {"type": "mc", "ctx": "Reading", "s": "Food prices went up by nearly eight percent last year, according to the statistics office. Because of this, many families are buying cheaper brands and cooking at home more often. What does \"go up\" mean?", "o": ["tăng lên", "giữ nguyên", "giảm xuống"], "a": "tăng lên", "vi": "Giá thực phẩm đã tăng gần tám phần trăm năm ngoái, theo cục thống kê. Vì vậy nhiều gia đình mua thương hiệu rẻ hơn và nấu ăn ở nhà thường xuyên hơn.", "why": "go up = tăng lên (giá, chi phí, nhiệt độ, số lượng); trái nghĩa go down.", "noblank": true, "say": "Food prices went up by nearly eight percent last year, according to the statistics office. Because of this, many families are buying cheaper brands and cooking at home more often.", "new": [{"w": "statistics", "vi": "thống kê"}], "tw": "go up", "ipa": "/ɡəʊ ʌp/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Tourism and shopping", "s": "Describe a place in your country that attracts many visitors. Say what makes it special and who it appeals to.", "vi": "Hãy tả một nơi trong nước bạn thu hút nhiều du khách. Nói điều gì làm nó đặc biệt và nó hấp dẫn những ai.", "words": ["attract", "draw attention to", "appeal to", "visual appeal", "price appeal"], "why": "Nêu tên nơi đó, lý do nổi tiếng (cảnh đẹp, giá rẻ), nhóm khách yêu thích; dùng although/whereas để so sánh.", "sample": "One place that attracts a lot of visitors in my country is Hoi An, an old town in the centre. Its yellow houses and silk lanterns draw attention to the local culture, and the visual appeal of the streets at night is incredible. The town also appeals to different people: young backpackers like the street food, whereas older couples enjoy the quiet river. Another reason is price appeal, because hotels and meals are reasonably cheap compared with big cities. Although it can get crowded at weekends, I believe it deserves its reputation, and I would happily recommend it to any foreign friend."}, {"type": "sp", "ctx": "Small business", "s": "Do you think small family shops can survive today? Why or why not?", "vi": "Bạn có nghĩ các cửa hàng gia đình nhỏ có thể tồn tại ngày nay không? Vì sao?", "words": ["struggle", "struggle to", "survive", "struggle to make a living"], "why": "Nêu ý kiến, ví dụ một cửa hàng nhỏ cạnh siêu thị, khó khăn và cách họ có thể trụ lại; dùng however/if.", "sample": "I think small shops can survive, but it is a real struggle. In my neighbourhood, a family grocery store has to compete with a huge supermarket that offers lower prices and longer opening hours. The owners struggle to make a living, and they often struggle to pay the rent in slow months. However, they still survive because they know their customers by name and give friendly service. If they also sold products online, they would have a better chance. In conclusion, small businesses need both loyal customers and new ideas, otherwise the struggle between small and large stores will only get harder."}, {"type": "sp", "ctx": "Energy and environment", "s": "How can families reduce the energy they use at home? Give some examples from your own life.", "vi": "Các gia đình có thể giảm năng lượng dùng ở nhà bằng cách nào? Cho ví dụ từ cuộc sống của bạn.", "words": ["consume", "consumption", "consumable", "go up"], "why": "Nêu 2-3 thói quen tiết kiệm điện, kết quả cụ thể và lợi ích môi trường; dùng as a result.", "sample": "In my family, we try to consume less energy because electricity bills keep going up every year. For example, we replaced old bulbs with LED lights, and we switch off the air conditioner when nobody is in the room. As a result, our energy consumption has fallen by about twenty percent. We also avoid buying too many consumable items, such as plastic bags and paper cups, because they are thrown away after one use. If everyone changed small habits like these, cities would save a lot of money and protect the environment as well."}, {"type": "sp", "ctx": "Everyday English", "s": "Tell me about a time you went out with friends, shared a bill, or helped someone who felt nervous.", "vi": "Hãy kể về lần bạn đi chơi với bạn bè, chia hóa đơn, hoặc giúp ai đó đang lo lắng.", "words": ["How much will it be?", "How much do I owe you?", "We’re settled.", "Don’t be afraid.", "Give me a break!"], "why": "Kể thứ tự: gọi món, hỏi giá, trả tiền, trấn an bạn; chèn các câu giao tiếp tự nhiên.", "sample": "Last month I had dinner with three friends, and the waiter asked who would pay when we were ready. My friend Mai asked, 'How much will it be?' and then paid first. I asked her, 'How much do I owe you?' After I sent my share, she smiled and said, 'Great, we’re settled.' Earlier, one of our group was nervous about a job interview, so I told her, 'Don’t be afraid.' She laughed and answered, 'Give me a break, I'm just thinking too much!' It was a simple evening, but it reminded me how useful short everyday expressions are."}, {"type": "sp", "ctx": "Clothes and personality", "s": "Describe clothes you like to wear and explain how they reflect your personality.", "vi": "Hãy tả quần áo bạn thích mặc và giải thích chúng phản ánh tính cách bạn thế nào.", "words": ["suit", "look good in", "do up", "undo", "reflect"], "why": "Nêu màu/kiểu yêu thích, vì sao hợp với bạn, một thói quen khi mặc áo khoác, rồi liên hệ tính cách.", "sample": "I usually wear simple clothes, but for special occasions I like dark blue because it suits me and I look good in it. Last winter I bought a long coat, and the first thing I did every morning was to do up the zip before leaving home. When I get on a crowded bus and feel hot, I undo it. I think clothes reflect a person’s personality: someone who loves bright colours is often outgoing, whereas people who prefer neutral shades may be calmer. Of course, comfort matters more to me than fashion."}, {"type": "sp", "ctx": "Saving and investing", "s": "If you had some extra money, would you save it or invest it? Explain your choice.", "vi": "Nếu có thêm tiền, bạn sẽ tiết kiệm hay đầu tư? Giải thích lựa chọn.", "words": ["place money in", "guarantee savings up to", "pay higher returns", "invest money from", "agree not to withdraw", "pay a small fine"], "why": "Nêu lựa chọn chính, so sánh an toàn và lợi nhuận, điều kiện và phí phạt; dùng on the other hand.", "sample": "If I had some extra money, I would place money in a savings account first, because it is the safest choice. Some banks guarantee savings up to a fixed amount, which means customers will not lose everything if the bank fails. On the other hand, some investments pay higher returns, so I might invest money from my bonus in shares. However, you should read the rules carefully: some products ask you to agree not to withdraw your money for several years, and you may have to pay a small fine if you break the agreement. Overall, balance is the key."}, {"type": "sp", "ctx": "Travel", "s": "Describe a memorable journey you have taken. Say where you went, how you travelled and what you remember most.", "vi": "Hãy tả một chuyến đi đáng nhớ. Nói bạn đi đâu, đi bằng gì và nhớ điều gì nhất.", "words": ["journey", "flight", "a return ticket", "a season ticket", "run every ten minutes"], "why": "Kể điểm đến, phương tiện, vé, chi tiết đáng nhớ và cảm nhận; dùng although để nối ý.", "sample": "The most memorable journey I have taken was a trip from Ho Chi Minh City to Da Lat. The flight would have been quicker, but I preferred the bus because it was cheaper. At home, I usually buy a return ticket for short trips, whereas my brother, who commutes daily, has a season ticket. In Da Lat, local buses run every ten minutes, so we never needed a taxi. Although the road was winding and I felt a bit sick, the cool weather and pine forests made me forget everything. It was a trip I will never forget."}, {"type": "sp", "ctx": "Public transport", "s": "What are the advantages and disadvantages of public transport in your city?", "vi": "Giao thông công cộng ở thành phố bạn có ưu và nhược điểm gì?", "words": ["my only real complaint is that", "wait half an hour for", "wait for", "platform", "wait in a queue"], "why": "Nêu ưu điểm, rồi nhược điểm bằng My only real complaint is that…, kết luận bằng despite.", "sample": "Public transport in my city has improved, but it is not perfect. My only real complaint is that buses are often late, so I sometimes wait half an hour for the next one. When I wait for a train at the platform, I usually read something to pass the time. At rush hour I also have to wait in a queue before I can get on, which is tiring. Despite these problems, public transport is cheaper and better for the environment than driving a car. If the city added more buses, I think more people would use them."}, {"type": "sp", "ctx": "Neighbourhood", "s": "Describe the area where you live and what you can find nearby.", "vi": "Hãy tả khu bạn sống và những gì có ở gần đó.", "words": ["round the corner from", "just round the corner", "round the corner", "go up"], "why": "Kể các tiện ích gần nhà, một sự kiện sắp đến, một nhược điểm (giá tăng) và cảm nhận chung.", "sample": "I live in a quiet area where almost everything is round the corner. There’s a small market round the corner from my building, and my niece’s school is just round the corner as well, so she can walk there alone. Although the area is convenient, prices for rent and food go up every year, which worries me. Many young families are moving out, whereas older residents stay because they know everyone. I would not want to live anywhere else, because being close to shops, parks and friends makes daily life much easier."}, {"type": "sp", "ctx": "Difficult times", "s": "Talk about a difficult period in your life and how you dealt with it.", "vi": "Hãy nói về một giai đoạn khó khăn trong đời bạn và cách bạn vượt qua.", "words": ["Sometimes you’re up, sometimes you’re down.", "struggle", "survive", "reflect"], "why": "Kể hoàn cảnh, cảm xúc, lời khuyên bạn nhận được, bạn đã làm gì và rút ra bài học.", "sample": "A difficult time in my life was when I lost my part-time job during my second year at university. It was a real struggle, and I had to survive on instant noodles for a while. At first I felt hopeless, but my uncle told me, 'Sometimes you’re up, sometimes you’re down.' When I began to reflect on his advice, I realised that every problem has an end. I started giving private lessons, and slowly everything improved. Now I think hard periods teach us how strong we can become."}]}]};

      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
