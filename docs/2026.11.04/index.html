    --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .tag{font-weight:700;margin-right:8px}
.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}
.manual summary{cursor:pointer;color:var(--muted)}
.manual textarea{width:100%;min-height:90px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.band .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--primary)}
.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

an. He turns off the heating in November, even though the tenants are freezing, because he does not want to pay the bill.", "vi": "Chủ nhà của Tom nổi tiếng keo kiệt. Ông tắt hệ thống sưởi vào tháng Mười Một dù người thuê nhà lạnh cóng, vì không muốn trả hóa đơn.", "why": "mean (adj) = keo kiệt, không muốn chi tiền (khác với 'mean' = có nghĩa là).", "new": [{"w": "landlord", "vi": "chủ nhà"}, {"w": "tenants", "vi": "người thuê nhà"}], "ipa": "/miːn/", "tw": "mean"}, {"type": "mc", "ctx": "Air travel", "s": "Flying always makes Daniel anxious. His hands shake during take-off, and he keeps asking the cabin crew whether the weather is going to get worse. What does \"anxious\" mean?", "o": ["lo lắng, bồn chồn", "phấn khích", "mệt mỏi"], "a": "lo lắng, bồn chồn", "noblank": true, "say": "Flying always makes Daniel anxious. His hands shake during take-off, and he keeps asking the cabin crew whether the weather is going to get worse.", "vi": "Đi máy bay luôn khiến Daniel lo lắng. Tay anh run khi cất cánh và anh cứ hỏi tiếp viên liệu thời tiết có xấu đi không.", "why": "anxious = lo lắng, bồn chồn vì điều có thể xảy ra.", "new": [{"w": "take-off", "vi": "cất cánh"}, {"w": "cabin crew", "vi": "tiếp viên"}], "ipa": "/ˈæŋk.ʃəs/", "tw": "anxious"}, {"type": "mc", "ctx": "Office reception", "s": "The new receptionist has a pleasant voice and always greets visitors with a smile. As a result, many clients say that the office feels more welcoming than before. What does \"pleasant\" mean?", "o": ["dễ chịu, dễ mến", "ồn ào, khó nghe", "yếu ớt"], "a": "dễ chịu, dễ mến", "noblank": true, "say": "The new receptionist has a pleasant voice and always greets visitors with a smile. As a result, many clients say that the office feels more welcoming than before.", "vi": "Lễ tân mới có giọng nói dễ chịu và luôn chào khách với nụ cười. Nhờ vậy nhiều khách hàng nói văn phòng thân thiện hơn trước.", "why": "pleasant = dễ chịu, làm người ta thấy vui (người, thời tiết, nơi chốn).", "new": [{"w": "r visit", "s": "Instead of checking his phone, Daniel asked an old man the way to the market. The man not only explained the route but also walked with him to the corner. What does \"ask somebody the way\" mean?", "o": ["hỏi đường", "chỉ đường", "tìm bản đồ"], "a": "hỏi đường", "noblank": true, "say": "Instead of checking his phone, Daniel asked an old man the way to the market. The man not only explained the route but also walked with him to the corner.", "vi": "Thay vì xem điện thoại, Daniel hỏi một cụ ông đường đến chợ. Ông không chỉ giải thích tuyến đường mà còn đi cùng anh đến góc phố.", "why": "ask somebody the way (to...) = hỏi ai đó đường đi.", "new": [{"w": "route", "vi": "tuyến đường"}], "ipa": "/ɑːsk ðə weɪ/", "tw": "ask somebody the way"}, {"type": "mc", "ctx": "Stadium parking", "s": "The guard at the gate directed us to the car park behind the stadium. Without his help, we would have driven round the building for another twenty minutes. What does \"direct somebody to\" mean?", "o": ["chỉ đường cho ai tới đâu", "ép ai rời khỏi", "đưa tiền cho ai"], "a": "chỉ đường cho ai tới đâu", "noblank": true, "say": "The guard at the gate directed us to the car park behind the stadium. Without his help, we would have driven round the building for another twenty minutes.", "vi": "Bảo vệ ở cổng chỉ chúng tôi đến bãi đỗ xe sau sân vận động. Không có anh, chúng tôi đã chạy quanh tòa nhà thêm hai mươi phút.", "why": "direct sb to + nơi = chỉ đường/hướng dẫn ai đến nơi nào.", "new": [{"w": "guard", "vi": "bảo vệ"}], "ipa": "/dəˈrekt/", "tw": "direct somebody to"}, {"type": "mc", "ctx": "Hiking trail", "s": "The hiking trail is well marked. Walkers only need to follow signs to the summit, where there is a small café and a spectacular view of the valley. What does \"follow signs to\" mean?", "o": ["đi theo biển chỉ dẫn tới", "đọc bản đồ về", "hỏi hướng dẫn viên về"], "a": "đi theo biển chỉ dẫn tới", "noblank": true, "say": "The hiking trail is well marked. Walkers only need to follow signs to the summit, where there is a small café and a spectacular view of the valley.", "vi": "Đường mòn được đánh dấu tốt. Người đi chỉ cần theo biển chỉ dẫn lên đỉnh, nơi có quán cà phê nhỏ và tầm nhìn tuyệt đẹp xuống thung lũng.", "why": "follow (the) signs to + nơi = đi theo biển báo để tới nơi đó.", "new": [{"w": "trail", "vi": "đường mòn"}, {"w": "summit", "vi": "đỉnh núi"}, {"w": "valley", "vi": "thung lũng"}], "ipa": "/ˈfɒləʊ saɪnz fə/", "tw": "follow signs to"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Working relationships", "s": "Describe a colleague, classmate or neighbour you get along with. What is their personality like, and how do they behave when things go wrong?", "vi": "Hãy mô tả một đồng nghiệp, bạn học hoặc hàng xóm mà bạn hòa hợp. Tính cách họ thế nào và họ cư xử ra sao khi có chuyện không suôn sẻ?", "words": ["mean", "anxious", "pleasant", "unpleasant", "sensible", "silly", "easy to deal with"], "why": "Giới thiệu người đó, nêu 2-3 nét tính cách, kể một tình huống khó khăn và cách họ xử lý, rồi kết bằng cảm nhận của bạn.", "sample": "I would like to talk about my colleague Hung, who is very easy to deal with. He is pleasant and sensible, so he rarely loses his temper. Last month our project was delayed, and everyone felt anxious, yet he calmly made a new plan. In contrast, our previous manager was rather mean with money and often made unpleasant comments in meetings. Hung sometimes makes silly jokes, but they help us relax. Because of his attitude, our team feels more comfortable, and we complete tasks on time. I believe that a good colleague is more valuable than a high salary."}, {"type": "sp", "ctx": "Shops and marketing", "s": "Talk about a shop, café or app that you often use. Why does it attract customers, and how does it stand out from similar places?", "vi": "Hãy nói về một cửa hàng, quán cà phê hoặc ứng dụng bạn hay dùng. Vì sao nó thu hút khách và khác biệt thế nào so với nơi tương tự?", "words": ["attract", "draw attention to", "appeal to", "visual appeal", "price appeal", "engage in"], "why": "Nêu nơi đó, giải thích điểm hấp dẫn (hình ảnh, giá), cách họ quảng bá, rồi so sánh với nơi khác và kết luận.", "sample": "My favourite café is a small place near my office. It manages to attract many students because it has strong visual appeal: the walls are covered with plants and the lamps are warm. The owner also has good price appeal, since a large coffee costs less than in chain stores. To draw attention to the café, she posts photos online and often engages in local events, such as book fairs. Although the music may not appeal to everyone, most customers like the relaxed atmosphere. As a result, the café is rarely empty, even on weekdays."}, {"type": "sp", "ctx": "Small businesses", "s": "Some small businesses and farmers find it hard to continue today. Why is this, and what can governments or customers do to help?", "vi": "Một số doanh nghiệp nhỏ và nông dân ngày nay khó duy trì. Vì sao vậy và chính phủ hay khách hàng có thể giúp gì?", "words": ["struggle", "struggle to", "survive", "struggle to make a living", "reflect"], "why": "Nêu vấn đề, giải thích 2 nguyên nhân (chi phí, cạnh tranh), đề xuất giải pháp cho chính phủ và người tiêu dùng, rồi kết luận.", "sample": "In many places, small farmers and shop owners struggle to make a living because costs keep rising. They also face a constant struggle against big companies, which can sell goods at lower prices. Some small shops cannot survive more than a few years, and many owners struggle to pay rent. I think this situation reflects a wider problem: customers often choose the cheapest option without thinking about local jobs. Governments could offer tax reductions, while shoppers could buy local products whenever possible. If both sides cooperate, small businesses might survive and communities would stay lively."}, {"type": "sp", "ctx": "Energy and resources", "s": "Do you think people should reduce the amount of energy and resources they use at home? Explain what you do, and what could be done in your city.", "vi": "Bạn có nghĩ mọi người nên giảm lượng năng lượng và tài nguyên dùng ở nhà không? Hãy giải thích bạn làm gì và thành phố bạn có thể làm gì.", "words": ["consume", "consumption", "consumable"], "why": "Nêu quan điểm, kể 2 thói quen của bạn, đề xuất việc thành phố nên làm, rồi kết bằng lợi ích lâu dài.", "sample": "Yes, I believe we should reduce our energy consumption, because electricity prices are rising and the environment is suffering. At home, we try to consume less by turning off lights and using fans instead of air conditioning. We also buy fewer consumable products, such as plastic bags and paper cups, and choose reusable ones. In my city, the government could encourage solar panels and offer lower prices for families that use less energy. Although change takes time, small habits add up. If everyone acts responsibly, total consumption could fall significantly within ten years."}, {"type": "sp", "ctx": "Friends and money", "s": "Describe a time when you shared a bill with friends, or when someone helped you feel better after a bad day. What was said, and how did it end?", "vi": "Hãy kể một lần bạn chia hóa đơn với bạn bè, hoặc có người giúp bạn vui lên sau một ngày tệ. Mọi người đã nói gì và kết thúc thế nào?", "words": ["Sometimes you're up, sometimes you're down", "We're settled", "Don't be afraid", "Give me a break", "How much do I owe you", "How much will it be"], "why": "Kể bối cảnh, dùng các câu nói tự nhiên như lời thoại, rồi kết bằng cảm xúc hoặc bài học.", "sample": "Last month I had a terrible week: I failed a driving test and lost my wallet. My friend Lan invited me for dinner. When the waiter brought the menu, I asked, How much will it be? because I was worried about money. She laughed and said, Give me a break! It's my treat. Later she paid, and I asked, How much do I owe you? She refused my money and told me, Don't be afraid to ask for help. Sometimes you're up, sometimes you're down. When I paid for coffee the next day, I smiled and said, We're settled."}, {"type": "sp", "ctx": "Saving and investing", "s": "If you had some extra money, would you keep it in the bank or invest it? Explain your choice.", "vi": "Nếu có thêm một khoản tiền, bạn sẽ gửi ngân hàng hay đầu tư? Hãy giải thích lựa chọn của bạn.", "words": ["place money in", "guarantee savings up to", "agree not to withdraw", "pay a small fine", "invest money from", "pay higher returns"], "why": "Nêu lựa chọn, so sánh an toàn và lợi nhuận, nhắc điều kiện (không rút sớm, phạt), rồi kết luận theo tính cách bạn.", "sample": "If I had extra money, I would probably place money in a savings account first, because I want a safe place to keep it. Many banks guarantee savings up to a certain limit, so I would not lose everything if something went wrong. For a longer plan, I might agree not to withdraw the money for two years, even though I may have to pay a small fine if I change my mind. Some funds invest money from thousands of people and can pay higher returns, but I do not like taking big risks. Overall, I prefer slow and steady growth."}, {"type": "sp", "ctx": "Travel experience", "s": "Tell me about a long trip you made by plane or train. What was it like, and was there anything you did not enjoy?", "vi": "Hãy kể về một chuyến đi dài bằng máy bay hoặc tàu. Chuyến đi thế nào và có điều gì bạn không thích không?", "words": ["journey", "flight", "a return ticket", "a season ticket", "my only real complaint is that"], "why": "Nêu chuyến đi, kể diễn biến theo thứ tự, thêm chi tiết vé, rồi nêu một điều chưa hài lòng và cảm nhận chung.", "sample": "Last summer I took a long journey from Ho Chi Minh City to Hanoi to visit relatives. The flight lasted two hours, and the staff were polite. Before that, I had bought a return ticket online because it was cheaper than two single tickets. My brother, who works in Hanoi, uses a season ticket for the metro, which saves him money every month. Overall, I enjoyed the trip, and the weather was good. My only real complaint is that the airport was extremely crowded, so we lost an hour at security. Still, I would happily make the same journey again."}, {"type": "sp", "ctx": "Public transport", "s": "How is public transport in your city? Talk about waiting times, crowds, and whether you think it is improving.", "vi": "Giao thông công cộng ở thành phố bạn thế nào? Hãy nói về thời gian chờ, đông đúc và liệu nó có đang cải thiện không.", "words": ["run every ten minutes", "wait half an hour for", "wait for 20 minutes to", "platform", "wait in a queue", "go up"], "why": "Đánh giá chung, nêu ví dụ tuyến tốt và tuyến chờ lâu, kể một trải nghiệm cụ thể, rồi đề xuất cải thiện.", "sample": "Public transport in my city is improving, but it is not perfect yet. On the main routes, buses run every ten minutes, so I rarely wait long. However, on smaller streets I sometimes have to wait half an hour for a bus, and on rainy days many people wait in a queue at the stop. Last week, I had to wait for 20 minutes to get on a crowded train at the platform near my office. Fares have also started to go up, which worries many students. If the government invests more, the service could become faster, cleaner and cheaper."}, {"type": "sp", "ctx": "My neighbourhood", "s": "Describe the area where you live. What useful places are nearby, and is there any event coming up soon?", "vi": "Hãy mô tả khu bạn sống. Có những nơi hữu ích nào gần đó và sắp có sự kiện nào không?", "words": ["be round the corner from", "be round the corner", "round the corner", "junction"], "why": "Giới thiệu khu vực, nêu nơi tiện lợi ở gần, một điểm bất tiện, rồi nhắc sự kiện sắp đến và cảm nhận.", "sample": "I live in a lively area close to the city centre. My flat is just round the corner from a big market, so I can buy fresh fruit every morning. There is also a pharmacy round the corner, which is very convenient when someone feels ill. The only difficult place is the junction near my street, where traffic is heavy at rush hour. Luckily, a new pedestrian bridge is planned, and the Lunar New Year is just round the corner, so the neighbourhood will soon be full of flowers and lights. I would not like to move anywhere else."}, {"type": "sp", "ctx": "Finding the way", "s": "Tell me about a time when you got lost or had trouble finding a place. What happened and how did you solve the problem?", "vi": "Hãy kể về một lần bạn bị lạc hoặc khó tìm một nơi. Chuyện gì xảy ra và bạn giải quyết thế nào?", "words": ["get lost", "on my way to", "go via", "turning", "take the wrong turning", "ask somebody the way", "direct somebody to", "follow signs to"], "why": "Nêu hoàn cảnh, kể lỗi dẫn đến lạc, cách bạn hỏi đường và được chỉ dẫn, rồi nêu bài học rút ra.", "sample": "Last year I was on my way to a job interview in an unfamiliar district. The map on my phone told me to go via the riverside road, but I took the wrong turning and soon I got lost. Because my battery was low, I decided to ask someone the way. A kind shopkeeper directed me to the main street and told me to follow signs to the business park. Although I arrived ten minutes late, the interviewer was understanding. Since then, I always leave early and check every turning before I travel."}]}]};
  const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  /* ---------- prepare ---------- */
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ALL=[];
  SECTIONS.forEach(sec=>sec.qs.forEach((q,i)=>{q.id=sec.id+'q'+(i+1);q.sec=sec.id;q.n=i+1;if(q.type==='mc')q.opts=shuffle(q.o);ALL.push(q);}));
  const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));
  const STATQ=ALL.filter(q=>q.type!=='sp');

  const KEY=DATA.meta.storageKey||'drill-v1';
  let state={};
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
  const isRight=(q,v)=>q.type==='mc'?v===q.a:q.acc.some(x=>norm(x)===norm(v));

  const hintsOpen=new Set();
  let current=SECTIONS[0].id;
  const $=id=>document.getElementById(id);

  /* ---------- listening (browser speech synthesis) ---------- */
  const CAN_SPEAK=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
  let voice=null;
  /* Fallback voice: prefer natural / neural US English voices when the audio files cannot be played. */
  function pickVoice(){
    if(!CAN_SPEAK)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/aria|jenny|ava|andrew|guy|samantha|google us/i.test(v.name)?2:0)+(v.localService?0:1);
    voice=vs.sort((a,b)=>score(b)-score(a))[0]||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang))||null;
  }
  if(CAN_SPEAK){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
  let audio=null;
  let cur=null; /* what is playing now: {id, kind:'audio'|'tts', paused} */
  function updateControls(){
    document.querySelectorAll('[data-pause]').forEach(b=>{
      const active=!!cur&&cur.id===b.dataset.pause;
      b.disabled=!active;
      const paused=active&&cur.paused;
      b.querySelector('span').textContent=paused?'Tiếp tục':'Tạm dừng';
      b.querySelector('.i-pause').hidden=paused;
      b.querySelector('.i-play').hidden=!paused;
      b.classList.toggle('on',paused);
    });
  }
  function stopAudio(){
    if(audio){audio.onended=audio.onerror=audio.onplaying=null;audio.pause();audio=null;}
    if(CAN_SPEAK)speechSynthesis.cancel();
    cur=null;
    document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
    updateControls();
  }
  function togglePause(id){
    if(!cur||cur.id!==id)return;
    if(cur.kind==='audio'&&audio){
      if(audio.paused){audio.play();cur.paused=false;}else{audio.pause();cur.paused=true;}
    }else if(cur.kind==='tts'&&CAN_SPEAK){
      if(speechSynthesis.paused){speechSynthesis.resume();cur.paused=false;}else{speechSynthesis.pause();cur.paused=true;}
    }
    updateControls();
  }
  function speakFallback(id,done,slow,btn){
    if(!CAN_SPEAK){cur=null;updateControls();return;}
    const q=byId[id];
    const text=q.type==='sp'?q.s:(q.listen?q.s.replace('___',q.a||'')+'':q.s.includes('___')?q.s.replace('___',done?q.a:'blank'):(done?q.s+' '+q.a:q.s)).replace(/\b(\d{1,2})\.(\d{2})\b/g,'$1:$2');
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang;}
    u.rate=slow?0.65:0.95;
    cur={id,kind:'tts',paused:false};
    u.onstart=()=>{btn&&btn.classList.add('on');updateControls();};
    u.onend=u.onerror=()=>{btn&&btn.classList.remove('on');if(cur&&cur.kind==='tts'&&cur.id===id)cur=null;updateControls();};
    speechSynthesis.speak(u);
    updateControls();
  }
  function speak(id,slow,btn){
    stopAudio();
    const done=!!state[id];
    const suffix=(slow?'s':'')+(done?(slow?'':'f'):'b');
    const a=new Audio('audio/'+id+'_'+suffix+'.mp3'+(DATA.meta.audioVersion?'?v='+DATA.meta.audioVersion:''));
    audio=a;
    cur={id,kind:'audio',paused:false};

         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
