.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}

.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}

.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}

.vi{color:var(--muted);font-size:14px}

.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}

.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}

ì làm gì (bị động).", "hint": "Nghĩa: bị phạt (vì làm gì)", "new": [{"w": "cheating", "vi": "gian lận"}, {"w": "season", "vi": "mùa giải"}], "tw": "be punished for", "ipa": "/ˈpʌnɪʃt/"}, {"type": "tx", "ctx": "Fill the gap", "s": "Our teacher made us ___ after the lesson because half of the class had not finished the homework again.", "acc": ["stay behind", "stayed behind", "stays behind", "staying behind"], "vi": "Cô giáo bắt chúng tôi ở lại sau giờ học vì một nửa lớp lại chưa làm xong bài tập.", "why": "stay behind = ở lại sau khi những người khác đã rời đi; quá khứ stayed behind.", "hint": "Nghĩa: ở lại sau khi người khác đã về", "new": [{"w": "homework", "vi": "bài tập về nhà"}, {"w": "again", "vi": "lần nữa"}], "tw": "stay behind", "ipa": "/ˌsteɪ bɪˈhaɪnd/"}, {"type": "tx", "ctx": "Fill the gap", "s": "When I was young, I often ___ talking in class, and my teacher wrote a note to my parents almost every week.", "acc": ["get into trouble for", "got into trouble for", "getting into trouble for", "gets into trouble for", "get into trouble"], "vi": "Hồi nhỏ, tôi thường bị khiển trách vì nói chuyện trong lớp, và cô giáo viết giấy báo cho bố mẹ gần như mỗi tuần.", "why": "get into trouble (for + V-ing) = bị rầy la, gặp rắc rối vì làm gì.", "hint": "Nghĩa: bị khiển trách, gặp rắc rối (vì làm gì)", "new": [{"w": "note", "vi": "giấy nhắn"}, {"w": "almost", "vi": "gần như"}], "tw": "get into trouble for", "ipa": "/ɡet ˈɪntə ˈtrʌbl/"}, {"type": "tx", "ctx": "Fill the gap", "s": "The hotel was ___ cheap for a seaside resort in July, so we stayed an extra night and explored the nearby villages.", "acc": ["reasonably"], "vi": "Khách sạn khá rẻ so với một khu nghỉ dưỡng ven biển vào tháng Bảy, nên chúng tôi ở thêm một đêm và khám phá các làng gần đó.", "why": "reasonably + tính từ = khá, tương đối (mức vừa phải); khác with reason.", "hint": "Nghĩa: khá, tương đối", "new": [{"w": "seaside resort", "vi": "khu nghỉ ven biển"}, {"w": "explored", "vi": "khám phá"}], "tw": "reasonably", "ipa": "/ˈriːznəbli/"}]}, {"id": "s2", "title": "Chọn từ", "note": "Chọn từ hoặc cụm đúng nhất cho chỗ trống; bấm lựa chọn để nghe phát âm.", "qs": [{"type": "mc", "ctx": "Choose the word", "s": "Research suggests that many lifelong habits, such as regular exercise, are easier to build ___, when the brain is still developing quickly.", "o": ["in your eighties", "in your infancy", "in your teens"], "a": "in your teens", "vi": "Nghiên cứu cho thấy nhiều thói quen suốt đời, như tập thể dục đều đặn, dễ hình thành hơn ở tuổi thiếu niên, khi não vẫn phát triển nhanh.", "why": "in your teens = ở tuổi 13–19; đổi your theo chủ ngữ (in her/his/my teens).", "new": [{"w": "lifelong", "vi": "suốt đời"}, {"w": "developing", "vi": "đang phát triển"}], "tw": "in your teens"}, {"type": "mc", "ctx": "Choose the word", "s": "The hospital has opened a new ward where women who are about to ___ can receive extra care, so they feel less stressed.", "o": ["get divorced", "give birth", "take exams"], "a": "give birth", "vi": "Bệnh viện mở một khoa mới nơi phụ nữ sắp sinh con có thể được chăm sóc thêm để bớt căng thẳng.", "why": "give birth (to sb) = sinh con; chia động từ give: gave, giving.", "new": [{"w": "ward", "vi": "khoa/phòng bệnh"}, {"w": "extra", "vi": "thêm"}], "tw": "give birth"}, {"type": "mc", "ctx": "Choose the word", "s": "Students who ___ before an exam often find it hard to concentrate, which means they may forget what they studied.", "o": ["have a late night", "have an early night", "have a quick wash"], "a": "have a late night", "vi": "Sinh viên thức khuya trước kỳ thi thường khó tập trung, nghĩa là họ có thể quên điều đã học.", "why": "have a late night = đi ngủ rất muộn (thường vì tiệc, làm việc); đối lập have an early night.", "new": [{"w": "concentrate", "vi": "tập trung"}, {"w": "exam", "vi": "kỳ thi"}], "tw": "have a late night"}, {"type": "mc", "ctx": "Choose the word", "s": "The doctor told him to ___ every day during the busy season, otherwise his headaches would probably get worse.", "o": ["have an early night", "do the ironing", "go via Hue"], "a": "have an early night", "vi": "Bác sĩ bảo anh ấy đi ngủ sớm mỗi ngày trong mùa bận rộn, nếu không chứng đau đầu có thể nặng hơn.", "why": "have an early night = đi ngủ sớm hơn thường lệ để nghỉ ngơi.", "new": [{"w": "season", "vi": "mùa"}, {"w": "headaches", "vi": "chứng đau đầu"}], "tw": "have an early night"}, {"type": "mc", "ctx": "Choose the word", "s": "Some companies encourage workers to ___ during the day because a short rest can improve concentration in the afternoon.", "o": ["feed the cat", "have a shave", "have a sleep"], "a": "have a sleep", "vi": "Một số công ty khuyến khích nhân viên ngủ một giấc ngắn ban ngày vì nghỉ ngơi ngắn có thể cải thiện sự tập trung buổi chiều.", "why": "have a sleep = ngủ một giấc (ngắn), thân mật, gần nghĩa have a nap.", "new": [{"w": "encourage", "vi": "khuyến khích"}, {"w": "improve", "vi": "cải thiện"}], "tw": "have a sleep"}, {"type": "mc", "ctx": "Choose the word", "s": "Drivers who feel tired should stop and rest, because it is very dangerous to ___ at the wheel on a motorway.", "o": ["fall asleep", "get lost", "break up"], "a": "fall asleep", "vi": "Tài xế thấy mệt nên dừng lại nghỉ vì ngủ gật khi lái xe trên đường cao tốc rất nguy hiểm.", "why": "fall asleep = bắt đầu ngủ, thiếp đi (không chủ ý); quá khứ fell asleep.", "new": [{"w": "wheel", "vi": "vô lăng"}, {"w": "dangerous", "vi": "nguy hiểm"}], "tw": "fall asleep"}, {"type": "mc", "ctx": "Choose the word", "s": "Nutritionists say that people who work at a desk should___, otherwise they may feel sleepy and slow in the afternoon.", "o": ["have a light lunch", "have a shave", "do the shopping"], "a": "have a light lunch", "vi": "Chuyên gia dinh dưỡng nói người làm việc bàn giấy nên ăn trưa nhẹ, nếu không họ có thể buồn ngủ và chậm chạp buổi chiều.", "why": "have a light lunch = ăn bữa trưa nhẹ (ít món, dễ tiêu).", "new": [{"w": "nutritionists", "vi": "chuyên gia dinh dưỡng"}, {"w": "sleepy", "vi": "buồn ngủ"}], "tw": "have a light lunch"}, {"type": "mc", "ctx": "Choose the word", "s": "Although the instructions were on the table, most customers didn't ___ them, which is why the machine kept breaking down.", "o": ["bother with read", "bother to read", "bother in reading"], "a": "bother to read", "vi": "Dù hướng dẫn nằm trên bàn, hầu hết khách hàng không buồn đọc chúng, vì vậy máy cứ hỏng liên tục.", "why": "bother to + V = chịu khó/mất công làm gì; thường dùng phủ định (didn't bother to...).", "new": [{"w": "instructions", "vi": "hướng dẫn"}, {"w": "break down", "vi": "hỏng"}], "tw": "bother to read"}, {"type": "mc", "ctx": "Choose the word", "s": "After the football match, the whole team decided to___, because every restaurant nearby was already full.", "o": ["do the washing", "stay behind", "order a takeaway"], "a": "order a takeaway", "vi": "Sau trận bóng đá, cả đội quyết định gọi đồ ăn mang về vì mọi nhà hàng gần đó đã kín chỗ.", "why": "order a takeaway = gọi món mang về (BrE); takeaway là danh từ đếm được.", "new": [{"w": "match", "vi": "trận đấu"}, {"w": "nearby", "vi": "gần đó"}], "tw": "order a takeaway"}, {"type": "mc", "ctx": "Choose the word", "s": "The farmer gets up at five o'clock to ___ the animals, which means he rarely has time for a proper breakfast himself.", "o": ["iron", "wash", "feed"], "a": "feed", "vi": "Người nông dân dậy lúc năm giờ để cho gia súc ăn, nghĩa là bản thân ông hiếm khi có thời gian ăn sáng tử tế.", "why": "feed (sb/an animal) = cho ăn; quá khứ fed.", "new": [{"w": "farmer", "vi": "nông dân"}, {"w": "rarely", "vi": "hiếm khi"}], "tw": "feed"}, {"type": "mc", "ctx": "Choose the word", "s": "If you're in a hurry in the morning, you can just ___ and put on clean clothes instead of taking a long shower.", "o": ["have a sleep", "have a quick wash", "do the ironing"], "a": "have a quick wash", "vi": "Nếu buổi sáng vội, bạn có thể chỉ rửa ráy nhanh rồi mặc quần áo sạch thay vì tắm lâu.", "why": "have a quick wash = rửa mặt tay chân nhanh, không tắm kỹ.", "new": [{"w": "in a hurry", "vi": "vội"}, {"w": "shower", "vi": "vòi sen/tắm"}], "tw": "have a quick wash"}, {"type": "mc", "ctx": "Choose the word", "s": "Before the wedding photos, the groom had to ___ because his beard had grown during the busy week.", "o": ["have a shave", "take a sleep", "feed the cat"], "a": "have a shave", "vi": "Trước khi chụp ảnh cưới, chú rể phải cạo râu vì râu đã mọc dài trong tuần bận rộn.", "why": "have a shave = cạo râu/cạo mặt; shave còn là danh từ.", "new": [{"w": "groom", "vi": "chú rể"}, {"w": "beard", "vi": "râu"}], "tw": "have a shave"}, {"type": "mc", "ctx": "Choose the word", "s": "On sunny days, many families prefer to ___ in the morning so that the clothes can dry quickly in the garden.", "o": ["do the shopping", "do the ironing", "do the washing"], "a": "do the washing", "vi": "Vào ngày nắng, nhiều gia đình thích giặt quần áo vào buổi sáng để đồ khô nhanh ngoài vườn.", "why": "do the washing = giặt đồ (BrE); khác do the washing-up (rửa bát).", "new": [{"w": "prefer", "vi": "thích hơn"}, {"w": "garden", "vi": "vườn"}], "tw": "do the washing"}, {"type": "mc", "ctx": "Choose the word", "s": "If you don't want to___, you can hang your clothes in the bathroom while you take a hot shower, and the steam will smooth them.", "o": ["do the washing", "do the ironing", "have a shave"], "a": "do the ironing", "vi": "Nếu không muốn là quần áo, bạn có thể treo đồ trong phòng tắm lúc tắm nước nóng, hơi nước sẽ làm phẳng vải.", "why": "do the ironing = là/ủi quần áo.", "new": [{"w": "steam", "vi": "hơi nước"}, {"w": "smooth", "vi": "làm phẳng"}], "tw": "do the ironing"}, {"type": "mc", "ctx": "Choose the word", "s": "Many people now ___ online because it saves time, although some still enjoy walking around the market and choosing fresh food.", "o": ["do the washing", "do the shopping", "stay in"], "a": "do the shopping", "vi": "Nhiều người giờ mua sắm đồ thiết yếu trực tuyến vì tiết kiệm thời gian, dù vài người vẫn thích đi chợ và chọn thực phẩm tươi.", "why": "do the shopping = đi chợ/siêu thị mua đồ thiết yếu.", "new": [{"w": "saves", "vi": "tiết kiệm"}, {"w": "still", "vi": "vẫn"}], "tw": "do the shopping"}, {"type": "mc", "ctx": "Choose the word", "s": "Because of the heavy pollution, the government advised residents to ___ and keep their windows closed until the air improved.", "o": ["go on", "break up", "stay in"], "a": "stay in", "vi": "Vì ô nhiễm nặng, chính phủ khuyên cư dân ở trong nhà và đóng cửa sổ cho đến khi không khí khá hơn.", "why": "stay in = ở nhà, không đi chơi; đối lập go out.", "new": [{"w": "pollution", "vi": "ô nhiễm"}, {"w": "residents", "vi": "cư dân"}], "tw": "stay in"}, {"type": "mc", "ctx": "Choose the word", "s": "The wind was strong on the mountain, so the guide told everyone to ___ their coats properly before climbing higher.", "o": ["take off", "do up", "undo"], "a": "do up", "vi": "Gió trên núi rất mạnh nên hướng dẫn viên bảo mọi người cài kín áo khoác trước khi leo cao hơn.", "why": "do up a zip/button = kéo khóa, cài cúc; trái nghĩa undo.", "new": [{"w": "guide", "vi": "hướng dẫn viên"}, {"w": "properly", "vi": "cẩn thận/đúng cách"}], "tw": "do up"}, {"type": "mc", "ctx": "Choose the word", "s": "After the long hike, the tired travellers sat down, took a deep breath, and began to ___ their heavy boots.", "o": ["do up", "undo", "put on"], "a": "undo", "vi": "Sau chuyến đi bộ dài, các du khách mệt mỏi ngồi xuống, hít sâu và bắt đầu cởi dây giày ủng nặng nề.", "why": "undo a zip/button = mở khóa kéo, cởi cúc; quá khứ undid.", "new": [{"w": "hike", "vi": "chuyến đi bộ đường dài"}, {"w": "boots", "vi": "giày ủng"}], "tw": "undo"}, {"type": "mc", "ctx": "Choose the word", "s": "Fashion experts say that people with dark hair usually ___ bright colours, whereas pale shades may make them look tired.", "o": ["look good in", "look good at", "look good with"], "a": "look good in", "vi": "Chuyên gia thời trang nói người tóc đen thường mặc màu sáng trông đẹp, trong khi tông nhạt có thể khiến họ trông mệt mỏi.", "why": "look good in + quần áo/màu sắc = mặc/đội trông đẹp.", "new": [{"w": "fashion", "vi": "thời trang"}, {"w": "shades", "vi": "tông màu"}], "tw": "look good in"}, {"type": "mc", "ctx": "Choose the word", "s": "Short hair really ___ her because it shows her face clearly, whereas long hair used to hide her eyes.", "o": ["suits", "fits", "matches"], "a": "suits", "vi": "Tóc ngắn thực sự hợp với cô vì nó lộ rõ khuôn mặt, trong khi tóc dài từng che mắt cô.", "why": "sth suits sb = cái gì hợp với ai (không dùng bị động); suit khác fit (vừa kích cỡ).", "new": [{"w": "clearly", "vi": "rõ ràng"}, {"w": "hide", "vi": "che giấu"}], "tw": "suits"}, {"type": "mc", "ctx": "Choose the word", "s": "If the dress is the wrong size, you can return it to the shop and ___ as long as you still have the receipt.", "o": ["get a discount", "get a receipt", "get a refund"], "a": "get a refund", "vi": "Nếu váy sai kích cỡ, bạn có thể trả lại cửa hàng và được hoàn tiền miễn là còn hóa đơn.", "why": "get a refund = được trả lại tiền (khi hủy, hàng lỗi).", "new": [{"w": "receipt", "vi": "hóa đơn"}, {"w": "as long as", "vi": "miễn là"}], "tw": "get a refund", "ipa": "/ɡet ə ˈriː.fʌnd/"}, {"type": "mc", "ctx": "Choose the word", "s": "The chef soaked the ___ overnight so that they would become soft enough to cook in the soup the next day.", "o": ["beans", "lettuce", "peas"], "a": "beans", "vi": "Đầu bếp ngâm đậu qua đêm để hôm sau chúng đủ mềm để nấu trong món súp.", "why": "beans = đậu hạt (đậu đỏ, đậu đen, đậu nành); số nhiều.", "new": [{"w": "soaked", "vi": "ngâm"}, {"w": "overnight", "vi": "qua đêm"}], "tw": "beans", "ipa": "/biːnz/"}, {"type": "mc", "ctx": "Choose the word", "s": "Frozen ___ are very convenient because they keep their sweet taste and bright green colour for several months.", "o": ["peas", "beans", "radishes"], "a": "peas", "vi": "Đậu Hà Lan đông lạnh rất tiện vì giữ được vị ngọt và màu xanh tươi trong nhiều tháng.", "why": "peas = đậu Hà Lan (hạt tròn xanh nhỏ).", "new": [{"w": "frozen", "vi": "đông lạnh"}, {"w": "convenient", "vi": "tiện lợi"}], "tw": "peas", "ipa": "/piːz/"}, {"type": "mc", "ctx": "Choose the word", "s": "To keep ___ fresh for a week, wrap it in a paper towel and store it in the fridge, otherwise it quickly turns brown.", "o": ["asparagus", "celery", "lettuce"], "a": "lettuce", "vi": "Để xà lách tươi một tuần, hãy bọc nó trong khăn giấy và để trong tủ lạnh, nếu không nó nhanh chóng chuyển nâu.", "why": "lettuce = xà lách (danh từ không đếm được).", "new": [{"w": "wrap", "vi": "bọc"}, {"w": "turns brown", "vi": "ngả nâu"}], "tw": "lettuce", "ipa": "/ˈlet̬.ɪs/"}, {"type": "mc", "ctx": "Choose the word", "s": "In New York, my cousin ordered a sandwich filled with grilled ___ and cheese, and she said it was surprisingly tasty.", "o": ["eggplant", "courgette", "kohlrabi"], "a": "eggplant", "vi": "Ở New York, em họ tôi gọi một chiếc sandwich nhân cà tím nướng và phô mai, và nói nó ngon bất ngờ.", "why": "eggplant = cà tím (AmE); BrE là aubergine.", "new": [{"w": "filled with", "vi": "nhân/chứa đầy"}, {"w": "surprisingly", "vi": "một cách bất ngờ"}], "tw": "eggplant", "ipa": "/ˈeɡ.plænt/"}, {"type": "mc", "ctx": "Choose the word", "s": "A London chef taught us to roast the ___ until the skin becomes black, so that the inside turns soft and smoky.", "o": ["loofah", "zucchini", "aubergine"], "a": "aubergine", "vi": "Một đầu bếp ở London dạy chúng tôi nướng cà tím cho đến khi vỏ đen, để phần ruột mềm và thơm khói.", "why": "aubergine = cà tím (BrE); AmE là eggplant.", "new": [{"w": "roast", "vi": "nướng lò"}, {"w": "smoky", "vi": "có mùi khói"}], "tw": "aubergine", "ipa": "/ˈəʊbərʒiːn/"}, {"type": "mc", "ctx": "Choose the word", "s": "Because it grows so quickly, a ___ is a good choice for beginners who want to see results in their small garden.", "o": ["pumpkin", "bamboo shoot", "radish"], "a": "radish", "vi": "Vì lớn rất nhanh, củ cải đỏ là lựa chọn tốt cho người mới muốn thấy kết quả trong khu vườn nhỏ.", "why": "radish = củ cải nhỏ, thường đỏ, vị hăng nhẹ (khác daikon là củ cải trắng to).", "new": [{"w": "beginners", "vi": "người mới bắt đầu"}, {"w": "results", "vi": "kết quả"}], "tw": "radish", "ipa": "/ˈræd.ɪʃ/"}, {"type": "mc", "ctx": "Choose the word", "s": "The Japanese restaurant served grilled fish with grated ___, which helps to balance the oily taste of the dish.", "o": ["daikon", "celery", "radish"], "a": "daikon", "vi": "Nhà hàng Nhật dọn cá nướng với củ cải trắng bào, giúp cân bằng vị béo của món ăn.", "why": "daikon = củ cải trắng to, dài (từ tiếng Nhật).", "new": [{"w": "grated", "vi": "bào/nạo"}, {"w": "balance", "vi": "cân bằng"}], "tw": "daikon", "ipa": "/ˈdaɪkɑːn/"}, {"type": "mc", "ctx": "Choose the word", "s": "If you grate a ___ and squeeze out the water, you can mix it into pasta sauce without changing the flavour much.", "o": ["courgette", "bean sprouts", "chayote"], "a": "courgette", "vi": "Nếu bào bí ngòi và vắt bớt nước, bạn có thể trộn vào sốt mì mà không đổi vị nhiều.", "why": "courgette = bí ngòi (BrE); AmE là zucchini.", "new": [{"w": "grate", "vi": "bào"}, {"w": "squeeze", "vi": "vắt"}], "tw": "courgette", "ipa": "/kʊrˈʒet/"}, {"type": "mc", "ctx": "Choose the word", "s": "At the farmers' market in California, we bought some ___ and tomatoes to make a quick summer vegetable soup.", "o": ["aubergine", "asparagus", "zucchini"], "a": "zucchini", "vi": "Ở chợ nông sản California, chúng tôi mua ít bí ngòi và cà chua để nấu nhanh súp rau mùa hè.", "why": "zucchini = bí ngòi (AmE) = courgette (BrE).", "new": [{"w": "farmers' market", "vi": "chợ nông sản"}, {"w": "quick", "vi": "nhanh"}], "tw": "zucchini", "ipa": "/zuˈkiː.ni/"}, {"type": "mc", "ctx": "Choose the word", "s": "Children who dislike spicy food usually prefer a ___, which is large and sweet, to a small hot pepper.", "o": ["radish", "chilli pepper", "bell pepper"], "a": "bell pepper", "vi": "Trẻ em không thích đồ cay thường thích ớt chuông, to và ngọt, hơn ớt cay nhỏ.", "why": "bell pepper = ớt chuông, to, ngọt, không cay.", "new": [{"w": "spicy", "vi": "cay"}, {"w": "prefer", "vi": "thích hơn"}], "tw": "bell pepper", "ipa": "/ˈpep.ɚ/"}, {"type": "mc", "ctx": "Choose the word", "s": "The chef wore gloves while cutting the ___, since the oil from the seeds burns the skin and eyes.", "o": ["bell pepper", "chilli pepper", "zucchini"], "a": "chilli pepper", "vi": "Đầu bếp đeo găng khi cắt ớt cay vì dầu từ hạt làm bỏng da và mắt.", "why": "chilli pepper = ớt cay (nhỏ, cay nóng); khác bell pepper.", "new": [{"w": "gloves", "vi": "găng tay"}, {"w": "seeds", "vi": "hạt"}], "tw": "chilli pepper", "ipa": "/ˈpep.ɚ/"}, {"type": "mc", "ctx": "Choose the word", "s": "Her grandmother's chicken soup tastes sweeter because she adds ___, which becomes soft but does not fall apart.", "o": ["chayote", "barley", "eggplant"], "a": "chayote", "vi": "Món canh gà của bà ngọt hơn vì bà thêm su su, thứ mềm đi nhưng không nát.", "why": "chayote = su su (quả xanh, dùng xào/nấu canh).", "new": [{"w": "falls apart", "vi": "nát ra"}, {"w": "sweeter", "vi": "ngọt hơn"}], "tw": "chayote", "ipa": "/tʃaɪˈoʊ.t̬i/"}, {"type": "mc", "ctx": "Choose the word", "s": "The waiter recommended the ___ because it is in season, thin and tender, and goes well with fish.", "o": ["asparagus", "bean sprouts", "kohlrabi"], "a": "asparagus", "vi": "Người phục vụ gợi ý măng tây vì đang vào mùa, mảnh và mềm, hợp với cá.", "why": "asparagus = măng tây (không đếm được).", "new": [{"w": "in season", "vi": "đang vào mùa"}, {"w": "recommended", "vi": "gợi ý"}], "tw": "asparagus", "ipa": "/əˈsper.ə.ɡəs/"}, {"type": "mc", "ctx": "Choose the word", "s": "Because they are crunchy and cheap, ___ are often added to spring rolls and stir-fried dishes in Vietnam.", "o": ["chilli peppers", "bean sprouts", "bell peppers"], "a": "bean sprouts", "vi": "Vì giòn và rẻ, giá đỗ thường được thêm vào gỏi cuốn và món xào ở Việt Nam.", "why": "bean sprouts = giá đỗ (luôn số nhiều).", "new": [{"w": "crunchy", "vi": "giòn"}, {"w": "stir-fried", "vi": "xào"}], "tw": "bean sprouts", "ipa": "/ˈbiːn spraʊts/"}, {"type": "mc", "ctx": "Choose the word", "s": "People on a diet often snack on ___ sticks, which are crunchy and have almost no calories, instead of eating biscuits.", "o": ["celery", "loofah", "lettuce"], "a": "celery", "vi": "Người ăn kiêng thường ăn vặt bằng thanh cần tây, giòn và gần như không calo, thay vì ăn bánh quy.", "why": "celery = cần tây (thân dài, giòn, hương thơm đặc trưng).", "new": [{"w": "snack", "vi": "ăn vặt"}, {"w": "diet", "vi": "chế độ ăn kiêng"}], "tw": "celery", "ipa": "/ˈsel.ɚ.i/"}, {"type": "mc", "ctx": "Choose the word", "s": "The shop assistant explained that ___ looks like a round green ball, but its taste is similar to cabbage and is very mild.", "o": ["daikon", "celery", "kohlrabi"], "a": "kohlrabi", "vi": "Nhân viên cửa hàng giải thích su hào trông như quả cầu xanh nhưng vị giống bắp cải và rất dịu.", "why": "kohlrabi = su hào (củ tròn, vị giống cải bắp).", "new": [{"w": "similar to", "vi": "tương tự"}, {"w": "cabbage", "vi": "bắp cải"}], "tw": "kohlrabi", "ipa": "/ˌkoʊlˈrɑː.bi/"}, {"type": "mc", "ctx": "Choose the word", "s": "When the fruit becomes old and dry, people remove the skin and use the fibres inside as a ___ for washing dishes.", "o": ["loofah", "chayote", "celery"], "a": "loofah", "vi": "Khi quả già và khô, người ta bóc vỏ và dùng xơ bên trong làm xơ mướp rửa bát.", "why": "loofah = quả mướp; mướp già làm xơ mướp để kỳ cọ.", "new": [{"w": "fibres", "vi": "xơ"}, {"w": "remove", "vi": "bóc/loại bỏ"}], "tw": "loofah", "ipa": "/ˈluː.fə/"}, {"type": "mc", "ctx": "Choose the word", "s": "The recipe says to pour the sauce over the pasta ___, otherwise the noodles will absorb it and become heavy.", "o": ["just after serving", "long before cooking", "just before serving"], "a": "just before serving", "vi": "Công thức bảo rưới sốt lên mì ống ngay trước khi dọn, nếu không sợi mì sẽ thấm hết sốt và nặng nề.", "why": "just before serving = ngay trước khi dọn ra ăn.", "new": [{"w": "pour", "vi": "rưới"}, {"w": "absorb", "vi": "thấm"}], "tw": "just before serving"}, {"type": "mc", "ctx": "Choose the word", "s": "Although canned food is cheaper, most chefs insist on using ___ because the taste and texture are much better.", "o": ["dried noodles", "fresh vegetables", "frozen fish"], "a": "fresh vegetables", "vi": "Dù đồ hộp rẻ hơn, hầu hết đầu bếp vẫn khăng khăng dùng rau củ tươi vì hương vị và kết cấu ngon hơn nhiều.", "why": "fresh vegetables = rau củ tươi (không phải đông lạnh/đóng hộp).", "new": [{"w": "canned", "vi": "đóng hộp"}, {"w": "insist", "vi": "khăng khăng"}], "tw": "fresh vegetables", "ipa": "/freʃ ˈvedʒ.tə.bəlz/"}, {"type": "mc", "ctx": "Choose the word", "s": "After my doctor warned me about my diet, I began adding ___ to every meal instead of relying on rice and meat.", "o": ["red meat", "green vegetables", "sweet drinks"], "a": "green vegetables", "vi": "Sau khi bác sĩ cảnh báo về chế độ ăn, tôi bắt đầu thêm rau xanh vào mỗi bữa thay vì chỉ dựa vào cơm và thịt.", "why": "green vegetables = rau xanh (rau lá, bông cải xanh...).", "new": [{"w": "warned", "vi": "cảnh báo"}, {"w": "relying on", "vi": "dựa vào"}], "tw": "green vegetables", "ipa": "/ɡriːn ˈvedʒ.tə.bəlz/"}, {"type": "mc", "ctx": "Choose the word", "s": "A balanced diet should include ___, since each colour provides different nutrients that the body needs.", "o": ["a wide range of vegetables", "a small number of eggs", "a heavy bag of rice"], "a": "a wide range of vegetables", "vi": "Chế độ ăn cân bằng nên gồm nhiều loại rau củ đa dạng, vì mỗi màu cung cấp chất dinh dưỡng khác nhau mà cơ thể cần.", "why": "a wide range of + N = nhiều loại N đa dạng.", "new": [{"w": "balanced", "vi": "cân bằng"}, {"w": "nutrients", "vi": "chất dinh dưỡng"}], "tw": "a wide range of vegetables", "ipa": "/ə waɪd reɪndʒ əv ˈvedʒ.tə.bəlz/"}, {"type": "mc", "ctx": "Choose the word", "s": "You should ___ with a sharp knife, because a dull one can slip and injure your fingers.", "o": ["slice vegetables", "wash vegetables", "grow vegetables"], "a": "slice vegetables", "vi": "Bạn nên thái rau củ bằng dao sắc, vì dao cùn có thể trượt và làm bị thương ngón tay.", "why": "slice vegetables = thái thành lát mỏng (khác chop = băm/cắt nhỏ).", "new": [{"w": "dull", "vi": "cùn"}, {"w": "slip", "vi": "trượt"}], "tw": "slice vegetables", "ipa": "/slaɪs ˈvedʒ.tə.bəlz/"}, {"type": "mc", "ctx": "Choose the word", "s": "In the restaurant kitchen, a young assistant spends the first hour of every day learning to ___ quickly and safely.", "o": ["fry vegetables", "taste vegetables", "chop vegetables"], "a": "chop vegetables", "vi": "Trong bếp nhà hàng, một phụ bếp trẻ dành giờ đầu mỗi ngày học cách thái rau củ nhanh và an toàn.", "why": "chop vegetables = cắt/băm rau củ thành miếng nhỏ (nhanh, không cần đều).", "new": [{"w": "assistant", "vi": "phụ bếp"}, {"w": "safely", "vi": "an toàn"}], "tw": "chop vegetables", "ipa": "/tʃɑːp ˈvedʒ.tə.bəlz/"}, {"type": "mc", "ctx": "Choose the word", "s": "Before barbecuing, the butcher advised us to ___ of about the same size, so that all the meat would be cooked evenly.", "o": ["cut the meat into pieces", "cut the meat on pieces", "cut the meat out of pieces"], "a": "cut the meat into pieces", "vi": "Trước khi nướng, người bán thịt khuyên chúng tôi cắt thịt thành các miếng cỡ gần bằng nhau để tất cả chín đều.", "why": "cut sth into pieces = cắt cái gì thành từng miếng; into + kết quả.", "new": [{"w": "butcher", "vi": "người bán thịt"}, {"w": "barbecuing", "vi": "nướng BBQ"}], "tw": "cut the meat into pieces"}, {"type": "mc", "ctx": "Choose the word", "s": "Although supermarkets are convenient, I prefer buying from ___ in the old market because the sellers know their customers well.", "o": ["a vegetable factory", "a vegetable stall", "a vegetable library"], "a": "a vegetable stall", "vi": "Dù siêu thị tiện, tôi thích mua ở sạp rau trong chợ cũ hơn vì người bán biết rõ khách của mình.", "why": "a vegetable stall = quầy/sạp bán rau (ở chợ, bên đường).", "new": [{"w": "convenient", "vi": "tiện lợi"}, {"w": "sellers", "vi": "người bán"}], "tw": "a vegetable stall"}, {"type": "mc", "ctx": "Choose the word", "s": "Before cooking, you should throw away any ___ that stay open when tapped, because they may be unsafe to eat.", "o": ["scallops", "mussels", "peas"], "a": "mussels", "vi": "Trước khi nấu, bạn nên bỏ những con vẹm vẫn mở khi gõ vào, vì ăn có thể không an toàn.", "why": "mussel = con trai/vẹm (vỏ đen, ăn được); số nhiều mussels.", "new": [{"w": "tapped", "vi": "được gõ"}, {"w": "unsafe", "vi": "không an toàn"}], "tw": "mussels"}, {"type": "mc", "ctx": "Choose the word", "s": "Because they are expensive, ___ are usually served in small portions as a starter in high-class restaurants.", "o": ["beans", "mussels", "scallops"], "a": "scallops", "vi": "Vì đắt, sò điệp thường được dọn phần nhỏ làm món khai vị ở nhà hàng cao cấp.", "why": "scallop = sò điệp (vỏ quạt, thịt trắng mềm, đắt).", "new": [{"w": "starter", "vi": "món khai vị"}, {"w": "portions", "vi": "phần ăn"}], "tw": "scallops"}, {"type": "mc", "ctx": "Choose the word", "s": "The photographer waited for an hour until the sun was ___, and the picture of the lake was absolutely stunning.", "o": ["in the wrong mood", "on the next page", "in the right spot"], "a": "in the right spot", "vi": "Nhiếp ảnh gia chờ một tiếng cho đến khi mặt trời ở đúng vị trí, và bức ảnh hồ thật tuyệt đẹp.", "why": "in the right spot = ở đúng chỗ, đúng vị trí.", "new": [{"w": "photographer", "vi": "nhiếp ảnh gia"}, {"w": "stunning", "vi": "tuyệt đẹp"}], "tw": "in the right spot", "ipa": "/ɪn ðə raɪt spɒt/"}, {"type": "mc", "ctx": "Choose the word", "s": "My grandmother cooks a warming soup with ___ and beef, which she says is perfect for cold, rainy evenings.", "o": ["lettuce", "barley", "asparagus"], "a": "barley", "vi": "Bà tôi nấu món súp ấm với lúa mạch và thịt bò, bà nói rất hợp những buổi tối mưa lạnh.", "why": "barley = lúa mạch, ngũ cốc dùng nấu ăn, làm bia.", "new": [{"w": "warming", "vi": "làm ấm"}, {"w": "beef", "vi": "thịt bò"}], "tw": "barley", "ipa": "/ˈbɑː.li/"}, {"type": "mc", "ctx": "Choose the word", "s": "The tourists complained that ___ in the village after dark, so most of them returned to the city the same day.", "o": ["there isn't much to eat", "there isn't much to see on it", "there isn't much to do"], "a": "there isn't much to do", "vi": "Du khách phàn nàn rằng ở làng sau khi trời tối không có nhiều thứ để làm, nên hầu hết quay về thành phố ngay trong ngày.", "why": "There isn't much to do (in/at...) = không có nhiều thứ để làm/giải trí.", "new": [{"w": "complained", "vi": "phàn nàn"}, {"w": "after dark", "vi": "sau khi trời tối"}], "tw": "there isn't much to do", "ipa": "/ðeər ˈɪz.ənt mʌtʃ tə duː/"}, {"type": "mc", "ctx": "Choose the word", "s": "Early treatment is important for people who ___ a serious illness, because it can improve their chances of recovery.", "o": ["are recovered from", "are convinced by", "are diagnosed with"], "a": "are diagnosed with", "vi": "Điều trị sớm rất quan trọng với người được chẩn đoán mắc bệnh nặng, vì nó có thể tăng cơ hội hồi phục.", "why": "be diagnosed with + bệnh = được chẩn đoán mắc bệnh (bị động).", "new": [{"w": "treatment", "vi": "điều trị"}, {"w": "recovery", "vi": "hồi phục"}], "tw": "are diagnosed with"}, {"type": "mc", "ctx": "Choose the word", "s": "Salmon is considered a healthy food because it ___ omega-3, a fat that is good for the heart and the brain.", "o": ["is afraid of", "is short of", "is rich in"], "a": "is rich in", "vi": "Cá hồi được xem là thực phẩm tốt vì giàu omega-3, loại chất béo tốt cho tim và não.", "why": "be rich in + N = giàu (vitamin, chất dinh dưỡng); khác be rich (giàu tiền).", "new": [{"w": "salmon", "vi": "cá hồi"}, {"w": "considered", "vi": "được xem là"}], "tw": "is rich in"}, {"type": "mc", "ctx": "Choose the word", "s": "A serious accident closed part of the ___ last night, and thousands of drivers were stuck in a queue for hours.", "o": ["platform", "motorway", "pavement"], "a": "motorway", "vi": "Một vụ tai nạn nghiêm trọng đã đóng một đoạn đường cao tốc tối qua, và hàng nghìn tài xế mắc kẹt hàng giờ.", "why": "motorway = đường cao tốc (BrE); AmE là highway/freeway.", "new": [{"w": "queue", "vi": "hàng dài xe"}, {"w": "stuck", "vi": "mắc kẹt"}], "tw": "motorway", "ipa": "/ˈməʊtəweɪ/"}, {"type": "mc", "ctx": "Choose the word", "s": "The village is hidden at the end of a narrow ___, which is why very few tourists ever find it.", "o": ["side road", "bus station", "motorway"], "a": "side road", "vi": "Ngôi làng nằm ẩn ở cuối một con đường nhánh hẹp, vì thế rất ít du khách từng tìm thấy.", "why": "(turn onto) a side road = (rẽ vào) đường nhánh, đường nhỏ cắt từ đường chính.", "new": [{"w": "hidden", "vi": "ẩn"}, {"w": "narrow", "vi": "hẹp"}], "tw": "side road", "ipa": "/ˈsaɪd rəʊd/"}, {"type": "mc", "ctx": "Choose the word", "s": "Tourists in the mountains often ___ when fog comes down suddenly, so guides always carry a compass and a radio.", "o": ["get lost", "lose way", "get lose"], "a": "get lost", "vi": "Du khách trên núi thường bị lạc khi sương mù xuống đột ngột, nên hướng dẫn viên luôn mang la bàn và bộ đàm.", "why": "get lost = bị lạc đường; quá khứ got lost.", "new": [{"w": "fog", "vi": "sương mù"}, {"w": "compass", "vi": "la bàn"}], "tw": "get lost", "ipa": "/ˌɡet ˈlɒst/"}, {"type": "mc", "ctx": "Choose the word", "s": "The bus broke down ___ the airport, so several passengers missed their flights and had to wait for the next one.", "o": ["on its way to", "by way of", "at the way to"], "a": "on its way to", "vi": "Xe buýt hỏng trên đường tới sân bay nên vài hành khách lỡ chuyến bay và phải chờ chuyến sau.", "why": "on my way to + nơi = trên đường tới; đổi my theo chủ ngữ.", "new": [{"w": "broke down", "vi": "hỏng"}, {"w": "passengers", "vi": "hành khách"}], "tw": "on its way to"}, {"type": "mc", "ctx": "Choose the word", "s": "If you want to see the lake, you can ___ the northern route, although the road is narrower and the journey is slower.", "o": ["go off", "go via", "go on"], "a": "go via", "vi": "Nếu muốn ngắm hồ, bạn có thể đi qua tuyến phía bắc, dù đường hẹp hơn và chuyến đi chậm hơn.", "why": "go via + nơi = đi ngang qua nơi nào trên đường tới nơi khác.", "new": [{"w": "route", "vi": "tuyến đường"}, {"w": "narrower", "vi": "hẹp hơn"}], "tw": "go via", "ipa": "/ˈvaɪə/"}, {"type": "mc", "ctx": "Choose the word", "s": "In the dark, it is easy to miss the ___ to the farm, since there is no sign and the road looks the same.", "o": ["turning", "platform", "ticket"], "a": "turning", "vi": "Trong bóng tối, rất dễ bỏ lỡ ngã rẽ vào trang trại, vì không có biển báo và con đường nhìn giống nhau.", "why": "turning = chỗ rẽ, ngã rẽ (BrE); take the first/second turning.", "new": [{"w": "miss", "vi": "bỏ lỡ"}, {"w": "sign", "vi": "biển báo"}], "tw": "turning", "ipa": "/ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Choose the word", "s": "If drivers ___ near the airport, they can end up in a residential area with one-way streets and no parking.", "o": ["make the wrong decision", "take the wrong turning", "take the wrong ticket"], "a": "take the wrong turning", "vi": "Nếu tài xế rẽ nhầm đường gần sân bay, họ có thể lạc vào khu dân cư với đường một chiều và không có chỗ đỗ.", "why": "take the wrong turning = rẽ nhầm ngã; quá khứ took.", "new": [{"w": "residential area", "vi": "khu dân cư"}, {"w": "one-way", "vi": "một chiều"}], "tw": "take the wrong turning", "ipa": "/teɪk ðə rɒŋ ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Choose the word", "s": "If your phone battery dies in a foreign city, don't panic; you can simply ___, and most people will be happy to help.", "o": ["ask somebody about road", "ask somebody the way", "ask somebody for way"], "a": "ask somebody the way", "vi": "Nếu điện thoại hết pin ở thành phố lạ, đừng hoảng; bạn chỉ cần hỏi đường ai đó, và hầu hết mọi người sẵn lòng giúp.", "why": "ask somebody the way (to somewhere) = hỏi đường; chú ý: ask + người + the way.", "new": [{"w": "battery", "vi": "pin"}, {"w": "panic", "vi": "hoảng"}], "tw": "ask somebody the way", "ipa": "/ɑːsk ðə weɪ/"}, {"type": "mc", "ctx": "Choose the word", "s": "Volunteers wearing yellow jackets will ___ the temporary car park, so you don't need to worry about finding a space.", "o": ["lead visitors of", "direct visitors to", "explain visitors to"], "a": "direct visitors to", "vi": "Các tình nguyện viên mặc áo vàng sẽ chỉ khách tới bãi đỗ xe tạm thời, nên bạn không cần lo tìm chỗ.", "why": "direct sb to + nơi = chỉ đường cho ai tới đâu; directed (quá khứ).", "new": [{"w": "temporary", "vi": "tạm thời"}, {"w": "volunteers", "vi": "tình nguyện viên"}], "tw": "direct visitors to"}, {"type": "mc", "ctx": "Choose the word", "s": "The safest way to reach the hotel is to ___ the airport, because the road is well lit and there are fewer junctions.", "o": ["follow the signs to", "follow the maps of", "follow the signs from"], "a": "follow the signs to", "vi": "Cách an toàn nhất đến khách sạn là đi theo biển chỉ dẫn tới sân bay, vì đường sáng đèn và có ít ngã giao hơn.", "why": "follow (the) signs to + nơi = đi theo biển chỉ dẫn đến nơi đó.", "new": [{"w": "well lit", "vi": "sáng đèn"}, {"w": "junctions", "vi": "ngã giao"}], "tw": "follow the signs to"}, {"type": "mc", "ctx": "Choose the word", "s": "The passenger was injured when he tried to ___ the moving train, even though there was a clear warning on the door.", "o": ["step off", "step up", "step over"], "a": "step off", "vi": "Hành khách bị thương khi cố bước xuống khỏi chuyến tàu đang chạy, dù có cảnh báo rõ ràng trên cửa.", "why": "step off sth = bước xuống khỏi (vỉa hè, bậc, tàu); chú ý giới từ off.", "new": [{"w": "injured", "vi": "bị thương"}, {"w": "warning", "vi": "cảnh báo"}], "tw": "step off", "ipa": "/step ɒf/"}, {"type": "mc", "ctx": "Choose the word", "s": "Most players recover quickly from ___, such as a twisted ankle, but serious injuries can end a career.", "o": ["fatal accidents", "broken promises", "minor injuries"], "a": "minor injuries", "vi": "Hầu hết cầu thủ hồi phục nhanh sau thương tích nhẹ, như trật mắt cá, nhưng chấn thương nặng có thể kết thúc sự nghiệp.", "why": "a minor injury = thương tích nhẹ; minor = nhỏ, không nghiêm trọng.", "new": [{"w": "twisted ankle", "vi": "trật mắt cá"}, {"w": "career", "vi": "sự nghiệp"}], "tw": "minor injuries"}, {"type": "mc", "ctx": "Choose the word", "s": "If a laptop ___ in the rain, the repair shop may refuse to fix it, because the water can destroy the internal parts.", "o": ["is badly paid", "is badly designed", "is badly damaged"], "a": "is badly damaged", "vi": "Nếu laptop bị hư hại nặng dưới mưa, tiệm sửa có thể từ chối sửa vì nước có thể phá hỏng linh kiện bên trong.", "why": "be badly damaged = bị hư hại nặng (bị động); badly = nặng, tệ.", "new": [{"w": "refuse", "vi": "từ chối"}, {"w": "internal", "vi": "bên trong"}], "tw": "is badly damaged"}, {"type": "mc", "ctx": "Choose the word", "s": "We decided to ___ nursery school while we were both working, since our parents live too far away to help.", "o": ["send our child at", "send our child on", "send our child to"], "a": "send our child to", "vi": "Chúng tôi quyết định cho con đi nhà trẻ trong lúc cả hai đi làm, vì bố mẹ ở quá xa để giúp.", "why": "send somebody to school = cho ai đi học; cấu trúc send + người + to school.", "new": [{"w": "nursery school", "vi": "nhà trẻ"}, {"w": "far away", "vi": "ở xa"}], "tw": "send our child to"}, {"type": "mc", "ctx": "Choose the word", "s": "The law says that young people cannot ___ until they are sixteen, although some of them would like to start work earlier.", "o": ["leave a school bus", "leave school bags", "leave school"], "a": "leave school", "vi": "Luật nói người trẻ không được rời trường cho đến khi mười sáu tuổi, dù vài người muốn đi làm sớm hơn.", "why": "leave school = rời trường (kết thúc hoặc b lass to open their ___ books and solve ten problems about fractions before the break.", "o": ["maths", "geography", "history"], "a": "maths", "vi": "Cô giáo bảo cả lớp mở sách toán và giải mười bài về phân số trước giờ giải lao.", "why": "maths = môn toán (BrE; AmE là math).", "new": [{"w": "solve", "vi": "giải"}, {"w": "fractions", "vi": "phân số"}], "tw": "maths", "ipa": "/mæθs/"}, {"type": "mc", "ctx": "Choose the word", "s": "Researchers say that a short ___ between two difficult lessons helps students relax, so they can concentrate better afterwards.", "o": ["rule", "break", "fine"], "a": "break", "vi": "Các nhà nghiên cứu nói giờ giải lao ngắn giữa hai tiết khó giúp học sinh thư giãn, nên sau đó tập trung tốt hơn.", "why": "break (between lessons) = giờ ra chơi ngắn giữa các tiết; ngắn hơn lunch break.", "new": [{"w": "researchers", "vi": "nhà nghiên cứu"}, {"w": "afterwards", "vi": "sau đó"}], "tw": "break", "ipa": "/breɪk/"}, {"type": "mc", "ctx": "Choose the word", "s": "Some companies encourage staff to take a proper ___ away from their desks, because eating in front of a screen reduces productivity.", "o": ["coffee mug", "lunch break", "summer break"], "a": "lunch break", "vi": "Một số công ty khuyến khích nhân viên nghỉ trưa đúng nghĩa rời bàn làm việc, vì ăn trước màn hình làm giảm năng suất.", "why": "lunch break = giờ nghỉ trưa (ở trường, công ty).", "new": [{"w": "productivity", "vi": "năng suất"}, {"w": "screen", "vi": "màn hình"}], "tw": "lunch break", "ipa": "/ˈlʌntʃ breɪk/"}, {"type": "mc", "ctx": "Choose the word", "s": "Students must hand in their projects before the end of ___, otherwise they will lose marks and have to repeat the course.", "o": ["year", "week", "term"], "a": "term", "vi": "Sinh viên phải nộp dự án trước khi hết học kỳ, nếu không sẽ mất điểm và phải học lại môn.", "why": "term = học kỳ (BrE); một school year có ba terms.", "new": [{"w": "hand in", "vi": "nộp"}, {"w": "repeat", "vi": "học lại"}], "tw": "term", "ipa": "/tɜːm/"}, ately.", "o": ["reasonably", "barely", "hardly"], "a": "reasonably", "vi": "Dù căn hộ nhỏ, giá khá hợp lý cho trung tâm thành phố, vì vậy nó được thuê ngay lập tức.", "why": "reasonably + tính từ = khá, tương đối (mức vừa phải); khác with reason.", "new": [{"w": "priced", "vi": "được định giá"}, {"w": "rented", "vi": "được thuê"}], "tw": "reasonably", "ipa": "/ˈriːznəbli/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ hoặc cụm được hỏi ở cuối.", "qs": [{"type": "mc", "ctx": "Short reading", "s": "Many adults admit that they made their biggest mistakes in their teens. At that age, they cared more about their friends than about their exam results. What does “in your teens” mean?", "o": ["ở độ tuổi thiếu niên", "trong những năm đại học", "ở tuổi trung niên"], "a": "ở độ tuổi thiếu niên", "noblank": true, "say": "Many adults admit that they made their biggest mistakes in their teens. At that age, they cared more about their friends than about their exam results.", "vi": "Nhiều người trưởng thành thừa nhận họ mắc những sai lầm lớn nhất khi còn ở tuổi thiếu niên. Ở tuổi đó, họ quan tâm đến bạn bè hơn là kết quả thi.", "why": "in your teens = ở tuổi 13–19; đổi your theo chủ ngữ (in her/his/my teens).", "new": [{"w": "admit", "vi": "thừa nhận"}, {"w": "exam results", "vi": "kết quả thi"}], "tw": "in your teens"}, {"type": "mc", "ctx": "Short reading", "s": "Many women suffer from depression after giving birth. Doctors recommend that new mothers rest as much as possible and talk about their feelings with family. What does “give birth” mean?", "o": ["sinh con", "nhận nuôi trẻ em", "cai sữa cho em bé"], "a": "sinh con", "noblank": true, "say": "Many women suffer from depression after giving birth. Doctors recommend that new mothers rest as much as possible and talk about their feelings with family.", "vi": "Nhiều phụ nữ bị trầm cảm sau khi sinh con. Bác sĩ khuyên các bà mẹ mới nên nghỉ ngơi nhiều và chia sẻ cảm xúc với gia  "ngủ qua đêm", "ngủ một giấc ngắn"], "a": "ngủ một giấc ngắn", "noblank": true, "say": "It was a hot afternoon, and the baby was grumpy. His father put him in the cot so that he could have a sleep before the visitors arrived.", "vi": "Chiều nóng và em bé quấy khóc. Bố đặt bé vào cũi để bé ngủ một giấc ngắn trước khi khách đến.", "why": "have a sleep = ngủ một giấc (ngắn), thân mật, gần nghĩa have a nap.", "new": [{"w": "grumpy", "vi": "cáu kỉnh"}, {"w": "cot", "vi": "cũi"}], "tw": "have a sleep"}, {"type": "mc", "ctx": "Short reading", "s": "I was reading in bed when I suddenly fell asleep with the lamp still on. In the morning, my mother laughed because the book was lying on my face. What does “fall asleep” mean?", "o": ["đọc lướt qua", "ngủ thiếp đi", "tỉnh giấc"], "a": "ngủ thiếp đi", "noblank": true, "say": "I was reading in bed when I suddenly fell asleep with the lamp still on. In the morning, my mother laughed because the book was lying on my face.", "vi": "Tôi đang đọc sách trên giường thì bỗng ngủ thiếp đi khi đèn vẫn sáng. Sáng ra mẹ tôi bật cười vì cuốn sách nằm ngay trên mặt tôi.", "why": "fall asleep = bắt đầu ngủ, thiếp đi (không chủ ý); quá khứ fell asleep.", "new": [{"w": "lamp", "vi": "đèn"}, {"w": "lying", "vi": "nằm"}], "tw": "fall asleep"}, {"type": "mc", "ctx": "Short reading", "s": "We are having a big dinner at my aunt's house tonight, so I'll just have a light lunch today. Maybe a bowl of fruit and some yoghurt. What does “have a light lunch” mean?", "o": ["một bữa trưa nhẹ", "một bữa trưa muộn", "một bữa trưa thịnh soạn"], "a": "một bữa trưa nhẹ", "noblank": true, "say": "We are having a big dinner at my aunt's house tonight, so I'll just have a light lunch today. Maybe a bowl of fruit and some yoghurt.", "vi": "Tối nay chúng tôi ăn tối thịnh soạn ở nhà dì, nên hôm nay tôi chỉ ăn trưa nhẹ thôi. Có lẽ một bát trái cây và ít sữa chua.", "why": "have a light lunch = ăn bữa trưa nhẹ (ít món, dễ tiêu).", "new": [{"w": "yoghurt", "vi": "sữa chua" ows what is fresh. At home I slice vegetables for salads and chop vegetables for soup. When I cook meat, I cut it into pieces so that it cooks evenly. Last weekend we tried mussels and scallops at a seafood restaurant, which were delicious but expensive. I also enjoy a warm soup with barley in winter, since it is cheap and filling. Supermarkets are convenient, whereas markets are more friendly."}, {"type": "sp", "ctx": "Directions and driving", "s": "Describe a time when you travelled by car or bus to an unfamiliar place. How did you find your way, and did anything go wrong?", "vi": "Hãy kể một lần bạn đi ô tô hoặc xe buýt đến nơi lạ. Bạn tìm đường thế nào và có gì trục trặc không?", "words": ["motorway", "side road", "get lost", "on my way to", "go via", "turning", "take the wrong turning", "ask somebody the way", "direct somebody to somewhere", "follow signs to"], "why": "Kể theo trình tự: xuất phát, sự cố, cách giải quyết, kết quả. Dùng thì quá khứ và từ chỉ đường.", "sample": "Last year I drove to a village in the mountains. On my way to the village, I followed signs to the motorway, but then I took the wrong turning onto a narrow side road and got lost. The satnav stopped working, so I stopped to ask a farmer the way. He directed me to a small turning near the church. We had to go via a long bridge, which added an hour. Although I was tired, the view was spectacular, and I learned to check the route carefully before leaving."}, {"type": "sp", "ctx": "School systems", "s": "Talk about education in your country. How do children start school, and what can they do after they leave?", "vi": "Hãy nói về giáo dục ở nước bạn. Trẻ bắt đầu đi học thế nào và sau khi rời trường các em có thể làm gì?", "words": ["send somebody to school", "leave school", "go on to", "further education", "be divided into", "maths", "school year", "term"], "why": "Mô tả từ nhỏ đến lớn: tuổi đi học, các cấp, các lựa chọn sau phổ thông. Nêu ý kiến cá nhân ở cuối.", "sample": "In my country parents usually send their children to school at the age of six. The school year is divided into two terms, and maths is a compulsory subject at every level. Some students leave school at eighteen and start working immediately, whereas others go on to university. Another option is further education, where they study a practical skill such as cooking or nursing. In my opinion, the system is quite good, although children have too much homework. I would like schools to give more time for sport and music."}, {"type": "sp", "ctx": "School life", "s": "Describe what a typical day at school was like for you. What was fun, and what happened when students did something wrong?", "vi": "Hãy mô tả một ngày ở trường điển hình của bạn. Điều gì vui, và chuyện gì xảy ra khi học sinh làm sai?", "words": ["break", "lunch break", "break up", "go back", "break the rules", "be punished for", "stay behind", "get into trouble for"], "why": "Kể từ đầu ngày đến cuối ngày, rồi kể một chuyện bị phạt. Kết bằng điều bạn học được.", "sample": "At school, we had a short break in the morning and a longer lunch break at noon. I loved the days before we broke up for summer, because everyone was relaxed. After the holidays we had to go back to school, which I did not enjoy. Students who broke the rules were punished: once I got into trouble for talking in class, and the teacher made me stay behind after the lesson. Another boy was punished for cheating in a test. Looking back, I think the rules helped us to become more responsible."}, {"type": "sp", "ctx": "Holiday and village life", "s": "Talk about a quiet place you visited on holiday. Was it a good place for a trip, and would you go there again?", "vi": "Hãy nói về một nơi yên tĩnh bạn từng đến nghỉ. Đó có phải nơi tốt cho chuyến đi không và bạn có quay lại không?", "words": ["there isn't much to do", "reasonably", "in the right spot", "stay in"], "why": "Mô tả nơi đó, nêu ưu nhược điểm (although, however), rồi kết luận có quay lại hay không.", "sample": "Last summer we visited a small fishing village. The hotel was reasonably cheap and it was in the right spot, just a minute from the beach. However, there isn't much to do in the evening, so on rainy days we had to stay in and play cards. Although some of my friends found it boring, I enjoyed the silence and the fresh air. I would go there again, but next time I would bring more books and perhaps a bicycle, so that we can explore the nearby hills."}]}]};

  function evaluate(q,segs,dur){
    const text=segs.map(s=>s.t).join(' ').replace(/\s+/g,' ').trim();
    const low=text.toLowerCase().replace(/[’‘]/g,"'");
    const T=toks(low),n=T.length;
    const wpm=dur>3?Math.round(n/(dur/60)):null;
    const used=usedWords(q,T);
    const need=Math.min(3,(q.words||[]).length||3);
    /* Fluency & Coherence */
    const conn=STRONG.filter(c=>new RegExp('\\b'+c+'\\b').test(low));
    const fill=(low.match(FILL)||[]).length;
    let rep=0;for(let i=1;i<n;i++)if(T[i]===T[i-1]&&!['very','that','had'].includes(T[i]))rep++;
    let f=3.5+(n>=25?.5:0)+(n>=45?.5:0)+(n>=70?.5:0)+(n>=100?.5:0)+Math.min(1.5,conn.length*.3);
    if(wpm!==null)f+=(wpm>=100&&wpm<=170)?1:(wpm>=80&&wpm<100)?.5:wpm<60?-.5:0;
    f-=Math.min(1.5,.25*Math.max(0,fill+rep-1));
    if(n<20)f=Math.min(f,4.5);
    /* Lexical Resource */
    const uniq=new Set(T.map(stem)).size,ttr=n?uniq/n:0;
    const adv=T.filter(w=>w.length>=8).length,advr=n?adv/n:0;
    let l=3.5+1.5*Math.min(1,used.length/need)+(used.length>need?.5:0)+(n>=30&&ttr>=.6?.5:0)+(n>=30&&ttr>=.7?.5:0)+(advr>=.06?.5:0)+(advr>=.1?.5:0);
    if(n<20)l=Math.min(l,4.5);
    /* Grammatical Range & Accuracy */
    const cats=GR.filter(g=>g[1].test(low)).map(g=>g[0]);
    const errs=[];
    ERR.forEach(e=>{const m=low.match(e[0]);if(m)m.forEach(x=>errs.push({s:x,w:e[1]}));});
    let g=3.5+Math.min(2.4,cats.length*.4)+(n>=45?.5:0)+(n>=80?.5:0)-Math.min(2,errs.length*.5);
    if(n<20)g=Math.min(g,4.5);
    /* Pronunciation (recognition confidence) */
    const cs=segs.filter(s=>typeof s.c==='number'&&s.c>0);
    let p=null,pm=null;
    if(cs.length){
      let wsum=0,tot=0;cs.forEach(s=>{const k=Math.max(1,toks(s.t).length);wsum+=s.c*k;tot+=k;});
      pm=wsum/tot;
      p=pm>=.95?7.5:pm>=.9?7:pm>=.85?6.5:pm>=.8?6:pm>=.7?5.5:pm>=.6?5:pm>=.5?4.5:4;
      if(n<20)p=Math.min(p,5);
    }
    const lowSegs=cs.filter(s=>s.c<.75&&toks(s.t).length>=2).map(s=>s.t);
    const bands={f:half(f),l:half(l),g:half(g),p:p===null?null:half(p)};
    const av=[bands.f,bands.l,bands.g,bands.p].filter(x=>x!==null);
    const overall=half(av.reduce((a,b)=>a+b,0)/av.length);
    return {text,n,dur:Math.round(dur),wpm,used,missing:(q.words||[]).filter(w=>!used.includes(w)),conn,fill,rep,ttr:Math.round(ttr*100),adv,cats,errs:errs.slice(0,4),pm:pm===null?null:Math.round(pm*100),lowSegs:lowSegs.slice(0,3),bands,overall};
  }
  function adviceF(r){
    const a=[r.dur?`Bạn nói khoảng ${r.n} từ trong ${r.dur}s${r.wpm?` (≈ ${r.wpm} từ/phút)`:''}.`:`Bài gõ có khoảng ${r.n} từ (không đo được tốc độ nói).`];
    a.push(r.conn.length?`Từ nối đã dùng: ${r.conn.slice(0,5).join(', ')}.`:'Chưa thấy từ nối rõ ràng; thử dùng because, however, for example, as a result để ý tưởng liền mạch.');
    if(r.fill+r.rep>1)a.push(`Có ${r.fill} từ đệm và ${r.rep} lần lặp từ; hãy ngừng lặng ngắn thay vì “um/uh”.`);
    if(r.n<45)a.push('Câu trả lời còn ngắn; hướng tới 60–90 từ (30–45 giây) với 1 ý chính + 1 ví dụ.');
    return a.join(' ');
  }
  function adviceL(r){
    const a=[`Dùng ${r.used.length}/${r.used.length+r.missing.length} từ gợi ý${r.used.length?': '+r.used.join(', '):''}.`];
    if(r.missing.length)a.push(`Chưa dùng: ${r.missing.slice(0,5).join(', ')}.`);
    a.push(`Độ đa dạng từ ${r.ttr}%, từ dài/học thuật ${r.adv}.`);
    return a.join(' ');
  }
  function adviceG(r){
    const a=[r.cats.length?`Cấu trúc đa dạng: ${r.cats.join(', ')}.`:'Gần như chỉ dùng câu đơn; thử thêm mệnh đề quan hệ (which/who), câu điều kiện hoặc although/whereas.'];
    if(r.errs.length)a.push('Cần xem lại: '+r.errs.map(e=>`“${e.s}” (${e.w})`).join('; ')+'.');
    else a.push('Không phát hiện lỗi ngữ pháp phổ biến bằng quy tắc tự động.');
    return a.join(' ');
  }
  function adviceP(r){
    if(r.pm===null&&!r.dur)return 'Bài gõ nên chưa chấm được phát âm; hãy ghi âm để được chấm.';
    if(r.pm===null)return 'Trình duyệt này không có nhận dạng giọng nói nên chưa chấm được phát âm. Hãy mở bằng Chrome/Edge/Safari.';
    const a=[`Máy nhận ra lời bạn với độ chắc chắn ≈ ${r.pm}%.`];
    if(r.lowSegs.length)a.push('Đoạn nghe chưa rõ: “'+r.lowSegs.join('”, “')+'” — nghe lại phát âm mẫu và đọc chậm, rõ trọng âm.');
    else a.push('Phát âm được nhận ra rõ.');
    return a.join(' ');
  }
  function spCard(q){
    const st=state[q.id];
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const used=st&&st.r?st.r.used:[];
    const chips=(q.words||[]).map(w=>`<span class="chip${used.includes(w)?' used':''}">${esc(w)}<button type="button" class="say" data-word="${esc(w)}" aria-label="Phát âm ${esc(w)}" style="padding:0 4px;border:0;background:none">${icon}</button></span>`).join('');
    const busy=R&&R.id===q.id;
    let res='';
    if(st&&st.r){
      const r=st.r,b=r.bands;
      const bandBox=(name,v,adv)=>`<div class="band"><b>${name}</b><span class="n">${v===null?'—':fmt(v)}</span><p>${esc(adv)}</p></div>`;
      res=`<div class="spres" role="status">${urls[q.id]?`<audio controls src="${urls[q.id]}"></audio>`:''}<p class="tr">“${esc(r.text)}”</p>`+
        `<p class="overall">Điểm ước tính (thang IELTS 1–8)<span class="n">${fmt(r.overall)}</span></p><div class="bands">`+
        bandBox('Độ trôi chảy và mạch lạc (Fluency &amp; Coherence)',b.f,adviceF(r))+
        bandBox('Vốn từ vựng (Lexical Resource)',b.l,adviceL(r))+
        bandBox('Độ đa dạng và chính xác ngữ pháp (Grammatical Range &amp; Accuracy)',b.g,adviceG(r))+
        bandBox('Phát âm (Pronunciation)',b.p,adviceP(r))+`</div>`+
        `<p class="disc">Điểm do trình duyệt ước tính từ văn bản nhận dạng được (tốc độ, từ nối, từ vựng, cấu trúc, độ rõ giọng), chỉ để tham khảo, không thay thế giám khảo/giáo viên. Bản ghi âm chỉ nằm trên máy bạn, không được gửi đi.</p>`+
        `<button type="button" class="ghost retry" data-retry="${q.id}">Ghi âm lại</button></div>`;
    }
    const sample=q.sample?`<details class="sample"><summary>Xem bài nói mẫu (B2)</summary><p>${esc(q.sample)}</p></details>`:'';
    return `<article class="q sp" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div>`+
      `<p class="sent">${esc(q.s)}</p><p class="vi">${esc(q.vi)}</p>`+
      `<div class="spwords"><b>Từ nên dùng:</b> ${chips}</div>`+
      `<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu hỏi ${q.n}">${icon}Nghe câu hỏi</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button></div>`+
      `<div class="rec"><button type="button" class="recbtn" data-rec="${q.id}" ${busy?'disabled':''}>● Ghi âm</button><button type="button" class="recbtn stop" data-recstop="${q.id}" ${busy?'':'disabled'}>■ Dừng &amp; chấm điểm</button><span class="rectime" id="rt-${q.id}">${busy?'':'Nói 30–60 giây, cố dùng ≥ 3 từ gợi ý'}</span><span class="recmsg" id="rm-${q.id}"></span></div>`+
      `<details class="manual"><summary>Không ghi âm được? Gõ lại lời bạn nói để chấm</summary><textarea id="mt-${q.id}" placeholder="Gõ nội dung bạn đã nói…"></textarea><button type="button" class="ghost" data-manual="${q.id}">Chấm bài gõ (không chấm phát âm)</button></details>`+
      res+sample+`</article>`;
  }
  function recMsg(id,m){const e=$('rm-'+id);if(e)e.textContent=m||'';}
  async function startRec(id){
    if(R)return;
    stopAudio();
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
    catch(e){recMsg(id,'Không truy cập được micro. Hãy cho phép micro cho trang này hoặc dùng ô gõ bên dưới.');return;}
    const chunks=[];let mr=null;
    try{mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};mr.start();}catch(e){mr=null;}
    const segs=[];let rec=null;
    R={id,stream,mr,chunks,segs,t0:Date.now(),active:true,rec:null,timer:null};
    if(SRC){
      rec=new SRC();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=ev=>{
        let interim='';
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const r=ev.results[i];
          if(r.isFinal)segs.push({t:r[0].transcript.trim(),c:r[0].confidence});else interim+=r[0].transcript;
        }
        recMsg(id,interim?'… '+interim:'');
      };
      rec.onerror=()=>{};
      rec.onend=()=>{if(R&&R.active&&R.rec===rec){try{rec.start();}catch(e){}}};
      R.rec=rec;try{rec.start();}catch(e){}
    }else recMsg(id,'Trình duyệt không hỗ trợ nhận dạng giọng nói: bài sẽ được ghi âm nhưng cần gõ lại lời nói để chấm.');
    const tick=()=>{const e=$('rt-'+id);if(e&&R)e.textContent='● '+Math.round((Date.now()-R.t0)/1000)+' giây';};
    R.timer=setInterval(tick,500);tick();
    const b1=document.querySelector(`[data-rec="${id}"]`),b2=document.querySelector(`[data-recstop="${id}"]`);
    if(b1)b1.disabled=true;if(b2)b2.disabled=false;
  }
  function stopRec(id){
    if(!R||R.id!==id)return;
    const cur=R;cur.active=false;clearInterval(cur.timer);
    const dur=(Date.now()-cur.t0)/1000;
    recMsg(id,'Đang chấm điểm…');
    try{cur.rec&&cur.rec.stop();}catch(e){}
    const finish=()=>{
      cur.stream.getTracks().forEach(t=>t.stop());
      if(cur.chunks.length){urls[id]&&URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(new Blob(cur.chunks,{type:(cur.mr&&cur.mr.mimeType)||'audio/webm'}));}
      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
