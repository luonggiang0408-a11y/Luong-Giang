ər/"}, {"type": "mc", "ctx": "Daily costs", "s": "Her monthly budget covers rent, food and the ___, which is about fifty pounds because she travels across town every day.", "o": ["bank loan", "phone case", "bus fare"], "a": "bus fare", "vi": "Ngân sách hàng tháng của cô gồm tiền thuê nhà, đồ ăn và giá vé xe buýt, khoảng năm mươi bảng vì cô đi khắp thành phố mỗi ngày.", "why": "bus fare / train fare = giá vé xe buýt / tàu hỏa.", "new": [{"w": "budget", "vi": "ngân sách"}], "tw": "bus fare", "ipa": "/ˈbʌs feər/ /ˈtreɪn feər/"}, {"type": "mc", "ctx": "Holiday cost", "s": "The hotel was affordable, but the ___ to Paris was so high in August that we postponed the trip until October.", "o": ["airfare", "insurance", "souvenir"], "a": "airfare", "vi": "Khách sạn giá phải chăng, nhưng giá vé máy bay đến Paris tháng Tám cao đến mức chúng tôi hoãn chuyến đi sang tháng Mười.", "why": "airfare = giá vé máy bay; cheap/expensive airfare.", "new": [{"w": "postpone", "vi": "hoãn"}, {"w": "affordable", "vi": "giá phải chăng"}], "tw": "airfare", "ipa": "/ˈeə.feər/"}, {"type": "mc", "ctx": "Airport announcement", "s": "Passengers with small children may ___ the plane first, whereas everyone else should wait until their row number is called.", "o": ["get over", "get on", "get off"], "a": "get on", "vi": "Hành khách có trẻ nhỏ có thể lên máy bay trước, còn mọi người khác nên chờ đến khi gọi số hàng ghế.", "why": "get on + bus/coach/train/plane = lên phương tiện lớn; ngược lại get off.", "new": [{"w": "row", "vi": "hàng"}], "tw": "get on"}, {"type": "mc", "ctx": "Train journey", "s": "The conductor warned that anyone who wanted to ___ at Bristol should move to the doors now, because the train stops for only one minute.", "o": ["get up", "get in", "get off"], "a": "get off", "vi": "Người soát vé cảnh báo ai muốn xuống ở Bristol nên di chuyển ra cửa ngay, vì tàu chỉ dừng một phút.", "why": "get off + bus/coach/train/plane = xuống phương tiện lớn; get out of dùng cho taxi/ô tô.", "new": [{"w": "conductor", "vi": "người soát vé"}], "tw": "get off"}, {"type": "mc", "ctx": "Safety", "s": "Never ___ a stranger's car, however friendly the driver seems, because it is safer to use licensed taxis or call your parents.", "o": ["get into", "get out of", "get along with"], "a": "get into", "vi": "Đừng bao giờ lên xe của người lạ, dù tài xế có thân thiện thế nào, vì dùng taxi có giấy phép hoặc gọi bố mẹ sẽ an toàn hơn.", "why": "get into + car/taxi = lên xe hơi/taxi; ngược lại get out of.", "new": [{"w": "licensed", "vi": "có giấy phép"}], "tw": "get into"}, {"type": "mc", "ctx": "Parking", "s": "The driver stopped suddenly and asked the children to ___ the car quietly, so that they would not disturb the sleeping baby.", "o": ["get rid of", "get out of", "get on with"], "a": "get out of", "vi": "Tài xế dừng đột ngột và bảo bọn trẻ xuống xe nhẹ nhàng, để không làm em bé đang ngủ thức giấc.", "why": "get out of + car/taxi = xuống xe hơi/taxi; ngược lại get into.", "new": [{"w": "disturb", "vi": "làm phiền"}], "tw": "get out of"}, {"type": "mc", "ctx": "School morning", "s": "To get to school on time, the pupils have to ___ before half past seven, because the next one comes forty minutes later.", "o": ["miss the bus", "paint the bus", "catch the bus"], "a": "catch the bus", "vi": "Để đến trường đúng giờ, học sinh phải bắt xe buýt trước bảy rưỡi vì chuyến sau đến muộn bốn mươi phút.", "why": "catch / get the bus = bắt, đi xe buýt; trái với miss the bus (lỡ xe).", "new": [{"w": "pupil", "vi": "học sinh"}], "tw": "catch the bus", "ipa": "/ɡet/ /kætʃ ðə bʌs/"}, {"type": "mc", "ctx": "Commuter", "s": "If you want to ___ at 6.15, you have to leave home earlier than usual, because the station is far from our village.", "o": ["catch the train", "drive the lorry", "fly the plane"], "a": "catch the train", "vi": "Nếu muốn bắt tàu lúc 6 giờ 15, bạn phải rời nhà sớm hơn thường lệ vì ga xa làng chúng tôi.", "why": "catch / get the train = bắt, đi tàu hỏa.", "new": [{"w": "village cơ hội"}, {"w": "apply", "vi": "nộp đơn"}], "tw": "come along", "ipa": "/kʌm əˈlɒŋ/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Reading", "s": "Hà and Nam met at a language course last spring. Since then they have been going out together every weekend, which means their friends now treat them as a couple. What does \"go out with\" mean?", "o": ["làm việc chung với ai", "hẹn hò với ai", "đi dạo cùng ai"], "a": "hẹn hò với ai", "vi": "Hà và Nam gặp nhau ở một khóa ngoại ngữ vào mùa xuân năm ngoái. Từ đó họ hẹn hò mỗi cuối tuần, nghĩa là bạn bè giờ coi họ là một cặp.", "why": "go out with sb = có mối quan hệ yêu đương với ai; dùng khi đã là người yêu, chưa chắc đã cưới.", "noblank": true, "say": "Hà and Nam met at a language course last spring. Since then they have been going out together every weekend, which means their friends now treat them as a couple.", "new": [{"w": "treat", "vi": "đối xử, coi như"}, {"w": "couple", "vi": "cặp đôi"}], "tw": "go out with"}, {"type": "mc", "ctx": "Reading", "s": "Tuấn said he was upset all week. His girlfriend had told him that their relationship was not working, and as a result they broke up on Sunday evening. What does \"break up\" mean?", "o": ["làm hỏng", "tạm nghỉ", "chia tay"], "a": "chia tay", "vi": "Tuấn nói anh ấy buồn cả tuần. Bạn gái bảo mối quan hệ không ổn, vì vậy họ đã chia tay vào tối Chủ nhật.", "why": "break up (with sb) = kết thúc mối quan hệ yêu đương; cũng dùng cho nhóm nhạc, cuộc họp tan.", "noblank": true, "say": "Tuấn said he was upset all week. His girlfriend had told him that their relationship was not working, and as a result they broke up on Sunday evening.", "new": [{"w": "upset", "vi": "buồn bực"}, {"w": "relationship", "vi": "mối quan hệ"}, {"w": "as a result", "vi": "do đó"}], "tw": "break up"}, {"type": "mc", "ctx": "Reading", "s": "Our cousin lives only two streets away, so she often comes around after work. She usually brings fruit, and we sit in the garden and chat until it gets dark. What does \"come around\" mean?", "o": ["đến thăm nhà", "đi vòng quanh", "tỉnh lại"], "a": "đến thăm nhà", "vi": "Em họ tôi sống cách hai con phố nên thường ghé nhà sau giờ làm. Cô ấy hay mang trái cây, và chúng tôi ngồi ngoài vườn trò chuyện đến tối.", "why": "come around / round = ghé thăm nhà ai đó, thường thân mật và không báo trước nhiều.", "noblank": true, "say": "Our cousin lives only two streets away, so she often comes around after work. She usually brings fruit, and we sit in the garden and chat until it gets dark.", "new": [{"w": "chat", "vi": "trò chuyện"}], "tw": "come around"}, {"type": "mc", "ctx": "Reading", "s": "My brother always delays his homework. Mum finally lost patience and shouted, \"Stop complaining and get on with it!\", so he opened his books at last. What does \"get on with it\" mean here?", "o": ["nhờ người khác làm", "bắt tay làm tiếp việc đó", "từ bỏ việc đó"], "a": "bắt tay làm tiếp việc đó", "vi": "Em trai tôi luôn trì hoãn bài tập. Mẹ cuối cùng mất kiên nhẫn quát: \"Đừng than nữa, làm tiếp đi!\", thế là cuối cùng nó mở sách ra.", "why": "get on with sth = tiếp tục hoặc bắt tay làm việc gì đó; get on with it! = làm tiếp đi, đừng trì hoãn.", "noblank": true, "say": "My brother always delays his homework. Mum finally lost patience and shouted, \"Stop complaining and get on with it!\", so he opened his books at last.", "new": [{"w": "delay", "vi": "trì hoãn"}, {"w": "patience", "vi": "sự kiên nhẫn"}], "tw": "get on with"}, {"type": "mc", "ctx": "Reading", "s": "Peter works in a team of six. Although the others are older than him, he gets on well with all of them, so the office feels relaxed and cheerful. What does \"gets on well with\" mean?", "o": ["cạnh tranh với", "phụ thuộc vào", "hòa hợp, quan hệ tốt với"], "a": "hòa hợp, quan hệ tốt với", "vi": "Peter làm trong nhóm sáu người. Dù những người khác lớn tuổi hơn, anh hòa hợp với tất cả, nên văn phòng rất thoải mái và vui vẻ.", "why": "get on (well) with sb = có quan hệ tốt, hòa hợp với ai; khác get on with sth (tiếp tục làm việc).", "noblank": true, "say": "Peter works in a team of six. Although the others are older than him, he gets on well with all of them, so the office feels relaxed and cheerful.", "new": [{"w": "relaxed", "vi": "thoải mái"}, {"w": "cheerful", "vi": "vui vẻ"}], "tw": "get on with"}, {"type": "mc", "ctx": "Reading", "s": "The film ended at midnight, but many people lingered outside the cinema. They were discussing the surprising ending, and nobody wanted to go home yet. What does \"lingered\" mean?", "o": ["nán lại, ở lâu hơn dự kiến", "chạy vội đi", "giải tán nhanh"], "a": "nán lại, ở lâu hơn dự kiến", "vi": "Phim kết thúc lúc nửa đêm nhưng nhiều người vẫn nán lại bên ngoài rạp. Họ bàn về cái kết bất ngờ và chưa ai muốn về nhà.", "why": "linger = nán lại lâu hơn dự kiến, hoặc (mùi, cảm giác, bệnh) còn kéo dài.", "noblank": true, "say": "The film ended at midnight, but many people lingered outside the cinema. They were discussing the surprising ending, and nobody wanted to go home yet.", "new": [{"w": "ending", "vi": "cái kết"}], "tw": "linger", "ipa": "/ˈlɪŋgər/"}, {"type": "mc", "ctx": "Reading", "s": "The nurse explained that a healthy adult's bladder can hold about half a litre of urine. When it becomes full, the brain sends a signal that it is time to find a toilet. What does \"bladder\" mean?", "o": ["lá gan", "bàng quang", "dạ dày"], "a": "bàng quang", "vi": "Y tá giải thích bàng quang của người lớn khỏe mạnh chứa được khoảng nửa lít nước tiểu. Khi đầy, não gửi tín hiệu rằng đã đến lúc tìm nhà vệ sinh.", "why": "bladder = bàng quang, cơ quan chứa nước tiểu.", "noblank": true, "say": "The nurse explained that a healthy adult's bladder can hold about half a litre of urine. When it becomes full, the brain sends a signal that it is time to find a toilet.", "new": [{"w": "urine", "vi": "nước tiểu"}, {"w": "signal", "vi": "tín hiệu"}],  "mũ lưỡi trai", "vi": "Người làm vườn luôn đội mũ lưỡi trai khi làm ngoài trời vào mùa hè. Phần lưỡi trai che nắng cho mặt nên ông làm được lâu hơn mà không đau đầu.", "why": "cap = mũ lưỡi trai/mũ có chắn nắng phía trước; baseball cap.", "noblank": true, "say": "The gardener always wears a cap when he works outside in summer. The peak shades his face from the sun, so he can work longer without getting a headache.", "new": [{"w": "peak", "vi": "lưỡi trai của mũ"}, {"w": "shade", "vi": "che bóng"}], "tw": "cap", "ipa": "/kæp/"}, {"type": "mc", "ctx": "Reading", "s": "Before the interview, Lan took off her large earrings because she thought they were too fancy. She chose small gold ones instead, which looked more professional. What does \"earring\" mean?", "o": ["nhẫn", "vòng chân", "khuyên tai"], "a": "khuyên tai", "vi": "Trước buổi phỏng vấn, Lan tháo đôi khuyên tai to vì nghĩ chúng quá cầu kỳ. Cô chọn đôi vàng nhỏ, trông chuyên nghiệp hơn.", "why": "earring = khuyên tai, hoa tai; thường nói a pair of earrings.", "noblank": true, "say": "Before the interview, Lan took off her large earrings because she thought they were too fancy. She chose small gold ones instead, which looked more professional.", "new": [{"w": "fancy", "vi": "cầu kỳ"}], "tw": "earring", "ipa": "/ˈɪr.ɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "The police found a stolen necklace in a drawer. It was made of silver and small blue stones, and the owner recognised it immediately. What does \"necklace\" mean?", "o": ["vòng cổ", "vòng tay", "khuyên tai"], "a": "vòng cổ", "vi": "Cảnh sát tìm thấy một sợi dây chuyền bị đánh cắp trong ngăn kéo. Nó làm bằng bạc và đá xanh nhỏ, chủ nhân nhận ra ngay.", "why": "necklace = vòng cổ, dây chuyền.", "noblank": true, "say": "The police found a stolen necklace in a drawer. It was made of silver and small blue stones, and the owner recognised it immediately.", "new": [{"w": "stolen", "vi": "bị đánh cắp"}, {"w": "recognise", "vi": "nhận ra"}], "tw": "necklace", "ipa" scallop", "ipa": "/ˈskæləp/"}, {"type": "mc", "ctx": "Reading", "s": "Minh earns a modest salary, yet he puts money away for a rainy day every month. When he lost his job during the crisis, those savings paid his rent for six months. What does \"put money away for a rainy day\" mean?", "o": ["tiêu tiền khi trời mưa", "cho bạn mượn tiền", "dành dụm tiền phòng lúc khó khăn"], "a": "dành dụm tiền phòng lúc khó khăn", "vi": "Minh có lương khiêm tốn nhưng mỗi tháng đều dành dụm tiền phòng lúc khó khăn. Khi mất việc trong khủng hoảng, khoản tiết kiệm ấy trả tiền thuê nhà sáu tháng.", "why": "put money away for a rainy day = để dành tiền phòng khi khó khăn, chi phí bất ngờ.", "noblank": true, "say": "Minh earns a modest salary, yet he puts money away for a rainy day every month. When he lost his job during the crisis, those savings paid his rent for six months.", "new": [{"w": "modest", "vi": "khiêm tốn"}, {"w": "crisis", "vi": "khủng hoảng"}], "tw": "put money away for a rainy day", "ipa": "/pʊt ˈmʌn.i əˈweɪ fər ə ˌreɪ.ni ˈdeɪ/"}, {"type": "mc", "ctx": "Reading", "s": "The factory closed for a period of time while workers repaired the roof. Nobody knew how long it would take, but the manager promised to open again as soon as possible. What does \"for a period of time\" mean?", "o": ["trong một khoảng thời gian", "mãi mãi", "chỉ một lần"], "a": "trong một khoảng thời gian", "vi": "Nhà máy đóng cửa trong một khoảng thời gian khi công nhân sửa mái. Không ai biết mất bao lâu nhưng quản lý hứa mở lại sớm nhất có thể.", "why": "for a period of time = trong một khoảng thời gian (không nói rõ bao lâu).", "noblank": true, "say": "The factory closed for a period of time while workers repaired the roof. Nobody knew how long it would take, but the manager promised to open again as soon as possible.", "new": [{"w": "repair", "vi": "sửa chữa"}], "tw": "for a period of time", "ipa": "/fər ə ˈpɪə.ri.əd əv taɪm/"}, {"type": "mc", "ctx": "Reading", "s": "Before buying a house, Tam compared several financial institutions. Each one offered a different loan rate, so he chose the one with the lowest cost and the most flexible conditions. What does \"financial institution\" mean?", "o": ["trường kinh doanh", "tổ chức tài chính", "cơ quan thuế"], "a": "tổ chức tài chính", "vi": "Trước khi mua nhà, Tâm so sánh nhiều tổ chức tài chính. Mỗi nơi đưa ra lãi suất vay khác nhau nên anh chọn nơi chi phí thấp nhất và điều kiện linh hoạt nhất.", "why": "financial institution = tổ chức tài chính (ngân hàng, công ty bảo hiểm, quỹ tín dụng).", "noblank": true, "say": "Before buying a house, Tam compared several financial institutions. Each one offered a different loan rate, so he chose the one with the lowest cost and the most flexible conditions.", "new": [{"w": "flexible", "vi": "linh hoạt"}], "tw": "financial institution", "ipa": "/faɪˈnæn.ʃəl ˌɪn.stɪˈtʃuː.ʃən/"}, {"type": "mc", "ctx": "Reading", "s": "Customers who keep money in a fixed deposit account are paid interest on it. The longer they leave the money in the bank, the more interest they earn. What does \"paid interest on\" mean?", "o": ["bị phạt vì", "được giảm thuế cho", "được trả lãi cho"], "a": "được trả lãi cho", "vi": "Khách hàng gửi tiền kỳ hạn cố định được trả lãi cho khoản đó. Họ để tiền trong ngân hàng càng lâu thì lãi càng nhiều.", "why": "pay interest on sth = trả lãi cho khoản tiền nào đó (ngân hàng trả lãi tiết kiệm; người vay trả lãi vay).", "noblank": true, "say": "Customers who keep money in a fixed deposit account are paid interest on it. The longer they leave the money in the bank, the more interest they earn.", "new": [{"w": "fixed deposit", "vi": "tiền gửi kỳ hạn"}, {"w": "earn", "vi": "kiếm được"}], "tw": "pay interest on", "ipa": "/peɪ ˈɪn.trəst ɒn/"}, {"type": "mc", "ctx": "Reading", "s": "My uncle has never studied at a cooking school, yet he is really good at cooking grilled fish. Neighbours often smell the delicious aroma and hope to be invited for dinner. What does \"good at cooking\" mean?", "o": ["nấu ăn giỏi", "thích ăn uống", "sợ vào bếp"], "a": "nấu ăn giỏi", "vi": "Chú tôi chưa từng học trường nấu ăn nhưng nấu cá nướng rất giỏi. Hàng xóm thường ngửi mùi thơm và mong được mời ăn tối.", "why": "be good at + V-ing = giỏi làm gì; be good at cooking Chinese dishes = nấu món Hoa giỏi.", "noblank": true, "say": "My uncle has never studied at a cooking school, yet he is really good at cooking grilled fish. Neighbours often smell the delicious aroma and hope to be invited for dinner.", "new": [{"w": "aroma", "vi": "mùi thơm"}], "tw": "be good at cooking", "ipa": "/bi ɡʊd æt ˈkʊkɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "Farmers in the highlands grow barley because it tolerates cool weather. After harvest, part of the grain is sold to brewers, while the rest is used to feed cattle. What does \"barley\" mean?", "o": ["ngô", "lúa mạch", "khoai tây"], "a": "lúa mạch", "vi": "Nông dân vùng cao trồng lúa mạch vì nó chịu được thời tiết mát. Sau thu hoạch, một phần hạt bán cho nhà sản xuất bia, phần còn lại cho gia súc ăn.", "why": "barley = lúa mạch; dùng làm bia, súp, cháo, thức ăn gia súc.", "noblank": true, "say": "Farmers in the highlands grow barley because it tolerates cool weather. After harvest, part of the grain is sold to brewers, while the rest is used to feed cattle.", "new": [{"w": "tolerate", "vi": "chịu được"}, {"w": "brewer", "vi": "nhà làm bia"}], "tw": "barley", "ipa": "/ˈbɑː.li/"}, {"type": "mc", "ctx": "Reading", "s": "In Britain people say lorry, but Americans usually say truck. Both words describe a large vehicle that transports heavy goods, such as furniture or building materials, over long distances. What does \"lorry\" mean?", "o": ["xe đạp", "xe khách", "xe tải"], "a": "xe tải", "vi": "Ở Anh người ta nói lorry, còn người Mỹ thường nói truck. Cả hai từ chỉ phương tiện lớn chở hàng nặng như đồ nội thất hay vật liệu xây dựng đi xa.", "why": "lorry (Anh) / truck (Mỹ) = xe tải chở hàng nặng.", "noblank": true, "say": "In Britain people say lorry, but Americans usually say truck. Both words describe a large vehicle that transports heavy goods, such as furniture or building materials, over long distances.", "new": [{"w": "transport", "vi": "vận chuyển"}, {"w": "goods", "vi": "hàng hóa"}], "tw": "lorry", "ipa": "/ˈlɒr.i/ /trʌk/"}, {"type": "mc", "ctx": "Reading", "s": "The electrician arrived in a small van full of tools and cables. He parked outside our house and carried the heavy equipment inside, which saved him several trips. What does \"van\" mean?", "o": ["xe tải nhỏ", "xe máy", "xe buýt hai tầng"], "a": "xe tải nhỏ", "vi": "Thợ điện đến bằng một xe tải nhỏ chất đầy dụng cụ và dây cáp. Ông đỗ trước nhà và mang thiết bị nặng vào, tiết kiệm được nhiều chuyến.", "why": "van = xe tải nhỏ/xe van có thùng kín, nhỏ hơn lorry.", "noblank": true, "say": "The electrician arrived in a small van full of tools and cables. He parked outside our house and carried the heavy equipment inside, which saved him several trips.", "new": [{"w": "cable", "vi": "dây cáp"}], "tw": "van", "ipa": "/væn/"}, {"type": "mc", "ctx": "Reading", "s": "When the storm approached, the pilot told passengers to fasten their seat belts. He steered the plane around the dark clouds, and everyone landed safely after a bumpy flight. What does \"pilot\" mean?", "o": ["kỹ sư mặt đất", "phi công", "tiếp viên"], "a": "phi công", "vi": "Khi bão đến gần, phi công bảo hành khách thắt dây an toàn. Ông lái máy bay vòng qua mây đen và mọi người hạ cánh an toàn sau chuyến bay xóc.", "why": "pilot = phi công, người lái máy bay.", "noblank": true, "say": "When the storm approached, the pilot told passengers to fasten their seat belts. He steered the plane around the dark clouds, and everyone landed safely after a bumpy flight.", "new": [{"w": "steer", "vi": "lái"}, {"w": "bumpy", "vi": "xóc"}], "tw": "pilot", "ipa": "/ˈpaɪ.lət/"}, {"type": "mc", "ctx": "Reading", "s": "The city council announced that the fare for single tickets would rise by ten percent next month. Students will still get a discount, whereas tourists will pay the full price. What does \"fare\" mean?", "o": ["lộ trình", "giấy phép", "giá vé, tiền cước"], "a": "giá vé, tiền cước", "vi": "Hội đồng thành phố thông báo giá vé lượt sẽ tăng mười phần trăm tháng tới. Sinh viên vẫn được giảm giá, còn du khách trả giá đầy đủ.", "why": "fare = tiền vé (xe buýt, tàu, máy bay, taxi); khác fee (phí dịch vụ).", "noblank": true, "say": "The city council announced that the fare for single tickets would rise by ten percent next month. Students will still get a discount, whereas tourists will pay the full price.", "new": [{"w": "council", "vi": "hội đồng"}, {"w": "discount", "vi": "giảm giá"}], "tw": "fare", "ipa": "/feər/"}, {"type": "mc", "ctx": "Reading", "s": "Grandpa gave me coins for the bus fare, though he warned me that prices had changed since his youth. The ticket cost twice as much as I expected. What does \"bus fare\" mean?", "o": ["giá vé xe buýt", "tiền thuê xe", "tiền phạt đỗ xe"], "a": "giá vé xe buýt", "vi": "Ông cho tôi tiền xu để trả vé xe buýt, dù cảnh báo giá đã đổi từ thời ông trẻ. Vé đắt gấp đôi tôi nghĩ.", "why": "bus fare / train fare = giá vé xe buýt / tàu hỏa.", "noblank": true, "say": "Grandpa gave me coins for the bus fare, though he warned me that prices had changed since his youth. The ticket cost twice as much as I expected.", "new": [{"w": "coin", "vi": "đồng xu"}], "tw": "bus fare", "ipa": "/ˈbʌs feər/ /ˈtreɪn feər/"}, {"type": "mc", "ctx": "Reading", "s": "Airfares rise sharply during public holidays because so many people want to travel at the same time. Smart travellers compare websites and choose flights on weekdays to save money. What does \"airfares\" mean?", "o": ["thuế sân bay", "giá vé máy bay", "phí hành lý"], "a": "giá vé máy bay", "vi": "Giá vé máy bay tăng mạnh vào kỳ nghỉ lễ vì quá nhiều người muốn đi cùng lúc. Người đi thông minh so sánh trang web và chọn chuyến ngày thường để tiết kiệm.", "why": "airfare = giá vé máy bay; cheap/expensive airfare.", "noblank": true, "say": "Airfares rise sharply during public holidays because so many people want to travel at the same time. Smart travellers compare websites and choose flights on weekdays to save money.", "new": [{"w": "sharply", "vi": "mạnh, đột ngột"}], "tw": "airfare", "ipa": "/ˈeə.feər/"}, {"type": "mc", "ctx": "Reading", "s": "I got on the bus near my house, but it was so crowded that I had to stand. After ten minutes a seat became free, and I finally sat down with relief. What does \"got on\" mean?", "o": ["xuống (xe)", "đổi (xe)", "lên (xe)"], "a": "lên (xe)", "vi": "Tôi lên xe buýt gần nhà nhưng quá đông nên phải đứng. Mười phút sau có chỗ trống và cuối cùng tôi ngồi xuống nhẹ nhõm.", "why": "get on + bus/coach/train/plane = lên phương tiện lớn; ngược lại get off.", "noblank": true, "say": "I got on the bus near my house, but it was so crowded that I had to stand. After ten minutes a seat became free, and I finally sat down with relief.", "new": [{"w": "crowded", "vi": "đông đúc"}], "tw": "get on"}, {"type": "mc", "ctx": "Reading", "s": "We were so tired after the long flight that we could hardly walk. When the plane finally landed, we got off slowly and followed the signs towards passport control. What does \"got off\" mean?", "o": ["xuống (phương tiện)", "lên (phương tiện)", "bỏ lỡ (phương tiện)"], "a": "xuống (phương tiện)", "vi": "Chúng tôi mệt đến mức hầu như không đi nổi sau chuyến bay dài. Khi máy bay hạ cánh, chúng tôi chậm rãi xuống và theo biển chỉ dẫn đến quầy kiểm tra hộ chiếu.", "why": "get off + bus/coach/train/plane = xuống phương tiện lớn; get out of dùng cho taxi/ô tô.", "noblank": true, "say": "We were so tired after the long flight that we could hardly walk. When the plane finally landed, we got off slowly and followed the signs towards passport control.", "new": [{"w": "hardly", "vi": "hầu như không"}], "tw": "get off"}, {"type": "mc", "ctx": "Reading", "s": "The film star hurried out of the hotel and got into a black car that was waiting outside. Photographers ran after her, but the driver pulled away quickly. What does \"got into\" mean?", "o": ["sửa (ô tô)", "lên (ô tô)", "xuống (ô tô)"], "a": "lên (ô tô)", "vi": "Ngôi sao điện ảnh vội ra khỏi khách sạn và lên chiếc xe đen đang đợi bên ngoài. Các nhiếp ảnh gia chạy theo nhưng tài xế đã rời đi nhanh.", "why": "get into + car/taxi = lên xe hơi/taxi; ngược lại get out of.", "noblank": true, "say": "The film star hurried out of the hotel and got into a black car that was waiting outside. Photographers ran after her, but the driver pulled away quickly.", "new": [{"w": "pull away", "vi": "lái đi"}], "tw": "get into"}, {"type": "mc", "ctx": "Reading", "s": "After getting out of the taxi, I realised that I had left my phone on the back seat. I ran after the car, but it had already disappeared round the corner. What does \"getting out of\" mean?", "o": ["lên (xe)", "sửa (xe)", "xuống (xe)"], "a": "xuống (xe)", "vi": "Sau khi xuống taxi, tôi nhận ra mình bỏ quên điện thoại ở ghế sau. Tôi chạy theo xe nhưng nó đã khuất sau góc đường.", "why": "get out of + car/taxi = xuống xe hơi/taxi; ngược lại get into.", "noblank": true, "say": "After getting out of the taxi, I realised that I had left my phone on the back seat. I ran after the car, but it had already disappeared round the corner.", "new": [{"w": "disappear", "vi": "biến mất"}], "tw": "get out of"}, {"type": "mc", "ctx": "Reading", "s": "Hanh ran along the street, waving her hand. She wanted to catch the bus, which was already leaving, but luckily the driver noticed her and opened the door again. What does \"catch the bus\" mean?", "o": ["bắt kịp xe buýt", "sơn xe buýt", "lái xe buýt"], "a": "bắt kịp xe buýt", "vi": "Hạnh chạy dọc đường vẫy tay. Cô muốn bắt kịp xe buýt đang rời đi, may mà tài xế thấy và mở cửa lại.", "why": "catch / get the bus = bắt, đi xe buýt; trái với miss the bus (lỡ xe).", "noblank": true, "say": "Hanh ran along the street, waving her hand. She wanted to catch the bus, which was already leaving, but luckily the driver noticed her and opened the door again.", "new": [{"w": "wave", "vi": "vẫy"}], "tw": "catch the bus", "ipa": "/ɡet/ /kætʃ ðə bʌs/"}, {"type": "mc", "ctx": "Reading", "s": "Bao works in the capital but lives in a quiet town. Every morning he catches the train at dawn, reads the news for an hour and arrives at the office feeling calm. What does \"catches the train\" mean?", "o": ["sửa tàu", "bắt tàu, đi tàu", "dừng tàu"], "a": "bắt tàu, đi tàu", "vi": "Bảo làm việc ở thủ đô nhưng sống ở thị trấn yên tĩnh. Mỗi sáng anh bắt tàu lúc bình minh, đọc tin một tiếng và đến văn phòng với tâm trạng bình tĩnh.", "why": "catch / get the train = bắt, đi tàu hỏa.", "noblank": true, "say": "Bao works in the capital but lives in a quiet town. Every morning he catches the train at dawn, reads the news for an hour and arrives at the office feeling calm.", "new": [{"w": "dawn", "vi": "bình minh"}], "tw": "catch the train", "ipa": "/ɡet/ /kætʃ ðə treɪn/"}, {"type": "mc", "ctx": "Reading", "s": "It is cheaper to go by coach than by train, but the journey is slower and less comfortable. Therefore many students choose to go by coach only when they travel at night. What does \"go by coach\" mean?", "o": ["đi dạo quanh xe khách", "thuê xe khách", "đi bằng xe khách"], "a": "đi bằng xe khách", "vi": "Đi bằng xe khách rẻ hơn tàu nhưng chậm và kém thoải mái. Vì vậy nhiều sinh viên chỉ chọn xe khách khi đi ban đêm.", "why": "go by bus / train / plane = đi bằng phương tiện nào; không dùng mạo từ sau by.", "noblank": true, "say": "It is cheaper to go by coach than by train, but the journey is slower and less comfortable. Therefore many students choose to go by coach only when they travel at night.", "new": [{"w": "therefore", "vi": "vì vậy"}], "tw": "go by", "ipa": "/ɡəʊ baɪ/"}, {"type": "mc", "ctx": "Reading", "s": "Some birds can fly thousands of kilometres without stopping. Scientists believe they follow the stars and the magnetic field of the Earth when they travel between continents. What does \"fly\" mean?", "o": ["bay", "bơi", "leo"], "a": "bay", "vi": "Một số loài chim có thể bay hàng nghìn ki-lô-mét không nghỉ. Các nhà khoa học tin rằng chúng theo các vì sao và từ trường Trái Đất khi di chuyển giữa các châu lục.", "why": "fly = bay; đi bằng máy bay; fly to + nơi.", "noblank": true, "say": "Some birds can fly thousands of kilometres without stopping. Scientists believe they follow the stars and the magnetic field of the Earth when they travel between continents.", "new": [{"w": "magnetic field", "vi": "từ trường"}, {"w": "continent", "vi": "châu lục"}], "tw": "fly", "ipa": "/flaɪ/"}, {"type": "mc", "ctx": "Reading", "s": "Our teacher arrived at the stop when the bus was already pulling away. She missed the bus by a few seconds, so she called the school to say that she would be late. What does \"missed the bus\" mean?", "o": ["đón xe buýt", "lỡ xe buýt", "xuống xe buýt"], "a": "lỡ xe buýt", "vi": "Cô giáo đến trạm khi xe buýt đã bắt đầu lăn bánh. Cô lỡ xe chỉ vài giây nên gọi báo trường rằng sẽ đến trễ.", "why": "miss the bus / train = lỡ chuyến; ngược lại catch.", "noblank": true, "say": "Our teacher arrived at the stop when the bus was already pulling away. She missed the bus by a few seconds, so she called the school to say that she would be late.", "new": [{"w": "pull away", "vi": "lăn bánh rời đi"}], "tw": "miss the bus", "ipa": "/mɪs ðə treɪn/ /mɪs ðə bʌs/"}, {"type": "mc", "ctx": "Reading", "s": "We stood at the bus stop in the rain for half an hour. Then a taxi came along, and although it was expensive, we jumped in immediately because we were soaked. What does \"came along\" mean?", "o": ["bỏ đi", "ngừng lại", "xuất hiện, đến"], "a": "xuất hiện, đến", "vi": "Chúng tôi đứng ở trạm xe buýt dưới mưa nửa giờ. Rồi một chiếc taxi xuất hiện và dù đắt, chúng tôi lên ngay vì ướt sũng.", "why": "come along = xuất hiện, đến (ngẫu nhiên); come along! = đi nào/nhanh lên.", "noblank": true, "say": "We stood at the bus stop in the rain for half an hour. Then a taxi came along, and although it was expensive, we jumped in immediately because we were soaked.", "new": [{"w": "soaked", "vi": "ướt sũng"}], "tw": "come along", "ipa": "/kʌm əˈlɒŋ/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Relationships", "s": "Describe a good friendship or relationship you have seen. How did the people meet, and what do they do to stay close?", "vi": "Hãy tả một tình bạn hoặc mối quan hệ tốt mà bạn từng thấy. Họ gặp nhau thế nào và làm gì để giữ gần gũi?", "words": ["go out with", "break up", "come around", "get on with", "linger"], "why": "Kể họ quen nhau ra sao, nêu một khó khăn (có thể suýt chia tay) rồi nói điều giúp họ hòa hợp; dùng although/which để nối ý.", "sample": "My cousin Lan and her husband are a great example. They started to go out with each other at university, although their families thought they were too young. At one point they almost decided to break up because of long working hours. However, they talked honestly, and now they get on with each other better than ever. Friends often come around at weekends, and the evening conversation usually lingers until midnight. I admire them because they solve problems calmly instead of avoiding them."}, {"type": "sp", "ctx": "Health", "s": "Talk about how people can look after their body and notice early signs of illness. What habits do you think matter most?", "vi": "Hãy nói về cách chăm sóc cơ thể và nhận ra dấu hiệu bệnh sớm. Theo bạn thói quen nào quan trọng nhất?", "words": ["bladder", "rectum", "linger"], "why": "Nêu 2-3 thói quen (uống đủ nước, ăn chất xơ, đi khám), giải thích lý do; dùng linger khi nói triệu chứng kéo dài.", "sample": "In my opinion, drinking enough water is the simplest habit, because it protects the bladder from infections. Eating vegetables and fibre also helps the digestive system, including the rectum, to work properly. People should not ignore symptoms that linger for more than two weeks, such as pain or a cough. Although many of us are afraid of hospitals, an early check-up usually costs less than treating a serious problem later. As a result, I try to visit my doctor once a year and follow his advice."}, {"type": "sp", "ctx": "Home", "s": "Describe the living room or study space that you find most comfortable. What furniture does it have, and why does it suit you?", "vi": "Hãy tả phòng khách hoặc góc học tập bạn thấy thoải mái nhất. Có đồ đạc gì và vì sao hợp với bạn?", "words": ["front door", "a firm armchair", "a carpeted room"], "why": "Đi từ cửa chính vào phòng, tả đồ đạc, sàn và lý do bạn thấy dễ chịu (lưng, ánh sáng, yên tĩnh).", "sample": "When you open the front door of my flat, the first thing you see is a small living room. It is a carpeted room, so it feels warm even in winter. My favourite piece of furniture is a firm armchair next to the window, which supports my back when I read. Although the room is not big, it has enough space for a bookshelf and a low table. I find it comfortable because it is quiet, tidy and full of natural light."}, {"type": "sp", "ctx": "Work and clothes", "s": "Do you think people should wear smart clothes at work? Explain what you wear at work or at school and why.", "vi": "Bạn có nghĩ nên mặc đồ chỉnh tề đi làm không? Hãy nói bạn mặc gì đi làm hoặc đi học và vì sao.", "words": ["smart", "smartly dressed", "well-dressed", "stylish", "casual", "suit", "tie", "wear"], "why": "Nêu quan điểm, so sánh đồ chỉnh tề và thường ngày, cho ví dụ nghề nghiệp, rồi kết luận.", "sample": "I believe that smart clothes are important in jobs where you meet clients. When I visit customers, I wear a suit and a tie because people trust someone who is smartly dressed. However, in the office I prefer casual clothes, whereas some colleagues like looking stylish every day. A well-dressed team can create a professional image, but comfort also matters for productivity. In short, I think companies should allow flexibility, as long as employees dress sensibly for important meetings."}, {"type": "sp", "ctx": "Weekend and weather", "s": "What do you usually wear in cold weather, and what do you do before you leave home on a winter morning?", "vi": "Bạn thường mặc gì khi trời lạnh và làm gì trước khi ra khỏi nhà vào buổi sáng mùa đông?", "words": ["top", "tights", "boots", "scarf", "jumper", "trainers", "cap", "get dressed", "put on", "take off", "change into"], "why": "Kể trình tự buổi sáng: thức dậy, mặc đồ, thêm lớp áo; nói cả lúc về nhà thay đồ.", "sample": "On a cold morning I get dressed quickly because the house is freezing. First I put on a warm top and a thick jumper, and my sister usually adds tights under her skirt. Then I wrap a scarf around my neck and choose boots if it is raining. At weekends I prefer trainers and a cap for a walk. When I get home, I take off my wet coat and change into comfortable clothes, which makes me feel relaxed."}, {"type": "sp", "ctx": "Shopping for clothes", "s": "Tell me about the last time you bought clothes or accessories. What did you look for, and how did you decide?", "vi": "Hãy kể lần gần nhất bạn mua quần áo hoặc phụ kiện. Bạn tìm gì và quyết định thế nào?", "words": ["earring", "necklace", "bracelet", "sleeve", "button", "pocket", "zip", "do up", "undo", "look good in", "suit"], "why": "Kể món đã mua, kiểm tra chi tiết (tay áo, túi, khóa), hỏi ý kiến người khác và lý do chọn.", "sample": "Last month I bought a jacket for my sister's wedding. I checked every detail: the sleeves were a little long, but the tailor shortened them. I liked the deep pocket and the strong zip, which was easy to do up and undo. My wife said I look good in dark blue, and a colour that suits you really matters. For her, I also bought a bracelet, while she chose a pair of earrings and a necklace herself. Overall I was satisfied because everything was reasonably priced."}, {"type": "sp", "ctx": "Cooking and food", "s": "Do you enjoy cooking? Describe a dish or a type of food that your family likes and say who prepares it.", "vi": "Bạn có thích nấu ăn không? Hãy tả một món gia đình thích và nói ai nấu.", "words": ["be good at cooking", "mussel", "scallop", "barley"], "why": "Giới thiệu người nấu giỏi, nguyên liệu (hải sản, ngũ cốc), cách nấu và cảm nhận của gia đình.", "sample": "My sister-in-law is really good at cooking seafood, so she usually prepares our family dinners. Her favourite dish is mussels steamed with garlic, and sometimes she grills scallops with butter. In winter she also makes a soup with beef and barley, which keeps everyone warm. Although I'm not as talented as she is, I help by washing the vegetables. What I enjoy most is eating together, because we can talk without looking at our phones."}, {"type": "sp", "ctx": "Money", "s": "How can people prepare for unexpected expenses? Talk about saving, banks and your own habits.", "vi": "Làm sao để chuẩn bị cho chi phí bất ngờ? Hãy nói về tiết kiệm, ngân hàng và thói quen của bạn.", "words": ["put money away for a rainy day", "for a period of time", "financial institution", "pay interest on"], "why": "Nêu lý do cần để dành, cách gửi tiết kiệm ở ngân hàng, lãi suất và thói quen cá nhân.", "sample": "I try to put money away for a rainy day every month, because expenses can appear without warning. I keep part of my salary in a savings account at a financial institution that pays interest on the deposit. Some accounts require you to leave the money there for a period of time, which means you cannot spend it impulsively. Although the interest rate is small, I feel safer knowing that I have a reserve. In my opinion, saving regularly is more important than earning a high salary."}, {"type": "sp", "ctx": "Public transport", "s": "Talk about public transport in your city. What kinds of vehicles do you see, and how much do people pay?", "vi": "Hãy nói về giao thông công cộng ở thành phố bạn. Có những phương tiện nào và người ta trả bao nhiêu?", "words": ["lorry", "van", "pilot", "fare", "bus fare", "airfare", "get on", "get off", "catch the bus", "miss the bus"], "why": "Mô tả phương tiện (xe buýt, xe tải, xe van), giá vé tăng, thói quen đi lại và kết luận.", "sample": "In my city most people catch the bus to work, and the bus fare has increased recently. Large lorries are not allowed in the centre at rush hour, but vans still deliver goods early in the morning. I usually get on near my house and get off at the university. If I miss the bus, I wait twenty minutes. For longer trips, the airfare is expensive, so I rarely meet a pilot except on the news. I hope the council will improve services."}, {"type": "sp", "ctx": "Travel", "s": "Describe a journey you made by train, plane or car. How did you travel, and what happened on the way?", "vi": "Hãy tả một chuyến đi bằng tàu, máy bay hoặc ô tô. Bạn đi thế nào và có chuyện gì xảy ra trên đường?", "words": ["go by", "fly", "get into", "get out of", "catch the train", "come along"], "why": "Kể chuyến đi theo trình tự: chọn phương tiện, lên xe, sự việc bất ngờ, kết thúc; dùng although/so that.", "sample": "Last summer my friends and I decided to go by train instead of driving, so that we could enjoy the scenery. We caught the train at dawn, and later we had to fly for the final part because the railway was closed. At the airport a taxi came along, and we got into it quickly because it was raining. When we got out of the taxi at the hotel, everyone was exhausted but happy. It was tiring, yet I still remember the journey with pleasure."}]}]};

    let f=3.5+(n>=25?.5:0)+(n>=45?.5:0)+(n>=70?.5:0)+(n>=100?.5:0)+Math.min(1.5,conn.length*.3);
    if(wpm!==null)f+=(wpm>=100&&wpm<=170)?1:(wpm>=80&&wpm<100)?.5:wpm<60?-.5:0;
    f-=Math.min(1.5,.25*Math.max(0,fill+rep-1));
    if(n<20)f=Math.min(f,4.5);
    /* Lexical Resource */
    const uniq=new Set(T.map(stem)).size,ttr=n?uniq/n:0;
    const adv=T.filter(w=>w.length>=8).length,advr=n?adv/n:0;
    let l=3.5+1.5*Math.min(1,used.length/need)+(used.length>need?.5:0)+(n>=30&&ttr>=.6?.5:0)+(n>=30&&ttr>=.7?.5:0)+(advr>=.06?.5:0)+(advr>=.1?.5:0);
    if(n<20)l=Math.min(l,4.5);
    /* Grammatical Range & Accuracy */
    const cats=GR.filter(g=>g[1].test(low)).map(g=>g[0]);
    const errs=[];
    ERR.forEach(e=>{const m=low.match(e[0]);if(m)m.forEach(x=>errs.push({s:x,w:e[1]}));});
    let g=3.5+Math.min(2.4,cats.length*.4)+(n>=45?.5:0)+(n>=80?.5:0)-Math.min(2,errs.length*.5);
    if(n<20)g=Math.min(g,4.5);
    /* Pronunciation (recognition confidence) */
    const cs=segs.filter(s=>typeof s.c==='number'&&s.c>0);
    let p=null,pm=null;
    if(cs.length){
      let wsum=0,tot=0;cs.forEach(s=>{const k=Math.max(1,toks(s.t).length);wsum+=s.c*k;tot+=k;});
      pm=wsum/tot;
      p=pm>=.95?7.5:pm>=.9?7:pm>=.85?6.5:pm>=.8?6:pm>=.7?5.5:pm>=.6?5:pm>=.5?4.5:4;
      if(n<20)p=Math.min(p,5);
    }
    const lowSegs=cs.filter(s=>s.c<.75&&toks(s.t).length>=2).map(s=>s.t);
    const bands={f:half(f),l:half(l),g:half(g),p:p===null?null:half(p)};
    const av=[bands.f,bands.l,bands.g,bands.p].filter(x=>x!==null);
    const overall=half(av.reduce((a,b)=>a+b,0)/av.length);
    return {text,n,dur:Math.round(dur),wpm,used,missing:(q.words||[]).filter(w=>!used.includes(w)),conn,fill,rep,ttr:Math.round(ttr*100),adv,cats,errs:errs.slice(0,4),pm:pm===null?null:Math.round(pm*100),lowSegs:lowSegs.slice(0,3),bands,overall};
  }
  function adviceF(r){
    const a=[r.dur?`Bạn nói khoảng ${r.n} từ trong ${r.dur}s${r.wpm?` (≈ ${r.wpm} từ/phút)`:''}.`:`Bài gõ có khoảng ${r.n} từ (không đo được tốc độ nói).`];
    a.push(r.conn.length?`Từ nối đã dùng: ${r.conn.slice(0,5).join(', ')}.`:'Chưa thấy từ nối rõ ràng; thử dùng because, however, for example, as a result để ý tưởng liền mạch.');
    if(r.fill+r.rep>1)a.push(`Có ${r.fill} từ đệm và ${r.rep} lần lặp từ; hãy ngừng lặng ngắn thay vì “um/uh”.`);
    if(r.n<45)a.push('Câu trả lời còn ngắn; hướng tới 60–90 từ (30–45 giây) với 1 ý chính + 1 ví dụ.');
    return a.join(' ');
  }
  function adviceL(r){
    const a=[`Dùng ${r.used.length}/${r.used.length+r.missing.length} từ gợi ý${r.used.length?': '+r.used.join(', '):''}.`];
    if(r.missing.length)a.push(`Chưa dùng: ${r.missing.slice(0,5).join(', ')}.`);
    a.push(`Độ đa dạng từ ${r.ttr}%, từ dài/học thuật ${r.adv}.`);
    return a.join(' ');
  }
  function adviceG(r){
    const a=[r.cats.length?`Cấu trúc đa dạng: ${r.cats.join(', ')}.`:'Gần như chỉ dùng câu đơn; thử thêm mệnh đề quan hệ (which/who), câu điều kiện hoặc although/whereas.'];
    if(r.errs.length)a.push('Cần xem lại: '+r.errs.map(e=>`“${e.s}” (${e.w})`).join('; ')+'.');
    else a.push('Không phát hiện lỗi ngữ pháp phổ biến bằng quy tắc tự động.');
    return a.join(' ');
  }
  function adviceP(r){
    if(r.pm===null&&!r.dur)return 'Bài gõ nên chưa chấm được phát âm; hãy ghi âm để được chấm.';
    if(r.pm===null)return 'Trình duyệt này không có nhận dạng giọng nói nên chưa chấm được phát âm. Hãy mở bằng Chrome/Edge/Safari.';
    const a=[`Máy nhận ra lời bạn với độ chắc chắn ≈ ${r.pm}%.`];
    if(r.lowSegs.length)a.push('Đoạn nghe chưa rõ: “'+r.lowSegs.join('”, “')+'” — nghe lại phát âm mẫu và đọc chậm, rõ trọng âm.');
    else a.push('Phát âm được nhận ra rõ.');
    return a.join(' ');
  }
  function spCard(q){
    const st=state[q.id];
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const used=st&&st.r?st.r.used:[];
    const chips=(q.words||[]).map(w=>`<span class="chip${used.includes(w)?' used':''}">${esc(w)}<button type="button" class="say" data-word="${esc(w)}" aria-label="Phát âm ${esc(w)}" style="padding:0 4px;border:0;background:none">${icon}</button></span>`).join('');
    const busy=R&&R.id===q.id;
    let res='';
    if(st&&st.r){
      const r=st.r,b=r.bands;
      const bandBox=(name,v,adv)=>`<div class="band"><b>${name}</b><span class="n">${v===null?'—':fmt(v)}</span><p>${esc(adv)}</p></div>`;
      res=`<div class="spres" role="status">${urls[q.id]?`<audio controls src="${urls[q.id]}"></audio>`:''}<p class="tr">“${esc(r.text)}”</p>`+
        `<p class="overall">Điểm ước tính (thang IELTS 1–8)<span class="n">${fmt(r.overall)}</span></p><div class="bands">`+
        bandBox('Độ trôi chảy và mạch lạc (Fluency &amp; Coherence)',b.f,adviceF(r))+
        bandBox('Vốn từ vựng (Lexical Resource)',b.l,adviceL(r))+
        bandBox('Độ đa dạng và chính xác ngữ pháp (Grammatical Range &amp; Accuracy)',b.g,adviceG(r))+
        bandBox('Phát âm (Pronunciation)',b.p,adviceP(r))+`</div>`+
        `<p class="disc">Điểm do trình duyệt ước tính từ văn bản nhận dạng được (tốc độ, từ nối, từ vựng, cấu trúc, độ rõ giọng), chỉ để tham khảo, không thay thế giám khảo/giáo viên. Bản ghi âm chỉ nằm trên máy bạn, không được gửi đi.</p>`+
        `<button type="button" class="ghost retry" data-retry="${q.id}">Ghi âm lại</button></div>`;
    }
    const sample=q.sample?`<details class="sample"><summary>Xem bài nói mẫu (B2)</summary><p>${esc(q.sample)}</p></details>`:'';
    return `<article class="q sp" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div>`+
      `<p class="sent">${esc(q.s)}</p><p class="vi">${esc(q.vi)}</p>`+
      `<div class="spwords"><b>Từ nên dùng:</b> ${chips}</div>`+
      `<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu hỏi ${q.n}">${icon}Nghe câu hỏi</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button></div>`+
      `<div class="rec"><button type="button" class="recbtn" data-rec="${q.id}" ${busy?'disabled':''}>● Ghi âm</button><button type="button" class="recbtn stop" data-recstop="${q.id}" ${busy?'':'disabled'}>■ Dừng &amp; chấm điểm</button><span class="rectime" id="rt-${q.id}">${busy?'':'Nói 30–60 giây, cố dùng ≥ 3 từ gợi ý'}</span><span class="recmsg" id="rm-${q.id}"></span></div>`+
      `<details class="manual"><summary>Không ghi âm được? Gõ lại lời bạn nói để chấm</summary><textarea id="mt-${q.id}" placeholder="Gõ nội dung bạn đã nói…"></textarea><button type="button" class="ghost" data-manual="${q.id}">Chấm bài gõ (không chấm phát âm)</button></details>`+
      res+sample+`</article>`;
  }
  function recMsg(id,m){const e=$('rm-'+id);if(e)e.textContent=m||'';}
  async function startRec(id){
    if(R)return;
    stopAudio();
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
    catch(e){recMsg(id,'Không truy cập được micro. Hãy cho phép micro cho trang này hoặc dùng ô gõ bên dưới.');return;}
    const chunks=[];let mr=null;
    try{mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};mr.start();}catch(e){mr=null;}
    const segs=[];let rec=null;
    R={id,stream,mr,chunks,segs,t0:Date.now(),active:true,rec:null,timer:null};
    if(SRC){
      rec=new SRC();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=ev=>{
        let interim='';
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const r=ev.results[i];
          if(r.isFinal)segs.push({t:r[0].transcript.trim(),c:r[0].confidence});else interim+=r[0].transcript;
        }
        recMsg(id,interim?'… '+interim:'');
      };
      rec.onerror=()=>{};
      rec.onend=()=>{if(R&&R.active&&R.rec===rec){try{rec.start();}catch(e){}}};
      R.rec=rec;try{rec.start();}catch(e){}
    }else recMsg(id,'Trình duyệt không hỗ trợ nhận dạng giọng nói: bài sẽ được ghi âm nhưng cần gõ lại lời nói để chấm.');
    const tick=()=>{const e=$('rt-'+id);if(e&&R)e.textContent='● '+Math.round((Date.now()-R.t0)/1000)+' giây';};
    R.timer=setInterval(tick,500);tick();
    const b1=document.querySelector(`[data-rec="${id}"]`),b2=document.querySelector(`[data-recstop="${id}"]`);
    if(b1)b1.disabled=true;if(b2)b2.disabled=false;
  }
  function stopRec(id){
    if(!R||R.id!==id)return;
    const cur=R;cur.active=false;clearInterval(cur.timer);
    const dur=(Date.now()-cur.t0)/1000;
    recMsg(id,'Đang chấm điểm…');
    try{cur.rec&&cur.rec.stop();}catch(e){}
    const finish=()=>{
      cur.stream.getTracks().forEach(t=>t.stop());
      if(cur.chunks.length){urls[id]&&URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(new Blob(cur.chunks,{type:(cur.mr&&cur.mr.mimeType)||'audio/webm'}));}
      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
