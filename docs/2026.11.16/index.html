/* Layout: one narrow reading column, sticky section tabs, one question card at a time per row. */
:root{
  --bg:#F2F6F8; --surface:#FFFFFF; --ink:#12263A; --muted:#566879; --line:#D3DDE5;
  --primary:#0E5A78; --primary-ink:#FFFFFF; --hl:#E6F36E; --hl-ink:#12263A;
  --good:#1B7448; --good-bg:#DDF2E5; --bad:#A93420; --bad-bg:#FBE4DD; --soft:#E7EFF4;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
    --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
    --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .tag{font-weight:700;margin-right:8px}
.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}
.manual summary{cursor:pointer;color:var(--muted)}
.manual textarea{width:100%;min-height:90px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.band .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--primary)}
.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

ding", "s": "The chef explained that the soup tastes best if you stir in a little cream just before serving. If you add it earlier, it can separate and look unattractive. What does “just before serving” mean?", "say": "The chef explained that the soup tastes best if you stir in a little cream just before serving. If you add it earlier, it can separate and look unattractive.", "o": ["ngay sau khi nấu xong và để qua đêm", "lâu sau khi dọn món", "ngay trước khi dùng/dọn món"], "a": "ngay trước khi dùng/dọn món", "tw": "just before serving", "vi": "Đầu bếp giải thích súp ngon nhất nếu khuấy chút kem ngay trước khi dọn. Thêm sớm hơn thì có thể bị tách và trông kém hấp dẫn.", "why": "If you add it earlier => thời điểm đúng là sát lúc dọn.", "new": [{"w": "stir", "vi": "khuấy"}, {"w": "separate", "vi": "tách ra"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "In Vietnam, a plate of fresh basil often arrives with a bowl of hot noodles. The herb has a strong, sweet smell, and diners tear a few leaves into the soup. What does “basil” mean?", "say": "In Vietnam, a plate of fresh basil often arrives with a bowl of hot noodles. The herb has a strong, sweet smell, and diners tear a few leaves into the soup.", "o": ["rau húng quế", "hành tím", "giá đỗ"], "a": "rau húng quế", "tw": "basil", "vi": "Ở Việt Nam, đĩa húng quế tươi thường đi kèm tô mì nóng. Loại rau thơm này có mùi ngọt đậm và thực khách xé vài lá vào canh.", "why": "herb with strong sweet smell, leaves = húng quế.", "ipa": "/ˈbeɪ.zəl/", "new": [{"w": "diner", "vi": "thực khách"}, {"w": "herb", "vi": "rau thơm"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Hung peeled a dozen shallots before dinner. They are small purple bulbs that bring a sweeter flavour than white onions, so they are common in Vietnamese cooking. What does “shallots” mean?", "say": "Hung peeled a dozen shallots before dinner. They are small purple bulbs that bring a sweeter flavour than white onions, so they are common in Vietnamese cooking.", "o": ["tỏi củ lớn", "hành tím, hành khô", "gừng tươi"], "a": "hành tím, hành khô", "tw": "shallot", "vi": "Hùng gọt một chục củ hành tím trước bữa tối. Chúng là những củ nhỏ màu tím có vị ngọt hơn hành trắng nên phổ biến trong món Việt.", "why": "small purple bulbs sweeter than white onions = shallot.", "ipa": "/ʃəˈlɑːt/", "new": [{"w": "peel", "vi": "gọt vỏ"}, {"w": "dozen", "vi": "một tá"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Bao added a few drops of soy sauce to the fried rice. The dark liquid made the dish taste saltier and gave the rice a rich brown colour. What does “soy sauce” mean?", "say": "Bao added a few drops of soy sauce to the fried rice. The dark liquid made the dish taste saltier and gave the rice a rich brown colour.", "o": ["giấm gạo", "sữa dừa", "nước tương, xì dầu"], "a": "nước tương, xì dầu", "tw": "soy sauce", "vi": "Bảo thêm vài giọt nước tương vào cơm chiên. Chất lỏng sẫm màu làm món mặn hơn và cho cơm màu nâu đậm.", "why": "dark liquid + saltier + brown rice = nước tương.", "ipa": "/ˈsɔɪ ˌsɔːs/", "new": [{"w": "drop", "vi": "giọt"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Hana always carries a small first-aid kit in her rucksack in case someone gets hurt on the trail. She says it is better to be prepared than to regret it later. What does “in case” mean?", "say": "Hana always carries a small first-aid kit in her rucksack in case someone gets hurt on the trail. She says it is better to be prepared than to regret it later.", "o": ["phòng khi, trong trường hợp", "miễn là", "mặc dù"], "a": "phòng khi, trong trường hợp", "tw": "in case", "vi": "Hana luôn mang bộ sơ cứu nhỏ trong ba lô phòng khi ai đó bị thương trên đường mòn. Cô nói chuẩn bị còn hơn hối tiếc sau.", "why": "better to be prepared => phòng khi.", "new": [{"w": "first-aid kit", "vi": "bộ sơ cứu"}, {"w": "trail", "vi": "đường mòn"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Parents agreed that their son could go camping with friends, provided that he phoned home every evening and stayed with the group at all times. What does “provided that” mean?", "say": "Parents agreed that their son could go camping with friends, provided that he phoned home every evening and stayed with the group at all times.", "o": ["mặc dù", "với điều kiện là", "bởi vì"], "a": "với điều kiện là", "tw": "provided that", "vi": "Cha mẹ đồng ý cho con trai đi cắm trại với bạn, với điều kiện cậu gọi về mỗi tối và luôn ở cùng nhóm.", "why": "điều kiện được cho phép = provided that.", "new": [{"w": "camping", "vi": "cắm trại"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Mr Khoa says that people can park in front of the shop as long as they leave within thirty minutes. After that, he phones the police to move the car. What does “as long as” mean?", "say": "Mr Khoa says that people can park in front of the shop as long as they leave within thirty minutes. After that, he phones the police to move the car.", "o": ["ngay khi", "dù cho", "miễn là, với điều kiện"], "a": "miễn là, với điều kiện", "tw": "as long as", "vi": "Ông Khoa nói mọi người có thể đỗ xe trước cửa hàng miễn là đi trong vòng ba mươi phút. Sau đó ông gọi cảnh sát dời xe.", "why": "điều kiện về thời gian = as long as.", "new": [{"w": "park", "vi": "đỗ xe"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "On the plane, a father wanted to sit next to his daughter, so he asked the man beside her to swap places. The man agreed and moved to the aisle seat. What does “swap places” mean?", "say": "On the plane, a father wanted to sit next to his daughter, so he asked the man beside her to swap places. The man agreed and moved to the aisle seat.", "o": ["đổi chỗ ngồi cho nhau", "giữ nguyên chỗ", "đặt trước chỗ"], "a": "đổi chỗ ngồi cho nhau", "tw": "swap places (with somebody)", "vi": "Trên máy bay, một người cha muốn ngồi cạnh con gái nên nhờ người đàn ông bên cạnh cô bé đổi chỗ. Người đó đồng ý và chuyển sang ghế gần lối đi.", "why": "moved to the aisle seat = đổi chỗ.", "ipa": "/swɒp ˈpleɪsɪz/", "new": [{"w": "aisle", "vi": "lối đi giữa các hàng ghế"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The academic year in Vietnam usually starts in early September and ends in late May. During that time, students have exams, a short break at Tet and a long holiday in summer. What does “academic year” mean?", "say": "The academic year in Vietnam usually starts in early September and ends in late May. During that time, students have exams, a short break at Tet and a long holiday in summer.", "o": ["năm tài chính", "năm học", "kỳ nghỉ hè"], "a": "năm học", "tw": "academic year", "vi": "Năm học ở Việt Nam thường bắt đầu đầu tháng Chín và kết thúc cuối tháng Năm. Trong thời gian đó học sinh có kỳ thi, nghỉ Tết ngắn và nghỉ hè dài.", "why": "starts September, ends May, students, exams = năm học.", "ipa": "/ˌæk.əˈdem.ɪk ˈjɪə/", "new": [{"w": "break", "vi": "kỳ nghỉ ngắn"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Maya started the school year with a resolution to hand in every assignment on time. She bought a planner and wrote each deadline on the first page. What does “started the school year with a resolution to hand in every assignment on time” mean?", "say": "Maya started the school year with a resolution to hand in every assignment on time. She bought a planner and wrote each deadline on the first page.", "o": ["kết thúc bằng lời xin lỗi vì nộp muộn", "bắt đầu một cuộc tranh luận về bài tập", "bắt đầu với quyết tâm nộp mọi bài đúng hạn"], "a": "bắt đầu với quyết tâm nộp mọi bài đúng hạn", "tw": "start with a resolution", "vi": "Maya bắt đầu năm học với quyết tâm nộp mọi bài tập đúng hạn. Cô mua sổ kế hoạch và ghi mỗi hạn chót vào trang đầu.", "why": "resolution = quyết tâm, quyết định mạnh mẽ.", "ipa": "/ˌrez.əˈluː.ʃən/", "new": [{"w": "assignment", "vi": "bài tập"}, {"w": "planner", "vi": "sổ kế hoạch"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Many gym members promise to exercise daily, but only a few keep their resolution after February. Experts say that small, realistic goals help people stay motivated. What does “keep their resolution” mean?", "say": "Many gym members promise to exercise daily, but only a few keep their resolution after February. Experts say that small, realistic goals help people stay motivated.", "o": ["giữ vững quyết tâm", "phá bỏ lời hứa", "đưa ra lời xin lỗi"], "a": "giữ vững quyết tâm", "tw": "keep your resolution", "vi": "Nhiều hội viên phòng gym hứa tập mỗi ngày nhưng chỉ ít người giữ được quyết tâm sau tháng Hai. Chuyên gia nói mục tiêu nhỏ, thực tế giúp người ta có động lực.", "why": "only a few ... after February = giữ được quyết tâm.", "ipa": "/kiːp jɔː ˌrez.əˈluː.ʃən/", "new": [{"w": "motivated", "vi": "có động lực"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Sensory memory works like a very short recording of what our eyes and ears have just received. If we don't pay attention to it, the information disappears within seconds. What does “Sensory memory” mean?", "say": "Sensory memory works like a very short recording of what our eyes and ears have just received. If we don't pay attention to it, the information disappears within seconds.", "o": ["trí nhớ dài hạn", "trí nhớ giác quan", "khả năng sáng tạo"], "a": "trí nhớ giác quan", "tw": "sensory memory", "vi": "Trí nhớ giác quan hoạt động như bản ghi rất ngắn về thứ mắt và tai vừa nhận. Nếu không chú ý, thông tin biến mất trong vài giây.", "why": "very short recording of eyes and ears = sensory memory.", "ipa": "/ˈsen.sər.i ˈmem.ər.i/", "new": [{"w": "pay attention", "vi": "chú ý"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The waiter wrote nothing down, yet he remembered our order of seven dishes. He told us that his short-term memory is good, but he forgets the orders as soon as the customers leave. What does “short-term memory” mean?", "say": "The waiter wrote nothing down, yet he remembered our order of seven dishes. He told us that his short-term memory is good, but he forgets the orders as soon as the customers leave.", "o": ["trí nhớ dài hạn", "trí nhớ giác quan", "trí nhớ ngắn hạn"], "a": "trí nhớ ngắn hạn", "tw": "short-term memory", "vi": "Người phục vụ không ghi gì nhưng nhớ đơn bảy món của chúng tôi. Anh nói trí nhớ ngắn hạn của mình tốt, nhưng quên các đơn ngay khi khách rời đi.", "why": "forgets as soon as customers leave = ngắn hạn.", "ipa": "/ˌʃɔːt tɜːm ˈmem.ər.i/", "new": [{"w": "order", "vi": "đơn gọi món"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "If you review new words after one day, one week and one month, they are more likely to move into your long-term memory. That means you can still use them a year later. What does “long-term memory” mean?", "say": "If you review new words after one day, one week and one month, they are more likely to move into your long-term memory. That means you can still use them a year later.", "o": ["trí nhớ dài hạn", "trí nhớ ngắn hạn", "thời gian rảnh dài"], "a": "trí nhớ dài hạn", "tw": "long-term memory", "vi": "Nếu ôn từ mới sau một ngày, một tuần và một tháng, chúng dễ chuyển vào trí nhớ dài hạn. Nghĩa là một năm sau bạn vẫn dùng được.", "why": "still use a year later = dài hạn.", "ipa": "/ˌlɒŋ tɜːm ˈmem.ər.i/", "new": [{"w": "review", "vi": "ôn tập"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Trust is the key component of any successful team. Without it, even talented people struggle to share ideas, and projects are often delayed. What does “component” mean?", "say": "Trust is the key component of any successful team. Without it, even talented people struggle to share ideas, and projects are often delayed.", "o": ["kết quả cuối cùng", "thành phần, yếu tố cấu thành", "lời phàn nàn"], "a": "thành phần, yếu tố cấu thành", "tw": "component", "vi": "Sự tin tưởng là yếu tố then chốt của mọi đội nhóm thành công. Thiếu nó, ngay cả người giỏi cũng khó chia sẻ ý tưởng và dự án hay bị trễ.", "why": "key component = yếu tố quan trọng cấu thành.", "ipa": "/kəmˈpəʊ.nənt/", "new": [{"w": "talented", "vi": "có tài"}, {"w": "delay", "vi": "trì hoãn"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Visitors at the museum take in a lot of information from the displays. Colourful photos and short videos make it easier to understand history. What does “take in” mean?", "say": "Visitors at the museum take in a lot of information from the displays. Colourful photos and short videos make it easier to understand history.", "o": ["mang đi mất", "từ chối", "tiếp nhận, tiếp thu"], "a": "tiếp nhận, tiếp thu", "tw": "take in something from", "vi": "Khách tham quan bảo tàng tiếp nhận nhiều thông tin từ các màn trưng bày. Ảnh nhiều màu và video ngắn giúp hiểu lịch sử dễ hơn.", "why": "easier to understand => tiếp thu thông tin.", "ipa": "/teɪk ɪn/", "new": [{"w": "display", "vi": "màn trưng bày"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "In a busy warehouse, parcels first go to a holding area. Workers sort them there, and only later do they load them onto the right trucks. What does “holding area” mean?", "say": "In a busy warehouse, parcels first go to a holding area. Workers sort them there, and only later do they load them onto the right trucks.", "o": ["khu vực tạm lưu giữ", "kho lạnh lâu dài", "cửa hàng bán lẻ"], "a": "khu vực tạm lưu giữ", "tw": "holding area", "vi": "Trong kho bận rộn, bưu kiện đầu tiên được đưa đến khu tạm giữ. Công nhân phân loại ở đó, rồi sau mới chất lên xe tải đúng.", "why": "only later load = nơi chờ tạm thời.", "ipa": "/ˈhəʊl.dɪŋ ˈeə.ri.ə/", "new": [{"w": "warehouse", "vi": "nhà kho"}, {"w": "sort", "vi": "phân loại"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "To put new information into your memory, link it with something you already know. For example, imagine the new word in a funny picture. What does “put new information into your memory” mean?", "say": "To put new information into your memory, link it with something you already know. For example, imagine the new word in a funny picture.", "o": ["xóa thông tin khỏi trí nhớ", "đưa/lưu thông tin mới vào trí nhớ", "chia sẻ thông tin với bạn"], "a": "đưa/lưu thông tin mới vào trí nhớ", "tw": "put something into something", "vi": "Để đưa thông tin mới vào trí nhớ, hãy gắn nó với điều bạn đã biết. Ví dụ, hình dung từ mới trong một bức tranh vui.", "why": "link it with something you know = đưa vào trí nhớ.", "ipa": "/ˈɪn.tuː/", "new": [{"w": "link", "vi": "liên kết"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Teachers want students to transfer what they learn in class into real situations. For instance, after studying the past tense, they tell a story about their weekend. What does “transfer” mean?", "say": "Teachers want students to transfer what they learn in class into real situations. For instance, after studying the past tense, they tell a story about their weekend.", "o": ["sao chép nguyên văn", "quên đi", "chuyển, áp dụng vào"], "a": "chuyển, áp dụng vào", "tw": "transfer something into something", "vi": "Giáo viên muốn học sinh chuyển điều học trên lớp vào tình huống thực. Ví dụ, sau khi học thì quá khứ, họ kể câu chuyện về cuối tuần.", "why": "tell a story about weekend = áp dụng kiến thức vào thực tế.", "ipa": "/trænsˈfɜːr ˈɪn.tuː/", "new": [{"w": "situation", "vi": "tình huống"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "One of the key points for effective study is to take short breaks. After about forty minutes of concentration, the brain needs a few minutes to rest. What does “key points for effective study” mean?", "say": "One of the key points for effective study is to take short breaks. After about forty minutes of concentration, the brain needs a few minutes to rest.", "o": ["những điểm chính để học hiệu quả", "lịch thi cuối kỳ", "các loại sách giáo khoa"], "a": "những điểm chính để học hiệu quả", "tw": "key points for effective study", "vi": "Một trong những điểm chính để học hiệu quả là nghỉ ngắn. Sau khoảng bốn mươi phút tập trung, não cần vài phút nghỉ.", "why": "take short breaks = lời khuyên học tập.", "ipa": "/kiː pɔɪnts fər ɪˈfek.tɪv ˈstʌd.i/", "new": [{"w": "concentration", "vi": "sự tập trung"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The neighbours made an effort to welcome the new family. They brought homemade cakes and offered to show them around the area. What does “made an effort” mean?", "say": "The neighbours made an effort to welcome the new family. They brought homemade cakes and offered to show them around the area.", "o": ["bỏ đi không nói", "cố gắng, nỗ lực", "phàn nàn"], "a": "cố gắng, nỗ lực", "tw": "make an effort", "vi": "Hàng xóm đã nỗ lực chào đón gia đình mới. Họ mang bánh tự làm và đề nghị dẫn đi tham quan khu vực.", "why": "brought cakes, offered help = có nỗ lực.", "ipa": "/meɪk ən ˈef.ət/", "new": [{"w": "homemade", "vi": "tự làm ở nhà"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The author used a funny illustration of a snail with a laptop to show how slowly the old system worked. Readers remembered the picture long after they forgot the figures. What does “illustration” mean?", "say": "The author used a funny illustration of a snail with a laptop to show how slowly the old system worked. Readers remembered the picture long after they forgot the figures.", "o": ["bản tóm tắt dài", "lời nhận xét tiêu cực", "hình minh họa"], "a": "hình minh họa", "tw": "illustration", "vi": "Tác giả dùng hình minh họa vui về con ốc sên cầm laptop để cho thấy hệ thống cũ chạy chậm thế nào. Độc giả nhớ bức tranh lâu sau khi quên số liệu.", "why": "picture of a snail = minh họa.", "ipa": "/ˌɪl.əˈstreɪ.ʃən/", "new": [{"w": "snail", "vi": "ốc sên"}, {"w": "figures", "vi": "số liệu"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Before the final test, Lan walked around her room and recited the main definitions aloud. She said that hearing her own voice helped her notice what she had forgotten. What does “recited” mean?", "say": "Before the final test, Lan walked around her room and recited the main definitions aloud. She said that hearing her own voice helped her notice what she had forgotten.", "o": ["đọc thuộc lòng", "viết lại", "dịch sang tiếng Việt"], "a": "đọc thuộc lòng", "tw": "recite", "vi": "Trước bài kiểm tra cuối, Lan đi quanh phòng và đọc thuộc các định nghĩa chính thành tiếng. Cô nói nghe giọng mình giúp nhận ra điều đã quên.", "why": "aloud + notice what she forgot = đọc thuộc.", "ipa": "/rɪˈsaɪt/", "new": [{"w": "aloud", "vi": "thành tiếng"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "When Sam moved abroad, he felt dizzy with new impressions. His host told him to give everything time to soak in before he made any big decisions. What does “give everything time to soak in” mean?", "say": "When Sam moved abroad, he felt dizzy with new impressions. His host told him to give everything time to soak in before he made any big decisions.", "o": ["xóa hết ký ức", "cho thời gian để tiếp thu, thấm dần", "ngâm quần áo trong nước"], "a": "cho thời gian để tiếp thu, thấm dần", "tw": "give something time to soak in", "vi": "Khi Sam chuyển ra nước ngoài, anh choáng ngợp với nhiều ấn tượng mới. Chủ nhà bảo anh để mọi thứ thấm dần trước khi quyết định lớn.", "why": "before big decisions = cần thời gian tiếp thu.", "ipa": "/ɡɪv ˈsʌm.θɪŋ taɪm tə səʊk ɪn/", "new": [{"w": "dizzy", "vi": "choáng váng"}, {"w": "impression", "vi": "ấn tượng"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "The professor's lectures are interesting, but the course material is difficult. Students usually have to read each chapter twice before they feel they understand it. What does “course material” mean?", "say": "The professor's lectures are interesting, but the course material is difficult. Students usually have to read each chapter twice before they feel they understand it.", "o": ["vật liệu xây dựng", "vải may áo", "tài liệu học tập, nội dung cần học"], "a": "tài liệu học tập, nội dung cần học", "tw": "material", "vi": "Bài giảng của giáo sư thú vị nhưng tài liệu khóa học khó. Sinh viên thường phải đọc mỗi chương hai lần mới thấy hiểu.", "why": "read each chapter => tài liệu học.", "ipa": "/məˈtɪə.ri.əl/", "new": [{"w": "professor", "vi": "giáo sư"}, {"w": "lecture", "vi": "bài giảng"}]}, {"type": "mc", "noblank": true, "ctx": "Short reading", "s": "Minh did not study during the semester, so he had to cram in the last two days. He read hundreds of pages in a hurry but forgot most of them a week later. What does “cram” mean?", "say": "Minh did not study during the semester, so he had to cram in the last two days. He read hundreds of pages in a hurry but forgot most of them a week later.", "o": ["học nhồi nhét", "học đều đặn mỗi ngày", "dạy kèm cho bạn"], "a": "học nhồi nhét", "tw": "cram", "vi": "Minh không học suốt học kỳ nên phải nhồi nhét trong hai ngày cuối. Cậu đọc hàng trăm trang vội vã nhưng một tuần sau quên gần hết.", "why": "in a hurry, forgot a week later = nhồi nhét.", "ipa": "/kræm/", "new": [{"w": "semester", "vi": "học kỳ"}]}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Clothes shopping", "s": "Describe a time you bought clothes or shoes. Did they fit you, and do you still wear them?", "vi": "Hãy mô tả một lần bạn mua quần áo hoặc giày. Chúng có vừa với bạn không và bạn còn mặc không?", "words": ["fit somebody", "fit well", "doesn't quite fit", "a bit tight", "loose", "suit somebody better", "hardly ever wear"], "why": "Kể: mua gì, cỡ ra sao, vấn đề (chật/rộng), cách giải quyết và hiện giờ bạn mặc thường xuyên không.", "sample": "Last spring I bought a jacket online. The first size was a bit tight around the shoulders, and the next one was too loose, so neither seemed to fit me. The third one fit well, but the colour doesn't quite fit my style, and my sister thinks a darker blue would suit me better. Honestly, I hardly ever wear it now. It cost quite a lot, so I feel a little guilty, but I have learned to try clothes on in the shop instead of trusting photos on a website."}, {"type": "sp", "ctx": "Matching outfits", "s": "Talk about how you choose clothes for a special occasion. How do you decide what to wear together?", "vi": "Hãy nói về cách bạn chọn trang phục cho dịp đặc biệt. Bạn quyết định phối đồ thế nào?", "words": ["match something", "match perfectly", "go with something", "go well with", "look good together"], "why": "Nêu dịp, cách chọn màu, món nào hợp món nào, và một ví dụ phối đồ thành công.", "sample": "For a wedding last year, I started with the dress because it was the most important item. I wanted shoes that would match it, so I took a small piece of fabric to the shop. In the end, the silver sandals matched perfectly. A simple grey jacket also went with everything I owned. White flowers go well with that colour, so I chose a small bouquet. When I looked in the mirror, the shoes, dress and jacket looked good together, and I felt confident for the whole day."}, {"type": "sp", "ctx": "Shopping decisions", "s": "Tell me about a time something you bought was not right, or you decided not to buy it. What happened?", "vi": "Hãy kể về lần món đồ bạn mua có vấn đề hoặc bạn quyết định không mua. Chuyện gì xảy ra?", "words": ["a reasonable price", "the price is reasonable", "That's a shame", "that's a pity", "It's a shame that", "What a shame", "I'll take it", "I'll leave it", "something wrong with", "give sb a refund"], "why": "Kể theo trình tự: món đồ, giá, quyết định mua hay không, vấn đề (nếu có), cách cửa hàng xử lý và cảm xúc.", "sample": "Last month I found a camera at a reasonable price, and the shop assistant said the price is reasonable for that quality, so I said, “I'll take it.” At home I noticed there was something wrong with the lens. The shop agreed to give me a refund. That's a shame, because I liked it, but it's a pity I did not check earlier. What a shame! I then saw the same model online, but it was more expensive, so I said, “I'll leave it.” It's a shame that good deals are rare."}, {"type": "sp", "ctx": "Vegetables I know", "s": "Describe a vegetable dish you like. What vegetables does it have, and how do you prepare it?", "vi": "Hãy mô tả một món rau bạn thích. Có những loại rau nào và bạn chế biến thế nào?", "words": ["eggplant", "aubergine", "radish", "daikon", "bean sprouts", "kohlrabi", "loofah"], "why": "Nêu tên món, các loại rau, cách sơ chế và nấu, hương vị, và lý do bạn thích.", "sample": "My favourite family dish is a light vegetable soup. My mother cooks young loofah with shrimp, and sometimes she adds kohlrabi for a sweet taste. For a salad, we slice radish and daikon very thinly, while a grilled eggplant, which Americans call eggplant and British people call aubergine, makes a good side dish. Just before eating, we add fresh bean sprouts for a crunchy texture. It is healthy, cheap and easy to prepare, so we eat it at least twice a week."}, {"type": "sp", "ctx": "Cooking at home", "s": "How do you add flavour when you cook? Talk about the herbs and sauces you usually use.", "vi": "Bạn làm món ăn thêm hương vị thế nào? Hãy nói về rau thơm và nước chấm bạn thường dùng.", "words": ["just before serving", "basil", "shallot", "soy sauce"], "why": "Nêu món, nguyên liệu tạo hương vị, thứ tự cho vào, lý do cho vào sát lúc dọn.", "sample": "When I cook for friends, I usually start with a chopped shallot in hot oil, because it makes the dish smell sweet and rich. After that, I add a spoonful of soy sauce and some vegetables. Fresh basil is very important, but I only add it just before serving so that it stays green and keeps its smell. My friends often ask for the recipe, but honestly, there is no secret. You only need good ingredients and a little patience."}, {"type": "sp", "ctx": "Planning ahead", "s": "Talk about a trip or an event you planned. What did you prepare, and what rules did you set?", "vi": "Hãy nói về một chuyến đi hoặc sự kiện bạn lên kế hoạch. Bạn chuẩn bị gì và đặt ra quy tắc gì?", "words": ["in case", "provided that", "as long as", "swap places"], "why": "Nêu kế hoạch, thứ chuẩn bị phòng khi, điều kiện cho mọi người tham gia, và tình huống đổi chỗ.", "sample": "Last summer I organised a day trip with my classmates. We took umbrellas and snacks in case the weather changed. I told everyone they could join provided that they paid for their ticket in advance. Also, they could bring a friend as long as the bus was not full. On the way, one student felt sick, so another girl agreed to swap places with her, and she sat by the window. It was a simple day, but it taught me that careful planning makes everyone relaxed."}, {"type": "sp", "ctx": "Where I live", "s": "Describe the area where you live now. What is good and bad about it, and has anything changed recently?", "vi": "Hãy mô tả khu vực bạn đang sống. Có điểm tốt, xấu gì và gần đây có gì thay đổi không?", "words": ["on the outskirts of", "present", "space", "tragedy", "get wild"], "why": "Nêu vị trí, nhà cửa, không gian, điều bất tiện, và một sự kiện đáng nhớ (vui hoặc buồn) ở khu bạn ở.", "sample": "I live on the outskirts of a big city, and I like it because there is more space than in the centre. My present house has a small garden where the children can play. Unfortunately, our street also has problems. Once, a fire in a neighbour's house was a real tragedy for the family, and everyone helped them. On weekends, young people sometimes get wild at the café nearby, so it can be noisy. Overall, I would not change my neighbourhood."}, {"type": "sp", "ctx": "Study goals", "s": "What goals do you set at the start of a school year? How do you make sure you follow them?", "vi": "Bạn đặt mục tiêu gì vào đầu năm học? Làm thế nào để bạn thực hiện chúng?", "words": ["academic year", "start with a resolution", "keep your resolution", "make an effort", "cram"], "why": "Nêu mục tiêu cụ thể, cách duy trì, khó khăn, và so sánh với học nhồi nhét trước kỳ thi.", "sample": "At the start of each academic year, I like to start with a resolution to study English for thirty minutes every day. It is not difficult to make a resolution, but it is hard to keep your resolution after the first month. I make an effort to follow a simple timetable and I tell my friends so that they remind me. In the past, I used to cram the night before exams, but I always forgot everything quickly, so now I study regularly."}, {"type": "sp", "ctx": "How memory works", "s": "Explain how you remember new words. What do you do, and why do you think it works?", "vi": "Hãy giải thích cách bạn ghi nhớ từ mới. Bạn làm gì và vì sao bạn nghĩ nó hiệu quả?", "words": ["sensory memory", "short-term memory", "long-term memory", "holding area", "put into", "transfer into", "give something time to soak in"], "why": "Nêu các giai đoạn của trí nhớ, cách ôn, ví dụ cụ thể và lý do cần thời gian.", "sample": "When I meet a new word, my sensory memory notices it for only a few seconds. My short-term memory is like a holding area, so I repeat the word and write a sentence. To put it into my long-term memory, I review it after a day and a week. I also try to transfer it into real conversations. Finally, I give the word time to soak in, because trying to learn everything in one night never works for me."}, {"type": "sp", "ctx": "Learning methods", "s": "What study materials and methods do you find useful? Why do they help you?", "vi": "Bạn thấy tài liệu và phương pháp học nào hữu ích? Vì sao chúng giúp bạn?", "words": ["component", "take in something from", "key points for effective study", "illustration", "recite", "material"], "why": "Nêu tài liệu hay dùng, cách tiếp thu, ví dụ minh họa, và lời khuyên chính để học hiệu quả.", "sample": "For me, an important component of learning is variety. I take in information from textbooks, videos and podcasts. The material in my textbook is clear, but an illustration or a diagram helps me understand it faster. After studying, I recite the definitions aloud to check my memory. If I follow the key points for effective study, such as short breaks and regular review, I feel much calmer. This method does not give instant results, but it works well in the long run."}]}]};

      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
