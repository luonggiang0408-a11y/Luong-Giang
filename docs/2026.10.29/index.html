*{box-sizing:border-box}

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}

button{font:inherit;color:inherit;cursor:pointer}

.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}

.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}

.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}

.say.on svg{color:var(--primary-ink)}

.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}

kịp.", "why": "pedestrian crossing = vạch sang đường cho người đi bộ (Anh-Anh); Anh-Mỹ: crosswalk.", "hint": "Nghĩa: vạch qua đường cho người đi bộ (Anh)", "new": [{"w": "nursery", "vi": "nhà trẻ"}], "tw": "pedestrian crossing", "ipa": "/pəˈdestriən ˈkrɒsɪŋ/"}, {"type": "tx", "ctx": "American suburb", "s": "The children waited at the ___ until the light turned green, and then they walked across together with their teacher.", "acc": ["crosswalk"], "vi": "Bọn trẻ đợi ở vạch sang đường đến khi đèn chuyển xanh rồi cùng đi qua với cô giáo.", "why": "crosswalk = vạch sang đường cho người đi bộ (Anh-Mỹ); Anh-Anh: pedestrian crossing.", "hint": "Nghĩa: vạch qua đường cho người đi bộ (Mỹ)", "tw": "crosswalk", "ipa": "/ˈkrɔːs.wɔːk/"}, {"type": "tx", "ctx": "Road safety class", "s": "You should always look both ways when ___ the road, and you should never use your phone while you are walking across.", "acc": ["crossing"], "vi": "Bạn nên luôn nhìn cả hai hướng khi sang đường, và không bao giờ dùng điện thoại lúc đang đi qua.", "why": "crossing the road = sang đường, băng qua đường; cross the road.", "hint": "Nghĩa: sang đường", "tw": "crossing the road"}, {"type": "tx", "ctx": "Wrong exit", "s": "I did not see the ___ because it was covered by tree branches, so I drove past the exit and had to turn back.", "acc": ["road sign"], "vi": "Tôi không thấy biển báo vì nó bị cành cây che nên tôi lái qua lối ra và phải quay lại.", "why": "road sign = biển báo giao thông; traffic sign cũng dùng.", "hint": "Nghĩa: biển báo giao thông", "new": [{"w": "branches", "vi": "cành cây"}], "tw": "road sign", "ipa": "/ˈrəʊd saɪn/"}, {"type": "tx", "ctx": "Country road", "s": "There is a ___ sign on this narrow road, so we have to stay behind the lorry even though it is moving very slowly.", "acc": ["no overtaking"], "vi": "Con đường hẹp này có biển cấm vượt nên chúng tôi phải đi sau chiếc xe tải dù nó chạy rất chậm.", "why": "no overtaking = cấm vượt (biển báo hoặc quy định); overtake = vượt xe khác.", "hint": "Nghĩa: cấm vượt", "new": [{"w": "lorry", "vi": "xe tải"}], "tw": "no overtaking", "ipa": "/ˌnəʊ ˌəʊvəˈteɪkɪŋ/"}, {"type": "tx", "ctx": "Family trip", "s": "My brother ___ a slow tractor just before the bend, which was quite dangerous, so my mother asked him to drive more carefully.", "acc": ["overtook", "overtake", "overtaken", "overtakes"], "vi": "Anh trai tôi vượt một chiếc máy kéo chạy chậm ngay trước khúc cua, khá nguy hiểm nên mẹ tôi nhờ anh lái cẩn thận hơn.", "why": "overtake sth/sb = vượt (xe khác); quá khứ overtook; quá khứ phân từ overtaken.", "hint": "Nghĩa: vượt (xe khác)", "new": [{"w": "tractor", "vi": "máy kéo"}], "tw": "overtake something/somebody", "ipa": "/ˌəʊvəˈteɪk/"}, {"type": "tx", "ctx": "Town centre", "s": "The ___ in the town centre is thirty kilometres an hour, so I drive carefully when the streets are busy with shoppers.", "acc": ["speed limit"], "vi": "Giới hạn tốc độ ở trung tâm thị trấn là ba mươi km/giờ nên tôi lái cẩn thận khi phố đông người mua sắm.", "why": "speed limit = giới hạn tốc độ (tốc độ tối đa cho phép).", "hint": "Nghĩa: giới hạn tốc độ", "tw": "speed limit", "ipa": "/ˈspiːd ˌlɪmɪt/"}, {"type": "tx", "ctx": "Weekend plan", "s": "It takes about two hours by ___, but the traffic is heavy at weekends, so we usually leave before sunrise to avoid the queues.", "acc": ["motorway"], "vi": "Đi bằng đường cao tốc mất khoảng hai tiếng nhưng cuối tuần xe rất đông nên chúng tôi thường đi trước bình minh để tránh kẹt.", "why": "motorway = đường cao tốc (Anh-Anh); Anh-Mỹ: highway/freeway.", "hint": "Nghĩa: đường cao tốc", "new": [{"w": "queues", "vi": "hàng xe nối đuôi"}], "tw": "motorway", "ipa": "/ˈməʊtəweɪ/"}, {"type": "tx", "ctx": "Motorway code", "s": "If you want to drive slowly on the motorway, stay in the ___ lane and let faster cars pass on your right-hand side.", "acc": ["inside", "slow"], "vi": "Nếu muốn lái chậm trên đường cao tốc, hãy ở làn trong và để xe nhanh hơn vượt bên phải bạn.", "why": "inside lane = làn gần lề/làn chậm trên đường cao tốc (Anh); outside lane = làn nhanh.", "hint": "Nghĩa: làn trong (làn chạy chậm)", "tw": "inside (slow) lane", "ipa": "/ˌɪnsaɪd ˈsləʊ leɪn/"}, {"type": "tx", "ctx": "Motorway code", "s": "He moved into the ___ lane to overtake the lorry, and then returned to his original position once the road ahead was clear.", "acc": ["outside", "fast"], "vi": "Anh chuyển sang làn ngoài để vượt xe tải rồi quay lại vị trí cũ khi đường phía trước thông thoáng.", "why": "outside lane = làn xa lề/làn nhanh để vượt trên đường cao tốc (Anh); inside lane = làn chậm.", "hint": "Nghĩa: làn ngoài (làn chạy nhanh)", "new": [{"w": "clear", "vi": "thông thoáng"}], "tw": "outside (fast) lane", "ipa": "/ˌaʊtsaɪd ˈfɑːst leɪn/"}]}, {"id": "s2", "title": "Chọn từ", "note": "Chọn từ hoặc cụm đúng nhất cho chỗ trống; bấm lựa chọn để nghe phát âm.", "qs": [{"type": "mc", "ctx": "Doctor's advice", "s": "Because her spine often hurts, the physiotherapist told her to sit in a ___ armchair, which keeps her back straight, instead of a very soft one.", "o": ["firm", "loose", "tiny"], "a": "firm", "vi": "Vì cột sống hay đau, nhà vật lý trị liệu bảo cô ngồi ghế bành chắc, giúp lưng thẳng, thay vì loại rất mềm.", "why": "a firm armchair = ghế bành chắc, không lún; firm (adj) = cứng vừa phải, vững.", "new": [{"w": "physiotherapist", "vi": "nhà vật lý trị liệu"}, {"w": "spine", "vi": "cột sống"}], "tw": "firm"}, {"type": "mc", "ctx": "Choosing a flat", "s": "The baby has just started crawling, so the couple prefer a ___ room where the floor is soft, rather than cold tiles.", "o": ["carpeted", "tiled", "empty"], "a": "carpeted", "vi": "Em bé vừa tập bò nên cặp vợ chồng thích căn phòng trải thảm có sàn mềm hơn là gạch lạnh.", "why": "carpeted = được trải thảm kín sàn; trái nghĩa với floorboards/tiled (sàn gỗ/gạch).", "new": [{"w": "crawling", "vi": "bò"}, {"w": "tiles", "vi": "gạch lát"}], "tw": "carpeted"}, {"type": "mc", "ctx": "Job interview", "s": "The advertisement promises that new employees can earn a ___ amount of money, so you will be able to live comfortably without working overtime.", "o": ["reasonable", "musical", "unlucky"], "a": "reasonable", "vi": "Quảng cáo hứa rằng nhân viên mới có thể kiếm một khoản tiền khá ổn, nên bạn sống thoải mái mà không phải làm thêm giờ.", "why": "a reasonable amount of money = một khoản tiền vừa phải, đủ sống; reasonable = hợp lý, ở mức chấp nhận được.", "new": [{"w": "overtime", "vi": "làm thêm giờ"}, {"w": "advertisement", "vi": "quảng cáo"}], "tw": "reasonable"}, {"type": "mc", "ctx": "Shopping advice", "s": "These winter boots cost more than the others, yet reviewers say they are good ___ for money, since they usually last for at least five years.", "o": ["value", "price", "cost"], "a": "value", "vi": "Đôi bốt mùa đông này đắt hơn các loại khác, nhưng người đánh giá nói rất đáng tiền vì thường dùng được ít nhất năm năm.", "why": "good value for money = đáng đồng tiền (chất lượng tương xứng với giá); value = giá trị.", "new": [{"w": "reviewers", "vi": "người đánh giá"}], "tw": "value"}, {"type": "mc", "ctx": "Car park", "s": "If you leave your car here for more than three hours, the company will ___ you double the normal price, which is why many drivers move early.", "o": ["charge", "borrow", "spare"], "a": "charge", "vi": "Nếu để xe ở đây hơn ba tiếng, công ty sẽ thu bạn gấp đôi giá thường, nên nhiều tài xế dời xe sớm.", "why": "charge sb (an amount) = tính/thu tiền ai; thì quá khứ charged.", "new": [{"w": "double", "vi": "gấp đôi"}], "tw": "charge"}, {"type": "mc", "ctx": "Bank customer", "s": "She was angry that the bank had charged her ___ sending a simple message to her account, because nobody had mentioned any fee before.", "o": ["for", "at", "with"], "a": "for", "vi": "Cô tức giận vì ngân hàng tính tiền cô cho việc gửi một tin nhắn đơn giản đến tài khoản, vì trước đó không ai nhắc đến phí.", "why": "charge sb for sth = tính tiền ai cho khoản gì; giới từ đi sau là for.", "new": [{"w": "fee", "vi": "khoản phí"}, {"w": "mentioned", "vi": "đề cập"}], "tw": "for"}, {"type": "mc", "ctx": "University housing", "s": "When her scholarship started, Mai ___ a room near the campus for twelve months, which was cheaper than staying in the dormitory.", "o": ["rented", "hired", "borrowed"], "a": "rented", "vi": "Khi học bổng bắt đầu, Mai thuê một phòng gần khuôn viên trường trong mười hai tháng, rẻ hơn ở ký túc xá.", "why": "rent = thuê dài hạn (nhà, căn hộ); hire = thuê ngắn hạn (xe, đồ dùng một ngày).", "new": [{"w": "scholarship", "vi": "học bổng"}, {"w": "dormitory", "vi": "ký túc xá"}], "tw": "rented"}, {"type": "mc", "ctx": "Wedding preparations", "s": "They did not want to buy such expensive equipment for one party, so they ___ a sound system for the weekend and returned it on Monday.", "o": ["hired", "owned", "wrapped"], "a": "hired", "vi": "Họ không muốn mua thiết bị đắt tiền cho một bữa tiệc nên đã thuê hệ thống âm thanh cuối tuần và trả lại vào thứ Hai.", "why": "hire = thuê ngắn hạn (xe đạp, xe hơi, dụng cụ) trong vài giờ/ngày; rent = thuê dài hạn.", "new": [{"w": "equipment", "vi": "thiết bị"}], "tw": "hired"}, {"type": "mc", "ctx": "At the airport", "s": "\"___ a second,\" she said to the taxi driver, \"I think I left my passport in the café, so I need to go back and look for it.\"", "o": ["Hold on", "Take off", "Look out"], "a": "Hold on", "vi": "“Chờ một chút,” cô nói với tài xế, “tôi nghĩ tôi để quên hộ chiếu ở quán cà phê nên cần quay lại tìm.”", "why": "hold on a second = chờ một chút (lịch sự, văn nói); cũng dùng khi nghe điện thoại.", "new": [{"w": "passport", "vi": "hộ chiếu"}], "tw": "Hold on"}, {"type": "mc", "ctx": "Business meeting", "s": "The new policy is ___ a way of reducing costs, even though the manager described it as a plan to improve customer service.", "o": ["essentially", "rarely", "politely"], "a": "essentially", "vi": "Chính sách mới thực chất là cách cắt giảm chi phí, dù quản lý mô tả đó là kế hoạch cải thiện dịch vụ khách hàng.", "why": "essentially = về cơ bản, thực chất (đi trước điều cốt lõi); adj: essential.", "new": [{"w": "policy", "vi": "chính sách"}], "tw": "essentially", "ipa": "/ɪˈsen.ʃəl.i/"}, {"type": "mc", "ctx": "Travel tips", "s": "A warm jacket and a map are ___ items if you plan to hike in the mountains, whereas a camera is only a pleasant extra.", "o": ["essential", "optional", "harmful"], "a": "essential", "vi": "Áo khoác ấm và bản đồ là vật dụng thiết yếu nếu bạn định leo núi, còn máy ảnh chỉ là món thêm cho vui.", "why": "essential (adj) = thiết yếu, không thể thiếu; also a noun: essentials = những thứ cần thiết.", "new": [{"w": "hike", "vi": "đi bộ đường dài"}, {"w": "extra", "vi": "món thêm"}], "tw": "essential", "ipa": "/ɪˈsen.ʃəl/"}, {"type": "mc", "ctx": "Chatting about cars", "s": "Maya says her brother must have a ___ of money, since he bought a luxury sports car and a house by the sea in the same year.", "o": ["potload", "handful", "pinch"], "a": "potload", "vi": "Maya nói anh cô chắc có cả đống tiền vì anh mua xe thể thao sang và nhà ven biển trong cùng một năm.", "why": "a potload of money = cả đống tiền (khẩu ngữ, không trang trọng).", "new": [{"w": "luxury", "vi": "sang trọng"}], "tw": "potload"}, {"type": "mc", "ctx": "Medical conference", "s": "Online video consultations have ___ healthcare in rural areas, because patients no longer have to travel for hours just to see a doctor.", "o": ["revolutionized", "postponed", "complained"], "a": "revolutionized", "vi": "Tư vấn khám qua video đã thay đổi hoàn toàn y tế ở vùng nông thôn vì bệnh nhân không phải đi hàng giờ chỉ để gặp bác sĩ.", "why": "revolutionize = làm thay đổi hoàn toàn một lĩnh vực; danh từ: revolution; tính từ: revolutionary.", "new": [{"w": "consultations", "vi": "buổi tư vấn khám"}, {"w": "rural", "vi": "nông thôn"}], "tw": "revolutionized"}, {"type": "mc", "ctx": "Museum guide", "s": "The printing press was a truly ___ invention, since books became cheap enough for ordinary families to buy gười (cũng có nghĩa lòng nhân đạo).", "new": [{"w": "achieve", "vi": "đạt được"}], "tw": "humanity", "ipa": "/hjuːˈmæn.ə.t̬i/"}, {"type": "mc", "ctx": "Athletics final", "s": "If the runner keeps this speed until the end of the race, she will ___ the world record that has stood for more than thirty years.", "o": ["break", "miss", "wear"], "a": "break", "vi": "Nếu vận động viên giữ tốc độ này đến cuối cuộc đua, cô sẽ phá kỷ lục thế giới tồn tại hơn ba mươi năm.", "why": "break a record = phá kỷ lục (break – broke – broken); set a record = lập kỷ lục.", "new": [{"w": "stood", "vi": "đứng vững, tồn tại"}], "tw": "break"}, {"type": "mc", "ctx": "Festival report", "s": "The world's largest pizza, which weighed over three tonnes, was a real ___ and attracted thousands of curious visitors to the small town.", "o": ["record breaker", "bakery", "guide"], "a": "record breaker", "vi": "Chiếc pizza lớn nhất thế giới, nặng hơn ba tấn, là vật phá kỷ lục thật sự và thu hút hàng nghìn du khách tò mò đến thị trấn nhỏ.", "why": "record breaker = người hoặc vật phá kỷ lục (cũng viết record-breaker).", "new": [{"w": "tonnes", "vi": "tấn"}], "tw": "record breaker", "ipa": "/ˈrek.ɚd ˌbreɪ.kɚ/"}, {"type": "mc", "ctx": "Olympic village", "s": "Thousands of ___ from over two hundred countries arrived in the city, and the mayor welcomed them with a big ceremony.", "o": ["athletes", "passengers", "tenants"], "a": "athletes", "vi": "Hàng nghìn vận động viên từ hơn hai trăm quốc gia đến thành phố và thị trưởng chào đón họ bằng một buổi lễ lớn.", "why": "athlete = vận động viên (người thi đấu thể thao, đặc biệt điền kinh).", "new": [{"w": "mayor", "vi": "thị trưởng"}, {"w": "ceremony", "vi": "buổi lễ"}], "tw": "athletes"}, {"type": "mc", "ctx": "Club newsletter", "s": "The club is proud of its oldest member, a former ___ who still swims every morning although he is almost eighty years old.", "o": ["sportsman", "salesman", "neighbour"], "a": "sportsman", "vi": "Câu lạc bộ tự hào về thành viên lớn g làm ca dài và phải quyết định nghiêm trọng thật nhanh.", "why": "stressful = gây căng thẳng (nói về việc/tình huống); stressed = cảm thấy căng thẳng (nói về người).", "new": [{"w": "shifts", "vi": "ca làm việc"}], "tw": "stressful", "ipa": "/ˈstresfl/"}, {"type": "mc", "ctx": "Office chat", "s": "My manager looked very ___ this morning, so I offered to take over some of her emails while she prepared for the board meeting.", "o": ["stressed", "relaxed", "generous"], "a": "stressed", "vi": "Sáng nay quản lý trông rất căng thẳng nên tôi đề nghị nhận bớt email giúp khi cô chuẩn bị họp hội đồng.", "why": "stressed = (người) cảm thấy căng thẳng; stressful = (việc) gây căng thẳng.", "new": [{"w": "board meeting", "vi": "cuộc họp hội đồng quản trị"}], "tw": "stressed", "ipa": "/strest/"}, {"type": "mc", "ctx": "Choosing a university", "s": "Although the town is cheap and friendly, some students complain that it has almost no ___, since all the cafés close at nine o'clock.", "o": ["nightlife", "weather", "harvest"], "a": "nightlife", "vi": "Dù thị trấn rẻ và thân thiện, vài sinh viên phàn nàn gần như không có cuộc sống về đêm vì quán cà phê đều đóng lúc chín giờ.", "why": "nightlife = cuộc sống về đêm (quán bar, câu lạc bộ, nhạc sống).", "tw": "nightlife", "ipa": "/ˈnaɪtlaɪf/"}, {"type": "mc", "ctx": "School trip", "s": "Teachers hope that ___ such as visiting art galleries and learning folk songs will help pupils understand the traditions of their region.", "o": ["cultural activities", "safety rules", "tax forms"], "a": "cultural activities", "vi": "Giáo viên hy vọng các hoạt động văn hóa như tham quan phòng tranh và học dân ca sẽ giúp học sinh hiểu truyền thống vùng mình.", "why": "cultural activities = hoạt động văn hóa (bảo tàng, nhà hát, triển lãm, lễ hội).", "new": [{"w": "folk songs", "vi": "dân ca"}, {"w": "traditions", "vi": "truyền thống"}], "tw": "cultural activities", "ipa": "/ˈkʌltʃərəl ækˈtɪvətiz/"}, {"type": "mc", "ctx": "Family discussion", "s": "We chose to live in a small town where the ___ is low, so our children can walk to school without any worry.", "o": ["crime rate", "tax rate", "birth date"], "a": "crime rate", "vi": "Chúng tôi chọn sống ở thị trấn nhỏ nơi tỷ lệ tội phạm thấp, nên con có thể đi bộ đến trường mà không lo lắng.", "why": "crime rate = tỷ lệ tội phạm (số vụ phạm tội so với dân số).", "tw": "crime rate", "ipa": "/kraɪm reɪt/"}, {"type": "mc", "ctx": "Hostel review", "s": "Our room was small, but for twenty dollars a night it was excellent ___ for money, because it included breakfast, laundry and fast Wi-Fi.", "o": ["value", "bargain", "payment"], "a": "value", "vi": "Phòng nhỏ nhưng với hai mươi đô một đêm thì rất đáng tiền vì gồm bữa sáng, giặt đồ và Wi-Fi nhanh.", "why": "good value for money = đáng đồng tiền; nhớ cả cụm: good value (for money).", "new": [{"w": "laundry", "vi": "giặt giũ"}], "tw": "value"}, {"type": "mc", "ctx": "Class description", "s": "Our English class is a ___ of young students and retired workers, so the discussions are often more interesting than the textbook.", "o": ["mix", "mask", "map"], "a": "mix", "vi": "Lớp tiếng Anh của chúng tôi là sự pha trộn giữa sinh viên trẻ và người đã nghỉ hưu nên các buổi thảo luận thường thú vị hơn sách giáo khoa.", "why": "a mix of A and B = sự pha trộn giữa A và B.", "new": [{"w": "retired", "vi": "đã nghỉ hưu"}], "tw": "mix"}, {"type": "mc", "ctx": "Noisy street", "s": "I heard shouting outside my window, so I looked out to see what was ___ and noticed that a crowd had gathered near the bank.", "o": ["going on", "going up", "going off"], "a": "going on", "vi": "Tôi nghe tiếng la hét ngoài cửa sổ nên nhìn ra xem chuyện gì đang diễn ra và thấy đám đông tụ tập gần ngân hàng.", "why": "be going on = đang diễn ra; What's going on? = Chuyện gì đang xảy ra?", "new": [{"w": "gathered", "vi": "tụ tập"}], "tw": "going on"}, {"type": "mc", "ctx": "Product review", "s": "The phone looked attractive, but it proved to be ___ value for money, since the battery lasted only half a day and the screen cracked easily.", "o": ["poor", "fair", "rich"], "a": "poor", "vi": "Chiếc điện thoại trông hấp dẫn nhưng hóa ra không đáng tiền vì pin chỉ dùng nửa ngày và màn hình dễ nứt.", "why": "poor value for money = không đáng đồng tiền (trả nhiều nhưng nhận ít); đối lập: good value for money.", "new": [{"w": "cracked", "vi": "nứt"}], "tw": "poor"}, {"type": "mc", "ctx": "Rainy night", "s": "Since the last train had already left, we decided to ___ a taxi instead of waiting two hours at the cold station.", "o": ["get", "pay", "miss"], "a": "get", "vi": "Vì chuyến tàu cuối đã chạy, chúng tôi quyết định bắt taxi thay vì đợi hai tiếng ở nhà ga lạnh.", "why": "get/take the bus = đi/bắt xe buýt; get a taxi, get the train tương tự.", "tw": "get"}, {"type": "mc", "ctx": "Restaurant opening", "s": "The new chef, who trained in Italy, is ___ cooking pasta from scratch, so customers can taste the difference immediately.", "o": ["good at", "fond to", "tired at"], "a": "good at", "vi": "Đầu bếp mới, từng học ở Ý, nấu mì ống từ đầu rất giỏi nên khách nếm là thấy khác biệt ngay.", "why": "be good at cooking sth = nấu món gì đó giỏi; be good at + V-ing/danh từ.", "new": [{"w": "from scratch", "vi": "từ đầu, tự làm"}], "tw": "good at"}, {"type": "mc", "ctx": "Creative kitchen", "s": "My mother is very creative, and she always ___ new dishes by mixing leftovers with herbs from her little balcony garden.", "o": ["comes up with", "gets out of", "puts up with"], "a": "comes up with", "vi": "Mẹ tôi rất sáng tạo và luôn nghĩ ra món mới bằng cách trộn đồ thừa với rau thơm từ vườn ban công nhỏ.", "why": "come up with sth = nghĩ ra (ý tưởng, giải pháp, kế hoạch).", "new": [{"w": "leftovers", "vi": "đồ ăn thừa"}, {"w": "herbs", "vi": "rau thơm"}], "tw": "comes up with"}, {"type": "mc", "ctx": "Photography club", "s": "Many photographers travel to this region every autumn to capture the beautiful ___, particularly when the hills turn orange and red.", "o": ["scenery", "machinery", "delivery"], "a": "scenery", "vi": "Nhiều nhiếp ảnh gia đến vùng này mỗi mùa thu để chụp phong cảnh đẹp, đặc biệt khi đồi chuyển màu cam và đỏ.", "why": "scenery = phong cảnh thiên nhiên (không đếm được, không có -s).", "new": [{"w": "capture", "vi": "ghi lại"}], "tw": "scenery", "ipa": "/ˈsiː.nər.i/"}, {"type": "mc", "ctx": "Career change", "s": "After working in a bank for fifteen years, Sam dreamed of the day when he could ___ a farm and live far from the city.", "o": ["own", "owe", "open"], "a": "own", "vi": "Sau mười lăm năm làm ngân hàng, Sam mơ đến ngày có thể sở hữu một trang trại và sống xa thành phố.", "why": "own a farm = sở hữu một trang trại; own (v) = sở hữu; owner = chủ sở hữu.", "tw": "own"}, {"type": "mc", "ctx": "Village life", "s": "In the past, nearly every family in the valley used to ___ a pig or a few ducks in the yard, which gave them meat and eggs.", "o": ["keep", "wear", "spend"], "a": "keep", "vi": "Ngày xưa, gần như nhà nào trong thung lũng cũng nuôi một con lợn hoặc vài con vịt ngoài sân, cho họ thịt và trứng.", "why": "keep animals = nuôi động vật (gia súc, gia cầm) làm nghề hoặc để lấy sản phẩm.", "new": [{"w": "valley", "vi": "thung lũng"}], "tw": "keep"}, {"type": "mc", "ctx": "Climate report", "s": "If the soil becomes too salty, farmers will no longer be able to ___ crops there, which could cause a serious food shortage.", "o": ["grow", "drive", "print"], "a": "grow", "vi": "Nếu đất nhiễm mặn quá, nông dân sẽ không còn trồng trọt được ở đó, có thể gây thiếu lương thực nghiêm trọng.", "why": "grow crops = trồng cây nông nghiệp (lúa, ngô, lúa mạch...).", "new": [{"w": "soil", "vi": "đất"}, {"w": "shortage", "vi": "sự thiếu hụt"}], "tw": "grow"}, {"type": "mc", "ctx": "Weather news", "s": "Heavy storms destroyed a large part of this year's ___, which means that the price of vegetables will probably rise next month.", "o": ["crop", "coast", "cloud"], "a": "crop", "vi": "Bão lớn phá hủy phần lớn vụ mùa năm nay, nghĩa là giá rau có thể tăng vào tháng tới.", "why": "crop = cây trồng nông nghiệp hoặc vụ mùa thu hoạch; cash crop = cây bán lấy tiền.", "new": [{"w": "destroyed", "vi": "phá hủy"}], "tw": "crop", "ipa": "/krɒp/"}, {"type": "mc", "ctx": "Cold climate farming", "s": "In northern regions where summers are short, farmers often plant ___ instead of rice, since it grows well in cool weather.", "o": ["barley", "bamboo", "banana"], "a": "barley", "vi": "Ở vùng phía bắc nơi mùa hè ngắn, nông dân thường trồng lúa mạch thay vì lúa gạo vì nó mọc tốt khi trời mát.", "why": "barley = lúa mạch (dùng làm bia, bánh mì, thức ăn gia súc).", "tw": "barley", "ipa": "/ˈbɑː.li/"}, {"type": "mc", "ctx": "Job fair", "s": "Modern ___ relies on drones and sensors to measure water and soil conditions, which helps farmers use less water and produce more food.", "o": ["farming", "fishing", "shopping"], "a": "farming", "vi": "Nghề nông hiện đại dựa vào máy bay không người lái và cảm biến để đo nước và đất, giúp nông dân dùng ít nước hơn và làm ra nhiều lương thực hơn.", "why": "farming = nghề nông, việc làm nông (không đếm được); farmer = nông dân.", "new": [{"w": "drones", "vi": "máy bay không người lái"}, {"w": "sensors", "vi": "cảm biến"}], "tw": "farming", "ipa": "/ˈfɑː.mɪŋ/"}, {"type": "mc", "ctx": "Early flight", "s": "We must be ___ at four tomorrow, so please set two alarms in case one of them fails to ring.", "o": ["up", "out", "off"], "a": "up", "vi": "Ngày mai chúng ta phải dậy lúc bốn giờ, nên hãy đặt hai báo thức phòng khi một cái không kêu.", "why": "be up at + giờ = đã dậy/ra khỏi giường lúc mấy giờ (ví dụ: I'm up at six).", "new": [{"w": "alarms", "vi": "báo thức"}], "tw": "up"}, {"type": "mc", "ctx": "Moving plans", "s": "Although it is peaceful to live in a ___, there is only one bus a day, which makes it difficult for teenagers to attend evening classes.", "o": ["village", "metropolis", "airport"], "a": "village", "vi": "Dù sống trong làng thì yên bình, chỉ có một chuyến xe buýt mỗi ngày nên thanh thiếu niên khó đi học buổi tối.", "why": "live in a village = sống trong một ngôi làng; village (n) = làng, thôn.", "new": [{"w": "attend", "vi": "tham dự"}], "tw": "village"}, {"type": "mc", "ctx": "Job hunting", "s": "Don't refuse a good chance when it ___; opportunities like this may not appear again for several years.", "o": ["comes along", "goes off", "falls out"], "a": "comes along", "vi": "Đừng từ chối cơ hội tốt khi nó xuất hiện; cơ hội như vậy có thể vài năm mới có lại.", "why": "come along = xuất hiện, đến (thường nói về xe cộ hoặc cơ hội); cũng nghĩa đi cùng.", "new": [{"w": "opportunities", "vi": "cơ hội"}], "tw": "comes along"}, {"type": "mc", "ctx": "Giving directions", "s": "Drive straight for two kilometres, and when you reach the ___ with the petrol station, turn left towards the airport.", "o": ["junction", "platform", "ceiling"], "a": "junction", "vi": "Lái thẳng hai cây số, khi tới giao lộ có trạm xăng thì rẽ trái hướng sân bay.", "why": "junction = giao lộ, ngã tư/ngã ba (nơi các đường gặp nhau).", "tw": "junction", "ipa": "/ˈdʒʌŋkʃn/"}, {"type": "mc", "ctx": "Mountain road", "s": "The accident happened at a dangerous ___ in the road, where drivers cannot see cars coming from the opposite direction.", "o": ["bend", "hole", "bridge"], "a": "bend", "vi": "Tai nạn xảy ra ở khúc cua nguy hiểm trên đường, nơi tài xế không thấy xe từ hướng ngược lại.", "why": "a bend (in the road) = khúc cua, đoạn đường cong; a sharp bend = khúc cua gấp.", "new": [{"w": "opposite", "vi": "đối diện"}], "tw": "bend"}, {"type": "mc", "ctx": "Cycling route", "s": "After about a kilometre, the river path slowly ___ to the right, and you will see the old stone mill on the hill.", "o": ["bends", "ends", "sends"], "a": "bends", "vi": "Sau khoảng một cây số, đường ven sông từ từ uốn sang phải và bạn sẽ thấy cối xay đá cổ trên đồi.", "why": "bend (to the left/right) = (đường) cua, uốn cong sang trái/phải; động từ bend – bent – bent.", "new": [{"w": "mill", "vi": "cối xay"}], "tw": "bends"}, {"type": "mc", "ctx": "Road safety", "s": "Drivers must stop whenever someone steps onto the ___, and those who ignore this rule can lose their licence.", "o": ["pedestrian crossing", "speed bump", "petrol station"], "a": "pedestrian crossing", "vi": "Tài xế phải dừng khi có người bước lên vạch sang đường, và ai phớt lờ quy tắc này có thể mất bằng lái.", "why": "pedestrian crossing = vạch sang đường cho người đi bộ (Anh-Anh); Anh-Mỹ: crosswalk.", "new": [{"w": "licence", "vi": "bằng lái"}, {"w": "ignore", "vi": "phớt lờ"}], "tw": "pedestrian crossing", "ipa": "/pəˈdestriən ˈkrɒsɪŋ/"}, {"type": "mc", "ctx": "US traffic rules", "s": "In many American cities, drivers must stop for anyone who is standing at a ___, even if there are no traffic lights.", "o": ["crosswalk", "airport", "garage"], "a": "crosswalk", "vi": "Ở nhiều thành phố Mỹ, tài xế phải dừng cho bất cứ ai đứng ở vạch sang đường, ngay cả khi không có đèn giao thông.", "why": "crosswalk = vạch sang đường cho người đi bộ (Anh-Mỹ); Anh-Anh: pedestrian crossing.", "tw": "crosswalk", "ipa": "/ˈkrɔːs.wɔːk/"}, {"type": "mc", "ctx": "Safety campaign", "s": "The advertisement warns teenagers about ___ the road with headphones on, because they cannot hear approaching cars or horns.", "o": ["crossing", "painting", "crashing"], "a": "crossing", "vi": "Quảng cáo cảnh báo thanh thiếu niên về việc sang đường khi đeo tai nghe vì họ không nghe thấy xe đến hoặc tiếng còi.", "why": "crossing the road = sang đường, băng qua đường; cross the road.", "new": [{"w": "approaching", "vi": "đang đến gần"}, {"w": "horns", "vi": "còi xe"}], "tw": "crossing"}, {"type": "mc", "ctx": "Learning to drive", "s": "Before taking the test, you have to memorise the meaning of every ___, such as stop, no entry and give way.", "o": ["road sign", "bank loan", "dinner menu"], "a": "road sign", "vi": "Trước khi thi, bạn phải nhớ nghĩa mọi biển báo giao thông, chẳng hạn dừng, cấm vào và nhường đường.", "why": "road sign = biển báo giao thông; traffic sign cũng dùng.", "new": [{"w": "memorise", "vi": "ghi nhớ"}], "tw": "road sign", "ipa": "/ˈrəʊd saɪn/"}, {"type": "mc", "ctx": "Police warning", "s": "The police fined him because he ignored the ___ rule on the mountain road, which is famous for its dangerous curves.", "o": ["no overtaking", "no smoking", "no parking"], "a": "no overtaking", "vi": "Cảnh sát phạt anh vì anh phớt lờ quy định cấm vượt trên đường núi nổi tiếng với những khúc cua nguy hiểm.", "why": "no overtaking = cấm vượt (biển báo hoặc quy định); overtake = vượt xe khác.", "new": [{"w": "fined", "vi": "phạt tiền"}, {"w": "curves", "vi": "khúc cua"}], "tw": "no overtaking", "ipa": "/ˌnəʊ ˌəʊvəˈteɪkɪŋ/"}, {"type": "mc", "ctx": "Driving test", "s": "It is illegal to ___ another vehicle when you are approaching a junction, because you might not see cars coming from the side.", "o": ["overtake", "borrow", "announce"], "a": "overtake", "vi": "Vượt xe khác khi đang tiến gần giao lộ là bất hợp pháp vì bạn có thể không thấy xe đến từ bên cạnh.", "why": "overtake sth/sb = vượt (xe khác); quá khứ overtook; quá khứ phân từ overtaken.", "new": [{"w": "illegal", "vi": "bất hợp pháp"}], "tw": "overtake"}, {"type": "mc", "ctx": "Traffic fine", "s": "He received a letter from the police because he had driven well above the ___ on the motorway, and he had to pay a heavy fine.", "o": ["speed limit", "road map", "phone number"], "a": "speed limit", "vi": "Anh nhận thư từ cảnh sát vì lái vượt xa giới hạn tốc độ trên đường cao tốc và phải nộp phạt nặng.", "why": "speed limit = giới hạn tốc độ (tốc độ tối đa cho phép).", "new": [{"w": "heavy", "vi": "nặng"}], "tw": "speed limit", "ipa": "/ˈspiːd ˌlɪmɪt/"}, {"type": "mc", "ctx": "Travel safety", "s": "Although driving on the ___ is faster than using local roads, tired drivers should stop at a service station every two hours.", "o": ["motorway", "pavement", "stairway"], "a": "motorway", "vi": "Dù lái trên đường cao tốc nhanh hơn đường địa phương, tài xế mệt nên dừng ở trạm dịch vụ mỗi hai tiếng.", "why": "motorway = đường cao tốc (Anh-Anh); Anh-Mỹ: highway/freeway.", "new": [{"w": "service station", "vi": "trạm dịch vụ"}], "tw": "motorway", "ipa": "/ˈməʊtəweɪ/"}, {"type": "mc", "ctx": "Driving instructor", "s": "Learner drivers are advised to use the ___ lane until they feel confident, and only then move out to overtake a lorry.", "o": ["inside", "outside", "upside"], "a": "inside", "vi": "Người mới lái được khuyên dùng làn trong cho đến khi tự tin, rồi mới chuyển ra làn ngoài vượt xe tải.", "why": "inside lane = làn gần lề/làn chậm trên đường cao tốc (Anh); outside lane = làn nhanh.", "new": [{"w": "learner", "vi": "người mới học"}], "tw": "inside"}, {"type": "mc", "ctx": "Driving theory", "s": "You should not stay in the ___ lane for a long time, because it is intended for overtaking rather than for steady driving.", "o": ["outside", "inside", "indoor"], "a": "outside", "vi": "Bạn không nên ở lâu trong làn ngoài vì nó dành cho việc vượt, không phải chạy đều.", "why": "outside lane = làn xa lề/làn nhanh để vượt trên đường cao tốc (Anh); inside lane = làn chậm.", "new": [{"w": "steady", "vi": "đều đặn"}], "tw": "outside"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Reading", "s": "Our new sofa was too soft, so after a week my father bought a firm armchair instead. He says it feels much better for his back when he reads the newspaper. What does \"firm\" mean?", "o": ["chắc, cứng vừa phải, không lún", "mềm và rất êm", "cũ và rẻ tiền"], "a": "chắc, cứng vừa phải, không lún", "vi": "Chiếc sofa mới quá mềm nên sau một tuần bố tôi mua một chiếc ghế bành chắc thay thế. Ông nói ngồi đọc báo thoải mái hơn nhiều cho lưng.", "why": "a firm armchair = ghế bành chắc, không lún; firm (adj) = cứng vừa phải, vững.", "noblank": true, "say": "Our new sofa was too soft, so after a week my father bought a firm armchair instead. He says it feels much better for his back when he reads the newspaper.", "new": [{"w": "instead", "vi": "thay vào đó"}], "tw": "a firm armchair"}, {"type": "mc", "ctx": "Reading", "s": "The estate agent showed us a carpeted room on the second floor. Because the floor was covered with thick carpet, our footsteps made almost no noise. What does \"carpeted\" mean?", "o": ["được trải thảm", "được sơn mới", "có nhiều cửa sổ"], "a": "được trải thảm", "vi": "Nhân viên bất động sản cho chúng tôi xem một căn phòng trải thảm ở tầng hai. Vì sàn phủ thảm dày nên bước chân hầu như không phát ra tiếng.", "why": "carpeted = được trải thảm kín sàn; trái nghĩa với floorboards/tiled (sàn gỗ/gạch).", "noblank": true, "say": "The estate agent showed us a carpeted room on the second floor. Because the floor was covered with thick carpet, our footsteps made almost no noise.", "new": [{"w": "estate agent", "vi": "nhân viên môi giới"}, {"w": "footsteps", "vi": "tiếng bước chân"}], "tw": "a carpeted room"}, {"type": "mc", "ctx": "Reading", "s": "My cousin does not have a glamorous job, but she earns a reasonable amount of money. It is enough to pay her bills, save a little and take one holiday a year. What does \"a reasonable amount of money\" mean?", "o": ["một khoản tiền khá ổn, đủ dùng", "một khoản tiền khổng lồ", "một khoản tiền rất ít ỏi"], "a": "một khoản tiền khá ổn, đủ dùng", "vi": "Em họ tôi không có công việc hào nhoáng, nhưng kiếm được một khoản tiền khá ổn. Đủ để trả hóa đơn, tiết kiệm một ít và đi nghỉ mỗi năm một lần.", "why": "a reasonable amount of money = một khoản tiền vừa phải, đủ sống; reasonable = hợp lý, ở mức chấp nhận được.", "noblank": true, "say": "My cousin does not have a glamorous job, but she earns a reasonable amount of money. It is enough to pay her bills, save a little and take one holiday a year.", "new": [{"w": "glamorous", "vi": "hào nhoáng"}, {"w": "bills", "vi": "hóa đơn"}], "tw": "earn a reasonable amount of money", "ipa": "/ˈriː.zən.ə.bəl/"}, {"type": "mc", "ctx": "Reading", "s": "The restaurant charges a little more than its neighbours, yet it is good value for money. The portions are generous, and the ingredients are fresh and locally grown. What does \"good value for money\" mean?", "o": ["đáng tiền, chất lượng xứng với giá", "rẻ nhưng chất lượng tệ", "đắt và không đáng"], "a": "đáng tiền, chất lượng xứng với giá", "vi": "Nhà hàng tính giá cao hơn chút so với hàng xóm, nhưng rất đáng tiền. Khẩu phần đầy đặn, nguyên liệu tươi và trồng tại địa phương.", "why": "good value for money = đáng đồng tiền (chất lượng tương xứng với giá); value = giá trị.", "noblank": true, "say": "The restaurant charges a little more than its neighbours, yet it is good value for money. The portions are generous, and the ingredients are fresh and locally grown.", "new": [{"w": "portions", "vi": "khẩu phần"}, {"w": "generous", "vi": "hào phóng, đầy đặn"}, {"w": "ingredients", "vi": "nguyên liệu"}], "tw": "good value for money"}, {"type": "mc", "ctx": "Reading", "s": "When we returned the bicycles one day late, the shop charged us a small fine. The owner explained that this rule is written clearly on the rental form. What does \"charged\" mean here?", "o": ["tính/thu tiền", "tặng miễn phí", "hoàn lại tiền"], "a": "tính/thu tiền", "vi": "Khi chúng tôi trả xe đạp trễ một ngày, cửa hàng thu của chúng tôi một khoản phạt nhỏ. Chủ tiệm giải thích quy định này ghi rõ trong phiếu thuê.", "why": "charge sb (an amount) = tính/thu tiền ai; thì quá khứ charged.", "noblank": true, "say": "When we returned the bicycles one day late, the shop charged us a small fine. The owner explained that this rule is written clearly on the rental form.", "new": [{"w": "fine", "vi": "tiền phạt"}, {"w": "rental", "vi": "việc cho thuê"}], "tw": "charge someone", "ipa": "/tʃɑːrdʒ/"}, {"type": "mc", "ctx": "Reading", "s": "The café charged us for the water, although we had not ordered it. After a short discussion, the waiter removed the amount from the bill. What does \"charged us for\" mean?", "o": ["tính tiền chúng tôi cho", "cảm ơn chúng tôi vì", "đưa nước cho chúng tôi"], "a": "tính tiền chúng tôi cho", "vi": "Quán cà phê tính tiền nước của chúng tôi dù chúng tôi không gọi. Sau một cuộc trao đổi ngắn, người phục vụ bỏ khoản đó khỏi hóa đơn.", "why": "charge sb for sth = tính tiền ai cho khoản gì; giới từ đi sau là for.", "noblank": true, "say": "The café charged us for the water, although we had not ordered it. After a short discussion, the waiter removed the amount from the bill.", "new": [{"w": "discussion", "vi": "cuộc trao đổi"}, {"w": "amount", "vi": "khoản tiền"}], "tw": "charge someone for something", "ipa": "/tʃɑːrdʒ/"}, {"type": "mc", "ctx": "Reading", "s": "Our landlord decided to rent the flat to a young couple for two years. They pay the money every month and have signed a long contract. What does \"rent\" mean here?", "o": ["thuê/cho thuê lâu dài", "mua đứt", "sửa chữa"], "a": "thuê/cho thuê lâu dài", "vi": "Chủ nhà quyết định cho một cặp trẻ thuê căn hộ trong hai năm. Họ trả tiền hằng tháng và đã ký hợp đồng dài hạn.", "why": "rent = thuê dài hạn (nhà, căn hộ); hire = thuê ngắn hạn (xe, đồ dùng một ngày).", "noblank": true, "say": "Our landlord decided to rent the flat to a young couple for two years. They pay the money every month and have signed a long contract.", "new": [{"w": "landlord", "vi": "chủ nhà"}, {"w": "contract", "vi": "hợp đồng"}], "tw": "rent", "ipa": "/rent/"}, {"type": "mc", "ctx": "Reading", "s": "We hired a car for three days to visit the national park. Instead of buying a vehicle, we simply paid a daily fee and gave the keys back at the airport. What does \"hired\" mean here?", "o": ["thuê trong thời gian ngắn", "mua trả góp", "cho mượn miễn phí"], "a": "thuê trong thời gian ngắn", "vi": "Chúng tôi thuê một chiếc xe ba ngày để đi vườn quốc gia. Thay vì mua xe, chúng tôi chỉ trả phí hằng ngày rồi trả chìa khóa ở sân bay.", "why": "hire = thuê ngắn hạn (xe đạp, xe hơi, dụng cụ) trong vài giờ/ngày; rent = thuê dài hạn.", "noblank": true, "say": "We hired a car for three days to visit the national park. Instead of buying a vehicle, we simply paid a daily fee and gave the keys back at the airport.", "new": [{"w": "vehicle", "vi": "phương tiện"}], "tw": "hire", "ipa": "/haɪr/"}, {"type": "mc", "ctx": "Reading", "s": "The shop assistant was talking to a customer when I asked about the price. \"Hold on a second,\" she said, and she finished writing the receipt first. What does \"Hold on a second\" mean?", "o": ["Chờ một chút", "Đi ngay đi", "Tôi không biết"], "a": "Chờ một chút", "vi": "Nhân viên đang nói chuyện với khách thì tôi hỏi giá. “Chờ một chút,” cô nói rồi viết xong hóa đơn trước.", "why": "hold on a second = chờ một chút (lịch sự, văn nói); cũng dùng khi nghe điện thoại.", "noblank": true, "say": "The shop assistant was talking to a customer when I asked about the price. \"Hold on a second,\" she said, and she finished writing the receipt first.", "new": [{"w": "receipt", "vi": "hóa đơn"}], "tw": "hold on a second", "ipa": "/həʊld ɒn ə ˈsek.ənd/"}, {"type": "mc", "ctx": "Reading", "s": "The report is long and complicated, but essentially it says one thing: people who sleep less than six hours are more likely to become ill. What does \"essentially\" mean?", "o": ["về cơ bản, thực chất", "hoàn toàn không", "thỉnh thoảng"], "a": "về cơ bản, thực chất", "vi": "Bản báo cáo dài và phức tạp, nhưng thực chất nó nói một điều: người ngủ dưới sáu tiếng dễ bị bệnh hơn.", "why": "essentially = về cơ bản, thực chất (đi trước điều cốt lõi); adj: essential.", "noblank": true, "say": "The report is long and complicated, but essentially it says one thing: people who sleep less than six hours are more likely to become ill.", "new": [{"w": "complicated", "vi": "phức tạp"}], "tw": "essentially", "ipa": "/ɪˈsen.ʃəl.i/"}, {"type": "mc", "ctx": "Reading", "s": "For this job, good communication is essential. Without it, even a brilliant engineer cannot explain ideas ution in office work. Within a decade, typewriters disappeared and most letters were sent by email.", "new": [{"w": "typewriters", "vi": "máy đánh chữ"}, {"w": "decade", "vi": "thập kỷ"}], "tw": "revolution", "ipa": "/ˌrev.əˈluː.ʃən/"}, {"type": "mc", "ctx": "Reading", "s": "The professor argued that science should serve the betterment of society, not only the profits of big companies. Without that aim, he said, new technology might help only a few people. What does \"betterment of society\" mean?", "o": ["sự cải thiện xã hội", "sự suy thoái xã hội", "lợi nhuận công ty"], "a": "sự cải thiện xã hội", "vi": "Giáo sư cho rằng khoa học nên phục vụ việc cải thiện xã hội, không chỉ lợi nhuận của các công ty lớn. Thiếu mục tiêu đó, công nghệ mới có thể chỉ giúp được vài người.", "why": "betterment of sth = sự cải thiện (trang trọng); thường dùng: the betterment of society.", "noblank": true, "say": "The professor argued that science should serve the betterment of society, not only the profits of big companies. Without that aim, he said, new technology might help only a few people.", "new": [{"w": "profits", "vi": "lợi nhuận"}], "tw": "betterment of something", "ipa": "/ˈbet̬.ɚ.mənt/"}, {"type": "mc", "ctx": "Reading", "s": "Doctors have helped humanity by finding cures for deadly diseases such as smallpox. Because of their work, millions of people around the world now live longer and healthier lives. What does \"humanity\" mean?", "o": ["nhân loại, loài người", "động vật hoang dã", "chính phủ"], "a": "nhân loại, loài người", "vi": "Các bác sĩ đã giúp nhân loại bằng cách tìm ra thuốc chữa các bệnh chết người như đậu mùa. Nhờ họ, hàng triệu người trên thế giới sống lâu và khỏe hơn.", "why": "humanity = nhân loại, loài người (cũng có nghĩa lòng nhân đạo).", "noblank": true, "say": "Doctors have helped humanity by finding cures for deadly diseases such as smallpox. Because of their work, millions of people around the world now live longer and healthier lives.", "new": [{"w": " orning. It is quick, cheap and stops right outside my faculty. What does \"get the tram\" mean?", "o": ["đi/bắt xe điện", "sửa xe điện", "bán xe điện"], "a": "đi/bắt xe điện", "vi": "Tôi không có xe hơi nên mỗi sáng đi tàu điện đến trường đại học. Nhanh, rẻ và dừng ngay trước khoa của tôi.", "why": "get/take the bus = đi/bắt xe buýt; get a taxi, get the train tương tự.", "noblank": true, "say": "I don't own a car, so I get the tram to the university every morning. It is quick, cheap and stops right outside my faculty.", "new": [{"w": "faculty", "vi": "khoa"}], "tw": "get the bus"}, {"type": "mc", "ctx": "Reading", "s": "Although my brother is good at cooking spicy curry, he never follows a recipe. He adds a little of everything and somehow it always tastes perfect. What does \"good at cooking\" mean?", "o": ["nấu ăn giỏi", "ghét nấu ăn", "sợ nấu ăn"], "a": "nấu ăn giỏi", "vi": "Dù anh trai tôi nấu cà ri cay giỏi, anh không bao giờ theo công thức. Anh thêm ít từ mọi thứ và bằng cách nào đó món luôn ngon.", "why": "be good at cooking sth = nấu món gì đó giỏi; be good at + V-ing/danh từ.", "noblank": true, "say": "Although my brother is good at cooking spicy curry, he never follows a recipe. He adds a little of everything and somehow it always tastes perfect.", "new": [{"w": "recipe", "vi": "công thức"}], "tw": "be good at cooking something", "ipa": "/bi ɡʊd æt ˈkʊkɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "The engineers were stuck for weeks until a young intern came up with a simple solution. She suggested changing the order of two steps, which saved hours of work. What does \"came up with\" mean?", "o": ["nghĩ ra", "từ chối", "quên mất"], "a": "nghĩ ra", "vi": "Các kỹ sư bị kẹt nhiều tuần cho đến khi một thực tập sinh trẻ nghĩ ra giải pháp đơn giản. Cô đề xuất đổi thứ tự hai bước, tiết kiệm nhiều giờ.", "why": "come up with sth = nghĩ ra (ý tưởng, giải pháp, kế hoạch).", "noblank": true, "say": "The engineers were stuck for weeks until a young intern came up with p animals\" mean?", "o": ["nuôi động vật", "săn động vật", "vẽ động vật"], "a": "nuôi động vật", "vi": "Không dễ nuôi động vật trong căn hộ nhỏ. Chúng cần chỗ, vận động và khám thú y đều đặn, nên đa số chọn thú cưng yên lặng như cá.", "why": "keep animals = nuôi động vật (gia súc, gia cầm) làm nghề hoặc để lấy sản phẩm.", "noblank": true, "say": "It is not easy to keep animals in a small flat. They need space, exercise and regular visits to the vet, which is why most people choose a quiet pet like a fish.", "new": [{"w": "vet", "vi": "bác sĩ thú y"}], "tw": "keep animals", "ipa": "/kiːp ˈæn.ɪ.məlz/"}, {"type": "mc", "ctx": "Reading", "s": "Many small farmers grow crops to earn money rather than just feed their families. They sell the rice at the market and use the profit to buy seeds for the next season. What does \"grow crops\" mean?", "o": ["trồng cây nông nghiệp", "xây nhà kho", "nuôi gia súc"], "a": "trồng cây nông nghiệp", "vi": "Nhiều nông dân nhỏ trồng cây để kiếm tiền chứ không chỉ nuôi gia đình. Họ bán gạo ở chợ và dùng lời mua hạt giống cho vụ sau.", "why": "grow crops = trồng cây nông nghiệp (lúa, ngô, lúa mạch...).", "noblank": true, "say": "Many small farmers grow crops to earn money rather than just feed their families. They sell the rice at the market and use the profit to buy seeds for the next season.", "new": [{"w": "seeds", "vi": "hạt giống"}], "tw": "grow crops", "ipa": "/ɡrəʊ krɒps/"}, {"type": "mc", "ctx": "Reading", "s": "Coffee is a major cash crop in the highlands, so thousands of families depend on it. When prices fall, they earn very little, even after months of hard work. What does \"crop\" mean?", "o": ["cây trồng nông nghiệp", "máy cày", "sản phẩm nhà máy"], "a": "cây trồng nông nghiệp", "vi": "Cà phê là cây trồng bán lấy tiền chủ lực ở vùng cao nên hàng nghìn gia đình sống nhờ nó. Khi giá giảm, họ kiếm rất ít dù làm việc vất vả nhiều tháng.", "why": "crop = cây trồng nông nghiệp hoặc vụ mùa thu hoạch; cash crop = cây bán lấy tiền.", "noblank": true, "say": "Coffee is a major cash crop in the highlands, so thousands of families depend on it. When prices fall, they earn very little, even after months of hard work.", "new": [{"w": "highlands", "vi": "vùng cao"}, {"w": "depend on", "vi": "phụ thuộc vào"}], "tw": "crop", "ipa": "/krɒp/"}, {"type": "mc", "ctx": "Reading", "s": "Barley is grown on some farms in Scotland. After the harvest, part of it is sold to breweries, and the rest is used to feed cattle during winter. What does \"barley\" mean?", "o": ["lúa mạch", "khoai tây", "hạt tiêu"], "a": "lúa mạch", "vi": "Lúa mạch được trồng ở một số trang trại ở Scotland. Sau thu hoạch, một phần bán cho nhà máy bia, phần còn lại dùng nuôi bò trong mùa đông.", "why": "barley = lúa mạch (dùng làm bia, bánh mì, thức ăn gia súc).", "noblank": true, "say": "Barley is grown on some farms in Scotland. After the harvest, part of it is sold to breweries, and the rest is used to feed cattle during winter.", "new": [{"w": "breweries", "vi": "nhà máy bia"}, {"w": "cattle", "vi": "gia súc"}], "tw": "barley", "ipa": "/ˈbɑː.li/"}, {"type": "mc", "ctx": "Reading", "s": "Farming is not only physically difficult but also unpredictable. A single storm or a sudden fall in prices can destroy a year's income. What does \"farming\" mean?", "o": ["nghề nông", "nghề dạy học", "nghề lái xe"], "a": "nghề nông", "vi": "Nghề nông không chỉ vất vả về thể chất mà còn khó đoán. Một cơn bão hay giá giảm đột ngột có thể phá hủy thu nhập cả năm.", "why": "farming = nghề nông, việc làm nông (không đếm được); farmer = nông dân.", "noblank": true, "say": "Farming is not only physically difficult but also unpredictable. A single storm or a sudden fall in prices can destroy a year's income.", "new": [{"w": "unpredictable", "vi": "khó đoán"}, {"w": "income", "vi": "thu nhập"}], "tw": "farming", "ipa": "/ˈfɑː.mɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "The bakers are up at three every morning, long before the town wakes up. By the time customers arrive, the first bread is already hot on the shelves. What does \"are up at three\" mean?", "o": ["đã dậy lúc ba giờ", "đi ngủ lúc ba giờ", "đến muộn lúc ba giờ"], "a": "đã dậy lúc ba giờ", "vi": "Các thợ làm bánh dậy lúc ba giờ mỗi sáng, rất lâu trước khi thị trấn thức giấc. Khi khách đến, ổ bánh đầu tiên đã nóng trên kệ.", "why": "be up at + giờ = đã dậy/ra khỏi giường lúc mấy giờ (ví dụ: I'm up at six).", "noblank": true, "say": "The bakers are up at three every morning, long before the town wakes up. By the time customers arrive, the first bread is already hot on the shelves.", "new": [{"w": "shelves", "vi": "kệ"}], "tw": "be up at", "ipa": "/bi ʌp ət/"}, {"type": "mc", "ctx": "Reading", "s": "People who live in a village often share vegetables and help each other during the harvest. This friendly custom is slowly disappearing as young residents move to the cities. What does \"live in a village\" mean?", "o": ["sống trong một ngôi làng", "sống trên một con tàu", "sống ở nước ngoài"], "a": "sống trong một ngôi làng", "vi": "Người sống trong làng thường chia sẻ rau và giúp nhau lúc thu hoạch. Phong tục thân thiện này dần mất đi khi người trẻ chuyển lên thành phố.", "why": "live in a village = sống trong một ngôi làng; village (n) = làng, thôn.", "noblank": true, "say": "People who live in a village often share vegetables and help each other during the harvest. This friendly custom is slowly disappearing as young residents move to the cities.", "new": [{"w": "custom", "vi": "phong tục"}], "tw": "live in a village", "ipa": "/lɪv ɪn ə ˈvɪl.ɪdʒ/"}, {"type": "mc", "ctx": "Reading", "s": "We were standing in the rain for ages, hoping a taxi would come along. Finally, a yellow cab appeared at the corner, and we jumped in. What does \"come along\" mean?", "o": ["xuất hiện, đi tới", "rời đi", "dừng hẳn"], "a": "xuất hiện, đi tới", "vi": "Chúng tôi đứng dưới mưa rất lâu, mong có taxi xuất hiện. Cuối cùng một chiếc taxi vàng hiện ra ở góc đường và chúng tôi nhảy lên.", "why": "come along = xuất hiện, đến (thường nói về xe cộ hoặc cơ hội); cũng nghĩa đi cùng.", "noblank": true, "say": "We were standing in the rain for ages, hoping a taxi would come along. Finally, a yellow cab appeared at the corner, and we jumped in.", "new": [{"w": "ages", "vi": "rất lâu"}, {"w": "cab", "vi": "taxi"}], "tw": "come along", "ipa": "/kʌm əˈlɒŋ/"}, {"type": "mc", "ctx": "Reading", "s": "Many accidents happen at this junction because the road is narrow and drivers cannot see traffic from the right. The council is planning to install a roundabout. What does \"junction\" mean?", "o": ["ngã tư, giao lộ", "cầu vượt", "bãi đỗ xe"], "a": "ngã tư, giao lộ", "vi": "Nhiều tai nạn xảy ra ở giao lộ này vì đường hẹp và tài xế không thấy xe từ bên phải. Hội đồng định lắp một vòng xuyến.", "why": "junction = giao lộ, ngã tư/ngã ba (nơi các đường gặp nhau).", "noblank": true, "say": "Many accidents happen at this junction because the road is narrow and drivers cannot see traffic from the right. The council is planning to install a roundabout.", "new": [{"w": "roundabout", "vi": "vòng xuyến"}], "tw": "junction", "ipa": "/ˈdʒʌŋkʃn/"}, {"type": "mc", "ctx": "Reading", "s": "Just after the village there is a bend in the road, so cyclists should keep to the left side. Some drivers go too fast and cannot stop in time. What does \"a bend in the road\" mean?", "o": ["khúc cua trên đường", "ổ gà trên đường", "biển báo giao thông"], "a": "khúc cua trên đường", "vi": "Ngay sau làng có khúc cua trên đường nên người đạp xe nên đi bên trái. Một số tài xế đi quá nhanh và không dừng kịp.", "why": "a bend (in the road) = khúc cua, đoạn đường cong; a sharp bend = khúc cua gấp.", "noblank": true, "say": "Just after the village there is a bend in the road, so cyclists should keep to the left side. Some drivers go too fast and cannot stop in time.", "tw": "a bend (in the road)", "ipa": "/bend/"}, {"type": "mc", "ctx": "Reading", "s": "The railway bends to the right near the station, which means trains must slow down. Passengers sometimes feel the carriage lean as it goes round. What does \"bends\" mean?", "o": ["uốn cong, cua", "dừng lại", "kéo dài thẳng"], "a": "uốn cong, cua", "vi": "Đường ray cua sang phải gần nhà ga nên tàu phải giảm tốc. Hành khách đôi khi cảm thấy toa nghiêng khi tàu đi vòng.", "why": "bend (to the left/right) = (đường) cua, uốn cong sang trái/phải; động từ bend – bent – bent.", "noblank": true, "say": "The railway bends to the right near the station, which means trains must slow down. Passengers sometimes feel the carriage lean as it goes round.", "new": [{"w": "carriage", "vi": "toa tàu"}, {"w": "lean", "vi": "nghiêng"}], "tw": "bend (to the left/right)", "ipa": "/bend/"}, {"type": "mc", "ctx": "Reading", "s": "The council has painted a new pedestrian crossing outside the primary school. Since then, fewer children have been hurt, and parents feel more confident about the morning walk. What does \"pedestrian crossing\" mean?", "o": ["vạch sang đường cho người đi bộ", "bãi đỗ xe buýt", "đường cao tốc"], "a": "vạch sang đường cho người đi bộ", "vi": "Hội đồng đã sơn vạch sang đường mới trước trường tiểu học. Từ đó ít trẻ bị thương hơn và phụ huynh yên tâm hơn khi đưa con đi bộ buổi sáng.", "why": "pedestrian crossing = vạch sang đường cho người đi bộ (Anh-Anh); Anh-Mỹ: crosswalk.", "noblank": true, "say": "The council has painted a new pedestrian crossing outside the primary school. Since then, fewer children have been hurt, and parents feel more confident about the morning walk.", "new": [{"w": "primary", "vi": "tiểu học"}, {"w": "confident", "vi": "yên tâm"}], "tw": "pedestrian crossing", "ipa": "/pəˈdestriən ˈkrɒsɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "An American friend told me to use the crosswalk instead of running across the busy street. She said it is not only safer but also required by law. What does \"crosswalk\" mean?", "o": ["vạch sang đường cho người đi bộ", "dải phân cách đường", "làn xe đạp"], "a": "vạch sang đường cho người đi bộ", "vi": "Một người bạn Mỹ bảo tôi dùng vạch sang đường thay vì chạy qua con phố đông. Cô nói như vậy không chỉ an toàn hơn mà còn bắt buộc theo luật.", "why": "crosswalk = vạch sang đường cho người đi bộ (Anh-Mỹ); Anh-Anh: pedestrian crossing.", "noblank": true, "say": "An American friend told me to use the crosswalk instead of running across the busy street. She said it is not only safer but also required by law.", "new": [{"w": "required", "vi": "bắt buộc"}], "tw": "crosswalk", "ipa": "/ˈkrɔːs.wɔːk/"}, {"type": "mc", "ctx": "Reading", "s": "Crossing the road in this city can be difficult because motorbikes come from every direction. Locals advise tourists to walk slowly and steadily so that drivers can avoid them. What does \"crossing the road\" mean?", "o": ["sang đường", "sửa đường", "đi dọc theo đường"], "a": "sang đường", "vi": "Sang đường ở thành phố này có thể khó vì xe máy đến từ mọi hướng. Người địa phương khuyên du khách đi chậm và đều để tài xế tránh được.", "why": "crossing the road = sang đường, băng qua đường; cross the road.", "noblank": true, "say": "Crossing the road in this city can be difficult because motorbikes come from every direction. Locals advise tourists to walk slowly and steadily so that drivers can avoid them.", "new": [{"w": "steadily", "vi": "đều đặn"}], "tw": "crossing the road"}, {"type": "mc", "ctx": "Reading", "s": "A new road sign has been put up near the school to remind drivers to slow down. It shows two children crossing, and it flashes when a car goes too fast. What does \"road sign\" mean?", "o": ["biển báo giao thông", "tai nạn giao thông", "giấy phép lái xe"], "a": "biển báo giao thông", "vi": "Một biển báo giao thông mới được dựng gần trường để nhắc tài xế giảm tốc. Biển hình hai đứa trẻ băng qua và nhấp nháy khi xe đi quá nhanh.", "why": "road sign = biển báo giao thông; traffic sign cũng dùng.", "noblank": true, "say": "A new road sign has been put up near the school to remind drivers to slow down. It shows two children crossing, and it flashes when a car goes too fast.", "new": [{"w": "flashes", "vi": "nhấp nháy"}], "tw": "road sign", "ipa": "/ˈrəʊd saɪn/"}, {"type": "mc", "ctx": "Reading", "s": "A sign saying no overtaking appears every few hundred metres on this hill road. Because the view ahead is limited, passing another car there could cause a head-on crash. What does \"no overtaking\" mean?", "o": ["cấm vượt", "cấm đỗ xe", "cấm rẽ trái"], "a": "cấm vượt", "vi": "Biển cấm vượt xuất hiện cứ vài trăm mét trên đường đồi này. Vì tầm nhìn phía trước hạn chế, vượt xe ở đó có thể gây va chạm trực diện.", "why": "no overtaking = cấm vượt (biển báo hoặc quy định); overtake = vượt xe khác.", "noblank": true, "say": "A sign saying no overtaking appears every few hundred metres on this hill road. Because the view ahead is limited, passing another car there could cause a head-on crash.", "new": [{"w": "head-on", "vi": "trực diện"}], "tw": "no overtaking", "ipa": "/ˌnəʊ ˌəʊvəˈteɪkɪŋ/"}, {"type": "mc", "ctx": "Reading", "s": "On the motorway, a red sports car overtook us at great speed and disappeared round the corner within seconds. Dad said such drivers should be careful. What does \"overtook\" mean?", "o": ["vượt qua (xe khác)", "đi theo sau", "dừng lại phía trước"], "a": "vượt qua (xe khác)", "vi": "Trên đường cao tốc, một chiếc xe thể thao đỏ vượt chúng tôi với tốc độ rất cao và biến mất sau góc cua trong vài giây. Bố nói những tài xế như vậy nên cẩn thận.", "why": "overtake sth/sb = vượt (xe khác); quá khứ overtook; quá khứ phân từ overtaken.", "noblank": true, "say": "On the motorway, a red sports car overtook us at great speed and disappeared round the corner within seconds. Dad said such drivers should be careful.", "tw": "overtake something/somebody", "ipa": "/ˌəʊvəˈteɪk/"}, {"type": "mc", "ctx": "Reading", "s": "After several accidents, the council lowered the speed limit near the school from fifty to thirty. Drivers who break the rule are caught by cameras at the roadside. What does \"speed limit\" mean?", "o": ["giới hạn tốc độ", "đoạn đường cong", "chi phí xăng"], "a": "giới hạn tốc độ", "vi": "Sau vài vụ tai nạn, hội đồng hạ giới hạn tốc độ gần trường từ năm mươi xuống ba mươi. Tài xế vi phạm bị camera ven đường ghi lại.", "why": "speed limit = giới hạn tốc độ (tốc độ tối đa cho phép).", "noblank": true, "say": "After several accidents, the council lowered the speed limit near the school from fifty to thirty. Drivers who break the rule are caught by cameras at the roadside.", "new": [{"w": "lowered", "vi": "hạ thấp"}], "tw": "speed limit", "ipa": "/ˈspiːd ˌlɪmɪt/"}, {"type": "mc", "ctx": "Reading", "s": "A new motorway will connect the port to the capital, cutting the journey from five hours to three. Local businesses hope it will bring more customers and cheaper deliveries. What does \"motorway\" mean?", "o": ["đường cao tốc", "đường mòn", "đường ray"], "a": "đường cao tốc", "vi": "Một đường cao tốc mới sẽ nối cảng với thủ đô, rút chuyến đi từ năm xuống ba tiếng. Doanh nghiệp địa phương hy vọng nó đem thêm khách và giao hàng rẻ hơn.", "why": "motorway = đường cao tốc (Anh-Anh); Anh-Mỹ: highway/freeway.", "noblank": true, "say": "A new motorway will connect the port to the capital, cutting the journey from five hours to three. Local businesses hope it will bring more customers and cheaper deliveries.", "new": [{"w": "deliveries", "vi": "việc giao hàng"}], "tw": "motorway", "ipa": "/ˈməʊtəweɪ/"}, {"type": "mc", "ctx": "Reading", "s": "My grandmother always stays in the inside lane on the motorway because she drives at about sixty. Faster cars use the other lane, so they pass her without any problem. What does \"inside lane\" mean?", "o": ["làn trong, làn chạy chậm", "làn khẩn cấp", "làn dành cho xe đạp"], "a": "làn trong, làn chạy chậm", "vi": "Bà tôi luôn đi làn trong trên đường cao tốc vì bà lái khoảng sáu mươi. Xe nhanh hơn dùng làn kia nên vượt bà không vấn đề gì.", "why": "inside lane = làn gần lề/làn chậm trên đường cao tốc (Anh); outside lane = làn nhanh.", "noblank": true, "say": "My grandmother always stays in the inside lane on the motorway because she drives at about sixty. Faster cars use the other lane, so they pass her without any problem.", "tw": "inside (slow) lane", "ipa": "/ˌɪnsaɪd ˈsləʊ leɪn/"}, {"type": "mc", "ctx": "Reading", "s": "Racing drivers love the outside lane, where they can accelerate and pass slower cars. However, ordinary drivers should return to the inside lane after overtaking. What does \"outside lane\" mean?", "o": ["làn ngoài, làn chạy nhanh", "làn rẽ phải", "làn dành cho người đi bộ"], "a": "làn ngoài, làn chạy nhanh", "vi": "Tay đua yêu làn ngoài, nơi họ tăng tốc và vượt xe chậm hơn. Tuy nhiên tài xế bình thường nên trở lại làn trong sau khi vượt.", "why": "outside lane = làn xa lề/làn nhanh để vượt trên đường cao tốc (Anh); inside lane = làn chậm.", "noblank": true, "say": "Racing drivers love the outside lane, where they can accelerate and pass slower cars. However, ordinary drivers should return to the inside lane after overtaking.", "new": [{"w": "accelerate", "vi": "tăng tốc"}], "tw": "outside (fast) lane", "ipa": "/ˌaʊtsaɪd ˈfɑːst leɪn/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Home and renting", "s": "Describe the place where you live or would like to live. Say what the main rooms are like and how you got it.", "vi": "Hãy tả nơi bạn sống hoặc muốn sống. Nói các phòng chính như thế nào và bạn có nơi đó bằng cách nào.", "words": ["a firm armchair", "a carpeted room", "rent", "hire", "parking space"], "why": "Nêu loại nhà, phòng bạn thích, đồ nội thất; so sánh thuê dài hạn (rent) và thuê ngắn hạn (hire); dùng although/instead of.", "sample": "I would like to describe my ideal flat. Last year I decided to rent a small place near my office instead of buying one, because I wanted flexibility. The living room is a carpeted room with large windows, and in the corner there is a firm armchair where I read in the evenings. The only problem is the parking space: there are very few, so I hire a car only when I travel at weekends. Although the flat is not luxurious, it is comfortable and quiet, and I feel at home there."}, {"type": "sp", "ctx": "Money and shopping", "s": "Talk about a time when you bought something expensive. Was it worth the price? Explain why or why not.", "vi": "Hãy kể về một lần bạn mua món đồ đắt tiền. Nó có đáng giá không? Giải thích vì sao.", "words": ["earn a reasonable amount of money", "good value for money", "poor value for money", "charge someone", "charge someone for something", "a potload of money", "good value"], "why": "Kể món đồ, giá, so sánh với món khác; dùng good/poor value for money và lý do; thêm whereas/although.", "sample": "Last year I bought a laptop for my studies. Many shops charge customers a lot for famous brands, so I compared prices for a week. I do not earn a reasonable amount of money yet, only a small part-time salary, so I could not spend a potload of money. Finally I chose a mid-priced model, which I think was good value for money, whereas a friend's tablet was poor value for money because it broke after six months. Next time I will ask whether the shop will charge me for repairs, because some stores charge customers for services that should be free."}, {"type": "sp", "ctx": "Work and motivation", "s": "Why do some people choose a job because they love it rather than because of the salary? What do you think?", "vi": "Vì sao một số người chọn công việc vì yêu thích hơn là vì lương? Bạn nghĩ sao?", "words": ["hold on a second", "essentially", "essential", "assume", "position", "have a passion for something", "a sense of achievement", "betterment of something"], "why": "Nêu quan điểm, lấy ví dụ người thân bỏ lương cao theo đam mê; dùng essentially, a sense of achievement, nhượng bộ bằng although.", "sample": "Hold on a second, let me think. Essentially, I believe people are happier when they have a passion for their work. Many of us assume that a high salary is essential, but I think a sense of achievement matters more. For example, my aunt left a well-paid position at a bank to teach children, and she says that contributing to the betterment of her community gives her more satisfaction than money ever did. Of course, we all need enough income to live, although it should not be the only goal."}, {"type": "sp", "ctx": "Technology and society", "s": "Which invention do you think has changed people's lives the most? Explain your choice.", "vi": "Theo bạn phát minh nào đã thay đổi cuộc sống con người nhiều nhất? Giải thích lựa chọn của bạn.", "words": ["revolutionize", "revolutionary", "revolution", "humanity"], "why": "Chọn một phát minh, nói nó thay đổi lĩnh vực nào, nêu ví dụ và mặt trái; dùng revolutionize, revolution, humanity.", "sample": "I think the smartphone has changed life more than any other invention. It was a revolutionary device because it combined a phone, a camera and a computer in one pocket. In just ten years it started to revolutionize education, banking and entertainment, and many experts describe the change as a digital revolution. Although it causes problems such as addiction, I believe it has helped humanity by giving people instant access to information. For instance, students in remote villages can now watch lessons online, which would have been impossible a generation ago."}, {"type": "sp", "ctx": "Sport", "s": "Describe a sports person you admire. Say what they have achieved and why you respect them.", "vi": "Hãy tả một người chơi thể thao bạn ngưỡng mộ. Nói họ đạt được gì và vì sao bạn kính trọng họ.", "words": ["break a record", "record breaker", "athlete", "sportsman"], "why": "Giới thiệu người đó, thành tích, quá trình luyện tập, lý do ngưỡng mộ; dùng thì quá khứ và which.", "sample": "I admire a swimmer from my country who is a real record breaker.
