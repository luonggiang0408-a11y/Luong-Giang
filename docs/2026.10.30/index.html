    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .tag{font-weight:700;margin-right:8px}
.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}
.manual summary{cursor:pointer;color:var(--muted)}
.manual textarea{width:100%;min-height:90px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.band .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--primary)}
.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

ank": true, "say": "My brother spent a potload of money on a new gaming computer, and now he cannot afford to go out with friends. He says it was worth it, though.", "new": [{"w": "afford", "vi": "đủ khả năng chi trả"}, {"w": "worth it", "vi": "đáng giá"}], "tw": "a potload of money", "ipa": "/ə ˈpɒt.ləʊd əv ˈmʌn.i/"}, {"type": "mc", "ctx": "Reading", "s": "Last night I tried to imagine working from a beach café every day. It sounded perfect at first, but then I thought about the slow internet and the noise. What does \"imagine working\" mean?", "o": ["tưởng tượng việc làm việc", "nhớ lại đã từng làm việc", "từ chối làm việc"], "a": "tưởng tượng việc làm việc", "vi": "Tối qua tôi thử tưởng tượng việc làm việc ở quán cà phê bãi biển mỗi ngày. Thoạt đầu nghe thật hoàn hảo, nhưng rồi tôi nghĩ đến internet chậm và tiếng ồn.", "why": "imagine + V-ing = tưởng tượng việc làm gì; sau imagine dùng V-ing, không dùng to V.", "noblank": true, "say": "Last night I tried to imagine working from a beach café every day. It sounded perfect at first, but then I thought about the slow internet and the noise.", "new": [{"w": "noise", "vi": "tiếng ồn"}], "tw": "imagine doing", "ipa": "/ɪˈmædʒ.ɪn/"}, {"type": "mc", "ctx": "Reading", "s": "The photographer waited for an hour until the sun was in the right spot behind the mountain. Only then did she take the picture she had planned. What does \"in the right spot\" mean?", "o": ["ở đúng vị trí, đúng chỗ", "ở một nơi rất xa", "ở một nơi nguy hiểm"], "a": "ở đúng vị trí, đúng chỗ", "vi": "Nhiếp ảnh gia chờ một giờ đến khi mặt trời ở đúng vị trí sau ngọn núi. Chỉ khi đó cô mới chụp bức ảnh đã định.", "why": "in the right spot = ở đúng vị trí/đúng chỗ; spot = chỗ, vị trí.", "noblank": true, "say": "The photographer waited for an hour until the sun was in the right spot behind the mountain. Only then did she take the picture she had planned.", "tw": "in the right spot", "ipa": "/ɪn ðə raɪt spɒt/"}, {"type": "mc", "ctx": "Reading", "s": "Writing ô thấy đói.", "why": "be in a hurry = đang vội; I'm in a hurry = tôi đang vội.", "noblank": true, "say": "Karen was in a hurry this morning, so she skipped breakfast and ran to the bus stop. She felt hungry all morning at work.", "new": [{"w": "skip", "vi": "bỏ (bữa)"}], "tw": "be in a hurry", "ipa": "/ɪn ə ˈhʌri/"}, {"type": "mc", "ctx": "Reading", "s": "Our new flat comes with a free parking space behind the building, which is a huge advantage in this crowded neighbourhood. Residents without one pay a lot to park nearby. What does \"parking space\" mean?", "o": ["chỗ đỗ xe", "biển báo giao thông", "bãi rửa xe"], "a": "chỗ đỗ xe", "vi": "Căn hộ mới của chúng tôi có chỗ đỗ xe miễn phí sau tòa nhà, một lợi thế lớn ở khu đông đúc này. Cư dân không có chỗ phải trả nhiều tiền để đỗ gần đó.", "why": "parking space = chỗ đỗ xe; find a parking space = tìm được chỗ đỗ.", "noblank": true, "say": "Our new flat comes with a free parking space behind the building, which is a huge advantage in this crowded neighbourhood. Residents without one pay a lot to park nearby.", "new": [{"w": "advantage", "vi": "lợi thế"}, {"w": "resident", "vi": "cư dân"}], "tw": "parking space"}, {"type": "mc", "ctx": "Reading", "s": "The team had no idea how to reduce waste in the canteen until Sara came up with a simple solution: smaller plates. Food waste dropped by thirty percent within a month. What does \"come up with\" mean?", "o": ["nghĩ ra, đề xuất (ý tưởng)", "chấp nhận chịu đựng", "từ bỏ"], "a": "nghĩ ra, đề xuất (ý tưởng)", "vi": "Cả nhóm không biết làm sao giảm lãng phí ở căng tin cho đến khi Sara nghĩ ra giải pháp đơn giản: đĩa nhỏ hơn. Thức ăn thừa giảm ba mươi phần trăm trong một tháng.", "why": "come up with sth = nghĩ ra/đề xuất ý tưởng, giải pháp, kế hoạch.", "noblank": true, "say": "The team had no idea how to reduce waste in the canteen until Sara came up with a simple solution: smaller plates. Food waste dropped by thirty percent within a month.", "new": [{"w": "canteen", "vi": "căng tin"}, {"w": "waste", "vi": "rác thải, lãng phí"}], "tw": "come up with"}, {"type": "mc", "ctx": "Reading", "s": "Anna enjoys life in the countryside, but she admits that there isn't much to do after six o'clock. The cinema is forty kilometres away and the last bus leaves early. What does \"there isn't much to do\" mean?", "o": ["không có nhiều hoạt động để làm", "không có nhiều việc phải làm ở nhà", "không có nhiều người để gặp"], "a": "không có nhiều hoạt động để làm", "vi": "Anna thích cuộc sống ở nông thôn nhưng thừa nhận sau sáu giờ không có nhiều thứ để làm. Rạp phim cách bốn mươi cây số và chuyến xe buýt cuối rời đi sớm.", "why": "there isn't much to do = không có nhiều hoạt động/giải trí; thường nói về một nơi buồn tẻ.", "noblank": true, "say": "Anna enjoys life in the countryside, but she admits that there isn't much to do after six o'clock. The cinema is forty kilometres away and the last bus leaves early.", "new": [{"w": "admit", "vi": "thừa nhận"}], "tw": "there isn't much to do", "ipa": "/ðeər ˈɪz.ənt mʌtʃ tə duː/"}, {"type": "mc", "ctx": "Reading", "s": "I am hopeless at cooking: last week I burned the rice and set off the smoke alarm. My sister has promised to teach me some simple recipes. What does \"hopeless\" mean?", "o": ["rất tệ, không có khả năng", "rất giỏi", "rất thích"], "a": "rất tệ, không có khả năng", "vi": "Tôi nấu ăn rất tệ: tuần trước tôi làm cháy cơm và làm chuông báo khói kêu. Chị tôi hứa dạy tôi vài công thức đơn giản.", "why": "hopeless = rất tệ/vô dụng (nói về dịch vụ, người); be hopeless at sth = rất kém việc gì.", "noblank": true, "say": "I am hopeless at cooking: last week I burned the rice and set off the smoke alarm. My sister has promised to teach me some simple recipes.", "new": [{"w": "smoke alarm", "vi": "chuông báo khói"}, {"w": "recipe", "vi": "công thức nấu ăn"}], "tw": "hopeless", "ipa": "/ˈhəʊp.ləs/"}, {"type": "mc", "ctx": "Reading", "s": "We walked up a steep green hill for an hour. At the top, the view of the villages below was so beautiful that nobody wanted to go back down. What does \"hill\" mean?", "o": ["đồi", "sông", "hồ"], "a": "đồi", "vi": "Chúng tôi đi lên một ngọn đồi xanh dốc trong một giờ. Trên đỉnh, cảnh các ngôi làng bên dưới đẹp đến mức không ai muốn quay xuống.", "why": "hill = đồi; thấp hơn núi (mountain).", "noblank": true, "say": "We walked up a steep green hill for an hour. At the top, the view of the villages below was so beautiful that nobody wanted to go back down.", "new": [{"w": "view", "vi": "cảnh quan"}], "tw": "hill", "ipa": "/hɪl/"}, {"type": "mc", "ctx": "Reading", "s": "The village lies in a narrow valley between two mountains, so it gets less sunshine in winter. In summer, however, the cool air from the river makes it a pleasant place. What does \"valley\" mean?", "o": ["thung lũng", "đỉnh núi", "hang động"], "a": "thung lũng", "vi": "Ngôi làng nằm trong một thung lũng hẹp giữa hai ngọn núi nên mùa đông ít nắng. Tuy nhiên mùa hè, không khí mát từ sông khiến nơi đây dễ chịu.", "why": "valley = thung lũng, vùng đất thấp giữa hai dãy đồi/núi, thường có sông.", "noblank": true, "say": "The village lies in a narrow valley between two mountains, so it gets less sunshine in winter. In summer, however, the cool air from the river makes it a pleasant place.", "new": [{"w": "narrow", "vi": "hẹp"}], "tw": "valley", "ipa": "/ˈvæl.i/"}, {"type": "mc", "ctx": "Reading", "s": "Every morning, my grandfather walks through the field of wheat next to his house to check whether the crop is ready. Soon it will be time to harvest. What does \"field\" mean?", "o": ["cánh đồng", "nhà kho", "khu chợ"], "a": "cánh đồng", "vi": "Mỗi sáng, ông tôi đi qua cánh đồng lúa mì cạnh nhà để kiểm tra vụ mùa đã sẵn sàng chưa. Sắp đến lúc thu hoạch.", "why": "field = cánh đồng, thửa ruộng (trồng trọt hoặc chăn thả).", "noblank": true, "say": "Every morning, my grandfather walks through the field of wheat next to his house to check whether the crop is ready. Soon it will be time to harvest.", "new": [{"w": "crop", "vi": "vụ mùa"}, {"w": "harvest", "vi": "thu hoạch"}], "tw": "field", "ipa": "/fiːld/"}, {"type": "mc", "ctx": "Reading", "s": "The farmhouse where my uncle lives has been in our family for three generations. It has thick walls, a large kitchen and a barn for the animals. What does \"farmhouse\" mean?", "o": ["nhà ở trong trang trại", "chuồng gia súc", "cửa hàng bán nông sản"], "a": "nhà ở trong trang trại", "vi": "Ngôi nhà trang trại nơi chú tôi sống đã thuộc về gia đình tôi ba thế hệ. Nó có tường dày, bếp rộng và một chuồng cho gia súc.", "why": "farmhouse = nhà ở trong trang trại (khác barn là chuồng/kho).", "noblank": true, "say": "The farmhouse where my uncle lives has been in our family for three generations. It has thick walls, a large kitchen and a barn for the animals.", "new": [{"w": "generation", "vi": "thế hệ"}, {"w": "barn", "vi": "chuồng trại"}], "tw": "farmhouse", "ipa": "/ˈfɑːm.haʊs/"}, {"type": "mc", "ctx": "Reading", "s": "A low metal fence separates our garden from the neighbours' garden. Their dog sometimes jumps over it, which is why we are thinking of building a higher one. What does \"fence\" mean?", "o": ["hàng rào", "cổng chính", "mái nhà"], "a": "hàng rào", "vi": "Một hàng rào kim loại thấp ngăn vườn nhà tôi với vườn hàng xóm. Con chó của họ đôi khi nhảy qua, nên chúng tôi đang nghĩ đến việc dựng cái cao hơn.", "why": "fence = hàng rào (gỗ, kim loại) bao quanh khu đất.", "noblank": true, "say": "A low metal fence separates our garden from the neighbours' garden. Their dog sometimes jumps over it, which is why we are thinking of building a higher one.", "new": [{"w": "separate", "vi": "ngăn cách"}], "tw": "fence", "ipa": "/fens/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Daily routine", "s": "What do you usually eat for breakfast on a busy weekday? Tell me how long it takes you to get ready in the morning.", "vi": "Bạn thường ăn gì vào bữa sáng ngày bận? Hãy nói bạn mất bao lâu để chuẩn bị buổi sáng.", "words": ["cereal", "be in a hurry", "it takes someone time to do", "just under"], "why": "Nêu món ăn sáng, thời gian chuẩn bị bằng it takes me… to…, nói khi nào bạn vội (be in a hurry) và dùng just under + số phút.", "sample": "On weekdays I am usually in a hurry, so my breakfast is simple. I normally have a bowl of cereal with milk, and sometimes a banana if I have time. It takes me about twenty minutes to get ready, and the whole morning routine, including the trip to work, takes just under an hour. Although I would love to cook a proper meal, I prefer to sleep a little longer. On weekends, however, I make eggs and toast slowly, because nobody is waiting for me and I can enjoy the food."}, {"type": "sp", "ctx": "Daily annoyances", "s": "Describe something that annoys you in daily life. Explain why it bothers you and what you do about it.", "vi": "Hãy tả một điều làm bạn khó chịu trong cuộc sống hằng ngày. Giải thích vì sao và bạn xử lý thế nào.", "words": ["drive someone crazy", "hopeless", "imagine doing", "come up with"], "why": "Nêu điều gây khó chịu, kể ví dụ cụ thể, rồi nói bạn đã nghĩ ra cách giải quyết nào (come up with).", "sample": "One thing that drives me crazy is slow public transport. In my city the buses are hopeless at rush hour: they are crowded, late and sometimes they do not come at all. Can you imagine waiting forty minutes in the rain for a bus that is already full? Last winter I came up with a solution: I started cycling to work. It was difficult at first, but now I feel healthier and I save money. Although the weather can still be a problem, I would never go back to the bus."}, {"type": "sp", "ctx": "Money and happiness", "s": "Do you think money is important for a happy life? Why or why not?", "vi": "Bạn có nghĩ tiền quan trọng cho một cuộc sống hạnh phúc không? Vì sao?", "words": ["earn a reasonable amount of money", "a potload of money", "what goes up must come down"], "why": "Nêu quan điểm, so sánh kiếm đủ sống với có thật nhiều tiền, và dùng thành ngữ để nói về sự lên xuống của may mắn/thu nhập.", "sample": "In my opinion, money is important, but only up to a point. If you earn a reasonable amount of money, you can pay your bills, travel sometimes and feel secure. However, I do not believe that a potload of money automatically makes people happier. I have a friend who made a fortune in business, and he worked so hard that he rarely saw his family. Besides, what goes up must come down: companies fail and markets crash. That is why I think a stable job and good relationships matter more than a huge salary."}, {"type": "sp", "ctx": "Clothes and style", "s": "Describe an outfit that you like wearing. Say when you wear it and why it suits you.", "vi": "Hãy tả một bộ đồ bạn thích mặc. Nói bạn mặc khi nào và vì sao nó hợp với bạn.", "words": ["look good in", "suit someone", "do up a zip", "undo a zip"], "why": "Tả bộ đồ, màu sắc, dịp mặc; nói vì sao hợp (suit) và một chi tiết như khóa kéo trong thời tiết lạnh/nóng.", "sample": "My favourite outfit is a dark blue jacket with jeans and white trainers. I think I look good in dark colours, and my sister says the style really suits me. I wear it on weekends, especially in autumn. When I go out in the morning, it is cold, so I do up the zip all the way to my chin. Later, when the sun comes out, I undo the zip and carry the jacket on my arm. It is comfortable, simple and not expensive, which is exactly what I need."}, {"type": "sp", "ctx": "Home organisation", "s": "How do you keep your home or workspace organised? Mention any problems you have with space.", "vi": "Bạn giữ nhà hoặc chỗ làm việc ngăn nắp như thế nào? Nói về các vấn đề về không gian.", "words": ["in the right spot", "parking space", "come up with", "be in a hurry"], "why": "Mô tả cách sắp xếp đồ đạc, một vấn đề cụ thể (ví dụ chỗ đỗ xe), và cách bạn giải quyết.", "sample": "I try to keep everything in the right spot, because otherwise I waste time looking for things when I am in a hurry. For example, my keys and my wallet always stay on a small shelf near the door. The biggest problem in my building is the parking space: there are far too few for all the residents, so people argue about them. Last month a neighbour came up with a good idea, which was to use numbered cards for each flat. It works quite well, and the arguments have almost stopped."}, {"type": "sp", "ctx": "Village life", "s": "Describe a small town or village you know. What are the good and bad points of living there?", "vi": "Hãy tả một thị trấn hay ngôi làng bạn biết. Ưu và nhược điểm khi sống ở đó là gì?", "words": ["there isn't much to do", "hopeless", "hill", "valley"], "why": "Tả vị trí, cảnh quan, rồi nêu một ưu điểm và một nhược điểm; dùng although/whereas để đối lập.", "sample": "I would like to describe my grandparents' village, which lies in a green valley with a small hill behind it. The air is fresh and the people are friendly, whereas in the city everything is noisy and expensive. On the other hand, there isn't much to do in the evenings, and the public transport is hopeless, with only two buses a day. As a result, young people often move away to find jobs. Even so, I love visiting during the holidays, because it helps me relax and forget about stress."}, {"type": "sp", "ctx": "Countryside", "s": "Describe a place in the countryside that you have visited or would like to visit.", "vi": "Hãy tả một nơi ở vùng quê bạn đã đến hoặc muốn đến.", "words": ["field", "farmhouse", "fence", "hill", "valley"], "why": "Tả vị trí, cảnh vật (cánh đồng, nhà trang trại, hàng rào, đồi), điều bạn làm ở đó và cảm xúc.", "sample": "Last summer I stayed for a weekend in an old farmhouse in the countryside. The house stood at the end of a long road, with a wooden fence around the garden and a huge field of wheat behind it. From the top of a nearby hill we could see the whole valley and a small river shining in the sun. In the morning we helped the owner feed the animals, and in the evening we cooked outside. It was so peaceful that I would love to go back."}, {"type": "sp", "ctx": "Living abroad", "s": "Would you like to live in another country for a few years? Explain your reasons.", "vi": "Bạn có muốn sống ở nước khác vài năm không? Giải thích lý do.", "words": ["imagine doing", "earn a reasonable amount of money", "it takes someone time to do", "just under"], "why": "Nêu mong muốn, lợi ích (công việc, ngôn ngữ), khó khăn; dùng imagine + V-ing và nói về thời gian cần để thích nghi.", "sample": "Yes, I would. I often imagine living in Canada, because I could improve my English and meet people from different cultures. I would also like to work there, as I could earn a reasonable amount of money and gain experience. Of course, it takes time to get used to a new country, and the first months can be lonely. The flight home would take just under twenty hours, which is long, but I think the experience would be worth it. If I had the chance, I would go for two or three years."}, {"type": "sp", "ctx": "Young people and cities", "s": "Some people say young people should leave small villages and move to big cities. Do you agree?", "vi": "Có người nói người trẻ nên rời làng nhỏ lên thành phố lớn. Bạn có đồng ý không?", "words": ["there isn't much to do", "hopeless", "parking space", "earn a reasonable amount of money"], "why": "Nêu quan điểm, cho lý do về việc làm và giải trí, rồi nhắc mặt trái của thành phố (đông đúc, thiếu chỗ đỗ xe).", "sample": "I partly agree. In small villages there isn't much to do for young people, and good jobs are rare, so it is hard to earn a reasonable amount of money. Public services can also be hopeless, for example when there is no late bus. However, big cities have problems too: rents are high, the streets are crowded, and finding a parking space can take half an hour. Therefore I think the best choice depends on your career. Young people should try the city for a while, but they should keep in touch with their hometown."}, {"type": "sp", "ctx": "A bad morning", "s": "Tell me about a time when you were in a hurry and something went wrong.", "vi": "Hãy kể về một lần bạn vội và có chuyện không ổn.", "words": ["be in a hurry", "do up a zip", "in the right spot", "just under", "drive someone crazy"], "why": "Kể theo thứ tự: chuyện xảy ra khi nào, vì sao vội, điều gì hỏng, bạn xử lý thế nào và cảm xúc.", "sample": "Last winter I was in a hurry because I had an exam at eight o'clock. I grabbed my coat, but I could not do up the zip, which was stuck, and it was freezing outside. Then I realised that my student card was not in the right spot, and I spent ten minutes searching for it. It drove me crazy! Finally I found it, ran to the station and arrived at the exam hall with just under five minutes to spare. Since then, I always prepare my bag the night before."}]}]};

    if(!R||R.id!==id)return;
    const cur=R;cur.active=false;clearInterval(cur.timer);
    const dur=(Date.now()-cur.t0)/1000;
    recMsg(id,'Đang chấm điểm…');
    try{cur.rec&&cur.rec.stop();}catch(e){}
    const finish=()=>{
      cur.stream.getTracks().forEach(t=>t.stop());
      if(cur.chunks.length){urls[id]&&URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(new Blob(cur.chunks,{type:(cur.mr&&cur.mr.mimeType)||'audio/webm'}));}
      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
