:root{
  --bg:#F2F6F8; --surface:#FFFFFF; --ink:#12263A; --muted:#566879; --line:#D3DDE5;
  --primary:#0E5A78; --primary-ink:#FFFFFF; --hl:#E6F36E; --hl-ink:#12263A;
  --good:#1B7448; --good-bg:#DDF2E5; --bad:#A93420; --bad-bg:#FBE4DD; --soft:#E7EFF4;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}

    --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
    --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .tag{font-weight:700;margin-right:8px}
.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}
.manual summary{cursor:pointer;color:var(--muted)}
.manual textarea{width:100%;min-height:90px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.band .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--primary)}
.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

tx": "Public embarrassment", "s": "Many shy students feel their hearts race when they must speak ___, even though they know the topic very well and have practiced at home.", "o": ["in front of people", "in the middle of nowhere", "at the end of the day"], "a": "in front of people", "vi": "Nhiều học sinh nhút nhát thấy tim đập nhanh khi phải nói trước mặt mọi người, dù biết rõ chủ đề và đã luyện ở nhà.", "why": "in front of people = ở nơi có người khác chứng kiến; trái nghĩa gần: in private.", "new": [{"w": "shy", "vi": "nhút nhát"}, {"w": "race", "vi": "đập nhanh"}], "tw": "in front of people"}, {"type": "mc", "ctx": "Team conflict", "s": "After weeks of silence, Tom finally decided to ___ his neighbor about the loud music, hoping they could find a solution without calling the police.", "o": ["address", "ignore", "reward"], "a": "address", "vi": "Sau nhiều tuần im lặng, Tom cuối cùng quyết định trao đổi trực tiếp với hàng xóm về tiếng nhạc ồn, hy vọng tìm được giải pháp mà không cần gọi cảnh sát.", "why": "address someone about something = nói thẳng với ai về một vấn đề (thường nhạy cảm).", "new": [{"w": "solution", "vi": "giải pháp"}], "tw": "address someone about something"}, {"type": "mc", "ctx": "Resolving a quarrel", "s": "Instead of slamming doors and sending angry texts, the two brothers agreed to sit down and ___ over a cup of tea.", "o": ["have a conversation like adults", "run a marathon together", "take a long vacation"], "a": "have a conversation like adults", "vi": "Thay vì đóng sầm cửa và nhắn tin giận dữ, hai anh em đồng ý ngồi xuống trao đổi văn minh bên tách trà.", "why": "have a conversation like adults = nói chuyện bình tĩnh, tôn trọng, không quát tháo.", "new": [{"w": "slam", "vi": "đóng sầm"}], "tw": "have a conversation like adults"}, {"type": "mc", "ctx": "After a mistake", "s": "When I realized how rude I had been at the party, I sent her a message to ___ and offered to buy her lunch.", "o": ["apologize for my behavior", "complain about the weather", "prepare for my exam"], "a": "apologize for my behavior", "vi": "Khi nhận ra mình đã thô lỗ thế nào ở bữa tiệc, tôi nhắn cho cô ấy để xin lỗi vì thái độ của mình và mời cô bữa trưa.", "why": "apologize for one's behavior = xin lỗi về cách cư xử; đổi his/her/my theo chủ ngữ.", "new": [{"w": "rude", "vi": "thô lỗ"}], "tw": "apologize for your behavior"}, {"type": "mc", "ctx": "Accepting an apology", "s": "At fifteen, Linh was ___ look after her younger sister alone for the weekend, so her parents felt comfortable traveling for work.", "o": ["mature enough to", "tired enough of", "polite enough for"], "a": "mature enough to", "vi": "Mười lăm tuổi, Linh đủ chín chắn để tự trông em gái cuối tuần, nên bố mẹ yên tâm đi công tác.", "why": "be mature enough to + V = đủ chín chắn để làm gì; mature /məˈtʃʊə/ ở đây là tính từ.", "new": [{"w": "look after", "vi": "chăm sóc"}], "tw": "mature enough to do something", "ipa": "/məˈtʃɔːr/"}, {"type": "mc", "ctx": "Forgiving a mistake", "s": "I will not report the broken equipment this time, ___, because repairs are expensive and the lab has already lost a lot of money.", "o": ["as long as it doesn't happen again", "even though it happened twice", "in case it happens again tomorrow"], "a": "as long as it doesn't happen again", "vi": "Lần này tôi sẽ không báo cáo thiết bị hỏng, miễn là chuyện đó không tái diễn, vì sửa chữa tốn kém và phòng thí nghiệm đã mất nhiều tiền.", "why": "as long as + mệnh đề = với điều kiện; as long as it doesn't happen again = miễn là không lặp lại.", "new": [{"w": "equipment", "vi": "thiết bị"}, {"w": "repair", "vi": "sửa chữa"}], "tw": "as long as it doesn't happen again"}, {"type": "mc", "ctx": "American kitchen", "s": "The chef at the New York restaurant roasts the ___ until it becomes soft and smoky, then blends it into a creamy dip.", "o": ["eggplant", "cucumber", "pumpkin"], "a": "eggplant", "vi": "Đầu bếp ở nhà hàng New York nướng cà tím đến khi mềm và thơm khói, rồi xay thành món chấm béo mịn e soup.", "o": ["bean sprouts", "sugar cubes", "bread rolls"], "a": "bean sprouts", "vi": "Ngoài rau thơm và chanh, người phục vụ mang ra một đĩa giá đỗ để khách thêm độ giòn cho tô phở của mình.", "why": "bean sprouts = giá đỗ (thường dùng số nhiều); ăn sống hoặc trụng nhanh.", "new": [{"w": "herbs", "vi": "rau thơm"}, {"w": "crunch", "vi": "độ giòn"}], "tw": "bean sprouts", "ipa": "/ˈbiːn spraʊts/"}, {"type": "mc", "ctx": "Vegetable stall", "s": "My mother peeled the round green ___ and cooked it with carrots in a light stock, a winter dish that always warms us up.", "o": ["kohlrabi", "mushroom", "corn"], "a": "kohlrabi", "vi": "Mẹ tôi gọt vỏ củ su hào tròn xanh và nấu với cà rốt trong nước hầm nhẹ, một món mùa đông luôn làm cả nhà ấm lên.", "why": "kohlrabi = su hào; củ tròn xanh nhạt, ăn giòn, vị ngọt nhẹ.", "new": [{"w": "stock", "vi": "nước hầm"}], "tw": "kohlrabi", "ipa": "/ˌkoʊlˈrɑː.bi/"}, {"type": "mc", "ctx": "Summer garden", "s": "After the fruit dried, the farmer removed the seeds and used the rough ___ fibers as a natural sponge for washing dishes.", "o": ["loofah", "bamboo", "cotton"], "a": "loofah", "vi": "Sau khi quả khô, người nông dân bỏ hạt và dùng xơ mướp thô làm miếng bọt biển tự nhiên để rửa bát.", "why": "loofah = quả mướp (ăn khi non) / xơ mướp (dùng cọ rửa khi già).", "new": [{"w": "fiber", "vi": "sợi"}, {"w": "sponge", "vi": "miếng bọt biển"}], "tw": "loofah", "ipa": "/ˈluː.fə/"}, {"type": "mc", "ctx": "Cooking tips", "s": "To keep the salad crisp, pour the dressing over the vegetables ___ so that the lettuce does not become soggy while guests are arriving.", "o": ["just before serving", "just after shopping", "long before cooking"], "a": "just before serving", "vi": "Để salad giòn, hãy rưới nước sốt lên rau ngay trước khi dọn để xà lách không bị nhũn trong lúc khách đến.", "why": "just before serving = ngay trước lúc dọn ra; hay gặp trong công thức nấu ăn.", "new": [{"w": "dressing", "vi": "nước sốt trộn"}, {"w": "soggy", "vi": "nhũn"}], "tw": "just before serving"}, {"type": "mc", "ctx": "Morning rush", "s": "A group of tourists stepped ___ the air-conditioned bus and immediately felt the intense heat of the desert afternoon.", "o": ["out of", "in front of", "according to"], "a": "out of", "vi": "Một nhóm du khách bước ra khỏi chiếc xe buýt máy lạnh và lập tức cảm nhận cái nóng gay gắt của buổi chiều sa mạc.", "why": "out of + nơi chốn = ra khỏi (get out of bed, step out of the car); trái nghĩa into.", "new": [{"w": "intense", "vi": "gay gắt"}], "tw": "out of", "ipa": "/ˈaʊt əv/"}, {"type": "mc", "ctx": "Exam hall", "s": "The nurse called the patients into the doctor's office ___, so the waiting room slowly emptied during the long afternoon.", "o": ["one by one", "all together", "at random"], "a": "one by one", "vi": "Y tá gọi bệnh nhân vào phòng khám lần lượt từng người nên phòng chờ dần vắng đi suốt buổi chiều dài.", "why": "one by one = từng cái/từng người một theo thứ tự, không đồng thời.", "new": [{"w": "waiting room", "vi": "phòng chờ"}], "tw": "one by one", "ipa": "/ˌwʌn baɪ ˈwʌn/"}, {"type": "mc", "ctx": "Event planning", "s": "The players were furious when their coach failed to ___ for the final practice, and nobody knew why he had switched off his phone.", "o": ["show up", "give up", "catch up"], "a": "show up", "vi": "Các cầu thủ rất tức giận khi huấn luyện viên không xuất hiện ở buổi tập cuối và không ai biết vì sao ông tắt điện thoại.", "why": "show up = xuất hiện, đến dự (thường sau khi chờ hoặc không chắc sẽ đến).", "new": [{"w": "furious", "vi": "tức giận"}, {"w": "coach", "vi": "huấn luyện viên"}], "tw": "show up", "ipa": "/ʃəʊ ʌp/"}, {"type": "mc", "ctx": "Study habits", "s": "Although the film was nearly three hours long, the audience stayed silent and focused ___ and nobody checked their phone once.", "o": ["all the way through", "all of a sudden", "all by themselves"], "a": "all the way through", "vi": "Dù phim dài gần ba giờ, khán giả vẫn im lặng và tập trung từ đầu đến cuối và rossing.", "new": [{"w": "signal", "vi": "đèn tín hiệu"}, {"w": "tightly", "vi": "chặt"}], "tw": "crosswalk", "ipa": "/ˈkrɔːs.wɔːk/"}, {"type": "mc", "ctx": "Road safety", "s": "While she was busy texting, she almost stepped in front of a bus when ___, and the loud horn made her jump.", "o": ["crossing the road", "crossing her fingers", "crossing the line"], "a": "crossing the road", "vi": "Khi đang bận nhắn tin, cô suýt bước ra trước một chiếc xe buýt lúc sang đường và tiếng còi lớn làm cô giật mình.", "why": "crossing the road = sang đường; hay đi với look both ways, be careful when...", "new": [{"w": "horn", "vi": "còi xe"}, {"w": "jump", "vi": "giật mình"}], "tw": "crossing the road"}, {"type": "mc", "ctx": "Driving lesson", "s": "Heavy snow had covered the ___ that warned about the steep hill, so several drivers were taken by surprise.", "o": ["road sign", "bus ticket", "street food"], "a": "road sign", "vi": "Tuyết dày đã phủ biển báo cảnh báo con dốc dựng đứng nên nhiều tài xế bị bất ngờ.", "why": "road sign = biển báo giao thông; read/follow/ignore a road sign.", "new": [{"w": "steep", "vi": "dốc"}], "tw": "road sign"}, {"type": "mc", "ctx": "Motorway driving", "s": "My grandfather is a cautious driver, so he stays in the ___ of the motorway and never tries to overtake anyone.", "o": ["inside lane", "outside lane", "bus lane"], "a": "inside lane", "vi": "Ông tôi là người lái xe thận trọng nên ông đi ở làn trong của đường cao tốc và không bao giờ vượt ai.", "why": "inside lane = làn trong, thường là làn chạy chậm trên đường cao tốc.", "new": [{"w": "cautious", "vi": "thận trọng"}, {"w": "overtake", "vi": "vượt"}], "tw": "inside lane"}, {"type": "mc", "ctx": "Overtaking", "s": "To overtake the slow truck, the driver checked his mirror, signaled, and pulled into the ___ before accelerating.", "o": ["outside lane", "inside lane", "parking space"], "a": "outside lane", "vi": "Để vượt chiếc xe tải chậm, tài xế kiểm tra gương, bật xi-nhan và chuyển sang làn ngoài t ctionary for a moment? I cannot find the meaning of this word, and my phone has no signal here.", "o": ["lend", "borrow", "return"], "a": "lend", "vi": "Bạn cho tôi mượn từ điển một lát được không? Tôi không tìm ra nghĩa từ này và điện thoại không có sóng ở đây.", "why": "lend somebody something = cho ai mượn cái gì; lend – lent – lent.", "new": [{"w": "signal", "vi": "sóng"}], "tw": "lend", "ipa": "/lend/"}, {"type": "mc", "ctx": "Sharing books", "s": "The photographer agreed to lend his expensive camera ___ a stranger for the afternoon, which surprised everyone at the workshop.", "o": ["to", "for", "with"], "a": "to", "vi": "Nhiếp ảnh gia đồng ý cho một người lạ mượn chiếc máy ảnh đắt tiền của mình suốt buổi chiều, điều làm mọi người ở buổi hội thảo ngạc nhiên.", "why": "lend something to somebody = cho ai mượn cái gì; sau lend + vật là to + người.", "new": [{"w": "stranger", "vi": "người lạ"}, {"w": "workshop", "vi": "buổi hội thảo"}], "tw": "lend something to somebody", "ipa": "/lend/"}, {"type": "mc", "ctx": "Classroom video", "s": "It was freezing in the apartment, so my father went to ___ the heating before everyone woke up for breakfast.", "o": ["turn up", "turn off", "turn over"], "a": "turn up", "vi": "Căn hộ lạnh buốt nên bố tôi đi vặn lò sưởi to lên trước khi mọi người thức dậy ăn sáng.", "why": "turn something up = tăng âm lượng/nhiệt độ; ngược nghĩa turn something down.", "new": [{"w": "heating", "vi": "hệ thống sưởi"}], "tw": "turn up", "ipa": "/tɜːn ˈʌp/"}, {"type": "mc", "ctx": "Noisy evening", "s": "Please ___ your music; the neighbors have complained twice this week, and the building rules say we must stay quiet after ten.", "o": ["turn down", "turn up", "turn on"], "a": "turn down", "vi": "Làm ơn vặn nhỏ nhạc xuống; hàng xóm đã phàn nàn hai lần tuần này và nội quy tòa nhà nói chúng ta phải yên lặng sau mười giờ.", "why": "turn something down = vặn nhỏ (âm lượng/nhiệt độ); lưu ý turn down còn có nghĩa từ chối.", "new": [{"w": "complain", "vi": "phàn nàn"}], "tw": "turn down", "ipa": "/tɜːn ˈdaʊn/"}, {"type": "mc", "ctx": "English tutoring", "s": "A good language partner should ___ without interrupting the conversation, so the speaker can keep talking and still learn from the mistakes.", "o": ["correct your English", "rent your English", "forget your English"], "a": "correct your English", "vi": "Một bạn học ngôn ngữ tốt nên sửa tiếng Anh cho bạn mà không ngắt cuộc trò chuyện để người nói vẫn nói tiếp và học từ lỗi.", "why": "correct somebody's English = sửa lỗi tiếng Anh của ai; đổi my/your/his tương ứng.", "new": [{"w": "interrupt", "vi": "ngắt lời"}], "tw": "correct someone's English"}, {"type": "mc", "ctx": "Pair work", "s": "For the final activity, you will ___ and interview each other about your plans for the summer holidays.", "o": ["work with a partner", "work against the clock", "work out alone"], "a": "work with a partner", "vi": "Trong hoạt động cuối, bạn sẽ làm việc theo cặp và phỏng vấn nhau về kế hoạch kỳ nghỉ hè.", "why": "work with a partner = làm bài theo cặp; thường dùng trong lớp học ngoại ngữ.", "new": [{"w": "interview", "vi": "phỏng vấn"}], "tw": "work with a partner", "ipa": "/wɜːk wɪð ə ˈpɑːtnə/"}, {"type": "mc", "ctx": "Cinema", "s": "The two sisters kept arguing on the plane until their mother told them to ___ so that each could enjoy the window seat.", "o": ["swap places", "catch up", "give way"], "a": "swap places", "vi": "Hai chị em cứ cãi nhau trên máy bay đến khi mẹ bảo họ đổi chỗ để mỗi người đều được ngồi cạnh cửa sổ.", "why": "swap places (with somebody) = đổi chỗ ngồi/vị trí cho nhau.", "new": [{"w": "argue", "vi": "cãi nhau"}], "tw": "swap places", "ipa": "/swɒp ˈpleɪsɪz/"}, {"type": "mc", "ctx": "Textbook shortage", "s": "When the printer broke, the staff had to ___ the only working machine on the second floor, which created long queues.", "o": ["share", "repair", "sell"], "a": "share", "vi": "Khi máy in hỏng, nhân viên phải dùng chung chiếc máy duy nhất còn chạy ở tầng hai, tạo ra hàng chờ dài.", "why": "share something (with somebody) = dùng chung/chia sẻ cái gì với ai.", "new": [{"w": "queue", "vi": "hàng chờ"}], "tw": "share", "ipa": "/ʃeə/"}, {"type": "mc", "ctx": "Pronunciation practice", "s": "I did not catch the address on the phone, so I politely asked the receptionist to ___ it more slowly.", "o": ["repeat", "translate", "erase"], "a": "repeat", "vi": "Tôi không nghe rõ địa chỉ trong điện thoại nên lịch sự nhờ lễ tân lặp lại chậm hơn.", "why": "repeat something (after somebody) = lặp lại điều gì sau ai.", "new": [{"w": "receptionist", "vi": "lễ tân"}], "tw": "repeat", "ipa": "/rɪˈpiːt/"}, {"type": "mc", "ctx": "Asking in class", "s": "When you meet an unfamiliar word in a text, you can ask the teacher, \"What does this word ___?\" instead of staying silent.", "o": ["mean", "spell", "borrow"], "a": "mean", "vi": "Khi gặp một từ lạ trong bài đọc, bạn có thể hỏi giáo viên: \"Từ này nghĩa là gì?\" thay vì im lặng.", "why": "What does something mean? = câu hỏi nghĩa của từ; mean là động từ, chủ ngữ số ít nên dùng does.", "new": [{"w": "unfamiliar", "vi": "lạ, chưa quen"}], "tw": "what does it mean", "ipa": "/wɒt dʌz ... miːn/"}, {"type": "mc", "ctx": "Pronunciation help", "s": "The tourist pointed at the menu and asked the waiter, \"How do you ___ this dish?\" because the name looked impossible to read.", "o": ["pronounce", "prepare", "prefer"], "a": "pronounce", "vi": "Du khách chỉ vào thực đơn và hỏi người phục vụ: \"Món này phát âm thế nào?\" vì cái tên trông không thể đọc nổi.", "why": "How do you pronounce something? = hỏi cách đọc một từ; pronounce /prəˈnaʊns/ (danh từ pronunciation đọc khác).", "new": [{"w": "dish", "vi": "món ăn"}], "tw": "how do you pronounce something", "ipa": "/prəˈnaʊns/"}, {"type": "mc", "ctx": "Registration desk", "s": "The hotel receptionist could not find my booking, so she kindly asked, \"How do you ___ your name, sir?\" and typed it slowly.", "o": ["spell", "sign", "solve"], "a": "spell", "vi": "Lễ tân khách sạn không tìm thấy đặt phòng của tôi nên lịch sự hỏi: \"Tên ông đánh vần thế nào?\" và gõ thật chậm.", "why": "How do you spell something? = hỏi cách đánh vần; trả lời bằng cách đọc từng chữ cái.", "new": [{"w": "booking", "vi": "đặt phòng"}], "tw": "how do you spell something", "ipa": "/spel/"}, {"type": "mc", "ctx": "Grammar question", "s": "After the lesson, a student raised her hand and asked, \"How do you ___ the word \"whereas\" when you compare two ideas?\"", "o": ["use the word", "learn the world", "write the work"], "a": "use the word", "vi": "Sau bài học, một học sinh giơ tay hỏi: \"Dùng từ whereas thế nào khi so sánh hai ý?\"", "why": "How do you use the word...? = hỏi cách dùng của một từ trong câu.", "new": [{"w": "compare", "vi": "so sánh"}], "tw": "how do you use the word", "ipa": "/juːz/"}, {"type": "mc", "ctx": "Study group", "s": "Our lecturer promised to ___ the difference between \"economic\" and \"economical\", because many students confuse them in their essays.", "o": ["explain", "exchange", "expand"], "a": "explain", "vi": "Giảng viên hứa sẽ giải thích sự khác nhau giữa \"economic\" và \"economical\" vì nhiều sinh viên nhầm chúng trong bài luận.", "why": "explain the difference between A and B = giải thích sự khác biệt giữa A và B.", "new": [{"w": "lecturer", "vi": "giảng viên"}, {"w": "economical", "vi": "tiết kiệm"}], "tw": "explain the difference between A and B", "ipa": "/ɪkˈspleɪn/"}, {"type": "mc", "ctx": "Education then and now", "s": "Villagers walked for hours to reach the market ___, whereas today a new road allows them to arrive within twenty minutes.", "o": ["in the past", "in the end", "in advance"], "a": "in the past", "vi": "Dân làng ngày xưa đi bộ hàng giờ mới tới chợ, còn bây giờ con đường mới cho phép họ đến trong hai mươi phút.", "why": "in the past = trước đây (đối lập với now/nowadays); thường đứng đầu câu kèm dấu phẩy.", "new": [{"w": "villager", "vi": "dân làng"}, {"w": "allow", "vi": "cho phép"}], "tw": "in the past", "ipa": "/ɪn ðə pɑːst/"}, {"type": "mc", "ctx": "Homework task", "s": "To prepare for the IELTS exam, Linh decided to ___ every weekend and ask her tutor to mark it and suggest improvements.", "o": ["write an essay", "write a check", "write a menu"], "a": "write an essay", "vi": "Để chuẩn bị cho kỳ thi IELTS, Linh quyết định viết một bài luận mỗi cuối tuần và nhờ gia sư chấm và gợi ý cải thiện.", "why": "write an essay = viết bài luận; thường đi với about/on + chủ đề.", "new": [{"w": "tutor", "vi": "gia sư"}, {"w": "mark", "vi": "chấm điểm"}], "tw": "write an essay", "ipa": "/raɪt ən ˈeseɪ/"}, {"type": "mc", "ctx": "School customs", "s": "My cousin is thirty and has two children, but my grandparents still ___ \"young man\" whenever he visits them.", "o": ["call him", "ask him", "meet him"], "a": "call him", "vi": "Anh họ tôi đã ba mươi tuổi và có hai con, nhưng ông bà vẫn gọi anh là \"cậu bé\" mỗi khi anh đến thăm.", "why": "call somebody something = gọi ai là gì (call him Mr Smith, call me by my name).", "new": [{"w": "visit", "vi": "đến thăm"}], "tw": "call someone something"}, {"type": "mc", "ctx": "Changing habits", "s": "Few people write letters ___, because email and messaging apps are faster, cheaper, and easier to use from anywhere.", "o": ["nowadays", "yesterday", "formerly"], "a": "nowadays", "vi": "Ngày nay ít người viết thư vì email và ứng dụng nhắn tin nhanh hơn, rẻ hơn và dễ dùng ở bất cứ đâu.", "why": "nowadays = ngày nay, hiện nay; dùng với thì hiện tại, đối lập in the past.", "new": [{"w": "messaging app", "vi": "ứng dụng nhắn tin"}], "tw": "nowadays", "ipa": "/ˈnaʊədeɪz/"}, {"type": "mc", "ctx": "Describing places", "s": "The ___ in the classroom was tense because everyone was waiting for the exam results, and nobody dared to joke.", "o": ["atmosphere", "furniture", "temperature"], "a": "atmosphere", "vi": "Bầu không khí trong lớp căng thẳng vì ai cũng chờ kết quả thi và không ai dám đùa.", "why": "atmosphere = bầu không khí/cảm giác của một nơi; a friendly/tense/relaxed atmosphere.", "new": [{"w": "dare", "vi": "dám"}], "tw": "atmosphere", "ipa": "/ˈætməsfɪə(r)/"}, {"type": "mc", "ctx": "Workplace culture", "s": "After a week of exams, the students spent a ___ weekend at the beach, reading magazines and swimming without any schedule.", "o": ["relaxed", "crowded", "stressful"], "a": "relaxed", "vi": "Sau một tuần thi, các sinh viên có một cuối tuần thư giãn ở biển, đọc tạp chí và bơi mà không có lịch trình gì.", "why": "relaxed = thoải mái, không căng thẳng; a relaxed atmosphere/style.", "new": [{"w": "schedule", "vi": "lịch trình"}], "tw": "relaxed", "ipa": "/rɪˈlækst/"}, {"type": "mc", "ctx": "University life", "s": "In my previous company, we could ___ casually on Fridays, but for client meetings we still had to wear formal suits.", "o": ["dress", "cook", "argue"], "a": "dress", "vi": "Ở công ty cũ, chúng tôi được ăn mặc thoải mái vào thứ Sáu nhưng khi gặp khách vẫn phải mặc vest trang trọng.", "why": "dress (verb) = ăn mặc; dress the way you want = ăn mặc theo ý mình.", "new": [{"w": "casually", "vi": "thoải mái"}, {"w": "formal", "vi": "trang trọng"}], "tw": "dress", "ipa": "/dres/"}, {"type": "mc", "ctx": "Making a deal", "s": "The company allows employees to work from home ___ they finish their tasks on time and remain available for urgent calls.", "o": ["as long as", "even though", "as soon as"], "a": "as long as", "vi": "Công ty cho phép nhân viên làm việc tại nhà miễn là họ hoàn thành nhiệm vụ đúng hạn và sẵn sàng nghe cuộc gọi khẩn.", "why": "as long as = miễn là, với điều kiện; theo sau là mệnh đề (thì hiện tại cho tương lai).", "new": [{"w": "urgent", "vi": "khẩn cấp"}, {"w": "available", "vi": "sẵn sàng"}], "tw": "as long as", "ipa": "/æz ˈlɒŋ æz/"}, {"type": "mc", "ctx": "Job interview", "s": "The invitation said the dress code was ___, so the guests arrived in suits and elegant dresses rather than jeans and trainers.", "o": ["smart", "noisy", "spare"], "a": "smart", "vi": "Thiệp mời ghi quy định trang phục là lịch sự, nên khách đến với vest và đầm thanh lịch thay vì quần jean và giày thể thao.", "why": "smart (Anh-Anh) = ăn mặc chỉnh tề, lịch sự; còn có nghĩa thông minh, nên dựa vào ngữ cảnh.", "new": [{"w": "dress code", "vi": "quy định trang phục"}, {"w": "trainers", "vi": "giày thể thao"}], "tw": "smart", "ipa": "/smɑːt/"}, {"type": "mc", "ctx": "School rules", "s": "Although the headmaster was ___, the students respected him, because his rules were fair and he always listened to their explanations.", "o": ["strict", "careless", "forgetful"], "a": "strict", "vi": "Dù hiệu trưởng nghiêm khắc, học sinh vẫn tôn trọng ông vì quy tắc của ông công bằng và ông luôn nghe lời giải thích của các em.", "why": "strict = nghiêm khắc (với người/quy định); a strict teacher/rule.", "new": [{"w": "fair", "vi": "công bằng"}], "tw": "strict", "ipa": "/strɪkt/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ hoặc cụm được hỏi ở cuối.", "qs": [{"type": "mc", "ctx": "Short reading", "s": "Our new manager is surprisingly sensible. When the team panicked about the deadline, she calmly listed the priorities and chose the most realistic option. What does “sensible” mean?", "o": ["biết suy nghĩ, chín chắn", "hay lo lắng quá mức", "rất hài hước"], "a": "biết suy nghĩ, chín chắn", "noblank": true, "say": "Our new manager is surprisingly sensible. When the team panicked about the deadline, she calmly listed the priorities and chose the most realistic option.", "vi": "Quản lý mới của chúng tôi chín chắn đến bất ngờ. Khi cả nhóm hoảng vì hạn chót, cô ấy bình tĩnh liệt kê các ưu tiên và chọn phương án thực tế nhất.", "why": "sensible = hợp lý, biết suy xét; hay gặp trong a sensible decision/choice.", "new": [{"w": "priorities", "vi": "việc ưu tiên"}, {"w": "realistic", "vi": "thực tế"}], "tw": "sensible", "ipa": "/ˈsen.sə.bəl/"}, {"type": "mc", "ctx": "Short reading", "s": "During the quiz show, Hoa gave a silly answer that had nothing to do with the question. The audience laughed, and even the host could not stay serious. What does “silly” mean?", "o": ["ngớ ngẩn, buồn cười", "nghiêm túc, đáng tin", "thông minh, sắc sảo"], "a": "ngớ ngẩn, buồn cười", "noblank": true, "say": "During the quiz show, Hoa gave a silly answer that had nothing to do with the question. The audience laughed, and even the host could not stay serious.", "vi": "Trong chương trình đố vui, Hoa trả lời một câu ngớ ngẩn chẳng liên quan gì đến câu hỏi. Khán giả bật cười và ngay cả người dẫn chương trình cũng không giữ được nghiêm túc.", "why": "silly = stupid = dumb: ngớ ngẩn; silly thường nhẹ nhàng, hài hước hơn stupid.", "new": [{"w": "audience", "vi": "khán giả"}, {"w": "host", "vi": "người dẫn chương trình"}], "tw": "silly", "ipa": "/ˈsɪl.i/"}, {"type": "mc", "ctx": "Short reading", "s": "My father rarely loses his temper. Once, when my brother lied about the broken window, he raised his voice at him, and the whole house went silent. What does “raise your voice at someone” mean?", "o": ["lớn tiếng / quát mắng ai đó", "thì thầm với ai đó", "cười nhạo ai đó"], "a": "lớn tiếng / quát mắng ai đó", "noblank": true, "say": "My father rarely loses his temper. Once, when my brother lied about the broken window, he raised his voice at him, and the whole house went silent.", "vi": "Bố tôi hiếm khi nổi nóng. Có lần khi anh trai tôi nói dối về cửa sổ vỡ, bố đã lớn tiếng với anh và cả nhà im phăng phắc.", "why": "raise your voice at someone = quát, lớn tiếng với ai; đổi your theo chủ ngữ (raised her voice at).", "new": [{"w": "lose his temper", "vi": "nổi nóng"}, {"w": "silent", "vi": "im lặng"}], "tw": "raise your voice at someone"}, {"type": "mc", "ctx": "Short reading", "s": "The company posted a clear job description online: the new employee will answer emails, organize meetings, and prepare monthly reports for the director. What does “job description” mean?", "o": ["bản mô tả công việc", "đơn xin nghỉ việc", "hợp đồ ại nói.", "why": "call somebody something = gọi ai là gì (call him Mr Smith, call me by my name).", "new": [{"w": "title", "vi": "danh xưng"}, {"w": "junior", "vi": "nhân viên cấp thấp"}], "tw": "call someone something"}, {"type": "mc", "ctx": "Short reading", "s": "Grandparents often say that children played outside for hours when they were young. Nowadays, however, many kids prefer video games to football in the street. What does “nowadays” mean?", "o": ["ngày nay", "ngày xưa", "hồi nhỏ"], "a": "ngày nay", "noblank": true, "say": "Grandparents often say that children played outside for hours when they were young. Nowadays, however, many kids prefer video games to football in the street.", "vi": "Ông bà thường nói trẻ em chơi ngoài trời hàng giờ khi họ còn nhỏ. Tuy nhiên ngày nay nhiều trẻ thích trò chơi điện tử hơn đá bóng ngoài đường.", "why": "nowadays = ngày nay, hiện nay; dùng với thì hiện tại, đối lập in the past.", "new": [{"w": "prefer", "vi": "thích hơn"}], "tw": "nowadays", "ipa": "/ˈnaʊədeɪz/"}, {"type": "mc", "ctx": "Short reading", "s": "I chose this café for its atmosphere. The walls are covered with old photographs, the staff are cheerful, and nobody hurries you to leave. What does “atmosphere” mean?", "o": ["bầu không khí", "giá cả", "vị trí"], "a": "bầu không khí", "noblank": true, "say": "I chose this café for its atmosphere. The walls are covered with old photographs, the staff are cheerful, and nobody hurries you to leave.", "vi": "Tôi chọn quán cà phê này vì bầu không khí của nó. Tường treo đầy ảnh cũ, nhân viên vui vẻ và không ai thúc giục bạn rời đi.", "why": "atmosphere = bầu không khí/cảm giác của một nơi; a friendly/tense/relaxed atmosphere.", "new": [{"w": "cheerful", "vi": "vui vẻ"}], "tw": "atmosphere", "ipa": "/ˈætməsfɪə(r)/"}, {"type": "mc", "ctx": "Short reading", "s": "The new teacher has a relaxed style. She jokes with the class, lets students choose their seats, and never gets angry about small mistakes. What does “relaxed” mean?", "o": ["thoải mái, thư giãn", "nghiêm khắc, khó tính", "lo lắng, bồn chồn"], "a": "thoải mái, thư giãn", "noblank": true, "say": "The new teacher has a relaxed style. She jokes with the class, lets students choose their seats, and never gets angry about small mistakes.", "vi": "Cô giáo mới có phong cách thoải mái. Cô đùa với lớp, cho học sinh tự chọn chỗ và không bao giờ nổi giận vì lỗi nhỏ.", "why": "relaxed = thoải mái, không căng thẳng; a relaxed atmosphere/style.", "new": [{"w": "style", "vi": "phong cách"}], "tw": "relaxed", "ipa": "/rɪˈlækst/"}, {"type": "mc", "ctx": "Short reading", "s": "Some parents worry that teenagers dress in unusual ways to attract attention. Psychologists, however, say it is part of finding their own identity. What does “dress” mean?", "o": ["ăn mặc", "nói chuyện", "chọn nghề"], "a": "ăn mặc", "noblank": true, "say": "Some parents worry that teenagers dress in unusual ways to attract attention. Psychologists, however, say it is part of finding their own identity.", "vi": "Một số bậc cha mẹ lo rằng thanh thiếu niên ăn mặc khác thường để thu hút sự chú ý. Tuy nhiên các nhà tâm lý nói đó là một phần của việc tìm bản sắc riêng.", "why": "dress (verb) = ăn mặc; dress the way you want = ăn mặc theo ý mình.", "new": [{"w": "attract", "vi": "thu hút"}, {"w": "identity", "vi": "bản sắc"}], "tw": "dress", "ipa": "/dres/"}, {"type": "mc", "ctx": "Short reading", "s": "My parents let me travel alone as long as I send a message every evening. They also expect me to avoid dark streets and keep my phone charged. What does “as long as” mean?", "o": ["miễn là, với điều kiện", "mặc dù, bất chấp", "ngay khi"], "a": "miễn là, với điều kiện", "noblank": true, "say": "My parents let me travel alone as long as I send a message every evening. They also expect me to avoid dark streets and keep my phone charged.", "vi": "Bố mẹ cho tôi đi du lịch một mình miễn là mỗi tối tôi nhắn tin. Họ cũng mong tôi tránh đường tối và giữ điện thoại có pin.", "why": "as long as = miễn là, với điều kiện; theo sau là mệnh đề (thì hiện tại cho tương lai).", "new": [{"w": "expect", "vi": "mong đợi"}], "tw": "as long as", "ipa": "/æz ˈlɒŋ æz/"}, {"type": "mc", "ctx": "Short reading", "s": "The restaurant has a smart dress policy: men must wear a jacket, and sportswear is not allowed. Anyone dressed too casually is politely asked to leave. What does “smart” mean?", "o": ["ăn mặc chỉnh tề, lịch sự", "ăn mặc luộm thuộm", "ăn mặc rất lòe loẹt"], "a": "ăn mặc chỉnh tề, lịch sự", "noblank": true, "say": "The restaurant has a smart dress policy: men must wear a jacket, and sportswear is not allowed. Anyone dressed too casually is politely asked to leave.", "vi": "Nhà hàng có quy định ăn mặc lịch sự: nam phải mặc áo khoác và không được mặc đồ thể thao. Ai ăn mặc quá xuề xòa sẽ được mời ra lịch sự.", "why": "smart (Anh-Anh) = ăn mặc chỉnh tề, lịch sự; còn có nghĩa thông minh, nên dựa vào ngữ cảnh.", "new": [{"w": "policy", "vi": "quy định"}, {"w": "sportswear", "vi": "đồ thể thao"}], "tw": "smart", "ipa": "/smɑːt/"}, {"type": "mc", "ctx": "Short reading", "s": "My grandmother was strict about table manners. We had to sit up straight, use a knife and fork correctly, and never talk with our mouths full. What does “strict” mean?", "o": ["nghiêm khắc", "dễ dãi", "keo kiệt"], "a": "nghiêm khắc", "noblank": true, "say": "My grandmother was strict about table manners. We had to sit up straight, use a knife and fork correctly, and never talk with our mouths full.", "vi": "Bà tôi rất nghiêm khắc về phép lịch sự trên bàn ăn. Chúng tôi phải ngồi thẳng, dùng dao nĩa đúng cách và không nói khi đang đầy miệng.", "why": "strict = nghiêm khắc (với người/quy định); a strict teacher/rule.", "new": [{"w": "table manners", "vi": "phép tắc bàn ăn"}], "tw": "strict", "ipa": "/strɪkt/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Workplace conflict", "s": "Describe a time when a disagreement at work or school became tense. What happened, how did you handle it, and what did you learn from the experience?", "vi": "Hãy kể về một lần bất đồng ở chỗ làm hoặc trường học trở nên căng thẳng. Chuyện gì đã xảy ra, bạn xử lý thế nào và học được gì?", "words": ["sensible", "silly", "raise your voice at someone", "job description", "in the heat of the moment", "tense meeting", "absolute last time", "one-on-one", "in front of people", "address someone about something", "have a conversation like adults", "apologize for your behavior", "mature enough to do something", "as long as it doesn't happen again"], "why": "Kể theo thứ tự: bối cảnh, điều xảy ra, cách bạn phản ứng, kết quả, bài học. Dùng các từ gợi ý để mô tả cảm xúc và cách giải quyết.", "sample": "Last year I had a tense meeting with my manager. He raised his voice at me in front of people, which was never part of my job description. I felt hurt, but I stayed sensible and did not answer in the heat of the moment. The next day I asked for a one-on-one and decided to address him about the problem. I suggested we have a conversation like adults. He apologized for his behavior, and I said it was the absolute last time I would accept it. I was mature enough to forgive him, as long as it doesn't happen again. Afterwards the whole argument felt a little silly."}, {"type": "sp", "ctx": "Food and cooking", "s": "Talk about vegetables that you like or dislike. How do you usually cook them, and are there any unusual vegetables in your country that foreigners may not know?", "vi": "Hãy nói về các loại rau bạn thích hoặc không thích. Bạn thường nấu chúng thế nào và nước bạn có loại rau lạ nào mà người nước ngoài có thể chưa biết?", "words": ["eggplant", "aubergine", "radish", "daikon", "bean sprouts", "kohlrabi", "loofah", "just before serving"], "why": "Chia thành: rau bạn thích, cách nấu, rau lạ ở nước bạn. Có thể so sánh cách gọi Anh-Mỹ (eggplant, aubergine).", "sample": "I enjoy cooking vegetables, especially eggplant. In American English it is called eggplant, but my British teacher says aubergine, which confused me at first. I usually grill it with oil and garlic. My mother makes a soup with kohlrabi and loofah, which many foreigners have never tried, although it is cheap and light. For salads, I prefer radish because it is crunchy, while daikon is better for pickles. I add bean sprouts to noodles just before serving, so they stay fresh. I think home cooking is healthier than eating out, because I control exactly what goes into every dish."}, {"type": "sp", "ctx": "Daily commute", "s": "How do you usually travel to work or school? Describe a typical journey, and explain what you do to avoid problems during busy periods.", "vi": "Bạn thường đi làm hoặc đi học bằng gì? Hãy mô tả một chuyến đi điển hình và giải thích bạn làm gì để tránh rắc rối lúc đông người.", "words": ["rush hour", "get stuck in traffic jams", "get to work", "show up", "a wide variety of"], "why": "Nêu phương tiện, thời gian, vấn đề (kẹt xe), cách giải quyết và so sánh các lựa chọn.", "sample": "I usually travel by motorbike, but during rush hour the roads are packed, and drivers often get stuck in traffic jams for forty minutes. To avoid that, I leave home at six thirty, so I get to work before the crowds. Last month, I met a friend at a café near the office, but he did not show up because of the rain. Nowadays there is a wide variety of ways to commute, such as buses, the metro, and shared bikes. If the metro were closer to my house, I would definitely use it, because it is faster and more reliable."}, {"type": "sp", "ctx": "Moving house", "s": "Have you ever moved to a new home, or helped someone else move? Describe how the move was organized and what difficulties you faced.", "vi": "Bạn đã bao giờ chuyển nhà hay giúp ai chuyển nhà chưa? Hãy mô tả cách chuẩn bị và những khó khăn bạn gặp.", "words": ["out of", "one by one", "load something into something", "the whole process", "all the way through"], "why": "Kể trình tự: đóng gói, chất đồ lên xe, vận chuyển, dọn dẹp. Dùng từ chỉ trình tự và mô tả cảm xúc.", "sample": "Two years ago my family moved to a bigger apartment, and the whole process took an entire weekend. First, we took everything out of the cupboards and packed the books one by one. Then we had to load boxes into a small truck, which was exhausting because the stairs were narrow. My father read the moving contract all the way through, because he did not want any hidden costs. Although I was tired, I felt excited when we finally opened the new door. If I move again, I will hire professionals so that the job is less stressful."}, {"type": "sp", "ctx": "Roads and safety", "s": "Is the traffic in your city safe for pedestrians and drivers? Describe the roads you use and talk about any dangers or improvements you would like to see.", "vi": "Giao thông ở thành phố bạn có an toàn cho người đi bộ và tài xế không? Hãy mô tả những con đường bạn đi và nói về nguy hiểm hoặc cải thiện bạn muốn thấy.", "words": ["a bend", "bend", "pedestrian crossing", "crosswalk", "crossing the road", "road sign", "inside lane", "outside lane"], "why": "Nêu tình hình chung, ví dụ cụ thể (khúc cua, vạch qua đường), rồi đề xuất cải thiện. Có thể so sánh cách nói Anh-Anh và Anh-Mỹ.", "sample": "In my city, crossing the road can be dangerous, especially near the school, where there is no clear pedestrian crossing. In American English people say crosswalk, and I think we need more of them. On the main road, there is a sharp bend, and the road bends to the left just after the bridge. Drivers often ignore the road sign that tells them to slow down. On the highway, slow vehicles should stay in the inside lane, but some drivers stay in the outside lane and block faster cars. I believe stricter rules and better lighting would make the roads much safer."}, {"type": "sp", "ctx": "Stationery and electronics", "s": "Describe the things you keep on your desk when you study or work. Which items do you use most, and what do you do when something stops working?", "vi": "Hãy mô tả những thứ bạn để trên bàn khi học hoặc làm việc. Bạn dùng gì nhiều nhất và làm gì khi thứ gì đó hỏng?", "words": ["rubber", "ruler", "highlighter pen", "plug", "socket", "rub out", "measure", "highlight", "plug in"], "why": "Liệt kê đồ dùng, nói công dụng, rồi kể một sự cố nhỏ (ổ cắm, phích cắm) và cách bạn xử lý.", "sample": "On my desk, I always keep a ruler, a rubber, and a yellow highlighter pen. I use the ruler to measure the margins in my notebook, and I highlight the key ideas before exams. If I make a mistake in pencil, I rub out the line carefully. Last week the plug of my laptop charger broke, so I had to buy a new one. Unfortunately, there is only one socket near my desk, and I must plug in my lamp, too. That is why I want to buy an extension lead. Having a tidy desk helps me concentrate and finish my tasks faster."}, {"type": "sp", "ctx": "Borrowing and lending", "s": "Do you often borrow things from friends or lend them your things? Talk about a time when lending or borrowing caused a problem or a pleasant surprise.", "vi": "Bạn có hay mượn đồ của bạn bè hoặc cho họ mượn không? Hãy kể một lần việc cho mượn hoặc mượn gây rắc rối hoặc mang lại bất ngờ vui.", "words": ["borrow", "lend", "lend something to somebody", "turn up", "turn down", "share"], "why": "Nêu thói quen, kể một ví dụ cụ thể, nêu quy tắc của bạn. Chú ý phân biệt borrow (mượn) và lend (cho mượn).", "sample": "I usually borrow books from the library, but I rarely lend my own things, because people often forget to return them. Once I decided to lend my laptop to a classmate, and he returned it with a broken screen. Since then, I only lend something to somebody I trust completely. On the other hand, last month my neighbor lent me her ladder, and we also decided to share a taxi to the airport. When the music at her party was too loud, she turned it down immediately. If someone says the sound is too quiet, I turn it up gladly. Sharing is good, but being careful matters too."}, {"type": "sp", "ctx": "Learning in a group", "s": "Do you prefer studying alone or with other people? Describe a class or workshop in which you worked with someone else and explain what you gained from it.", "vi": "Bạn thích học một mình hay học cùng người khác? Hãy mô tả một lớp hoặc buổi hội thảo mà bạn làm việc cùng ai đó và nói bạn nhận được gì.", "words": ["correct someone's English", "work with a partner", "swap places", "repeat", "partner"], "why": "So sánh học một mình và học nhóm, kể một ví dụ, nêu lợi ích (sửa lỗi, tự tin, động lực).", "sample": "I used to study alone, but now I prefer to work with a partner. In my English class, my partner and I speak for ten minutes, then we swap places and ask new questions. She corrects my English gently, and I do the same for her. If I do not understand a word, I ask her to repeat it slowly. At first I felt nervous, but she is patient, so I became more confident. Working together also keeps me motivated, because I do not want to disappoint her. Overall, studying with a partner is more enjoyable than sitting silently with a textbook."}, {"type": "sp", "ctx": "Asking about language", "s": "What do you do when you do not understand a word or cannot say something correctly in English? Explain the questions you usually ask and who you ask.", "vi": "Bạn làm gì khi không hiểu một từ hoặc không biết nói đúng bằng tiếng Anh? Hãy giải thích các câu hỏi bạn thường hỏi và hỏi ai.", "words": ["what does it mean", "how do you pronounce something", "how do you spell something", "how do you use the word", "explain the difference between A and B"], "why": "Liệt kê các cách hỏi, nói rõ bạn hỏi ai (giáo viên, bạn, từ điển) và vì sao cách đó hiệu quả.", "sample": "When I meet a new word, I first try to guess it from the context. If I still cannot understand it, I ask my teacher, 'What does it mean?' Sometimes I also ask how to pronounce the word, because English stress can be confusing. When I write emails, I check how to spell difficult names. I often ask how to use the word in a real sentence, since examples help me remember it. If two words look similar, I ask my teacher to explain the difference between them. This habit makes my vocabulary stronger, and I am no longer afraid of asking questions."}, {"type": "sp", "ctx": "School then and now", "s": "Compare schools in the past with schools today. What has changed in classrooms, in teachers' attitudes, and in the way students dress and study?", "vi": "So sánh trường học ngày xưa với ngày nay. Điều gì đã thay đổi trong lớp học, thái độ của giáo viên và cách học sinh ăn mặc, học tập?", "words": ["in the past", "write an essay", "call someone something", "nowadays", "atmosphere", "relaxed", "dress", "as long as", "smart", "strict"], "why": "Dùng cấu trúc so sánh: In the past... whereas nowadays... Nêu ba điểm khác biệt và ý kiến của bạn.", "sample": "In the past, teachers were very strict, and we had to call them sir or miss. We also had to write an essay by hand every week. Nowadays the atmosphere is more relaxed, and students can dress the way they want, as long as they look smart on special days. Pupils use tablets instead of paper, whereas my generation used heavy textbooks. I think this change is mostly positive, because children feel less afraid of making mistakes. However, discipline is still important, so I would keep a few clear rules to protect everyone's learning time."}]}]};
  const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  /* ---------- prepare ---------- */
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ALL=[];
  SECTIONS.forEach(sec=>sec.qs.forEach((q,i)=>{q.id=sec.id+'q'+(i+1);q.sec=sec.id;q.n=i+1;if(q.type==='mc')q.opts=shuffle(q.o);ALL.push(q);}));
  const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));
  const STATQ=ALL.filter(q=>q.type!=='sp');

  const KEY=DATA.meta.storageKey||'drill-v1';
  let state={};
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
  const isRight=(q,v)=>q.type==='mc'?v===q.a:q.acc.some(x=>norm(x)===norm(v));

  const hintsOpen=new Set();
  let current=SECTIONS[0].id;
  const $=id=>document.getElementById(id);

  /* ---------- listening (browser speech synthesis) ---------- */
  const CAN_SPEAK=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
  let voice=null;
  /* Fallback voice: prefer natural / neural US English voices when the audio files cannot be played. */
  function pickVoice(){
    if(!CAN_SPEAK)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/aria|jenny|ava|andrew|guy|samantha|google us/i.test(v.name)?2:0)+(v.localService?0:1);
    voice=vs.sort((a,b)=>score(b)-score(a))[0]||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang))||null;
  }
  if(CAN_SPEAK){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
  let audio=null;
  let cur=null; /* what is playing now: {id, kind:'audio'|'tts', paused} */
  function updateControls(){
    document.querySelectorAll('[data-pause]').forEach(b=>{
      const active=!!cur&&cur.id===b.dataset.pause;
      b.disabled=!active;
      const paused=active&&cur.paused;
      b.querySelector('span').textContent=paused?'Tiếp tục':'Tạm dừng';
      b.querySelector('.i-pause').hidden=paused;
      b.querySelector('.i-play').hidden=!paused;
      b.classList.toggle('on',paused);
    });
  }
  function stopAudio(){
    if(audio){audio.onended=audio.onerror=audio.onplaying=null;audio.pause();audio=null;}
    if(CAN_SPEAK)speechSynthesis.cancel();
    cur=null;
    document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
    updateControls();
  }
  function togglePause(id){
    if(!cur||cur.id!==id)return;
    if(cur.kind==='audio'&&audio){
      if(audio.paused){audio.play();cur.paused=false;}else{audio.pause();cur.paused=true;}
    }else if(cur.kind==='tts'&&CAN_SPEAK){
      if(speechSynthesis.paused){speechSynthesis.resume();cur.paused=false;}else{speechSynthesis.pause();cur.paused=true;}
    }
    updateControls();
  }
  function speakFallback(id,done,slow,btn){
    if(!CAN_SPEAK){cur=null;updateControls();return;}
    const q=byId[id];
    const text=q.type==='sp'?q.s:(q.listen?q.s.replace('___',q.a||'')+'':q.s.includes('___')?q.s.replace('___',done?q.a:'blank'):(done?q.s+' '+q.a:q.s)).replace(/\b(\d{1,2})\.(\d{2})\b/g,'$1:$2');
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang;}
    u.rate=slow?0.65:0.95;
    cur={id,kind:'tts',paused:false};
    u.onstart=()=>{btn&&btn.classList.add('on');updateControls();};
    u.onend=u.onerror=()=>{btn&&btn.classList.remove('on');if(cur&&cur.kind==='tts'&&cur.id===id)cur=null;updateControls();};
    speechSynthesis.speak(u);
    updateControls();
  }
  function speak(id,slow,btn){
    stopAudio();
    const done=!!state[id];
    const suffix=(slow?'s':'')+(done?(slow?'':'f'):'b');
    const a=new Audio('audio/'+id+'_'+suffix+'.mp3'+(DATA.meta.audioVersion?'?v='+DATA.meta.audioVersion:''));
    audio=a;
    cur={id,kind:'audio',paused:false};
    let failed=false;

         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
