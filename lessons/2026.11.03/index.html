 "ctx": "Post office", "s": "I asked a shopkeeper the way to the post office, and he explained it so clearly that I found it without any trouble. I thanked him with a smile. What does \"ask the way\" mean?", "o": ["hỏi giá", "hỏi đường", "hỏi giờ"], "a": "hỏi đường", "vi": "Tôi hỏi một chủ tiệm đường tới bưu điện và ông giải thích rõ đến mức tôi tìm thấy mà không gặp rắc rối. Tôi cảm ơn ông bằng một nụ cười.", "why": "ask somebody the way (to somewhere) = hỏi đường ai đó tới nơi nào.", "noblank": true, "say": "I asked a shopkeeper the way to the post office, and he explained it so clearly that I found it without any trouble. I thanked him with a smile.", "new": [{"w": "shopkeeper", "vi": "chủ tiệm"}, {"w": "trouble", "vi": "rắc rối"}], "tw": "ask the way", "ipa": "/ɑːsk ðə weɪ/"}, {"type": "mc", "ctx": "Conference day", "s": "The receptionist directed us to the conference room on the third floor and pointed out where we could leave our coats. The session began on time. What does \"direct\" mean?", "o": ["từ chối", "đón tiếp", "chỉ đường cho"], "a": "chỉ đường cho", "vi": "Nhân viên lễ tân chỉ chúng tôi tới phòng hội nghị ở tầng ba và chỉ nơi có thể để áo khoác. Buổi họp bắt đầu đúng giờ.", "why": "direct somebody to somewhere = chỉ đường cho ai tới đâu.", "noblank": true, "say": "The receptionist directed us to the conference room on the third floor and pointed out where we could leave our coats. The session began on time.", "new": [{"w": "conference room", "vi": "phòng hội nghị"}, {"w": "session", "vi": "buổi họp"}], "tw": "direct", "ipa": "/dəˈrekt/"}, {"type": "mc", "ctx": "Beach trip", "s": "We followed signs for the beach, but the road suddenly became a dirt track. Eventually, an old fisherman told us that the signs were out of date. What does \"follow signs for\" mean?", "o": ["đi theo biển chỉ dẫn tới", "chụp ảnh biển chỉ dẫn", "phớt lờ biển chỉ dẫn"], "a": "đi theo biển chỉ dẫn tới", "vi": "Chúng tôi đi theo biển chỉ dẫn ra bãi biển nhưng con đường đột nhiên thành lối đất. Cuối cùng một ngư dân già bảo chúng tôi rằng các biển báo đã lỗi thời.", "why": "follow signs for + nơi chốn = đi theo biển chỉ dẫn tới nơi đó.", "noblank": true, "say": "We followed signs for the beach, but the road suddenly became a dirt track. Eventually, an old fisherman told us that the signs were out of date.", "new": [{"w": "dirt track", "vi": "đường đất"}, {"w": "out of date", "vi": "lỗi thời"}], "tw": "follow signs for", "ipa": "/ˈfɒləʊ saɪnz fə/"}, {"type": "mc", "ctx": "Street witness", "s": "The witness said that she saw an accident at the junction, in which a motorbike hit a taxi. She gave the police a detailed description of the driver. What does \"see an accident\" mean?", "o": ["gây ra tai nạn", "chứng kiến tai nạn", "tránh được tai nạn"], "a": "chứng kiến tai nạn", "vi": "Nhân chứng nói cô đã chứng kiến vụ tai nạn ở ngã tư, nơi một xe máy đâm vào taxi. Cô cung cấp cho cảnh sát mô tả chi tiết về tài xế.", "why": "see an accident = chứng kiến một vụ tai nạn (khác have an accident = bị tai nạn).", "noblank": true, "say": "The witness said that she saw an accident at the junction, in which a motorbike hit a taxi. She gave the police a detailed description of the driver.", "new": [{"w": "witness", "vi": "nhân chứng"}, {"w": "junction", "vi": "ngã tư"}], "tw": "see an accident", "ipa": "/siː ən ˈæksɪdənt/"}, {"type": "mc", "ctx": "Winter driving", "s": "Although he had driven for twenty years without a problem, he had an accident last winter when his car slid on ice. Fortunately, nobody was seriously hurt. What does \"have an accident\" mean?", "o": ["tránh tai nạn", "chứng kiến tai nạn", "bị tai nạn"], "a": "bị tai nạn", "vi": "Mặc dù đã lái xe hai mươi năm không sự cố, ông gặp tai nạn mùa đông năm ngoái khi xe trượt trên băng. May là không ai bị thương nặng.", "why": "have an accident = bị/gặp tai nạn.", "noblank": true, "say": "Although he had driven for twenty years without a problem, he had an accident last winter when his car slid on ice. Fortunately, nobody was seriously hurt.", "new": [{"w": "slid", "vi": "trượt"}, {"w": "seriously", "vi": "nghiêm trọng"}], "tw": "have an accident", "ipa": "/hæv ən ˈæksɪdənt/"}, {"type": "mc", "ctx": "Road priority", "s": "Cars must slow down when they join the main road from a side street. Otherwise, they could hit vehicles that have priority and are travelling much faster. What does \"the main road\" mean?", "o": ["đường chính", "đường nhỏ trong hẻm", "bãi đỗ xe"], "a": "đường chính", "vi": "Xe phải giảm tốc khi nhập vào đường chính từ phố nhỏ. Nếu không, chúng có thể đâm vào các xe có quyền ưu tiên đang chạy nhanh hơn nhiều.", "why": "the main road = đường chính, đường lớn (đối lập với side road).", "noblank": true, "say": "Cars must slow down when they join the main road from a side street. Otherwise, they could hit vehicles that have priority and are travelling much faster.", "new": [{"w": "join", "vi": "nhập vào"}, {"w": "priority", "vi": "quyền ưu tiên"}], "tw": "the main road", "ipa": "/ðə meɪn rəʊd/"}, {"type": "mc", "ctx": "Near miss", "s": "The little girl stepped off the pavement without looking, so her mother grabbed her hand just in time. A van sounded its horn as it sped past. What does \"step off\" mean?", "o": ["bước lên", "bước xuống khỏi", "bước vòng quanh"], "a": "bước xuống khỏi", "vi": "Cô bé bước xuống khỏi vỉa hè mà không nhìn nên mẹ em kịp nắm lấy tay em. Một chiếc xe van bóp còi khi phóng qua.", "why": "step off + something = bước xuống khỏi (vỉa hè, bậc thang…).", "noblank": true, "say": "The little girl stepped off the pavement without looking, so her mother grabbed her hand just in time. A van sounded its horn as it sped past.", "new": [{"w": "grabbed", "vi": "nắm lấy"}, {"w": "horn", "vi": "còi xe"}, {"w": "sped", "vi": "phóng nhanh"}], "tw": "step off", "ipa": "/step ɒf/"}, {"type": "mc", "ctx": "Coastal storm", "s": "When the storm approached the coast, local authorities warned residents to stay indoors. Most shops closed early and the ferries stopped running. What does \"approach\" mean?", "o": ["rời xa", "lướt qua", "tiến lại gần"], "a": "tiến lại gần", "vi": "Khi cơn bão tiến lại gần bờ biển, chính quyền địa phương cảnh báo cư dân ở trong nhà. Hầu hết cửa hàng đóng sớm và phà ngừng chạy.", "why": "approach + something/somebody = tiến lại gần (động từ, cũng là danh từ 'cách tiếp cận').", "noblank": true, "say": "When the storm approached the coast, local authorities warned residents to stay indoors. Most shops closed early and the ferries stopped running.", "new": [{"w": "authorities", "vi": "chính quyền"}, {"w": "indoors", "vi": "trong nhà"}], "tw": "approach", "ipa": "/əˈprəʊtʃ/"}, {"type": "mc", "ctx": "Sudden stop", "s": "She braked hard to avoid a cyclist, and the car behind her almost hit hers. Both drivers stayed calm and exchanged insurance details. What does \"brake\" mean?", "o": ["phanh gấp", "tăng tốc", "bấm còi"], "a": "phanh gấp", "vi": "Cô phanh gấp để tránh một người đi xe đạp và chiếc xe phía sau suýt đâm vào xe cô. Cả hai tài xế giữ bình tĩnh và trao đổi thông tin bảo hiểm.", "why": "brake (hard) = phanh, thắng gấp (động từ; cũng là danh từ 'cái phanh').", "noblank": true, "say": "She braked hard to avoid a cyclist, and the car behind her almost hit hers. Both drivers stayed calm and exchanged insurance details.", "new": [{"w": "calm", "vi": "bình tĩnh"}, {"w": "exchanged", "vi": "trao đổi"}], "tw": "brake", "ipa": "/breɪk/"}, {"type": "mc", "ctx": "Bike safety", "s": "The motorbike swerved sharply to avoid an old man crossing the road, and it slid across the wet surface. Luckily, the rider only suffered a few scratches. What does \"swerve\" mean?", "o": ["chạy chậm lại", "đánh lái đột ngột", "dừng hẳn"], "a": "đánh lái đột ngột", "vi": "Chiếc xe máy đánh lái gấp để tránh một cụ ông qua đường và trượt trên mặt đường ướt. May mắn là người lái chỉ bị vài vết xước.", "why": "swerve (to avoid something) = đánh lái đột ngột để tránh cái gì.", "noblank": true, "say": "The motorbike swerved sharply to avoid an old man crossing the road, and it slid across the wet surface. Luckily, the rider only suffered a few scratches.", "new": [{"w": "slid", "vi": "trượt"}, {"w": "scratches", "vi": "vết xước"}], "tw": "swerve", "ipa": "/swɜːv/"}, {"type": "mc", "ctx": "Shop accident", "s": "A delivery van lost control and crashed into a shop window, but fortunately the shop was empty at that hour. The owner asked the company to pay for the repairs. What does \"crash into\" mean?", "o": ["đi ngang qua", "đậu cạnh", "đâm vào"], "a": "đâm vào", "vi": "Một xe giao hàng mất lái và đâm vào cửa kính cửa hàng, nhưng may là lúc đó cửa hàng không có ai. Chủ cửa hàng yêu cầu công ty trả tiền sửa chữa.", "why": "crash into + something = đâm vào cái gì.", "noblank": true, "say": "A delivery van lost control and crashed into a shop window, but fortunately the shop was empty at that hour. The owner asked the company to pay for the repairs.", "new": [{"w": "lost control", "vi": "mất kiểm soát"}, {"w": "repairs", "vi": "việc sửa chữa"}], "tw": "crash into", "ipa": "/kræʃ ˈɪntuː/"}, {"type": "mc", "ctx": "Wet road", "s": "The lorry slipped on the wet road and hit a parked car. Neither driver was hurt, but the damage to the bumper was obvious. What does \"a parked car\" mean?", "o": ["xe đang đỗ", "xe đang chạy nhanh", "xe đang sửa"], "a": "xe đang đỗ", "vi": "Chiếc xe tải trượt trên đường ướt và đâm vào một chiếc xe đang đỗ. Không tài xế nào bị thương, nhưng hư hại ở cản xe rất rõ.", "why": "a parked car = chiếc xe đang đỗ (parked là tính từ).", "noblank": true, "say": "The lorry slipped on the wet road and hit a parked car. Neither driver was hurt, but the damage to the bumper was obvious.", "new": [{"w": "slipped", "vi": "trượt"}, {"w": "bumper", "vi": "cản xe"}, {"w": "obvious", "vi": "rõ ràng"}], "tw": "a parked car", "ipa": "/ə pɑːkt kɑː/"}, {"type": "mc", "ctx": "University flat", "s": "My cousin's flat is on the opposite side of the road from the university, which is convenient. He only needs to cross at the traffic lights. What does \"on the opposite side of the road\" mean?", "o": ["ở ngay cạnh đường", "ở phía bên kia đường", "ở cuối con hẻm"], "a": "ở phía bên kia đường", "vi": "Căn hộ của anh họ tôi nằm phía bên kia đường đối diện trường đại học, rất tiện. Anh chỉ cần qua ở đèn giao thông.", "why": "on the opposite side of the road = ở phía bên kia đường.", "noblank": true, "say": "My cousin's flat is on the opposite side of the road from the university, which is convenient. He only needs to cross at the traffic lights.", "new": [{"w": "convenient", "vi": "tiện lợi"}, {"w": "traffic lights", "vi": "đèn giao thông"}], "tw": "on the opposite side of the road", "ipa": "/ɒn ðə ˈɒpəzɪt saɪd əv ðə rəʊd/"}, {"type": "mc", "ctx": "Park accident", "s": "The falling branch injured two tourists who were taking photographs under the tree. Both were taken to hospital, though the doctors said they would recover soon. What does \"injure\" mean?", "o": ["cứu giúp", "hỏi thăm", "làm bị thương"], "a": "làm bị thương", "vi": "Cành cây rơi làm hai du khách đang chụp ảnh dưới gốc cây bị thương. Cả hai được đưa vào bệnh viện dù bác sĩ nói họ sẽ sớm hồi phục.", "why": "injure + somebody = làm ai bị thương.", "noblank": true, "say": "The falling branch injured two tourists who were taking photographs under the tree. Both were taken to hospital, though the doctors said they would recover soon.", "new": [{"w": "branch", "vi": "cành cây"}, {"w": "recover", "vi": "hồi phục"}], "tw": "injure", "ipa": "/ˈɪndʒə/"}, {"type": "mc", "ctx": "Road crash", "s": "Nobody was seriously injured in the crash, but the driver was kept in hospital overnight. The police said that the road would remain closed until morning. What does \"be injured\" mean?", "o": ["bị thương", "bị phạt", "bị mất tích"], "a": "bị thương", "vi": "Không ai bị thương nặng trong vụ va chạm nhưng tài xế được giữ lại bệnh viện qua đêm. Cảnh sát nói đường sẽ đóng đến sáng.", "why": "be injured = bị thương (bị động của injure).", "noblank": true, "say": "Nobody was seriously injured in the crash, but the driver was kept in hospital overnight. The police said that the road would remain closed until morning.", "new": [{"w": "overnight", "vi": "qua đêm"}, {"w": "remain", "vi": "vẫn còn"}], "tw": "be injured", "ipa": "/ˈɪndʒə/"}, {"type": "mc", "ctx": "Playground safety", "s": "Most accidents at the playground result in a minor injury, for instance a bruise or a small cut. Serious cases are rare, because the ground is covered with soft material. What does \"a minor injury\" mean?", "o": ["bệnh nặng", "thương tích nhẹ", "án phạt nhẹ"], "a": "thương tích nhẹ", "vi": "Hầu hết tai nạn ở sân chơi chỉ gây thương tích nhẹ, ví dụ vết bầm hoặc vết cắt nhỏ. Trường hợp nghiêm trọng hiếm gặp vì mặt đất phủ vật liệu mềm.", "why": "a minor injury = thương tích nhẹ (minor = nhỏ, không nghiêm trọng).", "noblank": true, "say": "Most accidents at the playground result in a minor injury, for instance a bruise or a small cut. Serious cases are rare, because the ground is covered with soft material.", "new": [{"w": "bruise", "vi": "vết bầm"}, {"w": "rare", "vi": "hiếm"}, {"w": "material", "vi": "vật liệu"}], "tw": "a minor injury", "ipa": "/ə ˈmaɪnə ˈɪndʒəri/"}, {"type": "mc", "ctx": "Fishing port", "s": "The strong wind damaged several fishing boats in the harbour, which means many families will lose their income for weeks. Volunteers have started to collect donations. What does \"damage\" mean?", "o": ["làm sạch", "làm nổi", "làm hư hại"], "a": "làm hư hại", "vi": "Gió mạnh làm hư hại nhiều thuyền đánh cá trong bến cảng, nghĩa là nhiều gia đình sẽ mất thu nhập trong nhiều tuần. Các tình nguyện viên đã bắt đầu quyên góp.", "why": "damage + something = làm hư hại cái gì (động từ).", "noblank": true, "say": "The strong wind damaged several fishing boats in the harbour, which means many families will lose their income for weeks. Volunteers have started to collect donations.", "new": [{"w": "harbour", "vi": "bến cảng"}, {"w": "income", "vi": "thu nhập"}, {"w": "donations", "vi": "khoản quyên góp"}], "tw": "damage", "ipa": "/ˈdæmɪdʒ/"}, {"type": "mc", "ctx": "Flood damage", "s": "The ancient bridge was badly damaged by the flood, and engineers say that restoring it will take at least a year. Meanwhile, travellers must use a longer route. What does \"be badly damaged\" mean?", "o": ["bị hư hại nặng", "được sơn mới", "được mở rộng"], "a": "bị hư hại nặng", "vi": "Cây cầu cổ bị hư hại nặng do lũ và các kỹ sư nói việc phục hồi sẽ mất ít nhất một năm. Trong khi đó du khách phải đi tuyến dài hơn.", "why": "be badly damaged = bị hư hại nặng (bị động của damage).", "noblank": true, "say": "The ancient bridge was badly damaged by the flood, and engineers say that restoring it will take at least a year. Meanwhile, travellers must use a longer route.", "new": [{"w": "flood", "vi": "lũ lụt"}, {"w": "restoring", "vi": "khôi phục"}, {"w": "route", "vi": "tuyến đường"}], "tw": "be badly damaged", "ipa": "/ˈdæmɪdʒ/"}, {"type": "mc", "ctx": "Home insurance", "s": "Insurance covers damage to the building, but it does not include the cost of replacing personal belongings. Customers should read the contract carefully before signing. What does \"damage to\" mean?", "o": ["hóa đơn gửi tới", "thiệt hại đối với", "lối vào"], "a": "thiệt hại đối với", "vi": "Bảo hiểm chi trả thiệt hại đối với tòa nhà nhưng không bao gồm chi phí thay đồ dùng cá nhân. Khách hàng nên đọc kỹ hợp đồng trước khi ký.", "why": "damage to + something = thiệt hại đối với cái gì (danh từ không đếm được).", "noblank": true, "say": "Insurance covers damage to the building, but it does not include the cost of replacing personal belongings. Customers should read the contract carefully before signing.", "new": [{"w": "covers", "vi": "chi trả, bao gồm"}, {"w": "belongings", "vi": "đồ đạc cá nhân"}], "tw": "damage to", "ipa": "/ˈdæmɪdʒ tuː/"}, {"type": "mc", "ctx": "Library repair", "s": "The council is repairing the pavement outside the library because many elderly visitors have tripped on the broken stones. The work should finish before the winter. What does \"pavement\" mean?", "o": ["mái nhà", "đường băng", "vỉa hè"], "a": "vỉa hè", "vi": "Hội đồng đang sửa vỉa hè trước thư viện vì nhiều người cao tuổi đã vấp phải đá vỡ. Công việc sẽ xong trước mùa đông.", "why": "pavement (BrE) = vỉa hè; tiếng Anh Mỹ là sidewalk.", "noblank": true, "say": "The council is repairing the pavement outside the library because many elderly visitors have tripped on the broken stones. The work should finish before the winter.", "new": [{"w": "tripped", "vi": "vấp ngã"}, {"w": "elderly", "vi": "cao tuổi"}], "tw": "pavement", "ipa": "/ˈpeɪvmənt/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Dress code at work", "s": "Do you think people should dress formally at work or school? Explain how you usually dress, and what you wear on important occasions.", "vi": "Bạn có nghĩ mọi người nên ăn mặc trang trọng ở nơi làm việc hay trường học không? Hãy giải thích bạn thường ăn mặc thế nào và mặc gì vào dịp quan trọng.", "words": ["smart", "well-dressed", "smartly dressed", "top"], "why": "Nêu quan điểm, rồi so sánh đời thường và dịp quan trọng (phỏng vấn, đám cưới). Kết bằng lý do vì sao ăn mặc chỉnh tề tạo ấn tượng tốt.", "sample": "I think people should look smart at work, especially when they meet customers. In my office, most colleagues are smartly dressed, and I feel that a well-dressed team makes a better impression. On ordinary days I wear a plain top with trousers, which is comfortable but still tidy. For important occasions, such as a job interview, I choose a jacket and polished shoes. Although some young people say that formal clothes are old-fashioned, I believe that making an effort shows respect for others. As a result, I usually feel more confident when I dress properly."}, {"type": "sp", "ctx": "Deliveries", "s": "Describe how goods or parcels are delivered to people in your area. What problems can happen when nobody is at home?", "vi": "Hãy mô tả hàng hóa hay bưu kiện được giao thế nào ở khu bạn. Có vấn đề gì xảy ra khi không có ai ở nhà?", "words": ["lorry", "van", "front door", "a parked car"], "why": "Mô tả quy trình (kho → xe → nhà), nêu một vấn đề cụ thể (để ngoài cửa, xe đỗ chắn đường) và cách giải quyết.", "sample": "In my city, big lorries bring goods to warehouses, and then smaller vans deliver parcels to people's homes. It is convenient, but problems can happen when nobody is at home. Drivers often leave boxes outside the front door, which means that a neighbour might take them by mistake. Sometimes the van stops next to a parked car and blocks the street, so other drivers get angry. To solve this, I ask the company to deliver to a pick-up point near my office, where I can collect my parcels after work."}, {"type": "sp", "ctx": "Travel costs", "s": "Do you prefer to travel by plane or by other means? Talk about the cost of tickets and why prices change.", "vi": "Bạn thích đi máy bay hay các phương tiện khác? Hãy nói về chi phí vé và vì sao giá thay đổi.", "words": ["fare", "bus fare", "airfare", "fly", "pilot"], "why": "Đưa ra lựa chọn, so sánh giá và thời gian, giải thích nguyên nhân giá đổi (mùa du lịch, đặt sớm), có thể nhắc phi công/chuyến bay.", "sample": "Honestly, I prefer to fly when the journey is longer than six hours, because it saves time even though the airfare can be high. If I book months in advance, I can often find a cheaper fare, but prices rise during holidays. For short trips inside my city, I pay a bus fare, which is much cheaper than a taxi. I once talked to a pilot on a flight who said that fuel prices strongly influence ticket costs. Because of this, I always compare several websites before I decide."}, {"type": "sp", "ctx": "Public transport", "s": "Tell me about your usual journey to work or school. How do you travel, and has anything gone wrong recently?", "vi": "Hãy kể về hành trình thường ngày đến nơi làm việc hoặc trường học. Bạn đi thế nào và gần đây có gì trục trặc không?", "words": ["catch the bus", "catch the train", "get on", "get off", "get into", "get out of", "go by", "miss the train"], "why": "Kể theo trình tự: đi bằng gì, lên/xuống ở đâu, một lần trục trặc (lỡ xe), cảm xúc và bài học. Dùng thì hiện tại đơn rồi quá khứ.", "sample": "I usually go by bus to my office, so I catch the bus at seven and get off near the central market. On rainy days, I sometimes get into a taxi, and when I arrive I get out of it right in front of the building. Last month, I missed the train to a conference because I got on the wrong platform. I had to wait an hour, which was frustrating. Since then, I leave earlier and check the timetable the night before, so I can catch the train comfortably."}, {"type": "sp", "ctx": "Road safety", "s": "What are the main causes of road accidents in your country? What rules help to reduce them?", "vi": "Nguyên nhân chính của tai nạn giao thông ở nước bạn là gì? Những quy định nào giúp giảm chúng?", "words": ["speed limit", "motorway", "overtake", "no overtaking", "side road", "apart from"], "why": "Nêu 2-3 nguyên nhân (tốc độ, vượt ẩu), rồi quy định (giới hạn tốc độ, biển cấm vượt) và hiệu quả. Dùng although/as a result.", "sample": "In my country, the main cause of accidents is speeding, particularly on the motorway. Many drivers ignore the speed limit and try to overtake dangerously, even where there is a no overtaking sign. Apart from fast driving, tired drivers and bad weather also cause problems. Some accidents happen at a side road, because motorbikes appear suddenly. Rules such as heavy fines and speed cameras help to reduce the number of crashes, although I think better education would be the most effective solution in the long term."}, {"type": "sp", "ctx": "Finding the way", "s": "Describe a time when you got lost. What happened, and how did you find the right way in the end?", "vi": "Hãy kể một lần bạn bị lạc. Chuyện gì xảy ra và cuối cùng bạn tìm đúng đường thế nào?", "words": ["get lost", "on my way to", "go via", "turning", "take the wrong turning", "end up", "ask the way", "direct", "follow signs for", "the main road"], "why": "Kể theo thứ tự: bạn đi đâu, rẽ nhầm ở đâu, cảm giác, ai chỉ đường, kết quả. Dùng thì quá khứ và nhiều từ nối.", "sample": "Last summer, I was on my way to a friend's village, and I decided to go via a small road to avoid the main road. At the second turning, I took the wrong turning, and soon I got lost. I ended up in a field with no signal on my phone. Fortunately, a farmer was working nearby, so I asked him the way. He directed me back to the road and told me to follow signs for the town. In the end, I arrived two hours late, but I learned to check the map before leaving."}, {"type": "sp", "ctx": "Witnessing an accident", "s": "Have you ever seen a road accident? Describe what you saw and how the people involved reacted.", "vi": "Bạn đã bao giờ chứng kiến một vụ tai nạn giao thông chưa? Hãy mô tả điều bạn thấy và phản ứng của những người liên quan.", "words": ["see an accident", "have an accident", "the main road", "step off", "approach", "brake", "swerve", "crash into"], "why": "Mô tả bối cảnh, diễn biến theo thứ tự (xe tiến lại, phanh, đánh lái, đâm), phản ứng của mọi người. Kết bằng điều bạn rút ra.", "sample": "A few years ago, I saw an accident on the main road near my house. A boy on a bicycle stepped off the pavement without looking, while a car was approaching quickly. The driver braked hard and swerved to the right, but he still crashed into a fence. Luckily, the boy did not have an accident himself, although he was shocked. Other people ran to help, and someone called an ambulance at once. This experience taught me to watch the road carefully, whether I am driving or walking."}, {"type": "sp", "ctx": "After an accident", "s": "If someone is hurt in a traffic accident, what should people nearby do? Talk about helping the injured and staying safe.", "vi": "Nếu ai đó bị thương trong tai nạn giao thông, những người xung quanh nên làm gì? Hãy nói về việc giúp người bị thương và giữ an toàn.", "words": ["be injured", "pavement", "on the opposite side of the road", "a parked car"], "why": "Nêu các bước: gọi cấp cứu, giữ an toàn hiện trường, không di chuyển người bị thương nặng. Dùng should/must và because.", "sample": "First of all, people should call an ambulance immediately. If someone is injured, it is better not to move them, unless there is danger. I would ask other drivers to stop on the opposite side of the road, so that the traffic does not become more dangerous. Pedestrians should stay on the pavement, away from the damaged vehicles, and a parked car can also be used to block the lane. Finally, it is important to stay calm and give clear information to the emergency services."}, {"type": "sp", "ctx": "Storm damage", "s": "Describe a storm or bad weather event that you remember. What damage did it cause in your area, and how did people recover?", "vi": "Hãy mô tả một cơn bão hay thời tiết xấu mà bạn nhớ. Nó gây thiệt hại gì ở khu bạn và mọi người phục hồi thế nào?", "words": ["damage", "be badly damaged", "damage to"], "why": "Kể thời điểm, mức độ thiệt hại (mái nhà, cây cối), việc dọn dẹp và hỗ trợ. Dùng thì quá khứ và bị động.", "sample": "Two years ago, a powerful storm hit my hometown. Strong winds damaged many houses, and the roof of our school was badly damaged. There was also serious damage to the electricity network, so we had no power for three days. Neighbours helped each other to remove fallen trees, and local volunteers brought food to families in need. The government later paid for repairs, although it took several months to finish. Since then, people have been more careful about checking their roofs before the rainy season."}, {"type": "sp", "ctx": "Health and safety", "s": "Talk about a health problem that you think is dangerous but can often be prevented. Why do people ignore it, and what could help?", "vi": "Hãy nói về một vấn đề sức khỏe nguy hiểm nhưng thường phòng tránh được. Vì sao mọi người bỏ qua và điều gì có thể giúp?", "words": ["hepatitis", "injure", "a minor injury", "be injured"], "why": "Chọn một bệnh (viêm gan), nêu nguyên nhân bị bỏ qua (triệu chứng nhẹ) và giải pháp (tiêm chủng, kiểm tra). Có thể so sánh với chấn thương nhẹ.", "sample": "I think hepatitis is a good example, because it can seriously damage the liver, yet many people ignore it. At first, the symptoms are often mild, like a minor injury that you do not worry about, so patients wait too long. Unlike someone who is injured in an accident, an infected person may look healthy for months. Careless habits can also injure the liver over time. Vaccination and regular blood tests could prevent most cases, so I believe schools and companies should organise free health checks every year."}]}]};

    const cats=GR.filter(g=>g[1].test(low)).map(g=>g[0]);
    const errs=[];
    ERR.forEach(e=>{const m=low.match(e[0]);if(m)m.forEach(x=>errs.push({s:x,w:e[1]}));});
    let g=3.5+Math.min(2.4,cats.length*.4)+(n>=45?.5:0)+(n>=80?.5:0)-Math.min(2,errs.length*.5);
    if(n<20)g=Math.min(g,4.5);
    /* Pronunciation (recognition confidence) */
    const cs=segs.filter(s=>typeof s.c==='number'&&s.c>0);
    let p=null,pm=null;
    if(cs.length){
      let wsum=0,tot=0;cs.forEach(s=>{const k=Math.max(1,toks(s.t).length);wsum+=s.c*k;tot+=k;});
      pm=wsum/tot;
      p=pm>=.95?7.5:pm>=.9?7:pm>=.85?6.5:pm>=.8?6:pm>=.7?5.5:pm>=.6?5:pm>=.5?4.5:4;
      if(n<20)p=Math.min(p,5);
    }
    const lowSegs=cs.filter(s=>s.c<.75&&toks(s.t).length>=2).map(s=>s.t);
    const bands={f:half(f),l:half(l),g:half(g),p:p===null?null:half(p)};
    const av=[bands.f,bands.l,bands.g,bands.p].filter(x=>x!==null);
    const overall=half(av.reduce((a,b)=>a+b,0)/av.length);
    return {text,n,dur:Math.round(dur),wpm,used,missing:(q.words||[]).filter(w=>!used.includes(w)),conn,fill,rep,ttr:Math.round(ttr*100),adv,cats,errs:errs.slice(0,4),pm:pm===null?null:Math.round(pm*100),lowSegs:lowSegs.slice(0,3),bands,overall};
  }
  function adviceF(r){
    const a=[r.dur?`Bạn nói khoảng ${r.n} từ trong ${r.dur}s${r.wpm?` (≈ ${r.wpm} từ/phút)`:''}.`:`Bài gõ có khoảng ${r.n} từ (không đo được tốc độ nói).`];
    a.push(r.conn.length?`Từ nối đã dùng: ${r.conn.slice(0,5).join(', ')}.`:'Chưa thấy từ nối rõ ràng; thử dùng because, however, for example, as a result để ý tưởng liền mạch.');
    if(r.fill+r.rep>1)a.push(`Có ${r.fill} từ đệm và ${r.rep} lần lặp từ; hãy ngừng lặng ngắn thay vì “um/uh”.`);
    if(r.n<45)a.push('Câu trả lời còn ngắn; hướng tới 60–90 từ (30–45 giây) với 1 ý chính + 1 ví dụ.');
    return a.join(' ');
  }
  function adviceL(r){
    const a=[`Dùng ${r.used.length}/${r.used.length+r.missing.length} từ gợi ý${r.used.length?': '+r.used.join(', '):''}.`];
    if(r.missing.length)a.push(`Chưa dùng: ${r.missing.slice(0,5).join(', ')}.`);
    a.push(`Độ đa dạng từ ${r.ttr}%, từ dài/học thuật ${r.adv}.`);
    return a.join(' ');
  }
  function adviceG(r){
    const a=[r.cats.length?`Cấu trúc đa dạng: ${r.cats.join(', ')}.`:'Gần như chỉ dùng câu đơn; thử thêm mệnh đề quan hệ (which/who), câu điều kiện hoặc although/whereas.'];
    if(r.errs.length)a.push('Cần xem lại: '+r.errs.map(e=>`“${e.s}” (${e.w})`).join('; ')+'.');
    else a.push('Không phát hiện lỗi ngữ pháp phổ biến bằng quy tắc tự động.');
    return a.join(' ');
  }
  function adviceP(r){
    if(r.pm===null&&!r.dur)return 'Bài gõ nên chưa chấm được phát âm; hãy ghi âm để được chấm.';
    if(r.pm===null)return 'Trình duyệt này không có nhận dạng giọng nói nên chưa chấm được phát âm. Hãy mở bằng Chrome/Edge/Safari.';
    const a=[`Máy nhận ra lời bạn với độ chắc chắn ≈ ${r.pm}%.`];
    if(r.lowSegs.length)a.push('Đoạn nghe chưa rõ: “'+r.lowSegs.join('”, “')+'” — nghe lại phát âm mẫu và đọc chậm, rõ trọng âm.');
    else a.push('Phát âm được nhận ra rõ.');
    return a.join(' ');
  }
  function spCard(q){
    const st=state[q.id];
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const used=st&&st.r?st.r.used:[];
    const chips=(q.words||[]).map(w=>`<span class="chip${used.includes(w)?' used':''}">${esc(w)}<button type="button" class="say" data-word="${esc(w)}" aria-label="Phát âm ${esc(w)}" style="padding:0 4px;border:0;background:none">${icon}</button></span>`).join('');
    const busy=R&&R.id===q.id;
    let res='';
    if(st&&st.r){
      const r=st.r,b=r.bands;
      const bandBox=(name,v,adv)=>`<div class="band"><b>${name}</b><span class="n">${v===null?'—':fmt(v)}</span><p>${esc(adv)}</p></div>`;
      res=`<div class="spres" role="status">${urls[q.id]?`<audio controls src="${urls[q.id]}"></audio>`:''}<p class="tr">“${esc(r.text)}”</p>`+
        `<p class="overall">Điểm ước tính (thang IELTS 1–8)<span class="n">${fmt(r.overall)}</span></p><div class="bands">`+
        bandBox('Độ trôi chảy và mạch lạc (Fluency &amp; Coherence)',b.f,adviceF(r))+
        bandBox('Vốn từ vựng (Lexical Resource)',b.l,adviceL(r))+
        bandBox('Độ đa dạng và chính xác ngữ pháp (Grammatical Range &amp; Accuracy)',b.g,adviceG(r))+
        bandBox('Phát âm (Pronunciation)',b.p,adviceP(r))+`</div>`+
        `<p class="disc">Điểm do trình duyệt ước tính từ văn bản nhận dạng được (tốc độ, từ nối, từ vựng, cấu trúc, độ rõ giọng), chỉ để tham khảo, không thay thế giám khảo/giáo viên. Bản ghi âm chỉ nằm trên máy bạn, không được gửi đi.</p>`+
        `<button type="button" class="ghost retry" data-retry="${q.id}">Ghi âm lại</button></div>`;
    }
    const sample=q.sample?`<details class="sample"><summary>Xem bài nói mẫu (B2)</summary><p>${esc(q.sample)}</p></details>`:'';
    return `<article class="q sp" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div>`+
      `<p class="sent">${esc(q.s)}</p><p class="vi">${esc(q.vi)}</p>`+
      `<div class="spwords"><b>Từ nên dùng:</b> ${chips}</div>`+
      `<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu hỏi ${q.n}">${icon}Nghe câu hỏi</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button></div>`+
      `<div class="rec"><button type="button" class="recbtn" data-rec="${q.id}" ${busy?'disabled':''}>● Ghi âm</button><button type="button" class="recbtn stop" data-recstop="${q.id}" ${busy?'':'disabled'}>■ Dừng &amp; chấm điểm</button><span class="rectime" id="rt-${q.id}">${busy?'':'Nói 30–60 giây, cố dùng ≥ 3 từ gợi ý'}</span><span class="recmsg" id="rm-${q.id}"></span></div>`+
      `<details class="manual"><summary>Không ghi âm được? Gõ lại lời bạn nói để chấm</summary><textarea id="mt-${q.id}" placeholder="Gõ nội dung bạn đã nói…"></textarea><button type="button" class="ghost" data-manual="${q.id}">Chấm bài gõ (không chấm phát âm)</button></details>`+
      res+sample+`</article>`;
  }
  function recMsg(id,m){const e=$('rm-'+id);if(e)e.textContent=m||'';}
  async function startRec(id){
    if(R)return;
    stopAudio();
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
    catch(e){recMsg(id,'Không truy cập được micro. Hãy cho phép micro cho trang này hoặc dùng ô gõ bên dưới.');return;}
    const chunks=[];let mr=null;
    try{mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};mr.start();}catch(e){mr=null;}
    const segs=[];let rec=null;
    R={id,stream,mr,chunks,segs,t0:Date.now(),active:true,rec:null,timer:null};
    if(SRC){
      rec=new SRC();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=ev=>{
        let interim='';
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const r=ev.results[i];
          if(r.isFinal)segs.push({t:r[0].transcript.trim(),c:r[0].confidence});else interim+=r[0].transcript;
        }
        recMsg(id,interim?'… '+interim:'');
      };
      rec.onerror=()=>{};
      rec.onend=()=>{if(R&&R.active&&R.rec===rec){try{rec.start();}catch(e){}}};
      R.rec=rec;try{rec.start();}catch(e){}
    }else recMsg(id,'Trình duyệt không hỗ trợ nhận dạng giọng nói: bài sẽ được ghi âm nhưng cần gõ lại lời nói để chấm.');
    const tick=()=>{const e=$('rt-'+id);if(e&&R)e.textContent='● '+Math.round((Date.now()-R.t0)/1000)+' giây';};
    R.timer=setInterval(tick,500);tick();
    const b1=document.querySelector(`[data-rec="${id}"]`),b2=document.querySelector(`[data-recstop="${id}"]`);
    if(b1)b1.disabled=true;if(b2)b2.disabled=false;
  }
  function stopRec(id){
    if(!R||R.id!==id)return;
    const cur=R;cur.active=false;clearInterval(cur.timer);
    const dur=(Date.now()-cur.t0)/1000;
    recMsg(id,'Đang chấm điểm…');
    try{cur.rec&&cur.rec.stop();}catch(e){}
    const finish=()=>{
      cur.stream.getTracks().forEach(t=>t.stop());
      if(cur.chunks.length){urls[id]&&URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(new Blob(cur.chunks,{type:(cur.mr&&cur.mr.mimeType)||'audio/webm'}));}
      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
