    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .tag{font-weight:700;margin-right:8px}
.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}
.manual summary{cursor:pointer;color:var(--muted)}
.manual textarea{width:100%;min-height:90px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.band .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--primary)}
.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

oken tooth"], "a": "hepatitis", "tw": "hepatitis", "vi": "Dù ban đầu chỉ thấy hơi mệt, các xét nghiệm cho thấy cô ấy bị viêm gan nên phải tránh rượu và nghỉ ngơi vài tuần.", "why": "hepatitis = viêm gan (bệnh của gan, danh từ không đếm được).", "new": [{"w": "mild", "vi": "nhẹ"}, {"w": "sprained ankle", "vi": "bong gân cổ chân"}], "ipa": "/ˌhep.əˈtaɪ.t̬əs/"}, {"type": "mc", "ctx": "Job interview", "s": "You don't have to wear a suit for the interview, but you should look ___ enough to show the company that you take the job seriously.", "o": ["noisy", "hungry", "smart"], "a": "smart", "tw": "smart", "vi": "Bạn không cần mặc vest đi phỏng vấn, nhưng nên ăn mặc đủ chỉnh tề để cho công ty thấy bạn nghiêm túc với công việc.", "why": "smart (về quần áo) = lịch sự, chỉnh tề, phù hợp nơi trang trọng (BrE).", "new": [{"w": "interview", "vi": "buổi phỏng vấn"}, {"w": "take seriously", "vi": "coi trọng"}], "ipa": "/smɑːrt/"}, {"type": "mc", "ctx": "Opera night", "s": "Whereas the tourists wore shorts and sandals, the opera audience looked very ___, with long dresses, bow ties and expensive jewellery.", "o": ["well-dressed", "well-known", "well-paid"], "a": "well-dressed", "tw": "well-dressed", "vi": "Trong khi du khách mặc quần short và dép, khán giả nhà hát opera trông rất chỉnh tề, với váy dài, nơ cổ và trang sức đắt tiền.", "why": "well-dressed = ăn mặc đẹp, chỉnh tề (tính từ ghép, có gạch nối).", "new": [{"w": "opera", "vi": "nhà hát opera"}, {"w": "jewellery", "vi": "trang sức"}], "ipa": "/ˌwelˈdrest/"}, {"type": "mc", "ctx": "Hotel service", "s": "The waiters at the hotel were all ___ in black trousers and white shirts, so the guests felt that the service was first-class.", "o": ["badly injured", "smartly dressed", "fully booked"], "a": "smartly dressed", "tw": "smartly dressed", "vi": "Các bồi bàn ở khách sạn đều ăn mặc chỉnh tề với quần đen và áo sơ mi trắng, nên khách cảm thấy dịch vụ thuộc hạng nhất.", "why": "smartly dressed = ăn mặc chỉnh tề (trạng từ smartly + dressed).", "new": [{"w": "waiters", "vi": "bồi bàn"}, {"w": "first-class", "vi": "hạng nhất"}], "ipa": "/ˌsmɑːrt.li ˈdrest/"}, {"type": "mc", "ctx": "Fashion advice", "s": "If you wear a bright ___ with plain trousers, you will look fashionable without spending a fortune on a whole new outfit.", "o": ["passport", "ticket", "top"], "a": "top", "tw": "top", "vi": "Nếu bạn mặc một chiếc áo sáng màu với quần trơn, trông bạn sẽ thời trang mà không phải tốn cả gia tài cho cả bộ đồ mới.", "why": "top (quần áo) = áo mặc phần trên cơ thể, như áo thun, áo kiểu.", "new": [{"w": "plain", "vi": "trơn, giản dị"}, {"w": "outfit", "vi": "bộ trang phục"}], "ipa": "/tɑːp/"}, {"type": "mc", "ctx": "Team schedule", "s": "The whole team has agreed to the new schedule, ___ one colleague who says that starting at seven o'clock is much too early.", "o": ["apart from", "because of", "instead of"], "a": "apart from", "tw": "apart from", "vi": "Cả nhóm đã đồng ý với lịch mới, ngoại trừ một đồng nghiệp nói bắt đầu lúc bảy giờ là quá sớm.", "why": "apart from + N/V-ing = ngoài ra, ngoại trừ (=besides).", "new": [{"w": "colleague", "vi": "đồng nghiệp"}, {"w": "schedule", "vi": "lịch trình"}], "ipa": "/əˈpɑːt frəm/"}, {"type": "mc", "ctx": "Farm business", "s": "Farmers use a large ___ to transport fresh vegetables to the wholesale market before sunrise, which means the produce stays fresh and crisp.", "o": ["wheelchair", "lorry", "helicopter"], "a": "lorry", "tw": "lorry", "vi": "Nông dân dùng một chiếc xe tải lớn để chở rau tươi tới chợ đầu mối trước bình minh, nghĩa là sản phẩm vẫn tươi giòn.", "why": "lorry (Anh) / truck (Mỹ) = xe tải lớn chở hàng.", "new": [{"w": "wholesale market", "vi": "chợ đầu mối"}, {"w": "produce", "vi": "nông sản"}], "ipa": "/ˈlɒr.i/ /trʌk/"}, {"type": "mc", "ctx": "Band tour", "s": "If the whole band wants to travel together with the speakers and drums, we will need to hire a ___ instead of taking two small cars.", "o": ["pilot", "fare", "van"], "a": "van", "tw": "van", "vi": "Nếu cả ban nhạc muốn đi cùng nhau với loa và trống, chúng ta sẽ cần thuê một chiếc xe van thay vì đi hai xe nhỏ.", "why": "van = xe tải nhỏ có thùng kín, dùng giao hàng hoặc chở người.", "new": [{"w": "band", "vi": "ban nhạc"}, {"w": "hire", "vi": "thuê"}], "ipa": "/væn/"}, {"type": "mc", "ctx": "Pilot career", "s": "Becoming a ___ requires years of training and regular medical checks, which explains why airlines pay such high salaries to experienced staff.", "o": ["pilot", "tourist", "chef"], "a": "pilot", "tw": "pilot", "vi": "Trở thành phi công đòi hỏi nhiều năm đào tạo và kiểm tra sức khỏe định kỳ, điều giải thích vì sao các hãng hàng không trả lương rất cao cho nhân sự có kinh nghiệm.", "why": "pilot = phi công, người lái máy bay.", "new": [{"w": "training", "vi": "đào tạo"}, {"w": "airlines", "vi": "hãng hàng không"}], "ipa": "/ˈpaɪ.lət/"}, {"type": "mc", "ctx": "Student discount", "s": "Children under five travel for free, whereas older students pay a reduced ___ if they show their cards to the driver.", "o": ["route", "fare", "delay"], "a": "fare", "tw": "fare", "vi": "Trẻ dưới năm tuổi đi miễn phí, trong khi học sinh lớn hơn trả giá vé giảm nếu xuất trình thẻ cho tài xế.", "why": "fare = tiền vé cho một chuyến đi (xe buýt, tàu, taxi, máy bay).", "new": [{"w": "reduced", "vi": "được giảm"}, {"w": "show", "vi": "xuất trình"}], "ipa": "/feər/"}, {"type": "mc", "ctx": "Bus protest", "s": "When the ___ doubled overnight, hundreds of people signed a petition asking the company to explain its decision and reverse the increase.", "o": ["airfare", "speed limit", "bus fare"], "a": "bus fare", "tw": "bus fare", "vi": "Khi giá vé xe buýt tăng gấp đôi chỉ sau một đêm, hàng trăm người ký kiến nghị yêu cầu công ty giải thích quyết định và rút lại mức tăng.", "why": "bus fare / train fare = giá vé xe buýt / tàu hỏa (fare đứng sau loại phương tiện).", "new": [{"w": "petition", "vi": "kiến nghị"}, {"w": "reverse", "vi": "đảo ngược, hủy bỏ"}], "ipa": "/ˈbʌs feər/ /ˈtreɪn feər/"}, {"type": "mc", "ctx": "Cheap flights", "s": "Budget airlines have forced competitors to cut their ___, so ordinary families can now afford to travel abroad more than once a year.", "o": ["airfares", "tuitions", "pavements"], "a": "airfares", "tw": "airfare", "vi": "Các hãng hàng không giá rẻ buộc đối thủ phải giảm giá vé máy bay, nên các gia đình bình thường giờ có thể đi nước ngoài hơn một lần mỗi năm.", "why": "airfare = giá vé máy bay (một từ ghép, danh từ).", "new": [{"w": "budget airlines", "vi": "hãng bay giá rẻ"}, {"w": "competitors", "vi": "đối thủ cạnh tranh"}], "ipa": "/ˈeə.feər/"}, {"type": "mc", "ctx": "Guided tour", "s": "The tour guide told us to ___ the coach at nine sharp, because the museum would close early for a private event.", "o": ["get over", "get on", "get along"], "a": "get on", "tw": "get on", "vi": "Hướng dẫn viên bảo chúng tôi lên xe khách đúng chín giờ vì bảo tàng sẽ đóng sớm để tổ chức sự kiện riêng.", "why": "get on + bus/coach/train/plane = lên xe buýt, tàu, máy bay (phương tiện lớn, đứng được).", "new": [{"w": "sharp", "vi": "đúng (giờ)"}, {"w": "private event", "vi": "sự kiện riêng"}]}, {"type": "mc", "ctx": "Rush hour", "s": "By the time the train reached the terminal, most commuters were eager to ___ and hurry home before the heavy rain started.", "o": ["get up", "get back", "get off"], "a": "get off", "tw": "get off", "vi": "Khi tàu tới ga cuối, hầu hết người đi làm đều muốn xuống tàu và vội về nhà trước khi mưa lớn bắt đầu.", "why": "get off + bus/coach/train/plane = xuống xe buýt, tàu, máy bay.", "new": [{"w": "terminal", "vi": "ga cuối"}, {"w": "eager", "vi": "háo hức, nóng lòng"}]}, {"type": "mc", "ctx": "Child safety", "s": "Children should always ___ the back seat of the car and fasten their seat belts, even if the journey is only a few minutes.", "o": ["get into", "get along", "get rid of"], "a": "get into", "tw": "get into", "vi": "Trẻ em luôn nên lên ngồi ghế sau ô tô và thắt dây an toàn, dù chuyến đi chỉ vài phút.", "why": "get into + car/taxi = lên xe ô tô, taxi (xe nhỏ, ngồi vào).", "new": [{"w": "fasten", "vi": "thắt, cài"}, {"w": "journey", "vi": "chuyến đi"}]}, {"type": "mc", "ctx": "Hot day trip", "s": "After a long journey, my grandfather was too stiff to ___ the taxi without help, so the driver kindly opened the door for him.", "o": ["get on with", "get out of", "get used to"], "a": "get out of", "tw": "get out of", "vi": "Sau chuyến đi dài, ông tôi cứng người đến mức không thể xuống taxi nếu không có người giúp nên tài xế vui lòng mở cửa cho ông.", "why": "get out of + car/taxi = xuống xe ô tô, taxi.", "new": [{"w": "stiff", "vi": "cứng đờ"}]}, {"type": "mc", "ctx": "Airport trip", "s": "Since my scooter was being repaired, I had to ___ to the airport, which took longer but cost less than a taxi.", "o": ["miss the point", "take a photo", "catch the bus"], "a": "catch the bus", "tw": "catch the bus", "vi": "Vì xe tay ga đang sửa, tôi phải đi xe buýt ra sân bay, mất thời gian hơn nhưng rẻ hơn taxi.", "why": "get / catch the bus = bắt xe buýt, đi xe buýt.", "new": [{"w": "scooter", "vi": "xe tay ga"}, {"w": "repaired", "vi": "được sửa"}], "ipa": "/ɡet/ /kætʃ ðə bʌs/"}, {"type": "mc", "ctx": "Evening return", "s": "Our meeting finishes at four, so there is plenty of time to ___ at six and be home before the children go to bed.", "o": ["catch the train", "raise the price", "pay the rent"], "a": "catch the train", "tw": "catch the train", "vi": "Cuộc họp của chúng ta kết thúc lúc bốn giờ nên còn nhiều thời gian để bắt chuyến tàu sáu giờ và về nhà trước khi bọn trẻ đi ngủ.", "why": "get / catch the train = bắt tàu, đi tàu.", "new": [{"w": "plenty of", "vi": "nhiều"}], "ipa": "/ɡet/ /kætʃ ðə treɪn/"}, {"type": "mc", "ctx": "Green choices", "s": "If you want to reduce your carbon footprint, you could ___ train instead of flying whenever the journey takes less than five hours.", "o": ["go on", "go by", "go out"], "a": "go by", "tw": "go by", "vi": "Nếu muốn giảm lượng khí thải carbon của mình, bạn có thể đi bằng tàu thay vì bay mỗi khi chuyến đi dưới năm giờ.", "why": "go by + bus/train/plane = đi bằng phương tiện đó (không có mạo từ a/the).", "new": [{"w": "carbon footprint", "vi": "dấu chân carbon"}, {"w": "reduce", "vi": "giảm"}], "ipa": "/ɡəʊ baɪ/"}, {"type": "mc", "ctx": "Climate talk", "s": "Some environmental groups urge business people to hold video meetings rather than ___ across the world for a single conversation.", "o": ["swim", "repair", "fly"], "a": "fly", "tw": "fly", "vi": "Một số nhóm môi trường kêu gọi doanh nhân họp trực tuyến thay vì bay khắp thế giới chỉ cho một cuộc trò chuyện.", "why": "fly = bay, đi bằng máy bay (quá khứ flew, phân từ flown).", "new": [{"w": "urge", "vi": "kêu gọi"}, {"w": "environmental", "vi": "thuộc môi trường"}], "ipa": "/flaɪ/"}, {"type": "mc", "ctx": "Traffic jam", "s": "Despite leaving home early, Tom managed to ___ because a fallen tree blocked the road and nobody could pass for twenty minutes.", "o": ["miss the train", "pass the exam", "book a ticket"], "a": "miss the train", "tw": "miss the train", "vi": "Mặc dù rời nhà sớm, Tom vẫn lỡ tàu vì một cái cây đổ chặn đường và không ai qua được trong hai mươi phút.", "why": "miss the train / bus = lỡ tàu / xe buýt (không kịp lên).", "new": [{"w": "fallen", "vi": "bị đổ"}, {"w": "blocked", "vi": "chặn"}], "ipa": "/mɪs ðə treɪn/ /mɪs ðə bʌs/"}, {"type": "mc", "ctx": "Road sign", "s": "Along this stretch of mountain road there is a strict ___ rule, so slow tourists often create long queues behind them.", "o": ["no smoking", "no overtaking", "no parking"], "a": "no overtaking", "tw": "no overtaking", "vi": "Dọc đoạn đường núi này có quy định cấm vượt nghiêm ngặt nên du khách chạy chậm thường tạo thành hàng dài xe phía sau.", "why": "no overtaking = biển/quy định cấm vượt xe khác.", "new": [{"w": "stretch", "vi": "đoạn đường"}, {"w": "queues", "vi": "hàng dài"}], "ipa": "/ˌnəʊ ˌəʊvəˈteɪkɪŋ/"}, {"type": "mc", "ctx": "Slow tractor", "s": "My father is a patient driver who prefers to follow a slow tractor rather than ___ it where the road is narrow.", "o": ["borrow", "describe", "overtake"], "a": "overtake", "tw": "overtake", "vi": "Bố tôi là người lái xe kiên nhẫn, thích đi theo sau một chiếc máy kéo chậm hơn là vượt nó ở chỗ đường hẹp.", "why": "overtake + somebody/something = vượt (xe khác); quá khứ overtook.", "new": [{"w": "tractor", "vi": "máy kéo"}, {"w": "patient", "vi": "kiên nhẫn"}], "ipa": "/ˌəʊvəˈteɪk/"}, {"type": "mc", "ctx": "City traffic", "s": "The council wants to lower the ___ in residential areas to thirty kilometres an hour, so that there are fewer serious accidents.", "o": ["speed limit", "bus fare", "front door"], "a": "speed limit", "tw": "speed limit", "vi": "Hội đồng muốn hạ giới hạn tốc độ ở khu dân cư xuống ba mươi km/giờ để có ít tai nạn nghiêm trọng hơn.", "why": "speed limit = giới hạn tốc độ tối đa được phép trên đường.", "new": [{"w": "residential", "vi": "thuộc khu dân cư"}, {"w": "serious", "vi": "nghiêm trọng"}], "ipa": "/ˈspiːd ˌlɪmɪt/"}, {"type": "mc", "ctx": "Rest stop", "s": "Drivers are advised to stop at a service station on the ___ every two hours, because tiredness is a major cause of accidents.", "o": ["pavement", "motorway", "corridor"], "a": "motorway", "tw": "motorway", "vi": "Tài xế được khuyên nên dừng ở trạm dịch vụ trên đường cao tốc mỗi hai giờ vì mệt mỏi là nguyên nhân chính gây tai nạn.", "why": "motorway = đường cao tốc (BrE; AmE: highway/freeway).", "new": [{"w": "service station", "vi": "trạm dừng nghỉ"}, {"w": "tiredness", "vi": "sự mệt mỏi"}], "ipa": "/ˈməʊtəweɪ/"}, {"type": "mc", "ctx": "Hidden bakery", "s": "The bakery stands on a quiet ___ just behind the station, so it is easy to miss if you only follow the main avenue.", "o": ["speed limit", "airfare", "side road"], "a": "side road", "tw": "side road", "vi": "Tiệm bánh nằm trên một con đường nhỏ yên tĩnh ngay sau nhà ga, nên dễ bỏ lỡ nếu bạn chỉ đi theo đại lộ chính.", "why": "side road = đường nhỏ nhánh ra từ đường chính.", "new": [{"w": "avenue", "vi": "đại lộ"}], "ipa": "/ˈsaɪd rəʊd/"}, {"type": "mc", "ctx": "Travel safety", "s": "If you ___ in an unfamiliar city, it is usually safer to enter a shop and ask for help than to wander around alone.", "o": ["get lost", "get dressed", "get married"], "a": "get lost", "tw": "get lost", "vi": "Nếu bạn bị lạc ở một thành phố lạ, thường an toàn hơn là vào cửa hàng nhờ giúp đỡ hơn là đi lang thang một mình.", "why": "get lost = bị lạc đường (cũng có nghĩa bóng 'biến đi' – thô lỗ).", "new": [{"w": "unfamiliar", "vi": "xa lạ"}, {"w": "wander", "vi": "đi lang thang"}], "ipa": "/ˌɡet ˈlɒst/"}, {"type": "mc", "ctx": "Flight delay", "s": "She was ___ the airport when the airline informed her that the flight had been delayed by three hours.", "o": ["in charge of", "on her way to", "in front of"], "a": "on her way to", "tw": "on my way to", "vi": "Cô đang trên đường tới sân bay thì hãng hàng không thông báo chuyến bay bị hoãn ba tiếng.", "why": "on my way to + nơi chốn = trên đường tới đó (my đổi theo chủ ngữ).", "new": [{"w": "informed", "vi": "thông báo"}, {"w": "delayed", "vi": "bị hoãn"}], "ipa": "/ɒn maɪ weɪ tə/"}, {"type": "mc", "ctx": "Detour village", "s": "Because the bridge was closed for repairs, we had to ___ a small village, which added forty minutes to our journey.", "o": ["go off", "go on", "go via"], "a": "go via", "tw": "go via", "vi": "Vì cây cầu đóng để sửa chữa, chúng tôi phải đi qua một ngôi làng nhỏ, làm hành trình dài thêm bốn mươi phút.", "why": "go via + nơi chốn = đi qua nơi đó trên đường tới nơi khác.", "new": [{"w": "repairs", "vi": "việc sửa chữa"}, {"w": "added", "vi": "thêm vào"}], "ipa": "/ˈvaɪə/"}, {"type": "mc", "ctx": "Rural village", "s": "The village is so small that there is only one ___ off the main road, and it leads to a farm with a red gate.", "o": ["turning", "passenger", "ticket"], "a": "turning", "tw": "turning", "vi": "Ngôi làng nhỏ đến nỗi chỉ có một ngã rẽ khỏi đường chính, và nó dẫn tới một trang trại có cổng đỏ.", "why": "turning = chỗ rẽ, ngã rẽ trên đường (the second turning on the left).", "new": [{"w": "leads to", "vi": "dẫn tới"}, {"w": "gate", "vi": "cổng"}], "ipa": "/ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Road works", "s": "I didn't ___ on purpose; the road works hid the proper sign, so I ended up in a car park behind the stadium.", "o": ["take a deep breath", "take the wrong turning", "take an exam"], "a": "take the wrong turning", "tw": "take the wrong turning", "vi": "Tôi không cố ý rẽ nhầm đường; công trình sửa đường che mất biển báo đúng nên rốt cuộc tôi vào bãi đỗ xe sau sân vận động.", "why": "take the wrong turning = rẽ nhầm đường (thường dẫn đến đi lạc).", "new": [{"w": "on purpose", "vi": "cố ý"}, {"w": "stadium", "vi": "sân vận động"}], "ipa": "/teɪk ðə rɒŋ ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Evening plans", "s": "We planned a quiet evening at home, but we ___ at a street festival, dancing with strangers until after midnight.", "o": ["gave up", "looked up", "ended up"], "a": "ended up", "tw": "end up", "vi": "Chúng tôi định buổi tối yên tĩnh ở nhà nhưng rốt cuộc lại ở một lễ hội đường phố, nhảy với người lạ đến quá nửa đêm.", "why": "end up in/at + nơi chốn = cuối cùng lại ở đâu (kết quả không dự tính).", "new": [{"w": "festival", "vi": "lễ hội"}, {"w": "strangers", "vi": "người lạ"}], "ipa": "/ˌend ˈʌp/"}, {"type": "mc", "ctx": "Asking locals", "s": "Rather than guess, it is wiser to ___ a local resident, because tourist maps sometimes ignore small shortcuts.", "o": ["ask the way", "ask a favour", "ask for a refund"], "a": "ask the way", "tw": "ask the way", "vi": "Thay vì đoán, khôn ngoan hơn là hỏi đường một cư dân địa phương vì bản đồ du lịch đôi khi bỏ qua những lối tắt nhỏ.", "why": "ask somebody the way (to somewhere) = hỏi đường ai đó tới nơi nào.", "new": [{"w": "local resident", "vi": "cư dân địa phương"}, {"w": "shortcuts", "vi": "lối tắt"}], "ipa": "/ɑːsk ðə weɪ/"}, {"type": "mc", "ctx": "Chemist search", "s": "Could you please ___ me to the nearest chemist's? I have a terrible headache and I forgot to bring my tablets.", "o": ["reduce", "direct", "damage"], "a": "direct", "tw": "direct", "vi": "Bạn làm ơn chỉ đường cho tôi tới hiệu thuốc gần nhất được không? Tôi đau đầu kinh khủng và quên mang thuốc viên.", "why": "direct somebody to somewhere = chỉ đường cho ai tới đâu.", "new": [{"w": "chemist's", "vi": "hiệu thuốc"}, {"w": "tablets", "vi": "thuốc viên"}], "ipa": "/dəˈrekt/"}, {"type": "mc", "ctx": "Airport roadworks", "s": "To avoid the roadworks, drivers are asked to ___ the airport and then take the second exit at the roundabout.", "o": ["pay attention to", "search the web for", "follow signs for"], "a": "follow signs for", "tw": "follow signs for", "vi": "Để tránh công trình sửa đường, tài xế được yêu cầu đi theo biển chỉ dẫn tới sân bay rồi ra lối thứ hai ở bùng binh.", "why": "follow signs for + nơi chốn = đi theo biển chỉ dẫn tới nơi đó.", "new": [{"w": "exit", "vi": "lối ra"}, {"w": "roundabout", "vi": "bùng binh"}], "ipa": "/ˈfɒləʊ saɪnz fə/"}, {"type": "mc", "ctx": "School journey", "s": "Last week I ___ near my school while walking my son to class, so I called the police at once and stayed until help arrived.", "o": ["saw an accident", "had an exam", "made a mistake"], "a": "saw an accident", "tw": "see an accident", "vi": "Tuần trước tôi chứng kiến một vụ tai nạn gần trường khi đang dắt con đến lớp, nên tôi gọi cảnh sát ngay và ở lại đến khi có người đến giúp.", "why": "see an accident = chứng kiến một vụ tai nạn (khác have an accident = bị tai nạn).", "new": [{"w": "at once", "vi": "ngay lập tức"}], "ipa": "/siː ən ˈæksɪdənt/"}, {"type": "mc", "ctx": "Car insurance", "s": "Young drivers are more likely to ___ than experienced ones, which is why insurance companies charge them much higher prices.", "o": ["take a break", "have an accident", "make a decision"], "a": "have an accident", "tw": "have an accident", "vi": "Tài xế trẻ có khả năng gặp tai nạn cao hơn người có kinh nghiệm, đó là lý do các công ty bảo hiểm tính giá cao hơn nhiều với họ.", "why": "have an accident = bị/gặp tai nạn.", "new": [{"w": "insurance", "vi": "bảo hiểm"}, {"w": "charge", "vi": "tính phí"}], "ipa": "/hæv ən ˈæksɪdənt/"}, {"type": "mc", "ctx": "Quiet guesthouse", "s": "Our guesthouse is a five-minute walk from ___, but it is surprisingly quiet at night because the windows face a garden.", "o": ["the boarding gate", "the changing room", "the main road"], "a": "the main road", "tw": "the main road", "vi": "Nhà nghỉ của chúng tôi cách đường chính năm phút đi bộ nhưng ban đêm yên tĩnh đến bất ngờ vì cửa sổ hướng ra vườn.", "why": "the main road = đường chính, đường lớn (đối lập với side road).", "new": [{"w": "face", "vi": "hướng ra"}], "ipa": "/ðə meɪn rəʊd/"}, {"type": "mc", "ctx": "Photo stop", "s": "The tourist suddenly decided to ___ the curb to take a photograph, and a cyclist had to swerve around him.", "o": ["step off", "step in", "step down as manager"], "a": "step off", "tw": "step off", "vi": "Du khách đột nhiên bước xuống khỏi lề đường để chụp ảnh và một người đi xe đạp phải đánh lái né anh ta.", "why": "step off + something = bước xuống khỏi (vỉa hè, bậc thang…).", "new": [{"w": "curb", "vi": "lề đường"}, {"w": "photograph", "vi": "bức ảnh"}], "ipa": "/step ɒf/"}, {"type": "mc", "ctx": "School road", "s": "You should always reduce your speed when you ___ a school, because children may run into the road without warning.", "o": ["describe", "approach", "reserve"], "a": "approach", "tw": "approach", "vi": "Bạn luôn nên giảm tốc độ khi tiến lại gần một ngôi trường vì trẻ em có thể chạy ra đường không báo trước.", "why": "approach + something/somebody = tiến lại gần (động từ, cũng là danh từ 'cách tiếp cận').", "new": [{"w": "without warning", "vi": "không báo trước"}], "ipa": "/əˈprəʊtʃ/"}, {"type": "mc", "ctx": "Delivery truck", "s": "The lorry driver had to ___ hard when a dog suddenly ran across the road, and the goods in the back slid forward.", "o": ["bake", "break", "brake"], "a": "brake", "tw": "brake", "vi": "Tài xế xe tải phải phanh gấp khi một con chó bất ngờ chạy ngang đường, và hàng ở phía sau trượt về trước.", "why": "brake (hard) = phanh, thắng gấp (động từ; cũng là danh từ 'cái phanh').", "new": [{"w": "slid forward", "vi": "trượt về phía trước"}], "ipa": "/breɪk/"}, {"type": "mc", "ctx": "Sudden swerve", "s": "When a deer jumped onto the road, I tried to ___ to the left, although I knew it was risky on a wet bend.", "o": ["swerve", "stretch", "arrange"], "a": "swerve", "tw": "swerve", "vi": "Khi một con nai nhảy ra đường, tôi cố đánh lái sang trái dù biết điều đó rủi ro trên khúc cua ướt.", "why": "swerve (to avoid something) = đánh lái đột ngột để tránh cái gì.", "new": [{"w": "deer", "vi": "con nai"}, {"w": "risky", "vi": "rủi ro"}], "ipa": "/swɜːv/"}, {"type": "mc", "ctx": "Phone distraction", "s": "Drivers who check their phones while driving are more likely to ___ the car in front, especially in heavy traffic.", "o": ["borrow from", "crash into", "wait for"], "a": "crash into", "tw": "crash into", "vi": "Tài xế xem điện thoại khi lái dễ đâm vào xe phía trước hơn, đặc biệt khi giao thông đông.", "why": "crash into + something = đâm vào cái gì.", "new": [{"w": "especially", "vi": "đặc biệt là"}], "ipa": "/kræʃ ˈɪntuː/"}, {"type": "mc", "ctx": "Cycling safely", "s": "Cyclists should leave enough space when they pass ___, because a driver might open the door without checking behind.", "o": ["a flight attendant", "a bus fare", "a parked car"], "a": "a parked car", "tw": "a parked car", "vi": "Người đi xe đạp nên chừa đủ khoảng trống khi đi qua một chiếc xe đang đỗ vì tài xế có thể mở cửa mà không kiểm tra phía sau.", "why": "a parked car = chiếc xe đang đỗ (parked là tính từ).", "new": [{"w": "space", "vi": "khoảng trống"}], "ipa": "/ə pɑːkt kɑː/"}, {"type": "mc", "ctx": "Turning right", "s": "A motorbike was coming ___, so the driver had to wait before he could turn right into the car park.", "o": ["on the opposite side of the road", "in the middle of a lesson", "at the end of the month"], "a": "on the opposite side of the road", "tw": "on the opposite side of the road", "vi": "Một xe máy đang chạy phía bên kia đường nên tài xế phải đợi trước khi rẽ phải vào bãi đỗ xe.", "why": "on the opposite side of the road = ở phía bên kia đường.", "new": [{"w": "turn right", "vi": "rẽ phải"}], "ipa": "/ɒn ðə ˈɒpəzɪt saɪd əv ðə rəʊd/"}, {"type": "mc", "ctx": "Football match", "s": "Players are warned not to tackle too roughly, because a careless move could easily ___ an opponent and end his season.", "o": ["invite", "injure", "imagine"], "a": "injure", "tw": "injure", "vi": "Cầu thủ được cảnh báo không vào bóng quá thô bạo vì một động tác bất cẩn có thể dễ dàng làm đối thủ bị thương và kết thúc mùa giải của anh.", "why": "injure + somebody = làm ai bị thương.", "new": [{"w": "tackle", "vi": "vào bóng, truy cản"}, {"w": "opponent", "vi": "đối thủ"}], "ipa": "/ˈɪndʒə/"}, {"type": "mc", "ctx": "Train emergency", "s": "Several passengers ___ when the train stopped suddenly, but fortunately most of them only needed a few bandages.", "o": ["were invited", "were introduced", "were injured"], "a": "were injured", "tw": "be injured", "vi": "Vài hành khách bị thương khi tàu dừng đột ngột nhưng may là hầu hết chỉ cần vài miếng băng.", "why": "be injured = bị thương (bị động của injure).", "new": [{"w": "bandages", "vi": "băng gạc"}], "ipa": "/ˈɪndʒə/"}, {"type": "mc", "ctx": "Football injury", "s": "The football player left the pitch with ___, but the coach said he would be ready for the final next week.", "o": ["a minor injury", "a major discovery", "a heavy lorry"], "a": "a minor injury", "tw": "a minor injury", "vi": "Cầu thủ rời sân với một chấn thương nhẹ nhưng huấn luyện viên nói anh sẽ sẵn sàng cho trận chung kết tuần sau.", "why": "a minor injury = thương tích nhẹ (minor = nhỏ, không nghiêm trọng).", "new": [{"w": "pitch", "vi": "sân bóng"}, {"w": "final", "vi": "trận chung kết"}], "ipa": "/ə ˈmaɪnə ˈɪndʒəri/"}, {"type": "mc", "ctx": "Laptop care", "s": "Be careful with the new laptop, because spilling a drink could ___ the keyboard and make the repair bill extremely high.", "o": ["donate", "damage", "explain"], "a": "damage", "tw": "damage", "vi": "Hãy cẩn thận với laptop mới vì làm đổ đồ uống có thể làm hư hỏng bàn phím và khiến hóa đơn sửa chữa cực kỳ cao.", "why": "damage + something = làm hư hại cái gì (động từ).", "new": [{"w": "spilling", "vi": "làm đổ"}, {"w": "repair bill", "vi": "hóa đơn sửa chữa"}], "ipa": "/ˈdæmɪdʒ/"}, {"type": "mc", "ctx": "Car collision", "s": "After the collision, both cars ___ and had to be towed away, although neither driver needed to go to hospital.", "o": ["were badly paid", "were badly organised", "were badly damaged"], "a": "were badly damaged", "tw": "be badly damaged", "vi": "Sau va chạm, cả hai xe bị hư hại nặng và phải kéo đi nhưng không tài xế nào cần vào bệnh viện.", "why": "be badly damaged = bị hư hại nặng (bị động của damage).", "new": [{"w": "collision", "vi": "vụ va chạm"}, {"w": "towed", "vi": "bị kéo"}], "ipa": "/ˈdæmɪdʒ/"}, {"type": "mc", "ctx": "Coral reefs", "s": "Environmental groups are worried about the ___ coral reefs caused by tourist boats, which drop anchors in the shallow water.", "o": ["damage to", "access to", "reply to"], "a": "damage to", "tw": "damage to", "vi": "Các nhóm môi trường lo ngại về thiệt hại đối với rạn san hô do tàu du lịch gây ra khi thả neo ở vùng nước nông.", "why": "damage to + something = thiệt hại đối với cái gì (danh từ không đếm được).", "new": [{"w": "coral reefs", "vi": "rạn san hô"}, {"w": "anchors", "vi": "mỏ neo"}], "ipa": "/ˈdæmɪdʒ tuː/"}, {"type": "mc", "ctx": "Street vendors", "s": "Street vendors are not allowed to block the ___, as pedestrians, especially wheelchair users, need enough space to pass.", "o": ["passport", "pavement", "platform"], "a": "pavement", "tw": "pavement", "vi": "Người bán hàng rong không được chặn vỉa hè vì người đi bộ, đặc biệt là người dùng xe lăn, cần đủ chỗ để đi qua.", "why": "pavement (BrE) = vỉa hè; tiếng Anh Mỹ là sidewalk.", "new": [{"w": "vendors", "vi": "người bán hàng rong"}, {"w": "wheelchair", "vi": "xe lăn"}], "ipa": "/ˈpeɪvmənt/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Flat viewing", "s": "When the estate agent showed us around the flat, she pointed out that the front door was made of solid oak. It was heavy, but it also kept the corridor quiet. What does \"front door\" mean?", "o": ["cửa sổ phòng khách", "cửa chính", "cửa sau của nhà bếp"], "a": "cửa chính", "vi": "Khi nhân viên bất động sản dẫn chúng tôi đi xem căn hộ, cô ấy chỉ ra rằng cửa chính làm bằng gỗ sồi nguyên khối. Cửa nặng nhưng giúp hành lang yên tĩnh.", "why": "front door = cửa chính của một ngôi nhà hoặc căn hộ (khác back door).", "noblank": true, "say": "When the estate agent showed us around the flat, she pointed out that the front door was made of solid oak. It was heavy, but it also kept the corridor quiet.", "new": [{"w": "estate agent", "vi": "nhân viên bất động sản"}, {"w": "solid oak", "vi": "gỗ sồi nguyên khối"}, {"w": "corridor", "vi": "hành lang"}], "tw": "front door", "ipa": "/ˌfrʌnt ˈdɔːr/"}, {"type": "mc", "ctx": "Health campaign", "s": "The clinic launched a campaign to raise awareness of hepatitis, a disease that affects the liver. Many patients do not notice any symptoms until the illness is serious. What does \"hepatitis\" mean?", "o": ["viêm họng", "viêm khớp", "viêm gan"], "a": "viêm gan", "vi": "Phòng khám phát động chiến dịch nâng cao nhận thức về bệnh viêm gan, một căn bệnh ảnh hưởng đến gan. Nhiều bệnh nhân không nhận thấy triệu chứng nào cho đến khi bệnh nặng.", "why": "hepatitis = viêm gan (bệnh của gan, danh từ không đếm được).", "noblank": true, "say": "The clinic launched a campaign to raise awareness of hepatitis, a disease that affects the liver. Many patients do not notice any symptoms until the illness is serious.", "new": [{"w": "campaign", "vi": "chiến dịch"}, {"w": "awareness", "vi": "nhận thức"}, {"w": "symptoms", "vi": "triệu chứng"}], "tw": "hepatitis", "ipa": "/ˌhep.əˈtaɪ.t̬əs/"}, {"type": "mc", "ctx": "Wedding invitation", "s": "The invitation said that guests should wear smart clothes, since the ceremony would take place in the town hall. My brother borrowed a tie from his friend. What does \"smart\" mean?", "o": ["lịch sự, chỉnh tề", "thoải mái, rộng rãi", "thông minh, nhanh trí"], "a": "lịch sự, chỉnh tề", "vi": "Thiệp mời ghi rằng khách nên mặc trang phục chỉnh tề vì buổi lễ diễn ra ở tòa thị chính. Anh tôi mượn một chiếc cà vạt của bạn.", "why": "smart (về quần áo) = lịch sự, chỉnh tề, phù hợp nơi trang trọng (BrE).", "noblank": true, "say": "The invitation said that guests should wear smart clothes, since the ceremony would take place in the town hall. My brother borrowed a tie from his friend.", "new": [{"w": "ceremony", "vi": "buổi lễ"}, {"w": "town hall", "vi": "tòa thị chính"}, {"w": "borrowed", "vi": "mượn"}], "tw": "smart", "ipa": "/smɑːrt/"}, {"type": "mc", "ctx": "Hotel reception", "s": "A well-dressed man in a grey coat stood at the reception desk, asking politely for the director. The staff immediately assumed that he was an important visitor. What does \"well-dressed\" mean?", "o": ["trông rất mệt mỏi", "ăn mặc đẹp, chỉnh tề", "ăn mặc lôi thôi"], "a": "ăn mặc đẹp, chỉnh tề", "vi": "Một người đàn ông ăn mặc chỉnh tề trong áo khoác xám đứng ở quầy lễ tân, lịch sự hỏi gặp giám đốc. Nhân viên lập tức cho rằng ông là một vị khách quan trọng.", "why": "well-dressed = ăn mặc đẹp, chỉnh tề (tính từ ghép, có gạch nối).", "noblank": true, "say": "A well-dressed man in a grey coat stood at the reception desk, asking politely for the director. The staff immediately assumed that he was an important visitor.", "new": [{"w": "reception desk", "vi": "quầy lễ tân"}, {"w": "assumed", "vi": "cho rằng"}], "tw": "well-dressed", "ipa": "/ˌwelˈdrest/"}, {"type": "mc", "ctx": "First internship", "s": "On the first day of her internship, Lan noticed that everyone in the office was smartly dressed. She decided to buy a jacket the following weekend. What does \"smartly dressed\" mean?", "o": ["ăn mặc giản dị", "ăn mặc quá hở hang", "ăn mặc chỉnh tề"], "a": "ăn mặc chỉnh tề", "vi": "Vào ngày đầu thực tập, Lan nhận thấy mọi người trong văn phòng đều ăn mặc chỉnh tề. Cô quyết định mua một chiếc áo khoác vào cuối tuần sau.", "why": "smartly dressed = ăn mặc chỉnh tề (trạng từ smartly + dressed).", "noblank": true, "say": "On the first day of her internship, Lan noticed that everyone in the office was smartly dressed. She decided to buy a jacket the following weekend.", "new": [{"w": "internship", "vi": "kỳ thực tập"}, {"w": "decided", "vi": "quyết định"}], "tw": "smartly dressed", "ipa": "/ˌsmɑːrt.li ˈdrest/"}, {"type": "mc", "ctx": "Changing room", "s": "My sister tried on a striped top in the changing room, but the sleeves were too long. The assistant brought her a smaller size, which fitted perfectly. What does \"top\" mean?", "o": ["áo mặc phần trên", "quần dài", "khăn quàng cổ"], "a": "áo mặc phần trên", "vi": "Em gái tôi thử một chiếc áo sọc trong phòng thay đồ nhưng tay áo quá dài. Nhân viên mang cho cô cỡ nhỏ hơn và vừa vặn hoàn hảo.", "why": "top (quần áo) = áo mặc phần trên cơ thể, như áo thun, áo kiểu.", "noblank": true, "say": "My sister tried on a striped top in the changing room, but the sleeves were too long. The assistant brought her a smaller size, which fitted perfectly.", "new": [{"w": "striped", "vi": "có sọc"}, {"w": "sleeves", "vi": "tay áo"}, {"w": "changing room", "vi": "phòng thay đồ"}], "tw": "top", "ipa": "/tɑːp/"}, {"type": "mc", "ctx": "Student volunteer", "s": "Apart from studying full-time, Mai also volunteers at a children's library twice a week. She says it helps her relax after stressful exams. What does \"apart from\" mean?", "o": ["thay vì", "ngoài việc, ngoại trừ", "trước khi"], "a": "ngoài việc, ngoại trừ", "vi": "Ngoài việc học toàn thời gian, Mai còn làm tình nguyện ở thư viện thiếu nhi hai lần mỗi tuần. Cô nói điều đó giúp cô thư giãn sau các kỳ thi căng thẳng.", "why": "apart from + N/V-ing = ngoài ra, ngoại trừ (=besides).", "noblank": true, "say": "Apart from studying full-time, Mai also volunteers at a children's library twice a week. She says it helps her relax after stressful exams.", "new": [{"w": "volunteers", "vi": "làm tình nguyện"}, {"w": "stressful", "vi": "căng thẳng"}], "tw": "apart from", "ipa": "/əˈpɑːt frəm/"}, {"type": "mc", "ctx": "City planning", "s": "The council plans to ban lorries from the old town centre because the narrow streets are not designed for such huge vehicles. Residents have welcomed the idea. What does \"lorry\" mean?", "o": ["xe đạp", "xe buýt", "xe tải"], "a": "xe tải", "vi": "Hội đồng dự định cấm xe tải vào khu phố cổ vì các con đường hẹp không được thiết kế cho những phương tiện khổng lồ như vậy. Cư dân hoan nghênh ý tưởng này.", "why": "lorry (Anh) / truck (Mỹ) = xe tải lớn chở hàng.", "noblank": true, "say": "The council plans to ban lorries from the old town centre because the narrow streets are not designed for such huge vehicles. Residents have welcomed the idea.", "new": [{"w": "ban", "vi": "cấm"}, {"w": "residents", "vi": "cư dân"}], "tw": "lorry", "ipa": "/ˈlɒr.i/ /trʌk/"}, {"type": "mc", "ctx": "School delivery", "s": "A white van was parked outside the school gate, and a man was unloading boxes of fruit. The cook explained that the delivery arrives every Tuesday. What does \"van\" mean?", "o": ["xe tải nhỏ có thùng kín", "xe máy cũ", "xe đạp điện"], "a": "xe tải nhỏ có thùng kín", "vi": "Một chiếc xe van trắng đỗ trước cổng trường và một người đàn ông đang dỡ các thùng trái cây. Người đầu bếp giải thích rằng hàng được giao vào mỗi thứ Ba.", "why": "van = xe tải nhỏ có thùng kín, dùng giao hàng hoặc chở người.", "noblank": true, "say": "A white van was parked outside the school gate, and a man was unloading boxes of fruit. The cook explained that the delivery arrives every Tuesday.", "new": [{"w": "unloading", "vi": "dỡ hàng"}, {"w": "cook", "vi": "đầu bếp"}], "tw": "van", "ipa": "/væn/"}, {"type": "mc", "ctx": "Safe landing", "s": "The pilot landed the aircraft safely on a short runway even though visibility was poor. The airline later praised his quick decisions in a public statement. What does \"pilot\" mean?", "o": ["tiếp viên", "phi công", "kiểm soát viên mặt đất"], "a": "phi công", "vi": "Phi công hạ cánh an toàn xuống một đường băng ngắn dù tầm nhìn kém. Sau đó hãng hàng không khen ngợi các quyết định nhanh của anh trong một tuyên bố công khai.", "why": "pilot = phi công, người lái máy bay.", "noblank": true, "say": "The pilot landed the aircraft safely on a short runway even though visibility was poor. The airline later praised his quick decisions in a public statement.", "new": [{"w": "runway", "vi": "đường băng"}, {"w": "visibility", "vi": "tầm nhìn"}, {"w": "praised", "vi": "khen ngợi"}], "tw": "pilot", "ipa": "/ˈpaɪ.lət/"}, {"type": "mc", "ctx": "Rising prices", "s": "Public transport fares have risen again this year, which means that low-income workers now spend a large part of their salary on commuting. What does \"fare\" mean?", "o": ["tốc độ", "lịch chạy", "giá vé"], "a": "giá vé", "vi": "Giá vé giao thông công cộng năm nay lại tăng, nghĩa là người lao động thu nhập thấp giờ tiêu một phần lớn lương cho việc đi làm.", "why": "fare = tiền vé cho một chuyến đi (xe buýt, tàu, taxi, máy bay).", "noblank": true, "say": "Public transport fares have risen again this year, which means that low-income workers now spend a large part of their salary on commuting.", "new": [{"w": "low-income", "vi": "thu nhập thấp"}, {"w": "commuting", "vi": "đi làm hằng ngày"}], "tw": "fare", "ipa": "/feər/"}, {"type": "mc", "ctx": "Rail booking", "s": "A train fare from the capital to the coast costs around twenty pounds if you book online in advance. On the day, however, the same ticket may cost double. What does \"bus fare\" mean?", "o": ["giá vé tàu hỏa", "tiền thuê nhà", "phí gửi hành lý"], "a": "giá vé tàu hỏa", "vi": "Giá vé tàu từ thủ đô đến bờ biển khoảng hai mươi bảng nếu đặt online trước. Tuy nhiên vào ngày đi, cùng một vé có thể đắt gấp đôi.", "why": "bus fare / train fare = giá vé xe buýt / tàu hỏa (fare đứng sau loại phương tiện).", "noblank": true, "say": "A train fare from the capital to the coast costs around twenty pounds if you book online in advance. On the day, however, the same ticket may cost double.", "new": [{"w": "in advance", "vi": "trước, từ sớm"}, {"w": "coast", "vi": "bờ biển"}], "tw": "bus fare", "ipa": "/ˈbʌs feər/ /ˈtreɪn feər/"}, {"type": "mc", "ctx": "Peak season", "s": "Experts say that airfare usually rises sharply during public holidays. Travellers who are flexible with dates can often save a considerable amount of money. What does \"airfare\" mean?", "o": ["phí nhập học", "giá vé máy bay", "tiền ăn khách sạn"], "a": "giá vé máy bay", "vi": "Các chuyên gia nói giá vé máy bay thường tăng mạnh vào các dịp lễ. Du khách linh hoạt về ngày đi thường tiết kiệm được khá nhiều tiền.", "why": "airfare = giá vé máy bay (một từ ghép, danh từ).", "noblank": true, "say": "Experts say that airfare usually rises sharply during public holidays. Travellers who are flexible with dates can often save a considerable amount of money.", "new": [{"w": "sharply", "vi": "mạnh, đột ngột"}, {"w": "flexible", "vi": "linh hoạt"}, {"w": "considerable", "vi": "đáng kể"}], "tw": "airfare", "ipa": "/ˈeə.feər/"}, {"type": "mc", "ctx": "Boarding a plane", "s": "Passengers were asked to get on the plane through the rear door because of repair work at the main gate. The flight left half an hour late. What does \"get on\" mean?", "o": ["xuống (máy bay)", "hủy (chuyến bay)", "lên (máy bay)"], "a": "lên (máy bay)", "vi": "Hành khách được yêu cầu lên máy bay qua cửa sau vì đang sửa chữa ở cổng chính. Chuyến bay khởi hành trễ nửa tiếng.", "why": "get on + bus/coach/train/plane = lên xe buýt, tàu, máy bay (phương tiện lớn, đứng được).", "noblank": true, "say": "Passengers were asked to get on the plane through the rear door because of repair work at the main gate. The flight left half an hour late.", "new": [{"w": "rear", "vi": "phía sau"}, {"w": "repair work", "vi": "công việc sửa chữa"}], "tw": "get on"}, {"type": "mc", "ctx": "Elderly passenger", "s": "An elderly man got off the bus carefully, holding the rail with both hands. A young woman waited patiently behind him and offered to carry his shopping. What does \"get off\" mean?", "o": ["xuống (xe buýt)", "lên (xe buýt)", "đổi (xe buýt)"], "a": "xuống (xe buýt)", "vi": "Một cụ ông cẩn thận xuống xe buýt, nắm tay vịn bằng cả hai tay. Một cô gái trẻ kiên nhẫn đợi sau lưng và đề nghị xách đồ giúp ông.", "why": "get off + bus/coach/train/plane = xuống xe buýt, tàu, máy bay.", "noblank": true, "say": "An elderly man got off the bus carefully, holding the rail with both hands. A young woman waited patiently behind him and offered to carry his shopping.", "new": [{"w": "rail", "vi": "tay vịn"}, {"w": "patiently", "vi": "kiên nhẫn"}, {"w": "shopping", "vi": "đồ mua sắm"}], "tw": "get off"}, {"type": "mc", "ctx": "Concert exit", "s": "The singer quickly got into a black car outside the hotel to avoid the crowd of fans. Security guards formed a line to keep the pavement clear. What does \"get into\" mean?", "o": ["bước xuống (xe ô tô)", "lên (xe ô tô)", "sửa (xe ô tô)"], "a": "lên (xe ô tô)", "vi": "Ca sĩ nhanh chóng lên một chiếc xe đen trước khách sạn để tránh đám đông người hâm mộ. Bảo vệ xếp hàng để giữ vỉa hè thông thoáng.", "why": "get into + car/taxi = lên xe ô tô, taxi (xe nhỏ, ngồi vào).", "noblank": true, "say": "The singer quickly got into a black car outside the hotel to avoid the crowd of fans. Security guards formed a line to keep the pavement clear.", "new": [{"w": "crowd", "vi": "đám đông"}, {"w": "security guards", "vi": "nhân viên bảo vệ"}], "tw": "get into"}, {"type": "mc", "ctx": "Police stop", "s": "When the police stopped the car, the driver was told to get out of it slowly with his hands visible. The officers then searched the boot. What does \"get out of\" mean?", "o": ["khởi động (xe)", "đỗ (xe)", "xuống (xe)"], "a": "xuống (xe)", "vi": "Khi cảnh sát chặn xe, tài xế được yêu cầu từ từ bước xuống xe và để hai tay trong tầm nhìn. Sau đó các sĩ quan kiểm tra cốp xe.", "why": "get out of + car/taxi = xuống xe ô tô, taxi.", "noblank": true, "say": "When the police stopped the car, the driver was told to get out of it slowly with his hands visible. The officers then searched the boot.", "new": [{"w": "visible", "vi": "nhìn thấy được"}, {"w": "boot", "vi": "cốp xe"}], "tw": "get out of"}, {"type": "mc", "ctx": "Late arrival", "s": "Linh sprinted to the stop and just managed to catch the bus, although her bag was bouncing on her shoulder. She sat down, breathless but relieved. What does \"catch the bus\" mean?", "o": ["bắt được xe buýt", "làm lỡ xe buýt", "sửa xe buýt"], "a": "bắt được xe buýt", "vi": "Linh chạy nước rút tới trạm và vừa kịp bắt xe buýt dù túi nảy trên vai. Cô ngồi xuống, thở dốc nhưng nhẹ nhõm.", "why": "get / catch the bus = bắt xe buýt, đi xe buýt.", "noblank": true, "say": "Linh sprinted to the stop and just managed to catch the bus, although her bag was bouncing on her shoulder. She sat down, breathless but relieved.", "new": [{"w": "sprinted", "vi": "chạy hết tốc lực"}, {"w": "breathless", "vi": "hụt hơi"}, {"w": "relieved", "vi": "nhẹ nhõm"}], "tw": "catch the bus", "ipa": "/ɡet/ /kætʃ ðə bʌs/"}, {"type": "mc", "ctx": "Daily commute", "s": "Every morning, thousands of workers catch the train from the suburbs to the financial district. As a result, the platforms are packed before eight o'clock. What does \"catch the train\" mean?", "o": ["làm hỏng tàu", "đi tàu", "lái tàu"], "a": "đi tàu", "vi": "Mỗi sáng hàng nghìn người đi làm bắt tàu từ ngoại ô vào khu tài chính. Kết quả là các sân ga chật kín trước tám giờ.", "why": "get / catch the train = bắt tàu, đi tàu.", "noblank": true, "say": "Every morning, thousands of workers catch the train from the suburbs to the financial district. As a result, the platforms are packed before eight o'clock.", "new": [{"w": "suburbs", "vi": "ngoại ô"}, {"w": "platforms", "vi": "sân ga"}, {"w": "packed", "vi": "chật cứng"}], "tw": "catch the train", "ipa": "/ɡet/ /kætʃ ðə treɪn/"}, {"type": "mc", "ctx": "University life", "s": "Most students in this town go by bus because the university has no parking space. A few lucky ones live close enough to walk. What does \"go by\" mean?", "o": ["đi sau (ai đó)", "đi ngang qua (ai đó)", "đi bằng (phương tiện)"], "a": "đi bằng (phương tiện)", "vi": "Hầu hết sinh viên ở thị trấn này đi bằng xe buýt vì trường đại học không có chỗ đỗ xe. Vài người may mắn sống đủ gần để đi bộ.", "why": "go by + bus/train/plane = đi bằng phương tiện đó (không có mạo từ a/the).", "noblank": true, "say": "Most students in this town go by bus because the university has no parking space. A few lucky ones live close enough to walk.", "new": [{"w": "parking space", "vi": "chỗ đỗ xe"}, {"w": "lucky", "vi": "may mắn"}], "tw": "go by", "ipa": "/ɡəʊ baɪ/"}, {"type": "mc", "ctx": "Business travel", "s": "My uncle flies to Singapore twice a month for his job in logistics. He says the long hours in the air are tiring, but the salary is excellent. What does \"fly\" mean?", "o": ["bay, đi bằng máy bay", "lái xe tải", "đi bộ"], "a": "bay, đi bằng máy bay", "vi": "Chú tôi bay đến Singapore hai lần mỗi tháng cho công việc hậu cần. Chú nói những giờ dài trên không rất mệt nhưng lương rất tốt.", "why": "fly = bay, đi bằng máy bay (quá khứ flew, phân từ flown).", "noblank": true, "say": "My uncle flies to Singapore twice a month for his job in logistics. He says the long hours in the air are tiring, but the salary is excellent.", "new": [{"w": "logistics", "vi": "hậu cần, vận chuyển"}, {"w": "tiring", "vi": "mệt mỏi"}], "tw": "fly", "ipa": "/flaɪ/"}, {"type": "mc", "ctx": "Late bus", "s": "She missed the bus by only a few seconds and watched it disappear around the corner. Fortunately, a colleague offered her a lift to the office. What does \"miss the train\" mean?", "o": ["chờ xe buýt", "lỡ xe buýt", "đổi xe buýt"], "a": "lỡ xe buýt", "vi": "Cô lỡ xe buýt chỉ vì vài giây và nhìn nó khuất sau góc đường. May mắn là một đồng nghiệp đề nghị cho cô đi nhờ đến văn phòng.", "why": "miss the train / bus = lỡ tàu / xe buýt (không kịp lên).", "noblank": true, "say": "She missed the bus by only a few seconds and watched it disappear around the corner. Fortunately, a colleague offered her a lift to the office.", "new": [{"w": "lift", "vi": "chuyến đi nhờ"}, {"w": "fortunately", "vi": "may mắn là"}], "tw": "miss the train", "ipa": "/mɪs ðə treɪn/ /mɪs ðə bʌs/"}, {"type": "mc", "ctx": "School zone", "s": "There is a no-overtaking zone near the school, which means drivers must stay behind slower vehicles. The rule was introduced to protect children crossing the road. What does \"no overtaking\" mean?", "o": ["cấm rẽ", "cấm dừng xe", "cấm vượt"], "a": "cấm vượt", "vi": "Có khu vực cấm vượt gần trường học, nghĩa là tài xế phải đi sau các xe chậm hơn. Quy định này được đưa ra để bảo vệ trẻ em qua đường.", "why": "no overtaking = biển/quy định cấm vượt xe khác.", "noblank": true, "say": "There is a no-overtaking zone near the school, which means drivers must stay behind slower vehicles. The rule was introduced to protect children crossing the road.", "new": [{"w": "zone", "vi": "khu vực"}, {"w": "introduced", "vi": "đưa ra áp dụng"}], "tw": "no overtaking", "ipa": "/ˌnəʊ ˌəʊvəˈteɪkɪŋ/"}, {"type": "mc", "ctx": "Cycling commute", "s": "The cyclist overtook several cars that were stuck in traffic and reached the office ten minutes earlier than his colleagues. He was very pleased with himself. What does \"overtake\" mean?", "o": ["vượt qua", "bám theo", "va vào"], "a": "vượt qua", "vi": "Người đi xe đạp vượt qua nhiều ô tô đang kẹt xe và đến văn phòng sớm hơn đồng nghiệp mười phút. Anh rất hài lòng với bản thân.", "why": "overtake + somebody/something = vượt (xe khác); quá khứ overtook.", "noblank": true, "say": "The cyclist overtook several cars that were stuck in traffic and reached the office ten minutes earlier than his colleagues. He was very pleased with himself.", "new": [{"w": "stuck in traffic", "vi": "kẹt xe"}, {"w": "pleased", "vi": "hài lòng"}], "tw": "overtake", "ipa": "/ˌəʊvəˈteɪk/"}, {"type": "mc", "ctx": "Speed camera", "s": "A speed camera flashed as I passed, although I was sure I was driving within the limit. A few days later, the letter confirmed that I had been going five kilometres too fast. What does \"speed limit\" mean?", "o": ["làn đường dành cho xe đạp", "giới hạn tốc độ", "biển báo giao nhau"], "a": "giới hạn tốc độ", "vi": "Camera tốc độ lóe sáng khi tôi đi qua, dù tôi chắc mình đang lái trong giới hạn. Vài ngày sau, bức thư xác nhận tôi đã chạy nhanh hơn năm km.", "why": "speed limit = giới hạn tốc độ tối đa được phép trên đường.", "noblank": true, "say": "A speed camera flashed as I passed, although I was sure I was driving within the limit. A few days later, the letter confirmed that I had been going five kilometres too fast.", "new": [{"w": "speed camera", "vi": "camera bắt tốc độ"}, {"w": "confirmed", "vi": "xác nhận"}], "tw": "speed limit", "ipa": "/ˈspiːd ˌlɪmɪt/"}, {"type": "mc", "ctx": "New road", "s": "A new motorway will connect the port with the capital, which should reduce the travel time for lorries carrying goods. Local farmers also hope to sell more produce in the city. What does \"motorway\" mean?", "o": ["con hẻm nhỏ", "lối đi bộ", "đường cao tốc"], "a": "đường cao tốc", "vi": "Một đường cao tốc mới sẽ nối cảng với thủ đô, điều sẽ giảm thời gian di chuyển của xe tải chở hàng. Nông dân địa phương cũng hy vọng bán được nhiều nông sản hơn ở thành phố.", "why": "motorway = đường cao tốc (BrE; AmE: highway/freeway).", "noblank": true, "say": "A new motorway will connect the port with the capital, which should reduce the travel time for lorries carrying goods. Local farmers also hope to sell more produce in the city.", "new": [{"w": "connect", "vi": "kết nối"}, {"w": "goods", "vi": "hàng hóa"}], "tw": "motorway", "ipa": "/ˈməʊtəweɪ/"}, {"type": "mc", "ctx": "Satnav problem", "s": "Satnav told us to turn left into a narrow side road, but it was blocked by a delivery van. We had to reverse slowly back onto the main street. What does \"side road\" mean?", "o": ["đường nhánh nhỏ", "bãi đỗ xe lớn", "ga tàu điện"], "a": "đường nhánh nhỏ", "vi": "Thiết bị định vị bảo chúng tôi rẽ trái vào một con đường nhỏ hẹp nhưng bị xe giao hàng chặn. Chúng tôi phải lùi từ từ ra phố chính.", "why": "side road = đường nhỏ nhánh ra từ đường chính.", "noblank": true, "say": "Satnav told us to turn left into a narrow side road, but it was blocked by a delivery van. We had to reverse slowly back onto the main street.", "new": [{"w": "satnav", "vi": "thiết bị định vị"}, {"w": "reverse", "vi": "lùi xe"}], "tw": "side road", "ipa": "/ˈsaɪd rəʊd/"}, {"type": "mc", "ctx": "Mountain drive", "s": "We got lost because the satnav stopped working while we were driving in the mountains. Luckily, a farmer pointed us in the right direction. What does \"get lost\" mean?", "o": ["bị trễ", "bị lạc", "bị thương"], "a": "bị lạc", "vi": "Chúng tôi bị lạc vì thiết bị định vị ngừng hoạt động khi đang lái xe trên núi. May mắn có một nông dân chỉ cho chúng tôi đúng hướng.", "why": "get lost = bị lạc đường (cũng có nghĩa bóng 'biến đi' – thô lỗ).", "noblank": true, "say": "We got lost because the satnav stopped working while we were driving in the mountains. Luckily, a farmer pointed us in the right direction.", "new": [{"w": "pointed", "vi": "chỉ"}, {"w": "direction", "vi": "hướng đi"}], "tw": "get lost", "ipa": "/ˌɡet ˈlɒst/"}, {"type": "mc", "ctx": "Urgent meeting", "s": "I'm on my way to the clinic, so please start the discussion without me. I should be there in fifteen minutes unless the traffic gets worse. What does \"on my way to\" mean?", "o": ["đang rời khỏi", "đã tới nơi", "trên đường tới"], "a": "trên đường tới", "vi": "Tôi đang trên đường tới phòng khám nên cứ bắt đầu thảo luận không có tôi. Tôi sẽ tới trong mười lăm phút trừ khi giao thông tệ hơn.", "why": "on my way to + nơi chốn = trên đường tới đó (my đổi theo chủ ngữ).", "noblank": true, "say": "I'm on my way to the clinic, so please start the discussion without me. I should be there in fifteen minutes unless the traffic gets worse.", "new": [{"w": "discussion", "vi": "cuộc thảo luận"}, {"w": "unless", "vi": "trừ khi"}], "tw": "on my way to", "ipa": "/ɒn maɪ weɪ tə/"}, {"type": "mc", "ctx": "Flight route", "s": "Our flight to Seoul goes via Bangkok, which means we have a two-hour stop in between. Some travellers like it because they can stretch their legs. What does \"go via\" mean?", "o": ["đi qua (nơi nào)", "đi ra khỏi", "đi cùng (ai)"], "a": "đi qua (nơi nào)", "vi": "Chuyến bay của chúng tôi tới Seoul đi qua Bangkok, nghĩa là có hai giờ dừng ở giữa. Một số du khách thích vì có thể duỗi chân.", "why": "go via + nơi chốn = đi qua nơi đó trên đường tới nơi khác.", "noblank": true, "say": "Our flight to Seoul goes via Bangkok, which means we have a two-hour stop in between. Some travellers like it because they can stretch their legs.", "new": [{"w": "stop", "vi": "điểm dừng"}, {"w": "stretch", "vi": "duỗi"}], "tw": "go via", "ipa": "/ˈvaɪə/"}, {"type": "mc", "ctx": "Hotel search", "s": "Go straight for about two hundred metres and ignore the first turning, which is only a private road. The hotel is at the end of the next one. What does \"turning\" mean?", "o": ["đèn giao thông", "ngã rẽ", "biển quảng cáo"], "a": "ngã rẽ", "vi": "Đi thẳng khoảng hai trăm mét và bỏ qua ngã rẽ đầu tiên vì đó chỉ là đường riêng. Khách sạn nằm ở cuối ngã rẽ tiếp theo.", "why"
