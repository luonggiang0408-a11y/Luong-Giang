:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}

.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}

"Thợ xây khuyên dùng gạch men ốp tường quanh vòi sen vì chúng chịu nước và không bị mốc nhanh như sơn.", "why": "wall tiles = gạch ốp tường (khác floor tiles = gạch lát sàn).", "new": [{"w": "ceramic", "vi": "gốm sứ"}, {"w": "mouldy", "vi": "bị mốc"}], "tw": "wall tiles", "ipa": "/taɪl/"}, {"type": "mc", "ctx": "Doctor's advice", "s": "The doctor advised her to buy ___ rather than a very soft one, which would let her body sink down and strain her spine.", "o": ["a firm armchair", "a fresh armchair", "a fair armchair"], "a": "a firm armchair", "vi": "Bác sĩ khuyên cô mua một chiếc ghế bành chắc thay vì loại rất mềm, vì loại đó làm cơ thể lún xuống và căng cột sống.", "why": "firm = chắc, cứng vừa phải (không lún); trái nghĩa với soft.", "new": [{"w": "sink down", "vi": "lún xuống"}, {"w": "strain", "vi": "làm căng"}, {"w": "spine", "vi": "cột sống"}], "tw": "a firm armchair"}, {"type": "mc", "ctx": "Cold bedroom", "s": "To make the cold tiled bedroom feel warmer, she placed ___ beside her bed, where her bare feet touch first every morning.", "o": ["a rug on the floor", "a lamp on the ceiling", "a poster on the door"], "a": "a rug on the floor", "vi": "Để căn phòng lát gạch lạnh ấm hơn, cô đặt một tấm thảm trên sàn cạnh giường, nơi đôi chân trần chạm đất đầu tiên mỗi sáng.", "why": "a rug on the floor = tấm thảm nhỏ đặt trên sàn nhà.", "new": [{"w": "bare feet", "vi": "chân trần"}], "tw": "a rug on the floor"}, {"type": "mc", "ctx": "Room comparison", "s": "Unlike the kitchen with its hard tiles, this bedroom is ___, so footsteps sound softer and the floor never feels cold.", "o": ["a carpeted room", "a tiled room", "a painted room"], "a": "a carpeted room", "vi": "Không như nhà bếp với gạch cứng, phòng ngủ này được trải thảm nên tiếng bước chân êm hơn và sàn không bao giờ lạnh.", "why": "carpeted = trải thảm kín sàn; carpeted room khác với phòng lát gạch hoặc sàn gỗ.", "new": [{"w": "footsteps", "vi": "tiếng bước chân"}], "tw": "a carpeted room"}, {"type": "mc", "ctx": "Clinic", "s": "After the doctor saw that his skin and eyes had turned yellow, he ordered blood tests to check whether the patient had ___ affecting the liver.", "o": ["hepatitis", "diabetes", "asthma"], "a": "hepatitis", "vi": "Sau khi bác sĩ thấy da và mắt ông ngả vàng, ông yêu cầu xét nghiệm máu để kiểm tra bệnh nhân có bị viêm gan hay không.", "why": "hepatitis = viêm gan; hepat- liên quan đến gan (liver).", "new": [{"w": "ordered", "vi": "chỉ định"}, {"w": "liver", "vi": "gan"}], "tw": "hepatitis", "ipa": "/ˌhep.əˈtaɪ.t̬əs/"}, {"type": "mc", "ctx": "Food allergy", "s": "Because she is allergic to shellfish, Hoa avoided the soup after she noticed a pink ___ floating among the noodles.", "o": ["prawn", "mushroom", "carrot"], "a": "prawn", "vi": "Vì dị ứng hải sản có vỏ, Hoa tránh món súp sau khi thấy một con tôm màu hồng nổi giữa đám mì.", "why": "prawn = tôm (Anh-Anh); người Mỹ thường nói shrimp.", "new": [{"w": "allergic", "vi": "dị ứng"}, {"w": "shellfish", "vi": "hải sản có vỏ"}], "tw": "prawn", "ipa": "/prɔːn/"}, {"type": "mc", "ctx": "Coastal farm", "s": "Fishermen collect the ___ from ropes in the bay, and the shells are dark blue, almost black, with a soft orange body inside.", "o": ["mussels", "squid", "lobster"], "a": "mussels", "vi": "Ngư dân thu hoạch trai từ những sợi dây trong vịnh, vỏ màu xanh đậm gần như đen, bên trong có phần thịt cam mềm.", "why": "mussel = con trai/vẹm biển; vỏ thường xanh đen, hay hấp với rượu vang và tỏi.", "new": [{"w": "ropes", "vi": "dây thừng"}, {"w": "bay", "vi": "vịnh"}], "tw": "mussel", "ipa": "/ˈmʌs.əl/"}, {"type": "mc", "ctx": "Fish market", "s": "The diver brought up a round ___ with a fan-shaped shell, and the market sold its soft white muscle at a high price.", "o": ["scallop", "turtle", "seaweed"], "a": "scallop", "vi": "Thợ lặn mang lên một con sò điệp tròn có vỏ hình quạt, và chợ bán phần thịt trắng mềm của nó với giá cao.", "why": "scallop = sò điệp, vỏ hình quạt, phần thịt trắng mềm được dùng làm món cao cấp.", "new": [{"w": "diver", "vi": "thợ lặn"}, {"w": "muscle", "vi": "phần cơ (thịt sò)"}], "tw": "scallop", "ipa": "/ˈskæləp/"}, {"type": "mc", "ctx": "Crowded classroom", "s": "Because the hall was crowded, the teacher told the students to take one paper each and ___ until the last student at the back received one.", "o": ["pass it down the line", "throw it away", "put it back"], "a": "pass it down the line", "vi": "Vì hội trường đông, thầy bảo học sinh lấy mỗi người một tờ rồi chuyền xuống hàng cho đến khi bạn cuối ở phía sau nhận được.", "why": "pass sth down the line = chuyền thứ gì từ người này sang người kế tiếp trong hàng.", "new": [{"w": "crowded", "vi": "đông đúc"}], "tw": "pass it down the line", "ipa": "/pɑːs daʊn ðə laɪn/"}, {"type": "mc", "ctx": "Old town", "s": "The old town is charming, but at weekends there is ___, which is why many residents ask visitors to take the bus instead.", "o": ["nowhere to park", "nothing to eat", "nobody to ask"], "a": "nowhere to park", "vi": "Khu phố cổ rất duyên dáng nhưng cuối tuần không có chỗ đậu xe, đó là lý do nhiều cư dân đề nghị du khách đi xe buýt.", "why": "there is nowhere to park = không có chỗ đậu xe; be nowhere to + V = không có nơi nào để làm gì.", "new": [{"w": "charming", "vi": "duyên dáng"}, {"w": "residents", "vi": "cư dân"}], "tw": "nowhere to park", "ipa": "/ˈnəʊweə tə pɑːk/"}, {"type": "mc", "ctx": "Friends", "s": "Although Nam can't sing or dance, he is ___ spicy noodle dishes, and his friends often ask him to make dinner.", "o": ["good at cooking", "afraid of cooking", "tired of cooking"], "a": "good at cooking", "vi": "Dù Nam không biết hát hay nhảy, anh nấu các món mì cay rất giỏi nên bạn bè hay nhờ anh nấu bữa tối.", "why": "be good at + V-ing/N = giỏi việc gì; không dùng good in/for trong nghĩa này.", "new": [{"w": "spicy", "vi": "cay"}], "tw": "be good at cooking", "ipa": "/bi ɡʊd æt ˈkʊkɪŋ/"}, {"type": "mc", "ctx": "Food production", "s": "Bread, pasta and many kinds of noodles are made from flour that comes from ___, a crop that grows best in cool, dry climates.", "o": ["wheat", "rice", "bananas"], "a": "wheat", "vi": "Bánh mì, mì ống và nhiều loại mì được làm từ bột lấy từ lúa mì, loại cây trồng phát triển tốt nhất ở khí hậu mát và khô.", "why": "wheat = lúa mì, nguyên liệu chính làm bột mì, bánh mì, mì ống.", "new": [{"w": "crop", "vi": "cây trồng"}, {"w": "climates", "vi": "khí hậu"}], "tw": "wheat", "ipa": "/wiːt/"}, {"type": "mc", "ctx": "Scotland", "s": "Scottish farmers grow ___ in cold, windy fields, and the grain is later used for whisky, soup and animal feed.", "o": ["barley", "bananas", "coconuts"], "a": "barley", "vi": "Nông dân Scotland trồng lúa mạch trên những cánh đồng lạnh và nhiều gió, và hạt sau đó dùng cho whisky, súp và thức ăn gia súc.", "why": "barley = lúa mạch, dùng nấu bia, whisky, súp và làm thức ăn gia súc.", "new": [{"w": "feed", "vi": "thức ăn chăn nuôi"}], "tw": "barley", "ipa": "/ˈbɑː.li/"}, {"type": "mc", "ctx": "Beach café", "s": "The beach café stays open ___, so tourists can enjoy a drink while the sky turns orange and then slowly dark.", "o": ["until sunset", "during sunrise", "since sunset"], "a": "until sunset", "vi": "Quán cà phê bãi biển mở cửa đến lúc mặt trời lặn nên du khách có thể thưởng thức đồ uống khi bầu trời chuyển cam rồi tối dần.", "why": "until sunset = cho đến lúc mặt trời lặn (till là dạng nói thân mật).", "new": [{"w": "slowly", "vi": "dần dần"}], "tw": "until sunset", "ipa": "/ənˈtɪl ˈsʌn.set/"}, {"type": "mc", "ctx": "Job interview", "s": "___ English, she speaks Japanese and Korean, which helps her get jobs with international companies.", "o": ["Apart from", "Owing to", "In front of"], "a": "Apart from", "vi": "Ngoài tiếng Anh, cô còn nói tiếng Nhật và tiếng Hàn, giúp cô xin được việc ở các công ty quốc tế.", "why": "apart from + N/V-ing = ngoài ... ra (thêm vào) hoặc ngoại trừ; gần nghĩa besides.", "new": [{"w": "international", "vi": "quốc tế"}], "tw": "apart from", "ipa": "/əˈpɑːt frəm/"}, {"type": "mc", "ctx": "Marketing", "s": "A clever advertising campaign on social media helped the bakery ___ by nearly thirty percent within two months.", "o": ["boost sales", "cut costs", "lose customers"], "a": "boost sales", "vi": "Một chiến dịch quảng cáo khéo léo trên mạng xã hội giúp tiệm bánh thúc đẩy doanh số gần ba mươi phần trăm trong hai tháng.", "why": "boost sales = thúc đẩy, làm tăng doanh số; boost = đẩy mạnh, nâng lên.", "new": [{"w": "campaign", "vi": "chiến dịch"}], "tw": "boost sales"}, {"type": "mc", "ctx": "Tourism", "s": "Hotels in tourist cities often raise their room rates in July, because they need to ___ during the short period when demand is highest.", "o": ["increase revenue", "reduce waste", "lower prices"], "a": "increase revenue", "vi": "Khách sạn ở các thành phố du lịch thường tăng giá phòng vào tháng Bảy vì cần tăng doanh thu trong khoảng thời gian ngắn khi nhu cầu cao nhất.", "why": "increase revenue = tăng doanh thu (tổng tiền thu vào), khác với profit = lợi nhuận.", "new": [{"w": "rates", "vi": "mức giá"}, {"w": "demand", "vi": "nhu cầu"}], "tw": "increase revenue", "ipa": "/ˈrevənuː/"}, {"type": "mc", "ctx": "Road safety", "s": "The council plans to build a safer ___ beside the busy road, since several children have almost been hit while walking to school.", "o": ["footpath", "highway", "runway"], "a": "footpath", "vi": "Hội đồng địa phương dự định xây một lối đi bộ an toàn hơn cạnh con đường đông xe vì vài đứa trẻ suýt bị đụng khi đi học.", "why": "footpath = lối đi dành cho người đi bộ (trong làng, ven sông, qua cánh đồng).", "new": [{"w": "council", "vi": "hội đồng địa phương"}, {"w": "almost been hit", "vi": "suýt bị đụng"}], "tw": "footpath", "ipa": "/ˈfʊt.pɑːθ/"}, {"type": "mc", "ctx": "Family road trip", "s": "Although the ___ took nearly ten hours, with two stops for food, the children were happy because they played games all the way.", "o": ["journey", "destination", "souvenir"], "a": "journey", "vi": "Dù hành trình mất gần mười giờ với hai lần dừng ăn, bọn trẻ vẫn vui vì chơi trò chơi suốt chặng đường.", "why": "journey = hành trình, chuyến đi (thường dài); nhấn quãng đường hơn là điểm đến.", "new": [{"w": "all the way", "vi": "suốt chặng đường"}], "tw": "journey", "ipa": "/ˈdʒɜː.ni/"}, {"type": "mc", "ctx": "Airport advice", "s": "You should check in at least two hours before your ___, since airport security can take much longer during holidays.", "o": ["flight", "lecture", "wedding"], "a": "flight", "vi": "Bạn nên làm thủ tục ít nhất hai giờ trước chuyến bay vì an ninh sân bay có thể lâu hơn nhiều vào dịp lễ.", "why": "flight = chuyến bay; catch/miss a flight, a flight is delayed/cancelled.", "new": [{"w": "check in", "vi": "làm thủ tục"}, {"w": "security", "vi": "kiểm tra an ninh"}], "tw": "flight", "ipa": "/flaɪt/"}, {"type": "mc", "ctx": "Night street", "s": "We stood at the stop for ages, and then, just as we were about to give up, a taxi finally ___.", "o": ["came along", "took off", "set out"], "a": "came along", "vi": "Chúng tôi đứng ở trạm rất lâu, rồi đúng lúc sắp bỏ cuộc thì cuối cùng một chiếc taxi xuất hiện.", "why": "come along = xuất hiện, đi tới (đặc biệt là xe cộ hoặc cơ hội); còn nghĩa 'đi cùng'.", "new": [{"w": "for ages", "vi": "rất lâu"}, {"w": "give up", "vi": "bỏ cuộc"}], "tw": "come along", "ipa": "/kʌm əˈlɒŋ/"}, {"type": "mc", "ctx": "Metro upgrade", "s": "Thanks to the new metro service, trains ___ during the morning peak, which has noticeably reduced waiting times.", "o": ["run every ten minutes", "run a ten-minute race", "run out of time"], "a": "run every ten minutes", "vi": "Nhờ tuyến metro mới, tàu chạy mỗi mười phút vào giờ cao điểm sáng, giúp thời gian chờ giảm rõ rệt.", "why": "run every ten minutes = (xe, tàu) chạy mỗi 10 phút một chuyến; run = hoạt động theo lịch.", "new": [{"w": "peak", "vi": "giờ cao điểm"}, {"w": "noticeably", "vi": "một cách rõ rệt"}], "tw": "run every ten minutes", "ipa": "/rʌn ˈev.ri ten ˈmɪn.ɪts/"}, {"type": "mc", "ctx": "Day trip", "s": "For a day trip to the coast, travellers who plan to come back the same afternoon should buy ___, rather than paying twice.", "o": ["a return ticket", "a season ticket", "a boarding pass"], "a": "a return ticket", "vi": "Cho chuyến đi trong ngày ra biển, du khách định quay về chiều hôm đó nên mua vé khứ hồi thay vì trả hai lần.", "why": "a return ticket = vé khứ hồi (Anh-Anh); Anh-Mỹ: round-trip ticket; trái nghĩa single ticket.", "new": [{"w": "day trip", "vi": "chuyến đi trong ngày"}, {"w": "coast", "vi": "bờ biển"}], "tw": "a return ticket", "ipa": "/ə rɪˈtɜːn ˌtɪk.ɪt/"}, {"type": "mc", "ctx": "Football fans", "s": "Fans who attend every home match usually buy ___ before the football season starts, because it works out cheaper than paying for each game.", "o": ["a season ticket", "a lottery ticket", "a speeding ticket"], "a": "a season ticket", "vi": "Cổ động viên đi mọi trận sân nhà thường mua vé cả mùa trước khi mùa bóng bắt đầu vì tính ra rẻ hơn trả từng trận.", "why": "a season ticket = vé dùng nhiều lần trong một khoảng dài (tháng, mùa giải); rẻ hơn mua lẻ.", "new": [{"w": "home match", "vi": "trận sân nhà"}, {"w": "works out cheaper", "vi": "tính ra rẻ hơn"}], "tw": "a season ticket", "ipa": "/ə ˈsiː.zən ˌtɪk.ɪt/"}, {"type": "mc", "ctx": "Apartment feedback", "s": "The flat is wonderful, with great light and a lovely view; ___ the rent keeps going up every year.", "o": ["my only real complaint is that", "my greatest achievement is that", "my strongest recommendation is that"], "a": "my only real complaint is that", "vi": "Căn hộ tuyệt vời, nhiều ánh sáng và view đẹp; điều duy nhất tôi phàn nàn là tiền thuê cứ tăng mỗi năm.", "why": "My only real complaint is that + mệnh đề = cách nêu điều chê duy nhất sau khi khen những điều khác.", "new": [{"w": "keeps going up", "vi": "cứ tăng mãi"}], "tw": "my only real complaint is that", "ipa": "/maɪ ˈəʊn.li rɪəl kəmˈpleɪnt ɪz ðæt/"}, {"type": "mc", "ctx": "Weekend bus", "s": "At the weekend I often have to ___ the next bus, because the service is much less frequent than on weekdays.", "o": ["wait half an hour for", "wait half an hour to", "wait half an hour at"], "a": "wait half an hour for", "vi": "Cuối tuần tôi thường phải đợi nửa giờ cho chuyến buýt tiếp theo vì tần suất thưa hơn nhiều so với ngày thường.", "why": "wait + khoảng thời gian + for + danh từ: wait half an hour for the next bus.", "new": [{"w": "frequent", "vi": "thường xuyên, dày chuyến"}], "tw": "wait half an hour for", "ipa": "/weɪt hɑːf ən ˈaʊər fɔːr/"}, {"type": "mc", "ctx": "Popular restaurant", "s": "Customers often ___ get a table at the popular noodle shop, but most agree that the taste is worth it.", "o": ["wait for an hour to", "wait an hour for", "wait an hour in"], "a": "wait for an hour to", "vi": "Khách thường đợi cả giờ mới có bàn ở tiệm mì nổi tiếng, nhưng đa số đồng ý hương vị xứng đáng.", "why": "wait for + khoảng thời gian + to V: đợi bao lâu để làm gì (to see the doctor).", "new": [{"w": "worth it", "vi": "đáng giá"}], "tw": "wait for twenty minutes to", "ipa": "/weɪt fɔːr/"}, {"type": "mc", "ctx": "Station safety", "s": "Passengers must stay behind the yellow line on the ___ until the train has stopped completely, as it is dangerous to stand close to the edge.", "o": ["platform", "pavement", "balcony"], "a": "platform", "vi": "Hành khách phải đứng sau vạch vàng trên sân ga đến khi tàu dừng hẳn vì đứng gần mép rất nguy hiểm.", "why": "platform = sân ga; nói platform 3 (số hiệu sân ga).", "new": [{"w": "edge", "vi": "mép"}, {"w": "completely", "vi": "hoàn toàn"}], "tw": "platform", "ipa": "/ˈplæt.fɔːm/"}, {"type": "mc", "ctx": "Health care", "s": "The clinic is ___ my office, so I can walk there in two minutes during lunch.", "o": ["just round the corner from", "a long way from", "in the middle of"], "a": "just round the corner from", "vi": "Phòng khám ở ngay gần văn phòng tôi nên tôi đi bộ đến đó hai phút trong giờ nghỉ trưa.", "why": "be (just) round the corner from + nơi = ở rất gần nơi nào; cũng nói around the corner.", "new": [{"w": "clinic", "vi": "phòng khám"}], "tw": "just round the corner from", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Shopping", "s": "Black Friday is ___, which means shops are already advertising huge discounts and shoppers are making lists of what to buy.", "o": ["just round the corner", "long gone", "out of date"], "a": "just round the corner", "vi": "Black Friday sắp đến, nghĩa là các cửa hàng đã quảng cáo giảm giá lớn và người mua đang lập danh sách đồ cần mua.", "why": "(just) round the corner (thời gian) = sắp đến rất gần, như exams/Christmas/Tet is round the corner.", "new": [{"w": "advertising", "vi": "quảng cáo"}, {"w": "huge", "vi": "khổng lồ"}], "tw": "just round the corner", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Running out of milk", "s": "Don't worry about running out of milk; ___ that opens at six, so you can buy some before work.", "o": ["there's a shop round the corner", "there's a shop round the clock", "there's a shop round the world"], "a": "there's a shop round the corner", "vi": "Đừng lo hết sữa; có một cửa hàng ngay gần đây mở lúc sáu giờ nên bạn mua được trước giờ làm.", "why": "There's / There are + danh từ + round the corner = có ... ở ngay gần đây.", "new": [{"w": "running out of", "vi": "hết"}], "tw": "there's a shop round the corner", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "British manners", "s": "In the UK, it is considered rude to jump the queue, so everyone patiently ___ even when the line is long.", "o": ["waits in a queue", "drives in a circle", "sleeps in a tent"], "a": "waits in a queue", "vi": "Ở Anh, chen hàng bị coi là thất lễ nên ai cũng kiên nhẫn xếp hàng chờ dù hàng dài.", "why": "wait in a queue = xếp hàng chờ (Anh-Anh); Anh-Mỹ: wait in line; jump the queue = chen hàng.", "new": [{"w": "patiently", "vi": "kiên nhẫn"}, {"w": "rude", "vi": "thô lỗ"}], "tw": "wait in a queue", "ipa": "/weɪt ɪn ə kjuː/"}, {"type": "mc", "ctx": "Food prices", "s": "Economists warn that if the price of rice continues to ___ this year, poorer families will find it harder to afford healthy meals.", "o": ["go up", "go out", "go off"], "a": "go up", "vi": "Các nhà kinh tế cảnh báo nếu giá gạo tiếp tục tăng trong năm nay, các gia đình nghèo sẽ khó có đủ tiền cho bữa ăn lành mạnh.", "why": "go up = tăng lên (giá, chi phí, số lượng); trái nghĩa go down.", "new": [{"w": "economists", "vi": "nhà kinh tế"}, {"w": "afford", "vi": "đủ khả năng chi trả"}], "tw": "go up", "ipa": "/ɡəʊ ʌp/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Apartment", "s": "Our new apartment has tiled floors, which look modern but feel cold. We put a rug in the lounge, so the children can sit comfortably when they play. What does \"rug\" mean?", "o": ["thảm nhỏ, thường không phủ toàn bộ sàn", "tấm đệm trải giường", "rèm cửa dày"], "a": "thảm nhỏ, thường không phủ toàn bộ sàn", "vi": "Căn hộ mới của chúng tôi lát gạch, trông hiện đại nhưng lạnh. Chúng tôi đặt một tấm thảm nhỏ trong phòng khách để bọn trẻ ngồi chơi thoải mái.", "why": "rug = tấm thảm nhỏ đặt trên sàn; khác với carpet là thảm trải kín cả phòng.", "noblank": true, "say": "Our new apartment has tiled floors, which look modern but feel cold. We put a rug in the lounge, so the children can sit comfortably when they play.", "new": [{"w": "tiled", "vi": "lát gạch"}, {"w": "lounge", "vi": "phòng khách"}], "tw": "rug", "ipa": "/rʌɡ/"}, {"type": "mc", "ctx": "Family home", "s": "Every evening my grandmother closes the curtains before turning on the lamp. She says it keeps the house warm and stops the neighbours from looking in. What does \"curtain\" mean?", "o": ["rèm vải", "tấm thảm lau chân", "tấm chăn mỏng"], "a": "rèm vải", "vi": "Mỗi tối bà tôi kéo rèm trước khi bật đèn. Bà nói như vậy giữ nhà ấm và ngăn hàng xóm nhìn vào.", "why": "curtain = rèm vải che cửa sổ; thường nói draw/close/open the curtains.", "noblank": true, "say": "Every evening my grandmother closes the curtains before turning on the lamp. She says it keeps the house warm and stops the neighbours from looking in.", "new": [{"w": "lamp", "vi": "đèn bàn"}, {"w": "looking in", "vi": "nhìn vào trong"}], "tw": "curtain", "ipa": "/ˈkɝː.tən/"}, {"type": "mc", "ctx": "House hunting", "s": "We chose this house because of its spacious living room, where the whole family can relax together. Besides, there is enough space for a large sofa and a dining table. What does \"a spacious living room\" mean?", "o": ["một phòng khách rộng rãi", "một phòng khách tối và ẩm", "một phòng ăn nhỏ gọn"], "a": "một phòng khách rộng rãi", "vi": "Chúng tôi chọn ngôi nhà này vì phòng khách rộng rãi, nơi cả nhà thư giãn cùng nhau. Ngoài ra còn đủ chỗ cho một bộ sofa lớn và bàn ăn.", "why": "spacious = rộng rãi, nhiều không gian (trái nghĩa: cramped = chật chội).", "noblank": true, "say": "We chose this house because of its spacious living room, where the whole family can relax together. Besides, there is enough space for a large sofa and a dining table.", "new": [{"w": "dining table", "vi": "bàn ăn"}, {"w": "besides", "vi": "ngoài ra"}], "tw": "a spacious living room"}, {"type": "mc", "ctx": "City flat", "s": "Linh's flat is small, but she kept a spare room for guests instead of renting it out. Although it earns no money, her friends from abroad can stay comfortably. What does \"a spare room for guests\" mean?", "o": ["phòng dự phòng dành cho khách", "phòng cho thuê dài hạn", "phòng làm việc riêng"], "a": "phòng dự phòng dành cho khách", "vi": "Căn hộ của Linh nhỏ nhưng cô giữ một phòng dành cho khách thay vì cho thuê. Dù không kiếm ra tiền, bạn bè từ nước ngoài đến vẫn ở thoải mái.", "why": "spare room = phòng dư, không dùng thường xuyên, thường để dành cho khách ở lại.", "noblank": true, "say": "Linh's flat is small, but she kept a spare room for guests instead of renting it out. Although it earns no money, her friends from abroad can stay comfortably.", "new": [{"w": "renting out", "vi": "cho thuê"}, {"w": "abroad", "vi": "ở nước ngoài"}], "tw": "a spare room for guests", "ipa": "/sper/"}, {"type": "mc", "ctx": "Renovation", "s": "After the renovation, we added a small utility room behind the kitchen. It holds the washing machine, a sink and some shelves, which keeps the mess out of sight. What does \"a small utility room\" mean?", "o": ["một phòng tiện ích/đa dụng nhỏ", "một phòng ngủ nhỏ cho khách", "một phòng tắm có bồn"], "a": "một phòng tiện ích/đa dụng nhỏ", "vi": "Sau khi cải tạo, chúng tôi thêm một phòng tiện ích nhỏ sau bếp. Nó chứa máy giặt, bồn rửa và vài kệ, giúp giấu sự bừa bộn đi.", "why": "utility room = phòng nhỏ để máy giặt, đồ giặt và dụng cụ dọn dẹp, thường cạnh bếp.", "noblank": true, "say": "After the renovation, we added a small utility room behind the kitchen. It holds the washing machine, a sink and some shelves, which keeps the mess out of sight.", "new": [{"w": "renovation", "vi": "việc cải tạo"}, {"w": "mess", "vi": "sự bừa bộn"}], "tw": "a small utility room", "ipa": "/juːˈtɪl.ə.t̬i/"}, {"type": "mc", "ctx": "Childhood", "s": "When I was ten, I finally got to have my own room. Before that, I shared with my brother, who stayed up late reading, so I rarely slept well. What does \"have your own room\" mean?", "o": ["có phòng riêng của mình", "ở chung phòng với anh em", "thuê phòng ở xa nhà"], "a": "có phòng riêng của mình", "vi": "Năm mười tuổi, cuối cùng tôi có phòng riêng. Trước đó tôi ở chung với anh trai, người hay thức khuya đọc sách nên tôi hiếm khi ngủ ngon.", "why": "have your own room = có phòng riêng; đối lập với share a room (ở chung phòng).", "noblank": true, "say": "When I was ten, I finally got to have my own room. Before that, I shared with my brother, who stayed up late reading, so I rarely slept well.", "new": [{"w": "stayed up late", "vi": "thức khuya"}, {"w": "rarely", "vi": "hiếm khi"}], "tw": "have your own room"}, {"type": "mc", "ctx": "Kitchen habits", "s": "Whenever guests leave, Dad starts to load the dishwasher straight away. He insists that the plates should face the centre, because that makes them cleaner. What does \"load the dishwasher\" mean?", "o": ["xếp bát đĩa vào máy rửa bát", "lấy bát đĩa sạch ra khỏi máy", "mua một chiếc máy rửa bát mới"], "a": "xếp bát đĩa vào máy rửa bát", "vi": "Mỗi khi khách về, bố bắt đầu xếp bát vào máy rửa bát ngay. Bố khăng khăng đĩa phải hướng vào giữa vì như vậy sạch hơn.", "why": "load the dishwasher = xếp bát đĩa vào máy rửa bát (lấy ra là unload/empty).", "noblank": true, "say": "Whenever guests leave, Dad starts to load the dishwasher straight away. He insists that the plates should face the centre, because that makes them cleaner.", "new": [{"w": "insists", "vi": "khăng khăng"}, {"w": "face", "vi": "hướng về"}], "tw": "load the dishwasher"}, {"type": "mc", "ctx": "Winter mornings", "s": "On cold mornings, I boil the kettle before I do anything else. The steam fills the kitchen, and a cup of tea helps me wake up properly. What does \"boil the kettle\" mean?", "o": ["đun ấm nước", "rửa ấm trà", "mua ấm điện mới"], "a": "đun ấm nước", "vi": "Vào những buổi sáng lạnh, tôi đun nước trước khi làm bất cứ việc gì. Hơi nước lan khắp bếp và một tách trà giúp tôi tỉnh hẳn.", "why": "boil the kettle = bật ấm điện/đun nước (cách nói thông dụng ở Anh).", "noblank": true, "say": "On cold mornings, I boil the kettle before I do anything else. The steam fills the kitchen, and a cup of tea helps me wake up properly.", "new": [{"w": "steam", "vi": "hơi nước"}, {"w": "properly", "vi": "hẳn hoi"}], "tw": "boil the kettle", "ipa": "/ˈketl/"}, {"type": "mc", "ctx": "Kitchen design", "s": "Our kitchen has blue wall tiles behind the cooker. They protect the wall from oil and steam, although cleaning the gaps between them takes time. What does \"wall tiles\" mean?", "o": ["gạch ốp tường", "giấy dán tường", "sơn chống thấm"], "a": "gạch ốp tường", "vi": "Bếp nhà chúng tôi có gạch ốp tường màu xanh sau bếp nấu. Chúng bảo vệ tường khỏi dầu mỡ và hơi nước, dù lau các khe giữa chúng tốn thời gian.", "why": "wall tiles = gạch ốp tường (khác floor tiles = gạch lát sàn).", "noblank": true, "say": "Our kitchen has blue wall tiles behind the cooker. They protect the wall from oil and steam, although cleaning the gaps between them takes time.", "new": [{"w": "gaps", "vi": "khe hở"}, {"w": "cooker", "vi": "bếp nấu"}], "tw": "wall tiles", "ipa": "/taɪl/"}, {"type": "mc", "ctx": "Elderly care", "s": "Some older people prefer a firm armchair because it is easier to stand up from. A soft one may feel comfortable at first, but it gives little support. What does \"a firm armchair\" mean?", "o": ["một chiếc ghế bành chắc/cứng vừa phải", "một chiếc ghế bành rất mềm và lún", "một chiếc ghế bành có bánh xe"], "a": "một chiếc ghế bành chắc/cứng vừa phải", "vi": "Một số người lớn tuổi thích ghế bành chắc vì dễ đứng dậy hơn. Ghế mềm lúc đầu thoải mái nhưng đỡ lưng rất ít.", "why": "firm = chắc, cứng vừa phải (không lún); trái nghĩa với soft.", "noblank": true, "say": "Some older people prefer a firm armchair because it is easier to stand up from. A soft one may feel comfortable at first, but it gives little support.", "new": [{"w": "stand up from", "vi": "đứng dậy khỏi"}, {"w": "little", "vi": "rất ít"}], "tw": "a firm armchair"}, {"type": "mc", "ctx": "Cosy corner", "s": "There is a rug on the floor in front of the fireplace, which makes the corner very cosy. Our cat sleeps there whenever the room is warm. What does \"a rug on the floor\" mean?", "o": ["một tấm thảm nhỏ trên sàn", "một bức tranh trên tường", "một chiếc đệm trên giường"], "a": "một tấm thảm nhỏ trên sàn", "vi": "Có một tấm thảm trên sàn trước lò sưởi, khiến góc đó rất ấm cúng. Con mèo nhà tôi ngủ ở đó mỗi khi phòng ấm.", "why": "a rug on the floor = tấm thảm nhỏ đặt trên sàn nhà.", "noblank": true, "say": "There is a rug on the floor in front of the fireplace, which makes the corner very cosy. Our cat sleeps there whenever the room is warm.", "new": [{"w": "fireplace", "vi": "lò sưởi"}, {"w": "cosy", "vi": "ấm cúng"}], "tw": "a rug on the floor"}, {"type": "mc", "ctx": "Home office", "s": "We decided against wooden floors in the study. Instead, it is a carpeted room, which reduces noise and keeps heat in during winter. What does \"a carpeted room\" mean?", "o": ["căn phòng trải thảm", "căn phòng lát gỗ", "căn phòng sơn màu sáng"], "a": "căn phòng trải thảm", "vi": "Chúng tôi quyết định không dùng sàn gỗ trong phòng làm việc. Thay vào đó đó là phòng trải thảm, giảm tiếng ồn và giữ nhiệt vào mùa đông.", "why": "carpeted = trải thảm kín sàn; carpeted room khác với phòng lát gạch hoặc sàn gỗ.", "noblank": true, "say": "We decided against wooden floors in the study. Instead, it is a carpeted room, which reduces noise and keeps heat in during winter.", "new": [{"w": "study", "vi": "phòng làm việc"}, {"w": "reduces", "vi": "giảm bớt"}], "tw": "a carpeted room"}, {"type": "mc", "ctx": "Health news", "s": "Hepatitis is often spread through unsafe food or dirty needles. Some people feel tired and lose their appetite, so a blood test is the only reliable way to know. What does \"hepatitis\" mean?", "o": ["viêm gan", "viêm phổi", "viêm họng"], "a": "viêm gan", "vi": "Viêm gan thường lây qua thực phẩm không an toàn hoặc kim tiêm bẩn. Một số người mệt và chán ăn nên xét nghiệm máu là cách đáng tin duy nhất để biết.", "why": "hepatitis = viêm gan; hepat- liên quan đến gan (liver).", "noblank": true, "say": "Hepatitis is often spread through unsafe food or dirty needles. Some people feel tired and lose their appetite, so a blood test is the only reliable way to know.", "new": [{"w": "needles", "vi": "kim tiêm"}, {"w": "appetite", "vi": "cảm giác thèm ăn"}], "tw": "hepatitis", "ipa": "/ˌhep.əˈtaɪ.t̬əs/"}, {"type": "mc", "ctx": "Menu words", "s": "In Britain, people say prawn, while Americans often prefer the word shrimp. Either way, it is a small sea animal that turns pink when cooked. What does \"prawn\" mean?", "o": ["tôm", "cua", "mực"], "a": "tôm", "vi": "Ở Anh người ta nói prawn, còn người Mỹ thường dùng từ shrimp. Dù sao thì đó cũng là loài hải sản nhỏ chuyển màu hồng khi nấu chín.", "why": "prawn = tôm (Anh-Anh); người Mỹ thường nói shrimp.", "noblank": true, "say": "In Britain, people say prawn, while Americans often prefer the word shrimp. Either way, it is a small sea animal that turns pink when cooked.", "new": [{"w": "either way", "vi": "dù thế nào"}, {"w": "turns pink", "vi": "chuyển màu hồng"}], "tw": "prawn", "ipa": "/prɔːn/"}, {"type": "mc", "ctx": "Restaurant", "s": "We ordered a large pot of mussels, which arrived with garlic and herbs. Although the shells were hard to open, the meat inside was soft and sweet. What does \"mussel\" mean?", "o": ["con trai (vẹm)", "con cua", "con mực"], "a": "con trai (vẹm)", "vi": "Chúng tôi gọi một nồi trai lớn, được mang ra với tỏi và rau thơm. Dù vỏ khó mở, phần thịt bên trong mềm và ngọt.", "why": "mussel = con trai/vẹm biển; vỏ thường xanh đen, hay hấp với rượu vang và tỏi.", "noblank": true, "say": "We ordered a large pot of mussels, which arrived with garlic and herbs. Although the shells were hard to open, the meat inside was soft and sweet.", "new": [{"w": "herbs", "vi": "rau thơm"}, {"w": "shells", "vi": "vỏ"}], "tw": "mussel", "ipa": "/ˈmʌs.əl/"}, {"type": "mc", "ctx": "Cooking show", "s": "Scallops are expensive because divers collect many of them by hand. When grilled with butter and garlic, they taste sweet, and the texture is soft. What does \"scallop\" mean?", "o": ["sò điệp", "hàu", "tôm hùm"], "a": "sò điệp", "vi": "Sò điệp đắt vì thợ lặn thu nhặt nhiều con bằng tay. Khi nướng với bơ và tỏi, chúng có vị ngọt và kết cấu mềm.", "why": "scallop = sò điệp, vỏ hình quạt, phần thịt trắng mềm được dùng làm món cao cấp.", "noblank": true, "say": "Scallops are expensive because divers collect many of them by hand. When grilled with butter and garlic, they taste sweet, and the texture is soft.", "new": [{"w": "texture", "vi": "kết cấu"}, {"w": "by hand", "vi": "bằng tay"}], "tw": "scallop", "ipa": "/ˈskæləp/"}, {"type": "mc", "ctx": "Charity work", "s": "Each volunteer took a box of rice from the truck and passed it down the line until the food reached the families waiting at the end of the street. What does \"pass it down the line\" mean?", "o": ["chuyền thứ gì dọc theo hàng người", "giữ thứ gì lại cho riêng mình", "ném thứ gì xuống đất"], "a": "chuyền thứ gì dọc theo hàng người", "vi": "Mỗi tình nguyện viên lấy một hộp gạo từ xe tải và chuyền xuống hàng cho đến khi thức ăn đến tay các gia đình đợi ở cuối đường.", "why": "pass sth down the line = chuyền thứ gì từ người này sang người kế tiếp trong hàng.", "noblank": true, "say": "Each volunteer took a box of rice from the truck and passed it down the line until the food reached the families waiting at the end of the street.", "new": [{"w": "volunteer", "vi": "tình nguyện viên"}, {"w": "truck", "vi": "xe tải"}], "tw": "pass it down the line", "ipa": "/pɑːs daʊn ðə laɪn/"}, {"type": "mc", "ctx": "Shopping mall", "s": "The shopping mall is always crowded on Saturdays. Since there is nowhere to park, drivers circle the streets for twenty minutes, which makes them late for appointments. What does \"be nowhere to park\" mean?", "o": ["không có chỗ đậu xe", "không có nơi để đi dạo", "không có chỗ ngồi chờ"], "a": "không có chỗ đậu xe", "vi": "Trung tâm thương mại luôn đông vào thứ Bảy. Vì không có chỗ đậu xe, tài xế chạy vòng quanh các con phố hai mươi phút, khiến họ trễ hẹn.", "why": "there is nowhere to park = không có chỗ đậu xe; be nowhere to + V = không có nơi nào để làm gì.", "noblank": true, "say": "The shopping mall is always crowded on Saturdays. Since there is nowhere to park, drivers circle the streets for twenty minutes, which makes them late for appointments.", "new": [{"w": "circle", "vi": "chạy vòng quanh"}, {"w": "appointments", "vi": "cuộc hẹn"}], "tw": "nowhere to park", "ipa": "/ˈnəʊweə tə pɑːk/"}, {"type": "mc", "ctx": "Housemates", "s": "Her roommate says Mai is good at cooking, since even simple ingredients turn into restaurant-quality meals under her hands. As a result, they rarely order takeaway. What does \"be good at cooking\" mean?", "o": ["nấu ăn giỏi", "thích ăn ngoài", "không biết nấu"], "a": "nấu ăn giỏi", "vi": "Bạn cùng phòng nói Mai nấu ăn giỏi vì cả nguyên liệu đơn giản cũng thành bữa ăn như nhà hàng khi qua tay cô. Vì thế họ hiếm khi gọi đồ mang về.", "why": "be good at + V-ing/N = giỏi việc gì; không dùng good in/for trong nghĩa này.", "noblank": true, "say": "Her roommate says Mai is good at cooking, since even simple ingredients turn into restaurant-quality meals under her hands. As a result, they rarely order takeaway.", "new": [{"w": "ingredients", "vi": "nguyên liệu"}, {"w": "takeaway", "vi": "đồ ăn mang về"}], "tw": "be good at cooking", "ipa": "/bi ɡʊd æt ˈkʊkɪŋ/"}, {"type": "mc", "ctx": "Agriculture", "s": "Wheat is one of the most important crops in the world. After it is ground into flour, it is used to bake bread, cakes and biscuits. What does \"wheat\" mean?", "o": ["lúa mì", "lúa mạch", "ngô"], "a": "lúa mì", "vi": "Lúa mì là một trong những cây trồng quan trọng nhất thế giới. Sau khi xay thành bột, nó dùng để nướng bánh mì, bánh ngọt và bánh quy.", "why": "wheat = lúa mì, nguyên liệu chính làm bột mì, bánh mì, mì ống.", "noblank": true, "say": "Wheat is one of the most important crops in the world. After it is ground into flour, it is used to bake bread, cakes and biscuits.", "new": [{"w": "ground", "vi": "xay"}, {"w": "bake", "vi": "nướng (bánh)"}], "tw": "wheat", "ipa": "/wiːt/"}, {"type": "mc", "ctx": "Winter cooking", "s": "Barley soup is popular in colder countries. The grain is slightly chewy, and it is also cheap, so many families add it to stews when meat is expensive. What does \"barley\" mean?", "o": ["lúa mạch", "lúa mì", "gạo nếp"], "a": "lúa mạch", "vi": "Súp lúa mạch phổ biến ở ể thu hút"}, {"w": "close early", "vi": "đóng cửa sớm"}], "tw": "apart from", "ipa": "/əˈpɑːt frəm/"}, {"type": "mc", "ctx": "Business news", "s": "The company hired a famous actor for its new advert, expecting to boost sales during the festival season. Last year, a similar strategy worked well. What does \"boost sales\" mean?", "o": ["thúc đẩy doanh số", "giảm giá thành", "kiểm tra hàng tồn"], "a": "thúc đẩy doanh số", "vi": "Công ty thuê một diễn viên nổi tiếng cho quảng cáo mới, mong thúc đẩy doanh số mùa lễ hội. Năm ngoái một chiến lược tương tự đã hiệu quả.", "why": "boost sales = thúc đẩy, làm tăng doanh số; boost = đẩy mạnh, nâng lên.", "noblank": true, "say": "The company hired a famous actor for its new advert, expecting to boost sales during the festival season. Last year, a similar strategy worked well.", "new": [{"w": "advert", "vi": "quảng cáo"}, {"w": "strategy", "vi": "chiến lược"}], "tw": "boost sales"}, {"type": "mc", "ctx": "Technology", "s": "Streaming services have found several ways to increase revenue, such as adding advertisements or charging extra for family accounts. Customers, however, are not always pleased. What does \"increase revenue\" mean?", "o": ["tăng doanh thu", "tăng chi phí", "giảm nhân viên"], "a": "tăng doanh thu", "vi": "Các dịch vụ phát trực tuyến tìm ra nhiều cách tăng doanh thu như thêm quảng cáo hoặc tính thêm phí cho tài khoản gia đình. Tuy nhiên khách hàng không phải lúc nào cũng hài lòng.", "why": "increase revenue = tăng doanh thu (tổng tiền thu vào), khác với profit = lợi nhuận.", "noblank": true, "say": "Streaming services have found several ways to increase revenue, such as adding advertisements or charging extra for family accounts. Customers, however, are not always pleased.", "new": [{"w": "streaming", "vi": "phát trực tuyến"}, {"w": "charging extra", "vi": "tính thêm phí"}], "tw": "increase revenue", "ipa": "/ˈrevənuː/"}, {"type": "mc", "ctx": "Rural life", "s": "The village has several footpaths connecting the farms, and walkers are allowed to use them even when the land belongs to someone else. What does \"footpath\" mean?", "o": ["lối đi bộ", "đường cao tốc", "cầu vượt"], "a": "lối đi bộ", "vi": "Ngôi làng có vài lối đi bộ nối các trang trại, và người đi bộ được phép dùng chúng ngay cả khi đất thuộc về người khác.", "why": "footpath = lối đi dành cho người đi bộ (trong làng, ven sông, qua cánh đồng).", "noblank": true, "say": "The village has several footpaths connecting the farms, and walkers are allowed to use them even when the land belongs to someone else.", "new": [{"w": "belongs to", "vi": "thuộc về"}, {"w": "connecting", "vi": "nối liền"}], "tw": "footpath", "ipa": "/ˈfʊt.pɑːθ/"}, {"type": "mc", "ctx": "Travel blog", "s": "Marco's journey across Asia lasted three months. He travelled mostly by train, and the long hours gave him time to read and write his diary. What does \"journey\" mean?", "o": ["hành trình, chuyến đi dài", "điểm đến cuối cùng", "hành lý xách tay"], "a": "hành trình, chuyến đi dài", "vi": "Hành trình của Marco qua châu Á kéo dài ba tháng. Anh đi chủ yếu bằng tàu hỏa và những giờ dài cho anh thời gian đọc sách và viết nhật ký.", "why": "journey = hành trình, chuyến đi (thường dài); nhấn quãng đường hơn là điểm đến.", "noblank": true, "say": "Marco's journey across Asia lasted three months. He travelled mostly by train, and the long hours gave him time to read and write his diary.", "new": [{"w": "diary", "vi": "nhật ký"}, {"w": "mostly", "vi": "chủ yếu"}], "tw": "journey", "ipa": "/ˈdʒɜː.ni/"}, {"type": "mc", "ctx": "Paris trip", "s": "The flight from Paris landed twenty minutes early, which surprised everyone. However, passengers waited for their luggage for almost an hour. What does \"flight\" mean?", "o": ["chuyến bay", "sân bay", "vé máy bay"], "a": "chuyến bay", "vi": "Chuyến bay từ Paris hạ cánh sớm hai mươi phút, khiến ai cũng ngạc nhiên. Tuy nhiên hành khách chờ hành lý gần một giờ.", "why": "flight = chuyến bay; catch/miss a flight, a flight is delayed/cancelled.", "noblank": true, "say": "The flight from Paris landed twenty minutes early, which surprised everyone. However, passengers waited for their luggage for almost an hour.", "new": [{"w": "luggage", "vi": "hành lý"}, {"w": "landed", "vi": "hạ cánh"}], "tw": "flight", "ipa": "/flaɪt/"}, {"type": "mc", "ctx": "Country road", "s": "I was waiting alone on the empty road when a farmer came along on a tractor and offered me a lift. I was relieved, because the next village was far away. What does \"come along\" mean?", "o": ["xuất hiện, đi tới", "rời đi", "đi chậm lại"], "a": "xuất hiện, đi tới", "vi": "Tôi đang đợi một mình trên con đường vắng thì một bác nông dân đi tới trên máy kéo và cho tôi đi nhờ. Tôi nhẹ nhõm vì làng kế tiếp còn xa.", "why": "come along = xuất hiện, đi tới (đặc biệt là xe cộ hoặc cơ hội); còn nghĩa 'đi cùng'.", "noblank": true, "say": "I was waiting alone on the empty road when a farmer came along on a tractor and offered me a lift. I was relieved, because the next village was far away.", "new": [{"w": "tractor", "vi": "máy kéo"}, {"w": "lift", "vi": "chuyến đi nhờ"}, {"w": "relieved", "vi": "nhẹ nhõm"}], "tw": "come along", "ipa": "/kʌm əˈlɒŋ/"}, {"type": "mc", "ctx": "Airport", "s": "Because the airport shuttle runs every ten minutes, you never have to plan ahead. If you miss one, another will arrive almost immediately. What does \"run every ten minutes\" mean?", "o": ["chạy mỗi 10 phút một chuyến", "chạy trong 10 phút rồi dừng", "chạy nhanh hơn 10 phút"], "a": "chạy mỗi 10 phút một chuyến", "vi": "Vì xe đưa đón sân bay chạy mỗi mười phút, bạn không cần tính trước. Nếu lỡ một chuyến, chuyến khác đến gần như ngay.", "why": "run every ten minutes = (xe, tàu) chạy mỗi 10 phút một chuyến; run = hoạt động theo lịch.", "noblank": true, "say": "Because the airport shuttle runs every ten minutes, you never have to plan ahead. If you miss one, another will arrive almost immediately.", "new": [{"w": "shuttle", "vi": "xe đưa đón"}, {"w": "plan ahead", "vi": "lên kế hoạch trước"}], "tw": "run every ten minutes", "ipa": "/rʌn ˈev.ri ten ˈmɪn.ɪts/"}, {"type": "mc", "ctx": "Train station", "s": "Her friend asked for a return ticket to Cambridge, so she could visit the university and then go back to London in the evening. It cost only slightly more than a single one. What does \"a return ticket\" mean?", "o": ["vé khứ hồi", "vé một chiều", "vé tháng"], "a": "vé khứ hồi", "vi": "Bạn cô mua vé khứ hồi đi Cambridge để thăm trường đại học rồi về London buổi tối. Giá chỉ nhỉnh hơn vé một chiều một chút.", "why": "a return ticket = vé khứ hồi (Anh-Anh); Anh-Mỹ: round-trip ticket; trái nghĩa single ticket.", "noblank": true, "say": "Her friend asked for a return ticket to Cambridge, so she could visit the university and then go back to London in the evening. It cost only slightly more than a single one.", "new": [{"w": "single", "vi": "một chiều"}, {"w": "slightly", "vi": "hơi, một chút"}], "tw": "a return ticket", "ipa": "/ə rɪˈtɜːn ˌtɪk.ɪt/"}, {"type": "mc", "ctx": "Student travel", "s": "Students at the university can apply for a season ticket that covers all buses for a whole term. It is valid every day, so many people find it better value than single fares. What does \"a season ticket\" mean?", "o": ["vé định kỳ", "vé mua một lần", "vé giảm giá trẻ em"], "a": "vé định kỳ", "vi": "Sinh viên đại học có thể đăng ký vé định kỳ dùng cho mọi tuyến xe buýt cả học kỳ. Vé có hiệu lực mỗi ngày nên nhiều người thấy lợi hơn mua vé lẻ.", "why": "a season ticket = vé dùng nhiều lần trong một khoảng dài (tháng, mùa giải); rẻ hơn mua lẻ.", "noblank": true, "say": "Students at the university can apply for a season ticket that covers all buses for a whole term. It is valid every day, so many people find it better value than single fares.", "new": [{"w": "valid", "vi": "có hiệu lực"}, {"w": "fares", "vi": "giá vé"}], "tw": "a season ticket", "ipa": "/ə ˈsiː.zən ˌtɪk.ɪt/"}, {"type": "mc", "ctx": "Online review", "s": "The tour was well organised and the guide was funny. My only real complaint is that the lunch break was too short. What does \"My only real complaint is that...\" mean?", "o": ["Điều duy nhất tôi thực sự phàn nàn là...", "Điều duy nhất tôi thực sự thích là...", "Điều tôi mong đợi nhất là..."], "a": "Điều duy nhất tôi thực sự phàn nàn là...", "vi": "Chuyến tham quan được tổ chức tốt và hướng dẫn viên vui tính. Điều duy nhất tôi thực sự phàn nàn là giờ nghỉ trưa quá ngắn.", "why": "My only real complaint is that + mệnh đề = cách nêu điều chê duy nhất sau khi khen những điều khác.", "noblank": true, "say": "The tour was well organised and the guide was funny. My only real complaint is that the lunch break was too short.", "new": [{"w": "well organised", "vi": "được tổ chức tốt"}, {"w": "guide", "vi": "hướng dẫn viên"}], "tw": "my only real complaint is that", "ipa": "/maɪ ˈəʊn.li rɪəl kəmˈpleɪnt ɪz ðæt/"}, {"type": "mc", "ctx": "Missed train", "s": "Mai missed her train by one minute. Because services are rare on Sundays, she had to wait half an hour for the next one. What does \"wait half an hour for sth\" mean?", "o": ["đợi thứ gì trong nửa tiếng", "đợi trước nửa giờ", "đợi suốt nửa tháng"], "a": "đợi thứ gì trong nửa tiếng", "vi": "Mai lỡ tàu một phút. Vì chủ nhật ít chuyến, cô phải đợi nửa giờ cho chuyến sau.", "why": "wait + khoảng thời gian + for + danh từ: wait half an hour for the next bus.", "noblank": true, "say": "Mai missed her train by one minute. Because services are rare on Sundays, she had to wait half an hour for the next one.", "new": [{"w": "services", "vi": "các chuyến (phương tiện)"}, {"w": "rare", "vi": "hiếm, thưa"}], "tw": "wait half an hour for", "ipa": "/weɪt hɑːf ən ˈaʊər fɔːr/"}, {"type": "mc", "ctx": "Museum entrance", "s": "We have been waiting for twenty minutes to enter the museum. The queue is moving slowly, so the guide suggests we should come earlier next time. What does \"wait for twenty minutes to enter the museum\" mean?", "o": ["đợi hai mươi phút để được vào bảo tàng", "tham quan bảo tàng trong hai mươi phút", "vào bảo tàng miễn phí sau hai mươi phút"], "a": "đợi hai mươi phút để được vào bảo tàng", "vi": "Chúng tôi đã đợi hai mươi phút để vào bảo tàng. Hàng di chuyển chậm nên hướng dẫn viên gợi ý lần sau nên đến sớm hơn.", "why": "wait for + khoảng thời gian + to V: đợi bao lâu để làm gì (to see the doctor).", "noblank": true, "say": "We have been waiting for twenty minutes to enter the museum. The queue is moving slowly, so the guide suggests we should come earlier next time.", "new": [{"w": "moving slowly", "vi": "di chuyển chậm"}, {"w": "suggests", "vi": "gợi ý"}], "tw": "wait for twenty minutes to", "ipa": "/weɪt fɔːr/"}, {"type": "mc", "ctx": "Busy station", "s": "The station has six platforms, and the board shows which train arrives at which one. On busy days, the platform becomes so crowded that it is hard to walk. What does \"platform\" mean?", "o": ["sân ga", "phòng chờ", "quầy bán vé"], "a": "sân ga", "vi": "Nhà ga có sáu sân ga và bảng cho biết tàu nào đến sân nào. Vào ngày đông, sân ga đông đến mức khó đi lại.", "why": "platform = sân ga; nói platform 3 (số hiệu sân ga).", "noblank": true, "say": "The station has six platforms, and the board shows which train arrives at which one. On busy days, the platform becomes so crowded that it is hard to walk.", "new": [{"w": "board", "vi": "bảng thông báo"}, {"w": "arrives", "vi": "đến nơi"}], "tw": "platform", "ipa": "/ˈplæt.fɔːm/"}, {"type": "mc", "ctx": "Student life", "s": "The new library is just round the corner from my school, so students often stop there after class to borrow books or finish their homework. What does \"be just round the corner from\" mean?", "o": ["ở rất gần, ngay gần", "ở rất xa", "đối diện qua đường"], "a": "ở rất gần, ngay gần", "vi": "Thư viện mới ở ngay gần trường tôi nên học sinh thường ghé sau giờ học để mượn sách hoặc làm bài.", "why": "be (just) round the corner from + nơi = ở rất gần nơi nào; cũng nói around the corner.", "noblank": true, "say": "The new library is just round the corner from my school, so students often stop there after class to borrow books or finish their homework.", "new": [{"w": "borrow", "vi": "mượn"}, {"w": "stop there", "vi": "ghé qua đó"}], "tw": "just round the corner from", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Holiday planning", "s": "Summer holidays are just round the corner. The airlines have started to raise prices, so families who book early can save a lot of money. What does \"be just round the corner\" mean?", "o": ["sắp đến", "vừa mới qua", "còn rất xa"], "a": "sắp đến", "vi": "Kỳ nghỉ hè sắp đến. Các hãng bay đã bắt đầu tăng giá nên gia đình đặt sớm có thể tiết kiệm nhiều tiền.", "why": "(just) round the corner (thời gian) = sắp đến rất gần, như exams/Christmas/Tet is round the corner.", "noblank": true, "say": "Summer holidays are just round the corner. The airlines have started to raise prices, so families who book early can save a lot of money.", "new": [{"w": "airlines", "vi": "các hãng hàng không"}, {"w": "book", "vi": "đặt chỗ"}], "tw": "just round the corner", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "Moving in", "s": "When I moved into the neighbourhood, I was relieved to learn that there's a small clinic round the corner. It means I do not need a car to see a doctor. What does \"there's a clinic round the corner\" mean?", "o": ["có một phòng khám ở ngay gần đây", "phòng khám sẽ sớm mở cửa", "phòng khám đã đóng cửa ở góc đường"], "a": "có một phòng khám ở ngay gần đây", "vi": "Khi chuyển đến khu này, tôi nhẹ nhõm khi biết có một phòng khám nhỏ ở ngay gần đây. Nghĩa là tôi không cần xe để đi khám.", "why": "There's / There are + danh từ + round the corner = có ... ở ngay gần đây.", "noblank": true, "say": "When I moved into the neighbourhood, I was relieved to learn that there's a small clinic round the corner. It means I do not need a car to see a doctor.", "new": [{"w": "neighbourhood", "vi": "khu dân cư"}, {"w": "relieved", "vi": "nhẹ nhõm"}], "tw": "there's a shop round the corner", "ipa": "/əˌraʊnd ðə ˈkɔː.nər/"}, {"type": "mc", "ctx": "New bakery", "s": "At the new bakery, customers wait in a queue that reaches the street. The owner says it is a good sign, although the staff look exhausted by noon. What does \"wait in a queue\" mean?", "o": ["xếp hàng chờ", "đặt hàng trước", "chen lên trước"], "a": "xếp hàng chờ", "vi": "Ở tiệm bánh mới, khách xếp hàng dài ra tận đường. Chủ tiệm nói đó là dấu hiệu tốt, dù nhân viên trông kiệt sức vào buổi trưa.", "why": "wait in a queue = xếp hàng chờ (Anh-Anh); Anh-Mỹ: wait in line; jump the queue = chen hàng.", "noblank": true, "say": "At the new bakery, customers wait in a queue that reaches the street. The owner says it is a good sign, although the staff look exhausted by noon.", "new": [{"w": "exhausted", "vi": "kiệt sức"}, {"w": "reaches", "vi": "kéo dài tới"}], "tw": "wait in a queue", "ipa": "/weɪt ɪn ə kjuː/"}, {"type": "mc", "ctx": "Summer travel", "s": "Ticket prices go up every summer, and this year they rose by nearly ten percent. Travel agents say demand is high, so customers should book early. What does \"go up\" mean?", "o": ["tăng lên", "giảm xuống", "giữ nguyên"], "a": "tăng lên", "vi": "Giá vé tăng mỗi mùa hè và năm nay tăng gần mười phần trăm. Đại lý du lịch nói nhu cầu cao nên khách nên đặt sớm.", "why": "go up = tăng lên (giá, chi phí, số lượng); trái nghĩa go down.", "noblank": true, "say": "Ticket prices go up every summer, and this year they rose by nearly ten percent. Travel agents say demand is high, so customers should book early.", "new": [{"w": "travel agents", "vi": "đại lý du lịch"}, {"w": "demand", "vi": "nhu cầu"}], "tw": "go up", "ipa": "/ɡəʊ ʌp/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm Ghi âm, trả lời bằng tiếng Anh 30–60 giây và cố dùng các từ gợi ý; trang sẽ chấm ước tính theo Fluency, Lexical Resource, Grammar, Pronunciation.", "qs": [{"type": "sp", "ctx": "Home and rooms", "s": "Describe the home you live in, or a home you would love to have. Which rooms does it have, and what makes it comfortable?", "vi": "Hãy tả ngôi nhà bạn đang ở hoặc muốn có. Nhà có những phòng nào và điều gì khiến nó thoải mái?", "words": ["a spacious living room", "a spare room for guests", "a small utility room", "have your own room", "a carpeted room", "a rug on the floor", "a firm armchair", "wall tiles", "curtain", "rug"], "why": "Tả từng phòng một, nói vật dụng trong phòng, rồi kết luận vì sao ngôi nhà thoải mái; dùng although/which để nối ý.", "sample": "My dream home has a spacious living room where the whole family can relax. I would put a rug on the floor and a firm armchair next to the window for my grandfather, who has a bad back. Every child would have their own room, and there would be a spare room for guests. Behind the kitchen there would be a small utility room for the washing machine. The bathroom would have white wall tiles, and the bedrooms would be a carpeted room with thick curtains. A soft rug beside the bed would keep my feet warm, which makes the house feel really comfortable."}, {"type": "sp", "ctx": "Housework and cooking", "s": "Who does the housework in your family? Tell me what you usually do after dinner and who is best at cooking.", "vi": "Ai làm việc nhà trong gia đình bạn? Hãy kể bạn thường làm gì sau bữa tối và ai nấu ăn giỏi nhất.", "words": ["load the dishwasher", "boil the kettle", "be good at cooking", "have your own room"], "why": "Kể theo thứ tự: ai nấu, ai dọn, bạn làm gì; thêm lý do bằng because/so that.", "sample": "In my family, my mother is really good at cooking, so she prepares almost every dinner. After the meal, my brother and I share the housework. I usually load the dishwasher while he wipes the table, and my father likes to boil the kettle and make tea for everyone. Although the work is simple, it takes about twenty minutes, so we finish before our favourite programme starts. Since we all help, my mother can rest, and she says that is the best present because she is tired after work."}, {"type": "sp", "ctx": "Seafood and health", "s": "Do you enjoy seafood? Describe a meal you remember and say why food safety matters.", "vi": "Bạn có thích hải sản không? Hãy tả một bữa ăn bạn nhớ và nói vì sao an toàn thực phẩm quan trọng.", "words": ["prawn", "mussel", "scallop", "hepatitis"], "why": "Tả món ăn, hương vị, người đi cùng; sau đó nêu rủi ro bệnh qua thực phẩm bẩn.", "sample": "Last summer I went to a seafood restaurant by the sea with my cousins. We ordered grilled prawns, a pot of mussels and a few scallops with garlic butter, which tasted sweet and fresh. Although it was delicious, my aunt reminded us that food safety matters. If shellfish is not cooked properly, it can carry diseases such as hepatitis, which affects the liver. Because of that, we only eat at clean places, and we always check that the food is hot when it arrives at the table."}, {"type": "sp", "ctx": "Countryside", "s": "Describe a place in the countryside that you have visited or would like to visit. What do people do there?", "vi": "Hãy tả một nơi ở vùng quê bạn đã đến hoặc muốn đến. Người ta làm gì ở đó?", "words": ["wheat", "barley", "until sunset", "footpath"], "why": "Tả cảnh, công việc của nông dân, hoạt động của bạn; thêm cảm xúc ở cuối.", "sample": "I would love to visit a farm in northern England. My friend told me that farmers there grow wheat and barley, and they harvest the crops in summer. They often work until sunset because the weather can change quickly. Visitors can follow a footpath through the fields, which means they can enjoy the views without disturbing anyone. I imagine that the air is fresh and quiet, whereas my city is always noisy. After a long walk, I would sit and watch the golden fields, which would be a perfect way to relax."}, {"type": "sp", "ctx": "Business", "s": "How can a small shop attract more customers? Give some examples from your own experience.", "vi": "Một cửa hàng nhỏ có thể thu hút thêm khách bằng cách nào? Hãy nêu ví dụ từ trải nghiệm của bạn.", "words": ["boost sales", "increase revenue", "go up", "apart from"], "why": "Nêu 2-3 cách (giảm giá, quảng cáo, dịch vụ), mỗi cách kèm kết quả; dùng if/so that.", "sample": "A small shop can boost sales in several ways. Apart from discounts, it can use social media to show new products, which attracts young customers. A friend of mine opened a bakery and offered free samples, so many people came back the next day. As a result, her income started to go up within two months. If the shop wants to increase revenue even more, it can sell gift boxes before holidays. In my opinion, good service is just as important as low prices, because happy customers tell their friends."}, {"type": "sp", "ctx": "City problems", "s": "What problems do people face in busy city centres? Say how they could be solved.", "vi": "Người dân gặp những vấn đề gì ở trung tâm thành phố đông đúc? Cách giải quyết là gì?", "words": ["nowhere to park", "wait in a queue", "go up", "run every ten minutes", "my only real complaint is that"], "why": "Nêu vấn đề (đậu xe, xếp hàng, giá cả), rồi đề xuất giải pháp; dùng although/which means.", "sample": "In my city centre, there is nowhere to park at weekends, so drivers waste a lot of time. People also wait in a queue for buses, and prices keep going up, which makes life difficult. My only real complaint is that the government does not invest enough in public transport. If buses ran every ten minutes, more people would leave their cars at home. As a result, the streets would be less crowded and the air would be cleaner. I also think the city should build more cycle lanes."}, {"type": "sp", "ctx": "Public transport", "s": "How do you usually travel around your city? What do you think about public transport there?", "vi": "Bạn thường đi lại trong thành phố bằng gì? Bạn nghĩ gì về giao thông công cộng ở đó?", "words": ["run every ten minutes", "a return ticket", "a season ticket", "platform", "wait half an hour for", "wait for twenty minutes to", "my only real complaint is that"], "why": "Nêu phương tiện, vé, thời gian chờ và đánh giá; kết bằng một lời phàn nàn.", "sample": "I usually go to university by train. The trains run every ten minutes in the morning, so I rarely wait long. I bought a season ticket because a return ticket is more expensive every day. On the platform, it is sometimes crowded, and at weekends I have to wait half an hour for the next train. Last month I had to wait for twenty minutes to buy a ticket because the machine broke. My only real complaint is that the stations are not clean, but overall the system is convenient."}, {"type": "sp", "ctx": "A memorable journey", "s": "Describe a memorable journey you have made. Where did you go, and what happened on the way?", "vi": "Hãy tả một chuyến đi đáng nhớ của bạn. Bạn đã đi đâu và có chuyện gì xảy ra dọc đường?", "words": ["journey", "flight", "come along", "a return ticket", "wait in a queue"], "why": "Kể theo thời gian: chuẩn bị, chuyến bay, sự cố, kết thúc; dùng although/when/as soon as.", "sample": "The most memorable journey I have made was a trip to Japan. I bought a return ticket months earlier, and the flight took about six hours. At the airport I had to wait in a queue for an hour, which made me nervous. After I arrived, I got lost, but a kind student came along and showed me the way to the hotel. Although the journey was tiring, it was worth it, because I saw beautiful temples and tried delicious food. I would love to go again."}, {"type": "sp", "ctx": "My neighbourhood", "s": "Tell me about the area where you live. What facilities are nearby, and is there anything you dislike?", "vi": "Hãy kể về khu bạn sống. Có những tiện ích nào gần đó và bạn có điều gì không thích không?", "words": ["just round the corner from", "just round the corner", "there's a shop round the corner", "footpath", "apart from", "nowhere to park"], "why": "Liệt kê tiện ích gần nhà, nói điều bạn thích và một điều chưa hài lòng.", "sample": "I live in a quiet area, and there's a shop round the corner where I buy fresh bread every morning. My school is just round the corner from my house, so I can walk there along a narrow footpath. Apart from the park, there is not much entertainment, but I do not mind. The only problem is that there is nowhere to park for visitors. At the moment, the New Year holiday is just round the corner, so the street is busy and full of lights, which I really like."}, {"type": "sp", "ctx": "Teamwork and events", "s": "Describe a time when you helped organise an event with other people. What did each person do?", "vi": "Hãy tả một lần bạn giúp tổ chức sự kiện cùng người khác. Mỗi người làm gì?", "words": ["pass it down the line", "until sunset", "be good at cooking", "load the dishwasher", "boil the kettle", "boost sales"], "why": "Kể vai trò từng người, khó khăn và kết quả; dùng who/which để thêm thông tin.", "sample": "Last year my class organised a charity food fair to boost sales for a local shelter. Linh, who is really good at cooking, prepared the main dishes, and the boys carried boxes from the truck and passed them down the line. We worked until sunset, and then I helped to load the dishwasher while someone boiled the kettle for tea. Although we were exhausted, we raised more money than expected, which made everyone proud. I learned that teamwork makes difficult jobs much easier."}]}]};

    R.timer=setInterval(tick,500);tick();
    const b1=document.querySelector(`[data-rec="${id}"]`),b2=document.querySelector(`[data-recstop="${id}"]`);
    if(b1)b1.disabled=true;if(b2)b2.disabled=false;
  }
  function stopRec(id){
    if(!R||R.id!==id)return;
    const cur=R;cur.active=false;clearInterval(cur.timer);
    const dur=(Date.now()-cur.t0)/1000;
    recMsg(id,'Đang chấm điểm…');
    try{cur.rec&&cur.rec.stop();}catch(e){}
    const finish=()=>{
      cur.stream.getTracks().forEach(t=>t.stop());
      if(cur.chunks.length){urls[id]&&URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(new Blob(cur.chunks,{type:(cur.mr&&cur.mr.mimeType)||'audio/webm'}));}
      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
