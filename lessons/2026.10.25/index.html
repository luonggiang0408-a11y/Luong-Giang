*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}

.opts{display:flex;flex-wrap:wrap;gap:8px}

.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}

.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}

.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}

.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}

.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

 "vi": "đào tạo"}, {"w": "apply", "vi": "nộp đơn"}], "tw": "surgeon", "ipa": "/ˈsɝː.dʒən/"}, {"type": "mc", "ctx": "Health news", "s": "Some conditions can be controlled with medicine, whereas others require ___, which carries more risks and a longer recovery time.", "o": ["surgery", "tourism", "insurance"], "a": "surgery", "vi": "Một số bệnh có thể kiểm soát bằng thuốc, trong khi bệnh khác cần phẫu thuật, vốn có nhiều rủi ro hơn và thời gian hồi phục dài hơn.", "why": "surgery = việc phẫu thuật (không đếm được): have surgery on my knee. Lưu ý: sheet ghi Verb nhưng thực chất là danh từ.", "new": [{"w": "conditions", "vi": "bệnh lý"}, {"w": "risks", "vi": "rủi ro"}], "tw": "surgery", "ipa": "/ˈsɝː.dʒər.i/"}, {"type": "mc", "ctx": "Hospital", "s": "Early detection saves lives, because patients with ___ often have no symptoms until the illness is already at an advanced stage.", "o": ["lung cancer", "a broken leg", "a bad cold"], "a": "lung cancer", "vi": "Phát hiện sớm cứu sống người bệnh, vì bệnh nhân ung thư phổi thường không có triệu chứng cho đến khi bệnh đã ở giai đoạn muộn.", "why": "lung cancer = ung thư phổi; hút thuốc là nguyên nhân chính.", "new": [{"w": "detection", "vi": "sự phát hiện"}, {"w": "advanced", "vi": "giai đoạn muộn"}], "tw": "lung cancer", "ipa": "/ˈkæn.sɚ/"}, {"type": "mc", "ctx": "Health lecture", "s": "Chest pain that spreads to the arm may be a sign of a ___, so you should call emergency services at once.", "o": ["heart attack", "sore throat", "headache"], "a": "heart attack", "vi": "Cơn đau ngực lan xuống cánh tay có thể là dấu hiệu của cơn đau tim, nên bạn cần gọi cấp cứu ngay lập tức.", "why": "heart attack = cơn đau tim; have a heart attack. Khác với attack = tấn công.", "new": [{"w": "spreads", "vi": "lan"}, {"w": "at once", "vi": "ngay lập tức"}], "tw": "heart attack", "ipa": "/əˈtæk/"}, {"type": "mc", "ctx": "Science class", "s": "Vaccines have almost wiped out some deadly ___, such as polio, although a few cases still appear in remote areas.", "o": ["disease", "recipes", "cartoons"], "a": "disease", "vi": "Vắc-xin gần như đã xóa sổ một số bệnh chết người, như bại liệt, dù vài ca vẫn xuất hiện ở các vùng xa xôi.", "why": "disease = bệnh (thường có tên gọi, do vi khuẩn/virus hoặc rối loạn): heart disease, infectious disease.", "new": [{"w": "wiped out", "vi": "xóa sổ"}, {"w": "remote", "vi": "xa xôi"}], "tw": "disease", "ipa": "/dɪˈziːz/"}, {"type": "mc", "ctx": "School", "s": "The headmaster explained that frequent absences due to ___ would not affect a student's final grade if parents sent a medical note.", "o": ["illness", "holiday", "sports"], "a": "illness", "vi": "Hiệu trưởng giải thích rằng việc vắng mặt thường xuyên do bệnh tật sẽ không ảnh hưởng điểm cuối kỳ nếu phụ huynh gửi giấy xác nhận của bác sĩ.", "why": "illness = tình trạng ốm đau, bệnh tật (a long illness); disease thường là bệnh cụ thể.", "new": [{"w": "absences", "vi": "sự vắng mặt"}, {"w": "grade", "vi": "điểm"}], "tw": "illness", "ipa": "/ˈɪl.nəs/"}, {"type": "mc", "ctx": "Sports", "s": "Swimmers usually have strong ___ because they train in water, which makes breathing harder than on land.", "o": ["lungs", "ears", "shoulders"], "a": "lungs", "vi": "Vận động viên bơi lội thường có phổi khỏe vì họ tập dưới nước, nơi thở khó hơn trên cạn.", "why": "lungs = phổi (thường ở dạng số nhiều); one lung / both lungs.", "new": [{"w": "train", "vi": "luyện tập"}, {"w": "harder", "vi": "khó hơn"}], "tw": "lungs", "ipa": "/lʌŋ/"}, {"type": "mc", "ctx": "Pharmacy", "s": "Mild infections can usually be ___ at home with rest and plenty of fluids, but more serious ones require antibiotics.", "o": ["treat", "watched", "painted"], "a": "treat", "vi": "Nhiễm trùng nhẹ thường có thể được điều trị tại nhà bằng nghỉ ngơi và uống nhiều nước, nhưng ca nặng hơn cần kháng sinh.", "why": "treat = điều trị (treat a patient / an illness); còn nghĩa: đối xử, đãi.", "new": [{"w": "fluids", "vi": "chất lỏng"}, {"w": "mild", "vi": "nhẹ"}], "tw": "treat", "ipa ot lost in the ___ for an hour because every path looked the same, but finally we heard the river and found our tent.", "o": ["woods", "kitchen", "airport"], "a": "woods", "vi": "Chúng tôi bị lạc trong khu rừng một giờ vì con đường nào cũng giống nhau, nhưng cuối cùng nghe thấy tiếng sông và tìm lại lều.", "why": "the woods = khu rừng nhỏ (nhỏ hơn forest); walk in the woods.", "new": [{"w": "path", "vi": "lối mòn"}, {"w": "tent", "vi": "lều"}], "tw": "woods", "ipa": "/wʊdz/"}, {"type": "mc", "ctx": "Jam making", "s": "My grandmother makes delicious jam from wild ___, which she sells at the local market every Saturday morning.", "o": ["blackberries", "bananas", "potatoes"], "a": "blackberries", "vi": "Bà tôi làm mứt ngon từ mâm xôi đen dại, bán ở chợ địa phương mỗi sáng thứ Bảy.", "why": "blackberry = quả mâm xôi đen (số nhiều: blackberries); mọc dại ven đường, rừng.", "new": [{"w": "jam", "vi": "mứt"}, {"w": "wild", "vi": "dại, hoang"}], "tw": "blackberries", "ipa": "/ˈblæk.bər.i/"}, {"type": "mc", "ctx": "Farming", "s": "Farmers plan their work around ___, planting rice in spring and harvesting before the heavy autumn rains arrive.", "o": ["the seasons", "the numbers", "the colours"], "a": "the seasons", "vi": "Nông dân lên kế hoạch công việc theo các mùa, gieo lúa vào mùa xuân và thu hoạch trước khi mưa thu nặng hạt đến.", "why": "the seasons = các mùa trong năm (spring, summer, autumn, winter).", "new": [{"w": "harvesting", "vi": "thu hoạch"}, {"w": "planting", "vi": "gieo trồng"}], "tw": "the seasons", "ipa": "/ðə ˈsiː.zənz/"}, {"type": "mc", "ctx": "City planning", "s": "Because the population keeps growing, the council wants to protect the remaining ___ in the city centre from new buildings.", "o": ["open spaces", "opening hours", "spare parts"], "a": "open spaces", "vi": "Vì dân số liên tục tăng, hội đồng muốn bảo vệ những khoảng không gian thoáng còn lại ở trung tâm thành phố khỏi các tòa nhà mới.", "why": "open spaces = những khu đất rộng, thoáng (công viên  of coffee.", "o": ["bus fare", "passport", "timetable"], "a": "bus fare", "vi": "Sinh viên được đi nửa giá, nghĩa là giá vé xe cho hành trình hai tiếng rẻ hơn một cốc cà phê.", "why": "bus/coach fare = giá vé xe buýt / xe khách; fare chỉ tiền trả để đi lại bằng phương tiện (khác ticket là tấm vé). Dạng suy ra từ 'Bus/ coach fare'.", "new": [{"w": "half price", "vi": "nửa giá"}, {"w": "journey", "vi": "hành trình"}], "tw": "bus fare"}, {"type": "mc", "ctx": "Travel agency", "s": "The package includes accommodation and breakfast, but the ___ is not covered, so you need to buy your own flight.", "o": ["airfare", "luggage", "visa"], "a": "airfare", "vi": "Gói tour gồm chỗ ở và bữa sáng, nhưng vé máy bay không được bao gồm, nên bạn cần tự mua chuyến bay.", "why": "airfare = giá vé máy bay (= the price of a plane ticket). Dạng suy ra từ 'Airfare'.", "new": [{"w": "accommodation", "vi": "chỗ ở"}, {"w": "package", "vi": "gói tour"}], "tw": "airfare"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Workplace", "s": "The company encourages staff to engage in community projects during working hours. Although this costs money, managers believe it improves morale and attracts talented applicants. What does \"engage in\" mean?", "o": ["tham gia vào, dấn thân vào", "Từ chối, tránh xa", "Kiểm soát, quản lý"], "a": "tham gia vào, dấn thân vào", "vi": "Công ty khuyến khích nhân viên tham gia các dự án cộng đồng trong giờ làm việc. Dù tốn kém, các quản lý tin rằng điều này nâng cao tinh thần và thu hút ứng viên giỏi.", "why": "engage in + danh từ/V-ing = tham gia vào một hoạt động, công việc.", "noblank": true, "say": "The company encourages staff to engage in community projects during working hours. Although this costs money, managers believe it improves morale and attracts talented applicants.", "new": [{"w": "morale", "vi": "tinh thần làm việc"}, {"w": "applicants", "vi": "ứng viên"}], "tw": "engage in"}, {"type": "mc", "ctx": "Food blog", "s": "Milk and fresh vegetables should be stored in the refrigerator, whereas bread and bananas usually stay fresh longer at room temperature. Keeping food at the right place reduces waste. What does \"refrigerator\" mean?", "o": ["tủ lạnh", "Lò vi sóng", "Bếp ga"], "a": "tủ lạnh", "vi": "Sữa và rau tươi nên được bảo quản trong tủ lạnh, trong khi bánh mì và chuối thường tươi lâu hơn ở nhiệt độ phòng. Để thực phẩm đúng chỗ giúp giảm lãng phí.", "why": "refrigerator = tủ lạnh (nói tắt: fridge); thường đi với keep sth in the refrigerator.", "noblank": true, "say": "Milk and fresh vegetables should be stored in the refrigerator, whereas bread and bananas usually stay fresh longer at room temperature. Keeping food at the right place reduces waste.", "new": [{"w": "stored", "vi": "được bảo quản"}, {"w": "waste", "vi": "sự lãng phí"}], "tw": "refrigerator", "ipa": "/rɪˈfrɪdʒ.ə.reɪ.t̬ɚ/"}, {"type": "mc", "ctx": "Nutrition article", "s": "Quinoa originally comes from South America, where farmers have grown it for thousands of years. Today it is popular worldwide because it is gluten-free and easy to cook. What does \"quinoa\" mean?", "o": ["hạt diêm mạch", "Một loại cá biển", "Một loại gia vị cay"], "a": "hạt diêm mạch", "vi": "Hạt diêm mạch vốn đến từ Nam Mỹ, nơi nông dân đã trồng nó hàng nghìn năm. Ngày nay nó phổ biến toàn cầu vì không chứa gluten và dễ nấu.", "why": "quinoa = hạt diêm mạch, ngũ cốc giàu đạm, thường dùng trong salad hoặc thay cơm.", "noblank": true, "say": "Quinoa originally comes from South America, where farmers have grown it for thousands of years. Today it is popular worldwide because it is gluten-free and easy to cook.", "new": [{"w": "gluten-free", "vi": "không chứa gluten"}, {"w": "worldwide", "vi": "trên toàn thế giới"}], "tw": "quinoa", "ipa": "/kɪnˈwɑː/"}, {"type": "mc", "ctx": "Dialogue", "s": "\"You've been very quiet all afternoon. What's the matter?\" asked Lan. \"I just failed my driving test for the second time,\" her brother replied sadly. What does \"What's the matter?\" mean?", "o": ["Có chuyện gì vậy? / Bạn bị sao vậy?", "Bạn đang đi đâu vậy?", "Bạn muốn ăn gì?"], "a": "Có chuyện gì vậy? / Bạn bị sao vậy?", "vi": "\"Cả buổi chiều em im lặng quá. Có chuyện gì vậy?\" Lan hỏi. \"Em vừa trượt kỳ thi lái xe lần thứ hai,\" em trai cô buồn bã đáp.", "why": "What's the matter? = hỏi thăm khi thấy ai đó buồn, đau hoặc có vấn đề (= What's wrong?).", "noblank": true, "say": "\"You've been very quiet all afternoon. What's the matter?\" asked Lan. \"I just failed my driving test for the second time,\" her brother replied sadly.", "new": [{"w": "driving test", "vi": "kỳ thi lái xe"}, {"w": "sadly", "vi": "buồn bã"}], "tw": "What's the matter?"}, {"type": "mc", "ctx": "Health tips", "s": "Winter air is dry, and many people wake up with a sore throat. Drinking warm water with honey can ease the pain, although it will not cure the cause. What does \"have a sore throat\" mean?", "o": ["bị đau họng", "Bị đau đầu gối", "Bị mất ngủ"], "a": "bị đau họng", "vi": "Không khí mùa đông khô và nhiều người thức dậy với cái họng đau rát. Uống nước ấm với mật ong có thể làm dịu cơn đau, dù không chữa được nguyên nhân.", "why": "have a sore throat = bị đau họng; sore = đau rát, viêm.", "noblank": true, "say": "Winter air is dry, and many people wake up with a sore throat. Drinking warm water with honey can ease the pain, although it will not cure the cause.", "new": [{"w": "ease", "vi": "làm dịu"}, {"w": "cure", "vi": "chữa khỏi"}], "tw": "have a sore throat", "ipa": "/θroʊt/"}, {"type": "mc", "ctx": "Parenting blog", "s": "If your baby has a temperature above 38 degrees, give plenty of water and call a doctor. Do not wait too long, because small children can get worse quickly. What does \"have a temperature\" mean?", "o": ["bị sốt", "Bị đau lưng", "Bị ngứa da"], "a": "bị sốt", "vi": "Nếu em bé bị sốt trên 38 độ, hãy cho uống nhiều nước và gọi bác sĩ. Đừng chờ quá lâu vì trẻ nhỏ có thể trở nặng nhanh.", "why": "have a temperature = bị sốt (nhiệt độ cơ thể cao hơn bình thường).", "noblank": true, "say": "If your baby has a temperature above 38 degrees, give plenty of water and call a doctor. Do not wait too long, because small children can get worse quickly.", "new": [{"w": "plenty of", "vi": "nhiều"}, {"w": "get worse", "vi": "trở nặng"}], "tw": "have a temperature", "ipa": "/ˈtem.pɚ.ə.tʃɚ/"}, {"type": "mc", "ctx": "Health news", "s": "Flu spreads easily in crowded places such as schools and offices. Washing your hands often and avoiding close contact with sick people are simple ways to protect yourself. What does \"flu\" mean?", "o": ["bệnh cúm", "Bệnh dị ứng", "Bệnh tiểu đường"], "a": "bệnh cúm", "vi": "Cúm lây lan dễ dàng ở nơi đông người như trường học và văn phòng. Rửa tay thường xuyên và tránh tiếp xúc gần người bệnh là cách đơn giản để tự bảo vệ.", "why": "flu = cúm (viết tắt của influenza); thường nói have/catch (the) flu.", "noblank": true, "say": "Flu spreads easily in crowded places such as schools and offices. Washing your hands often and avoiding close contact with sick people are simple ways to protect yourself.", "new": [{"w": "crowded", "vi": "đông đúc"}, {"w": "contact", "vi": "sự tiếp xúc"}], "tw": "flu"}, {"type": "mc", "ctx": "Story", "s": "While Hoa was peeling an apple in the garden, her knife slipped and she cut herself. Luckily, the wound was small, and her mother cleaned it with warm water. What does \"cut yourself\" mean?", "o": ["bị đứt/cắt vào người", "Cô ấy tự làm mình đau lòng", "Cô ấy tự nấu bữa trưa"], "a": "bị đứt/cắt vào người", "vi": "Khi Hoa đang gọt táo trong vườn, con dao trượt và cô bị đứt tay. May mắn là vết thương nhỏ, mẹ cô lau sạch bằng nước ấm.", "why": "cut yourself = tự làm mình bị đứt tay/chân; đại từ phản thân đổi theo chủ ngữ (myself, himself...).", "noblank": true, "say": "While Hoa was peeling an apple in the garden, her knife slipped and she cut herself. Luckily, the wound was small, and her mother cleaned it with warm water.", "new": [{"w": "peel", "vi": "gọt vỏ"}, {"w": "slipped", "vi": "trượt"}], "tw": "cut yourself"}, {"type": "mc", "ctx": "First-aid manual", "s": "If a wound is bleeding heavily, do not remove the cloth. Add more layers on top and keep pressing firmly until the ambulance arrives. What does \"bleed\" mean?", "o": ["chảy máu", "Sưng lên", "Đóng vảy"], "a": "chảy máu", "vi": "Nếu vết thương chảy máu nhiều, đừng bỏ miếng vải ra. Hãy thêm nhiều lớp lên trên và tiếp tục ấn chặt cho đến khi xe cứu thương đến.", "why": "bleed = chảy máu (bleed - bled - bled); danh từ: blood.", "noblank": true, "say": "If a wound is bleeding heavily, do not remove the cloth. Add more layers on top and keep pressing firmly until the ambulance arrives.", "new": [{"w": "layers", "vi": "các lớp"}, {"w": "firmly", "vi": "chắc, chặt"}], "tw": "bleed", "ipa": "/bliːd/"}, {"type": "mc", "ctx": "First-aid course", "s": "Our instructor showed us how to put a bandage around a sprained knee. She explained that the bandage should support the joint without stopping the blood flow. What does \"put a bandage around\" mean?", "o": ["quấn băng quanh (chỗ bị thương)", "Tháo băng khỏi đầu gối", "Xoa bóp đầu gối"], "a": "quấn băng quanh (chỗ bị thương)", "vi": "Giảng viên chỉ chúng tôi cách quấn băng quanh đầu gối bị bong gân. Cô giải thích băng phải nâng đỡ khớp mà không cản máu lưu thông.", "why": "put a bandage around + bộ phận cơ thể = quấn băng quanh chỗ bị thương.", "noblank": true, "say": "Our instructor showed us how to put a bandage around a sprained knee. She explained that the bandage should support the joint without stopping the blood flow.", "new": [{"w": "sprained", "vi": "bị bong gân"}, {"w": "joint", "vi": "khớp"}], "tw": "put a bandage around", "ipa": "/ˈbæn.dɪdʒ/"}, {"type": "mc", "ctx": "Health forum", "s": "I've had a cough since last Monday, and it gets worse at night. Honey and ginger tea help a little, but I may need to see a doctor. What does \"have a cough\" mean?", "o": ["bị ho", "Bị mất giọng", "Bị chóng mặt"], "a": "bị ho", "vi": "Tôi bị ho từ thứ Hai tuần trước và nó nặng hơn vào ban đêm. Trà mật ong gừng giúp được chút ít, nhưng có thể tôi cần đi khám.", "why": "have a cough = bị ho; có thể nói have a bad/terrible cough.", "noblank": true, "say": "I've had a cough since last Monday, and it gets worse at night. Honey and ginger tea help a little, but I may need to see a doctor.", "new": [{"w": "ginger", "vi": "gừng"}, {"w": "gets worse", "vi": "trở nên tệ hơn"}], "tw": "have a cough", "ipa": "/kɑːf/"}, {"type": "mc", "ctx": "Label", "s": "This cough medicine should not be taken with alcohol. Children under six must ask a doctor first, because the dose is different for young patients. What does \"cough medicine\" mean?", "o": ["thuốc ho", "Thuốc nhỏ mắt", "Thuốc đau bụng"], "a": "thuốc ho", "vi": "Thuốc ho này không nên dùng cùng rượu bia. Trẻ dưới sáu tuổi phải hỏi bác sĩ trước vì liều lượng khác với bệnh nhân nhỏ.", "why": "cough medicine = thuốc ho; medicine không đếm được.", "noblank": true, "say": "This cough medicine should not be taken with alcohol. Children under six must ask a doctor first, because the dose is different for young patients.", "new": [{"w": "dose", "vi": "liều lượng"}, {"w": "alcohol", "vi": "rượu bia"}], "tw": "cough medicine", "ipa": "/kɑːf/ /ˈmed.ɪ.sən/"}, {"type": "mc", "ctx": "Wellbeing blog", "s": "If you have a headache, drink a glass of water first. Dehydration is a common cause, and the pain often disappears within half an hour. What does \"have a headache\" mean?", "o": ["bị đau đầu", "Bị chuột rút", "Bị khàn tiếng"], "a": "bị đau đầu", "vi": "Nếu bạn bị đau đầu, hãy uống một cốc nước trước. Mất nước là nguyên nhân thường gặp và cơn đau thường biến mất trong nửa giờ.", "why": "have a headache = bị đau đầu; headache là danh từ đếm được.", "noblank": true, "say": "If you have a headache, drink a glass of water first. Dehydration is a common cause, and the pain often disappe mong people who have never smoked in their lives. What does \"lung cancer\" mean?", "o": ["ung thư phổi", "Viêm da", "Bệnh tim"], "a": "ung thư phổi", "vi": "Các nhà nghiên cứu phát hiện rằng tiếp xúc lâu dài với không khí ô nhiễm làm tăng nguy cơ ung thư phổi, ngay cả ở người chưa từng hút thuốc.", "why": "lung cancer = ung thư phổi; hút thuốc là nguyên nhân chính.", "noblank": true, "say": "Researchers found that long-term exposure to polluted air increases the risk of lung cancer, even among people who have never smoked in their lives.", "new": [{"w": "exposure", "vi": "sự tiếp xúc"}, {"w": "risk", "vi": "nguy cơ"}], "tw": "lung cancer", "ipa": "/ˈkæn.sɚ/"}, {"type": "mc", "ctx": "Reading", "s": "Stress, smoking and an unhealthy diet can all raise the risk of a heart attack. Fortunately, regular exercise and sleep can lower that risk considerably. What does \"heart attack\" mean?", "o": ["cơn đau tim, nhồi máu cơ tim", "Cơn đau răng", "Cơn đau đầu"], "a": "cơn đau tim, nhồi máu cơ tim", "vi": "Căng thẳng, hút thuốc và chế độ ăn không lành mạnh đều có thể làm tăng nguy cơ đau tim. May thay, tập thể dục đều và ngủ đủ giúp giảm đáng kể nguy cơ đó.", "why": "heart attack = cơn đau tim; have a heart attack. Khác với attack = tấn công.", "noblank": true, "say": "Stress, smoking and an unhealthy diet can all raise the risk of a heart attack. Fortunately, regular exercise and sleep can lower that risk considerably.", "new": [{"w": "raise", "vi": "làm tăng"}, {"w": "considerably", "vi": "đáng kể"}], "tw": "heart attack", "ipa": "/əˈtæk/"}, {"type": "mc", "ctx": "Reading", "s": "Heart disease is one of the leading causes of death worldwide. Doctors say that many cases could be prevented if people ate better and exercised more. What does \"disease\" mean?", "o": ["bệnh, bệnh lý", "Thuốc men", "Bác sĩ"], "a": "bệnh, bệnh lý", "vi": "Bệnh tim là một trong những nguyên nhân tử vong hàng đầu thế giới. Bác sĩ nói nhiều ca có thể phòng tránh nếu mọi người ăn uống tốt hơn và tập luyện nhiều hơn.", "why": "disease = bệnh (thường có tên gọi, do vi khuẩn/virus hoặc rối loạn): heart disease, infectious disease.", "noblank": true, "say": "Heart disease is one of the leading causes of death worldwide. Doctors say that many cases could be prevented if people ate better and exercised more.", "new": [{"w": "leading", "vi": "hàng đầu"}, {"w": "prevented", "vi": "được ngăn ngừa"}], "tw": "disease", "ipa": "/dɪˈziːz/"}, {"type": "mc", "ctx": "Reading", "s": "Stress can make an illness worse. When people are worried, their bodies produce chemicals that slow down recovery, so rest and calm are important. What does \"illness\" mean?", "o": ["tình trạng bệnh, bệnh tật", "Kỳ nghỉ", "Bác sĩ"], "a": "tình trạng bệnh, bệnh tật", "vi": "Căng thẳng có thể làm bệnh nặng hơn. Khi lo lắng, cơ thể tiết ra các chất làm chậm hồi phục, nên nghỉ ngơi và bình tĩnh rất quan trọng.", "why": "illness = tình trạng ốm đau, bệnh tật (a long illness); disease thường là bệnh cụ thể.", "noblank": true, "say": "Stress can make an illness worse. When people are worried, their bodies produce chemicals that slow down recovery, so rest and calm are important.", "new": [{"w": "chemicals", "vi": "hóa chất"}, {"w": "slow down", "vi": "làm chậm"}], "tw": "illness", "ipa": "/ˈɪl.nəs/"}, {"type": "mc", "ctx": "Reading", "s": "Air pollution can damage the lungs, especially in children, whose bodies are still developing. As a result, many parents keep their kids indoors when the air is bad. What does \"lungs\" mean?", "o": ["phổi", "Gan", "Thận"], "a": "phổi", "vi": "Ô nhiễm không khí có thể gây hại cho phổi, đặc biệt ở trẻ em, vì cơ thể các em còn đang phát triển. Vì vậy, nhiều bố mẹ giữ con ở trong nhà khi không khí xấu.", "why": "lungs = phổi (thường ở dạng số nhiều); one lung / both lungs.", "noblank": true, "say": "Air pollution can damage the lungs, especially in children, whose bodies are still developing. As a result, many parents keep their kids indoors when the air is bad.", "new": [ wn", "vi": "bình minh"}], "tw": "lively", "ipa": "/ˈlaɪvli/"}, {"type": "mc", "ctx": "Reading", "s": "Life in a small village can be dull for teenagers. There is no cinema, few shops, and very little to do except help on the family farm. What does \"dull\" mean?", "o": ["buồn tẻ", "Sôi động, vui nhộn", "Nguy hiểm, đáng sợ"], "a": "buồn tẻ", "vi": "Cuộc sống ở làng nhỏ có thể buồn tẻ với thanh thiếu niên. Không có rạp phim, ít cửa hàng, và hầu như chẳng có gì làm ngoài giúp việc nông trại gia đình.", "why": "dull = buồn tẻ, nhàm chán (a dull job); còn nghĩa: xỉn màu, âm ỉ (a dull ache).", "noblank": true, "say": "Life in a small village can be dull for teenagers. There is no cinema, few shops, and very little to do except help on the family farm.", "new": [{"w": "except", "vi": "ngoài ra"}, {"w": "farm", "vi": "nông trại"}], "tw": "dull", "ipa": "/dʌl/"}, {"type": "mc", "ctx": "Reading", "s": "The tea company offers more than thirty different flavours, including lemon, jasmine and ginger. As a result, customers can easily find one that suits their taste. What does \"different flavours\" mean?", "o": ["nhiều hương vị khác nhau", "Nhiều kích cỡ khác nhau", "Nhiều màu sắc khác nhau"], "a": "nhiều hương vị khác nhau", "vi": "Công ty trà cung cấp hơn ba mươi hương vị khác nhau, gồm chanh, hoa nhài và gừng. Nhờ vậy khách dễ chọn được loại hợp khẩu vị.", "why": "different flavours = nhiều hương vị khác nhau (Anh-Mỹ: flavors).", "noblank": true, "say": "The tea company offers more than thirty different flavours, including lemon, jasmine and ginger. As a result, customers can easily find one that suits their taste.", "new": [{"w": "jasmine", "vi": "hoa nhài"}, {"w": "suits", "vi": "hợp với"}], "tw": "different flavours", "ipa": "/ˈdɪfrənt ˈfleɪvəz/"}, {"type": "mc", "ctx": "Reading", "s": "The town stands on the banks of the river, which floods almost every autumn. Residents have learnt to keep their valuable things on the upper floor. What does \"on the banks of the river\" mean?", "o": ["bên bờ sông", "Trên đỉnh núi", "Giữa biển khơi"], "a": "bên bờ sông", "vi": "Thị trấn nằm bên bờ sông, nơi gần như mùa thu nào cũng ngập lụt. Cư dân đã học cách để đồ có giá trị ở tầng trên.", "why": "on the banks of the river = trên/bên bờ sông; bank còn có nghĩa ngân hàng.", "noblank": true, "say": "The town stands on the banks of the river, which floods almost every autumn. Residents have learnt to keep their valuable things on the upper floor.", "new": [{"w": "floods", "vi": "ngập lụt"}, {"w": "residents", "vi": "cư dân"}], "tw": "on the banks of the river", "ipa": "/ɒn ðə bæŋks əv ðə ˈrɪv.ər/"}, {"type": "mc", "ctx": "Reading", "s": "Children in the village used to play in the woods all summer. They climbed trees, built small camps and came home only when it got dark. What does \"woods\" mean?", "o": ["khu rừng nhỏ, khu cây cối", "Hồ nước", "Cánh đồng lúa"], "a": "khu rừng nhỏ, khu cây cối", "vi": "Trẻ con trong làng từng chơi trong khu rừng nhỏ suốt mùa hè. Chúng leo cây, dựng những cái trại nhỏ và chỉ về nhà khi trời tối.", "why": "the woods = khu rừng nhỏ (nhỏ hơn forest); walk in the woods.", "noblank": true, "say": "Children in the village used to play in the woods all summer. They climbed trees, built small camps and came home only when it got dark.", "new": [{"w": "camps", "vi": "trại nhỏ"}, {"w": "climbed", "vi": "trèo"}], "tw": "woods", "ipa": "/wʊdz/"}, {"type": "mc", "ctx": "Reading", "s": "Blackberries grow wild in many parts of Britain. Because they ripen in late summer, families often go out together to pick them before the weather turns cold. What does \"blackberries\" mean?", "o": ["quả mâm xôi đen", "Quả táo xanh", "Quả chuối chín"], "a": "quả mâm xôi đen", "vi": "Mâm xôi đen mọc dại ở nhiều nơi tại Anh. Vì chín vào cuối hè, các gia đình thường cùng ra hái trước khi trời trở lạnh.", "why": "blackberry = quả mâm xôi đen (số nhiều: blackberries); mọc dại ven đường, rừng.", "noblank": true, "say": "Blackberries grow wild in many parts of Britain. Because they ripen in late summer, families often go out together to pick them before the weather turns cold.", "new": [{"w": "ripen", "vi": "chín"}, {"w": "turns cold", "vi": "trở lạnh"}], "tw": "blackberries", "ipa": "/ˈblæk.bər.i/"}, {"type": "mc", "ctx": "Reading", "s": "Climate change is affecting the seasons in many countries. Winters are becoming shorter and warmer, and some flowers now bloom weeks earlier than before. What does \"the seasons\" mean?", "o": ["các mùa trong năm", "Các ngày trong tuần", "Các thế hệ"], "a": "các mùa trong năm", "vi": "Biến đổi khí hậu đang ảnh hưởng đến các mùa ở nhiều nước. Mùa đông ngắn và ấm hơn, và một số loài hoa nở sớm hơn vài tuần so với trước.", "why": "the seasons = các mùa trong năm (spring, summer, autumn, winter).", "noblank": true, "say": "Climate change is affecting the seasons in many countries. Winters are becoming shorter and warmer, and some flowers now bloom weeks earlier than before.", "new": [{"w": "bloom", "vi": "nở hoa"}, {"w": "climate change", "vi": "biến đổi khí hậu"}], "tw": "the seasons", "ipa": "/ðə ˈsiː.zənz/"}, {"type": "mc", "ctx": "Reading", "s": "Crowded cities have few open spaces, which can affect people's mental health. Parks and gardens give residents a place to relax and breathe fresh air. What does \"open spaces\" mean?", "o": ["không gian rộng, thoáng đãng", "Khu mua sắm", "Hầm để xe"], "a": "không gian rộng, thoáng đãng", "vi": "Thành phố đông đúc có ít không gian thoáng, điều có thể ảnh hưởng sức khỏe tinh thần. Công viên và vườn cho cư dân chỗ thư giãn và hít thở không khí trong lành.", "why": "open spaces = những khu đất rộng, thoáng (công viên, đồng cỏ), trái với khu dân cư đông đúc.", "noblank": true, "say": "Crowded cities have few open spaces, which can affect people's mental health. Parks and gardens give residents a place to relax and breathe fresh air.", "new": [{"w": "mental", "vi": "tinh thần"}, {"w": "residents", "vi": "cư dân"}], "tw": "open spaces", "ipa": "/ˌəʊ.pən ˈspeɪ.sɪz/"}, {"type": "mc", "ctx": "Reading", "s": "The farmer uses a tractor to work in the fields. Thanks to the machine, he can finish in two days a job that once took a whole week. What does \"tractor\" mean?", "o": ["máy kéo", "Xe đạp", "Xe tải chở hàng"], "a": "máy kéo", "vi": "Người nông dân dùng máy kéo để làm việc ngoài đồng. Nhờ chiếc máy, ông làm xong trong hai ngày công việc từng mất cả tuần.", "why": "tractor = máy kéo, xe dùng trong nông nghiệp (kéo máy cày, xe rơ-moóc).", "noblank": true, "say": "The farmer uses a tractor to work in the fields. Thanks to the machine, he can finish in two days a job that once took a whole week.", "new": [{"w": "machine", "vi": "máy móc"}, {"w": "fields", "vi": "cánh đồng"}], "tw": "tractor", "ipa": "/ˈtræk.tər/"}, {"type": "mc", "ctx": "Reading", "s": "Linh was running late, so she waited at the stop and managed to get on the last bus just before the doors closed. She arrived home at midnight. What does \"get on\" mean?", "o": ["lên (xe buýt, xe khách, tàu, máy bay)", "Xuống xe", "Sửa xe"], "a": "lên (xe buýt, xe khách, tàu, máy bay)", "vi": "Linh bị trễ nên chờ ở trạm và kịp lên chuyến xe buýt cuối cùng ngay trước khi cửa đóng. Cô về đến nhà lúc nửa đêm.", "why": "get on + bus/coach/train/plane = lên phương tiện lớn có nhiều chỗ ngồi (trái nghĩa: get off). Dạng suy ra từ 'get on bus/coach/train/plane'.", "noblank": true, "say": "Linh was running late, so she waited at the stop and managed to get on the last bus just before the doors closed. She arrived home at midnight.", "new": [{"w": "managed to", "vi": "xoay xở được"}, {"w": "doors", "vi": "cửa"}], "tw": "get on"}, {"type": "mc", "ctx": "Reading", "s": "The conductor told the passengers that the museum was only five minutes away, so they should get off at the next stop and walk along the river. What does \"get off\" mean?", "o": ["xuống (xe buýt, xe khách, tàu, máy bay)", "Lên xe", "Đỗ xe"], "a": "xuống (xe buýt, xe khách, tàu, máy bay)", "vi": "Người soát vé bảo hành khách bảo tàng chỉ cách năm phút, nên họ nên xuống ở trạm kế tiếp và đi bộ dọc sông.", "why": "get off + bus/coach/train/plane = xuống phương tiện lớn (trái nghĩa: get on).", "noblank": true, "say": "The conductor told the passengers that the museum was only five minutes away, so they should get off at the next stop and walk along the river.", "new": [{"w": "conductor", "vi": "người soát vé"}, {"w": "stop", "vi": "trạm dừng"}], "tw": "get off"}, {"type": "mc", "ctx": "Reading", "s": "The tourists got into a taxi outside the station and asked the driver to take them to the old quarter. The journey took about fifteen minutes. What does \"get into\" mean?", "o": ["lên (ô tô, taxi)", "Xuống taxi", "Gọi taxi"], "a": "lên (ô tô, taxi)", "vi": "Du khách lên một chiếc taxi ngoài nhà ga và nhờ tài xế đưa đến khu phố cổ. Chuyến đi mất khoảng mười lăm phút.", "why": "get into + car/taxi = lên ô tô, taxi (xe nhỏ, ngồi vào trong); trái nghĩa: get out of.", "noblank": true, "say": "The tourists got into a taxi outside the station and asked the driver to take them to the old quarter. The journey took about fifteen minutes.", "new": [{"w": "journey", "vi": "chuyến đi"}, {"w": "driver", "vi": "tài xế"}], "tw": "get into"}, {"type": "mc", "ctx": "Reading", "s": "The police asked the driver to get out of the car and show his documents. He seemed calm, although his hands were shaking slightly. What does \"get out of\" mean?", "o": ["xuống (ô tô, taxi)", "Lên xe ô tô", "Sửa xe ô tô"], "a": "xuống (ô tô, taxi)", "vi": "Cảnh sát yêu cầu tài xế xuống xe và xuất trình giấy tờ. Anh ta có vẻ bình tĩnh, dù tay hơi run.", "why": "get out of + car/taxi = xuống ô tô, taxi; trái nghĩa: get into.", "noblank": true, "say": "The police asked the driver to get out of the car and show his documents. He seemed calm, although his hands were shaking slightly.", "new": [{"w": "documents", "vi": "giấy tờ"}, {"w": "shaking", "vi": "run"}], "tw": "get out of"}, {"type": "mc", "ctx": "Reading", "s": "In Britain, a truck is usually called a lorry. Because online shopping has grown so quickly, thousands of lorries now deliver goods across the country every day. What does \"lorry\" mean?", "o": ["xe tải", "Xe đạp", "Xe buýt"], "a": "xe tải", "vi": "Ở Anh, truck thường được gọi là lorry. Vì mua sắm trực tuyến phát triển nhanh, hàng nghìn xe tải giờ giao hàng khắp cả nước mỗi ngày.", "why": "lorry = xe tải (Anh-Anh); Anh-Mỹ nói truck.", "noblank": true, "say": "In Britain, a truck is usually called a lorry. Because online shopping has grown so quickly, thousands of lorries now deliver goods across the country every day.", "new": [{"w": "deliver", "vi": "giao"}, {"w": "goods", "vi": "hàng hóa"}], "tw": "lorry"}, {"type": "mc", "ctx": "Reading", "s": "The station has six platforms, and during rush hour they are packed with commuters. As a result, announcements are repeated several times in different languages. What does \"platform\" mean?", "o": ["sân ga, bục", "Phòng chờ", "Quầy bán vé"], "a": "sân ga, bục", "vi": "Nhà ga có sáu sân ga, và giờ cao điểm chúng chật kín người đi làm. Vì vậy các thông báo được lặp lại nhiều lần bằng nhiều ngôn ngữ.", "why": "platform = sân ga (nơi chờ tàu); còn nghĩa: bục, nền tảng.", "noblank": true, "say": "The station has six platforms, and during rush hour they are packed with commuters. As a result, announcements are repeated several times in different languages.", "new": [{"w": "rush hour", "vi": "giờ cao điểm"}, {"w": "packed", "vi": "chật kín"}], "tw": "platform"}, {"type": "mc", "ctx": "Reading", "s": "The coach fare from Hanoi to Hai Phong is surprisingly cheap. Although the journey takes longer than the train, many students choose it to save money. What does \"bus fare\" mean?", "o": ["giá vé xe buýt / xe khách", "Giờ xe khởi hành", "Bến xe"], "a": "giá vé xe buýt / xe khách", "vi": "Giá vé xe khách từ Hà Nội đến Hải Phòng rẻ đến bất ngờ. Dù đi lâu hơn tàu, nhiều sinh viên chọn nó để tiết kiệm.", "why": "bus/coach fare = giá vé xe buýt / xe khách; fare chỉ tiền trả để đi lại bằng phương tiện (khác ticket là tấm vé). Dạng suy ra từ 'Bus/ coach fare'.", "noblank": true, "say": "The coach fare from Hanoi to Hai Phong is surprisingly cheap. Although the journey takes longer than the train, many students choose it to save money.", "new": [{"w": "surprisingly", "vi": "đáng ngạc nhiên"}, {"w": "save", "vi": "tiết kiệm"}], "tw": "bus fare"}, {"type": "mc", "ctx": "Reading", "s": "Airfare to Europe has dropped recently because several budget airlines started new routes. However, passengers must pay extra for baggage and meals. What does \"airfare\" mean?", "o": ["giá vé máy bay", "Giờ bay", "Hành lý ký gửi"], "a": "giá vé máy bay", "vi": "Giá vé máy bay đi châu Âu gần đây giảm vì vài hãng hàng không giá rẻ mở đường bay mới. Tuy nhiên hành khách phải trả thêm tiền hành lý và bữa ăn.", "why": "airfare = giá vé máy bay (= the price of a plane ticket). Dạng suy ra từ 'Airfare'.", "noblank": true, "say": "Airfare to Europe has dropped recently because several budget airlines started new routes. However, passengers must pay extra for baggage and meals.", "new": [{"w": "budget airlines", "vi": "hãng bay giá rẻ"}, {"w": "routes", "vi": "đường bay"}], "tw": "airfare"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm Ghi âm, trả lời bằng tiếng Anh 30–60 giây và cố dùng các từ gợi ý; trang sẽ chấm ước tính theo Fluency, Lexical Resource, Grammar, Pronunciation.", "qs": [{"type": "sp", "ctx": "Illness", "s": "Tell me about the last time you were ill. What was wrong with you, and what did you do to get better?", "vi": "Hãy kể về lần gần nhất bạn bị ốm. Bạn bị sao và đã làm gì để khỏe lại?", "words": ["What's the matter?", "have a sore throat", "have a temperature", "flu", "feel sick", "see a doctor", "go to the chemist", "have a cough", "cough medicine"], "why": "Kể theo trình tự: triệu chứng, người hỏi thăm, bạn đi đâu, kết quả; dùng although/so để nối ý.", "sample": "Last winter I caught the flu from a colleague. At first I had a sore throat and a cough, and by the evening I also had a temperature, so I felt sick and could not eat anything. My mother asked, \"What's the matter?\" and told me to see a doctor. Instead, I went to the chemist and bought some cough medicine, because I thought the problem was not serious. Although I stayed in bed for three days, I recovered quickly, and next time I will see a doctor earlier."}, {"type": "sp", "ctx": "Accidents", "s": "Have you ever hurt yourself badly? Describe what happened and how the injury was dealt with.", "vi": "Bạn đã bao giờ tự làm mình bị thương nặng chưa? Hãy mô tả chuyện gì xảy ra và vết thương được xử lý thế nào.", "words": ["cut yourself", "bleed", "put a bandage around", "ache", "hurt", "painful", "have a pain in"], "why": "Nêu bối cảnh, chuyện xảy ra, cảm giác đau, cách sơ cứu và kết quả; dùng while/when để kể.", "sample": "When I was fifteen, I cut myself while I was slicing vegetables for dinner. The knife slipped and my finger began to bleed heavily, which really frightened me. My father quickly washed the wound and put a bandage around it. It was painful for a few days, and my whole hand ached whenever I held a spoon. I also had a pain in my wrist because I had pressed so hard. Since then, I always cut food slowly, and I never hurt myself in the kitchen again."}, {"type": "sp", "ctx": "Health problems", "s": "Which health problem is the most common among people you know, and what do they usually do about it?", "vi": "Vấn đề sức khỏe nào phổ biến nhất ở những người bạn biết, và họ thường làm gì với nó?", "words": ["have a headache", "headache", "stomach ache", "backache", "suffer from", "take some tablets", "pill", "give someone some medicine", "treat"], "why": "Chọn một vấn đề, nêu nguyên nhân, cách tự chữa và khi nào cần đến bác sĩ; dùng which means để giải thích.", "sample": "In my experience, most people around me often have a headache or suffer from backache, especially those who work long hours at a computer. When the pain is mild, they usually take some tablets or a single pill from the cupboard. Parents often give their children some medicine at home, although a doctor should treat serious cases. Some of my friends also get a stomach ache after eating spicy street food, which means they have to rest for a day. Personally, I think drinking more water and moving regularly would prevent many of these problems."}, {"type": "sp", "ctx": "Hospital", "s": "Do you think people should go to hospital for every health problem? Explain your opinion.", "vi": "Bạn có nghĩ mọi vấn đề sức khỏe đều nên đến bệnh viện không? Hãy giải thích quan điểm.", "words": ["serious illness", "go into hospital", "operation", "surgeon", "surgery", "treatment", "illness", "treat"], "why": "Phân biệt bệnh nhẹ và bệnh nặng, đưa một ví dụ thực tế, kết luận bằng ý kiến cá nhân.", "sample": "I don't think so. For a minor illness, such as a cold, resting at home is usually enough, and hospitals are already crowded. However, if someone has a serious illness, they should go into hospital immediately, because proper treatment can save their life. For example, my uncle needed an operation on his heart last year. The surgeon explained that the surgery would take five hours, and thankfully it was successful. Doctors can treat many conditions today, but patients must come early, so I believe people should learn to recognise warning signs."}, {"type": "sp", "ctx": "Smoking and health", "s": "Why do some people continue to smoke or drink too much alcohol, even though they know the dangers?", "vi": "Tại sao một số người vẫn tiếp tục hút thuốc hoặc uống quá nhiều rượu dù biết nguy hiểm?", "words": ["lung cancer", "heart attack", "disease", "lungs", "liver", "illness"], "why": "Đưa ra 2-3 lý do (thói quen, căng thẳng, áp lực bạn bè), nêu hậu quả và giải pháp; dùng despite/although.", "sample": "There are several reasons. Firstly, smoking and heavy drinking become a habit, and it is very hard to quit. Secondly, many people use them to relax when they feel stressed. Despite the warnings, they believe that serious illness only happens to other people. In reality, smoking damages the lungs and can cause lung cancer, while too much alcohol harms the liver. Both can also lead to heart disease or even a heart attack. I think stricter laws and better education at school would help to reduce this problem."}, {"type": "sp", "ctx": "Food", "s": "Describe a healthy meal that you enjoy cooking. What do you use, and why do you like it?", "vi": "Hãy mô tả một bữa ăn lành mạnh bạn thích nấu. Bạn dùng gì và vì sao bạn thích?", "words": ["quinoa", "refrigerator", "different flavours", "blackberries"], "why": "Nêu món ăn, nguyên liệu, cách làm ngắn gọn, lý do thích; dùng which/because để thêm thông tin.", "sample": "My favourite healthy meal is a quinoa salad, which I make at least twice a week. I take the vegetables out of the refrigerator, chop them up and mix them with the cooked quinoa. Then I add a handful of blackberries, because they give a sweet taste and a lovely colour. I like experimenting with different flavours, such as lemon, mint or a little chilli. The dish is quick to prepare, rich in protein and, as a result, it keeps me full during long afternoons at work."}, {"type": "sp", "ctx": "Special occasion", "s": "Describe a time when you dressed up for an important event. What did you wear, and what was the atmosphere like?", "vi": "Hãy mô tả một lần bạn ăn mặc chỉnh tề cho sự kiện quan trọng. Bạn mặc gì và không khí ra sao?", "words": ["collar", "lively", "dull", "engage in"], "why": "Mô tả trang phục, nơi diễn ra, không khí, hoạt động; dùng whereas/compared with để so sánh.", "sample": "Last year I went to my cousin's wedding, and I wore a white shirt with a stiff collar and a dark suit. The hall was lively, with music, dancing and plenty of laughter, whereas my usual weekends are rather dull. Many guests engaged in traditional games, and even the elderly relatives   function spCard(q){
    const st=state[q.id];
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const used=st&&st.r?st.r.used:[];
    const chips=(q.words||[]).map(w=>`<span class="chip${used.includes(w)?' used':''}">${esc(w)}<button type="button" class="say" data-word="${esc(w)}" aria-label="Phát âm ${esc(w)}" style="padding:0 4px;border:0;background:none">${icon}</button></span>`).join('');
    const busy=R&&R.id===q.id;
    let res='';
    if(st&&st.r){
      const r=st.r,b=r.bands;
      const bandBox=(name,v,adv)=>`<div class="band"><b>${name}</b><span class="n">${v===null?'—':fmt(v)}</span><p>${esc(adv)}</p></div>`;
      res=`<div class="spres" role="status">${urls[q.id]?`<audio controls src="${urls[q.id]}"></audio>`:''}<p class="tr">“${esc(r.text)}”</p>`+
        `<p class="overall">Điểm ước tính (thang IELTS 1–8)<span class="n">${fmt(r.overall)}</span></p><div class="bands">`+
        bandBox('Độ trôi chảy và mạch lạc (Fluency &amp; Coherence)',b.f,adviceF(r))+
        bandBox('Vốn từ vựng (Lexical Resource)',b.l,adviceL(r))+
        bandBox('Độ đa dạng và chính xác ngữ pháp (Grammatical Range &amp; Accuracy)',b.g,adviceG(r))+
        bandBox('Phát âm (Pronunciation)',b.p,adviceP(r))+`</div>`+
        `<p class="disc">Điểm do trình duyệt ước tính từ văn bản nhận dạng được (tốc độ, từ nối, từ vựng, cấu trúc, độ rõ giọng), chỉ để tham khảo, không thay thế giám khảo/giáo viên. Bản ghi âm chỉ nằm trên máy bạn, không được gửi đi.</p>`+
        `<button type="button" class="ghost retry" data-retry="${q.id}">Ghi âm lại</button></div>`;
    }
    const sample=q.sample?`<details class="sample"><summary>Xem bài nói mẫu (B2)</summary><p>${esc(q.sample)}</p></details>`:'';
    return `<article class="q sp" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div>`+
      `<p class="sent">${esc(q.s)}</p><p class="vi">${esc(q.vi)}</p>`+
      `<div class="spwords"><b>Từ nên dùng:</b> ${chips}</div>`+
      `<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu hỏi ${q.n}">${icon}Nghe câu hỏi</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button></div>`+
      `<div class="rec"><button type="button" class="recbtn" data-rec="${q.id}" ${busy?'disabled':''}>● Ghi âm</button><button type="button" class="recbtn stop" data-recstop="${q.id}" ${busy?'':'disabled'}>■ Dừng &amp; chấm điểm</button><span class="rectime" id="rt-${q.id}">${busy?'':'Nói 30–60 giây, cố dùng ≥ 3 từ gợi ý'}</span><span class="recmsg" id="rm-${q.id}"></span></div>`+
      `<details class="manual"><summary>Không ghi âm được? Gõ lại lời bạn nói để chấm</summary><textarea id="mt-${q.id}" placeholder="Gõ nội dung bạn đã nói…"></textarea><button type="button" class="ghost" data-manual="${q.id}">Chấm bài gõ (không chấm phát âm)</button></details>`+
      res+sample+`</article>`;
  }
  function recMsg(id,m){const e=$('rm-'+id);if(e)e.textContent=m||'';}
  async function startRec(id){
    if(R)return;
    stopAudio();
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
    catch(e){recMsg(id,'Không truy cập được micro. Hãy cho phép micro cho trang này hoặc dùng ô gõ bên dưới.');return;}
    const chunks=[];let mr=null;
    try{mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};mr.start();}catch(e){mr=null;}
    const segs=[];let rec=null;
    R={id,stream,mr,chunks,segs,t0:Date.now(),active:true,rec:null,timer:null};
    if(SRC){
      rec=new SRC();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=ev=>{
        let interim='';
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const r=ev.results[i];
          if(r.isFinal)segs.push({t:r[0].transcript.trim(),c:r[0].confidence});else interim+=r[0].transcript;
        }
        recMsg(id,interim?'… '+interim:'');
      };
      rec.onerror=()=>{};
      rec.onend=()=>{if(R&&R.active&&R.rec===rec){try{rec.start();}catch(e){}}};
      R.rec=rec;try{rec.start();}catch(e){}
    }else recMsg(id,'Trình duyệt không hỗ trợ nhận dạng giọng nói: bài sẽ được ghi âm nhưng cần gõ lại lời nói để chấm.');
    const tick=()=>{const e=$('rt-'+id);if(e&&R)e.textContent='● '+Math.round((Date.now()-R.t0)/1000)+' giây';};
    R.timer=setInterval(tick,500);tick();
    const b1=document.querySelector(`[data-rec="${id}"]`),b2=document.querySelector(`[data-recstop="${id}"]`);
    if(b1)b1.disabled=true;if(b2)b2.disabled=false;
  }
  function stopRec(id){
    if(!R||R.id!==id)return;
    const cur=R;cur.active=false;clearInterval(cur.timer);
    const dur=(Date.now()-cur.t0)/1000;
    recMsg(id,'Đang chấm điểm…');
    try{cur.rec&&cur.rec.stop();}catch(e){}
    const finish=()=>{
      cur.stream.getTracks().forEach(t=>t.stop());
      if(cur.chunks.length){urls[id]&&URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(new Blob(cur.chunks,{type:(cur.mr&&cur.mr.mimeType)||'audio/webm'}));}
      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
