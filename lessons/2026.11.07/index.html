  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}

.fb.bad{background:var(--bad-bg)}

.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}

.newwords{color:var(--ink);font-size:14px}

.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}

.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}

.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}

.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

 noise again.", "o": ["turn down", "turn up", "turn out"], "a": "turn down", "vi": "Làm ơn vặn nhạc nhỏ xuống một chút; hàng xóm lại đang phàn nàn về tiếng ồn.", "why": "turn something down = vặn nhỏ xuống.", "new": [{"w": "complaining", "vi": "phàn nàn"}], "tw": "turn down", "ipa": "/tɜːn ˈdaʊn/"}, {"type": "mc", "ctx": "Language exchange", "s": "In our language exchange, we spend half an hour chatting and then ___ each other's mistakes in a friendly way.", "o": ["translate", "imitate", "correct"], "a": "correct", "vi": "Trong buổi trao đổi ngôn ngữ, chúng tôi trò chuyện nửa giờ rồi sửa lỗi cho nhau một cách thân thiện.", "why": "correct somebody's English = sửa lỗi tiếng Anh cho ai.", "new": [{"w": "imitate", "vi": "bắt chước"}], "tw": "correct someone's English", "ipa": "/kəˈrekt/"}, {"type": "mc", "ctx": "Lesson plan", "s": "The teacher wants us to ___ for ten minutes, then change groups and repeat the same task with someone new.", "o": ["work in a factory", "work with a partner", "wait for a bus"], "a": "work with a partner", "vi": "Giáo viên muốn chúng tôi làm việc theo cặp mười phút, rồi đổi nhóm và làm lại cùng bài với người mới.", "why": "work with a partner = làm việc theo cặp.", "tw": "work with a partner", "ipa": "/wɜːk wɪð ə ˈpɑːtnə/"}, {"type": "mc", "ctx": "Cinema seats", "s": "I can't see the screen because the man in front is very tall. Could we ___ , or should we ask the staff?", "o": ["swap places", "cross paths", "miss the point"], "a": "swap places", "vi": "Tôi không nhìn được màn hình vì người đàn ông phía trước rất cao. Chúng ta đổi chỗ được không, hay nên hỏi nhân viên?", "why": "swap places (with sb) = đổi chỗ cho nhau.", "tw": "swap places", "ipa": "/swɒp ˈpleɪsɪz/"}, {"type": "mc", "ctx": "University dorm", "s": "Because rents are so high, many students ___ a kitchen and a bathroom with several other people.", "o": ["hide", "sell", "share"], "a": "share", "vi": "Vì tiền thuê quá cao nên nhiều sinh viên dùng chung bếp và phòng tắm với nhiều ": "sensible", "ipa": "/ˈsen.sə.bəl/"}, {"type": "mc", "ctx": "Small mistake", "s": "I felt silly when I realised I had been looking for my glasses for ten minutes while they were sitting on my head. Luckily, nobody else was in the room. What does “silly” mean?", "o": ["mệt mỏi, kiệt sức", "ngớ ngẩn, ngốc nghếch", "tức giận, bực bội"], "a": "ngớ ngẩn, ngốc nghếch", "noblank": true, "say": "I felt silly when I realised I had been looking for my glasses for ten minutes while they were sitting on my head. Luckily, nobody else was in the room.", "vi": "Tôi thấy mình thật ngớ ngẩn khi nhận ra đã tìm kính mười phút trong khi nó nằm ngay trên đầu. May là không có ai khác trong phòng.", "why": "silly = stupid = dumb (adj): ngớ ngẩn, ngốc nghếch.", "new": [{"w": "realised", "vi": "nhận ra"}], "tw": "silly", "ipa": "/ˈsɪl.i/"}, {"type": "mc", "ctx": "Workplace law", "s": "Employment law often covers any dispute between a worker and a company. If both sides cannot agree, a court may have to make the final decision. What does “dispute” mean?", "o": ["tranh chấp (thường mang tính pháp lý)", "bản hợp đồng lao động", "khoản tiền thưởng"], "a": "tranh chấp (thường mang tính pháp lý)", "noblank": true, "say": "Employment law often covers any dispute between a worker and a company. If both sides cannot agree, a court may have to make the final decision.", "vi": "Luật lao động thường điều chỉnh mọi tranh chấp giữa người lao động và công ty. Nếu hai bên không thống nhất, tòa án có thể phải đưa ra quyết định cuối cùng.", "why": "dispute (n) = tranh chấp, bất đồng kéo dài.", "new": [{"w": "employment law", "vi": "luật lao động"}, {"w": "court", "vi": "tòa án"}], "tw": "dispute", "ipa": "/dɪˈspjuːt/"}, {"type": "mc", "ctx": "Healthy cooking", "s": "Asparagus is a tall green vegetable that grows in spring. Many people steam it for a few minutes and eat it with a little butter. What does “asparagus” mean?", "o": ["bông cải xanh", "cần tây", "măng tây"], "a": "măng tây", "noblank": true, "say": "Asparagus is a tall green vegetable that grows in spring. Many people steam it for a few minutes and eat it with a little butter.", "vi": "Măng tây là loại rau xanh cao mọc vào mùa xuân. Nhiều người hấp nó vài phút rồi ăn với chút bơ.", "why": "asparagus (n) = măng tây, rau xanh mùa xuân.", "new": [{"w": "steam", "vi": "hấp"}], "tw": "asparagus", "ipa": "/əˈsper.ə.ɡəs/"}, {"type": "mc", "ctx": "Restaurant visit", "s": "The waiter noticed that the customer had not touched his soup. “Is there something wrong with it?” he asked politely. What does “something wrong with” mean?", "o": ["có ai đó đang chờ", "có vấn đề gì đó với cái gì", "có thứ gì đó ngon hơn"], "a": "có vấn đề gì đó với cái gì", "noblank": true, "say": "The waiter noticed that the customer had not touched his soup. “Is there something wrong with it?” he asked politely.", "vi": "Người phục vụ nhận thấy khách chưa đụng đến món súp. “Món này có vấn đề gì không ạ?” anh hỏi lịch sự.", "why": "something wrong with sth = có vấn đề gì đó với cái gì (dạng đầy đủ: something wrong with + danh từ).", "new": [{"w": "waiter", "vi": "người phục vụ"}, {"w": "politely", "vi": "lịch sự"}], "tw": "something wrong with", "ipa": "/ˌsʌm.θɪŋ rɑːŋ wɪð ˌsʌm.θɪŋ/"}, {"type": "mc", "ctx": "Consumer rights", "s": "If a product is faulty, customers have the right to ask for their money back. Most reputable shops will give them a refund within a few days. What does “give someone a refund” mean?", "o": ["hoàn tiền cho ai", "giảm giá cho ai", "bảo hành cho ai"], "a": "hoàn tiền cho ai", "noblank": true, "say": "If a product is faulty, customers have the right to ask for their money back. Most reputable shops will give them a refund within a few days.", "vi": "Nếu sản phẩm bị lỗi, khách hàng có quyền đòi lại tiền. Hầu hết cửa hàng uy tín sẽ hoàn tiền cho họ trong vài ngày.", "why": "give sb a refund = hoàn tiền cho ai.", "new": [{"w": "reputable", "vi": "uy tín"}, {"w": "faulty", "vi": "bị lỗi"}], "tw": "give someone a refund", "ip one more speaking time. In a large group, shy students may say nothing.", "vi": "Giáo viên thường yêu cầu học sinh làm việc theo cặp vì mọi người có nhiều thời gian nói hơn. Trong nhóm lớn, học sinh nhút nhát có thể không nói gì.", "why": "work with a partner = làm việc theo cặp.", "tw": "work with a partner", "ipa": "/wɜːk wɪð ə ˈpɑːtnə/"}, {"type": "mc", "ctx": "Window seat", "s": "The two girls wanted to sit by the window, so they decided to swap places halfway through the journey. That way, both of them enjoyed the view. What does “swap places” mean?", "o": ["xin lỗi nhau", "đứng dậy", "đổi chỗ cho nhau"], "a": "đổi chỗ cho nhau", "noblank": true, "say": "The two girls wanted to sit by the window, so they decided to swap places halfway through the journey. That way, both of them enjoyed the view.", "vi": "Hai cô gái đều muốn ngồi cạnh cửa sổ nên họ quyết định đổi chỗ giữa chặng đường. Nhờ vậy cả hai đều ngắm được cảnh.", "why": "swap places (with sb) = đổi chỗ cho nhau.", "new": [{"w": "view", "vi": "cảnh quan"}], "tw": "swap places", "ipa": "/swɒp ˈpleɪsɪz/"}, {"type": "mc", "ctx": "Flat life", "s": "Flatmates usually share the kitchen and the bathroom, so they need clear rules about cleaning. Otherwise, small problems can turn into big arguments. What does “share” mean?", "o": ["cho thuê lại", "dùng chung cái gì với ai", "sở hữu riêng"], "a": "dùng chung cái gì với ai", "noblank": true, "say": "Flatmates usually share the kitchen and the bathroom, so they need clear rules about cleaning. Otherwise, small problems can turn into big arguments.", "vi": "Bạn ở chung thường dùng chung bếp và phòng tắm nên cần quy tắc dọn dẹp rõ ràng. Nếu không, chuyện nhỏ có thể thành cãi vã lớn.", "why": "share sth (with sb) = dùng chung cái gì với ai.", "new": [{"w": "flatmates", "vi": "bạn ở chung nhà"}], "tw": "share", "ipa": "/ʃeə/"}, {"type": "mc", "ctx": "Language lab", "s": "In language labs, learners listen to a recording and repeat each phrase aloud. This helps them copy the rhythm and intonation of native speakers. What does “repeat” mean?", "o": ["lặp lại (sau ai)", "đoán trước", "ghi chú"], "a": "lặp lại (sau ai)", "noblank": true, "say": "In language labs, learners listen to a recording and repeat each phrase aloud. This helps them copy the rhythm and intonation of native speakers.", "vi": "Trong phòng thực hành ngôn ngữ, người học nghe bản ghi âm và lặp lại từng cụm thành tiếng. Điều này giúp họ bắt chước nhịp điệu và ngữ điệu của người bản xứ.", "why": "repeat sth (after sb) = lặp lại sau ai.", "new": [{"w": "intonation", "vi": "ngữ điệu"}], "tw": "repeat", "ipa": "/rɪˈpiːt/"}, {"type": "mc", "ctx": "Asking for help", "s": "Mia was reading a financial article and saw the phrase “inflation rate”. She asked her tutor, “What does inflation rate mean?” and wrote down the explanation. What does “What does something mean?” mean?", "o": ["... đọc thế nào?", "... viết thế nào?", "... nghĩa là gì?"], "a": "... nghĩa là gì?", "noblank": true, "say": "Mia was reading a financial article and saw the phrase “inflation rate”. She asked her tutor, “What does inflation rate mean?” and wrote down the explanation.", "vi": "Mia đang đọc một bài báo tài chính và thấy cụm “inflation rate”. Cô hỏi gia sư: “Inflation rate nghĩa là gì?” rồi ghi lại lời giải thích.", "why": "What does … mean? = … nghĩa là gì?", "new": [{"w": "explanation", "vi": "lời giải thích"}], "tw": "What does something mean?", "ipa": "/wɒt dʌz ... miːn/"}, {"type": "mc", "ctx": "Dictionary skills", "s": "Learners often ask, “How do you pronounce this word?” when they see an unfamiliar spelling. A dictionary with audio can answer that question in seconds. What does “How do you pronounce something?” mean?", "o": ["dịch ... như thế nào?", "phát âm ... như thế nào?", "đánh vần ... như thế nào?"], "a": "phát âm ... như thế nào?", "noblank": true, "say": "Learners often ask, “How do you pronounce this word?” when they see an unfamiliar spelling. A dictionary with audio can answer that question in seconds.", "vi": "Người học thường hỏi “Từ này phát âm thế nào?” khi thấy cách viết lạ. Từ điển có âm thanh có thể trả lời trong vài giây.", "why": "How do you pronounce …? = phát âm … như thế nào?", "new": [{"w": "unfamiliar", "vi": "lạ, chưa quen"}], "tw": "How do you pronounce something?", "ipa": "/prəˈnaʊns/"}, {"type": "mc", "ctx": "Reception desk", "s": "On the phone, the receptionist said, “How do you spell your surname?” I read the letters slowly, one by one, so she could write them down correctly. What does “How do you spell something?” mean?", "o": ["đánh vần ... như thế nào?", "phát âm ... như thế nào?", "dịch ... như thế nào?"], "a": "đánh vần ... như thế nào?", "noblank": true, "say": "On the phone, the receptionist said, “How do you spell your surname?” I read the letters slowly, one by one, so she could write them down correctly.", "vi": "Qua điện thoại, lễ tân hỏi: “Họ của bạn đánh vần thế nào?” Tôi đọc từng chữ cái chậm rãi để cô ghi đúng.", "why": "How do you spell …? = đánh vần … như thế nào?", "tw": "How do you spell something?", "ipa": "/spel/"}, {"type": "mc", "ctx": "Tutor question", "s": "My tutor often asks, “How do you use the word “despite” in a sentence?” She wants to check whether we understand its grammar, not just its meaning. What does “How do you use the word something?” mean?", "o": ["tìm từ ... ở đâu?", "bỏ từ ... đi", "dùng từ ... như thế nào?"], "a": "dùng từ ... như thế nào?", "noblank": true, "say": "My tutor often asks, “How do you use the word “despite” in a sentence?” She wants to check whether we understand its grammar, not just its meaning.", "vi": "Gia sư thường hỏi: “Bạn dùng từ “despite” trong câu thế nào?” Cô muốn kiểm tra chúng tôi hiểu ngữ pháp, không chỉ nghĩa của từ.", "why": "How do you use the word …? = dùng từ … như thế nào?", "tw": "How do you use the word something?", "ipa": "/juːz/"}, {"type": "mc", "ctx": "Grammar class", "s": "In the grammar class, the teacher explained the difference between “since” and “for”. After that, the students made far fewer mistakes with time expressions. What does “explain the difference between A and B” mean?", "o": ["chọn A hoặc B", "giải thích sự khác nhau giữa A và B", "so sánh giá của A và B"], "a": "giải thích sự khác nhau giữa A và B", "noblank": true, "say": "In the grammar class, the teacher explained the difference between “since” and “for”. After that, the students made far fewer mistakes with time expressions.", "vi": "Trong giờ ngữ pháp, giáo viên giải thích sự khác nhau giữa “since” và “for”. Sau đó học sinh mắc ít lỗi hơn nhiều với các cụm chỉ thời gian.", "why": "explain the difference between A and B = giải thích sự khác nhau giữa A và B.", "new": [{"w": "expressions", "vi": "cách diễn đạt"}], "tw": "explain the difference between A and B", "ipa": "/ɪkˈspleɪn/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Stationery and studying", "s": "Describe the things you keep in your pencil case or on your desk when you study. How do you use them to prepare for an exam?", "vi": "Hãy mô tả những thứ bạn để trong hộp bút hoặc trên bàn khi học. Bạn dùng chúng để chuẩn bị cho kỳ thi như thế nào?", "words": ["rubber", "ruler", "pencil sharpener", "highlighter pen", "rub out", "sharpen", "highlight", "measure"], "why": "Liệt kê vài đồ dùng, nói mỗi món dùng để làm gì, rồi kể một thói quen ôn thi cụ thể.", "sample": "On my desk there is always a small pencil case. Inside, I keep a rubber, a ruler and a pencil sharpener. When I make a mistake, I rub out the line and write it again. Before an exam, I sharpen my pencils and use a highlighter pen to highlight the key definitions in my notes. I also measure the margins with the ruler so that my diagrams look neat. Although it sounds old-fashioned, this routine calms me down, and it helps me remember information much more easily than typing on a screen."}, {"type": "sp", "ctx": "Electricity at home", "s": "Do you often have problems charging your devices at home or when you travel? Tell me about a time when you could not find a suitable power point.", "vi": "Bạn có hay gặp vấn đề khi sạc thiết bị ở nhà hoặc khi đi du lịch không? Hãy kể về lần bạn không tìm được ổ điện phù hợp.", "words": ["plug", "socket", "plug in", "turn up", "turn down"], "why": "Kể tình huống, nói vấn đề với phích cắm và ổ cắm, rồi bạn đã xử lý ra sao.", "sample": "Last year I travelled to London for a conference, and my phone was almost dead when I reached the hotel. The plug of my charger did not fit the socket, so I had to ask reception for an adapter. While I waited, I looked for another socket in the lobby, but all of them were taken. Finally I managed to plug in my phone and go to bed. In the morning the radio was so loud that I had to turn down the volume, but later I wanted to turn up the heating because the room was cold."}, {"type": "sp", "ctx": "Sharing and borrowing", "s": "Do you prefer to borrow things from friends or buy your own? Tell me about something you lent to someone, and what happened.", "vi": "Bạn thích mượn đồ của bạn bè hay tự mua? Hãy kể về một thứ bạn từng cho ai đó mượn và chuyện gì đã xảy ra.", "words": ["borrow", "lend someone something", "lend something to someone", "share"], "why": "Nói quan điểm, rồi kể kỷ niệm về việc cho mượn hoặc đi mượn và bài học rút ra.", "sample": "I usually prefer to borrow things only when I really need them, because I worry about losing something that belongs to someone else. Once I decided to lend my friend a book about economics, and I regretted it because he never returned it. Now I never lend books to people unless they promise to return them. On the other hand, I am happy to lend someone my umbrella when it rains. At university I used to share a flat with three students, and we learned to share the kitchen and the bills fairly."}, {"type": "sp", "ctx": "Classroom cooperation", "s": "Think about a lesson where you worked with a classmate. How did you cooperate, and did the teacher or your friend help you improve your English?", "vi": "Hãy nghĩ về một giờ học bạn làm việc với bạn cùng lớp. Hai bạn đã phối hợp thế nào và ai đã giúp bạn cải thiện tiếng Anh?", "words": ["partner", "work with a partner", "swap places", "correct someone's English", "repeat"], "why": "Kể bối cảnh lớp học, vai trò của bạn cặp, việc sửa lỗi và kết quả.", "sample": "In my last English course the teacher often asked us to work with a partner. My partner was patient, and she used to correct my English whenever I made a grammar mistake. We also had to repeat difficult sentences several times until our pronunciation improved. Sometimes we had to swap places so that everybody could speak with different classmates. At first I felt nervous, but after a few weeks I became more confident. I think this kind of cooperation is more useful than listening to a long lecture, because you get immediate feedback."}, {"type": "sp", "ctx": "Learning strategies", "s": "What do you do when you meet an unfamiliar word or sentence in English? Describe the questions you usually ask your teacher or yourself.", "vi": "Bạn làm gì khi gặp từ hoặc câu lạ trong tiếng Anh? Hãy mô tả những câu hỏi bạn thường hỏi giáo viên hoặc chính mình.", "words": ["look up", "What does something mean?", "How do you pronounce something?", "How do you spell something?", "How do you use the word something?", "explain the difference between A and B"], "why": "Mô tả quy trình: tra từ, hỏi nghĩa, cách đọc, cách viết, cách dùng và sự khác nhau.", "sample": "When I meet an unfamiliar word, I first try to guess the meaning from the context. If I am still confused, I look up the word in an online dictionary. In class I often ask, what does this word mean, and how do you pronounce it? Sometimes I also ask how to spell it and how do you use the word in a sentence. If two words look similar, I ask my teacher to explain the difference between them. Last week I asked about lend and borrow, and now I finally understand the difference."}, {"type": "sp", "ctx": "Road safety", "s": "Describe a dangerous road or junction in your city. What makes it risky, and what could the authorities do to make it safer for drivers and walkers?", "vi": "Hãy mô tả một con đường hoặc giao lộ nguy hiểm trong thành phố bạn. Điều gì khiến nó rủi ro và chính quyền có thể làm gì để an toàn hơn?", "words": ["bend", "pedestrian crossing", "crosswalk", "crossing the road", "road sign"], "why": "Nêu địa điểm, lý do nguy hiểm, rồi đề xuất giải pháp cụ thể.", "sample": "There is a dangerous road near my old school. It has a sharp bend just before the main gate, and the road bends again after the bridge, so drivers cannot see children early enough. Although there is a pedestrian crossing, many people prefer to run across because cars rarely stop. In the United States this place would have a clear crosswalk. I think the city should put up a bigger road sign and install traffic lights, so that crossing the road becomes much safer."}, {"type": "sp", "ctx": "Driving and distance", "s": "Do you enjoy driving, or would you rather take public transport? Tell me about a long journey you made and what the roads were like.", "vi": "Bạn thích lái xe hay muốn đi phương tiện công cộng hơn? Hãy kể về một chuyến đi dài và tình trạng đường xá.", "words": ["inside lane", "outside lane", "away", "you don't get many"], "why": "Nêu sở thích, kể chuyến đi, mô tả đường cao tốc và khoảng cách.", "sample": "I would rather take the train, but last summer my uncle drove us to a village that is about two hundred kilometres away. On the motorway he stayed in the inside lane for most of the time because he is a careful driver. Only when he wanted to overtake a lorry did he move into the outside lane. The area was beautiful but very quiet; you don't get many shops or restaurants there, so we brought our own food. It was an unusual trip, but I enjoyed the silence."}, {"type": "sp", "ctx": "Difficult workplace moments", "s": "Tell me about a time when people disagreed strongly at work or at school. How was the atmosphere, and what did people say or do?", "vi": "Hãy kể về lần mọi người bất đồng gay gắt ở nơi làm việc hoặc trường học. Bầu không khí ra sao và mọi người đã nói hoặc làm gì?", "words": ["tense meeting", "raise your voice at someone", "in the heat of the moment", "in front of people", "one-on-one", "job description", "absolute last time"], "why": "Mô tả cuộc họp, người nào lớn tiếng, hậu quả và điều bạn rút ra.", "sample": "Two years ago I attended a tense meeting about our new project. One colleague was angry about his job description, and in the heat of the moment he raised his voice at the manager in front of people. Everyone went silent. Later the manager invited him to a one-on-one conversation to talk calmly. She said clearly that this was the absolute last time she would accept that kind of behaviour. I learned that discussing problems in private is much more effective than arguing in public."}, {"type": "sp", "ctx": "Making peace", "s": "Imagine that you had an argument with a friend or a colleague. How would you fix the relationship, and what would you expect from the other person?", "vi": "Hãy tưởng tượng bạn cãi nhau với bạn bè hoặc đồng nghiệp. Bạn sẽ hàn gắn mối quan hệ thế nào và mong đợi gì từ người kia?", "words": ["address someone about something", "have a conversation like adults", "apologize for your behavior", "be mature enough to do something", "as long as it doesn't happen again", "dispute"], "why": "Nói các bước: bình tĩnh, nói chuyện trực tiếp, xin lỗi, đặt điều kiện cho tương lai.", "sample": "If I had a dispute with a colleague, I would first wait until I felt calm. Then I would address him about the problem directly and suggest that we have a conversation like adults. If I was wrong, I would apologize for my behavior without making excuses. I think most people are mature enough to accept an honest apology. I would forgive him as long as it doesn't happen again, because relationships at work are too important to be damaged by one bad day."}, {"type": "sp", "ctx": "Everyday situations", "s": "Tell me about a time when you were disappointed with a product or a meal, or when you felt silly in public. What happened next?", "vi": "Hãy kể về lần bạn thất vọng với một sản phẩm hoặc bữa ăn, hoặc lần thấy mình ngớ ngẩn nơi công cộng. Sau đó chuyện gì xảy ra?", "words": ["something wrong with", "give someone a refund", "sensible", "silly", "asparagus"], "why": "Kể sự việc, phản ứng của bạn, cách giải quyết và cảm xúc cuối cùng.", "sample": "Last month I ordered a meal with grilled fish and asparagus in a new restaurant. When it arrived, there was something wrong with the fish; it was cold and tasted strange. I felt silly complaining at first, but my friend said it was the sensible thing to do. I called the waiter, and he apologised politely and decided to give me a refund. I was relieved, although I was still hungry. Since then I always check the food carefully before I start eating."}]}]};

      R=null;
      const q=byId[id];
      if(!cur.segs.length){refreshCard(id);recMsg(id,SRC?'Chưa nhận được giọng nói. Hãy nói to, rõ hơn rồi ghi lại, hoặc gõ lời nói vào ô bên dưới.':'Hãy gõ lại lời bạn nói vào ô bên dưới để chấm.');return;}
      state[id]={c:true,r:evaluate(q,cur.segs,dur)};save();refreshCard(id);
    };
    if(cur.mr&&cur.mr.state!=='inactive'){cur.mr.onstop=()=>setTimeout(finish,600);try{cur.mr.stop();}catch(e){setTimeout(finish,600);}}
    else setTimeout(finish,600);
  }
  function manualEval(id){
    const el=$('mt-'+id),v=el?el.value.trim():'';
    if(toks(v).length<5){recMsg(id,'Hãy gõ ít nhất vài câu.');return;}
    const dur=0;
    state[id]={c:true,r:evaluate(byId[id],[{t:v}],dur)};save();refreshCard(id);
  }

  /* ---------- render ---------- */
  function cardHTML(q){
    if(q.type==='sp')return spCard(q);
    const st=state[q.id];
    const done=!!st;
    const cls=done?(st.c?'good':'bad'):'';
    let sentence;
    if(q.type==='mc'){
      const slot=done?`<span class="slot ${cls}">${esc(st.v)}</span>`:`<span class="slot empty" aria-label="chỗ trống">_____</span>`;
      sentence=q.s.replace('___',slot);
    }else{
      const inp=`<input class="blank ${cls}" id="in-${q.id}" data-q="${q.id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền vào chỗ trống, câu ${q.n}" ${done?`value="${esc(st.v)}" disabled`:''}>`;
      sentence=(q.listen&&!done)?`<span class="ctx">Nghe rồi gõ từ còn thiếu:</span> ${inp}`:q.s.replace('___',inp);
    }
    let body='';
    if(q.type==='mc'){
      body=`<div class="opts" role="group" aria-label="Đáp án">`+q.opts.map(o=>{
        let c='opt';
        if(done){if(o===q.a)c+=' right';else if(o===st.v)c+=' wrong';}
        return `<button type="button" class="${c}" data-q="${q.id}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`;
      }).join('')+`</div>`;
    }else if(!done){
      body=`<button type="button" class="check" data-check="${q.id}">Kiểm tra</button>`;
    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
