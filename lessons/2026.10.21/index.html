  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}

.fb.bad{background:var(--bad-bg)}

.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}
.manual summary{cursor:pointer;color:var(--muted)}

.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.band .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--primary)}
.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

iều chất xơ”, sản phẩm có lẽ chứa nhiều ngũ cốc nguyên hạt, hỗ trợ tiêu hóa và giữ đường huyết ổn định hơn.", "why": "fiber (AmE) = chất xơ trong thực phẩm, giúp tiêu hóa; high-fiber diet, fiber-rich foods. (Anh-Anh: fibre).", "tw": "fiber", "new": [{"w": "digestion", "vi": "tiêu hóa"}, {"w": "steadier", "vi": "ổn định hơn"}], "ipa": "/ˈfaɪ.bɚ/"}, {"type": "mc", "ctx": "American movie", "s": "“Can you lend me a few ___ until payday?” he asked. “I forgot my wallet, and I need to take the bus home.”", "o": ["bucks", "pages", "miles"], "a": "bucks", "vi": "“Cho tớ mượn vài đô đến ngày lãnh lương nhé?” anh hỏi. “Tớ quên ví, và cần đi xe buýt về nhà.”", "why": "bucks = tiền đô la (tiếng lóng Mỹ); a few bucks, fifty bucks, spend big bucks. Thân mật, không dùng trong văn bản trang trọng.", "tw": "bucks", "new": [{"w": "lend", "vi": "cho mượn"}, {"w": "payday", "vi": "ngày lãnh lương"}], "ipa": "/bʌk/"}, {"type": "mc", "ctx": "Thank-you speech", "s": "She said she ___ her success to her teachers, because without their patience she would never have passed the national exam.", "o": ["owed", "ignored", "doubted"], "a": "owed", "vi": "Cô nói cô mang ơn thầy cô cho thành công của mình, vì không có sự kiên nhẫn của họ cô đã không bao giờ đỗ kỳ thi quốc gia.", "why": "owe sb sth / owe sth to sb = nợ ai cái gì; I owe you $10; owe someone a favour. Không dùng thì tiếp diễn thông thường.", "tw": "owed", "new": [{"w": "patience", "vi": "sự kiên nhẫn"}, {"w": "national", "vi": "quốc gia"}], "ipa": "/oʊ/"}, {"type": "mc", "ctx": "Software shop", "s": "The program’s ___ price covers only the main features, so businesses that need extra users must choose a more expensive plan.", "o": ["base", "final", "total"], "a": "base", "vi": "Giá cơ bản của chương trình chỉ gồm tính năng chính, nên doanh nghiệp cần thêm người dùng phải chọn gói đắt hơn.", "why": "base price = giá gốc chưa gồm dịch vụ thêm; the base price is low but extras cost more. Hay gặp: base price plus tax.", "tw": "base", "new": [{"w": "plan", "vi": "gói dịch vụ"}, {"w": "covers", "vi": "bao gồm"}]}, {"type": "mc", "ctx": "Bank advice", "s": "If you ___ money regularly, even small amounts, your balance will grow steadily, whereas leaving cash at home earns nothing.", "o": ["deposit", "borrow", "waste"], "a": "deposit", "vi": "Nếu bạn gửi tiền đều đặn, dù số nhỏ, số dư sẽ tăng đều, trong khi để tiền mặt ở nhà không sinh lời.", "why": "deposit (v) = gửi tiền vào ngân hàng; (n) = tiền gửi / tiền đặt cọc; pay a deposit, deposit money into an account.", "tw": "deposit", "new": [{"w": "balance", "vi": "số dư"}, {"w": "steadily", "vi": "đều đặn"}], "ipa": "/dɪˈpɑː.zɪt/"}, {"type": "mc", "ctx": "Job interview", "s": "He didn’t have much experience, but he ___ to impress the panel with his clear answers and calm attitude.", "o": ["managed", "refused", "pretended"], "a": "managed", "vi": "Anh không có nhiều kinh nghiệm, nhưng anh đã gây ấn tượng với hội đồng bằng câu trả lời rõ ràng và thái độ bình tĩnh.", "why": "manage to + V = làm được việc khó; I managed to finish on time. Khác can: nhấn mạnh sự cố gắng và đã thành công.", "tw": "managed", "new": [{"w": "panel", "vi": "hội đồng phỏng vấn"}, {"w": "attitude", "vi": "thái độ"}]}, {"type": "mc", "ctx": "Museum visit", "s": "Since our daughter has always been fascinated by dinosaurs, she is deeply ___ in every exhibition that explains how they lived.", "o": ["interested", "bored", "tired"], "a": "interested", "vi": "Vì con gái chúng tôi luôn mê khủng long, con rất quan tâm đến mọi triển lãm giải thích cách chúng sống.", "why": "be interested in + N/V-ing = quan tâm đến; I’m interested in learning… Đừng nhầm interested (người cảm thấy) với interesting (vật gây hứng thú).", "tw": "interested", "new": [{"w": "fascinated", "vi": "bị mê hoặc"}, {"w": "exhibition", "vi": "triển lãm"}]}, {"type": "mc", "ctx": "Negotiation", "s": "After hearing that the supplier would deliver on Mondays only, the shop owner said, “___,” and agreed to the new arrangement.", "o": ["That sounds reasonable to me", "That is completely impossible", "I don’t care about it"], "a": "That sounds reasonable to me", "vi": "Sau khi nghe nhà cung cấp chỉ giao hàng vào thứ Hai, chủ cửa hàng nói, “Tôi thấy hợp lý,” và đồng ý cách sắp xếp mới.", "why": "That sounds reasonable (to me) = nghe hợp lý với tôi; dùng để đồng ý lịch sự khi nghe đề xuất. Reasonable = hợp lý, phải chăng.", "tw": "That sounds reasonable to me", "new": [{"w": "supplier", "vi": "nhà cung cấp"}, {"w": "arrangement", "vi": "sự sắp xếp"}]}, {"type": "mc", "ctx": "Climate report", "s": "Cutting emissions now is expensive; ___, however, it will save billions by reducing storm damage and health costs.", "o": ["in the long term", "in the short term", "in the past"], "a": "in the long term", "vi": "Cắt giảm khí thải bây giờ thì tốn kém; tuy nhiên về lâu dài nó sẽ tiết kiệm hàng tỷ nhờ giảm thiệt hại bão và chi phí y tế.", "why": "in the long term = xét về lâu dài (opp: in the short term); in the long term, regular exercise improves health.", "tw": "in the long term", "new": [{"w": "emissions", "vi": "khí thải"}, {"w": "billions", "vi": "hàng tỷ"}]}, {"type": "mc", "ctx": "Student life", "s": "Although she wanted to volunteer abroad, she said, “I don’t have ___ courage to travel alone yet,” and decided to start closer to home.", "o": ["enough", "many", "every"], "a": "enough", "vi": "Dù muốn đi tình nguyện ở nước ngoài, cô nói, “Tớ chưa đủ can đảm đi một mình,” và quyết định bắt đầu gần nhà hơn.", "why": "I don’t have enough + N + to + V = không đủ (thời gian/tiền/sức) để làm gì; enough đứng trước danh từ.", "tw": "enough", "new": [{"w": "volunteer", "vi": "tình nguyện"}, {"w": "courage", "vi": "can đảm"}]}, {"type": "mc", "ctx": "Football team", "s": "The coach decided to rest his star player, saying, “Muscles ___ time to recover, and one more match could make the injury worse.”", "o": ["need", "avoid", "forget"], "a": "need", "vi": "Huấn luyện viên quyết định cho cầu thủ ngôi sao nghỉ, nói, “Cơ bắp cần thời gian hồi phục, và thêm một trận có thể làm chấn thương tệ hơn.”", "why": "need time to recover = cần thời gian để hồi phục (sức khỏe, thể thao); recover from an illness / an injury.", "tw": "need", "new": [{"w": "star player", "vi": "cầu thủ ngôi sao"}, {"w": "injury", "vi": "chấn thương"}]}, {"type": "mc", "ctx": "City planning", "s": "Closing the main road will cause traffic jams ___, although it should make the centre safer and cleaner afterwards.", "o": ["in the short term", "in the long term", "in the past"], "a": "in the short term", "vi": "Đóng đường chính sẽ gây kẹt xe trong ngắn hạn, dù sau đó sẽ làm trung tâm an toàn và sạch hơn.", "why": "in the short term = trong thời gian ngắn trước mắt (opp: in the long term); in the short term, overtime may raise output.", "tw": "in the short term", "new": [{"w": "traffic jams", "vi": "kẹt xe"}, {"w": "afterwards", "vi": "sau đó"}]}, {"type": "mc", "ctx": "Chat", "s": "Life is unpredictable; ___, so there is no point worrying too much about one bad month.", "o": ["sometimes you’re up, sometimes you’re down", "every day is exactly the same", "money solves every problem"], "a": "sometimes you’re up, sometimes you’re down", "vi": "Cuộc sống khó đoán; có lúc thăng, có lúc trầm, nên chẳng cần lo quá về một tháng tệ.", "why": "Sometimes you’re up, sometimes you’re down = cuộc sống có lúc thuận lợi, có lúc khó khăn; dùng để an ủi, chấp nhận thăng trầm.", "tw": "sometimes you’re up, sometimes you’re down", "new": [{"w": "unpredictable", "vi": "khó đoán"}, {"w": "no point", "vi": "vô ích"}]}, {"type": "mc", "ctx": "Business deal", "s": "Once the final invoice was paid and both sides signed the paper, the director shook hands and said, “Good, ___.”", "o": ["we’re settled", "we’re late", "we’re lost"], "a": "we’re settled", "vi": "Khi hóa đơn cuối được thanh toán và hai bên ký giấy, giám đốc bắt tay và nói, “Tốt, vậy là xong.”", "why": "We’re settled = đã xong xuôi, không còn nợ nhau (sau khi trả tiền/giải it"], "a": "There you go", "vi": "Dược sĩ cho thuốc vào túi giấy, đẩy qua quầy và nói, “Đây nhé. Uống hai viên sau bữa tối.”", "why": "There you go. = xong rồi đấy / đây (khi đưa đồ hoặc xác nhận đã hoàn thành việc nhờ); thân mật.", "tw": "There you go", "new": [{"w": "tablets", "vi": "viên thuốc"}, {"w": "slid", "vi": "đẩy trượt"}]}, {"type": "mc", "ctx": "At the mechanic", "s": "Once the mechanic finished repairing the brakes, Mr Lee asked, “___?” and prepared to pay by card.", "o": ["How much do I owe you", "How far is it", "How long have you worked"], "a": "How much do I owe you", "vi": "Khi thợ máy sửa phanh xong, ông Lee hỏi, “Tôi nợ anh bao nhiêu?” và chuẩn bị trả bằng thẻ.", "why": "How much do I owe you? = tôi nợ/phải trả bạn bao nhiêu (khi chia tiền, thanh toán); trả lời: You owe me …", "tw": "How much do I owe you", "new": [{"w": "mechanic", "vi": "thợ máy"}, {"w": "brakes", "vi": "phanh"}]}, {"type": "mc", "ctx": "Print shop", "s": "I’d like to print fifty copies in colour, double-sided. ___? I need to know before I decide on the paper quality.", "o": ["How much will it be", "How old are you", "How was the weather"], "a": "How much will it be", "vi": "Tôi muốn in năm mươi bản màu, hai mặt. Hết bao nhiêu? Tôi cần biết trước khi chọn chất lượng giấy.", "why": "How much will it be? = hết bao nhiêu tiền (hỏi tổng giá khi mua hàng/dịch vụ); thường thêm altogether = tính tất cả.", "tw": "How much will it be", "new": [{"w": "copies", "vi": "bản sao"}, {"w": "double-sided", "vi": "hai mặt"}]}, {"type": "mc", "ctx": "Art gallery", "s": "The paintings ___ the artist’s childhood in a small fishing village, with sad colours and quiet scenes of empty boats.", "o": ["reflect", "hide", "borrow"], "a": "reflect", "vi": "Các bức tranh phản ánh tuổi thơ của họa sĩ ở làng chài nhỏ, với màu buồn và cảnh yên lặng của những con thuyền trống.", "why": "reflect sth = phản ánh/thể hiện; the results reflect students’ abilities; reflect on = suy ngẫm. Hay gặp: reflect the situation / reflect changes.", "tw": "reflect", "new": [{"w": "fishing village", "vi": "làng chài"}, {"w": "scenes", "vi": "cảnh"}], "ipa": "/rɪˈflekt/"}, {"type": "mc", "ctx": "Campus", "s": "Although the queue was long, the barista made the coffee ___ quick, so most students still arrived on time for the lecture.", "o": ["real", "real quickly", "very"], "a": "real", "vi": "Dù hàng dài, người pha chế làm cà phê rất nhanh, nên đa số sinh viên vẫn kịp giờ bài giảng.", "why": "real quick = thật nhanh/một chút thôi (khẩu ngữ Mỹ); Can I ask you something real quick? Dùng để xin phép ngắt lời lịch sự.", "tw": "real", "new": [{"w": "queue", "vi": "hàng người"}, {"w": "barista", "vi": "người pha cà phê"}]}, {"type": "mc", "ctx": "Advisor meeting", "s": "“Stocks might ___ higher returns than bonds over twenty years, yet their value can fall sharply in a single month,” the advisor said.", "o": ["pay", "wash", "hide"], "a": "pay", "vi": "“Cổ phiếu có thể mang lại lợi nhuận cao hơn trái phiếu trong hai mươi năm, nhưng giá trị có thể giảm mạnh trong một tháng,” cố vấn nói.", "why": "pay (higher) returns = mang lại lợi nhuận (cao); investment returns = lợi nhuận đầu tư; higher return thường đi kèm higher risk.", "tw": "pay", "new": [{"w": "bonds", "vi": "trái phiếu"}, {"w": "advisor", "vi": "cố vấn"}], "ipa": "/peɪ ˈhaɪ.ər rɪˈtɜːnz/"}, {"type": "mc", "ctx": "Traffic", "s": "The officer explained that drivers who park illegally must ___ a small fine, although repeated offences can lead to a much heavier penalty.", "o": ["pay", "charge", "win"], "a": "pay", "vi": "Cảnh sát giải thích rằng tài xế đỗ xe trái phép phải nộp phạt nhỏ, dù tái phạm có thể dẫn đến hình phạt nặng hơn nhiều.", "why": "pay a fine = nộp phạt; pay a small fine / a heavy fine; a fine for sth. Dùng với withdraw early, parking, late return.", "tw": "pay", "new": [{"w": "offences", "vi": "hành vi vi phạm"}, {"w": "penalty", "vi": "hình phạt"}], "ipa": "/peɪ ə smɔːl faɪn/"}, {"type": "mc", "ctx": "Investment seminar", "s": "Investors who ___ not to withdraw their money early are rewarded with higher returns, since the bank can plan its own lending more safely.", "o": ["agree", "refuse", "forget"], "a": "agree", "vi": "Nhà đầu tư đồng ý không rút tiền sớm được thưởng lợi nhuận cao hơn, vì ngân hàng có thể lên kế hoạch cho vay an toàn hơn.", "why": "agree not to + V = đồng ý/cam kết không làm gì; with a CD you agree not to withdraw money for a fixed period.", "tw": "agree", "new": [{"w": "rewarded", "vi": "được thưởng"}, {"w": "lending", "vi": "việc cho vay"}], "ipa": "/əˈɡriː nɒt tə wɪðˈdrɔː/"}, {"type": "mc", "ctx": "Pension plan", "s": "The pension scheme uses money from workers’ monthly contributions and ___ it in safe assets, so retired people receive a steady payment.", "o": ["invests", "spends", "loses"], "a": "invests", "vi": "Quỹ hưu trí dùng tiền đóng góp hằng tháng của người lao động và đầu tư vào tài sản an toàn, để người đã nghỉ hưu nhận khoản trả đều.", "why": "invest money from + nguồn = đầu tư tiền có từ …; invest in sth = đầu tư vào. A fund invests money from investors in financial products.", "tw": "invests", "new": [{"w": "contributions", "vi": "khoản đóng góp"}, {"w": "assets", "vi": "tài sản"}], "ipa": "/ɪnˈvest ˈmʌn.i frəm/"}, {"type": "mc", "ctx": "Financial seminar", "s": "Experts recommend that you do not ___ all your money in a single company, because if it fails, you may lose everything at once.", "o": ["place", "cut", "stop"], "a": "place", "vi": "Chuyên gia khuyên bạn không nên đặt tất cả tiền vào một công ty duy nhất, vì nếu nó thất bại bạn có thể mất tất cả cùng lúc.", "why": "place money in + nơi chốn = gửi/để tiền vào (tài khoản, quỹ); place + O + in/on. Dùng trang trọng hơn put.", "tw": "place", "new": [{"w": "recommend", "vi": "khuyên"}, {"w": "fails", "vi": "thất bại"}], "ipa": "/pleɪs ˈmʌn.i ɪn/"}, {"type": "mc", "ctx": "Policy debate", "s": "Critics say the scheme should ___ savings up to a higher amount, since many families keep more than the current limit in one account.", "o": ["guarantee", "predict", "cancel"], "a": "guarantee", "vi": "Người phê bình nói chương trình nên bảo đảm tiền tiết kiệm đến mức cao hơn, vì nhiều gia đình giữ nhiều hơn giới hạn hiện tại trong một tài khoản.", "why": "guarantee sth up to + số tiền = bảo đảm đến mức nào; the government guarantees savings up to a limit.", "tw": "guarantee", "new": [{"w": "critics", "vi": "người phê bình"}, {"w": "current", "vi": "hiện tại"}], "ipa": "/ˌɡær.ənˈtiː ˈseɪ.vɪŋz ʌp tuː/"}, {"type": "mc", "ctx": "Teen complaint", "s": "“I’m bored,” said Hoa on the phone. “___ much to do here on Sundays, and my friends all live on the other side of the city.”", "o": ["There isn’t", "There aren’t", "It isn’t"], "a": "There isn’t", "vi": "“Tớ chán quá,” Hoa nói qua điện thoại. “Chủ nhật ở đây không có nhiều thứ để làm, mà bạn tớ đều ở phía bên kia thành phố.”", "why": "There isn’t much to do (in + nơi) = ít hoạt động giải trí; thường nói về nơi nhỏ, vắng: in the village, at night.", "tw": "There isn’t", "new": [{"w": "bored", "vi": "chán"}, {"w": "side", "vi": "phía"}], "ipa": "/ðeər ˈɪz.ənt mʌtʃ tə duː/"}, {"type": "mc", "ctx": "Interview", "s": "___ from speaking three languages, she has also lived abroad for five years, which makes her an ideal candidate for the job.", "o": ["Apart", "Except", "Because"], "a": "Apart", "vi": "Ngoài việc nói ba thứ tiếng, cô còn sống ở nước ngoài năm năm, khiến cô là ứng viên lý tưởng cho công việc.", "why": "apart from + N/V-ing = ngoài ra / ngoại trừ; Apart from going to the market, there isn't much to do.", "tw": "Apart", "new": [{"w": "abroad", "vi": "ở nước ngoài"}, {"w": "ideal", "vi": "lý tưởng"}], "ipa": "/əˈpɑːt frəm/"}, {"type": "mc", "ctx": "Mountain trip", "s": "The summit looked close, yet it was still two hours ___ on foot, and the clouds were getting darker behind the ridge.", "o": ["away", "ahead", "apart"], "a": "away", "vi": "Đỉnh núi trông gần, nhưng vẫn còn cách hai giờ đi bộ, và mây phía sau dải núi đang tối dần.", "why": "[khoảng cách] + away = cách đây/đó bao xa; The nearest town is eight miles away. Cấu trúc: far away, two kilometres away.", "tw": "away", "new": [{"w": "summit", "vi": "đỉnh núi"}, {"w": "ridge", "vi": "dải núi"}], "ipa": "/əˈweɪ/"}, {"type": "mc", "ctx": "Rescue story", "s": "After three days without food or water, the lost hikers felt the situation was ___, until they heard a helicopter above the forest.", "o": ["hopeless", "comfortable", "exciting"], "a": "hopeless", "vi": "Sau ba ngày không đồ ăn, nước uống, những người đi bộ lạc đường cảm thấy tình hình vô vọng, cho đến khi họ nghe trực thăng trên rừng.", "why": "hopeless = tệ/vô dụng (khẩu ngữ) hoặc vô vọng; be hopeless at sth = rất kém ở việc gì; hopeless situation.", "tw": "hopeless", "new": [{"w": "helicopter", "vi": "trực thăng"}, {"w": "lost", "vi": "bị lạc"}], "ipa": "/ˈhəʊp.ləs/"}, {"type": "mc", "ctx": "Job market", "s": "“Honestly, ___ many chances like this,” the recruiter said. “If you want the position, you should apply before Friday.”", "o": ["you don’t get", "you can’t make", "you never keep"], "a": "you don’t get", "vi": "“Thật lòng mà nói, không có nhiều cơ hội như thế này đâu,” nhà tuyển dụng nói. “Nếu muốn vị trí này, bạn nên nộp đơn trước thứ Sáu.”", "why": "you don’t get many + N (đếm được, số nhiều) = ít khi có nhiều …; You don't get many shops in small villages.", "tw": "you don’t get", "new": [{"w": "recruiter", "vi": "nhà tuyển dụng"}, {"w": "apply", "vi": "nộp đơn"}], "ipa": "/ju dəʊnt ɡet ˈmen.i/"}, {"type": "mc", "ctx": "Landscape", "s": "Compared with a mountain, a ___ is lower and easier to climb, so even young children can walk to the top in under an hour.", "o": ["hill", "river", "island"], "a": "hill", "vi": "So với núi, đồi thấp hơn và dễ leo hơn, nên ngay cả trẻ nhỏ cũng có thể đi lên đỉnh trong chưa đến một giờ.", "why": "hill = đồi (thấp hơn núi: mountain); a green hill, climb a hill, on a hillside. Đối với núi dùng mountain.", "tw": "hill", "new": [{"w": "compared with", "vi": "so với"}, {"w": "under", "vi": "dưới"}], "ipa": "/hɪl/"}, {"type": "mc", "ctx": "Farming", "s": "Because the soil is rich and the climate is mild, this ___ has produced excellent grapes for more than two hundred years.", "o": ["valley", "desert", "harbour"], "a": "valley", "vi": "Vì đất màu mỡ và khí hậu ôn hòa, thung lũng này đã sản xuất nho tuyệt hảo hơn hai trăm năm.", "why": "valley = thung lũng, vùng đất thấp giữa các đồi/núi, thường có sông; in a valley, a fertile valley.", "tw": "valley", "new": [{"w": "soil", "vi": "đất"}, {"w": "mild", "vi": "ôn hòa"}], "ipa": "/ˈvæl.i/"}, {"type": "mc", "ctx": "Sports club", "s": "Heavy rain had turned the football ___ into a swamp, so the referee cancelled the match and sent both teams home.", "o": ["field", "kitchen", "corridor"], "a": "field", "vi": "Mưa lớn biến sân bóng thành đầm lầy, nên trọng tài hủy trận và cho cả hai đội về nhà.", "why": "field = cánh đồng/bãi đất (trồng trọt, chăn thả, thể thao); work in the fields, a football field. Số nhiều: fields.", "tw": "field", "new": [{"w": "swamp", "vi": "đầm lầy"}, {"w": "referee", "vi": "trọng tài"}], "ipa": "/fiːld/"}, {"type": "mc", "ctx": "Estate agent", "s": "The agent described the property as a spacious ___ with a large kitchen, two barns and enough land for a few horses.", "o": ["farmhouse", "skyscraper", "apartment"], "a": "farmhouse", "vi": "Nhân viên môi giới mô tả bất động sản là một nhà trang trại rộng với bếp lớn, hai kho thóc và đủ đất cho vài con ngựa.", "why": "farmhouse = ngôi nhà chính trong trang trại; live in a farmhouse, a stone farmhouse. Gồm farm + house.", "tw": "farmhouse", "new": [{"w": "barns", "vi": "kho thóc"}, {"w": "spacious", "vi": "rộng rãi"}], "ipa": "/ˈfɑːm.haʊs/"}, {"type": "mc", "ctx": "Farm school", "s": "Modern farms rely on a powerful ___ instead of manual labour, so a single worker can prepare a large field in one afternoon.", "o": ["tractor", "bicycle", "trolley"], "a": "tractor", "vi": "Các nông trại hiện đại dựa vào máy kéo mạnh thay vì lao động tay, nên một công nhân có thể chuẩn bị cánh đồng lớn trong một buổi chiều.", "why": "tractor = máy kéo (xe nông nghiệp lớn); drive a tractor, plough the field with a tractor.", "tw": "tractor", "new": [{"w": "rely on", "vi": "dựa vào"}, {"w": "manual labour", "vi": "lao động tay chân"}], "ipa": "/ˈtræk.tər/"}, {"type": "mc", "ctx": "Home repair", "s": "After the storm knocked down part of the garden ___, we spent the whole weekend replacing the broken boards with new ones.", "o": ["fence", "bridge", "ceiling"], "a": "fence", "vi": "Sau khi bão làm đổ một phần hàng rào vườn, chúng tôi dành cả cuối tuần thay các tấm ván hỏng bằng ván mới.", "why": "fence = hàng rào (gỗ, kim loại) quanh đất/vườn; build a fence, climb over a fence, wooden fence.", "tw": "fence", "new": [{"w": "knocked down", "vi": "làm đổ"}, {"w": "boards", "vi": "tấm ván"}], "ipa": "/fens/"}, {"type": "mc", "ctx": "Garden", "s": "The old iron ___ squeaked loudly whenever someone pushed it, so the family always knew exactly when a visitor had arrived.", "o": ["gate", "window", "stair"], "a": "gate", "vi": "Cổng sắt cũ kêu cót két mỗi khi ai đẩy, nên gia đình luôn biết chính xác khi nào có khách đến.", "why": "gate = cổng (vườn, nhà, sân bay); close the gate, boarding gate. Please close the gate when you leave.", "tw": "gate", "new": [{"w": "squeaked", "vi": "kêu cót két"}, {"w": "iron", "vi": "sắt"}], "ipa": "/ɡeɪt/"}, {"type": "mc", "ctx": "Hiking map", "s": "The map shows a ___ across the hill, but heavy rain has made it so muddy that only experienced hikers should attempt it.", "o": ["footpath", "motorway", "runway"], "a": "footpath", "vi": "Bản đồ chỉ một lối đi bộ qua ngọn đồi, nhưng mưa lớn khiến nó lầy đến mức chỉ người đi bộ có kinh nghiệm mới nên thử.", "why": "footpath = đường mòn/lối đi dành cho người đi bộ (ngoài đồng, ven đường); follow a footpath. Không dành cho xe.", "tw": "footpath", "new": [{"w": "attempt", "vi": "thử"}, {"w": "experienced", "vi": "có kinh nghiệm"}], "ipa": "/ˈfʊt.pɑːθ/"}, {"type": "mc", "ctx": "Garden work", "s": "He used a long saw to cut the dead ___ from the apple tree, so that new, healthy ones could grow in spring.", "o": ["branches", "roots", "leaves"], "a": "branches", "vi": "Anh dùng cưa dài cắt các cành khô khỏi cây táo, để những cành mới khỏe mạnh có thể mọc vào mùa xuân.", "why": "branch = cành cây; also chi nhánh (ngân hàng/công ty); a tree branch, break a branch. Ở đây: cành cây.", "tw": "branches", "new": [{"w": "saw", "vi": "cưa"}, {"w": "dead", "vi": "chết, khô"}], "ipa": "/brɑːntʃ/"}, {"type": "mc", "ctx": "Biology", "s": "In the sunlight, green ___ absorb carbon dioxide and produce food for the plant, which is why trees are so important for the air.", "o": ["leaves", "fruits", "stones"], "a": "leaves", "vi": "Dưới ánh nắng, lá xanh hấp thụ khí CO2 và tạo thức ăn cho cây, đó là lý do cây rất quan trọng với không khí.", "why": "leaves = lá cây (số nhiều của leaf); leaves turn yellow / fall in autumn. Đừng nhầm với động từ leaves (rời đi).", "tw": "leaves", "new": [{"w": "absorb", "vi": "hấp thụ"}, {"w": "carbon dioxide", "vi": "khí CO2"}], "ipa": "/liːvz/"}, {"type": "mc", "ctx": "Plant shop", "s": "Before putting the flower in a bigger pot, gently loosen its ___ with your fingers so that they can spread into the fresh soil.", "o": ["roots", "petals", "seeds"], "a": "roots", "vi": "Trước khi cho hoa vào chậu lớn hơn, hãy nhẹ nhàng nới rễ bằng ngón tay để chúng lan vào đất mới.", "why": "roots = rễ cây; tree roots grow under the ground; take root = bén rễ; the roots of a problem (nguồn gốc).", "tw": "roots", "new": [{"w": "loosen", "vi": "nới lỏng"}, {"w": "spread", "vi": "lan ra"}], "ipa": "/ruːts/"}, {"type": "mc", "ctx": "Earthquake lesson", "s": "During an earthquake, you should drop to the ___ and cover your head, because falling objects are more dangerous than the shaking itself.", "o": ["ground", "roof", "wall"], "a": "ground", "vi": "Khi động đất, bạn nên nằm xuống mặt đất và che đầu, vì vật rơi nguy hiểm hơn chính sự rung lắc.", "why": "ground = mặt đất; sit on the ground, under the ground, the ground floor. Nghĩa bóng: lý do (grounds).", "tw": "ground", "new": [{"w": "objects", "vi": "vật thể"}, {"w": "shaking", "vi": "sự rung lắc"}], "ipa": "/ɡraʊnd/"}, {"type": "mc", "ctx": "Garden chores", "s": "Although the weather was hot, Dad finally cut the long ___ in the front yard, since the neighbours had started to complain.", "o": ["grass", "sand", "snow"], "a": "grass", "vi": "Dù trời nóng, bố cuối cùng cũng cắt đám cỏ dài ở sân trước, vì hàng xóm bắt đầu phàn nàn.", "why": "grass = cỏ (không đếm được); cut / mow the grass, green grass, wet grass. Không nói a grass.", "tw": "grass", "new": [{"w": "yard", "vi": "sân"}, {"w": "complain", "vi": "phàn nàn"}], "ipa": "/ɡrɑːs/"}, {"type": "mc", "ctx": "Holiday", "s": "While we were away for two weeks, our neighbour kindly watered every ___ in the flat, so none of them died in the summer heat.", "o": ["plant", "chair", "picture"], "a": "plant", "vi": "Trong hai tuần chúng tôi đi vắng, hàng xóm tử tế tưới mọi cây trong căn hộ, nên không cây nào chết vì nóng mùa hè.", "why": "plant = cây/thực vật (danh từ); grow plants, water the plants. Còn là động từ (trồng) và nhà máy (power plant).", "tw": "plant", "new": [{"w": "watered", "vi": "tưới"}, {"w": "kindly", "vi": "tử tế"}], "ipa": "/plɑːnt/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Health news", "s": "A new study found that children who eat cereal with milk before school concentrate better in class. However, some brands contain far too much sugar. What does \"cereal\" mean?", "o": ["Ngũ cốc ăn sáng", "Bánh mì nướng", "Sữa chua trái cây"], "a": "Ngũ cốc ăn sáng", "vi": "Một nghiên cứu mới cho thấy trẻ ăn ngũ cốc với sữa trước giờ học tập trung tốt hơn trong lớp. Tuy nhiên, một số nhãn hiệu chứa quá nhiều đường. \"cereal\" có nghĩa là gì?", "why": "cereal = ngũ cốc ăn sáng (với sữa); danh từ không đếm được, hay gặp: a bowl of cereal, breakfast cereal.", "noblank": true, "say": "A new study found that children who eat cereal with milk before school concentrate better in class. However, some brands contain far too much sugar.", "tw": "cereal", "new": [{"w": "concentrate", "vi": "tập trung"}, {"w": "contain", "vi": "chứa"}], "ipa": "/ˈsɪr.i.əl/"}, {"type": "mc", "ctx": "Tech trends", "s": "The price of electric scooters soared in spring, yet by autumn it had dropped sharply. As the old saying goes, what goes up must come down. What does \"what goes up must come down\" mean?", "o": ["Cái gì tăng lên rồi cũng sẽ giảm xuống", "Càng lên cao càng nguy hiểm", "Thử thách nào cũng có phần thưởng"], "a": "Cái gì tăng lên rồi cũng sẽ giảm xuống", "vi": "Giá xe tay ga điện tăng vọt vào mùa xuân, nhưng đến mùa thu đã giảm mạnh. Như câu tục ngữ nói, cái gì đi lên thì cũng phải đi xuống. \"what goes up must come down\" có nghĩa là gì?", "why": "What goes up must come down = tục ngữ: giá cả, thành công… tăng mạnh rồi cũng sẽ giảm, không kéo dài mãi.", "noblank": true, "say": "The price of electric scooters soared in spring, yet by autumn it had dropped sharply. As the old saying goes, what goes up must come down.", "tw": "what goes up must come down", "new": [{"w": "soared", "vi": "tăng vọt"}, {"w": "sharply", "vi": "mạnh, đột ngột"}]}, {"type": "mc", "ctx": "Travel blog", "s": "The small coastal town attracts thousands of hikers every summer. Its clear water and quiet trails make it a perfect escape from busy cities. What does \"attract\" mean?", "o": ["Thu hút, khiến nhiều người muốn đến", "Làm phiền, gây khó chịu", "Cấm không cho vào"], "a": "Thu hút, khiến nhiều người muốn đến", "vi": "Thị trấn ven biển nhỏ thu hút hàng nghìn người đi bộ đường dài mỗi mùa hè. Nước trong và những con đường yên tĩnh biến nó thành nơi trốn khỏi thành phố ồn ào. \"attract\" có nghĩa là gì?", "why": "attract + người/vật = thu hút; collocation: attract tourists / investors / attention. Chia: attracts, attracted, attracting.", "noblank": true, "say": "The small coastal town attracts thousands of hikers every summer. Its clear water and quiet trails make it a perfect escape from busy cities.", "tw": "attract", "new": [{"w": "trails", "vi": "đường mòn"}, {"w": "escape", "vi": "nơi thoát khỏi"}], "ipa": "/əˈtrækt/"}, {"type": "mc", "ctx": "Press release", "s": "The charity organised a free concert to draw attention to the shortage of nurses. Reporters from three television channels attended the event. What does \"draw attention to\" mean?", "o": ["Thu hút sự chú ý", "Che giấu thông tin", "Vẽ một bức tranh"], "a": "Thu hút sự chú ý", "vi": "Tổ chức từ thiện tổ chức một buổi hòa nhạc miễn phí để thu hút sự chú ý đến tình trạng thiếu y tá. Phóng viên của ba kênh truyền hình đã tham dự. \"draw attention to\" có nghĩa là gì?", "why": "draw attention to sth = thu hút sự chú ý đến; draw + crowd/visitors = thu hút. Chia: draw, draws, drew, drawn.", "noblank": true, "say": "The charity organised a free concert to draw attention to the shortage of nurses. Reporters from three television channels attended the event.", "tw": "draw", "new": [{"w": "charity", "vi": "tổ chức từ thiện"}, {"w": "shortage", "vi": "sự thiếu hụt"}], "ipa": "/drɑː/"}, {"type": "mc", "ctx": "Reading task", "s": "Fast-food chains often use bright colours and cheap toys because these things appeal to children. Parents, however, may worry about the health effects. What does \"appeal to\" mean?", "o": ["Hấp dẫn, hợp sở thích", "Gây hại, làm tổn thương", "Gửi thư kêu gọi"], "a": "Hấp dẫn, hợp sở thích", "vi": "Các chuỗi đồ ăn nhanh thường dùng màu sáng và đồ chơi rẻ vì những thứ này hấp dẫn trẻ em. Tuy nhiên, phụ huynh có thể lo về tác động sức khỏe. \"appeal to\" có nghĩa là gì?", "why": "appeal to sb = hấp dẫn/hợp với ai; hay đi với: appeal to young people / to customers / to the public.", "noblank": true, "say": "Fast-food chains often use bright colours and cheap toys because these things appeal to children. Parents, however, may worry about the health effects.", "tw": "appeal to", "new": [{"w": "chains", "vi": "chuỗi cửa hàng"}, {"w": "effects", "vi": "tác động"}], "ipa": "/əˈpiːl/"}, {"type": "mc", "ctx": "Design class", "s": "The magazine cover uses bold colours and a striking photo. Its visual appeal convinced many readers to pick it up from the crowded shelf. What does \"visual appeal\" mean?", "o": ["Sức hấp dẫn nhờ hình ảnh đẹp", "Sức hấp dẫn nhờ giá rẻ", "Sức hấp dẫn nhờ âm thanh hay"], "a": "Sức hấp dẫn nhờ hình ảnh đẹp", "vi": "Bìa tạp chí dùng màu đậm và một bức ảnh nổi bật. Sức hấp dẫn hình ảnh của nó thuyết phục nhiều độc giả lấy nó khỏi kệ đông đúc. \"visual appeal\" có nghĩa là gì?", "why": "visual appeal = vẻ đẹp thu hút mắt nhìn (thiết kế, ánh sáng, cách bày trí); have strong visual appeal.", "noblank": true, "say": "The magazine cover uses bold colours and a striking photo. Its visual appeal convinced many readers to pick it up from the crowded shelf.", "tw": "visual appeal", "new": [{"w": "bold", "vi": "đậm, táo bạo"}, {"w": "striking", "vi": "nổi bật"}], "ipa": "/ˈvɪʒ.u.əl əˈpiːl/"}, {"type": "mc", "ctx": "Business report", "s": "Supermarkets in the area have strong price appeal. Shoppers are willing to travel further because they can save a lot on weekly groceries. What does \"price appeal\" mean?", "o": ["Sức hấp dẫn nhờ giá hời", "Sức hấp dẫn nhờ vị trí đẹp", "Sức hấp dẫn nhờ dịch vụ tốt"], "a": "Sức hấp dẫn nhờ giá hời", "vi": "Các siêu thị trong khu vực có sức hấp dẫn về giá lớn. Người mua sẵn sàng đi xa hơn vì họ tiết kiệm được nhiều trên đồ tạp hóa hằng tuần. \"price appeal\" có nghĩa là gì?", "why": "price appeal = sức hút nhờ giá hời/rẻ; have strong price appeal. Đối lập với visual appeal.", "noblank": true, "say": "Supermarkets in the area have strong price appeal. Shoppers are willing to travel further because they can save a lot on weekly groceries.", "tw": "price appeal", "new": [{"w": "willing", "vi": "sẵn lòng"}, {"w": "groceries", "vi": "đồ tạp hóa"}]}, {"type": "mc", "ctx": "Business news", "s": "Local bakeries are in a daily struggle against big chains. They fight for every customer by offering fresh bread at lower prices. What does \"struggle\" mean?", "o": ["Cuộc đấu tranh, cạnh tranh vất vả", "Sự hợp tác chặt chẽ", "Một cuộc nghỉ ngơi dài"], "a": "Cuộc đấu tranh, cạnh tranh vất vả", "vi": "Các tiệm bánh địa phương đang trong cuộc cạnh tranh hằng ngày với chuỗi lớn. Họ giành từng khách bằng bánh mì tươi với giá thấp hơn. \"struggle\" có nghĩa là gì?", "why": "a struggle (for/between) = cuộc đấu tranh/cạnh tranh vất vả; there is a constant struggle between A and B for sth.", "noblank": true, "say": "Local bakeries are in a daily struggle against big chains. They fight for every customer by offering fresh bread at lower prices.", "tw": "struggle", "new": [{"w": "chains", "vi": "chuỗi cửa hàng"}, {"w": "fresh", "vi": "tươi"}], "ipa": "/ˈstrʌɡ.əl/"}, {"type": "mc", "ctx": "Economics text", "s": "There is strong competition, or struggle, between the two companies. Each one cuts prices to win a larger share of the market. What does \"struggle\" mean?", "o": ["Sự cạnh tranh, tranh đấu", "Sự đồng ý chung", "Sự chuẩn bị trước"], "a": "Sự cạnh tranh, tranh đấu", "vi": "Có sự cạnh tranh, hay tranh đấu, mạnh giữa hai công ty. Mỗi bên giảm giá để giành thị phần lớn hơn. \"struggle\" có nghĩa là gì?", "why": "struggle for sth / struggle between A and B = sự tranh đấu; gần nghĩa competition nhưng nhấn mạnh sự vất vả.", "noblank": true, "say": "There is strong competition, or struggle, between the two companies. Each one cuts prices to win a larger share of the market.", "tw": "struggle", "new": [{"w": "cuts", "vi": "cắt giảm"}, {"w": "share", "vi": "thị phần"}], "ipa": "/ˈstrʌɡ.əl/"}, {"type": "mc", "ctx": "Health article", "s": "Many elderly patients struggle to climb stairs after surgery. Physiotherapists therefore design simple daily exercises to rebuild their strength. What does \"struggle to\" mean?", "o": ["Gặp khó khăn lớn để làm gì", "Từ chối làm gì", "Được phép làm gì"], "a": "Gặp khó khăn lớn để làm gì", "vi": "Nhiều bệnh nhân lớn tuổi khó khăn lắm mới leo được cầu thang sau phẫu thuật. Vì vậy các nhà vật lý trị liệu thiết kế bài tập hằng ngày đơn giản để lấy lại sức. \"struggle to\" có nghĩa là gì?", "why": "struggle to + V = gặp khó khăn/cố hết sức để làm gì; many people struggle to survive / to pay rent.", "noblank": true, "say": "Many elderly patients struggle to climb stairs after surgery. Physiotherapists therefore design simple daily exercises to rebuild their strength.", "tw": "struggle to", "new": [{"w": "surgery", "vi": "phẫu thuật"}, {"w": "physiotherapists", "vi": "nhà vật lý trị liệu"}]}, {"type": "mc", "ctx": "Disaster news", "s": "Only a few old buildings survived the earthquake. The rest collapsed within seconds, leaving many families without a home. What does \"survive\" mean?", "o": ["Sống sót, còn lại sau tai họa", "Bị phá bỏ có kế hoạch", "Được xây dựng lại"], "a": "Sống sót, còn lại sau tai họa", "vi": "Chỉ vài tòa nhà cũ còn trụ lại sau trận động đất. Phần còn lại sụp đổ trong vài giây, khiến nhiều gia đình mất nhà. \"survive\" có nghĩa là gì?", "why": "survive = sống sót (tai nạn, thiên tai) hoặc tồn tại được (doanh nghiệp); survive on sth = sống nhờ vào.", "noblank": true, "say": "Only a few old buildings survived the earthquake. The rest collapsed within seconds, leaving many families without a home.", "tw": "survive", "new": [{"w": "collapsed", "vi": "sụp đổ"}, {"w": "earthquake", "vi": "động đất"}], "ipa": "/sɚˈvaɪv/"}, {"type": "mc", "ctx": "Interview", "s": "Without a degree, my uncle struggled to make a living in the city. He often worked two jobs and rarely had a day off. What does \"struggle to make a living\" mean?", "o": ["Chật vật để kiếm đủ sống", "Sống rất xa hoa", "Học tập thành công"], "a": "Chật vật để kiếm đủ sống", "vi": "Không có bằng cấp, chú tôi chật vật kiếm sống ở thành phố. Chú thường làm hai việc và hiếm khi có ngày nghỉ. \"struggle to make a living\" có nghĩa là gì?", "why": "make a living = kiếm sống; struggle to make a living = chật vật kiếm sống; make a living by + V-ing.", "noblank": true, "say": "Without a degree, my uncle struggled to make a living in the city. He often worked two jobs and rarely had a day off.", "tw": "struggle to make a living", "new": [{"w": "degree", "vi": "bằng cấp"}, {"w": "day off", "vi": "ngày nghỉ"}]}, {"type": "mc", "ctx": "Environment report", "s": "Data centres consume huge amounts of electricity. As a result, technology companies are moving them to places with cheaper renewable power. What does \"consume\" mean?", "o": ["Tiêu thụ, dùng hết (năng lượng, tài nguyên)", "Sản xuất, tạo ra", "Lưu trữ lâu dài"], "a": "Tiêu thụ, dùng hết (năng lượng, tài nguyên)", "vi": "Các trung tâm dữ liệu tiêu thụ lượng điện khổng lồ. Vì vậy các công ty công nghệ chuyển chúng đến nơi có điện tái tạo rẻ hơn. \"consume\" có nghĩa là gì?", "why": "consume = dùng/tiêu thụ (năng lượng, thực phẩm); consume energy / fuel / calories. Chia: consumes, consumed, consuming.", "noblank": true, "say": "Data centres consume huge amounts of electricity. As a result, technology companies are moving them to places with cheaper renewable power.", "tw": "consume", "new": [{"w": "data centres", "vi": "trung tâm dữ liệu"}, {"w": "renewable", "vi": "tái tạo"}], "ipa": "/kənˈsuːm/"}, {"type": "mc", "ctx": "Market research", "s": "Coffee consumption in the country has risen by nearly thirty percent. Cafés are opening on almost every street corner. What does \"consumption\" mean?", "o": ["Mức tiêu thụ", "Mức sản xuất", "Mức xuất khẩu"], "a": "Mức tiêu thụ", "vi": "Mức tiêu thụ cà phê trong nước đã tăng gần ba mươi phần trăm. Quán cà phê mở ở hầu như mọi góc phố. \"consumption\" có nghĩa là gì?", "why": "consumption = mức tiêu thụ (danh từ của consume); energy / water / sugar consumption; reduce / increase consumption.", "noblank": true, "say": "Coffee consumption in the country has risen by nearly thirty percent. Cafés are opening on almost every street corner.", "tw": "consumption", "new": [{"w": "risen", "vi": "tăng"}, {"w": "corner", "vi": "góc phố"}], "ipa": "/kənˈsʌmp.ʃən/"}, {"type": "mc", "ctx": "Procurement", "s": "The school budget covers consumable items such as chalk, paper and batteries. These must be bought again every term. What does \"consumable\" mean?", "o": ["Vật tư dùng hết rồi phải mua lại", "Thiết bị bền dùng nhiều năm", "Đồ trang trí lớp học"], "a": "Vật tư dùng hết rồi phải mua lại", "vi": "Ngân sách trường chi cho các vật tư tiêu hao như phấn, giấy và pin. Những thứ này phải mua lại mỗi học kỳ. \"consumable\" có nghĩa là gì?", "why": "consumable (n) = vật tư dùng hết rồi phải mua tiếp: giấy, mực in, găng tay; consumable items. Cũng là tính từ: có thể ăn/dùng hết.", "noblank": true, "say": "The school budget covers consumable items such as chalk, paper and batteries. These must be bought again every term.", "tw": "consumable", "new": [{"w": "budget", "vi": "ngân sách"}, {"w": "term", "vi": "học kỳ"}], "ipa": "/kənˈsuː.mə.bəl/"}, {"type": "mc", "ctx": "Nutrition class", "s": "Asparagus is rich in vitamins and fiber. Many dietitians suggest eating it as a side dish when you want a light, healthy meal. What does \"asparagus\" mean?", "o": ["Măng tây", "Củ cải", "Ớt chuông"], "a": "Măng tây", "vi": "Măng tây giàu vitamin và chất xơ. Nhiều chuyên gia dinh dưỡng gợi ý ăn như món phụ khi bạn muốn bữa nhẹ, lành mạnh. \"asparagus\" có nghĩa là gì?", "why": "asparagus = măng tây (rau xanh, thân dài); thường: grilled / steamed asparagus, a bunch of asparagus. Không đếm được.", "noblank": true, "say": "Asparagus is rich in vitamins and fiber. Many dietitians suggest eating it as a side dish when you want a light, healthy meal.", "tw": "asparagus", "new": [{"w": "dietitians", "vi": "chuyên gia dinh dưỡng"}, {"w": "side dish", "vi": "món ăn kèm"}], "ipa": "/əˈ a": "/dɪˈpɑː.zɪt/"}, {"type": "mc", "ctx": "Hiking story", "s": "Even though the path was covered in mud, the children managed to reach the top before dark. Their guide was very proud. What does \"manage to\" mean?", "o": ["Xoay xở làm được", "Cố tình bỏ qua", "Quên không làm"], "a": "Xoay xở làm được", "vi": "Dù đường phủ đầy bùn, bọn trẻ vẫn leo lên được đỉnh trước khi trời tối. Người hướng dẫn rất tự hào. \"manage to\" có nghĩa là gì?", "why": "manage to + V = làm được việc khó; I managed to finish on time. Khác can: nhấn mạnh sự cố gắng và đã thành công.", "noblank": true, "say": "Even though the path was covered in mud, the children managed to reach the top before dark. Their guide was very proud.", "tw": "manage to", "new": [{"w": "mud", "vi": "bùn"}, {"w": "guide", "vi": "người hướng dẫn"}]}, {"type": "mc", "ctx": "Travel forum", "s": "He said he was interested in visiting rural areas rather than big cities. He wanted to learn how ordinary families live. What does \"be interested in\" mean?", "o": ["Quan tâm, hứng thú", "Sợ hãi, lo lắng", "Từ chối tham gia"], "a": "Quan tâm, hứng thú", "vi": "Anh nói anh quan tâm đến thăm vùng nông thôn hơn là thành phố lớn. Anh muốn tìm hiểu các gia đình bình thường sống thế nào. \"be interested in\" có nghĩa là gì?", "why": "be interested in + N/V-ing = quan tâm đến; I’m interested in learning… Đừng nhầm interested (người cảm thấy) với interesting (vật gây hứng thú).", "noblank": true, "say": "He said he was interested in visiting rural areas rather than big cities. He wanted to learn how ordinary families live.", "tw": "be interested in", "new": [{"w": "rural", "vi": "nông thôn"}, {"w": "ordinary", "vi": "bình thường"}]}, {"type": "mc", "ctx": "Dialogue reading", "s": "“If we split the cost equally, each of us pays thirty dollars.” “That sounds reasonable to me,” Ben answered. “Let’s do it.” What does \"That sounds reasonable to me.\" mean?", "o": ["Tôi thấy điều đó hợp lý", "Tôi thấy điều đó quá đắt", "Tôi không nghe rõ b ": "He said he didn’t have enough energy to finish the report that night. He promised to send it before lunch the next day.", "tw": "I don’t have enough ... to ...", "new": [{"w": "report", "vi": "báo cáo"}, {"w": "promised", "vi": "hứa"}]}, {"type": "mc", "ctx": "Health article", "s": "After a serious illness, your body needs time to recover. Rest, good sleep and light food are more helpful than hard exercise. What does \"need time to recover\" mean?", "o": ["Cần thời gian để hồi phục", "Cần tiền để mua thuốc", "Cần người giúp đi lại"], "a": "Cần thời gian để hồi phục", "vi": "Sau một trận bệnh nặng, cơ thể bạn cần thời gian để hồi phục. Nghỉ ngơi, ngủ ngon và ăn nhẹ có ích hơn tập nặng. \"need time to recover\" có nghĩa là gì?", "why": "need time to recover = cần thời gian để hồi phục (sức khỏe, thể thao); recover from an illness / an injury.", "noblank": true, "say": "After a serious illness, your body needs time to recover. Rest, good sleep and light food are more helpful than hard exercise.", "tw": "need time to recover", "new": [{"w": "serious", "vi": "nghiêm trọng"}, {"w": "light food", "vi": "đồ ăn nhẹ"}]}, {"type": "mc", "ctx": "Economics", "s": "In the short term, cutting prices attracts customers. Over many years, though, constant discounts can damage a brand’s image. What does \"in the short term\" mean?", "o": ["Trong ngắn hạn", "Trong cả đời", "Trong mọi trường hợp"], "a": "Trong ngắn hạn", "vi": "Trong ngắn hạn, giảm giá thu hút khách. Tuy nhiên qua nhiều năm, giảm giá liên tục có thể làm hại hình ảnh thương hiệu. \"in the short term\" có nghĩa là gì?", "why": "in the short term = trong thời gian ngắn trước mắt (opp: in the long term); in the short term, overtime may raise output.", "noblank": true, "say": "In the short term, cutting prices attracts customers. Over many years, though, constant discounts can damage a brand’s image.", "tw": "in the short term", "new": [{"w": "discounts", "vi": "giảm giá"}, {"w": "image", "vi": "hình ảnh"}]}, {"type": "m blank": true, "say": "Excuse me, how far is the bank? It’s about half a mile away, just beyond the traffic lights on your left.", "tw": "away", "new": [{"w": "beyond", "vi": "phía bên kia"}, {"w": "traffic lights", "vi": "đèn giao thông"}], "ipa": "/əˈweɪ/"}, {"type": "mc", "ctx": "Customer review", "s": "The wifi in this hotel is hopeless. It disconnects every few minutes, so I could not finish a single video call. What does \"hopeless\" mean?", "o": ["Rất tệ, không hiệu quả", "Rất nhanh, ổn định", "Rất đắt, xa xỉ"], "a": "Rất tệ, không hiệu quả", "vi": "Wifi ở khách sạn này rất tệ. Nó ngắt kết nối mỗi vài phút, nên tôi không hoàn thành nổi một cuộc gọi video. \"hopeless\" có nghĩa là gì?", "why": "hopeless = tệ/vô dụng (khẩu ngữ) hoặc vô vọng; be hopeless at sth = rất kém ở việc gì; hopeless situation.", "noblank": true, "say": "The wifi in this hotel is hopeless. It disconnects every few minutes, so I could not finish a single video call.", "tw": "hopeless", "new": [{"w": "disconnects", "vi": "ngắt kết nối"}, {"w": "single", "vi": "một (duy nhất)"}], "ipa": "/ˈhəʊp.ləs/"}, {"type": "mc", "ctx": "Reading", "s": "In remote mountain areas, you don’t get many hospitals. People often travel for hours when somebody is seriously ill. What does \"you don’t get many\" mean?", "o": ["Không có nhiều …", "Luôn có rất nhiều …", "Tất cả đều có …"], "a": "Không có nhiều …", "vi": "Ở vùng núi xa xôi, không có nhiều bệnh viện. Người ta thường đi hàng giờ khi ai đó bệnh nặng. \"you don’t get many\" có nghĩa là gì?", "why": "you don’t get many + N (đếm được, số nhiều) = ít khi có nhiều …; You don't get many shops in small villages.", "noblank": true, "say": "In remote mountain areas, you don’t get many hospitals. People often travel for hours when somebody is seriously ill.", "tw": "you don’t get many", "new": [{"w": "remote", "vi": "xa xôi"}, {"w": "seriously", "vi": "nghiêm trọng"}], "ipa": "/ju dəʊnt ɡet ˈmen.i/"}, {"type": "mc", "ctx": "Tourist guide", "s": "The old temple stands on top of a small hill. From there, visitors can see the whole town and the river below. What does \"hill\" mean?", "o": ["Đồi", "Hồ nước", "Thung lũng"], "a": "Đồi", "vi": "Ngôi chùa cổ nằm trên đỉnh một ngọn đồi nhỏ. Từ đó, du khách có thể thấy toàn bộ thị trấn và dòng sông bên dưới. \"hill\" có nghĩa là gì?", "why": "hill = đồi (thấp hơn núi: mountain); a green hill, climb a hill, on a hillside. Đối với núi dùng mountain.", "noblank": true, "say": "The old temple stands on top of a small hill. From there, visitors can see the whole town and the river below.", "tw": "hill", "new": [{"w": "temple", "vi": "chùa, đền"}, {"w": "below", "vi": "bên dưới"}], "ipa": "/hɪl/"}, {"type": "mc", "ctx": "Hiking guide", "s": "After walking along the ridge for hours, we looked down at a wide valley. Farms and small houses were scattered along a river. What does \"valley\" mean?", "o": ["Thung lũng", "Hòn đảo", "Bãi cát"], "a": "Thung lũng", "vi": "Sau khi đi dọc dải núi hàng giờ, chúng tôi nhìn xuống một thung lũng rộng. Các nông trại và nhà nhỏ rải rác dọc một con sông. \"valley\" có nghĩa là gì?", "why": "valley = thung lũng, vùng đất thấp giữa các đồi/núi, thường có sông; in a valley, a fertile valley.", "noblank": true, "say": "After walking along the ridge for hours, we looked down at a wide valley. Farms and small houses were scattered along a river.", "tw": "valley", "new": [{"w": "ridge", "vi": "sống núi"}, {"w": "scattered", "vi": "rải rác"}], "ipa": "/ˈvæl.i/"}, {"type": "mc", "ctx": "Rural report", "s": "Wheat grows in the field behind the farmhouse. When the wind blows in summer, the whole field looks like a golden sea. What does \"field\" mean?", "o": ["Cánh đồng", "Khu vườn nhỏ", "Chuồng gia súc"], "a": "Cánh đồng", "vi": "Lúa mì mọc trên cánh đồng sau nhà trang trại. Khi gió thổi vào mùa hè, cả cánh đồng trông như biển vàng. \"field\" có nghĩa là gì?", "why": "field = cánh đồng/bãi đất (trồng trọt, chăn thả, thể thao); work in the fields, a football field. Số nhiều: fields.", "noblank": true, "say": "Wheat grows in the field behind the farmhouse. When the wind blows in summer, the whole field looks like a golden sea.", "tw": "field", "new": [{"w": "wheat", "vi": "lúa mì"}, {"w": "golden", "vi": "vàng óng"}], "ipa": "/fiːld/"}, {"type": "mc", "ctx": "Holiday ad", "s": "Stay in our cosy farmhouse and enjoy fresh eggs every morning. The nearest neighbour is almost a kilometre away. What does \"farmhouse\" mean?", "o": ["Nhà ở trong trang trại", "Khách sạn lớn trong thành phố", "Căn lều trên núi"], "a": "Nhà ở trong trang trại", "vi": "Hãy ở trong nhà trang trại ấm cúng của chúng tôi và thưởng thức trứng tươi mỗi sáng. Hàng xóm gần nhất cách gần một cây số. \"farmhouse\" có nghĩa là gì?", "why": "farmhouse = ngôi nhà chính trong trang trại; live in a farmhouse, a stone farmhouse. Gồm farm + house.", "noblank": true, "say": "Stay in our cosy farmhouse and enjoy fresh eggs every morning. The nearest neighbour is almost a kilometre away.", "tw": "farmhouse", "new": [{"w": "cosy", "vi": "ấm cúng"}, {"w": "neighbour", "vi": "hàng xóm"}], "ipa": "/ˈfɑːm.haʊs/"}, {"type": "mc", "ctx": "Countryside blog", "s": "A big green tractor pulled a trailer full of hay along the road. The driver waved at us as he turned into the field. What does \"tractor\" mean?", "o": ["Máy kéo", "Xe tải nhỏ", "Xe đạp điện"], "a": "Máy kéo", "vi": "Một chiếc máy kéo xanh lớn kéo rơ-moóc đầy cỏ khô dọc đường. Người lái vẫy tay chào khi rẽ vào cánh đồng. \"tractor\" có nghĩa là gì?", "why": "tractor = máy kéo (xe nông nghiệp lớn); drive a tractor, plough the field with a tractor.", "noblank": true, "say": "A big green tractor pulled a trailer full of hay along the road. The driver waved at us as he turned into the field.", "tw": "tractor", "new": [{"w": "trailer", "vi": "rơ-moóc"}, {"w": "hay", "vi": "cỏ khô"}], "ipa": "/ˈtræk.tər/"}, {"type": "mc", "ctx": "Farm sign", "s": "A high fence surrounds the farm. It keeps the animals inside and prevents strangers from entering without permission. What does \"fence\" mean?", "o": ["Hàng rào", "Cổng chính", "Con đường"], "a": "Hàng rào", "vi": "Một hàng rào cao bao quanh trang trại. Nó giữ động vật ở trong và ngăn người lạ vào mà không được phép. \"fence\" có nghĩa là gì?", "why": "fence = hàng rào (gỗ, kim loại) quanh đất/vườn; build a fence, climb over a fence, wooden fence.", "noblank": true, "say": "A high fence surrounds the farm. It keeps the animals inside and prevents strangers from entering without permission.", "tw": "fence", "new": [{"w": "surrounds", "vi": "bao quanh"}, {"w": "permission", "vi": "sự cho phép"}], "ipa": "/fens/"}, {"type": "mc", "ctx": "Security notice", "s": "The security guard locks the main gate at ten o’clock every night. After that, visitors have to ring the bell. What does \"gate\" mean?", "o": ["Cổng", "Cửa sổ", "Tường rào"], "a": "Cổng", "vi": "Bảo vệ khóa cổng chính lúc mười giờ mỗi đêm. Sau đó, khách phải bấm chuông. \"gate\" có nghĩa là gì?", "why": "gate = cổng (vườn, nhà, sân bay); close the gate, boarding gate. Please close the gate when you leave.", "noblank": true, "say": "The security guard locks the main gate at ten o’clock every night. After that, visitors have to ring the bell.", "tw": "gate", "new": [{"w": "locks", "vi": "khóa"}, {"w": "ring the bell", "vi": "bấm chuông"}], "ipa": "/ɡeɪt/"}, {"type": "mc", "ctx": "Village notice", "s": "A narrow footpath links the village to the church. Cars cannot use it, so it is quiet and safe for walkers. What does \"footpath\" mean?", "o": ["Lối đi bộ", "Đường cao tốc", "Bãi đỗ xe"], "a": "Lối đi bộ", "vi": "Một lối đi bộ hẹp nối làng với nhà thờ. Xe hơi không thể dùng nên nó yên tĩnh và an toàn cho người đi bộ. \"footpath\" có nghĩa là gì?", "why": "footpath = đường mòn/lối đi dành cho người đi bộ (ngoài đồng, ven đường); follow a footpath. Không dành cho xe.", "noblank": true, "say": "A narrow footpath links the village to the church. Cars cannot use it, so it is quiet and safe for walkers.", "tw": "footpath", "new": [{"w": "links", "vi": "nối"}, {"w": "church", "vi": "nhà thờ"}], "ipa": "/ˈfʊt.pɑːθ/"}, {"type": "mc", "ctx": "Nature class", "s": "The monkey jumped from one branch to another. The thin branch bent under its weight but did not break. What does \"branch\" mean?", "o": ["Cành cây", "Rễ cây", "Thân cây"], "a": "Cành cây", "vi": "Con khỉ nhảy từ cành này sang cành khác. Cành mảnh cong xuống dưới sức nặng nhưng không gãy. \"branch\" có nghĩa là gì?", "why": "branch = cành cây; also chi nhánh (ngân hàng/công ty); a tree branch, break a branch. Ở đây: cành cây.", "noblank": true, "say": "The monkey jumped from one branch to another. The thin branch bent under its weight but did not break.", "tw": "branch", "new": [{"w": "bent", "vi": "cong"}, {"w": "weight", "vi": "sức nặng"}], "ipa": "/brɑːntʃ/"}, {"type": "mc", "ctx": "Garden tips", "s": "The leaves of this tropical plant are very large. When it rains, they work like umbrellas for the small insects below. What does \"leaves\" mean?", "o": ["Những chiếc lá", "Những bông hoa", "Những chiếc rễ"], "a": "Những chiếc lá", "vi": "Lá của cây nhiệt đới này rất lớn. Khi trời mưa, chúng như những chiếc ô cho côn trùng nhỏ bên dưới. \"leaves\" có nghĩa là gì?", "why": "leaves = lá cây (số nhiều của leaf); leaves turn yellow / fall in autumn. Đừng nhầm với động từ leaves (rời đi).", "noblank": true, "say": "The leaves of this tropical plant are very large. When it rains, they work like umbrellas for the small insects below.", "tw": "leaves", "new": [{"w": "tropical", "vi": "nhiệt đới"}, {"w": "insects", "vi": "côn trùng"}], "ipa": "/liːvz/"}, {"type": "mc", "ctx": "Science text", "s": "The roots of the old banyan tree grow deep into the ground. They keep the tree stable even during violent storms. What does \"roots\" mean?", "o": ["Rễ cây", "Cành cây", "Quả trên cây"], "a": "Rễ cây", "vi": "Rễ của cây đa cổ thụ mọc sâu xuống đất. Chúng giữ cây vững ngay cả trong bão dữ. \"roots\" có nghĩa là gì?", "why": "roots = rễ cây; tree roots grow under the ground; take root = bén rễ; the roots of a problem (nguồn gốc).", "noblank": true, "say": "The roots of the old banyan tree grow deep into the ground. They keep the tree stable even during violent storms.", "tw": "roots", "new": [{"w": "stable", "vi": "vững vàng"}, {"w": "violent", "vi": "dữ dội"}], "ipa": "/ruːts/"}, {"type": "mc", "ctx": "Garden diary", "s": "Overnight, heavy rain soaked the ground. The next morning, small green shoots were already pushing through the wet soil. What does \"ground\" mean?", "o": ["Mặt đất", "Bầu trời", "Mái nhà"], "a": "Mặt đất", "vi": "Qua đêm, mưa lớn làm ướt mặt đất. Sáng hôm sau, những chồi xanh nhỏ đã nhú lên qua lớp đất ẩm. \"ground\" có nghĩa là gì?", "why": "ground = mặt đất; sit on the ground, under the ground, the ground floor. Nghĩa bóng: lý do (grounds).", "noblank": true, "say": "Overnight, heavy rain soaked the ground. The next morning, small green shoots were already pushing through the wet soil.", "tw": "ground", "new": [{"w": "shoots", "vi": "chồi"}, {"w": "soaked", "vi": "làm ướt đẫm"}], "ipa": "/ɡraʊnd/"}, {"type": "mc", "ctx": "Park rules", "s": "Please do not walk on the grass in the new park. The young plants are weak and need time to grow. What does \"grass\" mean?", "o": ["Cỏ", "Cát", "Đá sỏi"], "a": "Cỏ", "vi": "Xin đừng đi trên cỏ trong công viên mới. Cây non còn yếu và cần thời gian để lớn. \"grass\" có nghĩa là gì?", "why": "grass = cỏ (không đếm được); cut / mow the grass, green grass, wet grass. Không nói a grass.", "noblank": true, "say": "Please do not walk on the grass in the new park. The young plants are weak and need time to grow.", "tw": "grass", "new": [{"w": "weak", "vi": "yếu"}, {"w": "young", "vi": "non"}], "ipa": "/ɡrɑːs/"}, {"type": "mc", "ctx": "Biology class", "s": "Every plant needs light, water and air to grow. Without any of these, even the strongest plant slowly dies. What does \"plant\" mean?", "o": ["Cây, thực vật", "Động vật hoang dã", "Loại đất đặc biệt"], "a": "Cây, thực vật", "vi": "Mọi cây đều cần ánh sáng, nước và không khí để lớn. Thiếu bất kỳ thứ nào, ngay cả cây khỏe nhất cũng chết dần. \"plant\" có nghĩa là gì?", "why": "plant = cây/thực vật (danh từ); grow plants, water the plants. Còn là động từ (trồng) và nhà máy (power plant).", "noblank": true, "say": "Every plant needs light, water and air to grow. Without any of these, even the strongest plant slowly dies.", "tw": "plant", "new": [{"w": "strongest", "vi": "khỏe nhất"}, {"w": "slowly", "vi": "từ từ"}], "ipa": "/plɑːnt/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm Ghi âm, trả lời bằng tiếng Anh 30–60 giây và cố dùng các từ gợi ý; trang sẽ chấm ước tính theo Fluency, Lexical Resource, Grammar, Pronunciation.", "qs": [{"type": "sp", "ctx": "Food and health", "s": "Tell me about your usual breakfast. Do you think people in your country consume too much sugar, and what could they eat instead?", "vi": "Hãy kể về bữa sáng thường ngày của bạn. Bạn có nghĩ người dân nước bạn tiêu thụ quá nhiều đường không, và họ có thể ăn gì thay thế?", "words": ["cereal", "fiber", "consume", "consumption", "asparagus"], "why": "Mở bằng bữa sáng của bạn, nêu một nhận định (agree/disagree) rồi đưa ví dụ cụ thể; dùng although/whereas để so sánh hai thói quen.", "sample": "On weekdays I usually have a bowl of whole-grain cereal with milk, because it is quick and keeps me full until lunch. Although it is convenient, many brands contain too much sugar. I think sugar consumption is a serious problem in my country, whereas people do not consume enough fiber. If families added vegetables such as asparagus to their meals, they would feel healthier in the long run. Personally, I try to read the labels before I buy anything."}, {"type": "sp", "ctx": "Unexpected costs", "s": "Describe a time when you had to pay for something unexpected, such as a deposit, an extra fee or a small fine. What happened, and how did you feel?", "vi": "Hãy mô tả một lần bạn phải trả khoản tiền bất ngờ như tiền đặt cọc, phụ phí hoặc một khoản phạt nhỏ. Chuyện gì xảy ra và bạn cảm thấy thế nào?", "words": ["base price", "deposit", "consumable", "bucks", "owe", "pay a small fine"], "why": "Kể theo trình tự: bối cảnh → điều bất ngờ → cách giải quyết → cảm xúc; dùng thì quá khứ và which để thêm thông tin.", "sample": "Last year I rented a flat, and the advertised base price looked very cheap. However, I had to pay a deposit equal to one month's rent, which I had not expected. Later I also owed the landlord around fifty bucks for consumable items such as light bulbs and cleaning products. When I returned the keys a day late, I even had to pay a small fine. I was annoyed at first, but I learned to read every contract carefully before I sign anything."}, {"type": "sp", "ctx": "Splitting a bill", "s": "Imagine you had dinner and shared a taxi with a friend. Explain how you split the bill and settled up, and what you said to each other.", "vi": "Hãy tưởng tượng bạn ăn tối và đi chung taxi với một người bạn. Giải thích cách hai người chia tiền, thanh toán xong và những gì hai bạn nói với nhau.", "words": ["How much will it be", "Here you go", "There you go", "How much do I owe you", "We're settled", "real quick", "Give me a break"], "why": "Dùng như một đoạn hội thoại ngắn: hỏi giá, đưa tiền, xác nhận đã xong; giữ giọng thân mật nhưng rõ ràng.", "sample": "After dinner, the waiter brought the bill, and I asked him, \"How much will it be altogether?\" My friend paid for the taxi, so I said, \"How much do I owe you?\" He replied that it was twelve dollars. I handed him the money and said, \"Here you go.\" He counted it and answered, \"There you go, we're settled.\" Then he asked me for a favour real quick, and I joked, \"Give me a break, I have been working all day!\" We both laughed and went home."}, {"type": "sp", "ctx": "Difficult periods", "s": "Talk about a difficult period in your life. How did you manage to deal with it, and what advice would you give to a friend in the same situation?", "vi": "Hãy nói về một giai đoạn khó khăn trong đời bạn. Bạn đã xoay xở thế nào, và sẽ khuyên bạn bè trong tình huống đó điều gì?", "words": ["manage to", "be interested in", "Don't be afraid", "That sounds reasonable to me", "Sometimes you're up, sometimes you're down", "hopeless"], "why": "Kể vấn đề → cách vượt qua → lời khuyên; kết thúc bằng một câu tổng kết (Sometimes you're up…).", "sample": "Two years ago I lost my job, and for a while the situation felt hopeless. Fortunately, I managed to stay calm and start a new course because I have always been interested in design. My brother told me, \"Don't be afraid to start again,\" and that sounded reasonable to me. Now I would give the same advice to a friend: sometimes you're up, sometimes you're down, so you should keep trying and ask for help when you need it."}, {"type": "sp", "ctx": "Healthy habits", "s": "What habit would you like to build to improve your health? Compare the benefits in the short term and in the long term, and explain what stops you.", "vi": "Bạn muốn xây dựng thói quen nào để cải thiện sức khỏe? So sánh lợi ích ngắn hạn và dài hạn, và nói điều gì đang cản trở bạn.", "words": ["in the short term", "in the long term", "don't have enough", "need time to recover", "reflect", "what goes up must come down"], "why": "So sánh hai mốc thời gian bằng in the short term / in the long term; nêu trở ngại thật (time, money, energy).", "sample": "I would like to run three times a week. In the short term, it would give me more energy and help me sleep better. In the long term, it would reduce stress and protect my heart. However, I don't have enough free time on weekdays, and my muscles need time to recover after a hard session. When I reflect on my progress, I notice that my motivation rises quickly and then falls, because what goes up must come down. So I plan to start slowly and stay consistent."}, {"type": "sp", "ctx": "Attracting customers", "s": "How do shops, cafés
