/* Layout: one narrow reading column, sticky section tabs, one question card at a time per row. */
:root{
  --bg:#F2F6F8; --surface:#FFFFFF; --ink:#12263A; --muted:#566879; --line:#D3DDE5;
  --primary:#0E5A78; --primary-ink:#FFFFFF; --hl:#E6F36E; --hl-ink:#12263A;

    --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
    --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923; --surface:#14263A; --ink:#E5EEF5; --muted:#9BB0C2; --line:#2A4259;
  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.check{align-self:flex-start;background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .tag{font-weight:700;margin-right:8px}
.fb.good .tag{color:var(--good)}
.fb.bad .tag{color:var(--bad)}
.fb p{margin:4px 0 0}
.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
.recbtn.stop{background:var(--bad);color:#fff}
.recbtn:disabled{opacity:.45;cursor:default}
.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}
.manual summary{cursor:pointer;color:var(--muted)}
.manual textarea{width:100%;min-height:90px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.band b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.band .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--primary)}
.band p{margin:4px 0 0;font-size:13px;color:var(--ink)}
.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

who cannot afford them.", "o": ["betterment", "destruction", "embarrassment"], "a": "betterment", "vi": "Thư viện công cộng tồn tại vì sự cải thiện của xã hội, cung cấp sách miễn phí và chỗ học yên tĩnh cho người không đủ khả năng chi trả.", "why": "the betterment of + N = sự cải thiện/làm tốt đẹp hơn (xã hội, cộng đồng).", "new": [{"w": "afford", "vi": "đủ khả năng chi trả"}], "tw": "the betterment of", "ipa": "/ˈbet̬.ɚ.mənt/"}, {"type": "mc", "ctx": "Medical history", "s": "The discovery of penicillin was one of the greatest gifts to ___, as it has saved countless people from deadly infections.", "o": ["humanity", "geography", "machinery"], "a": "humanity", "vi": "Việc phát hiện ra penicillin là một trong những món quà lớn nhất dành cho nhân loại, vì nó đã cứu vô số người khỏi các nhiễm trùng chết người.", "why": "humanity = nhân loại, loài người nói chung (không đếm được).", "new": [{"w": "penicillin", "vi": "thuốc penicillin"}, {"w": "countless", "vi": "vô số"}], "tw": "humanity", "ipa": "/hjuːˈmæn.ə.t̬i/"}, {"type": "mc", "ctx": "Cycling event", "s": "Cyclists from several countries are hoping to ___ a record in the 24-hour race, although the strong wind may make it difficult.", "o": ["break", "paint", "invite"], "a": "break", "vi": "Các tay đua xe đạp từ nhiều nước hy vọng phá một kỷ lục trong cuộc đua 24 giờ, dù gió mạnh có thể gây khó khăn.", "why": "break a record = phá kỷ lục (break/broke/broken).", "new": [{"w": "cyclists", "vi": "người đi xe đạp"}], "tw": "break a record", "ipa": "/rɪˈkɔːrd/"}, {"type": "mc", "ctx": "Theme park", "s": "The new roller coaster is a real ___, since it is taller and faster than any other ride in the country.", "o": ["record breaker", "ticket seller", "safety officer"], "a": "record breaker", "vi": "Tàu lượn siêu tốc mới là một kỷ lục thực sự, vì nó cao và nhanh hơn mọi trò chơi khác trong nước.", "why": "record breaker = người/vật phá kỷ lục.", "new": [{"w": "roller coaster", "vi": "tàu lượn siêu tốc"}, {"w": "ride", "vi": " hopping centre", "swimming pool", "bus station"], "a": "shopping centre", "vi": "Các tiểu thương phàn nàn rằng trung tâm mua sắm mới ở rìa thị trấn đã cướp khách của các cửa hàng nhỏ trong chợ cũ.", "why": "shopping centre (Anh) / shopping center (Mỹ) = trung tâm mua sắm.", "new": [{"w": "traders", "vi": "thương nhân"}], "tw": "shopping centre", "ipa": "/ˈʃɑː.pɪŋ ˌsen.tɚ/"}, {"type": "mc", "ctx": "University plan", "s": "The university wants to bring all its science departments ___, so that students and researchers can share equipment more easily.", "o": ["under one roof", "behind closed doors", "over the rooftop"], "a": "under one roof", "vi": "Trường đại học muốn gom mọi khoa khoa học về cùng một tòa nhà, để sinh viên và nhà nghiên cứu dễ dùng chung thiết bị.", "why": "under one roof = ở cùng một nơi/cùng một tòa nhà.", "new": [{"w": "researchers", "vi": "nhà nghiên cứu"}, {"w": "equipment", "vi": "thiết bị"}], "tw": "under one roof", "ipa": "/ˈʌn.dɚ wʌn ruːf/"}, {"type": "mc", "ctx": "Online store", "s": "The online store is popular because it stocks ___ products, from cheap pens to expensive laptops.", "o": ["a wide range of", "a narrow range of", "a lack of"], "a": "a wide range of", "vi": "Cửa hàng trực tuyến được ưa chuộng vì có bán nhiều loại sản phẩm, từ bút rẻ đến laptop đắt tiền.", "why": "a wide range of + N số nhiều = nhiều loại, đa dạng.", "new": [{"w": "stocks", "vi": "có bán sẵn"}], "tw": "a wide range of", "ipa": "/ə waɪd reɪndʒ əv ˌsʌm.θɪŋ/"}, {"type": "mc", "ctx": "Customer rights", "s": "If the washing machine breaks down within the first month, you can return it and ___ without any extra charge.", "o": ["get a refund", "get a ticket", "get a haircut"], "a": "get a refund", "vi": "Nếu máy giặt hỏng trong tháng đầu, bạn có thể trả lại và được hoàn tiền mà không mất thêm phí.", "why": "get a refund = được hoàn tiền.", "new": [{"w": "breaks down", "vi": "bị hỏng"}], "tw": "get a refund", "ipa": "/ɡet ə ˈriː.fʌnd/"}, {"type": "mc", "ctx": "Seaside dinner", "s": "After the storm, fishermen collected fresh ___ from the rocks, and the restaurant cooked them in garlic sauce that evening.", "o": ["mussels", "mushrooms", "muscles"], "a": "mussels", "vi": "Sau cơn bão, ngư dân thu hoạch vẹm tươi từ các tảng đá, và tối đó nhà hàng nấu chúng với sốt tỏi.", "why": "mussel = con trai/vẹm (hải sản có vỏ); phân biệt muscle = cơ bắp.", "new": [{"w": "fishermen", "vi": "ngư dân"}, {"w": "sauce", "vi": "nước sốt"}], "tw": "mussel", "ipa": "/ˈmʌs.əl/"}, {"type": "mc", "ctx": "Restaurant menu", "s": "The chef recommended the starter of grilled ___ with garlic, which was soft, sweet and served in a shell.", "o": ["scallops", "sausages", "chestnuts"], "a": "scallops", "vi": "Đầu bếp gợi ý món khai vị sò điệp nướng tỏi, mềm, ngọt và được dọn trong vỏ.", "why": "scallop = sò điệp (hải sản có hai mảnh vỏ).", "new": [{"w": "starter", "vi": "món khai vị"}, {"w": "shell", "vi": "vỏ"}], "tw": "scallop", "ipa": "/ˈskæləp/"}, {"type": "mc", "ctx": "Birthday party", "s": "Since Lena ___ Italian food, her friends always ask her to prepare the pasta at birthday parties.", "o": ["is good at cooking", "is bored of cooking", "is afraid of cooking"], "a": "is good at cooking", "vi": "Vì Lena nấu món Ý giỏi, bạn bè luôn nhờ cô làm mì ống trong các bữa tiệc sinh nhật.", "why": "be good at cooking + món = nấu món đó giỏi (good at + V-ing).", "new": [{"w": "pasta", "vi": "mì ống"}], "tw": "be good at cooking", "ipa": "/bi ɡʊd æt ˈkʊkɪŋ/"}, {"type": "mc", "ctx": "Office meeting", "s": "Nobody in the office complained about the new schedule ___ Daniel, who thinks the meetings now start too early.", "o": ["apart from", "instead of", "because of"], "a": "apart from", "vi": "Không ai trong văn phòng phàn nàn về lịch mới ngoại trừ Daniel, người nghĩ các cuộc họp giờ bắt đầu quá sớm.", "why": "apart from + N/V-ing = ngoài ra / ngoại trừ (= besides, except for).", "new": [{"w": "schedule", "vi": "lịch trình"}], "tw": "apart from", "ipa": "/əˈpɑːt frəm/"}, {"type": "mc", "ctx": "Career advice", "s": "Take the first good chance that ___, because opportunities like this rarely appear twice in the same career.", "o": ["comes along", "goes off", "falls out"], "a": "comes along", "vi": "Hãy nắm lấy cơ hội tốt đầu tiên xuất hiện, vì những cơ hội như thế hiếm khi đến hai lần trong một sự nghiệp.", "why": "come along = xuất hiện, đến (cơ hội, xe buýt...).", "new": [{"w": "opportunities", "vi": "cơ hội"}], "tw": "come along", "ipa": "/kʌm əˈlɒŋ/"}, {"type": "mc", "ctx": "Cycling tips", "s": "Cyclists often prefer a ___ to the motorway because there is less traffic and the air feels cleaner.", "o": ["side road", "waiting room", "bus fare"], "a": "side road", "vi": "Người đi xe đạp thường thích đường nhỏ hơn đường cao tốc vì ít xe hơn và không khí sạch hơn.", "why": "side road = đường nhỏ rẽ từ đường chính; turn onto a side road.", "new": [{"w": "motorway", "vi": "đường cao tốc"}], "tw": "side road", "ipa": "/ˈsaɪd rəʊd/"}, {"type": "mc", "ctx": "Police appeal", "s": "Two pedestrians ___ near the school yesterday and gave their names to the police as witnesses.", "o": ["saw an accident", "had an accident", "caused an accident"], "a": "saw an accident", "vi": "Hai người đi bộ đã chứng kiến một vụ tai nạn gần trường hôm qua và đưa tên cho cảnh sát với tư cách nhân chứng.", "why": "see an accident = chứng kiến tai nạn (khác have an accident = bị tai nạn).", "new": [{"w": "pedestrians", "vi": "người đi bộ"}, {"w": "witnesses", "vi": "nhân chứng"}], "tw": "see an accident", "ipa": "/siː ən ˈæksɪdənt/"}, {"type": "mc", "ctx": "Long drives", "s": "Drivers who are tired are much more likely to ___, so you should take a break every two hours on a long trip.", "o": ["have an accident", "make a decision", "take a photo"], "a": "have an accident", "vi": "Tài xế mệt mỏi dễ bị tai nạn hơn nhiều, nên bạn cần nghỉ mỗi hai giờ trong chuyến đi dài.", "why": "have an accident = bị/gặp tai nạn.", "new": [{"w": "take a break", "vi": "nghỉ giải lao"}],  the forest, so the lorry driver was forced to ___ into the other lane.", "o": ["swerve", "retire", "borrow"], "a": "swerve", "vi": "Một con hươu nhảy ra khỏi rừng nên tài xế xe tải buộc phải đánh lái sang làn bên kia.", "why": "swerve (to avoid sth) = đánh lái đột ngột để tránh.", "new": [{"w": "deer", "vi": "con hươu"}, {"w": "lane", "vi": "làn đường"}], "tw": "swerve", "ipa": "/swɜːv/"}, {"type": "mc", "ctx": "Distracted driving", "s": "The young driver was texting on his phone, and as a result he nearly ___ a tree at the side of the road.", "o": ["crashed into", "climbed up", "listened to"], "a": "crashed into", "vi": "Người lái xe trẻ đang nhắn tin trên điện thoại, và kết quả là anh suýt đâm vào một cái cây bên đường.", "why": "crash into sth = đâm vào cái gì.", "new": [{"w": "texting", "vi": "nhắn tin"}], "tw": "crash into", "ipa": "/kræʃ ˈɪntuː/"}, {"type": "mc", "ctx": "Garage mishap", "s": "While reversing out of the narrow garage, she accidentally touched ___ and left a long scratch on the door.", "o": ["a parked car", "a moving train", "a flying bird"], "a": "a parked car", "vi": "Khi lùi ra khỏi ga-ra hẹp, cô vô tình chạm vào một chiếc xe đang đỗ và để lại vết xước dài trên cửa.", "why": "a parked car = xe đang đỗ (không chạy).", "new": [{"w": "reversing", "vi": "lùi xe"}, {"w": "scratch", "vi": "vết xước"}], "tw": "a parked car", "ipa": "/ə pɑːkt kɑː/"}, {"type": "mc", "ctx": "Travel culture", "s": "In Britain, vehicles drive ___ compared with most of Europe, which confuses many tourists.", "o": ["on the opposite side of the road", "along the same side of the road", "across the whole of the road"], "a": "on the opposite side of the road", "vi": "Ở Anh, xe chạy ở phía bên kia đường so với phần lớn châu Âu, điều khiến nhiều du khách bối rối.", "why": "on the opposite side of the road = ở phía bên kia đường.", "new": [{"w": "confuses", "vi": "gây bối rối"}], "tw": "on the opposite side of the road", "ipa": "/ɒn ðə ˈɒpəzɪt saɪd əv ðə rəʊd/"}, {"type": "mc", "ctx": "Sports safety", "s": "Rugby players must wear protective clothing so that they do not ___ themselves during the match.", "o": ["injure", "educate", "translate"], "a": "injure", "vi": "Cầu thủ bóng bầu dục phải mặc đồ bảo hộ để không làm mình bị thương trong trận đấu.", "why": "injure sb = làm ai bị thương; be injured = bị thương.", "new": [{"w": "protective", "vi": "bảo hộ"}], "tw": "injure", "ipa": "/ˈɪndʒə/"}, {"type": "mc", "ctx": "Football match", "s": "The goalkeeper ___ during the second half, so the coach had to replace him with a younger player.", "o": ["was injured", "was punished", "was invited"], "a": "was injured", "vi": "Thủ môn bị thương trong hiệp hai nên huấn luyện viên phải thay bằng một cầu thủ trẻ hơn.", "why": "be injured = bị thương (bị động của injure).", "new": [{"w": "goalkeeper", "vi": "thủ môn"}, {"w": "replace", "vi": "thay thế"}], "tw": "be injured", "ipa": "/ˈɪndʒə/"}, {"type": "mc", "ctx": "School playground", "s": "Falling off the swing caused ___ to the boy's knee, so the teacher cleaned it and put on a plaster.", "o": ["a minor injury", "a serious illness", "a heavy bill"], "a": "a minor injury", "vi": "Việc ngã khỏi xích đu chỉ gây thương tích nhẹ ở đầu gối cậu bé, nên cô giáo lau sạch và dán băng cá nhân.", "why": "a minor injury = thương tích nhẹ (minor = nhỏ, không nghiêm trọng).", "new": [{"w": "swing", "vi": "xích đu"}, {"w": "plaster", "vi": "băng dán"}], "tw": "a minor injury", "ipa": "/ə ˈmaɪnə ˈɪndʒəri/"}, {"type": "mc", "ctx": "Phone care", "s": "Leaving your phone in direct sunlight for hours may ___ the battery, which then stops holding its charge.", "o": ["damage", "bargain", "educate"], "a": "damage", "vi": "Để điện thoại dưới nắng gắt nhiều giờ có thể làm hỏng pin, khiến nó không giữ điện được nữa.", "why": "damage sth = làm hư hại (động từ); damage to sth = thiệt hại đối với (danh từ).", "new": [{"w": "direct sunlight", "vi": "ánh nắng trực tiếp"}], "tw": "damage", "ipa": "/ˈdæmɪdʒ/"}, {"type": "mc", "ctx":  "state education = nền giáo dục công lập do nhà nước tài trợ.", "new": [{"w": "invest", "vi": "đầu tư"}, {"w": "regardless of", "vi": "bất kể"}], "tw": "state education", "ipa": "/ˌsteɪt ˌedjuˈkeɪʃn/"}, {"type": "mc", "ctx": "Parents' meeting", "s": "Most children in the area attend a ___, while only a small number go to expensive schools that charge high fees.", "o": ["state school", "football club", "summer camp"], "a": "state school", "vi": "Phần lớn trẻ em trong khu vực học ở một trường công, trong khi chỉ số ít vào các trường đắt tiền thu học phí cao.", "why": "state school = trường công lập (do nhà nước điều hành).", "new": [{"w": "charge", "vi": "thu (phí)"}], "tw": "state school", "ipa": "/ˈsteɪt skuːl/"}, {"type": "mc", "ctx": "School comparison", "s": "Parents who choose a ___ often hope for smaller classes and more activities, although the monthly bill can be heavy.", "o": ["private school", "public library", "state hospital"], "a": "private school", "vi": "Phụ huynh chọn trường tư thường hy vọng lớp nhỏ hơn và nhiều hoạt động hơn, dù hóa đơn hằng tháng có thể nặng.", "why": "private school = trường tư thục, thu học phí.", "new": [{"w": "activities", "vi": "hoạt động"}], "tw": "private school", "ipa": "/ˈpraɪvət skuːl/"}, {"type": "mc", "ctx": "Healthcare", "s": "Some clinics ___ charities, while others belong to the state or to private companies seeking profit.", "o": ["are operated by", "are afraid of", "are tired of"], "a": "are operated by", "vi": "Một số phòng khám do các tổ chức từ thiện điều hành, số khác thuộc nhà nước hoặc công ty tư nhân tìm kiếm lợi nhuận.", "why": "be operated by + ai/tổ chức = được vận hành/điều hành bởi.", "new": [{"w": "charities", "vi": "tổ chức từ thiện"}], "tw": "be operated by", "ipa": "/ˈɒpəreɪtɪd/"}, {"type": "mc", "ctx": "Rural community", "s": "In remote villages, some families cannot ___ their children to school because the nearest one is two hours away on foot.", "o": ["send", "invite", "collect"], "a": "send", " rt at small colleges ___ top universities if they earn high grades in their first two years.", "o": ["go on to", "give up", "cut down"], "a": "go on to", "vi": "Nhiều sinh viên bắt đầu ở trường cao đẳng nhỏ học tiếp lên các trường đại học hàng đầu nếu đạt điểm cao trong hai năm đầu.", "why": "go on to + N/V = tiếp tục chuyển sang bước tiếp theo (đại học, một nghề).", "new": [{"w": "grades", "vi": "điểm số"}], "tw": "go on to", "ipa": "/ɡəʊ ɒn tuː/"}, {"type": "mc", "ctx": "Career guidance", "s": "If you prefer practical subjects, ___ may suit you better than a three-year degree, because the courses are shorter and cheaper.", "o": ["further education", "early education", "state education"], "a": "further education", "vi": "Nếu thích các môn thực hành, giáo dục tiếp tục có thể hợp hơn bằng đại học ba năm, vì khóa học ngắn và rẻ hơn.", "why": "further education = học tiếp sau phổ thông (không phải đại học), ví dụ cao đẳng nghề.", "new": [{"w": "degree", "vi": "bằng đại học"}, {"w": "suit", "vi": "phù hợp"}], "tw": "further education", "ipa": "/ˌfɜːðər ˌedjuˈkeɪʃn/"}, {"type": "mc", "ctx": "Technology", "s": "___, people wrote letters by hand, but now most messages are sent within seconds by phone.", "o": ["In the past", "In the end", "In the middle"], "a": "In the past", "vi": "Ngày xưa người ta viết thư tay, nhưng giờ hầu hết tin nhắn được gửi trong vài giây bằng điện thoại.", "why": "in the past = trước đây, ngày xưa (đối lập với now / nowadays).", "tw": "in the past", "ipa": "/ɪn ðə pɑːst/"}, {"type": "mc", "ctx": "Football match", "s": "Players who deliberately ___ of the game can be sent off by the referee, and their team may lose the match.", "o": ["break the rules", "share the news", "raise the price"], "a": "break the rules", "vi": "Cầu thủ cố ý vi phạm luật chơi có thể bị trọng tài đuổi khỏi sân và đội có thể thua trận.", "why": "break the rules = vi phạm nội quy/quy tắc (break/broke/broken).", "new": [{"w": "deliberately", "vi": "cố ý"}, {"w": "referee", "vi" uired", "vi": "bắt buộc"}, {"w": "architecture", "vi": "kiến trúc"}], "tw": "write an essay", "ipa": "/raɪt ən ˈeseɪ/"}, {"type": "mc", "ctx": "Office habits", "s": "My colleagues all ___ the manager “Mr Lee”, but his close friends use his first name.", "o": ["call", "say", "speak"], "a": "call", "vi": "Các đồng nghiệp đều gọi quản lý là “ông Lee”, nhưng bạn thân của ông gọi bằng tên riêng.", "why": "call sb + tên/danh xưng = gọi ai là…", "new": [{"w": "colleagues", "vi": "đồng nghiệp"}], "tw": "call someone something", "ipa": "/kɔːl/"}, {"type": "mc", "ctx": "Grandmother's life", "s": "My grandmother used to wash clothes by hand, but ___ she uses a machine that also dries them.", "o": ["nowadays", "yesterday", "someday"], "a": "nowadays", "vi": "Bà tôi từng giặt đồ bằng tay, nhưng ngày nay bà dùng máy giặt có cả chức năng sấy.", "why": "nowadays = ngày nay (thường dùng với thì hiện tại).", "tw": "nowadays", "ipa": "/ˈnaʊədeɪz/"}, {"type": "mc", "ctx": "Workplace", "s": "Employees work better in a positive ___ where mistakes are discussed openly instead of being hidden.", "o": ["atmosphere", "ambulance", "ingredient"], "a": "atmosphere", "vi": "Nhân viên làm việc tốt hơn trong bầu không khí tích cực, nơi lỗi được bàn thẳng thắn thay vì bị giấu.", "why": "atmosphere = bầu không khí (ở một nơi); cũng là khí quyển.", "new": [{"w": "positive", "vi": "tích cực"}], "tw": "atmosphere", "ipa": "/ˈætməsfɪə(r)/"}, {"type": "mc", "ctx": "Holiday", "s": "After a long walk on the beach, the tourists felt completely ___, and none of them wanted to think about work.", "o": ["relaxed", "crowded", "expensive"], "a": "relaxed", "vi": "Sau một buổi đi dạo dài trên bãi biển, du khách cảm thấy hoàn toàn thư giãn và không ai muốn nghĩ đến công việc.", "why": "relaxed = thoải mái, thư thái, không căng thẳng.", "tw": "relaxed", "ipa": "/rɪˈlækst/"}, {"type": "mc", "ctx": "Office rules", "s": "Some companies let employees ___ casually on Fridays, so you will see jeans and trainers in the office.", "o": ["dress", "dive", "dig"], "a": "dress", "vi": "Một số công ty cho nhân viên ăn mặc thoải mái vào thứ Sáu, nên bạn sẽ thấy quần jeans và giày thể thao trong văn phòng.", "why": "dress (the way you want) = ăn mặc theo ý mình.", "new": [{"w": "casually", "vi": "thoải mái"}, {"w": "trainers", "vi": "giày thể thao"}], "tw": "dress", "ipa": "/dres/"}, {"type": "mc", "ctx": "Evening plans", "s": "We can eat outside this evening ___ it doesn't rain, otherwise we will have dinner indoors.", "o": ["as long as", "as well as", "as soon as"], "a": "as long as", "vi": "Tối nay chúng ta có thể ăn ngoài trời miễn là trời không mưa, nếu không sẽ ăn trong nhà.", "why": "as long as + mệnh đề = miễn là, với điều kiện là.", "new": [{"w": "otherwise", "vi": "nếu không thì"}], "tw": "as long as", "ipa": "/æz ˈlɒŋ æz/"}, {"type": "mc", "ctx": "Exam day", "s": "Although the exam was long, most students felt ___ confident, because they had practised similar questions many times.", "o": ["reasonably", "forever", "beneath"], "a": "reasonably", "vi": "Dù bài thi dài, hầu hết sinh viên cảm thấy khá tự tin vì đã luyện nhiều câu tương tự.", "why": "reasonably + adj = khá, tương đối (mức độ vừa phải).", "new": [{"w": "practised", "vi": "đã luyện tập"}], "tw": "reasonably", "ipa": "/ˈriːznəbli/"}, {"type": "mc", "ctx": "Restaurant rules", "s": "The restaurant asks guests to wear ___ clothes in the evening, so jeans and trainers are not allowed.", "o": ["smart", "loose", "damp"], "a": "smart", "vi": "Nhà hàng yêu cầu khách mặc quần áo lịch sự vào buổi tối, nên không được mặc jeans và giày thể thao.", "why": "smart (adj, Anh-Anh) = ăn mặc chỉnh tề, lịch sự.", "new": [{"w": "guests", "vi": "khách"}], "tw": "smart", "ipa": "/smɑːt/"}, {"type": "mc", "ctx": "Parenting", "s": "Parents who are too ___ with their children sometimes find that the teenagers hide the truth to avoid punishment.", "o": ["strict", "generous", "talkative"], "a": "strict", "vi": "Cha mẹ quá nghiêm khắc với con đôi khi ality. Parents may disagree, but experts suggest allowing some freedom within sensible limits.", "o": ["ăn mặc", "nấu ăn", "trang trí"], "a": "ăn mặc", "noblank": true, "say": "Teenagers often want to dress in their own style to show their personality. Parents may disagree, but experts suggest allowing some freedom within sensible limits.", "vi": "Thiếu niên thường muốn ăn mặc theo phong cách riêng để thể hiện cá tính. Cha mẹ có thể không đồng ý, nhưng chuyên gia khuyên cho một chút tự do trong giới hạn hợp lý.", "why": "dress (the way you want) = ăn mặc theo ý mình.", "new": [{"w": "personality", "vi": "cá tính"}, {"w": "sensible", "vi": "hợp lý"}], "tw": "dress", "ipa": "/dres/"}, {"type": "mc", "ctx": "Remote work", "s": "The company allows staff to work from home as long as they attend the weekly meeting. This rule keeps teams connected while still giving people flexibility.", "o": ["miễn là, với điều kiện", "mặc dù", "vì vậy"], "a": "miễn là, với điều kiện", "noblank": true, "say": "The company allows staff to work from home as long as they attend the weekly meeting. This rule keeps teams connected while still giving people flexibility.", "vi": "Công ty cho nhân viên làm việc tại nhà miễn là họ dự cuộc họp hằng tuần. Quy định này giữ đội ngũ gắn kết mà vẫn cho sự linh hoạt.", "why": "as long as + mệnh đề = miễn là, với điều kiện là.", "new": [{"w": "flexibility", "vi": "sự linh hoạt"}], "tw": "as long as", "ipa": "/æz ˈlɒŋ æz/"}, {"type": "mc", "ctx": "Restaurant guide", "s": "The restaurant offers reasonably priced meals, which attracts students and families on a budget. Even so, the food is fresh and the portions are generous.", "o": ["khá, tương đối, hợp lý", "cực kỳ", "hiếm khi"], "a": "khá, tương đối, hợp lý", "noblank": true, "say": "The restaurant offers reasonably priced meals, which attracts students and families on a budget. Even so, the food is fresh and the portions are generous.", "vi": "Nhà hàng có các bữa ăn giá khá hợp lý, thu hút sinh viên và gia đình có ngân sách hạn chế. Dù vậy, đồ ăn tươi và khẩu phần hào phóng.", "why": "reasonably + adj = khá, tương đối (mức độ vừa phải).", "new": [{"w": "on a budget", "vi": "ngân sách hạn chế"}, {"w": "portions", "vi": "khẩu phần"}], "tw": "reasonably", "ipa": "/ˈriːznəbli/"}, {"type": "mc", "ctx": "Hotel service", "s": "Staff at the luxury hotel always look smart in their dark suits and clean white shirts. Guests often comment that this neat appearance makes them feel welcome.", "o": ["chỉnh tề, lịch sự", "bẩn thỉu", "lôi thôi"], "a": "chỉnh tề, lịch sự", "noblank": true, "say": "Staff at the luxury hotel always look smart in their dark suits and clean white shirts. Guests often comment that this neat appearance makes them feel welcome.", "vi": "Nhân viên ở khách sạn sang trọng luôn trông chỉn chu trong bộ vest tối màu và áo sơ mi trắng sạch. Khách thường nhận xét vẻ ngoài gọn gàng này khiến họ cảm thấy được chào đón.", "why": "smart (adj, Anh-Anh) = ăn mặc chỉnh tề, lịch sự.", "new": [{"w": "neat", "vi": "gọn gàng"}, {"w": "appearance", "vi": "vẻ ngoài"}], "tw": "smart", "ipa": "/smɑːt/"}, {"type": "mc", "ctx": "School news", "s": "The new headteacher is strict about punctuality: pupils who arrive after eight o'clock must report to the office. Although some complained, attendance has improved noticeably.", "o": ["nghiêm khắc", "dễ dãi", "vui tính"], "a": "nghiêm khắc", "noblank": true, "say": "The new headteacher is strict about punctuality: pupils who arrive after eight o'clock must report to the office. Although some complained, attendance has improved noticeably.", "vi": "Hiệu trưởng mới rất nghiêm khắc về đúng giờ: học sinh đến sau tám giờ phải lên văn phòng. Dù một số phàn nàn, tỷ lệ đi học đầy đủ đã cải thiện rõ rệt.", "why": "strict = nghiêm khắc, khắt khe (với người/quy định).", "new": [{"w": "punctuality", "vi": "sự đúng giờ"}, {"w": "attendance", "vi": "sự có mặt, chuyên cần"}], "tw": "strict", "ipa": "/strɪkt/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Home comfort", "s": "Describe a room in your home where you like to relax. What does it look like, and why does it make you feel comfortable?", "vi": "Hãy mô tả một căn phòng trong nhà nơi bạn thích thư giãn. Nó trông thế nào, và vì sao nó khiến bạn thấy thoải mái?", "words": ["a firm armchair", "a carpeted room", "hold on a second", "apart from", "come along", "atmosphere", "relaxed"], "why": "Mở bài nêu căn phòng, tả đồ vật chính (a firm armchair, a carpeted room), nêu bầu không khí (atmosphere, relaxed), thêm một chi tiết đời thường (come along, hold on a second) rồi kết bằng cảm xúc.", "sample": "My favourite place is the living room, which is a carpeted room with warm yellow lights. The thing I love most is a firm armchair by the window, because it supports my back when I read. The atmosphere is quiet and relaxed, especially in the evening. Apart from the armchair, there is only a small table and some books. Sometimes my sister comes along and asks me a question, and I say, “Hold on a second,” because I want to finish the page first. Honestly, this room is the best place to forget the stress of the day."}, {"type": "sp", "ctx": "Technology and society", "s": "Do you think new technology has changed the way people live? Talk about one invention that has had a big effect on society, and say whether it is good for the world.", "vi": "Bạn có nghĩ công nghệ mới đã thay đổi cách con người sống không? Hãy nói về một phát minh có ảnh hưởng lớn đến xã hội và cho biết nó có tốt cho thế giới không.", "words": ["essential", "essentially", "revolutionary", "revolution", "revolutionize", "the betterment of", "humanity", "nowadays"], "why": "Nêu phát minh, giải thích vì sao nó thiết yếu (essential) và thay đổi lớn (revolution, revolutionize), nói lợi ích cho xã hội (the betterment of, humanity), rồi nêu một mặt trái để câu trả lời cân bằng.", "sample": "I think the smartphone is a revolutionary invention. Nowadays it is essential for work, study and even shopping, because essentially it puts a computer in everyone's pocket. It has started a revolution in communication, and it could revolutionize education in remote areas where schools are far away. For the betterment of society, I believe governments should help young people get access to it. However, we must not forget that humanity also needs face-to-face contact, so people should not spend all day looking at their screens."}, {"type": "sp", "ctx": "Sport and passion", "s": "Talk about a sport you enjoy or a sportsperson you admire. Why do you like them, and how do they make you feel?", "vi": "Hãy nói về một môn thể thao bạn thích hoặc một vận động viên bạn ngưỡng mộ. Vì sao bạn thích họ và họ khiến bạn cảm thấy thế nào?", "words": ["athlete", "have a passion for", "break a record", "record breaker", "a sense of achievement"], "why": "Giới thiệu vận động viên (athlete), nói họ đam mê gì (have a passion for), thành tích nổi bật (break a record, record breaker), rồi cảm xúc của bạn (a sense of achievement).", "sample": "I admire a Vietnamese swimmer who is an amazing athlete. She had a passion for swimming from the age of six and trained every morning before school. Last year she managed to break a record at a regional competition, so the newspapers called her a record breaker. When I watched her race, I felt proud, and I imagined the sense of achievement she must have felt on the podium. Her story shows me that hard work and patience can bring great results, even if you start from a small town."}, {"type": "sp", "ctx": "Shopping habits", "s": "Do you prefer shopping in a big shopping centre or in small local shops? Explain your choice and describe a time when you bought something on special offer.", "vi": "Bạn thích mua sắm ở trung tâm thương mại lớn hay cửa hàng nhỏ địa phương? Hãy giải thích và kể về lần bạn mua hàng khuyến mãi.", "words": ["shopping centre", "under one roof", "a wide range of", "three for the price of two", "queue", "get a refund", "throw something away", "half of it", "reasonably"], "why": "Nêu lựa chọn và lý do (shopping centre, under one roof, a wide range of), kể một lần mua khuyến mãi (three for the price of two, queue, reasonably), nêu hậu quả (get a refund, throw something away, half of it).", "sample": "I like going to the shopping centre because I can find everything under one roof, and the shops sell a wide range of products. Last month there was an offer of three for the price of two on cakes, so I bought six. The prices were reasonably low, but the queue at the checkout was very long. I hate to throw food away, so I gave half of it to my cousin. Later I found that one box was damaged, but I was able to get a refund without any problem."}, {"type": "sp", "ctx": "Food and cooking", "s": "Tell me about a seafood dish you have tried. Do you cook it at home, and who in your family cooks well?", "vi": "Hãy kể về một món hải sản bạn đã thử. Bạn có nấu ở nhà không, và ai trong gia đình nấu giỏi?", "words": ["mussel", "scallop", "be good at cooking", "as long as"], "why": "Kể về món hải sản (mussel, scallop), cảm nhận hương vị, rồi nói ai nấu giỏi (be good at cooking) và điều kiện để món ngon (as long as).", "sample": "Last summer I tried mussels and scallops at a seafood restaurant near the beach. The mussels were cooked in white wine, and the scallops were grilled with garlic, so both tasted fresh and sweet. My mother is good at cooking seafood, as long as the ingredients are fresh from the market. She never uses too much sauce because she wants the natural flavour to stay. Now I would like to learn her recipe, although I know it takes a lot of practice to get the timing right."}, {"type": "sp", "ctx": "Road accident", "s": "Describe an accident you saw or heard about on the road. What happened, and how did people react?", "vi": "Hãy mô tả một vụ tai nạn bạn chứng kiến hoặc nghe kể trên đường. Chuyện gì đã xảy ra và mọi người phản ứng thế nào?", "words": ["the main road", "see an accident", "have an accident", "approach", "step off", "brake", "swerve", "crash into", "a parked car", "on the opposite side of the road", "side road"], "why": "Kể theo trình tự: địa điểm (the main road), sự việc (step off, approach, brake, swerve, crash into), kết quả (have an accident, a parked car) và phản ứng của mọi người (side road).", "sample": "Last year I saw an accident on the main road. A taxi was approaching the traffic lights when a boy stepped off the pavement and ran across. The driver braked hard and swerved to avoid him, but he crashed into a parked car on the opposite side of the road. Luckily the boy was fine. The driver was shaken because it was the first time he had an accident. Soon people came to help, and a policeman asked everyone to move to a side road."}, {"type": "sp", "ctx": "Injury and damage", "s": "Talk about a time when you or someone you know was hurt, or when something at home was damaged. What happened afterwards?", "vi": "Hãy kể về một lần bạn hoặc người quen bị thương, hoặc đồ đạc trong nhà bị hư hại. Sau đó chuyện gì xảy ra?", "words": ["injure", "be injured", "a minor injury", "damage", "be badly damaged", "damage to", "pavement"], "why": "Kể sự việc (pavement), người bị thương thế nào (be injured, a minor injury, injure), đồ vật hư hại ra sao (damage, be badly damaged, damage to) và bạn đã làm gì sau đó.", "sample": "Two years ago my brother was riding his bike home when he slipped on a wet pavement. He was injured, but it was only a minor injury, a cut on his knee. Luckily he did not injure anyone else. The bike was badly damaged, with serious damage to the front wheel. My dad said the storm had damaged the road surface, so the council should repair it. My brother felt a bit shy afterwards, but he bought a new helmet and kept cycling."}, {"type": "sp", "ctx": "Education system", "s": "Compare the school system in your country with another country that you know. What are the differences between the kinds of schools?", "vi": "Hãy so sánh hệ thống trường học ở nước bạn với một nước khác mà bạn biết. Các loại trường khác nhau thế nào?", "words": ["state education", "state school", "private school", "be operated by", "send someone to school", "attend", "nursery school", "primary school", "secondary school", "pupil"], "why": "Đi từng bậc học: nursery school, primary school, secondary school; so sánh trường công và tư (state school, private school, be operated by), rồi nêu ý kiến của bạn.", "sample": "In my country, state education is free, and most pupils go to a state school near home. A private school charges high fees, but it is usually operated by a company, so the classes are smaller. Many parents send their children to nursery school at three. They attend primary school from six and secondary school from eleven. In England, pupils start primary school earlier, and I think this gives them confidence, though Vietnamese children sometimes work harder."}, {"type": "sp", "ctx": "After school", "s": "What can young people do after they finish secondary school? Which option do you think is best?", "vi": "Người trẻ có thể làm gì sau khi học xong trung học? Bạn nghĩ lựa chọn nào là tốt nhất?", "words": ["stay at school", "take an exam", "leave school", "get a job", "vocational training", "up to", "go on to", "further education"], "why": "Nêu các lựa chọn (stay at school, leave school, get a job, vocational training, further education), mỗi lựa chọn một ý ngắn, rồi chốt lựa chọn tốt nhất với lý do.", "sample": "After secondary school, some students stay at school for two more years and take an exam to enter university. Others prefer to leave school and get a job, but I think vocational training is a better choice for them. It teaches practical skills, and the courses last up to two years. Some people go on to further education later, when they decide to change careers. In my opinion, the best option depends on personality: if you enjoy theory, choose university; if you prefer practical work, choose training."}, {"type": "sp", "ctx": "School rules", "s": "Talk about the rules at your school or workplace. Were they strict, and what happened if someone broke them?", "vi": "Hãy nói về nội quy ở trường hoặc nơi làm việc của bạn. Chúng có nghiêm khắc không và điều gì xảy ra khi ai đó vi phạm?", "words": ["strict", "dress", "smart", "call someone something", "in the past", "break the rules", "be punished for", "get into trouble", "stay behind", "write an essay"], "why": "Nêu nội quy (strict, dress, smart, call someone something), kể điều gì xảy ra khi vi phạm (break the rules, be punished for, get into trouble, stay behind, write an essay) và so sánh với thời trước (in the past).", "sample": "In my school the rules were strict. We had to dress in a smart uniform, and we had to call our teachers “sir” or “madam”. In the past, pupils who broke the rules were punished for small things such as talking in class. They got into trouble, and some had to stay behind after lessons to write an essay about their behaviour. I did not enjoy it, but I understand why teachers did it. Today the school is more flexible."}]}]};
  const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  /* ---------- prepare ---------- */
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ALL=[];
  SECTIONS.forEach(sec=>sec.qs.forEach((q,i)=>{q.id=sec.id+'q'+(i+1);q.sec=sec.id;q.n=i+1;if(q.type==='mc')q.opts=shuffle(q.o);ALL.push(q);}));
  const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));
  const STATQ=ALL.filter(q=>q.type!=='sp');

  const KEY=DATA.meta.storageKey||'drill-v1';
  let state={};
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
  const isRight=(q,v)=>q.type==='mc'?v===q.a:q.acc.some(x=>norm(x)===norm(v));

  const hintsOpen=new Set();
  let current=SECTIONS[0].id;
  const $=id=>document.getElementById(id);

  /* ---------- listening (browser speech synthesis) ---------- */
  const CAN_SPEAK=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
  let voice=null;
  /* Fallback voice: prefer natural / neural US English voices when the audio files cannot be played. */
  function pickVoice(){
    if(!CAN_SPEAK)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/aria|jenny|ava|andrew|guy|samantha|google us/i.test(v.name)?2:0)+(v.localService?0:1);
    voice=vs.sort((a,b)=>score(b)-score(a))[0]||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang))||null;
  }
  if(CAN_SPEAK){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
  let audio=null;
  let cur=null; /* what is playing now: {id, kind:'audio'|'tts', paused} */
  function updateControls(){
    document.querySelectorAll('[data-pause]').forEach(b=>{
      const active=!!cur&&cur.id===b.dataset.pause;
      b.disabled=!active;
      const paused=active&&cur.paused;
      b.querySelector('span').textContent=paused?'Tiếp tục':'Tạm dừng';
      b.querySelector('.i-pause').hidden=paused;
      b.querySelector('.i-play').hidden=!paused;
      b.classList.toggle('on',paused);
    });
  }
  function stopAudio(){
    if(audio){audio.onended=audio.onerror=audio.onplaying=null;audio.pause();audio=null;}
    if(CAN_SPEAK)speechSynthesis.cancel();
    cur=null;
    document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
    updateControls();
  }
  function togglePause(id){

    }
    if(q.hint&&!done){
      const open=hintsOpen.has(q.id);
      body+=`<div class="hintrow"><button type="button" class="ghost" data-hint="${q.id}">${open?'Ẩn gợi ý':'Gợi ý'}</button>${open?`<span class="hinttext">${esc(q.hint)}</span>`:''}</div>`;
    }
    let fb='';
    if(done){
      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
