    color-scheme:dark;
  }
}

  --primary:#62C5EA; --primary-ink:#06222F; --hl:#56661A; --hl-ink:#F4F9D0;
  --good:#66D394; --good-bg:#143A29; --bad:#FF937C; --bad-bg:#40201A; --soft:#1B3047;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{flex:1 1 200px;min-width:0;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.num b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}
.note p{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}
.slot.empty{color:transparent;user-select:none}
.slot.good{background:var(--good-bg);color:var(--good)}
.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}
input.blank:focus{outline:none;border-color:var(--primary)}
input.blank.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}

.opt,.check{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500}

.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}

.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}

.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

.spwords{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.spwords .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.spwords .chip.used{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.recbtn{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}

.rectime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.recmsg{font-size:14px;color:var(--muted);flex-basis:100%}
.manual{font-size:14px}

.spres{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;font-size:15px}
.spres audio{width:100%}
.spres .tr{margin:0;font-style:italic}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.overall{font-weight:700}
.overall .n{font-family:var(--display);font-size:28px;color:var(--primary);margin-left:6px}
.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.sample summary{cursor:pointer;font-weight:600}

@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

n cause blisters. Many shops even let you test them on a treadmill.", "vi": "Khi mua giày chạy bộ, hãy chọn đôi vừa vặn, vì giày quá nhỏ có thể gây phồng rộp. Nhiều cửa hàng còn cho bạn thử trên máy chạy bộ.", "why": "fit well = vừa vặn, đúng cỡ (nói về quần áo, giày dép).", "new": [{"w": "treadmill", "vi": "máy chạy bộ"}, {"w": "cause", "vi": "gây ra"}], "tw": "fit well", "ipa": "/fɪt wel/"}, {"type": "mc", "ctx": "Tailor's shop", "s": "The tailor measured my father twice and said that the suit he bought online still doesn't quite fit across the chest. He recommended small adjustments instead of buying a new one. What does “doesn't quite fit” mean?", "o": ["không hoàn toàn vừa", "không hề đắt tiền", "không còn hợp thời trang"], "a": "không hoàn toàn vừa", "noblank": true, "say": "The tailor measured my father twice and said that the suit he bought online still doesn't quite fit across the chest. He recommended small adjustments instead of buying a new one.", "vi": "Thợ may đo bố tôi hai lần và nói rằng bộ vest ông mua trên mạng vẫn chưa vừa lắm ở phần ngực. Ông ấy khuyên chỉnh sửa nhỏ thay vì mua bộ mới.", "why": "doesn't quite fit = không hoàn toàn vừa (hơi chật/rộng/ngắn).", "new": [{"w": "tailor", "vi": "thợ may"}, {"w": "adjustments", "vi": "sự chỉnh sửa"}], "tw": "doesn't quite fit", "ipa": "/ˈdʌz.ənt kwaɪt fɪt/"}, {"type": "mc", "ctx": "New boots", "s": "These boots are a bit tight at first, but the salesperson said that the leather will stretch after a week of wear. I decided to wait and see. What does “a bit tight” mean?", "o": ["hơi chật", "hơi nặng", "hơi bẩn"], "a": "hơi chật", "noblank": true, "say": "These boots are a bit tight at first, but the salesperson said that the leather will stretch after a week of wear. I decided to wait and see.", "vi": "Đôi bốt này lúc đầu hơi chật, nhưng nhân viên bán hàng nói da sẽ giãn ra sau một tuần mang. Tôi quyết định chờ xem sao.", "why": "a bit tight = hơi chật, hơi bó (quần áo, giày).", "new": [{"w": "leather", "v that there was nowhere to park within two kilometres. We finally left our car near the train station and walked. What does “nowhere to park” mean?", "o": ["không có chỗ đậu xe", "không có đường đi", "không có ai trông xe"], "a": "không có chỗ đậu xe", "noblank": true, "say": "The stadium was so crowded on Saturday that there was nowhere to park within two kilometres. We finally left our car near the train station and walked.", "vi": "Sân vận động đông đến mức thứ Bảy không có chỗ đậu xe trong bán kính hai ki-lô-mét. Cuối cùng chúng tôi để xe gần ga và đi bộ.", "why": "there's nowhere to park = không có chỗ đậu xe.", "new": [{"w": "crowded", "vi": "đông đúc"}], "tw": "nowhere to park", "ipa": "/ˈnəʊweə tə pɑːk/"}, {"type": "mc", "ctx": "Hiking", "s": "A narrow footpath runs between the village and the lake, and it is too small for cars. Hikers use it to reach the waterfall. What does “footpath” mean?", "o": ["lối đi bộ", "đường cao tốc", "đường ray tàu"], "a": "lối đi bộ", "noblank": true, "say": "A narrow footpath runs between the village and the lake, and it is too small for cars. Hikers use it to reach the waterfall.", "vi": "Một lối đi bộ hẹp nối làng với hồ và quá nhỏ cho ô tô. Người đi bộ đường dài dùng nó để đến thác nước.", "why": "footpath = lối đi bộ, đường mòn cho người đi bộ.", "new": [{"w": "waterfall", "vi": "thác nước"}], "tw": "footpath", "ipa": "/ˈfʊt.pɑːθ/"}, {"type": "mc", "ctx": "University", "s": "I saved my essay on two different USB sticks in case one of them stopped working. Last week, that decision saved me hours of extra work. What does “in case” mean?", "o": ["phòng khi, trong trường hợp", "miễn là", "mặc dù"], "a": "phòng khi, trong trường hợp", "noblank": true, "say": "I saved my essay on two different USB sticks in case one of them stopped working. Last week, that decision saved me hours of extra work.", "vi": "Tôi lưu bài luận trên hai chiếc USB khác nhau phòng khi một chiếc hỏng. Tuần trước, quyết định đó đã giúp tôi tiết kiệm hàng giờ làm thêm.", "why": "in case = phòng khi (chuẩn bị trước cho điều có thể xảy ra).", "new": [{"w": "essay", "vi": "bài luận"}], "tw": "in case"}, {"type": "mc", "ctx": "Workplace", "s": "The company will let employees work from home, provided that they attend a meeting at the office once a week. Managers believe this keeps the team connected. What does “provided that” mean?", "o": ["với điều kiện là", "bất chấp việc", "thay vì"], "a": "với điều kiện là", "noblank": true, "say": "The company will let employees work from home, provided that they attend a meeting at the office once a week. Managers believe this keeps the team connected.", "vi": "Công ty sẽ cho nhân viên làm việc tại nhà, với điều kiện họ dự một cuộc họp tại văn phòng mỗi tuần. Quản lý tin rằng điều này giúp đội ngũ gắn kết.", "why": "provided that = với điều kiện là.", "new": [{"w": "employees", "vi": "nhân viên"}], "tw": "provided that"}, {"type": "mc", "ctx": "Family rules", "s": "My parents allow me to stay out late as long as I send them a message and come home safely. This rule has worked well since I started university. What does “as long as” mean?", "o": ["miễn là, với điều kiện", "lâu hơn mức cần", "ngay sau khi"], "a": "miễn là, với điều kiện", "noblank": true, "say": "My parents allow me to stay out late as long as I send them a message and come home safely. This rule has worked well since I started university.", "vi": "Bố mẹ cho phép tôi về muộn miễn là tôi nhắn tin và về nhà an toàn. Quy tắc này hiệu quả từ khi tôi vào đại học.", "why": "as long as = miễn là, với điều kiện.", "new": [{"w": "safely", "vi": "an toàn"}], "tw": "as long as"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Shopping for clothes", "s": "Describe a time you bought clothes in a shop or online. Did everything fit properly, and how did you feel about the size?", "vi": "Hãy mô tả một lần bạn mua quần áo ở cửa hàng hoặc trên mạng. Quần áo có vừa không và bạn cảm thấy thế nào về cỡ?", "words": ["fit", "fit well", "doesn't quite fit", "a bit tight", "loose"], "why": "Kể bạn mua gì, ở đâu, rồi nói món đồ vừa hay chưa vừa và bạn xử lý ra sao (đổi cỡ, giữ lại).", "sample": "Last month I bought a jacket online because it was on sale. Luckily, it fits well around the shoulders, but the sleeves were a bit tight, and the waist felt a little loose. The second pair of trousers I tried doesn't quite fit either, so I asked for another size. In the end, I decided to exchange them. The shop assistant was friendly, which means I would happily buy there again, and I now always check the size chart first."}, {"type": "sp", "ctx": "Fashion and style", "s": "Do you care about matching colours and clothes? Describe an outfit that you think works well and explain why it looks good.", "vi": "Bạn có quan tâm đến việc phối màu và quần áo không? Hãy mô tả một bộ trang phục bạn thấy đẹp và giải thích vì sao.", "words": ["suit somebody better", "match something", "match perfectly", "go with something", "go well with", "look good together"], "why": "Mô tả bộ đồ, nói các món phối với nhau thế nào và vì sao hợp với người mặc.", "sample": "I enjoy choosing outfits, and my favourite one is a navy jacket with a white shirt. The jacket goes well with almost everything in my wardrobe, and the colour of the shirt can match perfectly with my shoes. Although my sister prefers bright colours, I think dark colours suit me better. The two items look good together because they are simple, and as a result I can wear them to work or to a family dinner without feeling uncomfortable."}, {"type": "sp", "ctx": "Prices and decisions", "s": "Tell me about something you bought because it was a good deal, and something you decided not to buy because of the price.", "vi": "Hãy kể về món đồ bạn mua vì giá tốt và món đồ bạn quyết định không mua vì giá.", "words": ["a reasonable price", "the price is reasonable", "I'll take it", "I'll leave it"], "why": "Kể hai tình huống: một món mua vì giá hợp lý, một món bỏ qua vì đắt, nêu lý do.", "sample": "Last year I saw a pair of headphones at a reasonable price, so I said, I'll take it. Honestly, the price is reasonable for such good quality, and I still use them every day. On the other hand, I once found a leather bag that cost three times my monthly food budget. Although it looked beautiful, I thought, I'll leave it, because I could not justify spending that much. I believe it is better to wait for a sale than to regret a purchase later."}, {"type": "sp", "ctx": "Disappointment", "s": "Talk about a time when you were disappointed because plans changed or something was no longer available. What did people say to you?", "vi": "Hãy kể về một lần bạn thất vọng vì kế hoạch thay đổi hoặc thứ gì đó không còn. Mọi người đã nói gì với bạn?", "words": ["That's a shame", "that's a pity", "It's a shame that", "What a shame"], "why": "Kể chuyện, dùng các cách bày tỏ tiếc nuối, rồi nói bạn xử lý cảm xúc thế nào.", "sample": "Last summer, my friends and I planned a trip to the beach, but the weather forecast showed heavy rain. When I told my mother, she said, that's a pity, because I had been looking forward to it for weeks. My colleague also said, what a shame, and added, it's a shame that the holiday only comes once a year. At first I felt upset, but we decided to have a picnic at home, and honestly it turned out to be fun. That's a shame, but life goes on."}, {"type": "sp", "ctx": "Faulty products", "s": "Describe a time when you bought something that did not work properly. What happened when you went back to the shop?", "vi": "Hãy mô tả một lần bạn mua món đồ không hoạt động tốt. Chuyện gì xảy ra khi bạn quay lại cửa hàng?", "words": ["something wrong with something", "give somebody a refund", "in case"], "why": "Kể món đồ, lỗi là gì, nhân viên phản ứng ra sao và bạn có nhận hoàn tiền không.", "sample": "A few months ago, I bought a hairdryer, but I soon noticed there was something wrong with it, because it stopped after two minutes. I took it back with the receipt in case the shop asked for proof. The manager apologised and agreed to give me a refund immediately. I was relieved, since I had expected a long argument. Since then, I keep every receipt for at least a month, and I always test electrical products in the shop before I leave."}, {"type": "sp", "ctx": "Fruit markets", "s": "What kinds of fruit are popular in your country? Describe a fruit market you know and what you usually buy there.", "vi": "Ở nước bạn loại trái cây nào phổ biến? Hãy mô tả một khu chợ trái cây bạn biết và thứ bạn thường mua.", "words": ["a bunch of grapes", "pomelo", "grapefruit", "persimmon", "pomegranate", "cantaloupe", "guava", "lychee"], "why": "Mô tả chợ, kể vài loại trái cây theo mùa và hương vị, rồi nói bạn hay mua gì.", "sample": "There is a lively market near my house where I often buy fruit. In summer, I take a bunch of grapes and some lychee, which is sweet and juicy. My grandmother prefers pomelo, while I find grapefruit too bitter. In autumn, persimmon and pomegranate appear, and a friend sells guava and cantaloupe from his small truck. Because the fruit is fresh, I usually spend more than I planned, but I feel it is worth it for my health."}, {"type": "sp", "ctx": "Fruit and snacks", "s": "Which fruit do you eat most often, and which would you like to try? Describe the taste and how you usually eat it.", "vi": "Bạn ăn loại trái cây nào thường xuyên nhất và muốn thử loại nào? Hãy mô tả vị và cách bạn thường ăn.", "words": ["a bunch of bananas", "mandarin", "mangosteen", "custard apple", "passion fruit", "rambutan", "papaya", "plum", "raspberry", "blueberry"], "why": "Chọn vài loại, mô tả vị, so sánh và nói cách ăn (ăn sống, làm sinh tố, trộn sữa chua).", "sample": "I usually buy a bunch of bananas and a mandarin for work. At weekends I enjoy mangosteen and rambutan, although they cost more. My mother mixes passion fruit with yoghurt, while I like papaya for breakfast because it is soft. Custard apple tastes like pudding, whereas a plum is sharper. I put raspberry and blueberry on pancakes, which makes a healthy dessert. I would like to try more exotic fruit while travelling in Southeast Asia next year."}, {"type": "sp", "ctx": "Seasonal food", "s": "Do you prefer eating food that is in season? Explain how you tell whether fruit is ready to eat and what you do with fruit that is not.", "vi": "Bạn có thích ăn thực phẩm đúng mùa không? Giải thích cách bạn biết trái cây đã sẵn sàng để ăn chưa và bạn làm gì với quả chưa chín.", "words": ["ripe fruit", "unripe fruit", "be in season", "be out of season"], "why": "Nêu quan điểm về thực phẩm theo mùa, cách chọn quả chín và mẹo làm quả chín nhanh.", "sample": "I try to buy fruit when it is in season, because it is cheaper and tastier. When fruit is out of season, it often has to be imported, which means higher prices. I always press the skin gently, since ripe fruit is soft and smells sweet. If I accidentally buy unripe fruit, I put it in a paper bag for a few days. Eating seasonally also reduces pollution from transport, so it is good for both my wallet and the environment."}, {"type": "sp", "ctx": "Preparing fruit", "s": "How do you prepare fruit at home for your family or guests? Describe each step and any helpful tips.", "vi": "Bạn chuẩn bị trái cây ở nhà cho gia đình hoặc khách như thế nào? Hãy mô tả từng bước và mẹo hữu ích.", "words": ["slice the fruit", "peel a fruit", "squeeze a lemon", "lemon", "lime", "pass something down the line"], "why": "Kể theo thứ tự: rửa, gọt, thái, thêm chanh, rồi cách dọn ra cho mọi người.", "sample": "When guests visit, I like to prepare a big fruit plate. First, I peel a fruit such as an apple, and then I slice the fruit into thin pieces. To stop it turning brown, I squeeze a lemon over it, and sometimes I add lime juice for a fresher taste. My children carry the plates to the table, and the guests pass them down the line so everyone can reach them. It is simple, healthy and always popular."}, {"type": "sp", "ctx": "Rules and conditions", "s": "Talk about a rule or condition you have agreed to, for example in a job, a rented flat or a town trip. Why does it exist, and how do you cope?", "vi": "Hãy nói về một quy tắc hay điều kiện bạn đã đồng ý, ví dụ ở chỗ làm, nhà thuê hoặc khi đi chơi. Vì sao có nó và bạn thích nghi thế nào?", "words": ["provided that", "as long as", "in case", "nowhere to park", "footpath"], "why": "Nêu quy tắc, lý do tồn tại, dùng 'provided that / as long as' và một ví dụ cụ thể về đi lại hoặc đỗ xe.", "sample": "My landlord lets me keep a small dog, provided that I clean the garden regularly. He also says I can stay as long as I pay the rent on time. Because there is nowhere to park near the building, I leave my bike in a shared yard, and I take the footpath along the river to work. I carry a spare key in case I lose mine. These rules seem strict, but they keep the neighbourhood quiet and tidy."}]}]};
  const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  /* ---------- prepare ---------- */
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ALL=[];
  SECTIONS.forEach(sec=>sec.qs.forEach((q,i)=>{q.id=sec.id+'q'+(i+1);q.sec=sec.id;q.n=i+1;if(q.type==='mc')q.opts=shuffle(q.o);ALL.push(q);}));
  const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));
  const STATQ=ALL.filter(q=>q.type!=='sp');

  const KEY=DATA.meta.storageKey||'drill-v1';
  let state={};
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
  const isRight=(q,v)=>q.type==='mc'?v===q.a:q.acc.some(x=>norm(x)===norm(v));

  const hintsOpen=new Set();
  let current=SECTIONS[0].id;
  const $=id=>document.getElementById(id);

  /* ---------- listening (browser speech synthesis) ---------- */
  const CAN_SPEAK=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
  let voice=null;
  /* Fallback voice: prefer natural / neural US English voices when the audio files cannot be played. */
  function pickVoice(){
    if(!CAN_SPEAK)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/aria|jenny|ava|andrew|guy|samantha|google us/i.test(v.name)?2:0)+(v.localService?0:1);
    voice=vs.sort((a,b)=>score(b)-score(a))[0]||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang))||null;
  }
  if(CAN_SPEAK){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
  let audio=null;
  let cur=null; /* what is playing now: {id, kind:'audio'|'tts', paused} */
  function updateControls(){
    document.querySelectorAll('[data-pause]').forEach(b=>{
      const active=!!cur&&cur.id===b.dataset.pause;
      b.disabled=!active;
      const paused=active&&cur.paused;
      b.querySelector('span').textContent=paused?'Tiếp tục':'Tạm dừng';
      b.querySelector('.i-pause').hidden=paused;
      b.querySelector('.i-play').hidden=!paused;
      b.classList.toggle('on',paused);
    });
  }
  function stopAudio(){
    if(audio){audio.onended=audio.onerror=audio.onplaying=null;audio.pause();audio=null;}
    if(CAN_SPEAK)speechSynthesis.cancel();
    cur=null;
    document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
    updateControls();
  }
  function togglePause(id){
    if(!cur||cur.id!==id)return;
    if(cur.kind==='audio'&&audio){
      if(audio.paused){audio.play();cur.paused=false;}else{audio.pause();cur.paused=true;}
    }else if(cur.kind==='tts'&&CAN_SPEAK){
      if(speechSynthesis.paused){speechSynthesis.resume();cur.paused=false;}else{speechSynthesis.pause();cur.paused=true;}
    }
    updateControls();
  }
  function speakFallback(id,done,slow,btn){
    if(!CAN_SPEAK){cur=null;updateControls();return;}
    const q=byId[id];
    const text=q.type==='sp'?q.s:(q.listen?q.s.replace('___',q.a||'')+'':q.s.includes('___')?q.s.replace('___',done?q.a:'blank'):(done?q.s+' '+q.a:q.s)).replace(/\b(\d{1,2})\.(\d{2})\b/g,'$1:$2');
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang;}
    u.rate=slow?0.65:0.95;
    cur={id,kind:'tts',paused:false};
    u.onstart=()=>{btn&&btn.classList.add('on');updateControls();};
    u.onend=u.onerror=()=>{btn&&btn.classList.remove('on');if(cur&&cur.kind==='tts'&&cur.id===id)cur=null;updateControls();};
    speechSynthesis.speak(u);
    updateControls();
  }
  function speak(id,slow,btn){
    stopAudio();

         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
