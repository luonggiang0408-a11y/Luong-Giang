.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;font-weight:800;text-wrap:balance}

button{font:inherit;color:inherit;cursor:pointer}

.ghost:hover{border-color:var(--primary);color:var(--ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.tab small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

.note p{margin:0}

.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--primary);font-variant-numeric:tabular-nums}
.ctx{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}

.slot.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
input.blank{font:inherit;font-weight:600;width:11ch;max-width:100%;padding:1px 8px;border:2px solid var(--hl);border-radius:6px;background:var(--surface);color:var(--ink);text-align:center}

.disc{font-size:12px;color:var(--muted);margin:0}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}

@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

nged the plan and started speaking quickly in a language they did not understand.", "o": ["confident", "delighted", "confused"], "a": "confused", "vi": "Các du khách trông bối rối khi hướng dẫn viên đột ngột đổi kế hoạch và nói nhanh bằng một thứ tiếng họ không hiểu.", "why": "confused (adj) = cảm thấy bối rối (chỉ cảm giác của người).", "new": [{"w": "guide", "vi": "hướng dẫn viên"}], "tw": "confused", "ipa": "/kənˈfjuːzd/"}, {"type": "mc", "ctx": "Airport signs", "s": "The airport's signs are very ___ for first-time visitors, so many people end up at the wrong gate.", "o": ["clear", "reliable", "confusing"], "a": "confusing", "vi": "Biển chỉ dẫn ở sân bay rất khó hiểu với người đến lần đầu, nên nhiều người đi nhầm cổng.", "why": "confusing (adj) = gây khó hiểu (mô tả sự vật); confused mô tả người.", "new": [{"w": "gate", "vi": "cổng lên máy bay"}], "tw": "confusing", "ipa": "/kənˈfjuː.zɪŋ/"}, {"type": "mc", "ctx": "Office email", "s": "To avoid ___ about the meeting time, the secretary sent everyone a reminder with the date written clearly in bold.", "o": ["confusion", "competition", "ambition"], "a": "confusion", "vi": "Để tránh nhầm lẫn về giờ họp, thư ký gửi cho mọi người một lời nhắc với ngày được in đậm rõ ràng.", "why": "confusion (n) = sự bối rối, sự lộn xộn (sheet ghi 'confusing' danh từ; dạng đúng là confusion).", "new": [{"w": "reminder", "vi": "lời nhắc"}, {"w": "bold", "vi": "in đậm"}], "tw": "confusion"}, {"type": "mc", "ctx": "Voting day", "s": "A good ___ should listen to ordinary voters, not only to rich companies that pay for expensive election adverts.", "o": ["politician", "dentist", "mechanic"], "a": "politician", "vi": "Một chính trị gia tốt nên lắng nghe cử tri bình thường, chứ không chỉ các công ty giàu trả tiền cho quảng cáo bầu cử đắt đỏ.", "why": "politician (n) = chính trị gia.", "new": [{"w": "voters", "vi": "cử tri"}, {"w": "adverts", "vi": "quảng cáo"}], "tw": "politician", "ipa": "/ˌpɑː.ləˈtɪʃ.ən/"}, {"type": "mc", "ctx": "Bird research", "s": "Scientists are ___ about why some birds fly thousands of kilometres every year and still find the same small island.", "o": ["furious", "miserable", "curious"], "a": "curious", "vi": "Các nhà khoa học tò mò về lý do một số loài chim bay hàng nghìn ki-lô-mét mỗi năm mà vẫn tìm đúng hòn đảo nhỏ ấy.", "why": "curious (adj) = ham tìm hiểu, tò mò; curious about / to know.", "new": [{"w": "thousands", "vi": "hàng nghìn"}], "tw": "curious", "ipa": "/ˈkjʊr.i.əs/"}, {"type": "mc", "ctx": "Learning early", "s": "Children learn quickly because their natural ___ makes them ask questions and try new things instead of waiting for instructions.", "o": ["curiosity", "patience", "salary"], "a": "curiosity", "vi": "Trẻ em học nhanh vì sự tò mò tự nhiên khiến chúng đặt câu hỏi và thử điều mới thay vì chờ hướng dẫn.", "why": "curiosity (n) = sự tò mò; out of curiosity = vì tò mò.", "new": [{"w": "instructions", "vi": "hướng dẫn"}], "tw": "curiosity", "ipa": "/ˌkjʊr.iˈɑː.sə.t̬i/"}, {"type": "mc", "ctx": "Tourist spot", "s": "The toddler looked ___ at the stranger's camera, leaning forward until his mother gently pulled him back.", "o": ["angrily", "curiously", "sleepily"], "a": "curiously", "vi": "Đứa bé nhìn chiếc máy ảnh của người lạ một cách tò mò, nghiêng người tới cho đến khi mẹ nhẹ nhàng kéo lại.", "why": "curiously (adv) = một cách tò mò.", "new": [{"w": "toddler", "vi": "trẻ mới biết đi"}], "tw": "curiously", "ipa": "/ˈkjʊr.i.əs.li/"}, {"type": "mc", "ctx": "Workplace", "s": "Some employees became ___ of their colleague when she was promoted after only six months, even though they had worked there for years.", "o": ["capable", "typical", "jealous"], "a": "jealous", "vi": "Một số nhân viên ghen tị với đồng nghiệp khi cô được thăng chức chỉ sau sáu tháng, dù họ đã làm ở đó nhiều năm.", "why": "jealous (adj) = ghen tị; be jealous of sb/sth.", "new": [{"w": "promoted", "vi": "được thăng chức"}], "tw": "jealous", "ipa": "/ˈdʒel.əs/"}, {"type": "mc", "ctx": "Dance floor", n ___ asthma, according to a recent survey published by the local hospital.", "o": ["pay for", "hope for", "suffer from"], "a": "suffer from", "vi": "Ngày càng nhiều người lớn trong vùng bị hen suyễn, theo một khảo sát gần đây do bệnh viện địa phương công bố.", "why": "suffer from = bị, chịu đựng (bệnh/vấn đề).", "new": [{"w": "asthma", "vi": "bệnh hen"}, {"w": "survey", "vi": "khảo sát"}], "tw": "suffer from"}, {"type": "mc", "ctx": "Hearing loss", "s": "Hearing loss is not always caused by age; sometimes a rare medical ___ damages the nerves in the ear.", "o": ["ceremony", "disorder", "invention"], "a": "disorder", "vi": "Mất thính lực không phải lúc nào cũng do tuổi tác; đôi khi một rối loạn y khoa hiếm gặp làm tổn thương dây thần kinh ở tai.", "why": "disorder (n) = chứng rối loạn (y học).", "new": [{"w": "nerves", "vi": "dây thần kinh"}], "tw": "disorder", "ipa": "/dɪˈsɔːr.dɚ/"}, {"type": "mc", "ctx": "Awareness campaign", "s": "Public campaigns are trying to reduce the stigma around ___, because many patients are too embarrassed to ask for professional help.", "o": ["traffic rules", "tourist attractions", "mental disorders"], "a": "mental disorders", "vi": "Các chiến dịch cộng đồng đang cố giảm sự kỳ thị đối với các rối loạn tâm thần, vì nhiều bệnh nhân quá ngại để xin giúp đỡ chuyên môn.", "why": "mental disorders = các rối loạn tâm thần/tâm lý.", "new": [{"w": "stigma", "vi": "sự kỳ thị"}, {"w": "embarrassed", "vi": "ngại ngùng"}], "tw": "mental disorders"}, {"type": "mc", "ctx": "Hospital clinic", "s": "The hospital has opened a special clinic for ___, where patients spend the night in a quiet room while machines record their breathing.", "o": ["sleep disorders", "skin infections", "sports injuries"], "a": "sleep disorders", "vi": "Bệnh viện mở một phòng khám đặc biệt cho các rối loạn giấc ngủ, nơi bệnh nhân qua đêm trong phòng yên tĩnh trong khi máy ghi lại nhịp thở.", "why": "sleep disorders = các rối loạn giấc ngủ.", "new": [{"w": "breathing", "vi": "hơi "w": "underground", "vi": "ngầm dưới đất"}, {"w": "cathedral", "vi": "nhà thờ lớn"}], "tw": "follow signs to", "ipa": "/ˈfɒləʊ saɪnz fə/"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Family wedding", "s": "Dan is not an emotional person, but he cried at his sister's wedding. Everyone understood, because he had helped her through some very difficult years. What does “emotional” mean?", "o": ["hay giận dữ", "dễ xúc động", "hay lo lắng"], "a": "dễ xúc động", "noblank": true, "say": "Dan is not an emotional person, but he cried at his sister's wedding. Everyone understood, because he had helped her through some very difficult years.", "vi": "Dan không phải người dễ xúc động, nhưng anh đã khóc trong đám cưới của em gái. Ai cũng hiểu, vì anh đã giúp cô vượt qua nhiều năm khó khăn.", "why": "emotional (adj) = dễ xúc động, thuộc về cảm xúc.", "new": [{"w": "wedding", "vi": "đám cưới"}], "tw": "emotional", "ipa": "/ɪˈmoʊ.ʃən.əl/"}, {"type": "mc", "ctx": "Farewell speech", "s": "During his farewell speech, the coach started to get emotional and had to stop for a moment. The players, who had worked with him for ten years, clapped loudly. What does “get emotional” mean?", "o": ["trở nên buồn ngủ", "trở nên xúc động", "trở nên tức giận"], "a": "trở nên xúc động", "noblank": true, "say": "During his farewell speech, the coach started to get emotional and had to stop for a moment. The players, who had worked with him for ten years, clapped loudly.", "vi": "Trong bài phát biểu chia tay, huấn luyện viên bắt đầu xúc động và phải dừng lại một lúc. Các cầu thủ, những người đã làm việc với ông mười năm, vỗ tay thật to.", "why": "get/become emotional = trở nên xúc động; get emotional dùng thân mật hơn become.", "new": [{"w": "farewell", "vi": "chia tay"}, {"w": "clapped", "vi": "vỗ tay"}], "tw": "get emotional"}, {"type": "mc", "ctx": "Giving a talk", "s": "If you speak too fast, you may confuse the listeners. They will not be sure which point is the most important, and some will stop paying attention. What does “confuse” mean?", "o": ["làm ai thích thú", "làm ai bối rối, nhầm lẫn", "làm ai tức giận"], "a": "làm ai bối rối, nhầm lẫn", "noblank": true, "say": "If you speak too fast, you may confuse the listeners. They will not be sure which point is the most important, and some will stop paying attention.", "vi": "Nếu bạn nói quá nhanh, bạn có thể làm người nghe bối rối. Họ sẽ không chắc ý nào quan trọng nhất, và một số người sẽ ngừng chú ý.", "why": "confuse (v) = làm ai bối rối / nhầm lẫn; confuse A with B = nhầm A với B.", "new": [{"w": "point", "vi": "ý chính"}, {"w": "pay attention", "vi": "chú ý"}], "tw": "confuse", "ipa": "/kənˈfjuːz/"}, {"type": "mc", "ctx": "Lost downtown", "s": "Tom was confused by the road signs in the city centre. He stopped twice to check his map and still could not find the hotel. What does “confused” mean?", "o": ["cảm thấy bối rối, không hiểu", "cảm thấy mệt mỏi", "cảm thấy hào hứng"], "a": "cảm thấy bối rối, không hiểu", "noblank": true, "say": "Tom was confused by the road signs in the city centre. He stopped twice to check his map and still could not find the hotel.", "vi": "Tom bối rối trước các biển báo ở trung tâm thành phố. Anh dừng hai lần để xem bản đồ mà vẫn không tìm được khách sạn.", "why": "confused (adj) = cảm thấy bối rối (chỉ cảm giác của người).", "new": [{"w": "road signs", "vi": "biển báo"}], "tw": "confused", "ipa": "/kənˈfjuːzd/"}, {"type": "mc", "ctx": "English spelling", "s": "Many learners find English spelling confusing. The letters 'ough' are pronounced differently in 'though', 'through' and 'tough', which makes reading aloud difficult. What does “confusing” mean?", "o": ["quen thuộc, dễ đoán", "thú vị, hấp dẫn", "gây khó hiểu, rối rắm"], "a": "gây khó hiểu, rối rắm", "noblank": true, "say": "Many learners find English spelling confusing. The letters 'ough' are pronounced differently in 'though', 'through' and 'tough', which makes reading aloud difficult.", "vi": "Nhiều người học thấy chính tả tiếng Anh khó hiểu. Chữ 'ough' được phát âm khác nhau trong 'though', 'through' và 'tough', khiến việc đọc to trở nên khó.", "why": "confusing (adj) = gây khó hiểu (mô tả sự vật); confused mô tả người.", "new": [{"w": "pronounced", "vi": "được phát âm"}], "tw": "confusing", "ipa": "/kənˈfjuː.zɪŋ/"}, {"type": "mc", "ctx": "Power cut", "s": "In the confusion after the power cut, nobody knew which exit to use. People pushed in different directions until a security guard calmly took control. What does “confusion” mean?", "o": ["sự bối rối, hỗn loạn", "sự yên tĩnh, trật tự", "sự vui mừng"], "a": "sự bối rối, hỗn loạn", "noblank": true, "say": "In the confusion after the power cut, nobody knew which exit to use. People pushed in different directions until a security guard calmly took control.", "vi": "Trong cảnh hỗn loạn sau khi mất điện, không ai biết dùng lối thoát nào. Mọi người chen về nhiều hướng cho đến khi một nhân viên bảo vệ bình tĩnh nắm quyền kiểm soát.", "why": "confusion (n) = sự bối rối, sự lộn xộn (sheet ghi 'confusing' danh từ; dạng đúng là confusion).", "new": [{"w": "exit", "vi": "lối thoát"}, {"w": "security guard", "vi": "bảo vệ"}], "tw": "confusion"}, {"type": "mc", "ctx": "Press conference", "s": "The politician gave a long speech about public transport. Journalists asked him how the plan would be paid for, but he avoided the question. What does “politician” mean?", "o": ["chính trị gia", "nhà báo", "luật sư"], "a": "chính trị gia", "noblank": true, "say": "The politician gave a long speech about public transport. Journalists asked him how the plan would be paid for, but he avoided the question.", "vi": "Chính trị gia đọc một bài diễn văn dài về giao thông công cộng. Các nhà báo hỏi kế hoạch sẽ lấy tiền từ đâu, nhưng ông né câu hỏi.", "why": "politician (n) = chính trị gia.", "new": [{"w": "journalists", "vi": "nhà báo"}, {"w": "avoided", "vi": "né tr nd it twice and took many photos, trying to guess what it was used for.", "vi": "Du khách nhìn tòa nhà lạ một cách tò mò. Họ đi quanh nó hai lần và chụp nhiều ảnh, cố đoán nó dùng để làm gì.", "why": "curiously (adv) = một cách tò mò.", "new": [{"w": "guess", "vi": "đoán"}], "tw": "curiously", "ipa": "/ˈkjʊr.i.əs.li/"}, {"type": "mc", "ctx": "Brothers", "s": "Tom was jealous of his brother's new bike. He kept complaining that it wasn't fair, and refused to ride with him. What does “jealous” mean?", "o": ["ghen tị", "biết ơn", "tự hào"], "a": "ghen tị", "noblank": true, "say": "Tom was jealous of his brother's new bike. He kept complaining that it wasn't fair, and refused to ride with him.", "vi": "Tom ghen tị với chiếc xe đạp mới của anh trai. Cậu cứ phàn nàn rằng như vậy không công bằng và không chịu đạp xe cùng anh.", "why": "jealous (adj) = ghen tị; be jealous of sb/sth.", "new": [{"w": "complaining", "vi": "phàn nàn"}], "tw": "jealous", "ipa": "/ˈdʒel.əs/"}, {"type": "mc", "ctx": "New phone", "s": "Anna looked jealously at her friend's new phone. She had saved money for months, but she still could not afford one. What does “jealously” mean?", "o": ["một cách giận dữ", "một cách hài lòng", "một cách ghen tị"], "a": "một cách ghen tị", "noblank": true, "say": "Anna looked jealously at her friend's new phone. She had saved money for months, but she still could not afford one.", "vi": "Anna ghen tị nhìn chiếc điện thoại mới của bạn. Cô đã tiết kiệm nhiều tháng nhưng vẫn không đủ tiền mua.", "why": "jealously (adv) = một cách ghen tuông/ghen tị.", "new": [{"w": "afford", "vi": "đủ khả năng chi trả"}], "tw": "jealously", "ipa": "/ˈdʒel.əs.li/"}, {"type": "mc", "ctx": "Awards night", "s": "She could not hide her jealousy when her colleague received an award. She smiled politely, but her friends could see that she was upset. What does “jealousy” mean?", "o": ["sự ngạc nhiên", "sự ghen tị", "sự biết ơn"], "a": "sự ghen tị", "noblank": true, "say": "She could not hide her  area", "s": "He took the wrong turning outside the station and found himself in an industrial area. Fortunately, a taxi driver helped him find the main road again. What does “take the wrong turning” mean?", "o": ["đi đúng đường tắt", "rẽ nhầm đường", "dừng xe nghỉ"], "a": "rẽ nhầm đường", "noblank": true, "say": "He took the wrong turning outside the station and found himself in an industrial area. Fortunately, a taxi driver helped him find the main road again.", "vi": "Anh rẽ nhầm đường ngoài nhà ga và thấy mình ở một khu công nghiệp. May mắn, một tài xế taxi giúp anh tìm lại đường chính.", "why": "take the wrong turning = rẽ nhầm đường.", "new": [{"w": "industrial", "vi": "công nghiệp"}, {"w": "fortunately", "vi": "may mắn"}], "tw": "take the wrong turning", "ipa": "/teɪk ðə rɒŋ ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Post office", "s": "I asked a woman the way to the post office. She not only explained the route clearly but also walked with me to the corner. What does “ask someone the way” mean?", "o": ["chỉ đường cho ai", "hỏi đường ai đó", "nhờ ai mua giúp vé"], "a": "hỏi đường ai đó", "noblank": true, "say": "I asked a woman the way to the post office. She not only explained the route clearly but also walked with me to the corner.", "vi": "Tôi hỏi một phụ nữ đường đến bưu điện. Bà không chỉ giải thích rõ lộ trình mà còn đi cùng tôi đến góc phố.", "why": "ask somebody the way (to somewhere) = hỏi đường ai.", "new": [{"w": "route", "vi": "lộ trình"}], "tw": "ask someone the way", "ipa": "/ɑːsk ðə weɪ/"}, {"type": "mc", "ctx": "Museum visit", "s": "A security guard directed us to the exhibition hall. He pointed down the corridor and told us to take the lift to the third floor. What does “direct” mean?", "o": ["chỉ đường cho ai tới đâu", "đưa tiền cho ai", "ngăn ai vào"], "a": "chỉ đường cho ai tới đâu", "noblank": true, "say": "A security guard directed us to the exhibition hall. He pointed down the corridor and told us to take the lift to the third floor.", "vi": "Một nhân viên bảo vệ chỉ chúng tôi đến phòng triển lãm. Anh chỉ xuống hành lang và bảo đi thang máy lên tầng ba.", "why": "direct sb to somewhere = chỉ đường cho ai tới đâu.", "new": [{"w": "exhibition", "vi": "triển lãm"}, {"w": "lift", "vi": "thang máy"}], "tw": "direct", "ipa": "/dəˈrekt/"}, {"type": "mc", "ctx": "Beach trip", "s": "If you want to find the beach, just follow the signs to the harbour. The path runs along the river and takes about ten minutes. What does “follow signs to” mean?", "o": ["chụp ảnh biển báo", "đỗ xe cạnh biển báo", "đi theo biển chỉ dẫn tới"], "a": "đi theo biển chỉ dẫn tới", "noblank": true, "say": "If you want to find the beach, just follow the signs to the harbour. The path runs along the river and takes about ten minutes.", "vi": "Nếu muốn tìm bãi biển, cứ đi theo biển chỉ dẫn tới bến cảng. Con đường chạy dọc sông và mất khoảng mười phút.", "why": "follow signs to + nơi = đi theo biển chỉ dẫn tới.", "new": [{"w": "harbour", "vi": "bến cảng"}], "tw": "follow signs to", "ipa": "/ˈfɒləʊ saɪnz fə/"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Feelings and family", "s": "Tell me about a family member or friend who is very emotional. When do they get emotional, and how do you usually react?", "vi": "Hãy kể về một người thân hoặc bạn rất dễ xúc động. Họ thường xúc động khi nào và bạn thường phản ứng ra sao?", "words": ["emotional", "get emotional", "cheerful", "miserable", "jealous", "jealousy", "jealously", "curious", "curiosity", "curiously"], "why": "Giới thiệu người đó, nêu tình huống họ xúc động, rồi kể phản ứng của bạn và một kỷ niệm ngắn.", "sample": "I would like to talk about my older sister, who is a very emotional person. She is usually cheerful, but she tends to get emotional at weddings and graduations. Once she felt miserable because a colleague got a promotion, and I think a little jealousy was behind it. She watched him jealously, although she would never admit it. Because I am naturally curious, I asked her about it, and my curiosity made her laugh. She looked at me curiously and then told me everything. Now I try to listen patiently whenever she needs support."}, {"type": "sp", "ctx": "Confusing situations", "s": "Describe a time when you felt confused by instructions, signs or rules. What was confusing, and how did you solve the problem?", "vi": "Hãy mô tả một lần bạn thấy bối rối vì hướng dẫn, biển báo hoặc quy định. Điều gì gây khó hiểu và bạn giải quyết thế nào?", "words": ["confuse", "confused", "confusing", "confusion", "politician"], "why": "Nêu tình huống, điều gì khó hiểu, cảm xúc của bạn, cách xử lý và bài học.", "sample": "I remember a time when new parking rules confused many people in my city. The signs were so confusing that nobody knew where to park, and the confusion caused long traffic jams. I felt confused too, so I asked a shopkeeper for help. Later I read that a local politician had approved the changes without checking them with residents. In my opinion, rules should never confuse ordinary people. They should be short and clear, and officials should test them before using them. Since then, I always read official notices carefully."}, {"type": "sp", "ctx": "Health and sleep", "s": "Do you think modern life causes health problems such as sleep disorders or anxiety disorders? Explain your opinion with examples.", "vi": "Bạn có nghĩ cuộc sống hiện đại gây ra các vấn đề sức khỏe như rối loạn giấc ngủ hay rối loạn lo âu không? Giải thích bằng ví dụ.", "words": ["suffer from", "disorder", "mental disorders", "sleep disorders", "anxiety disorders", "eating disorders"], "why": "Nêu quan điểm, đưa 2 ví dụ (công việc, mạng xã hội) và kết luận bằng gợi ý giải pháp.", "sample": "Yes, I think modern life can damage our health. Many young people suffer from sleep disorders because they use their phones late at night. Others develop anxiety disorders when work or exams put them under constant pressure. Social media may also contribute to eating disorders, since people compare their bodies with edited photos. Experts say that untreated mental disorders can harm both work and relationships. A disorder is not a weakness, so people should ask for professional help early. Personally, I try to sleep at regular times and talk to my friends when I feel stressed."}, {"type": "sp", "ctx": "Mood and stress", "s": "Talk about a time when you felt depressed or very tired of something. What caused it, and what helped you feel better?", "vi": "Hãy kể về lần bạn thấy chán nản hoặc rất mệt mỏi vì điều gì đó. Nguyên nhân là gì và điều gì giúp bạn khá hơn?", "words": ["depress", "depressed", "depressing", "depression", "energetically", "frightened of"], "why": "Kể nguyên nhân, cảm xúc, hành động giúp bạn hồi phục và lời khuyên cho người khác.", "sample": "A few years ago I felt depressed after I failed an important exam. The result was depressing, and for weeks I was frightened of studying again. Bad news can depress anyone, and long periods of sadness may turn into depression. What helped me was exercise. I started running every morning and played football energetically with my friends at weekends. Slowly, my mood improved, and I was able to study again. If you ever feel like that, I would advise you to talk to someone and do something active."}, {"type": "sp", "ctx": "Food and shopping offers", "s": "What do you usually eat for breakfast? Do you think special offers in supermarkets make people buy more than they need?", "vi": "Bạn thường ăn gì vào bữa sáng? Bạn có nghĩ khuyến mãi ở siêu thị khiến người ta mua nhiều hơn mức cần không?", "words": ["cereal", "likely", "be likely to", "on special offer"], "why": "Nói về bữa sáng thường ngày, rồi nêu quan điểm về khuyến mãi với lý do và ví dụ.", "sample": "I usually have cereal with milk and fruit for breakfast because it is quick and healthy. When I go shopping, I often notice that cereal is on special offer. Many customers are likely to buy two boxes even if they only need one. In my opinion, supermarkets use discounts to make people spend more. It is likely that a shopper who sees a red sign will be more tempted to buy extra products. To avoid this, I make a list before I go and I try to stay away from the special offer shelves."}, {"type": "sp", "ctx": "Clothes and returns", "s": "Describe an outfit you like. What colours look good on you, and what do you do if you buy clothes that are faulty or do not fit?", "vi": "Hãy mô tả một bộ đồ bạn thích. Màu nào hợp với bạn và bạn làm gì nếu mua quần áo bị lỗi hoặc không vừa?", "words": ["do up", "undo", "look good in", "suit", "take back", "refund", "give a refund"], "why": "Tả bộ đồ, màu hợp với bạn, rồi kể cách đổi trả và xin hoàn tiền.", "sample": "My favourite outfit is a navy jacket and a white shirt. I think I look good in dark blue, and my friends say the colour really suits me. The jacket is warm, so I do up the zip in winter, but I undo it indoors. Once I bought a jacket that was too small, so I decided to take it back to the shop. The assistant checked my receipt and agreed to give me a refund. I was pleased because it was easy. Now I always keep my receipts when I buy clothes."}, {"type": "sp", "ctx": "Bargains and problems", "s": "Have you ever haggled in a market or complained about a faulty product? Describe what happened and how you felt.", "vi": "Bạn đã từng mặc cả ở chợ hoặc khiếu nại về sản phẩm lỗi chưa? Hãy mô tả chuyện gì xảy ra và cảm nhận của bạn.", "words": ["haggle", "haggle over the price", "agree a lower price", "something wrong with", "What goes up must come down", "in the right spot"], "why": "Kể tình huống, cách thương lượng, kết quả và bài học về mua sắm.", "sample": "Last summer I visited a night market and wanted to buy a lamp. The seller asked for a very high price, so I decided to haggle. We spent ten minutes trying to haggle over the price, and finally we agreed a lower price. At home I found that there was something wrong with the switch, so I returned the next day. The seller remembered me and fixed it. I put the lamp in the right spot, next to my desk. People say that what goes up must come down, and prices at markets are no exception."}, {"type": "sp", "ctx": "Village life", "s": "Describe a village or small town that you know. What does the landscape look like, and is it a good place for young people to live?", "vi": "Hãy mô tả một ngôi làng hoặc thị trấn nhỏ bạn biết. Cảnh quan trông thế nào và đó có phải nơi tốt cho người trẻ sống không?", "words": ["there isn't much to do", "hopeless", "hill", "valley", "field", "farmhouse", "fence"], "why": "Mô tả vị trí và cảnh quan, rồi nói điểm mạnh và điểm yếu cho người trẻ.", "sample": "My grandparents live in a small village in a green valley. Behind their old farmhouse there is a large field, and a wooden fence separates it from the road. From the top of the nearest hill you can see the whole village. It is beautiful, but for young people there isn't much to do in the evenings. Public transport is hopeless, with only two buses a day. That is why many teenagers move to the city. Still, I love visiting because the air is clean and everybody is kind."}, {"type": "sp", "ctx": "Getting lost", "s": "Tell me about a time when you got lost while travelling. Where were you going, what went wrong and how did you find the way?", "vi": "Hãy kể về lần bạn bị lạc khi đi du lịch. Bạn đi đâu, chuyện gì sai và bạn tìm đường thế nào?", "words": ["get lost", "on my way to", "go via", "turning", "take the wrong turning", "ask someone the way", "direct", "follow signs to"], "why": "Kể theo thứ tự: đi đâu, sai ở đâu, ai giúp, kết thúc và bài học.", "sample": "Last year I got lost in the mountains on my way to a lake. We decided to go via a small village, but my cousin took the wrong turning after a bridge. The satnav stopped working, so we had to ask someone the way. A kind farmer directed us to the right road and told us to follow signs to the lake. We found the correct turning ten minutes later. We arrived late, but the view was amazing. Now I always carry a paper map as a backup."}, {"type": "sp", "ctx": "Modern life debate", "s": "Some people say that city life is more stressful than village life. Do you agree? Think about work, transport and mental health.", "vi": "Có người nói cuộc sống thành phố căng thẳng hơn nông thôn. Bạn có đồng ý không? Hãy nghĩ về công việc, giao thông và sức khỏe tinh thần.", "words": ["likely", "be likely to", "depression", "anxiety disorders", "politician", "hopeless"], "why": "Nêu quan điểm, so sánh hai nơi ở 2 khía cạnh, đưa ví dụ và đề xuất giải pháp.", "sample": "I partly agree. City workers are more likely to feel stressed because of long hours and heavy traffic. It is likely that stress leads to depression or anxiety disorders if people do not rest. In villages, however, public transport can be hopeless, which creates other problems. I think a good politician should invest in transport and parks in both places. Governments should also support mental health services. Personally, I would choose a medium-sized town, where people are less likely to feel lonely and can still find good jobs."}]}]};
  const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  /* ---------- prepare ---------- */
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ALL=[];
  SECTIONS.forEach(sec=>sec.qs.forEach((q,i)=>{q.id=sec.id+'q'+(i+1);q.sec=sec.id;q.n=i+1;if(q.type==='mc')q.opts=shuffle(q.o);ALL.push(q);}));
  const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));
  const STATQ=ALL.filter(q=>q.type!=='sp');

  const KEY=DATA.meta.storageKey||'drill-v1';
  let state={};
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
  const isRight=(q,v)=>q.type==='mc'?v===q.a:q.acc.some(x=>norm(x)===norm(v));

  const hintsOpen=new Set();
  let current=SECTIONS[0].id;
  const $=id=>document.getElementById(id);

  /* ---------- listening (browser speech synthesis) ---------- */
  const CAN_SPEAK=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
  let voice=null;
  /* Fallback voice: prefer natural / neural US English voices when the audio files cannot be played. */
  function pickVoice(){
    if(!CAN_SPEAK)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/aria|jenny|ava|andrew|guy|samantha|google us/i.test(v.name)?2:0)+(v.localService?0:1);
    voice=vs.sort((a,b)=>score(b)-score(a))[0]||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang))||null;
  }
  if(CAN_SPEAK){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
  let audio=null;
  let cur=null; /* what is playing now: {id, kind:'audio'|'tts', paused} */
  function updateControls(){
    document.querySelectorAll('[data-pause]').forEach(b=>{
      const active=!!cur&&cur.id===b.dataset.pause;
      b.disabled=!active;
      const paused=active&&cur.paused;
      b.querySelector('span').textContent=paused?'Tiếp tục':'Tạm dừng';
      b.querySelector('.i-pause').hidden=paused;
      b.querySelector('.i-play').hidden=!paused;
      b.classList.toggle('on',paused);
    });
  }
  function stopAudio(){
    if(audio){audio.onended=audio.onerror=audio.onplaying=null;audio.pause();audio=null;}
    if(CAN_SPEAK)speechSynthesis.cancel();
    cur=null;
    document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
    updateControls();
  }
  function togglePause(id){
    if(!cur||cur.id!==id)return;
    if(cur.kind==='audio'&&audio){
      if(audio.paused){audio.play();cur.paused=false;}else{audio.pause();cur.paused=true;}
    }else if(cur.kind==='tts'&&CAN_SPEAK){
      if(speechSynthesis.paused){speechSynthesis.resume();cur.paused=false;}else{speechSynthesis.pause();cur.paused=true;}
    }
    updateControls();
  }
  function speakFallback(id,done,slow,btn){
    if(!CAN_SPEAK){cur=null;updateControls();return;}
    const q=byId[id];
    const text=q.type==='sp'?q.s:(q.listen?q.s.replace('___',q.a||'')+'':q.s.includes('___')?q.s.replace('___',done?q.a:'blank'):(done?q.s+' '+q.a:q.s)).replace(/\b(\d{1,2})\.(\d{2})\b/g,'$1:$2');
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang;}
    u.rate=slow?0.65:0.95;
    cur={id,kind:'tts',paused:false};
    u.onstart=()=>{btn&&btn.classList.add('on');updateControls();};
    u.onend=u.onerror=()=>{btn&&btn.classList.remove('on');if(cur&&cur.kind==='tts'&&cur.id===id)cur=null;updateControls();};
    speechSynthesis.speak(u);
    updateControls();
  }
  function speak(id,slow,btn){
    stopAudio();
    const done=!!state[id];
    const suffix=(slow?'s':'')+(done?(slow?'':'f'):'b');
    const a=new Audio('audio/'+id+'_'+suffix+'.mp3'+(DATA.meta.audioVersion?'?v='+DATA.meta.audioVersion:''));

         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
