:root{

  }
}
:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

.fb.bad .tag{color:var(--bad)}

.vi{color:var(--muted);font-size:14px}
.retry{align-self:flex-start}
.wordline{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wordline b{font-size:16px}
.wordline .ipa{color:var(--muted);font-size:15px}
.wordline .say{padding:4px 12px 4px 8px}
.newwords{color:var(--ink);font-size:14px}
.newwords span{white-space:normal}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hinttext{font-size:14px;color:var(--muted)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--primary)}
.say:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.say:disabled{opacity:.45;cursor:default}
.say svg[hidden]{display:none}
.say.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.say.on svg{color:var(--primary-ink)}
.listen .hint{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:8px}
.empty-state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
@media (max-width:480px){.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

i": "lau nhà"}]}, {"type": "mc", "ctx": "Home improvement", "s": "It's cheaper to buy ___ with a pattern for one wall only, rather than covering the entire room in decorative designs.", "o": ["wall tiles", "floor mats", "door keys"], "a": "wall tiles", "vi": "Mua gạch ốp tường có hoa văn chỉ cho một bức tường thì rẻ hơn là ốp cả phòng bằng hoa văn trang trí.", "why": "wall tiles = gạch ốp tường.", "tw": "wall tiles", "ipa": "/taɪl/", "new": [{"w": "pattern", "vi": "hoa văn"}]}, {"type": "mc", "ctx": "Cosy flat", "s": "The couple saved for months to buy a ___ in the front room, which became everyone's favourite place for naps and conversations.", "o": ["big soft sofa", "hard wooden stool", "small plastic chair"], "a": "big soft sofa", "vi": "Cặp đôi tiết kiệm nhiều tháng để mua một chiếc sofa lớn mềm cho phòng trước, nơi thành chỗ yêu thích để ngủ trưa và trò chuyện.", "why": "a big soft sofa = ghế sofa lớn và mềm (tính từ kích cỡ trước, chất liệu sau).", "tw": "a big soft sofa", "new": [{"w": "naps", "vi": "giấc ngủ ngắn"}]}, {"type": "mc", "ctx": "Doctor's advice", "s": "Physiotherapists often recommend a ___ armchair for people recovering from injury, since it makes it much easier to stand up again.", "o": ["firm", "fluffy", "transparent"], "a": "firm", "vi": "Nhà vật lý trị liệu thường khuyên dùng ghế bành chắc cho người đang hồi phục chấn thương vì dễ đứng dậy hơn nhiều.", "why": "firm = chắc, cứng vừa phải (không mềm lún); a firm armchair = ghế bành chắc.", "tw": "a firm armchair", "new": [{"w": "physiotherapists", "vi": "nhà vật lý trị liệu"}]}, {"type": "mc", "ctx": "Homeware", "s": "She bought several ___ in orange and yellow, hoping that they would brighten up the plain grey furniture in her flat.", "o": ["sofa cushions", "kitchen knives", "bath towels"], "a": "sofa cushions", "vi": "Cô mua vài chiếc gối sofa màu cam và vàng hy vọng làm bừng sáng đồ nội thất xám nhạt trong căn hộ.", "why": "sofa cushions = gối/đệm tựa trên sofa.", "tw": "sofa cushions", "new": [{"w": "brighten up", "vi": "làm tươi sáng"}]}, {"type": "mc", "ctx": "Decor", "s": "The interior designer advised placing ___ on the floor in the middle of the room to separate the sitting area from the dining space.", "o": ["a rug", "a mirror", "a shelf"], "a": "a rug", "vi": "Nhà thiết kế nội thất khuyên đặt một tấm thảm trên sàn giữa phòng để tách khu ngồi với khu ăn.", "why": "a rug on the floor = tấm thảm nhỏ đặt trên sàn.", "tw": "a rug on the floor", "new": [{"w": "separate", "vi": "tách"}]}, {"type": "mc", "ctx": "Flat viewing", "s": "The agent explained that every bedroom is a ___ room, whereas the kitchen and bathroom have tiles because they get wet.", "o": ["carpeted", "mirrored", "painted"], "a": "carpeted", "vi": "Người môi giới giải thích mọi phòng ngủ đều trải thảm, trong khi bếp và phòng tắm lát gạch vì dễ bị ướt.", "why": "carpeted = được trải thảm; a carpeted room = phòng trải thảm kín sàn.", "tw": "a carpeted room", "new": [{"w": "whereas", "vi": "trong khi"}]}, {"type": "mc", "ctx": "Hospital", "s": "After the blood test, the doctor said that the patient's tired eyes and yellow skin were signs of ___, so treatment started immediately.", "o": ["hepatitis", "asthma", "a broken leg"], "a": "hepatitis", "vi": "Sau xét nghiệm máu, bác sĩ nói mắt mệt và da vàng của bệnh nhân là dấu hiệu viêm gan nên điều trị bắt đầu ngay.", "why": "hepatitis = viêm gan (bệnh của gan, do virus hoặc rượu).", "tw": "hepatitis", "ipa": "/ˌhep.əˈtaɪ.t̬əs/", "new": [{"w": "signs", "vi": "dấu hiệu"}]}, {"type": "mc", "ctx": "Airport", "s": "The security officer asked me to open my ___ because the scanner had noticed a metal bottle hidden beneath my spare jumper.", "o": ["rucksack", "fridge", "curtain"], "a": "rucksack", "vi": "Nhân viên an ninh yêu cầu tôi mở ba lô vì máy quét phát hiện chai kim loại giấu dưới chiếc áo len dự phòng.", "why": "rucksack = ba lô lớn đi bộ đường dài/du lịch (Anh-Anh).", "tw": "rucksack", "ipa": "/ˈrʌk.sæk/", "new": [{"w": "jumper", "vi": "áo len"}]}, {"type": "mc", "ctx": "Seaside restaurant", "s": "The chef's special today is grilled ___ with garlic, a fish with a strong flavour that goes perfectly with fresh tomatoes.", "o": ["mackerel", "strawberry", "chicken breast"], "a": "mackerel", "vi": "Món đặc biệt hôm nay của đầu bếp là cá thu nướng tỏi, loại cá có vị đậm hợp hoàn hảo với cà chua tươi.", "why": "mackerel = cá thu (cá biển giàu dầu, nhiều omega-3).", "tw": "mackerel", "ipa": "/ˈmækrəl/", "new": [{"w": "flavour", "vi": "hương vị"}]}, {"type": "mc", "ctx": "Party menu", "s": "As a starter, we offered cold ___ with mayonnaise, followed by grilled fish and a salad for those who prefer lighter dishes.", "o": ["prawns", "peaches", "mushrooms"], "a": "prawns", "vi": "Món khai vị, chúng tôi phục vụ tôm lạnh với sốt mayonnaise, tiếp theo là cá nướng và salad cho ai thích món nhẹ hơn.", "why": "prawn = tôm (Anh-Anh); Anh-Mỹ thường dùng shrimp.", "tw": "prawn", "ipa": "/prɔːn/", "new": [{"w": "starter", "vi": "món khai vị"}]}, {"type": "mc", "ctx": "Seafood market", "s": "The stall sold fresh fish, crabs and ___, which are small shellfish that people usually cook in soup or with butter.", "o": ["mussels", "carrots", "noodles"], "a": "mussels", "vi": "Quầy bán cá tươi, cua và vẹm, là loài hải sản có vỏ nhỏ mà người ta thường nấu súp hoặc nấu với bơ.", "why": "mussel = vẹm, con trai biển (nấu súp, hấp).", "tw": "mussel", "ipa": "/ˈmʌs.əl/", "new": [{"w": "shellfish", "vi": "hải sản có vỏ"}]}, {"type": "mc", "ctx": "Seafood platter", "s": "Our platter included oysters, grilled ___ with garlic butter and slices of salmon, so everyone could try something different.", "o": ["scallops", "bananas", "sausages"], "a": "scallops", "vi": "Đĩa hải sản của chúng tôi gồm hàu, sò điệp nướng bơ tỏi và vài lát cá hồi để mọi người thử món khác nhau.", "why": "scallop = sò điệp (vỏ hình quạt, thịt trắng ngọt).", "tw": "scallop", "ipa": "/ˈskæləp/", "new": [{"w": "platter", "vi": "đĩa lớn"}]}, {"type": "mc", "ctx": "Supermarket", "s": "We made a shopping list to be sure that we would have all the ___ for the dinner party, rather than running back to the shop.", "o": ["ingredients", "furniture", "tickets"], "a": "ingredients", "vi": "Chúng tôi lập danh sách mua sắm để chắc là có đủ nguyên liệu cho bữa tiệc thay vì chạy lại cửa hàng.", "why": "have all the (right) ingredients = có đủ nguyên liệu cần thiết.", "tw": "have all the ingredients", "ipa": "/hæv ɔːl ðə raɪt ɪnˈɡriːdiənts/", "new": [{"w": "shopping list", "vi": "danh sách mua sắm"}]}, {"type": "mc", "ctx": "Contestant", "s": "The young woman in the cooking contest is exceptionally ___ at cooking seafood, which is why the judges gave her the highest score.", "o": ["good", "fond", "interested"], "a": "good", "vi": "Cô gái trẻ trong cuộc thi nấu ăn đặc biệt giỏi nấu hải sản nên ban giám khảo cho cô điểm cao nhất.", "why": "be good at + V-ing / danh từ = giỏi việc gì.", "tw": "be good at cooking (something)", "ipa": "/bi ɡʊd æt ˈkʊkɪŋ/", "new": [{"w": "exceptionally", "vi": "đặc biệt"}, {"w": "contest", "vi": "cuộc thi"}]}, {"type": "mc", "ctx": "Engineering", "s": "The engineers must come ___ a cheaper solution before next month, otherwise the company will cancel the whole project.", "o": ["up with", "down with", "out of"], "a": "up with", "vi": "Các kỹ sư phải nghĩ ra giải pháp rẻ hơn trước tháng sau, nếu không công ty sẽ hủy toàn bộ dự án.", "why": "come up with st = nghĩ ra, nảy ra (ý tưởng, kế hoạch, giải pháp).", "tw": "come up with", "new": [{"w": "solution", "vi": "giải pháp"}]}, {"type": "mc", "ctx": "Postcard", "s": "We spent the weekend in the countryside, where the green hills and quiet lakes made the ___ look like a painting.", "o": ["scenery", "traffic", "rubbish"], "a": "scenery", "vi": "Chúng tôi dành cuối tuần ở vùng quê nơi những ngọn đồi xanh và hồ yên tĩnh khiến phong cảnh trông như tranh.", "why": "scenery = phong cảnh thiên nhiên (không đếm được: some scenery, beautiful scenery).", "tw": "scenery", "ipa": "/ˈsiː.nər.i/", "new": [{"w": "rubbish", "vi": "rác"}]}, {"type": "mc", "ctx": "Interview", "s": "She doesn't ___ a farm herself, but she rents land from a neighbour and sells vegetables at the weekend market.", "o": ["own", "build", "visit"], "a": "own", "vi": "Cô không sở hữu trang trại nhưng thuê đất của hàng xóm và bán rau ở chợ cuối tuần.", "why": "own a farm = sở hữu trang trại; khác work on a farm = làm việc ở trang trại.", "tw": "own a farm", "ipa": "/əʊn ə fɑːm/", "new": [{"w": "rents", "vi": "thuê"}]}, {"type": "mc", "ctx": "Farm school", "s": "Students who want to ___ animals on a farm must learn how to feed them, clean their sheds and notice early signs of illness.", "o": ["keep", "borrow", "paint"], "a": "keep", "vi": "Học viên muốn nuôi động vật ở trang trại phải học cách cho ăn, dọn chuồng và nhận ra dấu hiệu bệnh sớm.", "why": "keep animals = nuôi động vật (trang trại, gia súc, gia cầm).", "tw": "keep animals", "ipa": "/kiːp ˈæn.ɪ.məlz/", "new": [{"w": "sheds", "vi": "chuồng, nhà kho"}]}, {"type": "mc", "ctx": "Climate change", "s": "Because of unusual floods, many villagers were unable to ___ crops last year, and food prices in the market rose sharply.", "o": ["grow", "drive", "cook"], "a": "grow", "vi": "Vì lũ bất thường, nhiều dân làng không thể trồng trọt năm ngoái và giá lương thực ngoài chợ tăng mạnh.", "why": "grow crops = trồng cây nông nghiệp (lúa, ngô, lúa mì...).", "tw": "grow crops", "ipa": "/ɡrəʊ krɒps/", "new": [{"w": "floods", "vi": "lũ lụt"}, {"w": "sharply", "vi": "mạnh"}]}, {"type": "mc", "ctx": "Village life", "s": "After the harvest, the villagers stored the corn ___ in large barns so that it would stay dry until winter.", "o": ["crop", "tool", "ceremony"], "a": "crop", "vi": "Sau thu hoạch, dân làng cất vụ ngô trong kho lớn để giữ khô đến mùa đông.", "why": "crop = cây trồng/vụ mùa (rice is an important crop).", "tw": "crop", "ipa": "/krɒp/", "new": [{"w": "barns", "vi": "kho thóc"}]}, {"type": "mc", "ctx": "Food science", "s": "People with a gluten allergy must avoid products made from ___, such as pasta, ordinary bread and many types of biscuits.", "o": ["wheat", "rice", "potatoes"], "a": "wheat", "vi": "Người dị ứng gluten phải tránh sản phẩm làm từ lúa mì như mì ống, bánh mì thường và nhiều loại bánh quy.", "why": "wheat = lúa mì (làm bột mì, bánh mì).", "tw": "wheat", "ipa": "/wiːt/", "new": [{"w": "gluten", "vi": "gluten"}]}, {"type": "mc", "ctx": "Farm", "s": "On this farm, they grow wheat for flour and ___ for animal feed, because the second crop survives better in poor soil.", "o": ["barley", "coffee", "sugar"], "a": "barley", "vi": "Ở trang trại này, họ trồng lúa mì làm bột và lúa mạch làm thức ăn gia súc vì loại thứ hai sống tốt hơn ở đất xấu.", "why": "barley = lúa mạch (làm bia, súp, thức ăn gia súc).", "tw": "barley", "ipa": "/ˈbɑː.li/", "new": [{"w": "feed", "vi": "thức ăn chăn nuôi"}]}, {"type": "mc", "ctx": "Village", "s": "His family has been in ___ for generations, so he learned how to plant rice and repair tools before he could read.", "o": ["farming", "banking", "fashion"], "a": "farming", "vi": "Gia đình anh làm nghề nông qua nhiều thế hệ nên anh biết cấy lúa và sửa dụng cụ trước khi biết đọc.", "why": "farming = nghề nông, canh tác (organic farming).", "tw": "farming", "ipa": "/ˈfɑː.mɪŋ/", "new": [{"w": "generations", "vi": "các thế hệ"}]}, {"type": "mc", "ctx": "Early riser", "s": "Lan is always ___ at six, even on Sundays, and she jogs around the lake before most of the city has woken up.", "o": ["up at", "out of", "on at"], "a": "up at", "vi": "Lan luôn dậy lúc sáu giờ, kể cả Chủ nhật, và chạy bộ quanh hồ trước khi đa số thành phố tỉnh giấc.", "why": "be up at + giờ = đã thức dậy vào giờ đó.", "tw": "be up at", "ipa": "/bi ʌp ət/", "new": [{"w": "jogs", "vi": "chạy bộ"}]}, {"type": "mc", "ctx": "Fishermen", "s": "The fishing boats usually stay out at sea ___ sunset, then return to the harbour with the day's catch.", "o": ["until", "since", "during"], "a": "until", "vi": "Thuyền đánh cá thường ở ngoài biển cho đến khi mặt trời lặn rồi quay về cảng với mẻ cá trong ngày.", "why": "until sunset = cho đến lúc mặt trời lặn.", "tw": "until sunset", "ipa": "/ənˈtɪl ˈsʌn.set/", "new": [{"w": "harbour", "vi": "bến cảng"}, {"w": "catch", "vi": "mẻ cá"}]}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Online shopping", "s": "A pop-up message says, \"Hurry! This offer will run out in two hours.\" Shoppers who miss the deadline will have to pay the full price. What does \"run out\" mean?", "o": ["Hết hạn", "Được giảm giá thêm", "Bị hủy bỏ hoàn toàn"], "a": "Hết hạn", "vi": "Một thông báo hiện lên: \"Nhanh lên! Ưu đãi này sẽ hết hạn sau hai giờ.\" Người mua bỏ lỡ hạn chót sẽ phải trả giá đầy đủ. \"run out\" có nghĩa là gì?", "why": "run out = hết hạn (hợp đồng, hộ chiếu, ưu đãi); khác với run out of = cạn kiệt.", "noblank": true, "say": "A pop-up message says, \"Hurry! This offer will run out in two hours.\" Shoppers who miss the deadline will have to pay the full price.", "tw": "run out", "new": [{"w": "deadline", "vi": "hạn chót"}]}, {"type": "mc", "ctx": "Orientation week", "s": "At university, orientation week is designed to help freshmen get to know each other. It includes tours, quizzes and a welcome party in the evening. What does \"get to know each other\" mean?", "o": ["Tìm hiểu nhau", "Cạnh tranh với nhau", "Giúp đỡ nhau học bài"], "a": "Tìm hiểu nhau", "vi": "Ở đại học, tuần định hướng giúp tân sinh viên làm quen nhau. Có các chuyến tham quan, câu đố và tiệc chào mừng vào buổi tối. \"get to know each other\" có nghĩa là gì?", "why": "get to know each other = dần hiểu nhau hơn qua thời gian tiếp xúc.", "noblank": true, "say": "At university, orientation week is designed to help freshmen get to know each other. It includes tours, quizzes and a welcome party in the evening.", "tw": "get to know each other", "new": [{"w": "orientation", "vi": "định hướng"}, {"w": "freshmen", "vi": "sinh viên năm nhất"}]}, {"type": "mc", "ctx": "Wedding speech", "s": "\"We met at university ten years ago, when neither of us knew anyone, and we've been mates ever since.\" The groom smiled at his best man as the guests applauded. What does \"we've been mates ever since\" mean?", "o": ["Chúng tôi đã là bạn bè kể từ đó đến nay", "Chúng tôi mới quen nhau gần đây", "Chúng tôi đã cãi nhau từ đó đến giờ"], "a": "Chúng tôi đã là bạn bè kể từ đó đến nay", "vi": "\"Chúng tôi gặp nhau ở đại học mười năm trước, khi cả hai không quen ai, và đã là bạn bè từ đó đến nay.\" Chú rể mỉm cười với phù rể trong khi khách mời vỗ tay. \"we've been mates ever since\" có nghĩa là gì?", "why": "we've been mates ever since = (chúng tôi) là bạn thân từ đó đến giờ; mates = bạn (Anh-Anh).", "noblank": true, "say": "\"We met at university ten years ago, when neither of us knew anyone, and we've been mates ever since.\" The groom smiled at his best man as the guests applauded.", "tw": "we've been mates ever since", "new": [{"w": "groom", "vi": "chú rể"}, {"w": "best man", "vi": "phù rể"}, {"w": "applauded", "vi": "vỗ tay"}]}, {"type": "mc", "ctx": "Health article", "s": "Doctors recommend reviewing your current medication regularly, because some medicines stop being necessary as your health improves. Always ask your pharmacist before you change anything. What does \"current\" mean?", "o": ["Hiện tại, đang dùng", "Trước đây", "Sắp tới trong tương lai"], "a": "Hiện tại, đang dùng", "vi": "Bác sĩ khuyên nên xem xét thuốc đang dùng thường xuyên vì một số thuốc không còn cần thiết khi sức khỏe tốt lên. Hãy luôn hỏi dược sĩ trước khi thay đổi. \"current\" có nghĩa là gì?", "why": "current = hiện tại, đang diễn ra (current job, current situation, current price).", "noblank": true, "say": "Doctors recommend reviewing your current medication regularly, because some medicines stop being necessary as your health improves. Always ask your pharmacist before you change a   const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  /* ---------- prepare ---------- */
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ALL=[];

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();

  const CAN_SPEAK=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
  let voice=null;
  /* Fallback voice: prefer natural / neural US English voices when the audio files cannot be played. */
  function pickVoice(){

    const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/aria|jenny|ava|andrew|guy|samantha|google us/i.test(v.name)?2:0)+(v.localService?0:1);

  }
  if(CAN_SPEAK){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
  let audio=null;
  let cur=null; /* what is playing now: {id, kind:'audio'|'tts', paused} */
  function updateControls(){

    if(audio){audio.onended=audio.onerror=audio.onplaying=null;audio.pause();audio=null;}

  function speakFallback(id,done,slow,btn){

    const q=byId[id];
    const text=(q.listen?q.s.replace('___',q.a||'')+'':q.s.includes('___')?q.s.replace('___',done?q.a:'blank'):(done?q.s+' '+q.a:q.s)).replace(/\b(\d{1,2})\.(\d{2})\b/g,'$1:$2');

  function speak(id,slow,btn){
    stopAudio();

    a.onended=()=>{btn&&btn.classList.remove('on');if(audio===a){audio=null;cur=null;}updateControls();};

  /* ---------- single word pronunciation (audio/w_<slug>.mp3, browser voice as fallback) ---------- */
  const slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  function playWord(text,btn){
    stopAudio();

  /* ---------- render ---------- */
  function cardHTML(q){

    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;

    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
