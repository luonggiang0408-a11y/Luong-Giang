.sent{font-size:18px;line-height:1.7;margin:0;text-wrap:pretty}
.slot{display:inline-block;min-width:4.5ch;padding:0 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);font-weight:600;text-align:center;vertical-align:baseline}

 advised to stay in the ___ on the motorway, so fast cars can overtake them safely.", "o": ["car park", "inside lane", "bus stop"], "a": "inside lane", "vi": "Xe tải thường được khuyên đi làn trong trên đường cao tốc để xe nhanh có thể vượt chúng an toàn.", "why": "inside lane = làn trong, làn chạy chậm (làn bên trái ở Anh).", "new": [{"w": "advised", "vi": "được khuyên"}], "tw": "inside lane", "ipa": "/ˌɪnsaɪd ˈsləʊ leɪn/"}, {"type": "mc", "ctx": "Lane discipline", "s": "Drivers who stay in the ___ for too long without overtaking can annoy others, because it is reserved for faster traffic.", "o": ["outside lane", "inside lane", "cycle path"], "a": "outside lane", "vi": "Tài xế ở lì trong làn ngoài quá lâu mà không vượt có thể làm người khác khó chịu vì làn này dành cho xe chạy nhanh.", "why": "outside lane = làn ngoài, làn vượt/chạy nhanh.", "new": [{"w": "reserved", "vi": "dành riêng"}], "tw": "outside lane", "ipa": "/ˌaʊtsaɪd ˈfɑːst leɪn/"}, {"type": "mc", "ctx": "Emergency", "s": "The ambulance could not get through the crowded high street, so it took a ___ that was just wide enough.", "o": ["motorway", "roundabout", "side road"], "a": "side road", "vi": "Xe cứu thương không qua được phố chính đông đúc nên đã đi một đường nhánh vừa đủ rộng.", "why": "side road = đường nhỏ rẽ ra từ đường chính.", "new": [{"w": "crowded", "vi": "đông đúc"}], "tw": "side road", "ipa": "/ˈsaɪd rəʊd/"}, {"type": "mc", "ctx": "Old town", "s": "If you don't pay attention to the road signs in the old town, you will certainly ___ among its narrow streets.", "o": ["get dressed", "get lost", "get married"], "a": "get lost", "vi": "Nếu không để ý biển báo ở khu phố cổ, bạn chắc chắn sẽ bị lạc giữa những con phố hẹp.", "why": "get lost = bị lạc đường.", "new": [{"w": "certainly", "vi": "chắc chắn"}], "tw": "get lost", "ipa": "/ˌɡet ˈlɒst/"}, {"type": "mc", "ctx": "Car trouble", "s": "My car broke down ___ the airport, so I called a taxi and arrived just in time for the check-in.", "o": ["on my way to", "at the top of", "in spite of"], "a": "on my way to", "vi": "Xe tôi hỏng trên đường tới sân bay nên tôi gọi taxi và đến vừa kịp làm thủ tục.", "why": "on my way to + nơi chốn = trên đường tới đó.", "new": [{"w": "broke down", "vi": "bị hỏng"}, {"w": "check-in", "vi": "làm thủ tục"}], "tw": "on my way to", "ipa": "/ɒn maɪ weɪ tə/"}, {"type": "mc", "ctx": "Road trip", "s": "To reach the coast, we can either take the old road or ___ the mountain pass, which is longer but much more beautiful.", "o": ["go against", "go without", "go via"], "a": "go via", "vi": "Để ra bờ biển, ta có thể đi đường cũ hoặc đi qua đèo, dài hơn nhưng đẹp hơn nhiều.", "why": "go via + nơi = đi qua / ghé qua nơi đó trên đường.", "new": [{"w": "coast", "vi": "bờ biển"}], "tw": "go via", "ipa": "/ˈvaɪə/"}, {"type": "mc", "ctx": "Finding a shop", "s": "The bakery is down the second ___ on the left, just before the post office and the small park.", "o": ["lesson", "turning", "chapter"], "a": "turning", "vi": "Tiệm bánh nằm ở ngã rẽ thứ hai bên trái, ngay trước bưu điện và công viên nhỏ.", "why": "turning = chỗ rẽ, ngã rẽ ra khỏi đường đang đi.", "new": [{"w": "just before", "vi": "ngay trước"}], "tw": "turning", "ipa": "/ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Roundabout", "s": "If you ___ at the roundabout, you will arrive at the factory instead of the city.", "o": ["take the wrong turning", "take a short break", "take a long shower"], "a": "take the wrong turning", "vi": "Nếu bạn rẽ nhầm đường ở vòng xuyến, bạn sẽ tới nhà máy thay vì thành phố.", "why": "take the wrong turning = rẽ nhầm đường.", "new": [{"w": "roundabout", "vi": "vòng xuyến"}], "tw": "take the wrong turning", "ipa": "/teɪk ðə rɒŋ ˈtɜːnɪŋ/"}, {"type": "mc", "ctx": "Planning a route", "s": "If you don't plan your route carefully, you might ___ in a place that has no hotels at all.", "o": ["look up", "give up", "end up"], "a": "end up", "vi": "Nếu không lên lộ trình cẩn thận, rốt cuộc bạn có thể ở một nơi chẳng có khách sạn nà  ra.", "new": [{"w": "crashes", "vi": "bị sập"}], "tw": "in case"}, {"type": "mc", "ctx": "Borrowing", "s": "You may borrow my laptop ___ you return it before Friday and do not install any new programs.", "o": ["provided that", "because", "even though"], "a": "provided that", "vi": "Bạn có thể mượn laptop của tôi với điều kiện trả lại trước thứ Sáu và không cài chương trình mới.", "why": "provided that = với điều kiện là (trang trọng hơn as long as).", "new": [{"w": "install", "vi": "cài đặt"}], "tw": "provided that"}, {"type": "mc", "ctx": "Holiday plans", "s": "Our trip will be wonderful ___ the weather stays dry, because we have no tickets for indoor activities.", "o": ["as well as", "as far as", "as long as"], "a": "as long as", "vi": "Chuyến đi sẽ tuyệt vời miễn là thời tiết khô ráo vì chúng tôi không có vé cho hoạt động trong nhà.", "why": "as long as = miễn là, với điều kiện là.", "new": [{"w": "indoor", "vi": "trong nhà"}], "tw": "as long as"}]}, {"id": "s3", "title": "Chọn nghĩa", "note": "Đọc đoạn ngắn rồi chọn nghĩa tiếng Việt đúng của từ được hỏi.", "qs": [{"type": "mc", "ctx": "Reading", "s": "After missing the last train, Tom had no money for a taxi. He felt panicked, so he decided to run all the way home, and he arrived exhausted but safe. What does \"run all the way home\" mean?", "o": ["đi bộ thong thả về nhà", "bắt taxi về nhà rồi nghỉ ngơi", "chạy một mạch về nhà, không dừng lại"], "a": "chạy một mạch về nhà, không dừng lại", "vi": "Sau khi lỡ chuyến tàu cuối, Tom không có tiền đi taxi. Anh hoảng hốt nên quyết định chạy một mạch về nhà và về đến nơi trong tình trạng kiệt sức nhưng an toàn.", "why": "run all the way home = chạy liền một mạch về nhà, không dừng lại giữa đường.", "noblank": true, "say": "After missing the last train, Tom had no money for a taxi. He felt panicked, so he decided to run all the way home, and he arrived exhausted but safe.", "new": [{"w": "panicked", "vi": "hoảng hốt"}, {"w": "exhausted", "vi": "kiệt sức"}], "tw": "run a ối xay"}, {"w": "pointed", "vi": "chỉ tay"}], "tw": "ask somebody the way", "ipa": "/ɑːsk ðə weɪ/"}, {"type": "mc", "ctx": "Reading", "s": "The officer directed the lost tourists to the main square, which was only two streets away. He drew a small map on a piece of paper to make it easier. What does \"directed\" mean in this text?", "o": ["đưa tiền cho", "cấm đi vào", "chỉ đường cho (ai) đến nơi nào"], "a": "chỉ đường cho (ai) đến nơi nào", "vi": "Viên cảnh sát chỉ đường cho đoàn du khách bị lạc tới quảng trường chính, chỉ cách hai con phố. Anh vẽ một bản đồ nhỏ lên mảnh giấy cho dễ hiểu hơn.", "why": "direct somebody to somewhere = chỉ đường cho ai tới đâu.", "noblank": true, "say": "The officer directed the lost tourists to the main square, which was only two streets away. He drew a small map on a piece of paper to make it easier.", "new": [{"w": "square", "vi": "quảng trường"}], "tw": "direct", "ipa": "/dəˈrekt/"}, {"type": "mc", "ctx": "Reading", "s": "The guide told us to follow the signs for the waterfall. Half an hour later, we heard the sound of water, so we knew we were close. What does \"follow the signs for\" mean?", "o": ["đọc báo", "đi theo biển chỉ dẫn tới", "vẽ biển chỉ dẫn mới"], "a": "đi theo biển chỉ dẫn tới", "vi": "Hướng dẫn viên bảo chúng tôi đi theo biển chỉ dẫn tới thác nước. Nửa giờ sau chúng tôi nghe tiếng nước nên biết đã gần tới.", "why": "follow the signs for + nơi = đi theo biển chỉ dẫn tới nơi đó.", "noblank": true, "say": "The guide told us to follow the signs for the waterfall. Half an hour later, we heard the sound of water, so we knew we were close.", "new": [{"w": "waterfall", "vi": "thác nước"}], "tw": "follow signs for", "ipa": "/ˈfɒləʊ saɪnz fə/"}, {"type": "mc", "ctx": "Reading", "s": "Mia always packs a spare charger in her bag in case her phone dies during a long journey. Last week, this simple habit saved her from missing an important call. What does \"in case\" mean?", "o": ["phòng khi (có chuyện xảy ra)", "ngay khi", "mặc dù"], "a": "phòng khi (có chuyện xảy ra)", "vi": "Mia luôn để một cục sạc dự phòng trong túi phòng khi điện thoại hết pin trong hành trình dài. Tuần trước thói quen đơn giản này giúp cô không bỏ lỡ một cuộc gọi quan trọng.", "why": "in case + mệnh đề = phòng khi điều gì xảy ra.", "noblank": true, "say": "Mia always packs a spare charger in her bag in case her phone dies during a long journey. Last week, this simple habit saved her from missing an important call.", "new": [{"w": "spare", "vi": "dự phòng"}], "tw": "in case"}, {"type": "mc", "ctx": "Reading", "s": "The company promised to hire all the trainees provided that they pass the final test. Several of them are nervous, because the exam is said to be very difficult. What does \"provided that\" mean?", "o": ["mặc dù", "cho đến khi", "với điều kiện là"], "a": "với điều kiện là", "vi": "Công ty hứa sẽ tuyển tất cả thực tập sinh với điều kiện họ vượt qua bài kiểm tra cuối. Một số người lo lắng vì bài thi được cho là rất khó.", "why": "provided that = với điều kiện là (trang trọng hơn as long as).", "noblank": true, "say": "The company promised to hire all the trainees provided that they pass the final test. Several of them are nervous, because the exam is said to be very difficult.", "new": [{"w": "trainees", "vi": "thực tập sinh"}], "tw": "provided that"}, {"type": "mc", "ctx": "Reading", "s": "Parents are happy to let teenagers go out in the evening as long as they come home before eleven and send a message to say where they are. What does \"as long as\" mean?", "o": ["giống như", "miễn là, với điều kiện là", "ngay khi"], "a": "miễn là, với điều kiện là", "vi": "Bố mẹ vui lòng cho thiếu niên ra ngoài buổi tối miễn là các em về trước mười một giờ và nhắn tin cho biết mình ở đâu.", "why": "as long as = miễn là, với điều kiện là.", "noblank": true, "say": "Parents are happy to let teenagers go out in the evening as long as they come home before eleven and send a message to say where they are.", "new": [{"w": "teenagers", "vi": "thiếu niên"}], "tw": "as long as"}]}, {"id": "s4", "title": "Nói vận dụng", "note": "Bấm ghi âm và trả lời bằng tiếng Anh, cố dùng các từ gợi ý; trang sẽ chấm ước tính 4 tiêu chí.", "qs": [{"type": "sp", "ctx": "Animals and insects", "s": "Tell me about a time when an animal or an insect frightened you. What happened, and how did you react?", "vi": "Hãy kể về một lần con vật hoặc côn trùng làm bạn sợ. Chuyện gì đã xảy ra và bạn phản ứng thế nào?", "words": ["paw", "beehive", "sting", "stick", "buzz off", "run all the way home", "swing"], "why": "Kể theo thứ tự: bạn ở đâu, con vật xuất hiện thế nào, bạn làm gì (dùng thì quá khứ) và cảm xúc sau đó.", "sample": "When I was ten, I decided to stick a long branch into a beehive near my grandfather's garden, because I wanted to see the honey. The bees flew out immediately, and one of them managed to sting me on the arm. I shouted at the insects to buzz off, but of course they did not listen. In the end I had to run all the way home, still holding the branch, while my cousin laughed on the swing. Looking back, it was a silly idea, and even now I keep away from any paw-sized hole or nest in the ground."}, {"type": "sp", "ctx": "Anger and arguments", "s": "Describe a person you know who gets angry easily. How do other people deal with this behaviour?", "vi": "Hãy mô tả một người bạn biết hay nổi nóng. Những người khác đối phó với hành vi này thế nào?", "words": ["hot temper", "lose your temper", "slam the door shut", "smash", "don't bother me", "get someone into trouble"], "why": "Giới thiệu người đó, nêu một ví dụ cụ thể về lúc họ nổi giận, rồi nói mọi người phản ứng ra sao.", "sample": "My uncle has a hot temper, and everyone in the family knows it. Last month he tried hard not to lose your temper, but he lost his temper anyway when his neighbour parked in front of his gate. He shouted, slammed the door shut, and nearly smashed a plate on the floor. When he is upset, he usually says, don't bother me, and we leave him alone for an hour. We also try not to say anything that could get someone into trouble, because he reacts so strongly. Fortunately, he always apologises later and cooks dinner for us."}, {"type": "sp", "ctx": "Where you live", "s": "Do you live in a house or in an apartment? Describe your neighbourhood and say what facilities are missing there.", "vi": "Bạn sống trong nhà riêng hay chung cư? Hãy mô tả khu bạn sống và nói thiếu những tiện ích nào.", "words": ["a block of flats", "an apartment building", "away", "you don't get many"], "why": "Nói loại nhà bạn ở, vị trí, khoảng cách tới nơi quan trọng (be + khoảng cách + away) và điều còn thiếu.", "sample": "I live on the sixth floor of an apartment building in a quiet part of the city. In my country many people call this kind of place a block of flats, and it is very common among young families. The metro station is about two kilometres away, so I usually take a bus. The area is pleasant, but you don't get many parks or playgrounds around here, which is a pity for children. Although the rent is high, I like the neighbours, and the view of the river in the evening is wonderful."}, {"type": "sp", "ctx": "Food and health", "s": "Talk about a healthy meal you like to cook. What ingredients do you need, and what conditions make it worth eating?", "vi": "Hãy nói về một bữa ăn lành mạnh bạn thích nấu. Bạn cần nguyên liệu gì và điều kiện nào khiến nó đáng ăn?", "words": ["asparagus", "provided that", "as long as", "in case"], "why": "Nêu món ăn, nguyên liệu, cách nấu ngắn gọn rồi nêu điều kiện bằng provided that, as long as, in case.", "sample": "One of my favourite healthy meals is grilled salmon with asparagus. The dish is easy to prepare, provided that the fish is fresh and you do not cook it for too long. I usually add a little lemon and olive oil, and I serve it with brown rice. As long as I eat it with plenty of vegetables, I feel full but not heavy. I also buy extra ingredients in case some friends come over unexpectedly. Besides, it takes less than thirty minutes, which suits my busy schedule."}, {"type": "sp", "ctx": "Roads in your city", "s": "Describe a road or a junction in your city that is difficult for drivers. Why is it a problem?", "vi": "Hãy mô tả một con đường hoặc ngã giao khó đi ở thành phố bạn. Vì sao nó là vấn đề?", "words": ["junction", "a bend in the road", "bend", "side road", "pedestrian crossing", "crosswalk", "crossing the road"], "why": "Nói vị trí, đặc điểm (khúc cua, ngã giao, người sang đường) và hậu quả hoặc giải pháp bạn đề nghị.", "sample": "There is a dangerous junction near my old school where three streets meet. Just after a bend in the road, the traffic lights are hidden behind some trees, so drivers do not see them until the last moment. The road also bends sharply to the right, and many motorbikes use a side road to avoid the queue. In my view, the city should paint a clear pedestrian crossing, or crosswalk as Americans say, because children are crossing the road there every morning. Until something changes, I think accidents will continue."}, {"type": "sp", "ctx": "Driving rules", "s": "Do you think drivers in your country follow the rules? Talk about speed limits, overtaking and the lanes on a motorway.", "vi": "Bạn có nghĩ tài xế ở nước bạn tuân thủ luật không? Hãy nói về giới hạn tốc độ, vượt xe và làn đường cao tốc.", "words": ["speed limit", "overtake", "no overtaking", "road sign", "motorway", "inside lane", "outside lane"], "why": "Nêu quan điểm, đưa ví dụ về vi phạm phổ biến và đề xuất cách cải thiện (dùng although, as a result).", "sample": "In my opinion, many drivers ignore the rules, especially on the motorway. The speed limit is clearly shown on every road sign, but some people drive much faster. Others stay in the outside lane for no reason, although it is meant for those who overtake. Slow vehicles should use the inside lane, as a result, traffic would flow better. I have also seen drivers overtake lorries where a no overtaking sign is obvious, which is extremely dangerous. Stricter fines and more cameras would probably help."}, {"type": "sp", "ctx": "Travel mistakes", "s": "Tell me about a time you got lost while travelling. How did you find your way in the end?", "vi": "Hãy kể về lần bạn bị lạc khi đi du lịch. Cuối cùng bạn tìm đường như thế nào?", "words": ["get lost", "take the wrong turning", "end up", "turning", "ask somebody the way", "direct", "follow signs for"], "why": "Kể theo thứ tự thời gian: nơi đến, sai lầm, cảm giác, người giúp đỡ và kết quả.", "sample": "Last summer I rented a car in the countryside and tried to find a lake my friends had recommended. I took the wrong turning at a small village, and soon we started to get lost. After an hour we ended up in a field full of cows. Finally I decided to ask a farmer the way, and he directed us back to the main road. At the next turning we began to follow signs for the lake, and we arrived before sunset. It was stressful, but it became our funniest memory."}, {"type": "sp", "ctx": "Making plans", "s": "Describe a trip you plan to take in the near future. How will you get there, and what will you prepare?", "vi": "Hãy mô tả một chuyến đi bạn dự định trong tương lai gần. Bạn sẽ đến đó bằng cách nào và chuẩn bị gì?", "words": ["on my way to", "go via", "away", "in case", "as long as"], "why": "Nêu điểm đến, đường đi (go via), khoảng cách (away) và những thứ chuẩn bị phòng khi (in case).", "sample": "Next month I am going to visit my grandparents, who live in a small town about three hundred kilometres away. I will go via Da Nang, because I want to see an old friend there. On my way to the bus station, I will buy some fruit as a gift. I will also pack a raincoat and a spare charger in case the weather turns bad or my phone dies. The journey should be enjoyable as long as the roads are not blocked by floods."}, {"type": "sp", "ctx": "Road safety", "s": "How can parents teach young children to be safe near the road? Give some practical advice.", "vi": "Cha mẹ có thể dạy trẻ nhỏ an toàn khi ở gần đường như thế nào? Hãy đưa ra lời khuyên thực tế.", "words": ["crossing the road", "pedestrian crossing", "crosswalk", "speed limit", "road sign", "in case"], "why": "Nêu 2–3 lời khuyên, mỗi lời khuyên kèm lý do hoặc ví dụ; dùng should / must / it is important to.", "sample": "First, parents should explain that crossing the road is only safe at a pedestrian crossing or a crosswalk, where drivers are expected to stop. It is also important to teach children to look at each road sign, because pictures are easier to remember than words. Parents must hold their child's hand even if the speed limit is low, since small kids move unpredictably. Finally, they should practise the route to school several times, in case the child ever has to walk alone. Patience and repetition really make a difference."}, {"type": "sp", "ctx": "Childhood memory", "s": "Tell me about a memorable event from your childhood that involved playing outdoors and a small mistake.", "vi": "Hãy kể về một sự kiện đáng nhớ thời thơ ấu khi chơi ngoài trời và một lỗi nhỏ.", "words": ["swing", "smash", "run all the way home", "slam the door shut", "get someone into trouble", "end up"], "why": "Mở đầu bằng thời gian và địa điểm, kể điều đã xảy ra, hậu quả và bài học bằng thì quá khứ.", "sample": "When I was eight, I was playing on a swing in the park with my younger brother. We threw a ball too hard and managed to smash a neighbour's window by accident. Terrified, we decided to run all the way home, and I slammed the door shut behind us. Then I realised that my brother could get someone into trouble, namely me, because I was the older one. In the end we ended up apologising and paying for the glass with our pocket money. Since then, I have always been careful near windows."}]}]};
  const SECTIONS=DATA.sections;
  SECTIONS.forEach(sec=>sec.qs.forEach(q=>{if(q.type==='tx'&&!q.acc)q.acc=[q.a];if(q.type==='tx'&&!q.a)q.a=q.acc[0];}));

  const ALL=[];

  const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));

  const KEY=DATA.meta.storageKey||'drill-v1';

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
  const isRight=(q,v)=>q.type==='mc'?v===q.a:q.acc.some(x=>norm(x)===norm(v));

  const hintsOpen=new Set();

  /* ---------- listening (browser speech synthesis) ---------- */
  const CAN_SPEAK=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function';
  let voice=null;
  /* Fallback voice: prefer natural / neural US English voices when the audio files cannot be played. */
  function pickVoice(){
    if(!CAN_SPEAK)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/aria|jenny|ava|andrew|guy|samantha|google us/i.test(v.name)?2:0)+(v.localService?0:1);
    voice=vs.sort((a,b)=>score(b)-score(a))[0]||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang))||null;
  }
  if(CAN_SPEAK){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
  let audio=null;
  let cur=null; /* what is playing now: {id, kind:'audio'|'tts', paused} */
  function updateControls(){
    document.querySelectorAll('[data-pause]').forEach(b=>{
      const active=!!cur&&cur.id===b.dataset.pause;
      b.disabled=!active;
      const paused=active&&cur.paused;
      b.querySelector('span').textContent=paused?'Tiếp tục':'Tạm dừng';
      b.querySelector('.i-pause').hidden=paused;
      b.querySelector('.i-play').hidden=!paused;
      b.classList.toggle('on',paused);
    });
  }
  function stopAudio(){
    if(audio){audio.onended=audio.onerror=audio.onplaying=null;audio.pause();audio=null;}
    if(CAN_SPEAK)speechSynthesis.cancel();
    cur=null;
    document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
    updateControls();

  function togglePause(id){
    if(!cur||cur.id!==id)return;
    if(cur.kind==='audio'&&audio){

    }else if(cur.kind==='tts'&&CAN_SPEAK){
      if(speechSynthesis.paused){speechSynthesis.resume();cur.paused=false;}else{speechSynthesis.pause();cur.paused=true;}
    }
    updateControls();
  }
  function speakFallback(id,done,slow,btn){
    if(!CAN_SPEAK){cur=null;updateControls();return;}
    const q=byId[id];
    const text=q.type==='sp'?q.s:(q.listen?q.s.replace('___',q.a||'')+'':q.s.includes('___')?q.s.replace('___',done?q.a:'blank'):(done?q.s+' '+q.a:q.s)).replace(/\b(\d{1,2})\.(\d{2})\b/g,'$1:$2');
    const u=new SpeechSynthesisUtterance(text);

      fb=`<div class="fb ${cls}" role="status"><span class="tag">${st.c?'Đúng':'Chưa đúng'}</span>`+
         (st.c?'':`Đáp án: <b>${esc(q.a)}</b>`)+
         (q.tw?`<p class="wordline"><b>${esc(q.tw)}</b>${q.ipa?`<span class="ipa">${esc(q.ipa)}</span>`:''}<button type="button" class="say" data-word="${esc(q.tw)}" aria-label="Phát âm ${esc(q.tw)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Phát âm</button></p>`:'')+`<p>${esc(q.why)}</p><p class="vi">${esc(q.vi)}</p>${(q.new&&q.new.length)?`<p class="newwords"><b>Từ mới trong câu:</b> ${q.new.map(n=>`<span><b>${esc(n.w)}</b> = ${esc(n.vi)}</span>`).join('; ')}</p>`:''}</div>`+
         (!st.c?`<button type="button" class="ghost retry" data-retry="${q.id}">Thử lại câu này</button>`:'');
    }
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
    const listen=true?`<div class="listen"><button type="button" class="say" data-say="${q.id}" aria-label="Nghe câu ${q.n}">${icon}Nghe</button><button type="button" class="say" data-say="${q.id}" data-slow="1" aria-label="Nghe chậm câu ${q.n}">${icon}Nghe chậm</button><button type="button" class="say pausebtn" data-pause="${q.id}" aria-label="Tạm dừng câu ${q.n}" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg><span>Tạm dừng</span></button><span class="hint">${done?'Đọc nguyên câu':'Chỗ trống đọc là "blank"'}</span></div>`:'';
    return `<article class="q" id="card-${q.id}"><div class="qh"><span class="qn">${q.n}</span><span class="ctx">${esc(q.ctx)}</span></div><p class="sent">${sentence}</p>${body}${fb}${listen}</article>`;
  }

  function counts(list){
    let a=0,c=0;list.forEach(q=>{const s=state[q.id];if(s){a++;if(s.c)c++;}});return {a,c,t:list.length};
  }

  function renderTabs(){
    const wrongCount=STATQ.filter(q=>state[q.id]&&!state[q.id].c).length;
    $('tabs').innerHTML=SECTIONS.map((s,i)=>{
      const k=counts(s.qs);
      return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${current===s.id}">${i+1}. ${esc(s.title)}<small>${k.a}/${k.t}</small></button>`;
    }).join('')+`<button class="tab" role="tab" type="button" data-tab="wrong" aria-selected="${current==='wrong'}">Câu cần ôn<small>${wrongCount}</small></button>`;
  }

  function renderStats(){
    const k=counts(STATQ);
    const pct=Math.round(k.a/k.t*100);
    $('pfill').style.width=pct+'%';
    $('pbar').setAttribute('aria-valuenow',pct);
    $('pnum').innerHTML=`Đã làm <b>${k.a}</b>/${k.t} · Đúng <b>${k.c}</b>`+(k.a?` (${Math.round(k.c/k.a*100)}%)`:'');
  }

  function renderView(){
    let html='';
    if(current==='wrong'){
      const list=STATQ.filter(q=>state[q.id]&&!state[q.id].c);
      html=`<div class="note"><h2>Câu cần ôn</h2><p>Các câu bạn trả lời chưa đúng, từ mọi phần. Bấm "Thử lại câu này" để làm lại ngay tại đây.</p></div>`;
      html+=list.length?list.map(cardHTML).join(''):`<div class="empty-state">Chưa có câu sai nào. Hãy làm thêm các phần khác, những câu chưa đúng sẽ xuất hiện ở đây.</div>`;
    }else{
      const s=SECTIONS.find(x=>x.id===current);
      const k=counts(s.qs);
      html=`<div class="note"><h2>${esc(s.title)}</h2><p>${s.note}</p></div>`+s.qs.map(cardHTML).join('')+
        `<div class="foot"><span class="num">Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}</span><button class="ghost" type="button" data-reset="${s.id}">Làm lại phần này</button></div>`;
    }
    $('view').innerHTML=html;
  }

  function renderAll(){renderTabs();renderStats();renderView();}

  function refreshCard(id){
    const el=$('card-'+id);
    if(el)el.outerHTML=cardHTML(byId[id]);
    renderTabs();renderStats();
    if(current!=='wrong')refreshFoot();
    updateControls();
  }
  function refreshFoot(){
    const s=SECTIONS.find(x=>x.id===current);if(!s)return;
    const k=counts(s.qs);
    const f=document.querySelector('.foot .num');
    if(f)f.innerHTML=`Phần này: đúng <b>${k.c}</b>/${k.t}${k.a<k.t?` · còn ${k.t-k.a} câu`:''}`;
  }

  function answer(id,v){
    const q=byId[id];
    if(state[id]||!String(v).trim())return;
    state[id]={v:String(v).trim(),c:isRight(q,v)};
    save();refreshCard(id);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.hint){const id=t.dataset.hint;hintsOpen.has(id)?hintsOpen.delete(id):hintsOpen.add(id);refreshCard(id);return;}
    if(t.dataset.rec){startRec(t.dataset.rec);return;}
    if(t.dataset.recstop){stopRec(t.dataset.recstop);return;}
    if(t.dataset.manual){manualEval(t.dataset.manual);return;}
    if(t.dataset.pause){togglePause(t.dataset.pause);return;}
    if(t.dataset.word){playWord(t.dataset.word,t);return;}
    if(t.dataset.say){speak(t.dataset.say,!!t.dataset.slow,t);return;}
    if(t.dataset.tab){stopAudio();current=t.dataset.tab;renderAll();window.scrollTo({top:0});return;}
    if(t.classList.contains('opt')){const oq=byId[t.dataset.q];if(oq&&!oq.noblank)playWord(t.dataset.v,t);answer(t.dataset.q,t.dataset.v);return;}
    if(t.dataset.check){const i=$('in-'+t.dataset.check);answer(t.dataset.check,i?i.value:'');return;}
    if(t.dataset.retry){delete state[t.dataset.retry];save();refreshCard(t.dataset.retry);const i=$('in-'+t.dataset.retry);if(i)i.focus();return;}
    if(t.dataset.reset){byId&&SECTIONS.find(s=>s.id===t.dataset.reset).qs.forEach(q=>delete state[q.id]);save();renderAll();return;}
    if(t.id==='resetAll'){
      if(t.dataset.armed){state={};save();renderAll();t.textContent='Làm lại từ đầu';delete t.dataset.armed;}
      else{t.dataset.armed='1';t.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(t.dataset.armed){delete t.dataset.armed;t.textContent='Làm lại từ đầu';}},3500);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();answer(e.target.dataset.q,e.target.value);}
  });

  renderAll();
})();
</script>
