name: Vocab audio (Emma)

# Mỗi khi danh sách từ hoặc bài đọc thay đổi: tạo thêm file mp3 giọng Emma còn thiếu rồi commit vào docs/vocab/audio.
# Nhờ vậy từ mới thêm và bài đọc mới tạo hằng ngày đều có giọng đọc giống nhau trên mọi thiết bị.
on:
  push:
    paths:
      - 'docs/vocab/data/words.json'
      - 'docs/vocab/data/reading/**'
      - 'tools/gen_vocab_audio.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocab-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts
      - name: Generate missing audio
        run: python tools/gen_vocab_audio.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs/vocab/audio
          if ! git diff --cached --quiet; then
            git commit -m "Vocab audio"
            git pull --rebase
            git push
          fi
