name: Tao am thanh Emma

on:
  push:
    branches: [main]
    paths: ['docs/index.html', 'lessons/**/index.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts
      - name: Publish every lesson under docs/<date>/ (audio generated when missing)
        run: |
          for L in lessons/*/; do
            N=$(basename "$L")
            mkdir -p "docs/$N"
            cp "${L}index.html" "docs/$N/index.html"
            if [ ! -d "docs/$N/audio" ] || [ -z "$(ls docs/$N/audio 2>/dev/null)" ]; then
              python skill/scripts/gen_audio.py "${L}content.json" --out-dir "docs/$N/audio" || true
              find "docs/$N/audio" -type f -size -2k -delete 2>/dev/null || true
            fi
            echo "$N: $(ls docs/$N/audio 2>/dev/null | wc -l) mp3"
          done
          LATEST=$(ls -d lessons/*/ | sort | tail -1 | xargs basename)
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=%s/"><a href="%s/">Bai tap moi nhat: %s</a>\n' "$LATEST" "$LATEST" "$LATEST" > docs/index.html
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "Dang bai tap theo ngay + am thanh Emma" && git push)
