name: Tao am thanh Emma

on:
  push:
    branches: [main]
    paths: ['docs/index.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts
      - name: Generate mp3 for the latest lesson
        run: |
          LESSON=$(ls -d lessons/*/ | sort | tail -1)
          echo "Lesson: $LESSON"
          python skill/scripts/gen_audio.py "${LESSON}content.json" || true
          find "${LESSON}audio" -type f -size -2k -delete
          COUNT=$(ls "${LESSON}audio" | wc -l)
          echo "mp3 files: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            rm -rf docs/audio
            cp -r "${LESSON}audio" docs/audio
          fi
      - name: Commit audio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "Them am thanh Emma" && git push)
